[project]
name = "dream-account-os"
version = "2.3.0"
description = "Read-only MEXC scanner and paper shadow engine"
requires-python = ">=3.11"
dependencies = ["websockets>=12,<16"]

[project.scripts]
dream-account = "dream_account.cli:main"
dream-account-runtime = "dream_account.runtime_service:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
