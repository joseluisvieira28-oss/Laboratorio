name: MEXC NVIDIA Listing Coverage V0.1.2

on:
  push:
    branches:
      - mexc-nvidia-equity-dislocation-v0.1-source-gate-2026-10-04
    paths:
      - 'research/mexc_global_assets/MEXC_NVIDIA_LISTING_COVERAGE_AMENDMENT_V0.1.2.md'
      - 'research/mexc_global_assets/mexc_nvidia_listing_coverage_v012.py'
      - '.github/workflows/mexc-nvidia-listing-coverage-v012.yml'

permissions:
  contents: read

jobs:
  listing-coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependency
        run: python -m pip install --disable-pip-version-check requests
      - name: Governance preflight
        run: |
          test "$GITHUB_REF_NAME" = "mexc-nvidia-equity-dislocation-v0.1-source-gate-2026-10-04"
          test -f research/mexc_global_assets/MEXC_NVIDIA_LISTING_COVERAGE_AMENDMENT_V0.1.2.md
          python -m py_compile research/mexc_global_assets/mexc_nvidia_listing_coverage_v012.py
          echo 'SOURCE COVERAGE ONLY / NO OUTCOMES'
      - name: Locate earliest usable MEXC NVIDIA cash-open history
        run: python research/mexc_global_assets/mexc_nvidia_listing_coverage_v012.py
      - name: Upload source evidence
        uses: actions/upload-artifact@v4
        with:
          name: mexc-nvidia-listing-v012-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/mexc_global_assets/nvidia_listing_coverage_v012
          if-no-files-found: error
          retention-days: 90
      - name: Governance closeout
        run: |
          echo 'NO RETURNS / NO BASIS / NO SIGNAL SCORING'
          echo 'NO PRIVATE ENDPOINTS / NO ACCOUNT READS'
          echo 'NO ORDERS / NO MUTATION / NO LIVE TRADING'
