name: BTC-CONVEX-001 causal 1H replay

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  causal-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run frozen causal 1H execution replay
        run: python labs/btc-convex-trend-capture-001/causal_1h_replay_v0_1.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: BTC-CONVEX-001-CAUSAL-1H-REPLAY
          path: labs/btc-convex-trend-capture-001/evidence/CAUSAL_1H_REPLAY_V0.1.json
