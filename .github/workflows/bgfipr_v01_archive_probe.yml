name: BGFIPR V0.1 Archive Probe

on:
  push:
    branches:
      - bitget-funding-interval-premium-replication-v0.1-source-2026-10-07
    paths:
      - research/bitget_funding_interval_premium_replication/archive_probe_v01.py
      - .github/workflows/bgfipr_v01_archive_probe.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4
      - run: python -m py_compile research/bitget_funding_interval_premium_replication/archive_probe_v01.py
      - run: python research/bitget_funding_interval_premium_replication/archive_probe_v01.py
      - uses: actions/upload-artifact@v4
        with:
          name: bgfipr-v01-archive-probe
          path: bgfipr_archive_probe.json
          retention-days: 7
