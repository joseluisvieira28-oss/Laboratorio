name: DLS Drift Jan-2023 Signed Semantics Calibration V0.1
on:
  push:
    branches: [dls-signed-flow-authority-v01]
    paths:
      - labs/DEFI_LIQUIDATION_SHOCK_001/LAUNCH_DRIFT_SIGNED_SEMANTICS_CAL_V01.marker
permissions:
  actions: read
  contents: read
jobs:
  calibrate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {ref: "${{ github.sha }}"}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Download canonical Drift Jan-2023 source partition
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 36264543005
          name: dls-field-enrichment-drift-drift-202301
          path: drift_source
      - name: Compile
        run: python -m py_compile labs/DEFI_LIQUIDATION_SHOCK_001/source/calibrate_drift_signed_semantics_v0_1.py
      - name: Execute source-only signed semantics calibration
        run: python labs/DEFI_LIQUIDATION_SHOCK_001/source/calibrate_drift_signed_semantics_v0_1.py
      - name: Upload immutable receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dls-drift-signed-semantics-cal-v01
          path: labs/DEFI_LIQUIDATION_SHOCK_001/DRIFT_JAN2023_SIGNED_FLOW_SEMANTICS_CALIBRATION_RECEIPT_V0.1.json
          if-no-files-found: warn
          retention-days: 90
      - name: Firewall
        if: always()
        run: echo SOURCE_ONLY_NO_PRICES_2025_2026_CLOSED_NO_TRADING
