name: WTI V18 Frozen Hyperliquid LeadLag

on:
  push:
    branches:
      - mexc-hl-wti-leadlag-v1.8-source-valid-window-2026-10-04
    paths:
      - 'research/mexc_global_assets/MEXC_HL_WTI_LEADLAG_RULE_V1.8.json'
      - 'research/mexc_global_assets/MEXC_HL_WTI_LEADLAG_FREEZE_V1.8.md'
      - 'research/mexc_global_assets/mexc_hl_wti_leadlag_v18.py'
      - '.github/workflows/wti-v18-hl-leadlag.yml'

permissions:
  contents: read

jobs:
  frozen-research:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install requests
        run: python -m pip install --disable-pip-version-check requests
      - name: Pre-outcome freeze check
        run: |
          test "$GITHUB_REF_NAME" = "mexc-hl-wti-leadlag-v1.8-source-valid-window-2026-10-04"
          python -m py_compile research/mexc_global_assets/mexc_hl_wti_leadlag_v18.py
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          p=Path('research/mexc_global_assets/MEXC_HL_WTI_LEADLAG_RULE_V1.8.json')
          x=json.loads(p.read_text())
          assert x['source_binding']=='HYPERLIQUID_WTI_SOURCE_PASS__XYZ_CL'
          assert x['outcomes_opened_at_freeze']==0
          assert x['source_boundary_only_successor'] is True
          assert x['signal_mode']=='FOLLOW_HL_UNDERREACTION'
          assert x['shock_thresholds_bps']==[5,10,20,40]
          assert x['lag_gap_thresholds_bps']==[2,5,10,20]
          assert x['horizons_min']==[1,2,5,15]
          assert x['entry_proxy']=='MEXC_NEXT_MINUTE_OPEN'
          assert x['windows']['discovery_start']=='2026-10-01T00:15:00Z'
          assert x['windows']['discovery_end']=='2026-10-03T00:00:00Z'
          assert x['windows']['oos_start']=='2026-10-03T00:00:00Z'
          assert x['windows']['oos_end']=='2026-10-04T09:00:00Z'
          assert x['parameter_rescue_authorized'] is False
          assert x['live_trading_authorized'] is False
          print('RULE_SHA256='+hashlib.sha256(p.read_bytes()).hexdigest())
          print('PRE_OUTCOME_FREEZE_PASS')
          PY
      - name: Execute frozen source-valid study
        run: python research/mexc_global_assets/mexc_hl_wti_leadlag_v18.py
      - name: Upload immutable evidence
        uses: actions/upload-artifact@v4
        with:
          name: wti-v18-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/mexc_global_assets/mexc_hl_wti_leadlag_v18
          if-no-files-found: error
          retention-days: 90
