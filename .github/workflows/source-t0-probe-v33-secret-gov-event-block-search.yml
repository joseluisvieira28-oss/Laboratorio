name: source-t0-probe-v33-secret-gov-event-block-search
# rerun-sequential: 2026-10-07-v2

on:
  workflow_dispatch:
  push:
    branches:
      - cosmos-native-emission-param-shock-001-v0.2-t0-remediation-2026-10-07
    paths:
      - .github/workflows/source-t0-probe-v33-secret-gov-event-block-search.yml

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cosmos-native-emission-param-shock-001-v0.2-t0-remediation-2026-10-07
      - name: Search indexed governance EndBlock event for Proposal 287
        shell: bash
        run: |
          python3 - <<'PY'
          import json,urllib.request,urllib.error,urllib.parse,ssl,hashlib,os,datetime,re

          TARGET="2023-12-07T02:54:58.930543213Z"
          OUT="research/cosmos_native_emission_param_shock_001_v0_2/SCRT287_GOV_EVENT_BLOCK_SEARCH_V33.json"
          UA={"User-Agent":"CryptoLab-source-only-secret-v33","Accept":"application/json"}
          bases=[
            ("mario-archive","https://rpc.archive.scrt.marionode.com"),
            ("ankr-http","https://rpc.ankr.com/http/scrt"),
            ("ankr-public","https://scrt.public-rpc.com"),
            ("lavenderfive","https://secretnetwork-rpc.lavenderfive.com:443"),
            ("secretsaturn","https://rpc.mainnet.secretsaturn.net"),
            ("whispernode","https://rpc-secret.whispernode.com:443"),
            ("1rpc","https://1rpc.io/scrt-rpc"),
            ("01node","https://rpc-secret.01node.com"),
            ("highstakes","https://secretnetwork-rpc.highstakes.ch:26657"),
            ("stakewolle","https://public.stakewolle.com/cosmos/secretnetwork/rpc"),
            ("cosmos-directory","https://rpc.cosmos.directory/secretnetwork"),
          ]

          queries=[
            "active_proposal.proposal_id='287'",
            "active_proposal.proposal_id='287' AND active_proposal.proposal_result='proposal_passed'",
          ]

          def req(url,method="GET",payload=None,to=18):
            headers=dict(UA); data=None
            if payload is not None:
              data=json.dumps(payload).encode();headers["Content-Type"]="application/json"
            q=urllib.request.Request(url,data=data,headers=headers,method=method)
            try:
              with urllib.request.urlopen(q,timeout=to,context=ssl._create_unverified_context()) as r:
                b=r.read()
                return {"ok":True,"status":getattr(r,"status",200),"url":r.geturl(),
                        "sha256":hashlib.sha256(b).hexdigest(),"body":b.decode("utf-8","replace")[:900000]}
            except urllib.error.HTTPError as e:
              try:b=e.read()
              except Exception:b=b""
              return {"ok":False,"status":e.code,"url":url,"error":str(e),
                      "sha256":hashlib.sha256(b).hexdigest() if b else None,
                      "body":b.decode("utf-8","replace")[:100000]}
            except Exception as e:return {"ok":False,"status":None,"url":url,"error":repr(e),"body":""}

          def walk(x):
            if isinstance(x,dict):
              yield x
              for v in x.values(): yield from walk(v)
            elif isinstance(x,list):
              for v in x: yield from walk(v)

          def blocks(body):
            try:d=json.loads(body)
            except:return []
            out=[]
            for x in walk(d):
              if not isinstance(x,dict): continue
              h=x.get("height"); t=x.get("time")
              if h is None or t is None: continue
              try:hh=int(h)
              except:continue
              if not re.match(r"\d{4}-\d{2}-\d{2}T",str(t)):continue
              rec={"height":hh,"time":str(t),"hash":x.get("hash")}
              if rec not in out:out.append(rec)
            return out

          rows=[]
          for name,base in bases:
            for qstr in queries:
              params=urllib.parse.urlencode({"query":qstr,"page":"1","per_page":"100","order_by":"asc"})
              r=req(base+"/block_search?"+params)
              rows.append({"provider":name,"base":base,"transport":"GET","query":qstr,
                           "ok":r["ok"],"status":r.get("status"),"blocks":blocks(r.get("body","")),
                           "sha256":r.get("sha256"),"error":r.get("error"),"body_excerpt":r.get("body","")[:12000]})
              payload={"jsonrpc":"2.0","id":1,"method":"block_search",
                       "params":{"query":qstr,"page":"1","per_page":"100","order_by":"asc"}}
              r=req(base,"POST",payload)
              rows.append({"provider":name,"base":base,"transport":"POST","query":qstr,
                           "ok":r["ok"],"status":r.get("status"),"blocks":blocks(r.get("body","")),
                           "sha256":r.get("sha256"),"error":r.get("error"),"body_excerpt":r.get("body","")[:12000]})

          hits=[]
          for r in rows:
            for b in r["blocks"]:
              if 11000000 <= b["height"] <= 13000000 and str(b["time"]).startswith("2023-"):
                hits.append({"provider":r["provider"],"base":r["base"],"transport":r["transport"],
                             "query":r["query"],"block":b,"response_sha256":r["sha256"],
                             "body_excerpt":r["body_excerpt"]})

          # Deduplicate exact block candidates.
          uniq={}
          for h in hits:
            key=(h["block"]["height"],h["block"]["time"])
            uniq.setdefault(key,h)
          candidates=list(uniq.values())

          # For each event hit, ask block_search itself for H-1/H/H+1 by block.height.
          verified=[]
          for c in candidates:
            H=c["block"]["height"];base=c["base"]; neigh=[]
            for hh in [H-1,H,H+1]:
              qstr=f"block.height={hh}"
              params=urllib.parse.urlencode({"query":qstr,"page":"1","per_page":"10","order_by":"asc"})
              r=req(base+"/block_search?"+params)
              bs=blocks(r.get("body",""))
              match=next((x for x in bs if x["height"]==hh),None)
              if not match:
                # Fallback to normal block endpoint solely after exact H is event-derived.
                rr=req(base+f"/block?height={hh}")
                bb=blocks(rr.get("body",""))
                match=next((x for x in bb if x["height"]==hh),None)
                r=rr
              neigh.append({"requested_height":hh,"header":match,"status":r.get("status"),
                            "sha256":r.get("sha256"),"error":r.get("error"),
                            "body_excerpt":r.get("body","")[:5000]})
            verified.append({"event_hit":c,"H_vote_end_block":H,
                             "T0_first_new_param_mint_block":H+1,
                             "neighbors":neigh})

          out={
            "scope":"SOURCE_ONLY_NO_MARKET_DATA",
            "target_voting_end":TARGET,
            "candidate":"COSMOS-NATIVE-EMISSION-PARAM-SHOCK-001 V0.2 / SCRT Proposal 287",
            "version_anchor":"scrtlabs/cosmos-sdk ea64f27dc58d",
            "code_event_proof":{
              "endblock_file":"x/gov/abci.go",
              "event_type":"active_proposal",
              "proposal_id_key":"proposal_id",
              "proposal_result_key":"proposal_result",
              "passed_value":"proposal_passed",
              "semantics":"EndBlock iterates active proposals whose voting end has passed current block time; successful handler emits active_proposal event with proposal_id and proposal_passed."
            },
            "tested_utc":datetime.datetime.now(datetime.timezone.utc).isoformat(),
            "queries":queries,"rows":rows,"event_hits":candidates,"verified_candidates":verified
          }
          os.makedirs(os.path.dirname(OUT),exist_ok=True)
          with open(OUT,"w") as f:json.dump(out,f,indent=2)
          print("SCRT287_V33_RESULT",json.dumps({
            "event_hits":[{"H":x["block"]["height"],"time":x["block"]["time"],"provider":x["provider"],"transport":x["transport"]} for x in candidates],
            "verified_count":len(verified)
          }))
          PY
      - name: Persist V33 receipt
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/cosmos_native_emission_param_shock_001_v0_2/SCRT287_GOV_EVENT_BLOCK_SEARCH_V33.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "SCRT287: persist governance event block-search probe v33"
          git pull --rebase origin cosmos-native-emission-param-shock-001-v0.2-t0-remediation-2026-10-07
          git push origin HEAD:cosmos-native-emission-param-shock-001-v0.2-t0-remediation-2026-10-07
