name: Radar Private Evidence Backup Runtime V0.2 QA

on:
  pull_request:
    branches:
      - crypto-edge-radar-postgres-v0.5
  push:
    branches:
      - radar-private-evidence-backup-runtime-v0.2

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crypto_edge_radar
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - run: python -m unittest tests.test_private_evidence_backup tests.test_private_backup_route_runtime_v02 -v
      - run: python -m unittest discover -s tests -v

# rerun-after-temporary-window-guard
