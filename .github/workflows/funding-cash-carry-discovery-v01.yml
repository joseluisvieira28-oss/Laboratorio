name: Funding Cash Carry Discovery V0.1
on:
  push:
    branches: [funding-cash-carry-v0.1]
    paths:
      - "labs/FUNDING_CASH_CARRY_001/DISCOVERY_PREFREEZE_V0.1.json"
      - "labs/FUNDING_CASH_CARRY_001/discovery_v01.py"
      - ".github/workflows/funding-cash-carry-discovery-v01.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install --disable-pip-version-check -q pandas numpy
      - name: Compile
        run: python -m py_compile labs/FUNDING_CASH_CARRY_001/discovery_v01.py
      - name: Run frozen source gate and Discovery
        run: python labs/FUNDING_CASH_CARRY_001/discovery_v01.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: FUNDING_CASH_CARRY_001_DISCOVERY_V0_1
          path: |
            fcc_coverage_receipt_v01.json
            fcc_discovery_receipt_v01.json
            fcc_discovery_trades_v01.csv
          if-no-files-found: warn
          retention-days: 30
