name: Diamond cbETH frozen evidence offline replay
on:
  push:
    branches: [research/diamond-cbeth-source-adjudication-2026-10-20]
    paths:
      - research/cbeth_redemption_basis_001/FINAL_CLOSEOUT_2026_10_20.md
      - research/cbeth_redemption_basis_001/verify_frozen_evidence.py
      - research/cbeth_redemption_basis_001/test_parent_firewall.py
permissions:
  contents: read
jobs:
  offline-replay:
    runs-on: ubuntu-22.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm install --no-save --package-lock=false ethers@6.15.0
      - run: node --test research/cbeth_redemption_basis_001/test_bounded_anchor.mjs
      - run: python research/cbeth_redemption_basis_001/test_parent_firewall.py
      - run: python research/cbeth_redemption_basis_001/verify_frozen_evidence.py
