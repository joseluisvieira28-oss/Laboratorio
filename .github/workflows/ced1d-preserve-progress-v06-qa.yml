name: CED1D Preserve Progress V0.6 QA

on:
  pull_request:
    branches:
      - crypto-edge-radar-postgres-v0.5
    paths:
      - "crypto_edge_radar/radar/ced1d_render_shadow_runtime.py"
      - "crypto_edge_radar/tests/test_ced1d_render_shadow_runtime.py"
      - "governance/CED1D_0031_PRESERVE_PROGRESS_WHILE_WAITING_V0.6_2026-09-27.md"
      - ".github/workflows/ced1d-preserve-progress-v06-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          cd crypto_edge_radar
          python -m pip install -e .

      - name: Compile
        run: |
          cd crypto_edge_radar
          python -m compileall radar tests

      - name: Targeted CED1D runtime tests
        run: |
          cd crypto_edge_radar
          python -m unittest -v tests.test_ced1d_render_shadow_runtime tests.test_diamond_board

      - name: Full deterministic Radar suite
        run: |
          cd crypto_edge_radar
          python -m unittest discover -s tests -v

      - name: Telemetry-only guard
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path("crypto_edge_radar/radar/ced1d_render_shadow_runtime.py").read_text()
          assert "progress_metrics_preserved" in p
          assert "progress_metrics_source_through_signal_day" in p
          assert "self.store.read_payloads(RECEIPT_EVENT)" in p
          for forbidden in (
              "BASE14",
              "STRESS20",
              "notional_per_leg_usdt =",
              "FIRST_SIGNAL_DAY =",
          ):
              assert forbidden not in p, forbidden
          print("CED1D_PRESERVE_PROGRESS_V06_GUARD_PASS")
          PY
