name: NVDA CrossVenue Source Gate V0.6

on:
  push:
    branches:
      - mexc-nvda-crossvenue-v0.6-source-gate-2026-10-04
    paths:
      - 'research/mexc_global_assets/NVDA_CROSSVENUE_SOURCE_GATE_V0.6.md'
      - 'research/mexc_global_assets/nvda_crossvenue_source_probe_v06.py'
      - '.github/workflows/nvda-crossvenue-source-gate-v06.yml'

permissions:
  contents: read

jobs:
  source-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependency
        run: python -m pip install --disable-pip-version-check requests

      - name: Governance preflight
        run: |
          test "$GITHUB_REF_NAME" = "mexc-nvda-crossvenue-v0.6-source-gate-2026-10-04"
          python -m py_compile research/mexc_global_assets/nvda_crossvenue_source_probe_v06.py
          grep -q 'SOURCE-ONLY' research/mexc_global_assets/NVDA_CROSSVENUE_SOURCE_GATE_V0.6.md
          grep -q 'OUTCOMES CLOSED' research/mexc_global_assets/NVDA_CROSSVENUE_SOURCE_GATE_V0.6.md
          echo 'NVDA_SOURCE_GATE_PREOUTCOME_PASS'

      - name: Execute public source gate
        run: python research/mexc_global_assets/nvda_crossvenue_source_probe_v06.py

      - name: Upload immutable source evidence
        uses: actions/upload-artifact@v4
        with:
          name: nvda-crossvenue-source-gate-v06-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/mexc_global_assets/nvda_source_gate_v06
          if-no-files-found: error
          retention-days: 90

      - name: Governance closeout
        run: |
          echo 'SOURCE ONLY'
          echo 'NO HISTORICAL OUTCOMES / NO LEAD-LAG SCORING'
          echo 'NO ACCOUNT / WALLET / PRIVATE ENDPOINT'
          echo 'NO ORDERS / NO MUTATION / NO LIVE TRADING'
