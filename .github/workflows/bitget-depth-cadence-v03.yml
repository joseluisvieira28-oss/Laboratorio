name: Bitget Depth Cadence Source Audit V0.3
on:
  push:
    branches: [bitget-depth-cadence-v0.3-source-audit-2026-10-05]
permissions: {contents: read}
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --disable-pip-version-check requests openpyxl
      - run: |
          test -f research/cross_venue_stock/BITGET_DEPTH_CADENCE_SOURCE_AUDIT_FREEZE_V0.3.md
          python research/cross_venue_stock/bitget_depth_cadence_source_audit_v03.py
      - uses: actions/upload-artifact@v4
        with:
          name: bitget-depth-cadence-v03-${{ github.run_id }}
          path: artifacts/cross_venue_stock/bitget_depth_cadence_v03
          if-no-files-found: error
          retention-days: 90
