name: MEXC Event Futures Payout Source V0.6

on:
  push:
    branches:
      - mexc-event-futures-payout-source-v0.6-2026-10-02
    paths:
      - 'research/mexc_event_futures/**'
      - '.github/workflows/mexc-event-futures-payout-source-v06.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  payout-source:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests playwright
          python -m playwright install --with-deps chromium

      - name: Static bundle reconnaissance
        run: python research/mexc_event_futures/payout_static_probe_v06.py

      - name: Read-only browser/network reconnaissance
        run: python research/mexc_event_futures/payout_browser_probe_v06.py

      - name: Verify fail-closed boundary
        shell: bash
        run: |
          python - <<'PY'
          import json
          p='artifacts/mexc_event_futures/payout_browser_probe_v06.json'
          j=json.load(open(p,encoding='utf-8'))
          print('SOURCE_GATE='+j['source_gate'])
          print('EXACT_DOM_PAYOUTS='+str(len(j.get('exact_dom_payouts',[]))))
          for x in j['assets']:
              print(x['display'], 'responses='+str(len(x.get('responses',[]))), 'ws='+str(len(x.get('websocket_frames',[]))))
          PY

      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: mexc-event-futures-payout-source-v06-evidence
          path: |
            artifacts/mexc_event_futures/payout_static_probe_v06.json
            artifacts/mexc_event_futures/payout_browser_probe_v06.json
          if-no-files-found: error
