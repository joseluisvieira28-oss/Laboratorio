name: DLS Save0c SQD Timeout Recovery V0.1

on:
  push:
    branches:
      - dls-marginfi-save0c-sqd-boundary-v01
    paths:
      - .github/workflows/dls-save0c-sqd-timeout-recovery-v01.yml

permissions:
  contents: read

jobs:
  recover:
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - start: '2022-02-01T00:00:00Z'
            end: '2022-02-08T00:00:00Z'
            id: s202202a
          - start: '2022-02-08T00:00:00Z'
            end: '2022-02-15T00:00:00Z'
            id: s202202b
          - start: '2022-02-15T00:00:00Z'
            end: '2022-02-22T00:00:00Z'
            id: s202202c
          - start: '2022-02-22T00:00:00Z'
            end: '2022-03-01T00:00:00Z'
            id: s202202d
          - start: '2024-10-01T00:00:00Z'
            end: '2024-10-08T00:00:00Z'
            id: s202410a
          - start: '2024-10-08T00:00:00Z'
            end: '2024-10-15T00:00:00Z'
            id: s202410b
          - start: '2024-10-15T00:00:00Z'
            end: '2024-10-22T00:00:00Z'
            id: s202410c
          - start: '2024-10-22T00:00:00Z'
            end: '2024-10-29T00:00:00Z'
            id: s202410d
          - start: '2024-10-29T00:00:00Z'
            end: '2024-11-01T00:00:00Z'
            id: s202410e
          - start: '2024-11-01T00:00:00Z'
            end: '2024-11-08T00:00:00Z'
            id: s202411a
          - start: '2024-11-08T00:00:00Z'
            end: '2024-11-15T00:00:00Z'
            id: s202411b
          - start: '2024-11-15T00:00:00Z'
            end: '2024-11-22T00:00:00Z'
            id: s202411c
          - start: '2024-11-22T00:00:00Z'
            end: '2024-11-29T00:00:00Z'
            id: s202411d
          - start: '2024-11-29T00:00:00Z'
            end: '2024-12-01T00:00:00Z'
            id: s202411e
          - start: '2024-12-01T00:00:00Z'
            end: '2024-12-08T00:00:00Z'
            id: s202412a
          - start: '2024-12-08T00:00:00Z'
            end: '2024-12-15T00:00:00Z'
            id: s202412b
          - start: '2024-12-15T00:00:00Z'
            end: '2024-12-22T00:00:00Z'
            id: s202412c
          - start: '2024-12-22T00:00:00Z'
            end: '2024-12-29T00:00:00Z'
            id: s202412d
          - start: '2024-12-29T00:00:00Z'
            end: '2025-01-01T00:00:00Z'
            id: s202412e
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 40d42e4ffdc85502d5965115a434c29fc08a6704
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile frozen original runner
        run: python -m py_compile labs/DEFI_LIQUIDATION_SHOCK_001/source/run_sqd_first_success_partition_v0_1.py
      - name: Run frozen replacement shard
        run: python labs/DEFI_LIQUIDATION_SHOCK_001/source/run_sqd_first_success_partition_v0_1.py --protocol "save0c" --start "${{ matrix.start }}" --end "${{ matrix.end }}" --out "recovery/${{ matrix.id }}.json"
      - name: Upload replacement evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dls-save0c-sqd-recovery-${{ matrix.id }}
          path: recovery/${{ matrix.id }}.json
          if-no-files-found: error
          retention-days: 30
      - name: Firewall
        if: always()
        run: echo SOURCE_ONLY_TRUE
