name: CCLM-001 V1 terminal settlement audit
on:
  push:
    branches: [crosschain-liquidity-migration-001-source-gate-v0.1]
    paths:
      - 'research/crosschain_liquidity_migration_001/cctp_v1_terminal_settlement_audit_v01.py'
      - '.github/workflows/cclm-001-cctp-v1-terminal-settlement-v01.yml'
      - 'research/crosschain_liquidity_migration_001/CCLM_TERMINAL_AUDIT_TRIGGER.txt'
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {ref: crosschain-liquidity-migration-001-source-gate-v0.1}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python research/crosschain_liquidity_migration_001/cctp_v1_terminal_settlement_audit_v01.py
      - name: Persist receipt
        run: |
          cp artifacts/cclm_cctp_v1_terminal_settlement_audit_v01.json research/crosschain_liquidity_migration_001/CCTP_V1_TERMINAL_SETTLEMENT_AUDIT_RECEIPT.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/crosschain_liquidity_migration_001/CCTP_V1_TERMINAL_SETTLEMENT_AUDIT_RECEIPT.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "CCLM-001: record V1 terminal settlement audit [skip ci]"
          git push origin HEAD:crosschain-liquidity-migration-001-source-gate-v0.1
      - uses: actions/upload-artifact@v4
        with:
          name: cclm-001-cctp-v1-terminal-settlement-v01
          path: artifacts/cclm_cctp_v1_terminal_settlement_audit_v01.json
          if-no-files-found: error
