name: source-t0-probe-v34-secret-snapshot-index

on:
  push:
    branches:
      - cosmos-native-emission-param-shock-001-v0.2-t0-remediation-2026-10-07
    paths:
      - .github/workflows/source-t0-probe-v34-secret-snapshot-index.yml

permissions:
  contents: write

jobs:
  snapshot-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cosmos-native-emission-param-shock-001-v0.2-t0-remediation-2026-10-07

      - name: Probe historical public snapshot/index routes
        run: |
          python - <<'PY'
          import json, urllib.request, urllib.error, hashlib, datetime, os, re
          from concurrent.futures import ThreadPoolExecutor

          OUT="research/cosmos_native_emission_param_shock_001_v0_2/SCRT287_SNAPSHOT_INDEX_PROBE_V34.json"
          UA={"User-Agent":"CryptoLab-source-only-secret-v34/1.0"}

          def get(url, timeout=18, method="GET"):
              try:
                  req=urllib.request.Request(url,headers=UA,method=method)
                  with urllib.request.urlopen(req,timeout=timeout) as r:
                      b=b"" if method=="HEAD" else r.read()
                      return {"ok":True,"status":getattr(r,"status",200),"url":url,
                              "content_length":r.headers.get("content-length"),
                              "last_modified":r.headers.get("last-modified"),
                              "etag":r.headers.get("etag"),
                              "content_type":r.headers.get("content-type"),
                              "sha256":hashlib.sha256(b).hexdigest() if b else None,
                              "body":b.decode("utf-8","replace")[:200000] if b else ""}
              except urllib.error.HTTPError as e:
                  try:b=e.read() if method!="HEAD" else b""
                  except Exception:b=b""
                  return {"ok":False,"status":e.code,"url":url,"error":str(e),
                          "content_length":e.headers.get("content-length") if e.headers else None,
                          "last_modified":e.headers.get("last-modified") if e.headers else None,
                          "etag":e.headers.get("etag") if e.headers else None,
                          "body":b.decode("utf-8","replace")[:30000]}
              except Exception as e:
                  return {"ok":False,"url":url,"error":repr(e)}

          base="https://snapshots.lavenderfive.com/snapshots/secretnetwork"
          index_urls=[
            base+"/",
            base+"/index.json",
            base+"/snapshots.json",
            base+"/manifest.json",
            base+"/latest.json",
            "https://snapshots.lavenderfive.com/",
          ]
          index_rows=[get(u,20) for u in index_urls]

          # Discovery-only candidate heights around Dec-2023. Never used as T0 evidence.
          # Broad sweep at 5k intervals around the likely 11.8-12.0M region, plus known historical anchor.
          hs=list(range(11800000,12050001,5000))
          hs += [11752974,18259769]
          hs=sorted(set(hs))
          candidates=[]
          jobs=[]
          with ThreadPoolExecutor(max_workers=32) as ex:
              for h in hs:
                  for ext in ("tar.zst","tar.lz4"):
                      u=f"{base}/secretnetwork_{h}.{ext}"
                      jobs.append((h,ext,ex.submit(get,u,12,"HEAD")))
              for h,ext,f in jobs:
                  r=f.result()
                  if r.get("ok") or r.get("status") not in (404,None):
                      candidates.append({"height":h,"ext":ext,**r})

          cdx_urls=[
            "https://web.archive.org/cdx/search/cdx?url=snapshots.lavenderfive.com/snapshots/secretnetwork/*&from=20231101&to=20240131&output=json&filter=statuscode:200&collapse=urlkey&limit=5000",
            "https://web.archive.org/cdx/search/cdx?url=snapshots.lavenderfive.com/snapshots/secretnetwork/secretnetwork_*&output=json&filter=statuscode:200&collapse=urlkey&limit=5000",
          ]
          cdx=[]
          for u in cdx_urls:
              r=get(u,30)
              capture_count=None
              filenames=[]
              try:
                  z=json.loads(r.get("body",""))
                  if isinstance(z,list):
                      capture_count=max(0,len(z)-1)
                      for row in z[1:]:
                          if isinstance(row,list) and len(row)>2:
                              orig=str(row[2])
                              m=re.search(r"secretnetwork_(\d+)\.tar\.(?:zst|lz4)",orig)
                              if m:filenames.append({"height":int(m.group(1)),"url":orig})
              except Exception:pass
              cdx.append({"url":u,"ok":r.get("ok"),"status":r.get("status"),
                          "capture_count":capture_count,"filenames":filenames[:1000],
                          "error":r.get("error"),"body_excerpt":r.get("body","")[:30000]})

          out={
            "scope":"SOURCE_ONLY_NO_MARKET_DATA",
            "scientific_rules_changed":False,
            "purpose":"Discover public historical Secret Network snapshot or archive objects that could expose blockstore metadata around SCRT Proposal 287.",
            "tested_utc":datetime.datetime.now(datetime.timezone.utc).isoformat(),
            "index_routes":index_rows,
            "non404_snapshot_candidates":candidates,
            "wayback_cdx":cdx,
            "verdict":"HISTORICAL_SNAPSHOT_OBJECT_DISCOVERED" if candidates or any(x.get("filenames") for x in cdx) else "NO_HISTORICAL_SNAPSHOT_OBJECT_DISCOVERED",
          }
          os.makedirs(os.path.dirname(OUT),exist_ok=True)
          with open(OUT,"w",encoding="utf-8") as f:json.dump(out,f,indent=2,ensure_ascii=False)
          print(json.dumps({
            "candidate_count":len(candidates),
            "cdx_filename_count":sum(len(x.get("filenames") or []) for x in cdx),
            "verdict":out["verdict"]
          },indent=2))
          PY

      - name: Persist snapshot/index receipt
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/cosmos_native_emission_param_shock_001_v0_2/SCRT287_SNAPSHOT_INDEX_PROBE_V34.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "SCRT287: persist snapshot index source probe v34"
          git push origin HEAD:cosmos-native-emission-param-shock-001-v0.2-t0-remediation-2026-10-07
