name: CD20 Rebalance V0.1 Market Source Preflight
on:
  push:
    branches: [coindesk20-rebalance-forced-flow-001-source-v0.1-2026-10-05]
    paths:
      - '.github/workflows/cd20_rebalance_v01_market_source.yml'
      - 'research/coindesk20_rebalance_forced_flow/v01_market_source_preflight.py'
permissions:
  contents: read
jobs:
  source_preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python research/coindesk20_rebalance_forced_flow/v01_market_source_preflight.py
