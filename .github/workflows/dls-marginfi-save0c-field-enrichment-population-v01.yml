        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ matrix.baseline_run }}
          pattern: ${{ matrix.baseline_pattern }}
          path: baseline
          merge-multiple: true

      - name: Compile source-only enrichment runner
        run: python -m py_compile labs/DEFI_LIQUIDATION_SHOCK_001/source/run_marginfi_save0c_field_enrichment_partition_v0_1.py

      - name: Re-query and exact-join canonical population
        run: >
