          --protocol "${{ matrix.protocol }}"
          --start "${{ matrix.start }}"
          --end "${{ matrix.end }}"
          --baseline baseline
          --partition-id "${{ matrix.id }}"
          --out "enrichment/${{ matrix.id }}.json"

      - name: Upload enrichment partition receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dls-field-enrichment-ms-${{ matrix.id }}
          path: enrichment/${{ matrix.id }}.json
          if-no-files-found: warn
          retention-days: 30

      - name: Firewall
        if: always()
        run: echo SOURCE_ONLY_TRUE

