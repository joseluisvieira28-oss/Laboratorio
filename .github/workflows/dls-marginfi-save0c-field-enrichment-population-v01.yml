          path: population_receipts
          merge-multiple: true

      - name: Compile aggregator
        run: python -m py_compile labs/DEFI_LIQUIDATION_SHOCK_001/source/aggregate_marginfi_save0c_field_enrichment_v0_1.py

      - name: Aggregate population field coverage
