name: Cross-Venue Funding Basis Provenance Shakedown V0.1

on:
  push:
    branches:
      - dream-account-phase-b-signal-research-v0.1
    paths:
      - 'Dream-Account-OS-v2.3-PARTIAL/research/cross_venue_funding_basis_provenance_shakedown_v01.py'
      - 'Dream-Account-OS-v2.3-PARTIAL/tests/test_cross_venue_funding_basis_provenance_shakedown_v01.py'
      - '.github/workflows/cross-venue-funding-basis-provenance-shakedown-v01.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  provenance-only:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run offline invariant tests first
        run: |
          cd Dream-Account-OS-v2.3-PARTIAL
          python -m pip install pytest
          python -m pytest -q tests/test_cross_venue_funding_basis_provenance_shakedown_v01.py

      - name: Compile provenance shakedown
        run: |
          cd Dream-Account-OS-v2.3-PARTIAL
          python -m py_compile research/cross_venue_funding_basis_provenance_shakedown_v01.py tests/test_cross_venue_funding_basis_provenance_shakedown_v01.py

      - name: Static guard against outcome analysis and mutation/auth paths
        run: |
          cd Dream-Account-OS-v2.3-PARTIAL
          python - <<'PY'
          import ast
          from pathlib import Path

          p = Path('research/cross_venue_funding_basis_provenance_shakedown_v01.py')
          tree = ast.parse(p.read_text(encoding='utf-8'))
          forbidden_names = {
              'mean', 'median', 'stdev', 'variance', 'corr', 'correlation',
              'sharpe', 'sortino', 'profit_factor', 'win_rate', 'expectancy',
          }
          hits = []
          for node in ast.walk(tree):
              if isinstance(node, ast.Name) and node.id.lower() in forbidden_names:
                  hits.append((node.id, node.lineno))
              if isinstance(node, ast.Attribute) and node.attr.lower() in {'put', 'patch', 'delete'}:
                  hits.append((node.attr, node.lineno))
          if hits:
              raise SystemExit(f'forbidden outcome/mutation primitives: {hits}')
          text = p.read_text(encoding='utf-8').lower()
          required_false_markers = ['carry_computed', 'apr_apy_computed', 'pnl_computed', 'signals_computed']
          for marker in required_false_markers:
              if marker not in text:
                  raise SystemExit(f'missing governance marker: {marker}')
          print('PASS: provenance script has no outcome-statistics or mutation primitives')
          PY

      - name: Run public read-only provenance shakedown through 2025 only
        env:
          PREFREEZE_PROVENANCE_RECEIPT: CROSS_VENUE_FUNDING_BASIS_PROVENANCE_SHAKEDOWN_V01_RECEIPT.json
        run: |
          cd Dream-Account-OS-v2.3-PARTIAL
          python research/cross_venue_funding_basis_provenance_shakedown_v01.py

      - name: Verify receipt remains outcome-blind and locked-2026-safe
        run: |
          cd Dream-Account-OS-v2.3-PARTIAL
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('CROSS_VENUE_FUNDING_BASIS_PROVENANCE_SHAKEDOWN_V01_RECEIPT.json')
          r = json.loads(p.read_text())
          assert r['classification'] == 'PROVENANCE_ONLY_NOT_ECONOMIC_DISCOVERY'
          assert r['status'] == 'PASS'
          assert r['locked_2026_accessed'] is False
          assert r['mexc_accessed'] is False
          assert r['authenticated_account_data_used'] is False
          assert r['exchange_mutation_used'] is False
          assert r['funding_rate_values_summarized'] is False
          assert r['carry_computed'] is False
          assert r['apr_apy_computed'] is False
          assert r['pnl_computed'] is False
          assert r['signals_computed'] is False
          assert r['audit_end_ms'] < r['locked_2026_start_ms']
          print('PASS: provenance-only receipt respects locked data and outcome boundary')
          PY

      - name: Upload provenance-only receipt
        uses: actions/upload-artifact@v4
        with:
          name: cross-venue-funding-basis-provenance-shakedown-v01-receipt
          path: Dream-Account-OS-v2.3-PARTIAL/CROSS_VENUE_FUNDING_BASIS_PROVENANCE_SHAKEDOWN_V01_RECEIPT.json
          if-no-files-found: error
          retention-days: 30
