name: Aave Gov LT Optimism Governance V14
on:
  push:
    branches: [aave-gov-lt-forced-deleveraging-v0.1]
    paths:
      - '.github/workflows/aave-gov-lt-optimism-governance-v14.yml'
      - 'research/aave_gov_lt_forced_deleveraging/optimism_governance_lineage_v14.py'
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pycryptodome==3.23.0
      - run: python research/aave_gov_lt_forced_deleveraging/optimism_governance_lineage_v14.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aave-gov-lt-optimism-governance-v14
          path: out/aave_optimism_gov_v14
          retention-days: 30
