name: source-t0-probe-v36-secret-express-historical-endpoint

on:
  workflow_dispatch:
  push:
    branches:
      - cosmos-native-emission-param-shock-001-v0.2-t0-remediation-2026-10-07
    paths:
      - .github/workflows/source-t0-probe-v36-secret-express-historical-endpoint.yml

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cosmos-native-emission-param-shock-001-v0.2-t0-remediation-2026-10-07
      - name: Probe historically configured Secret Express endpoints
        shell: bash
        run: |
          python3 - <<'PY'
          import json,urllib.request,urllib.error,urllib.parse,ssl,hashlib,os,datetime,re,socket

          TARGET="2023-12-07T02:54:58.930543213Z"
          OUT="research/cosmos_native_emission_param_shock_001_v0_2/SCRT287_SECRET_EXPRESS_HISTORICAL_ENDPOINT_V36.json"
          RPC="https://rpc.secret.express"
          LCD="https://lcd.secret.express"
          UA={"User-Agent":"CryptoLab-source-only-secret-v36","Accept":"application/json"}

          def get(u,headers=None,to=18):
            h=dict(UA);h.update(headers or {})
            try:
              q=urllib.request.Request(u,headers=h)
              with urllib.request.urlopen(q,timeout=to,context=ssl._create_unverified_context()) as r:
                b=r.read()
                return {"ok":True,"status":getattr(r,"status",200),"url":r.geturl(),
                        "headers":dict(r.headers),"sha256":hashlib.sha256(b).hexdigest(),
                        "body":b.decode("utf-8","replace")[:800000]}
            except urllib.error.HTTPError as e:
              try:b=e.read()
              except Exception:b=b""
              return {"ok":False,"status":e.code,"url":u,"headers":dict(e.headers or {}),"error":str(e),
                      "sha256":hashlib.sha256(b).hexdigest() if b else None,
                      "body":b.decode("utf-8","replace")[:80000]}
            except Exception as e:return {"ok":False,"status":None,"url":u,"headers":{},"error":repr(e),"body":""}

          dns={}
          for host in ["rpc.secret.express","lcd.secret.express","secret.express"]:
            try:dns[host]=socket.getaddrinfo(host,None)
            except Exception as e:dns[host]=repr(e)

          def walk(x):
            if isinstance(x,dict):
              yield x
              for v in x.values():yield from walk(v)
            elif isinstance(x,list):
              for v in x:yield from walk(v)

          def header(body,h=None):
            try:d=json.loads(body)
            except:return None
            for x in walk(d):
              hh=x.get("height");t=x.get("time")
              if hh is None or t is None:continue
              try:hh=int(hh)
              except:continue
              if h is not None and hh!=h:continue
              if re.match(r"\d{4}-\d{2}-\d{2}T",str(t)):
                return {"height":hh,"time":str(t),"hash":x.get("hash")}
            return None

          def gov_status(body):
            try:d=json.loads(body)
            except:return None
            for x in walk(d):
              if not isinstance(x,dict):continue
              st=x.get("status")
              pid=x.get("proposal_id") or x.get("proposalId")
              if st is not None and (pid is None or str(pid)=="287"):
                s=str(st)
                if "PROPOSAL_STATUS_" in s or s in ("1","2","3","4","5"):return s
            return None

          anchor=11850000
          probes=[]
          urls=[
            RPC+"/status",
            RPC+f"/block?height={anchor}",
            RPC+f"/commit?height={anchor}",
            RPC+f"/blockchain?minHeight={anchor}&maxHeight={anchor}",
            LCD+f"/cosmos/base/tendermint/v1beta1/blocks/{anchor}",
            LCD+"/cosmos/gov/v1beta1/proposals/287",
            LCD+"/gov/proposals/287",
          ]
          for u in urls:
            r=get(u)
            probes.append({"url":u,"ok":r["ok"],"status":r.get("status"),"header":header(r.get("body",""),anchor),
                           "gov_status":gov_status(r.get("body","")),"sha256":r.get("sha256"),
                           "error":r.get("error"),"body_excerpt":r.get("body","")[:10000]})

          # Direct indexed EndBlock event.
          event_queries=[
            "active_proposal.proposal_id='287'",
            "active_proposal.proposal_id='287' AND active_proposal.proposal_result='proposal_passed'",
          ]
          event_rows=[]
          for qstr in event_queries:
            params=urllib.parse.urlencode({"query":qstr,"page":"1","per_page":"100","order_by":"asc"})
            r=get(RPC+"/block_search?"+params)
            hs=[]
            try:
              d=json.loads(r.get("body",""))
              for x in walk(d):
                h=x.get("height");t=x.get("time")
                if h is not None and t is not None:
                  try:hh=int(h)
                  except:continue
                  if re.match(r"\d{4}-\d{2}-\d{2}T",str(t)):
                    rec={"height":hh,"time":str(t),"hash":x.get("hash")}
                    if rec not in hs:hs.append(rec)
            except:pass
            event_rows.append({"query":qstr,"ok":r["ok"],"status":r.get("status"),"headers":hs,
                               "sha256":r.get("sha256"),"error":r.get("error"),"body_excerpt":r.get("body","")[:20000]})

          # Historical gov state via both query param and x-cosmos-block-height header.
          heights=[11750000,11780000,11800000,11820000,11840000,11850000,11860000,11870000,11885000,11900000,11920000]
          state=[]
          for path in ["/cosmos/gov/v1beta1/proposals/287","/gov/proposals/287"]:
            for h in heights:
              for mode in ["query","header"]:
                if mode=="query":
                  r=get(LCD+path+"?height="+str(h))
                else:
                  r=get(LCD+path,{"x-cosmos-block-height":str(h)})
                state.append({"path":path,"height":h,"mode":mode,"ok":r["ok"],"http":r.get("status"),
                              "proposal_status":gov_status(r.get("body","")),
                              "response_height":r.get("headers",{}).get("x-cosmos-block-height") or r.get("headers",{}).get("X-Cosmos-Block-Height"),
                              "sha256":r.get("sha256"),"error":r.get("error"),"body_excerpt":r.get("body","")[:4000]})

          out={"scope":"SOURCE_ONLY_NO_MARKET_DATA","target_voting_end":TARGET,
               "historical_source_provenance":{
                 "repository":"ping-pub/mainnet",
                 "commit":"ce94a68076a6ff49acea9458f9feb86cdd700c73",
                 "commit_date":"2024-02-21T21:36:50Z",
                 "evidence":"diff removes rpc.secret.express and lcd.secret.express from Secret mainnet config"
               },
               "tested_utc":datetime.datetime.now(datetime.timezone.utc).isoformat(),
               "dns":dns,"basic_probes":probes,"event_search":event_rows,"historical_gov_state":state}
          os.makedirs(os.path.dirname(OUT),exist_ok=True)
          with open(OUT,"w") as f:json.dump(out,f,indent=2)
          print("SCRT287_V36_RESULT",json.dumps({
            "dns":{k:(v if isinstance(v,str) else "resolved") for k,v in dns.items()},
            "basic_ok":[x["url"] for x in probes if x["ok"]],
            "event_hits":[x["headers"] for x in event_rows if x["headers"]],
            "state_statuses":sorted(set(x["proposal_status"] for x in state if x["proposal_status"]))
          }))
          PY
      - name: Persist V36 receipt
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/cosmos_native_emission_param_shock_001_v0_2/SCRT287_SECRET_EXPRESS_HISTORICAL_ENDPOINT_V36.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "SCRT287: persist historical Secret Express endpoint probe v36"
          git push origin HEAD:cosmos-native-emission-param-shock-001-v0.2-t0-remediation-2026-10-07
