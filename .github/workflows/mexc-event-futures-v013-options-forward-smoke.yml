name: MEXC V0.13 Options Frozen Forward Shadow Smoke
on:
  push:
    branches:
      - mexc-event-futures-event-conditioned-v0.13-prereg-2026-10-03
    paths:
      - research/mexc_event_futures/OPTIONS_VOL_ACTIVATION_FREEZE_V013_2026-10-03.md
permissions:
  contents: read
jobs:
  initial-frozen-shadow-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install public transport and fresh browser dependencies
        run: |
          python -m pip install websockets==15.0.1 playwright==1.58.0
          python -m playwright install --with-deps chromium
      - name: Frozen mechanics checks
        run: |
          python -m py_compile research/mexc_event_futures/options_pair_source_v013.py research/mexc_event_futures/options_forward_smoke_v013.py
          python research/mexc_event_futures/priority_source_gates_v013.py --self-test
      - name: Establish activation commit boundary
        run: |
          python - <<'PY'
          import subprocess,datetime,os
          stamp=subprocess.check_output(['git','show','-s','--format=%cI','HEAD'],text=True).strip()
          boundary=int(datetime.datetime.fromisoformat(stamp).timestamp()*1000)
          with open(os.environ['GITHUB_ENV'],'a') as f:f.write(f'V013_BOUNDARY_MS={boundary}\n')
          print('ACTIVATION_BOUNDARY_MS',boundary)
          PY
      - name: Initial bounded prospective shadow smoke; no trading
        run: python research/mexc_event_futures/options_forward_smoke_v013.py --boundary-ms "$V013_BOUNDARY_MS" --output evidence/options-forward-smoke
      - name: Preserve raw sources and all forward ledgers
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v013-options-frozen-forward-smoke
          path: evidence/options-forward-smoke/
          if-no-files-found: error
          retention-days: 30
