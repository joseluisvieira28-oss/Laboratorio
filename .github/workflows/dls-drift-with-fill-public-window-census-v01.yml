name: DLS Drift With-Fill Public-Source Window Census V0.1
on:
  push:
    branches: [dls-signed-flow-authority-v01]
    paths:
      - labs/DEFI_LIQUIDATION_SHOCK_001/LAUNCH_DRIFT_WITH_FILL_PUBLIC_WINDOW_V01.marker
permissions:
  contents: read
jobs:
  census:
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        include:
          - id: wf-202407tail
            start: '2024-07-30T17:21:13Z'
            end: '2024-08-01T00:00:00Z'
          - id: wf-202408
            start: '2024-08-01T00:00:00Z'
            end: '2024-09-01T00:00:00Z'
          - id: wf-202409
            start: '2024-09-01T00:00:00Z'
            end: '2024-10-01T00:00:00Z'
          - id: wf-202410
            start: '2024-10-01T00:00:00Z'
            end: '2024-11-01T00:00:00Z'
          - id: wf-202411
            start: '2024-11-01T00:00:00Z'
            end: '2024-12-01T00:00:00Z'
          - id: wf-202412
            start: '2024-12-01T00:00:00Z'
            end: '2025-01-01T00:00:00Z'
    runs-on: ubuntu-latest
    timeout-minutes: 70
    env:
      DLS_PARTITION: ${{ matrix.id }}
      DLS_START: ${{ matrix.start }}
      DLS_END: ${{ matrix.end }}
    steps:
      - uses: actions/checkout@v4
        with: {ref: "${{ github.sha }}"}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Compile frozen census runner
        run: python -m py_compile labs/DEFI_LIQUIDATION_SHOCK_001/source/census_drift_with_fill_partition_v0_1.py
      - name: Execute source-only bounded census
        run: python labs/DEFI_LIQUIDATION_SHOCK_001/source/census_drift_with_fill_partition_v0_1.py
      - name: Upload partition receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dls-drift-with-fill-${{ matrix.id }}-v01
          path: |
            labs/DEFI_LIQUIDATION_SHOCK_001/DRIFT_WITH_FILL_CENSUS_${{ matrix.id }}_RECEIPT_V0.1.json
            labs/DEFI_LIQUIDATION_SHOCK_001/DRIFT_WITH_FILL_CENSUS_${{ matrix.id }}_V0.1.ndjson
          if-no-files-found: warn
          retention-days: 90
      - name: Firewall
        if: always()
        run: echo SOURCE_ONLY_PUBLIC_WINDOW_NO_PRICES_2025_2026_CLOSED
