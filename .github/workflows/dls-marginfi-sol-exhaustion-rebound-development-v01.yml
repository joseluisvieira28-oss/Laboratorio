name: DLS Marginfi SOL Exceptional-Flow Exhaustion Rebound Development V0.1

on:
  push:
    branches:
      - dls-marginfi-flow-exhaustion-rebound-v01
    paths:
      - labs/DEFI_LIQUIDATION_SHOCK_001/LAUNCH_MARGINFI_SOL_EXHAUSTION_REBOUND_DEV_V01.marker

permissions:
  actions: read
  contents: read

jobs:
  development:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download exact canonical Jul-Sep source PASS
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 36894911218
          artifact-ids: 11179284141
          path: source_gate

      - name: Download exact frozen feature-only Q90 calibration
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 36686002313
          artifact-ids: 11083738178
          path: calibration_gate

      - name: Compile frozen Development executor
        shell: pwsh
        run: python -m py_compile labs/DEFI_LIQUIDATION_SHOCK_001/source/run_marginfi_sol_flow_exhaustion_rebound_dev_v0_1.py

      - name: Execute frozen Jul-Sep Development
        shell: pwsh
        run: >
          python labs/DEFI_LIQUIDATION_SHOCK_001/source/run_marginfi_sol_flow_exhaustion_rebound_dev_v0_1.py
          --source-root source_gate
          --calibration-root calibration_gate
          --workers 12

      - name: Upload immutable Development evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dls-marginfi-sol-exhaustion-rebound-development-v01
          path: |
            labs/DEFI_LIQUIDATION_SHOCK_001/MARGINFI_SOL_EXHAUSTION_REBOUND_V01_DEVELOPMENT_RECEIPT.json
            labs/DEFI_LIQUIDATION_SHOCK_001/MARGINFI_SOL_EXHAUSTION_REBOUND_V01_DEVELOPMENT_LEDGER.ndjson
            labs/DEFI_LIQUIDATION_SHOCK_001/MARGINFI_SOL_EXHAUSTION_REBOUND_V01_CASCADE_FEATURES.ndjson
            labs/DEFI_LIQUIDATION_SHOCK_001/MARGINFI_SOL_EXHAUSTION_REBOUND_V01_MARKET_DATA_MANIFEST.ndjson
          if-no-files-found: warn
          retention-days: 90

      - name: Firewall
        if: always()
        shell: pwsh
        run: Write-Output "EXACT_SOURCE_PASS_Q90_FROZEN_JULSEP_DEV_ONLY_2025_2026_CLOSED_NO_TRADING"
