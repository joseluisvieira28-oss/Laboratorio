name: DLS Route A2 Public Boundary Locator V0.1
on:
  push:
    branches: [dls-field-enrichment-v01]
    paths: [labs/DEFI_LIQUIDATION_SHOCK_001/LAUNCH_ROUTE_A2_PUBLIC_BOUNDARY_V01.marker]
permissions: {contents: read}
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {ref: "${{ github.sha }}"}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Compile
        run: python -m py_compile labs/DEFI_LIQUIDATION_SHOCK_001/source/probe_public_boundary_locator_v0_1.py
      - name: Probe
        env:
          HELIUS_API_KEY: "${{ secrets.HELIUS_API_KEY }}"
          DLS_RPC_URL: "${{ secrets.DLS_RPC_URL }}"
          PYTHONUNBUFFERED: "1"
        run: python labs/DEFI_LIQUIDATION_SHOCK_001/source/probe_public_boundary_locator_v0_1.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dls-route-a2-public-boundary-v01
          path: route_a2_public_boundary_probe/DLS_ROUTE_A2_PUBLIC_BOUNDARY_LOCATOR_RECEIPT_V0.1.json
          if-no-files-found: warn
          retention-days: 30
      - if: always()
        run: echo SOURCE_ONLY_NO_2025_ACQUISITION_NO_MARKET_OUTCOMES_NO_TRADING
