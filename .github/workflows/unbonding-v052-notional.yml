name: Unbonding V0.5.2 Notional Archive Probe
on:
  push:
    branches: [pos-unbonding-completion-001-v0.5-source-expansion-2026-10-07]
    paths: ["research/pos_unbonding_completion_001_v0_5_source_expansion/v052_notional_archive_probe.py",".github/workflows/unbonding-v052-notional.yml"]
permissions: {contents: write}
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: {ref: pos-unbonding-completion-001-v0.5-source-expansion-2026-10-07, fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python research/pos_unbonding_completion_001_v0_5_source_expansion/v052_notional_archive_probe.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/pos_unbonding_completion_001_v0_5_source_expansion/NOTIONAL_ARCHIVE_PROBE_V052.json
          git diff --cached --quiet || (git commit -m "Record Notional archive source-B probe" && git push origin HEAD:pos-unbonding-completion-001-v0.5-source-expansion-2026-10-07)
