name: DLS Protected 2025 Source Authority V0.1

on:
  push:
    branches: [dls-field-enrichment-v01]
    paths:
      - labs/DEFI_LIQUIDATION_SHOCK_001/LAUNCH_PROTECTED_2025_SOURCE_V01.marker

permissions:
  actions: read
  contents: read

jobs:
  collect:
    strategy:
      fail-fast: false
      matrix:
        protocol: [marginfi, save0c, kamino, save11]
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile source collector
        run: python -m py_compile labs/DEFI_LIQUIDATION_SHOCK_001/source/collect_protected_2025_source_v0_1.py
      - name: Collect complete 2025 source population
        run: >
          python labs/DEFI_LIQUIDATION_SHOCK_001/source/collect_protected_2025_source_v0_1.py
          --protocol ${{ matrix.protocol }}
          --out protected_source/${{ matrix.protocol }}.json
      - name: Upload protocol source receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dls-protected-2025-source-${{ matrix.protocol }}
          path: protected_source/${{ matrix.protocol }}.json
          if-no-files-found: warn
          retention-days: 90
      - name: Firewall
        if: always()
        run: echo SOURCE_ONLY_NO_2025_PRICES_NO_2026_NO_TRADING

  finalize:
    needs: collect
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download protocol receipts
        uses: actions/download-artifact@v4
        with:
          pattern: dls-protected-2025-source-*
          path: protected_source
          merge-multiple: true
      - name: Aggregate frozen 60s SOL source clusters
        run: python labs/DEFI_LIQUIDATION_SHOCK_001/source/finalize_protected_2025_source_v0_1.py --root protected_source
      - name: Upload 2025 source authority
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dls-protected-2025-source-authority-v01
          path: |
            labs/DEFI_LIQUIDATION_SHOCK_001/PROTECTED_2025_SOURCE_AUTHORITY_RECEIPT_V0.1.json
            labs/DEFI_LIQUIDATION_SHOCK_001/PROTECTED_2025_SOURCE_CLUSTER_CENSUS_V0.1.ndjson
          if-no-files-found: warn
          retention-days: 90
      - name: Firewall
        if: always()
        run: echo SOURCE_ONLY_NO_2025_PRICES_NO_2026_NO_TRADING
