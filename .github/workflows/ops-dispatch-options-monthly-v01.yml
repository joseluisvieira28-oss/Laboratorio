name: OPS — Execute OPTIONS-SPOTPERP-002 2025 OOS Confirmation

on:
  push:
    branches:
      - ops-dispatch-options-20260913
    paths:
      - '.github/workflows/ops-dispatch-options-monthly-v01.yml'

permissions:
  contents: read
  actions: read

jobs:
  confirmation-2025:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Checkout frozen child branch
        uses: actions/checkout@v4
        with:
          ref: options-spotperp-regime-v0.2

      - name: Preflight authority and code
        working-directory: Dream-Account-OS-v2.3-PARTIAL/research/options_spotperp_v0_2
        run: |
          set -euo pipefail
          echo "CHILD_HEAD_SHA=$(git rev-parse HEAD)"
          test -f OPTIONS_SPOTPERP_002_CONFIRMATION_AUTHORITY_V01.md
          test -f OPTIONS_SPOTPERP_002_PROMOTION_POLICY_V2_AUDIT.md
          python3 -m py_compile confirmation_source_acquire_2025_v01.py confirmation_runner_2025_v01.py regime_discovery_runner_v02.py
          grep -q '2026 remains LOCKED' OPTIONS_SPOTPERP_002_CONFIRMATION_AUTHORITY_V01.md
          grep -q 'Candidate regime: UP_LOW only' OPTIONS_SPOTPERP_002_CONFIRMATION_AUTHORITY_V01.md
          echo 'PREFLIGHT_PASS — NO OOS OUTCOMES OPENED YET'

      - name: Acquire authorized 2025 source only
        id: source
        working-directory: Dream-Account-OS-v2.3-PARTIAL/research/options_spotperp_v0_2
        shell: bash
        run: |
          rm -rf confirmation_source_2025
          set +e
          python3 confirmation_source_acquire_2025_v01.py --output confirmation_source_2025
          rc=$?
          set -e
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          echo "CONFIRMATION_SOURCE_EXIT_CODE=$rc"
          test "$rc" -eq 0 -o "$rc" -eq 2

      - name: Validate source-only firewalls
        if: steps.source.outputs.rc == '0'
        working-directory: Dream-Account-OS-v2.3-PARTIAL/research/options_spotperp_v0_2
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path('confirmation_source_2025/confirmation_source_manifest.json').read_text())
          r=json.loads(Path('confirmation_source_2025/confirmation_source_audit_report.json').read_text())
          assert m['status']=='SOURCE_AUDIT_PASS' and r['status']=='SOURCE_AUDIT_PASS'
          assert m['confirmation_2025_authorized'] is True and m['confirmation_2025_accessed'] is True
          assert m['year_2026_accessed'] is False
          assert m['skew_values_computed'] is False and m['signals_computed'] is False
          assert m['forward_returns_computed'] is False and m['pnl_computed'] is False
          assert r['outcome_metrics_computed'] is False
          print('SOURCE_ONLY_GATE_PASS / 2026 LOCKED / NO OUTCOMES YET')
          PY

      - name: Execute frozen one-shot 2025 OOS Confirmation
        id: oos
        if: steps.source.outputs.rc == '0'
        working-directory: Dream-Account-OS-v2.3-PARTIAL/research/options_spotperp_v0_2
        shell: bash
        run: |
          rm -rf confirmation_output_2025
          set +e
          python3 confirmation_runner_2025_v01.py --source-root confirmation_source_2025 --output confirmation_output_2025
          rc=$?
          set -e
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          echo "OOS_EXIT_CODE=$rc"
          test "$rc" -eq 0 -o "$rc" -eq 3 -o "$rc" -eq 5

      - name: Validate OOS closeout
        if: steps.source.outputs.rc == '0'
        working-directory: Dream-Account-OS-v2.3-PARTIAL/research/options_spotperp_v0_2
        env:
          RC: ${{ steps.oos.outputs.rc }}
        run: |
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          x=json.loads(Path('confirmation_output_2025/OPTIONS_SPOTPERP_002_CONFIRMATION_2025_CLOSEOUT_V01.json').read_text())
          expected={0:'OOS_REPLICATED',3:'OOS_FAILED',5:'INSUFFICIENT_SAMPLE'}[int(os.environ['RC'])]
          assert x['classification']==expected
          assert x['candidate_regime']=='UP_LOW'
          assert x['confirmation_2025_accessed'] is True
          assert x['year_2026_accessed'] is False
          assert x['live_trading_authorized'] is False and x['exchange_mutation_authorized'] is False
          assert x['tier1_automatic'] is False
          print('OOS_CLASSIFICATION=',x['classification'])
          print('REGIME_OBSERVATIONS=',x['regime_observations'])
          print('REGRESSION=',x['regression'])
          print('BASE_10BPS=',x['base_10bps'])
          print('STRESS_20BPS=',x['stress_20bps'])
          print('GATES=',x['gates'])
          print('2026 LOCKED / NO LIVE TRADING')
          PY

      - name: Upload source receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: options-spotperp-002-confirmation-source-2025-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            Dream-Account-OS-v2.3-PARTIAL/research/options_spotperp_v0_2/confirmation_source_2025/confirmation_source_manifest.json
            Dream-Account-OS-v2.3-PARTIAL/research/options_spotperp_v0_2/confirmation_source_2025/confirmation_source_audit_report.json
          if-no-files-found: warn
          retention-days: 90

      - name: Upload immutable OOS closeout
        if: steps.source.outputs.rc == '0'
        uses: actions/upload-artifact@v4
        with:
          name: options-spotperp-002-confirmation-2025-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            Dream-Account-OS-v2.3-PARTIAL/research/options_spotperp_v0_2/confirmation_output_2025/OPTIONS_SPOTPERP_002_CONFIRMATION_2025_CLOSEOUT_V01.json
            Dream-Account-OS-v2.3-PARTIAL/research/options_spotperp_v0_2/confirmation_output_2025/OPTIONS_SPOTPERP_002_CONFIRMATION_2025_LEDGER_V01.csv
            Dream-Account-OS-v2.3-PARTIAL/research/options_spotperp_v0_2/OPTIONS_SPOTPERP_002_CONFIRMATION_AUTHORITY_V01.md
            Dream-Account-OS-v2.3-PARTIAL/research/options_spotperp_v0_2/OPTIONS_SPOTPERP_002_PROMOTION_POLICY_V2_AUDIT.md
          if-no-files-found: error
          retention-days: 90

      - name: Governance closeout
        if: always()
        run: |
          echo 'OPTIONS-SPOTPERP-002 2025 OOS CONFIRMATION ONLY'
          echo '2026 LOCKED'
          echo 'NO LIVE TRADING / NO EXCHANGE MUTATION / NO PARAMETER RESCUE / NO MERGE TO MAIN'
