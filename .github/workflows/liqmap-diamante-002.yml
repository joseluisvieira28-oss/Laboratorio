name: LIQMAP-002 prospective BTC map (NO TRADING)
on:
  pull_request:
    branches:
      - research/liqmap-diamante-001-public-proxy-20261126
    paths:
      - 'research/liqmap-diamante-002/point.py'
      - 'research/liqmap-diamante-002/settle.py'
      - 'research/liqmap-diamante-002/rollup.py'
      - 'research/liqmap-diamante-002/test_forward.py'
      - 'research/liqmap-diamante-002/PROTOCOL.md'
      - '.github/workflows/liqmap-diamante-002.yml'
  push:
    branches:
      - research/liqmap-diamante-002-forward-map-20261126
    paths:
      - 'research/liqmap-diamante-002/requests/*.txt'
permissions:
  contents: read
concurrency:
  group: liqmap-002-forensic-one-at-a-time
  cancel-in-progress: false
jobs:
  preflight:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Offline scientific leakage and accounting tests
        run: python -m unittest discover -s research/liqmap-diamante-002 -p 'test_*.py' -v
      - name: Test public source, NOT a future sample
        run: python research/liqmap-diamante-002/point.py preflight 2026-11-26
      - name: Preserve source hashes even if blocked
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: liqmap002-preflight-${{ github.run_id }}
          path: research/liqmap-diamante-002/run_results/
          retention-days: 90
          if-no-files-found: warn
  daily-capture:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Offline regression tests
        run: python -m unittest discover -s research/liqmap-diamante-002 -p 'test_*.py' -v
      - name: Require one dated immutable research request
        id: req
        shell: bash
        run: |
          set -euo pipefail
          INPUT="$(git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA" | grep -E '^research/liqmap-diamante-002/requests/[0-9]{4}-[0-9]{2}-[0-9]{2}[.]txt$' || true)"
          N="$(printf '%s\n' "$INPUT" | grep -c . || true)"
          test "$N" = 1
          DATE="$(basename "$INPUT" .txt)"
          case "$(cat "$INPUT")" in
            "CAPTURE_$DATE") KIND="capture";;
            "SETTLE_ONLY_$DATE") KIND="settle";;
            *) echo "Invalid request"; exit 3;;
          esac
          echo "date=$DATE" >> "$GITHUB_OUTPUT"
          echo "kind=$KIND" >> "$GITHUB_OUTPUT"
      - name: Freeze today's map before future prices
        if: steps.req.outputs.kind == 'capture'
        run: python research/liqmap-diamante-002/point.py future "${{ steps.req.outputs.date }}"
      - name: Settle only mature older full 24h OHLC outcomes
        run: python research/liqmap-diamante-002/settle.py
      - name: Audit all missed days and frozen scientific gates
        run: python research/liqmap-diamante-002/rollup.py
      - name: Commit sealed records only to research branch
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "research/liqmap-diamante-002-forward-map-20261126"
          git config user.name "LIQMAP research evidence bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A research/liqmap-diamante-002/observations/ research/liqmap-diamante-002/settlements/ research/liqmap-diamante-002/rollup_summary.json
          if ! git diff --cached --quiet; then
            git commit -m "evidence: LIQMAP002 ${{ steps.req.outputs.date }} frozen map and matured outcomes"
            git push origin HEAD:refs/heads/research/liqmap-diamante-002-forward-map-20261126
          fi
      - name: Preserve all raw hashes/sources and reports as GitHub artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: liqmap002-forward-${{ github.run_id }}
          path: |
            research/liqmap-diamante-002/run_results/
            research/liqmap-diamante-002/observations/
            research/liqmap-diamante-002/settlements/
            research/liqmap-diamante-002/rollup_summary.json
          retention-days: 90
          if-no-files-found: warn
