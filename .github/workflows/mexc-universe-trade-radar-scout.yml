name: MEXC Universe Trade Radar Scout

on:
  push:
    branches:
      - "scout/mexc-universe-trade-radar-20261007"
    paths:
      - "crypto_edge_radar/radar/mexc_universe_trade_scanner.py"
      - "crypto_edge_radar/MEXC_UNIVERSE_TRADE_RADAR_FREEZE_V0.1.md"
      - ".github/workflows/mexc-universe-trade-radar-scout.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install requests
      - run: python crypto_edge_radar/radar/mexc_universe_trade_scanner.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mexc-universe-trade-radar-result
          path: mexc_universe_trade_radar_result.json
          retention-days: 7
