name: licp001-calibration-integrity-v01
on:
  push:
    branches: [liquidation-cascade-propagation-v0.1]
    paths:
      - 'research/liquidation_cascade/licp001_forward_collector_v01.py'
      - 'research/liquidation_cascade/licp001_calibrate_v01.py'
      - 'research/liquidation_cascade/test_licp001_calibration_v01.py'
      - 'research/liquidation_cascade/LICP_001_FORWARD_CALIBRATION_FREEZE_V0_1.md'
      - '.github/workflows/licp001-calibration-integrity-v01.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install 'websockets>=13,<16' pytest
      - run: pytest -q research/liquidation_cascade/test_licp001_calibration_v01.py
      - name: 120s outcome-blind live smoke collection
        run: python research/liquidation_cascade/licp001_forward_collector_v01.py --seconds 120 --outdir /tmp/licp001
      - name: Outcome-blind calibration smoke
        run: |
          test -s /tmp/licp001/health.json
          if test -s /tmp/licp001/liquidations.jsonl; then
            python research/liquidation_cascade/licp001_calibrate_v01.py /tmp/licp001/liquidations.jsonl --out /tmp/licp001/calibration.json
          fi
