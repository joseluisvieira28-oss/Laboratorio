name: source-t0-probe-v48-secret-celestia-composable-ibc
on:
  push:
    branches: [cosmos-native-emission-param-shock-001-v0.2-t0-remediation-2026-10-07]
    paths: [.github/workflows/source-t0-probe-v48-secret-celestia-composable-ibc.yml]
permissions: {contents: write}
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with: {ref: cosmos-native-emission-param-shock-001-v0.2-t0-remediation-2026-10-07}
      - name: Exact IBC hits on late-2023 carriers
        run: |
          python3 - <<'PY'
          import json,urllib.request,urllib.error,ssl,os,datetime
          from concurrent.futures import ThreadPoolExecutor
          H=[11880918,11880919,11880920,11880921]
          E=[
          ("celestia","07-tendermint-52","https://rpc.archive.celestia.validatus.com"),
          ("celestia","07-tendermint-52","https://celestia-rpc.publicnode.com:443"),
          ("celestia","07-tendermint-52","https://rpc.celestia.citizenweb3.com"),
          ("celestia","07-tendermint-52","https://celestia-rpc.polkachu.com:443"),
          ("composable","07-tendermint-52","https://rpc.composable.citizenweb3.com:443"),
          ("composable","07-tendermint-52","https://picasso-rpc.polkachu.com:443"),
          ("composable","07-tendermint-52","https://composable-mainnet-rpc.autostake.com:443")]
          def one(x):
            n,c,u,h=x;q=f"update_client.client_id='{c}' AND update_client.consensus_height='4-{h}'"
            p={"jsonrpc":"2.0","id":1,"method":"tx_search","params":{"query":q,"prove":False,"page":"1","per_page":"100","order_by":"asc"}}
            try:
              req=urllib.request.Request(u,data=json.dumps(p).encode(),headers={"Content-Type":"application/json","User-Agent":"CryptoLab-v48"},method="POST")
              with urllib.request.urlopen(req,timeout=10,context=ssl._create_unverified_context()) as z:
                d=json.loads(z.read());txs=(d.get("result") or {}).get("txs") or []
                return {"carrier":n,"client":c,"endpoint":u,"height":h,"ok":True,"status":z.status,
                        "hits":[{"tx_hash":t.get("hash"),"carrier_height":int(t["height"])} for t in txs]}
            except urllib.error.HTTPError as e:return {"carrier":n,"client":c,"endpoint":u,"height":h,"ok":False,"status":e.code,"error":str(e),"hits":[]}
            except Exception as e:return {"carrier":n,"client":c,"endpoint":u,"height":h,"ok":False,"status":None,"error":repr(e),"hits":[]}
          jobs=[(n,c,u,h) for n,c,u in E for h in H]
          with ThreadPoolExecutor(max_workers=28) as ex:rows=list(ex.map(one,jobs))
          hits=[r for r in rows if r["hits"]]
          out={"scope":"SOURCE_ONLY_NO_MARKET_DATA","target":"2023-12-07T02:54:58.930543213Z",
            "historical_basis":"cosmos/chain-registry@d6818c758173d16524dc673379d2a0a83002b292 (2023-11-15)",
            "tested_utc":datetime.datetime.now(datetime.timezone.utc).isoformat(),"rows":rows,"hits":hits}
          p="research/cosmos_native_emission_param_shock_001_v0_2/SCRT287_CELESTIA_COMPOSABLE_IBC_V48.json"
          os.makedirs(os.path.dirname(p),exist_ok=True);open(p,"w").write(json.dumps(out,indent=2))
          print("V48",json.dumps({"hits":hits}))
          PY
      - name: Persist
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/cosmos_native_emission_param_shock_001_v0_2/SCRT287_CELESTIA_COMPOSABLE_IBC_V48.json
          git commit -m "SCRT287: persist Celestia/Composable exact IBC probe v48"
          git pull --rebase origin cosmos-native-emission-param-shock-001-v0.2-t0-remediation-2026-10-07
          git push origin HEAD:cosmos-native-emission-param-shock-001-v0.2-t0-remediation-2026-10-07
