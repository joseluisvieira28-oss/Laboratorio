name: CONVEX 20:55 two alerts offline forensic audit
on:
  workflow_dispatch:
  push:
    branches:
      - audit/convex-two-signals-2055-forensic-2026-10-15
    paths:
      - 'tools/convex_signal_forensics/**'
      - '.github/workflows/convex-two-signals-forensic-2055.yml'
jobs:
  offline-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Unit tests without network or credentials
        run: python -m unittest -v tools.convex_signal_forensics.test_forensic_2055
      - name: Pinned V5 engine and UTC self-test
        run: python -m tools.convex_signal_forensics.forensic_2055 --self-test
  windows-package:
    needs: offline-test
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PyInstaller only for Windows packaging
        run: python -m pip install pyinstaller==6.16.0
      - name: Bundle offline verifier and pinned parent V5 source
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --name CONVEX_SIGNAL_2055_FORENSIC_V02 --paths . --add-data "engine/three_convex_v05/vendor/V5_PARENT_PINNED_SOURCE.py.txt;engine/three_convex_v05/vendor" tools/convex_signal_forensics/forensic_2055.py
      - name: Run packaged verifier self-test OFFLINE
        shell: pwsh
        run: |
          .\dist\CONVEX_SIGNAL_2055_FORENSIC_V02.exe --self-test
          if ($LASTEXITCODE -ne 0) { throw "PACKAGED_SELF_TEST_FAILED" }
      - name: Stage hashes and operator readme
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path audit_release | Out-Null
          Copy-Item dist\CONVEX_SIGNAL_2055_FORENSIC_V02.exe audit_release\
          Copy-Item tools\convex_signal_forensics\OPERATOR_README.md audit_release\
          $hash = (Get-FileHash audit_release\CONVEX_SIGNAL_2055_FORENSIC_V02.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          $hash | Set-Content audit_release\SHA256_EXE.txt
          Write-Output ("OFFLINE_FORENSIC_EXE_SHA256=" + $hash)
      - uses: actions/upload-artifact@v4
        with:
          name: CONVEX_2055_FORENSIC_V02_SOL_PARITY_WINDOWS_NOT_INSTALLED
          path: audit_release/
          if-no-files-found: error
          retention-days: 14
