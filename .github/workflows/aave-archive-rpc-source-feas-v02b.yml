name: AAVE Liquidation Overhang 001 — Archive RPC Source Feasibility V0.2B

on:
  push:
    branches:
      - aave-liquidation-overhang-v0.1
    paths:
      - 'research/aave_liquidation_overhang/ARCHIVE_RPC_FEAS_TRIGGER_V02B.txt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m py_compile research/aave_liquidation_overhang/archive_rpc_replacement_source_feas_v02b.py
      - run: pip install --disable-pip-version-check requests
      - run: python research/aave_liquidation_overhang/archive_rpc_replacement_source_feas_v02b.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AAVE_ARCHIVE_RPC_REPLACEMENT_SOURCE_FEASIBILITY_V0_2B
          path: archive_rpc_feas_output/AAVE_ARCHIVE_RPC_REPLACEMENT_SOURCE_FEASIBILITY_V0_2B.json
          if-no-files-found: warn
          retention-days: 30
