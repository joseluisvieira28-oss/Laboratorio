name: DLS Marginfi Orca Signed Flow Calibration V0.1

on:
  push:
    branches:
      - dls-marginfi-route-migration-v01
    paths:
      - labs/DEFI_LIQUIDATION_SHOCK_001/LAUNCH_MARGINFI_ORCA_SIGNED_FLOW_CAL_V01.marker

permissions:
  actions: read
  contents: read

jobs:
  calibration:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download immutable route-migration August sample
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 36769933849
          artifact-ids: 11123323570
          path: route_samples/aug

      - name: Download immutable route-migration September sample
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 36769933849
          artifact-ids: 11122359266
          path: route_samples/sep

      - name: Download canonical August field-enrichment
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 36263998920
          artifact-ids: 10925020784
          path: field_aug

      - name: Download canonical September field-enrichment
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 36263998920
          artifact-ids: 10924302485
          path: field_sep

      - name: Download source-authoritative Marginfi bank registry
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 36312418451
          artifact-ids: 10929339072
          path: bank_registry

      - name: Compile frozen Orca decoder
        run: python -m py_compile labs/DEFI_LIQUIDATION_SHOCK_001/source/calibrate_marginfi_orca_signed_flow_v0_1.py

      - name: Execute source-only Orca calibration
        run: >
          python labs/DEFI_LIQUIDATION_SHOCK_001/source/calibrate_marginfi_orca_signed_flow_v0_1.py
          --route-root route_samples
          --field-aug-root field_aug
          --field-sep-root field_sep
          --bank-registry-root bank_registry
          --workers 8

      - name: Upload immutable calibration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dls-marginfi-orca-signed-flow-calibration-v01
          path: |
            labs/DEFI_LIQUIDATION_SHOCK_001/MARGINFI_ORCA_SIGNED_FLOW_CALIBRATION_RECEIPT_V0.1.json
            labs/DEFI_LIQUIDATION_SHOCK_001/MARGINFI_ORCA_SIGNED_FLOW_CALIBRATION_ROWS_V0.1.ndjson
          if-no-files-found: warn
          retention-days: 90

      - name: Firewall
        if: always()
        run: echo SOURCE_ONLY_ORCA_NO_MARKET_OUTCOMES_NO_TRADING
