name: DLS Marginfi Orca Flow-Turnover Calibration V0.1

on:
  push:
    branches:
      - dls-marginfi-orca-flow-turnover-v01
    paths:
      - labs/DEFI_LIQUIDATION_SHOCK_001/LAUNCH_MARGINFI_ORCA_FLOW_TURNOVER_CAL_V01.marker

permissions:
  actions: read
  contents: read

jobs:
  calibration:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download canonical Jul-Sep Orca signed-flow PASS
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 36780139559
          artifact-ids: 11127536853
          path: source_gate

      - name: Compile feature-only calibrator
        run: python -m py_compile labs/DEFI_LIQUIDATION_SHOCK_001/source/calibrate_marginfi_orca_flow_turnover_v0_1.py

      - name: Execute feature-only calibration
        run: >
          python labs/DEFI_LIQUIDATION_SHOCK_001/source/calibrate_marginfi_orca_flow_turnover_v0_1.py
          --source-root source_gate
          --workers 12

      - name: Upload immutable calibration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dls-marginfi-orca-flow-turnover-calibration-v01
          path: |
            labs/DEFI_LIQUIDATION_SHOCK_001/MARGINFI_ORCA_FLOW_TURNOVER_CALIBRATION_RECEIPT_V0.1.json
            labs/DEFI_LIQUIDATION_SHOCK_001/MARGINFI_ORCA_FLOW_TURNOVER_CALIBRATION_CASCADES_V0.1.ndjson
            labs/DEFI_LIQUIDATION_SHOCK_001/MARGINFI_ORCA_FLOW_TURNOVER_CALIBRATION_MARKET_VOLUME_MANIFEST_V0.1.ndjson
          if-no-files-found: warn
          retention-days: 90

      - name: Firewall
        if: always()
        run: echo FEATURE_ONLY_JULSEP_NO_OCTDEC_OUTCOMES_NO_TRADING
