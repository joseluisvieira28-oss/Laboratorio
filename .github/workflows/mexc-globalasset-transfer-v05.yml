name: MEXC GlobalAsset Transfer V0.5

on:
  push:
    branches:
      - mexc-globalasset-transfer-v0.5-prereg-2026-10-04

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: matrix
        name: Build frozen matrix
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          p="research/mexc_global_assets/MEXC_GLOBALASSET_TRANSFER_SOURCE_BINDING_V0.5.json"
          d=json.load(open(p))
          m={"include":[{"target":x["target"],"external":x["external_binance"]} for x in d["candidates"]]}
          assert len(m["include"])==35
          with open(os.environ["GITHUB_OUTPUT"],"a") as f:
              f.write("matrix="+json.dumps(m,separators=(",",":"))+"\n")
          print(json.dumps(m,indent=2))
          PY

  evaluate:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependency
        run: python -m pip install --disable-pip-version-check requests
      - name: Freeze check
        run: |
          test "$GITHUB_REF_NAME" = "mexc-globalasset-transfer-v0.5-prereg-2026-10-04"
          test -f research/mexc_global_assets/MEXC_GLOBALASSET_TRANSFER_SOURCE_BINDING_V0.5.json
          test -f research/mexc_global_assets/MEXC_GLOBALASSET_TRANSFER_RULE_V0.5.json
          test -f research/mexc_global_assets/MEXC_GLOBALASSET_TRANSFER_FREEZE_V0.5.md
          python -m py_compile research/mexc_global_assets/mexc_globalasset_transfer_asset_v05.py
          echo V05_PRE_OUTCOME_FREEZE_PASS
      - name: Evaluate frozen asset
        run: python research/mexc_global_assets/mexc_globalasset_transfer_asset_v05.py --target "${{ matrix.target }}" --external "${{ matrix.external }}"
      - name: Upload asset receipt
        uses: actions/upload-artifact@v4
        with:
          name: ga-v05-${{ matrix.target }}
          path: artifacts/mexc_global_assets/globalasset_transfer_v05/assets/${{ matrix.target }}.json
          if-no-files-found: error
          retention-days: 90

  aggregate:
    needs: evaluate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: ga-v05-*
          path: artifacts/mexc_global_assets/globalasset_transfer_v05/assets
          merge-multiple: true
      - name: Aggregate frozen family
        run: python research/mexc_global_assets/mexc_globalasset_transfer_aggregate_v05.py
      - name: Upload family closeout
        uses: actions/upload-artifact@v4
        with:
          name: mexc-globalasset-transfer-v05-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/mexc_global_assets/globalasset_transfer_v05
          if-no-files-found: error
          retention-days: 90
