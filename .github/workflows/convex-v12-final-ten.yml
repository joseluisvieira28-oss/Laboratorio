name: CONVEX V12 Final Ten Readonly Tests and Windows Build
on:
  push:
    branches:
      - 'feature/convex-v12-final-ten-canas-readonly-2026-10-15'
  pull_request:
    paths:
      - 'engine/three_convex_v12/**'
      - '.github/workflows/convex-v12-final-ten.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify pinned V5 SHA and V12 invariants (no network / keys)
        shell: bash
        run: |
          test "$(git hash-object engine/three_convex_v05/vendor/V5_PARENT_PINNED_SOURCE.py.txt)" = "19c8b8e2363f253458db42111b6701f3a3ef1f4b"
          python -m unittest discover -s engine/three_convex_v12 -p 'test_*.py' -v
  windows-package:
    needs: tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build and smoke-test standalone V12
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check pyinstaller==6.16.0
          python -m PyInstaller --noconfirm --clean --onefile --name V12_FinalFour_Signals --paths . --add-data 'engine/three_convex_v05/vendor/V5_PARENT_PINNED_SOURCE.py.txt;engine/three_convex_v05/vendor' engine/three_convex_v12/watcher.py
          & dist/V12_FinalFour_Signals.exe --help
          if ($LASTEXITCODE -ne 0) { throw 'V12_COMPILED_EXE_STARTUP_FAILED' }
          (Get-FileHash dist/V12_FinalFour_Signals.exe -Algorithm SHA256).Hash.ToLowerInvariant() | Set-Content dist/SHA256_EXE.txt
          Copy-Item engine/three_convex_v12/windows/*.ps1 dist/
          Compress-Archive -Path dist/V12_FinalFour_Signals.exe,dist/SHA256_EXE.txt,dist/*.ps1 -DestinationPath CONVEX_V12_FINAL_TEN_WINDOWS.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: CONVEX_V12_FINAL_TEN_WINDOWS_NOT_INSTALLED
          path: CONVEX_V12_FINAL_TEN_WINDOWS.zip
          retention-days: 14
