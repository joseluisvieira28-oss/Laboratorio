name: source-t0-probe-v20-secret-legacy-archives

on:
  push:
    branches:
      - cosmos-native-emission-param-shock-001-v0.2-t0-remediation-2026-10-07
    paths:
      - .github/workflows/source-t0-probe-v20-secret-legacy-archives.yml

permissions:
  contents: read

jobs:
  secret-legacy-archives:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Probe historically documented Secret archive/index endpoints
        shell: bash
        run: |
          python3 - <<'PY'
          import json, ssl, urllib.request, concurrent.futures
          from datetime import datetime, timezone

          TARGET="2023-12-07T02:54:58.930543213Z"
          TT=datetime.fromisoformat(TARGET.replace("Z","+00:00")).timestamp()
          UA={"User-Agent":"CryptoLab-source-only-secret-v20"}
          RPCS=[
            "https://secret-4.api.trivium.network:26657",
            "https://scrt-rpc.blockpane.com",
            "https://rpc.secret.forbole.com",
            "https://scrt-rpc.agoranodes.com",
            "https://rpc.spartanapi.dev",
            "https://secret.rpc.consensus.one",
            "https://secretnetwork-rpc.stakely.io",
            "https://scrt.public-rpc.com",
            "https://rpc.lavenderfive.com:443/secretnetwork",
            "https://rpc.mainnet.secretsaturn.net",
            "https://rpc-secret.01node.com",
          ]
          LCDS=[
            "https://secret-4.api.trivium.network:1317",
            "https://scrt-lcd.blockpane.com",
            "https://api.secret.forbole.com",
            "https://lcd.spartanapi.dev",
            "https://secret.api.consensus.one",
            "https://secretnetwork-lcd.stakely.io",
            "https://scrt-lcd.agoranodes.com",
            "https://rest.lavenderfive.com:443/secretnetwork",
            "https://lcd.mainnet.secretsaturn.net",
            "https://rest-secret.01node.com",
          ]
          def get(url,to=8):
            try:
              req=urllib.request.Request(url,headers=UA)
              with urllib.request.urlopen(req,timeout=to,context=ssl._create_unverified_context()) as r:
                raw=r.read().decode("utf-8","replace")
                try:data=json.loads(raw)
                except:data=raw[:4000]
                return {"ok":True,"status":r.status,"url":r.geturl(),"data":data}
            except Exception as e:
              return {"ok":False,"url":url,"error":repr(e)}
          def parse_time(x):
            d=x.get("data")
            candidates=[]
            try:candidates.append(d["result"]["block"]["header"]["time"])
            except:pass
            try:candidates.append(d["block"]["header"]["time"])
            except:pass
            try:candidates.append(d["sdk_block"]["header"]["time"])
            except:pass
            for t in candidates:
              try:return datetime.fromisoformat(t.replace("Z","+00:00")).timestamp(),t
              except:pass
            return None
          def compact(x):
            if not x.get("ok"): return {"ok":False,"error":x.get("error"),"url":x.get("url")}
            z=parse_time(x)
            out={"ok":True,"status":x.get("status"),"url":x.get("url")}
            if z: out["time"]=z[1]
            d=x.get("data")
            try:
              h=d["result"]["block"]["header"]
              out["height"]=h.get("height");out["hash"]=d["result"].get("block_id",{}).get("hash")
            except:pass
            try:
              h=d["block"]["header"]
              out["height"]=h.get("height")
            except:pass
            return out

          # Search grid is intentionally limited to source metadata only.
          grid=[11752974,11770000,11790000,11810000,11830000,11850000,11870000,11890000,11910000,11930000]
          endpoints=[]
          for b in RPCS:
            endpoints += [("rpc",b,h,b.rstrip("/")+"/block?height="+str(h)) for h in grid]
          for b in LCDS:
            endpoints += [("lcd",b,h,b.rstrip("/")+"/cosmos/base/tendermint/v1beta1/blocks/"+str(h)) for h in grid]

          rows=[]
          def one(t):
            kind,base,h,url=t
            r=get(url)
            return {"kind":kind,"base":base,"probe_height":h,"response":compact(r),"raw":r if r.get("ok") and parse_time(r) else None}
          with concurrent.futures.ThreadPoolExecutor(max_workers=32) as ex:
            for row in ex.map(one,endpoints):
              if row["response"].get("ok") and row["response"].get("time"):
                rows.append(row)

          out={"scope":"SOURCE_ONLY_NO_MARKET_DATA","target":TARGET,
               "documented_sources":{"rpc":RPCS,"lcd":LCDS},
               "successful_grid": [{k:v for k,v in r.items() if k!="raw"} for r in rows],
               "brackets":[],"exact":[]}

          # find a time bracket per provider
          by={}
          for r in rows:
            z=parse_time(r["raw"])
            if not z: continue
            by.setdefault((r["kind"],r["base"]),[]).append((r["probe_height"],z[0],z[1]))
          for (kind,base),pts in by.items():
            pts.sort()
            for a,b in zip(pts,pts[1:]):
              if a[1] < TT <= b[1]:
                out["brackets"].append({"kind":kind,"base":base,"lo":a,"hi":b})
                break

          # Binary-search first block whose timestamp >= voting end.
          for q in out["brackets"]:
            kind,base=q["kind"],q["base"]
            L,R=int(q["lo"][0]),int(q["hi"][0]);err=None
            def fetch_h(h):
              u=(base.rstrip("/")+"/block?height="+str(h)) if kind=="rpc" else (base.rstrip("/")+"/cosmos/base/tendermint/v1beta1/blocks/"+str(h))
              return get(u)
            while L<R:
              M=(L+R)//2
              rr=fetch_h(M);z=parse_time(rr)
              if not z:
                err={"height":M,"response":compact(rr)};break
              if z[0]>=TT:R=M
              else:L=M+1
            rec={"kind":kind,"base":base,"error":err}
            if err is None:
              H=L;rec["H_vote_end_block"]=H;rec["neighbors"]=[]
              for h in range(H-1,H+3):
                rr=fetch_h(h);z=parse_time(rr)
                row={"height":h,"block":compact(rr)}
                if kind=="rpc":
                  br=get(base.rstrip("/")+"/block_results?height="+str(h))
                  row["block_results"]={"ok":br.get("ok"),"status":br.get("status"),"error":br.get("error")}
                  if br.get("ok"):
                    data=br.get("data",{});events=[]
                    def scan(x):
                      if isinstance(x,dict):
                        typ=x.get("type")
                        if typ in ("active_proposal","proposal_vote","param_change","mint"):
                          events.append(x)
                        for v in x.values():scan(v)
                      elif isinstance(x,list):
                        for v in x:scan(v)
                    scan(data)
                    row["relevant_events"]=events[:80]
                rec["neighbors"].append(row)
            out["exact"].append(rec)

          print("SECRET_LEGACY_V20_BEGIN")
          print(json.dumps(out,indent=2,sort_keys=True)[:800000])
          print("SECRET_LEGACY_V20_END")
          PY
