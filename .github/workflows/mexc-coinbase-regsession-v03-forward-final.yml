name: MEXC COINBASE V0.3 Forward Final Evaluation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  final-forward-evaluation:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mexc-coinbase-regsession-v0.3-forward-freeze-2026-10-04
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependency
        run: python -m pip install --disable-pip-version-check requests
      - name: Frozen authority check
        run: |
          test -f research/mexc_global_assets/MEXC_COINBASE_REGSESSION_FORWARD_RULE_V0.3.json
          test -f research/mexc_global_assets/MEXC_COINBASE_REGSESSION_FORWARD_BINDING_V0.3.json
          test -f research/mexc_global_assets/MEXC_COINBASE_REGSESSION_FORWARD_FREEZE_V0.3.md
          python -m py_compile research/mexc_global_assets/mexc_coinbase_regsession_forward_v03.py
          echo FORWARD_FREEZE_BOUND
      - name: Evaluate only after full frozen window
        run: python research/mexc_global_assets/mexc_coinbase_regsession_forward_v03.py
      - name: Upload immutable final forward evidence
        uses: actions/upload-artifact@v4
        with:
          name: mexc-coinbase-forward-v03-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/mexc_global_assets/coinbase_regsession_forward_v03
          if-no-files-found: error
          retention-days: 90