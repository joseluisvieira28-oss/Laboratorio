name: MLRTS V0.1.3 History Index Recovery Probe

on:
  push:
    branches: [mexc-launchpool-reward-token-sellpressure-v0.1-2026-10-08]
    paths:
      - 'research/mexc_launchpool_reward_token_sellpressure/history_index_bruteforce_probe_v013.py'
      - '.github/workflows/mlrts_v013_history_index_probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - run: python research/mexc_launchpool_reward_token_sellpressure/history_index_bruteforce_probe_v013.py
      - uses: actions/upload-artifact@v4
        with:
          name: mlrts-v013-history-index-probe
          path: artifacts/mlrts_v013_history_index_bruteforce/
          retention-days: 90
