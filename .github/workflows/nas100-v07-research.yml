name: NAS100 V07 Frozen Research

on:
  push:
    branches:
      - mexc-hl-nas100-dislocation-v0.7-source-valid-window-2026-10-04
    paths:
      - 'research/mexc_global_assets/MEXC_HL_NAS100_DISLOCATION_RULE_V0.7.json'
      - 'research/mexc_global_assets/MEXC_HL_NAS100_DISLOCATION_FREEZE_V0.7.md'
      - 'research/mexc_global_assets/mexc_hl_nas100_dislocation_v07.py'
      - '.github/workflows/nas100-v07-research.yml'

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install requests
        run: python -m pip install --disable-pip-version-check requests
      - name: Preflight
        run: |
          test "$GITHUB_REF_NAME" = "mexc-hl-nas100-dislocation-v0.7-source-valid-window-2026-10-04"
          python -m py_compile research/mexc_global_assets/mexc_hl_nas100_dislocation_v07.py
          python - <<'PY'
          import json, hashlib
          from pathlib import Path
          p=Path('research/mexc_global_assets/MEXC_HL_NAS100_DISLOCATION_RULE_V0.7.json')
          x=json.loads(p.read_text())
          assert x['version']=='0.7'
          assert x['outcomes_opened_at_freeze']==0
          assert x['thresholds_bps']==[10,20,40,80]
          assert x['entry_delay_min']==1
          assert x['horizons_min']==[1,2,5,15]
          assert x['windows']['discovery_start']=='2026-10-01T00:00:00Z'
          assert x['windows']['discovery_end']=='2026-10-03T00:00:00Z'
          assert x['windows']['oos_start']=='2026-10-03T00:00:00Z'
          assert x['windows']['oos_end']=='2026-10-04T09:00:00Z'
          assert x['parameter_rescue_authorized'] is False
          assert x['live_trading_authorized'] is False
          print('RULE_SHA256='+hashlib.sha256(p.read_bytes()).hexdigest())
          print('PRE_OUTCOME_FREEZE_PASS')
          PY
      - name: Run frozen research
        run: python research/mexc_global_assets/mexc_hl_nas100_dislocation_v07.py
      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: nas100-v07-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/mexc_global_assets/mexc_hl_nas100_dislocation_v07
          if-no-files-found: error
          retention-days: 90
