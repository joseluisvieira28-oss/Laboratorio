name: DLS Marginfi Orca Relative-Intensity OOS V0.1

on:
  push:
    branches:
      - dls-marginfi-orca-relative-intensity-oos-v01
    paths:
      - labs/DEFI_LIQUIDATION_SHOCK_001/LAUNCH_MARGINFI_ORCA_RELATIVE_INTENSITY_OOS_V01.marker

permissions:
  actions: read
  contents: read

jobs:
  oos:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download exact READY selection artifact
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 36815529203
          artifact-ids: 11141660030
          path: selection

      - name: Compile frozen OOS executor
        run: python -m py_compile labs/DEFI_LIQUIDATION_SHOCK_001/source/run_marginfi_orca_relative_intensity_oos_v0_1.py

      - name: Execute frozen Oct-Dec OOS
        run: >
          python labs/DEFI_LIQUIDATION_SHOCK_001/source/run_marginfi_orca_relative_intensity_oos_v0_1.py
          --selection-root selection
          --workers 8

      - name: Upload immutable OOS evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dls-marginfi-orca-relative-intensity-oos-v01
          path: |
            labs/DEFI_LIQUIDATION_SHOCK_001/MARGINFI_ORCA_RELATIVE_INTENSITY_OOS_V01_RECEIPT.json
            labs/DEFI_LIQUIDATION_SHOCK_001/MARGINFI_ORCA_RELATIVE_INTENSITY_OOS_V01_LEDGER.ndjson
            labs/DEFI_LIQUIDATION_SHOCK_001/MARGINFI_ORCA_RELATIVE_INTENSITY_OOS_V01_MARKET_DATA_MANIFEST.ndjson
          if-no-files-found: warn
          retention-days: 90

      - name: Firewall
        if: always()
        run: echo OOS_ONLY_2025_2026_CLOSED_NO_TRADING
