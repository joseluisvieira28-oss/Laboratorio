name: Binance Margin Borrow Access 001 — Event Parse V0.1.1

on:
  push:
    branches:
      - binance-margin-borrow-access-v0.1
    paths:
      - research/binance_margin_borrow_access/event_parser_v011.py
      - research/binance_margin_borrow_access/BINANCE_MARGIN_BORROW_ACCESS_001_EVENT_PARSER_SEMANTIC_ERRATUM_V0_1_1.md
      - .github/workflows/binance-margin-borrow-access-event-parse-v011.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  parse:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        shard: [0,1,2,3]
    steps:
      - uses: actions/checkout@v4
        name: Checkout frozen research branch
      - uses: actions/setup-python@v5
        name: Set up Python
        with:
          python-version: '3.12'
      - name: Install source dependencies
        run: pip install --disable-pip-version-check requests beautifulsoup4
      - name: Compile strict parser
        run: python -m py_compile research/binance_margin_borrow_access/event_parser_v011.py
      - name: Parse frozen event shard V0.1.1
        run: >-
          python research/binance_margin_borrow_access/event_parser_v011.py shard
          --input research/binance_margin_borrow_access/BINANCE_MARGIN_BORROW_ACCESS_001_EVENT_SOURCE_SCHEMA_INPUT_V0_1.json
          --shard ${{ matrix.shard }} --out event_parse_v011_shard_${{ matrix.shard }}
      - name: Upload event parse shard
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BINANCE_MARGIN_BORROW_ACCESS_001_EVENT_PARSE_V0_1_1_SHARD_${{ matrix.shard }}
          path: event_parse_v011_shard_${{ matrix.shard }}/event_parse_v011_shard_${{ matrix.shard }}.json
          if-no-files-found: warn
          retention-days: 30
  aggregate:
    runs-on: ubuntu-latest
    needs: parse
    if: always()
    steps:
      - uses: actions/checkout@v4
        name: Checkout frozen research branch
      - uses: actions/setup-python@v5
        name: Set up Python
        with:
          python-version: '3.12'
      - name: Install parser dependencies
        run: pip install --disable-pip-version-check requests beautifulsoup4
      - name: Download all strict parse shards
        uses: actions/download-artifact@v4
        with:
          pattern: BINANCE_MARGIN_BORROW_ACCESS_001_EVENT_PARSE_V0_1_1_SHARD_*
          path: event_parse_v011_shards
      - name: Aggregate canonical strict event parse
        run: >-
          python research/binance_margin_borrow_access/event_parser_v011.py aggregate
          --input research/binance_margin_borrow_access/BINANCE_MARGIN_BORROW_ACCESS_001_EVENT_SOURCE_SCHEMA_INPUT_V0_1.json
          --shards event_parse_v011_shards --out event_parse_v011_canonical
      - name: Upload canonical strict receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BINANCE_MARGIN_BORROW_ACCESS_001_EVENT_PARSE_V0_1_1
          path: event_parse_v011_canonical/BINANCE_MARGIN_BORROW_ACCESS_001_EVENT_PARSE_RECEIPT_V0_1_1.json
          if-no-files-found: warn
          retention-days: 30
