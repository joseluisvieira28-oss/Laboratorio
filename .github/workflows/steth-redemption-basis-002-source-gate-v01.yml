name: STETH Redemption Basis 002 — Source Gate V0.1

on:
  push:
    branches:
      - steth-redemption-basis-002-source-v0.1
    paths:
      - '.github/workflows/steth-redemption-basis-002-source-gate-v01.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests 'eth-hash[pycryptodome]'
      - name: Verify prospective source authority
        run: |
          test -f research/steth_redemption_basis_002/STETH_REDEMPTION_BASIS_002_PRE_SOURCE_AUTHORITY_V0_1.md
          test -f research/steth_redemption_basis_002/STETH_REDEMPTION_BASIS_002_TIMESTAMP_MAPPING_TRANSPORT_CLARIFICATION_V0_1A.md
          python -m py_compile research/steth_redemption_basis_002/source_gate_v01.py
          python - <<'PY'
          import importlib.util
          from pathlib import Path
          p=Path('research/steth_redemption_basis_002/source_gate_v01.py')
          spec=importlib.util.spec_from_file_location('s',p)
          m=importlib.util.module_from_spec(spec); spec.loader.exec_module(m)
          assert m.LAB_ID=='STETH-REDEMPTION-BASIS-002'
          assert m.START_TS==1684238400
          assert m.END_TS==1735646400
          assert m.EXPECTED_SNAPSHOTS==596
          assert m.EXPECTED_ACTIVATION_BLOCK==17266004
          assert m.QUORUM==2 and len(m.PROVIDERS)==3
          print('STETH002_SOURCE_AUTHORITY_GUARD_PASS')
          PY
      - name: Execute source-only gate
        run: python research/steth_redemption_basis_002/source_gate_v01.py
      - name: Enforce hard firewall
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('out/steth_redemption_basis_002/STETH_REDEMPTION_BASIS_002_SOURCE_GATE_V0_1.json')
          assert p.exists()
          x=json.loads(p.read_text())
          assert x['classification'] in {
            'SOURCE_DATA_PASS','SOURCE_ACQUISITION_TECHNICAL_FAILURE',
            'PROVENANCE_FAILURE','INSUFFICIENT_SOURCE_COVERAGE'
          }
          s=x['safety']
          assert s['state_values_printed_or_interpreted'] is False
          assert s['event_payloads_decoded'] is False
          assert s['market_prices_opened'] is False
          assert s['returns_opened'] is False
          assert s['pnl_opened'] is False
          assert s['accessed_2025_or_2026'] is False
          assert s['live_trading'] is False
          assert s['exchange_mutation'] is False
          print('STETH002_SOURCE_FIREWALL_PASS',x['classification'])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: STETH_REDEMPTION_BASIS_002_SOURCE_GATE_V0_1
          path: out/steth_redemption_basis_002/STETH_REDEMPTION_BASIS_002_SOURCE_GATE_V0_1.json
          if-no-files-found: error
          retention-days: 90
