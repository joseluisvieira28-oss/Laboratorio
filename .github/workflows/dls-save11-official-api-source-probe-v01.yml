name: DLS Save11 Official API Schema Probe V0.1

on:
  push:
    branches:
      - dls-save11-official-api-source-probe-v0.1
    paths:
      - '.github/workflows/dls-save11-official-api-source-probe-v01.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dls-save11-official-api-source-probe-v0.1
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile
        run: python -m py_compile labs/DEFI_LIQUIDATION_SHOCK_001/source/probe_save11_official_api_schema_v0_1.py
      - name: Probe official API schema only
        run: python labs/DEFI_LIQUIDATION_SHOCK_001/source/probe_save11_official_api_schema_v0_1.py
      - name: Persist schema receipt
        run: |
          git config user.name "crypto-lab-source-audit"
          git config user.email "actions@users.noreply.github.com"
          git add labs/DEFI_LIQUIDATION_SHOCK_001/SAVE11_OFFICIAL_API_SOURCE_PROBE_RECEIPT_V0.1.json
          git commit -m "dls: persist Save11 official API schema probe receipt v0.1" || true
          git push origin HEAD:dls-save11-official-api-source-probe-v0.1
