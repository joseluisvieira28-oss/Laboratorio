name: ETH Staking Flow 001 — Xatu Parquet Metadata V0.2C

on:
  workflow_dispatch:
  push:
    branches:
      - eth-staking-flow-v0.1
    paths:
      - '.github/workflows/eth-staking-flow-xatu-parquet-metadata-v02c.yml'

permissions:
  contents: read

jobs:
  parquet-metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install metadata dependencies
        run: pip install --disable-pip-version-check pyarrow fsspec aiohttp
      - name: Static compile
        run: python -m py_compile research/eth_staking_flow/xatu_parquet_metadata_v02c.py
      - name: Execute protected-safe Parquet metadata gate
        run: python research/eth_staking_flow/xatu_parquet_metadata_v02c.py
      - name: Upload metadata receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ETH_STAKING_FLOW_001_XATU_PARQUET_METADATA_V0_2C
          path: xatu_parquet_metadata_v02c_output/ETH_STAKING_FLOW_001_XATU_PARQUET_METADATA_V0_2C.json
          if-no-files-found: warn
          retention-days: 30
