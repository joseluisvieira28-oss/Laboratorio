name: EBST provider qualification v0.1a
on:
  push:
    branches: [eth-blockspace-state-transition-v0.1]
    paths:
      - 'research/eth_blockspace_state_transition/provider_qual_v01a.py'
      - '.github/workflows/ebst-provider-qual-v01a.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python research/eth_blockspace_state_transition/provider_qual_v01a.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ebst-provider-qual-v01a
          path: EBST_PROVIDER_QUAL_V0_1A.json
