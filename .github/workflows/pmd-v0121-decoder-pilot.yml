name: PMD-001 V0121 Decoder Remediation Pilot
on:
  push:
    branches: [pumpfun-migration-direction-v0.1]
    paths:
      - 'Dream-Account-OS-v2.3-PARTIAL/research/pumpfun_migration_direction_001/RUN_V0121_DECODER_PILOT.trigger'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pumpfun-migration-direction-v0.1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --upgrade pip requests solders
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: joseluisvieira28-oss/Laboratorio
          run-id: 35311098471
          name: PMD-001-v012-fullsource-pilot-v07
          path: fullsource-pilot
      - name: Run quote-aware decoder remediation
        working-directory: Dream-Account-OS-v2.3-PARTIAL/research/pumpfun_migration_direction_001
        run: |
          python extract_chain_exact_features_v0121.py             --input-root "$GITHUB_WORKSPACE/fullsource-pilot"             --out-dir "$GITHUB_WORKSPACE/v0121-pilot"
      - name: Assert remediation invariants
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("v0121-pilot/chain_exact_features_v012_receipt.json").read_text())
          assert r["economic_outcomes_opened"] is False
          assert r["promotion_authority"] is False
          assert r["summary_rows"]==4 and r["unique_mints"]==4
          assert r["decoder_complete_w30"]==4
          assert r["decoder_complete_w60"]==4
          assert r["decoder_complete_w300"]==4
          assert r["sol_volume_complete_w30"]==3
          assert r["sol_volume_complete_w60"]==3
          assert r["sol_volume_complete_w300"]==3
          assert r["undecoded_trade_intents"]==0
          print(json.dumps(r,indent=2,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: PMD-001-v0121-decoder-pilot
          retention-days: 30
          path: v0121-pilot/
