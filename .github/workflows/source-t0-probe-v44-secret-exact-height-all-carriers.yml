name: source-t0-probe-v44-secret-exact-height-all-carriers

on:
  workflow_dispatch:
  push:
    branches:
      - cosmos-native-emission-param-shock-001-v0.2-t0-remediation-2026-10-07
    paths:
      - .github/workflows/source-t0-probe-v44-secret-exact-height-all-carriers.yml

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cosmos-native-emission-param-shock-001-v0.2-t0-remediation-2026-10-07

      - name: Query exact Secret consensus heights across all 2023-era IBC carriers
        shell: bash
        run: |
          python3 - <<'PY'
          import json, urllib.request, urllib.error, ssl, hashlib, os, datetime
          from concurrent.futures import ThreadPoolExecutor, as_completed

          OUT="research/cosmos_native_emission_param_shock_001_v0_2/SCRT287_EXACT_HEIGHT_ALL_CARRIERS_V44.json"
          HEIGHTS=[11880918,11880919,11880920,11880921,11880922]
          TARGET_NS=1701917698930543213
          UA={"User-Agent":"CryptoLab-source-only-secret-v44","Accept":"application/json"}
          carrier_names=[
            "osmosis","cosmoshub","juno","evmos","stride","terra2","kujira","axelar",
            "stargaze","injective","persistence","quicksilver","gravitybridge","crescent",
            "chihuahua","agoric","sentinel","sifchain","terra","coreum","noble","archway",
            "migaloo","comdex","jackal"
          ]
          extras={
            "osmosis":["https://rpc.archive.osmosis.zone"],
            "cosmoshub":["https://rpc.cosmoshub-4-archive.citizenweb3.com"],
            "juno":["https://juno-rpc.publicnode.com"],
            "axelar":["https://axelar-rpc.publicnode.com","https://axelar-rpc.polkachu.com"],
            "terra2":["https://terra-rpc.polkachu.com"],
            "injective":["https://injective-rpc.publicnode.com","https://injective-rpc.polkachu.com"],
            "evmos":["https://evmos-rpc.publicnode.com"],
            "stargaze":["https://stargaze-rpc.polkachu.com"],
            "kujira":["https://kujira-rpc.polkachu.com"],
          }

          def get(url,to=10):
              try:
                  q=urllib.request.Request(url,headers=UA)
                  with urllib.request.urlopen(q,timeout=to,context=ssl._create_unverified_context()) as r:
                      return {"ok":True,"status":r.status,"raw":r.read()}
              except Exception as e:return {"ok":False,"error":repr(e),"raw":b""}

          # Current registry endpoints are only transport discovery; historical eligibility
          # is supplied by the frozen 2023-era carrier list above.
          endpoints={}
          for name in carrier_names:
              eps=list(extras.get(name,[]))
              u=f"https://raw.githubusercontent.com/cosmos/chain-registry/master/{name}/chain.json"
              r=get(u,8)
              if r["ok"]:
                  try:
                      d=json.loads(r["raw"])
                      for x in ((d.get("apis") or {}).get("rpc") or []):
                          a=x.get("address") if isinstance(x,dict) else None
                          if a:eps.append(a.rstrip("/"))
                  except:pass
              eps.append(f"https://rpc.cosmos.directory/{name}")
              seen=[] 
              for e in eps:
                  e=e.rstrip("/")
                  if e not in seen:seen.append(e)
              endpoints[name]=seen[:10]

          def post(base,payload,to=10):
              data=json.dumps(payload).encode()
              q=urllib.request.Request(base,data=data,headers={**UA,"Content-Type":"application/json"},method="POST")
              try:
                  with urllib.request.urlopen(q,timeout=to,context=ssl._create_unverified_context()) as r:
                      b=r.read()
                      return {"ok":True,"status":r.status,"sha256":hashlib.sha256(b).hexdigest(),"raw":b}
              except urllib.error.HTTPError as e:
                  try:b=e.read()
                  except:b=b""
                  return {"ok":False,"status":e.code,"error":str(e),"raw":b}
              except Exception as e:return {"ok":False,"status":None,"error":repr(e),"raw":b""}

          def varint(b,i):
              x=0;s=0
              while True:
                  if i>=len(b):raise ValueError("truncated")
                  c=b[i];i+=1;x|=(c&127)<<s
                  if not c&128:return x,i
                  s+=7
          def fields(b):
              i=0;o=[]
              while i<len(b):
                  try:k,i=varint(b,i)
                  except:break
                  n,w=k>>3,k&7
                  if w==0:
                      v,i=varint(b,i);o.append((n,w,v))
                  elif w==1:
                      if i+8>len(b):break
                      o.append((n,w,b[i:i+8]));i+=8
                  elif w==2:
                      ln,i=varint(b,i)
                      if i+ln>len(b):break
                      o.append((n,w,b[i:i+ln]));i+=ln
                  elif w==5:
                      if i+4>len(b):break
                      o.append((n,w,b[i:i+4]));i+=4
                  else:break
              return o
          def fget(fs,n,w=None):
              for a,b,c in fs:
                  if a==n and (w is None or b==w):return c
              return None
          def decode(hx):
              af=fields(bytes.fromhex(hx));v=fget(af,2,2);hf=fields(v);sh=fget(hf,1,2)
              sf=fields(sh);hd=fget(sf,1,2);tf=fields(hd)
              chain=fget(tf,2,2).decode();height=int(fget(tf,3,0));tm=fget(tf,4,2)
              tfs=fields(tm);sec=int(fget(tfs,1,0));nano=int(fget(tfs,2,0) or 0)
              dt=datetime.datetime.fromtimestamp(sec,tz=datetime.timezone.utc)
              ts=dt.strftime("%Y-%m-%dT%H:%M:%S")+("."+(f"{nano:09d}").rstrip("0") if nano else "")+"Z"
              return {"chain_id":chain,"height":height,"time":ts,"time_ns":sec*10**9+nano,
                      "header_hex_sha256":hashlib.sha256(bytes.fromhex(hx)).hexdigest()}

          def probe(job):
              cname,base,h=job
              qstr=f"update_client.consensus_height='4-{h}'"
              payload={"jsonrpc":"2.0","id":1,"method":"tx_search",
                       "params":{"query":qstr,"prove":False,"page":"1","per_page":"100","order_by":"asc"}}
              r=post(base,payload,9)
              row={"carrier":cname,"endpoint":base,"height":h,"ok":r["ok"],
                   "status":r.get("status"),"error":r.get("error"),"sha256":r.get("sha256"),"matches":[]}
              if not r["ok"]:return row
              try:d=json.loads(r["raw"]);txs=(d.get("result") or {}).get("txs") or []
              except Exception as e:
                  row["parse_error"]=repr(e);return row
              for tx in txs:
                  for ev in (tx.get("tx_result") or {}).get("events") or []:
                      if ev.get("type")!="update_client":continue
                      aa={a.get("key"):a.get("value") for a in ev.get("attributes") or []}
                      if aa.get("consensus_height")!=f"4-{h}":continue
                      hx=aa.get("header");dh=None;err=None
                      if hx:
                          try:dh=decode(hx)
                          except Exception as e:err=repr(e)
                      row["matches"].append({
                          "carrier_height":int(tx["height"]),"carrier_tx_hash":tx.get("hash"),
                          "client_id":aa.get("client_id"),"decoded_header":dh,"decode_error":err
                      })
              return row

          jobs=[]
          for cname,eps in endpoints.items():
              for ep in eps:
                  for h in HEIGHTS:jobs.append((cname,ep,h))
          rows=[]
          with ThreadPoolExecutor(max_workers=60) as ex:
              futs=[ex.submit(probe,j) for j in jobs]
              for f in as_completed(futs):rows.append(f.result())

          recovered=[]
          for row in rows:
              for m in row["matches"]:
                  dh=m.get("decoded_header")
                  if dh and dh.get("chain_id")=="secret-4" and dh.get("height")==row["height"]:
                      recovered.append({**dh,"carrier":row["carrier"],"endpoint":row["endpoint"],
                                        "client_id":m.get("client_id"),"carrier_height":m["carrier_height"],
                                        "carrier_tx_hash":m["carrier_tx_hash"]})
          uniq={(x["height"],x["time"],x["carrier_tx_hash"]):x for x in recovered}
          recovered=sorted(uniq.values(),key=lambda x:(x["height"],x["time_ns"]))

          known=[
            {"height":11880917,"time":"2023-12-07T02:54:47.127200661Z","time_ns":1701917687127200661,
             "carrier":"osmosis","source":"V38B"},
            *recovered
          ]
          # 922 should also be present through recovered; keep known anchor if transport endpoint failed now.
          if not any(x["height"]==11880922 and x["time_ns"]>=TARGET_NS for x in known):
              known.append({"height":11880922,"time":"2023-12-07T02:55:33.936725313Z","time_ns":1701917733936725313,
                            "carrier":"osmosis","source":"V38B"})
          before=[x for x in known if x["time_ns"]<TARGET_NS]
          after=[x for x in known if x["time_ns"]>=TARGET_NS]
          lo=max(before,key=lambda x:x["height"]) if before else None
          hi=min(after,key=lambda x:x["height"]) if after else None
          exact=None
          if lo and hi and hi["height"]==lo["height"]+1:
              exact={"H_vote_end_block":hi["height"],"T0_first_new_param_mint_block":hi["height"]+1,
                     "H_minus_1":lo,"H":hi,"boundary_verified":True,
                     "proof_type":"adjacent signed secret-4 Tendermint headers found by exact consensus-height search across 2023-era IBC carriers"}

          out={"scope":"SOURCE_ONLY_NO_MARKET_DATA",
               "target_voting_end":"2023-12-07T02:54:58.930543213Z",
               "historical_carrier_basis":"carrier set frozen from 2023-10-24 chain-registry relationships plus known prior links",
               "tested_utc":datetime.datetime.now(datetime.timezone.utc).isoformat(),
               "endpoints":endpoints,"probe_count":len(rows),"rows":rows,
               "recovered_secret_headers":recovered,
               "combined_nearest":{"lo":lo,"hi":hi} if lo and hi else None,
               "exact_candidate":exact}
          os.makedirs(os.path.dirname(OUT),exist_ok=True)
          with open(OUT,"w") as f:json.dump(out,f,indent=2)
          print("V44",json.dumps({
              "probe_count":len(rows),
              "recovered":[{"h":x["height"],"t":x["time"],"carrier":x["carrier"],"client":x["client_id"]} for x in recovered],
              "nearest":out["combined_nearest"],"exact":exact
          }))
          PY

      - name: Persist V44
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/cosmos_native_emission_param_shock_001_v0_2/SCRT287_EXACT_HEIGHT_ALL_CARRIERS_V44.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "SCRT287: persist exact-height all-carrier search v44"
          git pull --rebase origin cosmos-native-emission-param-shock-001-v0.2-t0-remediation-2026-10-07
          git push origin HEAD:cosmos-native-emission-param-shock-001-v0.2-t0-remediation-2026-10-07
