name: Crypto Index Rebalance Source Preflight

on:
  pull_request:
    branches: [main]
    paths:
      - 'research/crypto_index_rebalance_flow/**'
      - '.github/workflows/crypto_index_rebalance_source_preflight.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-preflight:
    if: github.head_ref == 'crypto-index-rebalance-flow-v0.1' || github.ref_name == 'crypto-index-rebalance-flow-v0.1'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run source-only preflight
        run: python research/crypto_index_rebalance_flow/source_preflight.py
      - name: Enforce outcome firewall
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("artifacts/crypto_index_rebalance_flow/source_preflight_receipt.json")
          x=json.loads(p.read_text())
          assert x["prices_read"] is False
          assert x["returns_computed"] is False
          assert x["pnl_computed"] is False
          assert x["orders"] is False
          assert x["exchange_mutation"] is False
          print("OUTCOME_FIREWALL_PASS")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: CRYPTO_INDEX_REBALANCE_SOURCE_PREFLIGHT
          path: artifacts/crypto_index_rebalance_flow/source_preflight_receipt.json
          if-no-files-found: error
