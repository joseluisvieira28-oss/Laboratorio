name: source-t0-probe-v33-secret-explorer-wayback-simple

on:
  push:
    branches:
      - cosmos-native-emission-param-shock-001-v0.2-t0-remediation-2026-10-07
    paths:
      - .github/workflows/source-t0-probe-v33-secret-explorer-wayback-simple.yml

permissions:
  contents: write

jobs:
  explorer-wayback:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cosmos-native-emission-param-shock-001-v0.2-t0-remediation-2026-10-07

      - name: Probe public explorer APIs/pages and Wayback metadata only
        run: |
          python - <<'PY'
          import json, urllib.request, urllib.error, hashlib, datetime, os
          from concurrent.futures import ThreadPoolExecutor

          TARGET="2023-12-07T02:54:58.930543213Z"
          OUT="research/cosmos_native_emission_param_shock_001_v0_2/SCRT287_EXPLORER_WAYBACK_PROBE_V33.json"
          UA={"User-Agent":"CryptoLab-source-only-secret-v33/1.0"}

          def get(url, timeout=15):
              try:
                  req=urllib.request.Request(url,headers=UA)
                  with urllib.request.urlopen(req,timeout=timeout) as r:
                      b=r.read()
                      return {
                        "ok":True,"status":getattr(r,"status",200),"url":url,
                        "content_type":r.headers.get("content-type",""),
                        "sha256":hashlib.sha256(b).hexdigest(),
                        "body":b.decode("utf-8","replace")[:250000],
                      }
              except urllib.error.HTTPError as e:
                  try:b=e.read()
                  except Exception:b=b""
                  return {
                    "ok":False,"status":e.code,"url":url,"error":str(e),
                    "sha256":hashlib.sha256(b).hexdigest() if b else None,
                    "body":b.decode("utf-8","replace")[:30000],
                  }
              except Exception as e:
                  return {"ok":False,"url":url,"error":repr(e)}

          # Heights are discovery probes only. No height is promoted unless the
          # provider itself returns matching immutable height+timestamp metadata.
          heights=[11752974,11800000,11840000,11860000,11875000,11880000,11885000,11890000,11900000,11920000]
          templates=[
            ("cosmostation_blocks","https://api-secret.cosmostation.io/blocks/{h}"),
            ("cosmostation_block","https://api-secret.cosmostation.io/block/{h}"),
            ("cosmostation_v1_blocks","https://api-secret.cosmostation.io/v1/blocks/{h}"),
            ("cosmostation_lcd","https://lcd-secret.cosmostation.io/cosmos/base/tendermint/v1beta1/blocks/{h}"),
            ("mintscan_page","https://www.mintscan.io/secret/block/{h}"),
            ("atomscan_page","https://atomscan.com/secret-network/block/{h}"),
            ("ping_page","https://ping.pub/secret/block/{h}"),
            ("zonescan_secret_page","https://zonescan.io/secret/blocks/{h}"),
          ]

          def extract_json_metadata(body, requested):
              try:d=json.loads(body)
              except Exception:return None
              stack=[d]
              while stack:
                  x=stack.pop()
                  if isinstance(x,dict):
                      h=x.get("height",x.get("block_height",x.get("blockHeight")))
                      t=x.get("time",x.get("timestamp",x.get("block_time",x.get("blockTime"))))
                      if h is not None and t is not None:
                          try:
                              if int(h)==int(requested):
                                  return {
                                    "height":int(h),"time":str(t),
                                    "hash":x.get("hash",x.get("block_hash",x.get("blockHash"))),
                                  }
                          except Exception:pass
                      stack.extend(x.values())
                  elif isinstance(x,list):
                      stack.extend(x)
              return None

          rows=[]
          jobs=[]
          with ThreadPoolExecutor(max_workers=24) as ex:
              for name,tpl in templates:
                  for h in heights:
                      jobs.append((name,h,ex.submit(get,tpl.format(h=h),15)))
              for name,h,f in jobs:
                  r=f.result()
                  p=extract_json_metadata(r.get("body",""),h)
                  rows.append({
                    "source":name,"requested_height":h,"url":r.get("url"),
                    "ok":r.get("ok"),"status":r.get("status"),
                    "content_type":r.get("content_type"),"sha256":r.get("sha256"),
                    "parsed_matching_metadata":p,"error":r.get("error"),
                    "body_excerpt":r.get("body","")[:3000],
                  })

          cdx_urls=[
            "https://web.archive.org/cdx/search/cdx?url=www.mintscan.io/secret/block/*&from=20231201&to=20231215&output=json&filter=statuscode:200&collapse=urlkey&limit=1000",
            "https://web.archive.org/cdx/search/cdx?url=atomscan.com/secret-network/block/*&from=20231201&to=20231215&output=json&filter=statuscode:200&collapse=urlkey&limit=1000",
            "https://web.archive.org/cdx/search/cdx?url=ping.pub/secret/block/*&from=20231201&to=20231215&output=json&filter=statuscode:200&collapse=urlkey&limit=1000",
            "https://web.archive.org/cdx/search/cdx?url=secretnodes.com/secret/*&from=20231201&to=20231215&output=json&filter=statuscode:200&collapse=urlkey&limit=1000",
          ]
          cdx=[]
          for u in cdx_urls:
              r=get(u,25)
              capture_count=None
              try:
                  z=json.loads(r.get("body",""))
                  if isinstance(z,list): capture_count=max(0,len(z)-1)
              except Exception:pass
              cdx.append({
                "url":u,"ok":r.get("ok"),"status":r.get("status"),
                "capture_count":capture_count,"sha256":r.get("sha256"),
                "error":r.get("error"),"body_excerpt":r.get("body","")[:15000],
              })

          exact=[r for r in rows if r.get("parsed_matching_metadata")]
          out={
            "scope":"SOURCE_ONLY_NO_MARKET_DATA",
            "target_voting_end":TARGET,
            "scientific_rules_changed":False,
            "rule":"Discovery heights are not evidence. Only provider-returned matching immutable block height+timestamp metadata can advance T0.",
            "tested_utc":datetime.datetime.now(datetime.timezone.utc).isoformat(),
            "exact_metadata_rows":exact,
            "exact_metadata_count":len(exact),
            "explorer_rows":rows,
            "wayback_cdx":cdx,
            "verdict":"EXPLORER_METADATA_FOUND" if exact else "EXPLORER_METADATA_NOT_RECOVERED",
          }
          os.makedirs(os.path.dirname(OUT),exist_ok=True)
          with open(OUT,"w",encoding="utf-8") as f:json.dump(out,f,indent=2,ensure_ascii=False)
          print(json.dumps({
            "exact_metadata_count":len(exact),
            "wayback_capture_counts":[x.get("capture_count") for x in cdx],
            "verdict":out["verdict"],
          },indent=2))
          PY

      - name: Persist explorer/Wayback receipt
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/cosmos_native_emission_param_shock_001_v0_2/SCRT287_EXPLORER_WAYBACK_PROBE_V33.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "SCRT287: persist explorer and Wayback source probe v33"
          git push origin HEAD:cosmos-native-emission-param-shock-001-v0.2-t0-remediation-2026-10-07
