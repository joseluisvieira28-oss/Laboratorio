name: Aave Gov LT State Enum V29
on:
  push:
    branches: [aave-gov-lt-forced-deleveraging-v0.1]
    paths:
      - '.github/workflows/aave-gov-lt-state-enum-v29.yml'
      - 'research/aave_gov_lt_forced_deleveraging/state_enum_v29.py'
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pycryptodome==3.23.0
      - run: python research/aave_gov_lt_forced_deleveraging/state_enum_v29.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aave-gov-lt-state-enum-v29
          path: out/aave_state_enum_v29
          retention-days: 30
