name: source-t0-probe-v08-secret-alt

on:
  push:
    branches:
      - cosmos-native-emission-param-shock-001-v0.2-t0-remediation-2026-10-07
    paths:
      - .github/workflows/source-t0-probe-v08-secret-alt.yml

permissions:
  contents: read

jobs:
  secret-alt:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Probe remaining public Secret sources
        shell: bash
        run: |
          python3 - <<'PY'
          import json, urllib.request, ssl
          from datetime import datetime
          UA={"User-Agent":"CryptoLab-secret-alt/0.8"}
          T="2023-12-07T02:54:58.930543213Z"
          TT=datetime.fromisoformat(T.replace("Z","+00:00")).timestamp()

          rpc=[
            "https://rpc.ankr.com/http/scrt_cosmos",
            "https://rpc.ankr.com/http/scrt",
            "https://rpc-secret.whispernode.com",
            "https://secretnetwork-rpc.highstakes.ch",
            "https://secret-4.api.trivium.network:26657",
          ]
          lcd=[
            "https://secretnetwork-api.highstakes.ch:1317",
            "https://lcd.archive.scrt.marionode.com",
            "https://scrt-lcd.blockpane.com",
          ]
          def get(url,timeout=8):
            try:
              q=urllib.request.Request(url,headers=UA)
              ctx=ssl._create_unverified_context()
              with urllib.request.urlopen(q,timeout=timeout,context=ctx) as r:
                raw=r.read().decode("utf-8","replace")
                try:d=json.loads(raw)
                except:d=raw[:10000]
                return {"ok":True,"status":r.status,"data":d,"url":url}
            except Exception as e:return {"ok":False,"error":repr(e),"url":url}
          def parse(x):
            try:
              h=x["data"]["result"]["block"]["header"]
              return {"height":int(h["height"]),"time":h["time"],"hash":x["data"]["result"]["block_id"]["hash"]}
            except:return None
          out={"scope":"SOURCE_ONLY_NO_MARKET_DATA","target":T,"rpc":{},"lcd":{}}
          grid=[11752974,11800000,11840000,11880000,11920000]
          for p in rpc:
            rows={}
            good=[]
            for h in grid:
              x=get(p.rstrip("/")+f"/block?height={h}")
              b=parse(x)
              rows[str(h)]=b or {"ok":x["ok"],"error":x.get("error"),"status":x.get("status"),"data":x.get("data")}
              if b:good.append(b)
            rec={"grid":rows}
            good=sorted(good,key=lambda z:z["height"])
            bracket=None
            for a,b in zip(good,good[1:]):
              ta=datetime.fromisoformat(a["time"].replace("Z","+00:00")).timestamp()
              tb=datetime.fromisoformat(b["time"].replace("Z","+00:00")).timestamp()
              if ta<TT<=tb: bracket=(a,b);break
            if bracket:
              rec["bracket"]={"lo":bracket[0],"hi":bracket[1]}
              L,R=bracket[0]["height"],bracket[1]["height"]
              while L<R:
                M=(L+R)//2
                x=get(p.rstrip("/")+f"/block?height={M}",10); b=parse(x)
                if not b:rec["binary_error"]={"height":M,"raw":x};break
                tb=datetime.fromisoformat(b["time"].replace("Z","+00:00")).timestamp()
                if tb>=TT:R=M
                else:L=M+1
              if "binary_error" not in rec:
                H=L;rec["H"]=H;rec["neighbors"]={}
                for h in range(H-2,H+3):
                  x=get(p.rstrip("/")+f"/block?height={h}",10)
                  rec["neighbors"][str(h)]=parse(x) or x
                rec["block_results"]={}
                for h in (H-1,H,H+1,H+2):
                  rec["block_results"][str(h)]=get(p.rstrip("/")+f"/block_results?height={h}",10)
                out["rpc"][p]=rec
                break
            out["rpc"][p]=rec

          for p in lcd:
            rows={}
            for h in grid:
              x=get(p.rstrip("/")+f"/cosmos/base/tendermint/v1beta1/blocks/{h}")
              if not x["ok"]: x=get(p.rstrip("/")+f"/blocks/{h}")
              rows[str(h)]=x
            out["lcd"][p]=rows

          print("SECRET_ALT_V08_BEGIN")
          print(json.dumps(out,indent=2,sort_keys=True)[:800000])
          print("SECRET_ALT_V08_END")
          PY
