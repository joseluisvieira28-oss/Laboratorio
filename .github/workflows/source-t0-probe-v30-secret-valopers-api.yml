name: source-t0-probe-v30-secret-valopers-api

on:
  workflow_dispatch:
  push:
    branches:
      - cosmos-native-emission-param-shock-001-v0.2-t0-remediation-2026-10-07
    paths:
      - .github/workflows/source-t0-probe-v30-secret-valopers-api.yml

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cosmos-native-emission-param-shock-001-v0.2-t0-remediation-2026-10-07

      - name: Reverse engineer public Valopers API and probe Secret block metadata
        shell: bash
        run: |
          python3 - <<'PY'
          import json,re,urllib.request,urllib.error,urllib.parse,hashlib,os,datetime
          from concurrent.futures import ThreadPoolExecutor

          TARGET="2023-12-07T02:54:58.930543213Z"
          OUT="research/cosmos_native_emission_param_shock_001_v0_2/SCRT287_VALOPERS_API_PROBE_V30.json"
          UA={"User-Agent":"Mozilla/5.0 CryptoLab-source-only-secret-v30"}

          def get(u,to=15):
              q=urllib.request.Request(u,headers=UA)
              try:
                  with urllib.request.urlopen(q,timeout=to) as r:
                      b=r.read()
                      return {"ok":True,"status":getattr(r,"status",200),"url":r.geturl(),
                              "content_type":r.headers.get("content-type",""),
                              "sha256":hashlib.sha256(b).hexdigest(),
                              "body":b.decode("utf-8","replace")[:1200000]}
              except urllib.error.HTTPError as e:
                  try:b=e.read()
                  except Exception:b=b""
                  return {"ok":False,"status":e.code,"url":u,"error":str(e),
                          "sha256":hashlib.sha256(b).hexdigest() if b else None,
                          "body":b.decode("utf-8","replace")[:100000]}
              except Exception as e:
                  return {"ok":False,"status":None,"url":u,"error":repr(e),"body":""}

          def find_block(body,requested=None):
              try:d=json.loads(body)
              except Exception:return None
              def walk(x):
                  if isinstance(x,dict):
                      keys={str(k).lower() for k in x}
                      if keys & {"price","market_cap","marketcap","volume_24h","price_usd"}:
                          return None
                      h=x.get("height") or x.get("block_height") or x.get("blockHeight")
                      t=x.get("time") or x.get("timestamp") or x.get("block_time") or x.get("blockTime")
                      hs=x.get("hash") or x.get("block_hash") or x.get("blockHash")
                      if h is not None and t is not None:
                          try:
                              hh=int(h)
                              if requested is None or hh==requested:
                                  return {"height":hh,"time":str(t),"hash":hs}
                          except Exception: pass
                      for v in x.values():
                          z=walk(v)
                          if z:return z
                  elif isinstance(x,list):
                      for v in x:
                          z=walk(v)
                          if z:return z
                  return None
              return walk(d)

          api="https://api.valopers.com"
          docs_paths=["/","/docs","/redoc","/openapi.json","/swagger.json","/api/openapi.json","/api/swagger.json","/v1/openapi.json"]
          docs=[]
          for p in docs_paths:
              r=get(api+p,15)
              docs.append({"path":p,"ok":r.get("ok"),"status":r.get("status"),"url":r.get("url"),
                           "content_type":r.get("content_type"),"sha256":r.get("sha256"),
                           "error":r.get("error"),"body_excerpt":r.get("body","")[:30000]})

          home=get("https://secret.valopers.com",15)
          html=home.get("body","")
          refs=[]
          for pat in [r'<script[^>]+src=["\']([^"\']+)["\']',r'<link[^>]+href=["\']([^"\']+)["\']']:
              refs += re.findall(pat,html,re.I)
          refs=[urllib.parse.urljoin("https://secret.valopers.com",x) for x in refs if "_next/static/" in x]
          refs=list(dict.fromkeys(refs))[:120]

          bundles=[]
          route_literals=set()
          for u in refs:
              r=get(u,20)
              b=r.get("body","")
              contexts=[]
              for needle in ["api.valopers.com","fetch(","axios","/blocks","/block","proposals","networks","chains"]:
                  pos=0
                  while len(contexts)<160:
                      pos=b.lower().find(needle.lower(),pos)
                      if pos<0:break
                      contexts.append({"needle":needle,"excerpt":b[max(0,pos-600):pos+1800]})
                      pos+=len(needle)
              for m in re.finditer(r'["\']([^"\']{1,220})["\']',b):
                  s=m.group(1)
                  sl=s.lower()
                  if any(k in sl for k in ["block","proposal","chain","network"]) and ("/" in s or "api." in sl):
                      route_literals.add(s)
              bundles.append({"url":u,"ok":r.get("ok"),"status":r.get("status"),
                              "sha256":r.get("sha256"),"contexts":contexts[:160],"error":r.get("error")})

          anchor=11752974
          candidates=[
            "/secret/blocks/{h}","/secret/block/{h}",
            "/secretnetwork/blocks/{h}","/secretnetwork/block/{h}",
            "/secret-network/blocks/{h}","/secret-network/block/{h}",
            "/chains/secret/blocks/{h}","/chains/secret/block/{h}",
            "/chains/secretnetwork/blocks/{h}","/chains/secretnetwork/block/{h}",
            "/v1/secret/blocks/{h}","/v1/secret/block/{h}",
            "/v1/secretnetwork/blocks/{h}","/v1/secretnetwork/block/{h}",
            "/api/secret/blocks/{h}","/api/secret/block/{h}",
            "/blocks/secret/{h}","/block/secret/{h}",
            "/blocks/secretnetwork/{h}","/block/secretnetwork/{h}",
          ]

          # Add discovered literal-like templates conservatively.
          for s in list(route_literals):
              if s.startswith("http") and "api.valopers.com" in s:
                  try:
                      p=urllib.parse.urlparse(s).path
                  except Exception:
                      continue
              else:
                  p=s
              if not isinstance(p,str) or not p.startswith("/"): continue
              if "block" not in p.lower(): continue
              q=re.sub(r'\$\{[^}]+\}',"{h}",p)
              q=re.sub(r'\[[^\]]*height[^\]]*\]',"{h}",q,flags=re.I)
              q=re.sub(r':(?:height|blockHeight|block_height|id)\b',"{h}",q,flags=re.I)
              if "{h}" in q and len(q)<220:
                  candidates.append(q)
          candidates=list(dict.fromkeys(candidates))

          route_tests=[]
          with ThreadPoolExecutor(max_workers=24) as ex:
              futs=[]
              for p in candidates[:120]:
                  url=api+p.format(h=anchor)
                  futs.append((p,ex.submit(get,url,12)))
              for p,f in futs:
                  r=f.result(); z=find_block(r.get("body",""),anchor)
                  route_tests.append({"template":p,"url":r.get("url"),"ok":r.get("ok"),"status":r.get("status"),
                                      "parsed":z,"sha256":r.get("sha256"),"error":r.get("error"),
                                      "body_excerpt":r.get("body","")[:2200]})

          winners=[x["template"] for x in route_tests if x.get("parsed") and x["parsed"]["height"]==anchor]
          exact={}
          grid=[11752974,11820000,11850000,11870000,11885000,11900000,11920000]

          def parse_time(s):
              ss=str(s)
              if ss.endswith("Z"): ss=ss[:-1]+"+00:00"
              return datetime.datetime.fromisoformat(ss).timestamp()
          tt=parse_time(TARGET)

          for tpl in winners:
              pts=[]
              for h in grid:
                  rr=get(api+tpl.format(h=h),12); z=find_block(rr.get("body",""),h)
                  if z:
                      try: pts.append((h,parse_time(z["time"]),z))
                      except Exception: pass
              pts.sort(); br=None
              for a,b in zip(pts,pts[1:]):
                  if a[1] < tt <= b[1]: br=(a,b);break
              rec={"grid":[x[2] for x in pts],"bracket":None}
              if br:
                  rec["bracket"]={"lo":br[0][2],"hi":br[1][2]}
                  L,R=br[0][0],br[1][0];err=None
                  while L<R:
                      M=(L+R)//2
                      rr=get(api+tpl.format(h=M),12); z=find_block(rr.get("body",""),M)
                      if not z:
                          err={"height":M,"status":rr.get("status"),"error":rr.get("error")};break
                      try: tv=parse_time(z["time"])
                      except Exception as e:
                          err={"height":M,"time":z.get("time"),"error":repr(e)};break
                      if tv < tt:L=M+1
                      else:R=M
                  rec["binary_error"]=err
                  if err is None:
                      H=L; neigh=[]
                      for h in [H-1,H,H+1]:
                          rr=get(api+tpl.format(h=h),15);z=find_block(rr.get("body",""),h)
                          neigh.append({"requested":h,"parsed":z,"status":rr.get("status"),"sha256":rr.get("sha256"),
                                        "error":rr.get("error"),"body_excerpt":rr.get("body","")[:3200]})
                      rec["H_vote_end_block"]=H
                      rec["T0_first_new_param_mint_block"]=H+1
                      rec["neighbors"]=neigh
              exact[tpl]=rec

          out={
              "scope":"SOURCE_ONLY_NO_MARKET_DATA",
              "target_voting_end":TARGET,
              "api_base":api,
              "tested_utc":datetime.datetime.now(datetime.timezone.utc).isoformat(),
              "rule":"No estimated height may be promoted. PASS requires immutable H-1/H/H+1 block metadata around voting_end.",
              "docs_probes":docs,
              "frontend_refs":refs,
              "bundle_discovery":bundles,
              "route_literals":sorted(route_literals)[:1000],
              "route_tests":route_tests,
              "winners":winners,
              "exact":exact,
          }
          os.makedirs(os.path.dirname(OUT),exist_ok=True)
          with open(OUT,"w",encoding="utf-8") as f:json.dump(out,f,indent=2,ensure_ascii=False)
          print("SCRT287_V30_RESULT",json.dumps({
              "winner_count":len(winners),
              "winners":winners,
              "route_literal_count":len(route_literals),
              "docs_ok":[x["path"] for x in docs if x["ok"]],
              "exact":{k:{"H":v.get("H_vote_end_block"),"T0":v.get("T0_first_new_param_mint_block"),"error":v.get("binary_error")} for k,v in exact.items()}
          }))
          PY

      - name: Persist V30 source-only receipt
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/cosmos_native_emission_param_shock_001_v0_2/SCRT287_VALOPERS_API_PROBE_V30.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "SCRT287: persist Valopers API probe v30"
          git push origin HEAD:cosmos-native-emission-param-shock-001-v0.2-t0-remediation-2026-10-07
