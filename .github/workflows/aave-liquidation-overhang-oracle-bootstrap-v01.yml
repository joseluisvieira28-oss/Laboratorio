name: AAVE Liquidation Overhang 001 — Oracle Bootstrap V0.1

on:
  push:
    branches:
      - aave-liquidation-overhang-v0.1
    paths:
      - research/aave_liquidation_overhang/oracle_bootstrap_provenance.py
      - research/aave_liquidation_overhang/AAVE_LIQUIDATION_OVERHANG_001_ORACLE_BOOTSTRAP_AUTHORITY_V0_1.md
      - .github/workflows/aave-liquidation-overhang-oracle-bootstrap-v01.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  oracle-bootstrap-provenance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout frozen research branch
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install source dependencies
        run: pip install --disable-pip-version-check requests 'eth-hash[pycryptodome]'
      - name: Execute bootstrap provenance recovery
        run: python research/aave_liquidation_overhang/oracle_bootstrap_provenance.py
      - name: Upload bootstrap provenance receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AAVE_LIQUIDATION_OVERHANG_001_ORACLE_BOOTSTRAP_V0_1
          path: oracle_bootstrap_output/AAVE_LIQUIDATION_OVERHANG_001_ORACLE_BOOTSTRAP_RECEIPT_V0_1.json
          if-no-files-found: warn
          retention-days: 30
