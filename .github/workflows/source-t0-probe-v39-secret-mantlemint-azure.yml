name: source-t0-probe-v39-secret-mantlemint-azure

on:
  workflow_dispatch:
  push:
    branches:
      - cosmos-native-emission-param-shock-001-v0.2-t0-remediation-2026-10-07
    paths:
      - .github/workflows/source-t0-probe-v39-secret-mantlemint-azure.yml

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cosmos-native-emission-param-shock-001-v0.2-t0-remediation-2026-10-07

      - name: Enumerate public Mantlemint Azure archive container
        shell: bash
        run: |
          python3 - <<'PY'
          import json,urllib.request,urllib.error,ssl,hashlib,os,datetime,re,xml.etree.ElementTree as ET

          OUT="research/cosmos_native_emission_param_shock_001_v0_2/SCRT287_MANTLEMINT_AZURE_V39.json"
          UA={"User-Agent":"CryptoLab-source-only-secret-v39","Accept":"*/*"}
          base="https://engfilestorage.blob.core.windows.net"
          container="mm-snapshots"

          def req(url,method="GET",headers=None,to=20):
              h=dict(UA); h.update(headers or {})
              try:
                  q=urllib.request.Request(url,headers=h,method=method)
                  with urllib.request.urlopen(q,timeout=to,context=ssl._create_unverified_context()) as r:
                      b=b"" if method=="HEAD" else r.read()
                      return {"ok":True,"status":getattr(r,"status",200),"url":r.geturl(),
                              "headers":dict(r.headers),
                              "sha256":hashlib.sha256(b).hexdigest() if b else None,
                              "body":b.decode("utf-8","replace")[:1500000]}
              except urllib.error.HTTPError as e:
                  try:b=e.read()
                  except:b=b""
                  return {"ok":False,"status":e.code,"url":url,"headers":dict(e.headers or {}),
                          "error":str(e),"sha256":hashlib.sha256(b).hexdigest() if b else None,
                          "body":b.decode("utf-8","replace")[:200000]}
              except Exception as e:
                  return {"ok":False,"status":None,"url":url,"headers":{},"error":repr(e),"body":""}

          # Anonymous Azure container listing (with pagination markers if public).
          listings=[]
          blobs=[]
          marker=""
          for _ in range(20):
              url=f"{base}/{container}?restype=container&comp=list&maxresults=5000"
              if marker:
                  import urllib.parse
                  url += "&marker="+urllib.parse.quote(marker,safe="")
              r=req(url,to=25)
              rec={"url":url,"ok":r["ok"],"status":r.get("status"),"headers":r.get("headers"),
                   "sha256":r.get("sha256"),"error":r.get("error"),"body_excerpt":r.get("body","")[:50000]}
              listings.append(rec)
              if not r["ok"]: break
              try:
                  root=ET.fromstring(r["body"])
                  for b in root.findall(".//Blob"):
                      name=(b.findtext("Name") or "")
                      props=b.find("Properties")
                      blobs.append({
                        "name":name,
                        "url":f"{base}/{container}/{name}",
                        "content_length": (props.findtext("Content-Length") if props is not None else None),
                        "last_modified": (props.findtext("Last-Modified") if props is not None else None),
                        "etag": (props.findtext("Etag") if props is not None else None),
                        "content_type": (props.findtext("Content-Type") if props is not None else None),
                      })
                  marker=root.findtext("NextMarker") or ""
              except Exception as e:
                  rec["xml_parse_error"]=repr(e); break
              if not marker: break

          # Known documented blob and any discovered height-named blobs.
          known=f"{base}/{container}/height_3340000.tar"
          k=req(known,"HEAD",to=20)
          known_head={"url":known,"ok":k["ok"],"status":k.get("status"),"headers":k.get("headers"),"error":k.get("error")}

          height_blobs=[]
          for b in blobs:
              m=re.search(r'height[_-](\d+)',b["name"],re.I)
              if m:
                  b=dict(b);b["height"]=int(m.group(1));height_blobs.append(b)
          height_blobs.sort(key=lambda x:x["height"])

          # We only use rough location to prioritize discovery. No estimated height can be promoted.
          targetish=[b for b in height_blobs if 11500000 <= b["height"] <= 12500000]
          post_target=[b for b in height_blobs if b["height"] >= 11800000]
          closest=sorted(height_blobs,key=lambda b:abs(b["height"]-11860000))[:20]

          # HEAD every targetish object to establish present availability/size.
          heads=[]
          for b in targetish[:200]:
              r=req(b["url"],"HEAD",to=15)
              heads.append({"name":b["name"],"height":b["height"],"url":b["url"],"ok":r["ok"],
                            "status":r.get("status"),"headers":r.get("headers"),"error":r.get("error")})

          out={
            "scope":"SOURCE_ONLY_NO_MARKET_DATA",
            "candidate":"SCRT Proposal 287",
            "target_voting_end":"2023-12-07T02:54:58.930543213Z",
            "official_mantlemint_doc_claims":{
              "fully_archival":True,
              "historical_state_height_query":True,
              "documented_snapshot_url":known,
              "doc_note":"Mantlemint documentation says snapshots are fully archival and the earlier snapshot starts around block 3,340,000."
            },
            "tested_utc":datetime.datetime.now(datetime.timezone.utc).isoformat(),
            "container_listings":listings,
            "blob_count":len(blobs),
            "blobs":blobs,
            "height_blob_count":len(height_blobs),
            "height_blobs":height_blobs,
            "targetish_blobs":targetish,
            "post_target_blob_count":len(post_target),
            "closest_to_search_region":closest,
            "targetish_head_checks":heads,
            "known_snapshot_head":known_head,
            "rule":"Discovery only. Exact T0 requires immutable chain/event/state evidence from an artifact; rough height proximity is not proof."
          }
          os.makedirs(os.path.dirname(OUT),exist_ok=True)
          with open(OUT,"w") as f:json.dump(out,f,indent=2)
          print("V39",json.dumps({
            "blob_count":len(blobs),
            "height_blob_count":len(height_blobs),
            "targetish":[{"name":x["name"],"height":x["height"],"size":x.get("content_length"),"modified":x.get("last_modified")} for x in targetish[:50]],
            "known_snapshot_head":{"ok":known_head["ok"],"status":known_head["status"],"headers":known_head.get("headers")}
          }))
          PY

      - name: Persist
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/cosmos_native_emission_param_shock_001_v0_2/SCRT287_MANTLEMINT_AZURE_V39.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "SCRT287: persist Mantlemint Azure archive probe v39"
          git pull --rebase origin cosmos-native-emission-param-shock-001-v0.2-t0-remediation-2026-10-07
          git push origin HEAD:cosmos-native-emission-param-shock-001-v0.2-t0-remediation-2026-10-07
