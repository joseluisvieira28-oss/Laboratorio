name: licp-hist-002-external-event-source-v02

on:
  push:
    branches:
      - liquidation-cascade-propagation-v0.1
    paths:
      - 'research/liquidation_cascade/LICP_HIST_002_EXTERNAL_EVENT_SOURCE_FREEZE_V0_2.md'
      - 'research/liquidation_cascade/licp_hist_002_external_event_source_v02.py'
      - '.github/workflows/licp-hist-002-external-event-source-v02.yml'

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pandas pyarrow
      - run: python research/liquidation_cascade/licp_hist_002_external_event_source_v02.py
      - if: always()
        run: cat research/liquidation_cascade/receipts/licp_hist_002_external_event_source_v02.json || true
