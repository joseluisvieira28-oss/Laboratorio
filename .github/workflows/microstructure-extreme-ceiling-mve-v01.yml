name: microstructure-extreme-ceiling-mve-v01

on:
  push:
    branches:
      - microstructure-scalping-lab-v0.1
    paths:
      - 'research/microstructure_scalping/extreme_state_ceiling_mve_v01.py'
      - 'research/microstructure_scalping/EXTREME_STATE_ECONOMIC_CEILING_MVE_V0_1_FREEZE.md'
      - '.github/workflows/microstructure-extreme-ceiling-mve-v01.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extreme-ceiling:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run optimistic maker economic ceiling MVE
        run: python -m research.microstructure_scalping.extreme_state_ceiling_mve_v01
      - name: Print receipt
        if: always()
        run: cat research/microstructure_scalping/receipts/extreme_state_ceiling_mve_v01.json || true
