name: Hyperliquid HIP3 Equity Source Census V0.1

on:
  push:
    branches:
      - hyperliquid-hip3-equity-target-v0.1-source-census-2026-10-04

permissions:
  contents: read

jobs:
  census:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependency
        run: python -m pip install --disable-pip-version-check requests
      - name: Source-only freeze check
        run: |
          test "$GITHUB_REF_NAME" = "hyperliquid-hip3-equity-target-v0.1-source-census-2026-10-04"
          test -f research/hyperliquid_equity/HYPERLIQUID_HIP3_EQUITY_SOURCE_CENSUS_FREEZE_V0.1.md
          python -m py_compile research/hyperliquid_equity/hyperliquid_hip3_equity_source_v01.py
          echo HIP3_EQUITY_SOURCE_ONLY_PASS
      - name: Run public HIP3 equity census
        run: python research/hyperliquid_equity/hyperliquid_hip3_equity_source_v01.py
      - name: Upload immutable source evidence
        uses: actions/upload-artifact@v4
        with:
          name: hyperliquid-hip3-equity-source-v01-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/hyperliquid_equity/hip3_equity_source_v01
          if-no-files-found: error
          retention-days: 90