name: BTC-OPTIONS-VRP-001 BBO Source Sample Gate V0.1

on:
  push:
    branches:
      - btc-options-vrp-bbo-source-v0.1

permissions:
  contents: read

concurrency:
  group: btc-options-vrp-bbo-source-sample-gate-v01
  cancel-in-progress: false

jobs:
  source-sample-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: btc-options-vrp-bbo-source-v0.1

      - name: Verify frozen source authority
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          a=json.load(open('labs/BTC_OPTIONS_VRP_001/BBO_SOURCE_RECON_AUTHORITY_V0.1.json'))
          assert a['source_mve_id']=='OVRP-EXEC-BBO-001-SOURCE'
          assert a['drive_recon_id']=='1aGVfq83qdKf0FkIoa_8QWZUoebQSge73Ay4Opye2Iho'
          assert a['outcomes_authorized'] is False
          assert a['access_2025_authorized'] is False
          assert a['access_2026_authorized'] is False
          assert a['live_trading_authorized'] is False
          assert a['exchange_mutation_authorized'] is False
          assert a['merge_to_main_authorized'] is False
          print('BBO_SOURCE_AUTHORITY_PASS')
          PY

      - name: Compile source-only gate
        run: python -m py_compile labs/BTC_OPTIONS_VRP_001/bbo_source_sample_gate_v01.py

      - name: Execute free Tardis source sample gate
        run: python labs/BTC_OPTIONS_VRP_001/bbo_source_sample_gate_v01.py

      - name: Upload source evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: btc-options-vrp-bbo-source-sample-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/btc_options_vrp_bbo_source_sample_gate_v01/
          retention-days: 90
          if-no-files-found: warn
