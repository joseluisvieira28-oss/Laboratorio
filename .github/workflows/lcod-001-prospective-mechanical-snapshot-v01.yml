name: LCOD-001 prospective mechanical snapshot V0.1

on:
  workflow_call:
    inputs:
      canonical_trigger:
        description: "Count this invocation as the canonical scheduled forward observation"
        required: false
        type: boolean
        default: false
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lcod-001-prospective-mechanical-snapshot-v01
  cancel-in-progress: false

jobs:
  canonical_preflight:
    runs-on: ubuntu-latest
    outputs:
      allow_run: ${{ steps.gate.outputs.allow_run }}
      gate_reason: ${{ steps.gate.outputs.gate_reason }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: liquidation-convexity-oracle-distance-001-source-gate-v0.1
      - name: Verify frozen scientific core
        run: python research/liquidation_convexity_oracle_distance_001/lcod_verify_scientific_core_lock_v01.py
      - id: gate
        env:
          LCOD_CANONICAL_TRIGGER: ${{ inputs.canonical_trigger || false }}
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone, time
          from pathlib import Path
          canonical = str(os.environ.get("LCOD_CANONICAL_TRIGGER","false")).lower() in ("1","true","yes")
          if not canonical:
              print("allow_run=true")
              print("gate_reason=diagnostic_or_noncanonical")
              with open(os.environ["GITHUB_OUTPUT"],"a") as f:
                  f.write("allow_run=true\n")
                  f.write("gate_reason=diagnostic_or_noncanonical\n")
              raise SystemExit(0)
          now=datetime.now(timezone.utc)
          today=now.date().isoformat()
          now_t=now.time().replace(tzinfo=None)
          in_window=(now_t >= time(3,17) and now_t < time(12,0))
          if not in_window:
              print("allow_run=false")
              print("gate_reason=outside_frozen_canonical_window")
              with open(os.environ["GITHUB_OUTPUT"],"a") as f:
                  f.write("allow_run=false\n")
                  f.write("gate_reason=outside_frozen_canonical_window\n")
              raise SystemExit(0)
          root=Path("research/liquidation_convexity_oracle_distance_001/forward_snapshots")
          existing=[]
          for p in sorted(root.glob("LCOD_FORWARD_SNAPSHOT_BLOCK_*.json")):
              try:
                  x=json.loads(p.read_text())
              except Exception:
                  continue
              if x.get("classification")!="FORWARD_MECHANICAL_SNAPSHOT_PASS":
                  continue
              if x.get("observation_role")!="FORWARD_OBSERVATION":
                  continue
              ts=str(x.get("captured_at_utc",""))
              if ts[:10]==today:
                  existing.append(p.name)
          allow=not existing
          reason="no_same_day_canonical_observation" if allow else "same_day_canonical_observation_already_exists"
          print(f"allow_run={str(allow).lower()}")
          print(f"gate_reason={reason}")
          print(f"existing={existing}")
          with open(os.environ["GITHUB_OUTPUT"],"a") as f:
              f.write(f"allow_run={str(allow).lower()}\n")
              f.write(f"gate_reason={reason}\n")
          PY

  prepare:
    needs: canonical_preflight
    if: ${{ needs.canonical_preflight.outputs.allow_run == 'true' }}
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.prep.outputs.matrix }}
      block: ${{ steps.prep.outputs.block }}
      block_hash: ${{ steps.prep.outputs.block_hash }}
      code_sha: ${{ steps.rev.outputs.code_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: liquidation-convexity-oracle-distance-001-source-gate-v0.1
      - name: Verify frozen scientific core at selected code SHA
        run: python research/liquidation_convexity_oracle_distance_001/lcod_verify_scientific_core_lock_v01.py
      - id: rev
        run: echo "code_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - id: prep
        run: node research/liquidation_convexity_oracle_distance_001/lcod_active_population_prepare_v08.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: lcod-fwd-pop-prepare
          path: artifacts/lcod_active_population_prepare_v08.json
          if-no-files-found: error

  classify_population:
    needs: prepare
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.code_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-save @subsquid/evm-stream@0.1.5 ethers@6.15.0
      - name: Rebuild active population at common finalized block
        env:
          CHUNK_ID: ${{ matrix.id }}
          FROM_BLOCK: ${{ matrix.from }}
          TO_BLOCK: ${{ matrix.to }}
          FINAL_BLOCK: ${{ needs.prepare.outputs.block }}
          FINAL_HASH: ${{ needs.prepare.outputs.block_hash }}
        run: node research/liquidation_convexity_oracle_distance_001/lcod_active_population_chunk_v08.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lcod-fwd-pop-chunk-${{ matrix.id }}
          path: artifacts/lcod_active_population_chunk_*_v08.json
          if-no-files-found: error

  aggregate_population:
    needs:
      - canonical_preflight
      - prepare
      - classify_population
    if: ${{ always() && needs.canonical_preflight.outputs.allow_run == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.code_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/download-artifact@v4
        with:
          pattern: lcod-fwd-pop-*
          path: artifacts/all
          merge-multiple: true
      - name: Aggregate and enforce population gate
        run: node research/liquidation_convexity_oracle_distance_001/lcod_active_population_aggregate_v08.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lcod-fwd-population
          path: artifacts/lcod_block_pinned_active_population_v08.json
          if-no-files-found: error

  reconstruct_and_curve:
    needs:
      - prepare
      - aggregate_population
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.code_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/download-artifact@v4
        with:
          name: lcod-fwd-population
          path: artifacts/population
      - name: Bind this run's population receipt
        run: |
          cp artifacts/population/lcod_block_pinned_active_population_v08.json research/liquidation_convexity_oracle_distance_001/LCOD_BLOCK_PINNED_ACTIVE_POPULATION_RECEIPT.json
      - run: npm install --no-save @subsquid/evm-stream@0.1.5 ethers@6.15.0
      - name: Reconstruct full same-block components
        run: node research/liquidation_convexity_oracle_distance_001/lcod_full_same_block_component_reconstruction_v01.mjs
      - name: Bind component receipt locally
        run: |
          cp artifacts/lcod_full_same_block_component_reconstruction_v01.json research/liquidation_convexity_oracle_distance_001/LCOD_FULL_SAME_BLOCK_COMPONENT_RECONSTRUCTION_RECEIPT.json
      - name: Open frozen mechanical curve
        run: python research/liquidation_convexity_oracle_distance_001/lcod_open_canonical_curve_v01.py
      - name: Finalize prospective snapshot
        env:
          LCOD_SCIENTIFIC_CODE_SHA: ${{ needs.prepare.outputs.code_sha }}
          LCOD_CANONICAL_TRIGGER: ${{ inputs.canonical_trigger || false }}
        run: python research/liquidation_convexity_oracle_distance_001/lcod_finalize_forward_snapshot_v01.py
      - name: Persist compact forward snapshot
        run: |
          set -euo pipefail
          BLOCK=$(python -c "import json; print(json.load(open('artifacts/lcod_forward_mechanical_snapshot_v01.json'))['ethereum_block_number'])")
          SNAP="/tmp/LCOD_FORWARD_SNAPSHOT_BLOCK_${BLOCK}.json"
          DEST="research/liquidation_convexity_oracle_distance_001/forward_snapshots/LCOD_FORWARD_SNAPSHOT_BLOCK_${BLOCK}.json"
          cp artifacts/lcod_forward_mechanical_snapshot_v01.json "$SNAP"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git reset --hard
            git clean -fd
            git fetch origin liquidation-convexity-oracle-distance-001-source-gate-v0.1
            git checkout -B lcod-forward-persist origin/liquidation-convexity-oracle-distance-001-source-gate-v0.1
            mkdir -p "$(dirname "$DEST")"
            cp "$SNAP" "$DEST"
            python research/liquidation_convexity_oracle_distance_001/lcod_forward_series_index_v01.py
            git add "$DEST" research/liquidation_convexity_oracle_distance_001/LCOD_FORWARD_SERIES_INDEX_V0.1.json
            if git diff --cached --quiet; then
              exit 0
            fi
            git commit -m "LCOD-001: record prospective mechanical snapshot block ${BLOCK} [skip ci]"
            if git push origin HEAD:liquidation-convexity-oracle-distance-001-source-gate-v0.1; then
              exit 0
            fi
            sleep $((attempt * 5))
          done
          exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lcod-forward-mechanical-snapshot-v01
          path: |
            artifacts/lcod_full_same_block_component_reconstruction_v01.json
            research/liquidation_convexity_oracle_distance_001/LCOD_CANONICAL_COLLATERAL_STRESS_CURVE_RECEIPT.json
            artifacts/lcod_forward_mechanical_snapshot_v01.json
          if-no-files-found: warn
