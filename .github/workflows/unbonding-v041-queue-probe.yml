name: Unbonding V0.4.1 Queue Subspace Probe

on:
  push:
    branches:
      - pos-unbonding-completion-001-v0.4-index-free-census-2026-10-07
    paths:
      - "research/pos_unbonding_completion_001_v0_4_index_free/v041_queue_subspace_probe.py"
      - ".github/workflows/unbonding-v041-queue-probe.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  queue-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pos-unbonding-completion-001-v0.4-index-free-census-2026-10-07
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Probe historical staking queue subspace
        run: python research/pos_unbonding_completion_001_v0_4_index_free/v041_queue_subspace_probe.py
      - name: Commit receipt
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/pos_unbonding_completion_001_v0_4_index_free/QUEUE_SUBSPACE_PROBE_V041.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Record V0.4.1 queue subspace probe"
            git push origin HEAD:pos-unbonding-completion-001-v0.4-index-free-census-2026-10-07
          fi
