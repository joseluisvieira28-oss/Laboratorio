        run: |
          python research/mexc_event_futures/liquidation_flow_calibration_chunk_v0131.py --self-test
          python - <<'PY'
          import time,os,datetime
          first=((time.time_ns()//1_000_000)//60000+1)*60000
          assert first>int(os.environ['PRIOR_LAST'])
          deadline=int(datetime.datetime(2026,10,10,tzinfo=datetime.timezone.utc).timestamp()*1000)
          assert first+180*60000+5000<deadline
          PY
      - name: Collect source only
        run: python research/mexc_event_futures/liquidation_flow_calibration_chunk_v0131.py --minutes 180 --gate-anchor "run=37100077597;prior_A_D_manifest=receipts/priority_2026_10_07/source_manifest.json;continuation=2026-10-07" --output evidence/liquidation-calibration-chunk-g-20261007
      - id: state
        run: |
          python - <<'PY'
          import json,os,pathlib
          p=pathlib.Path('evidence/liquidation-calibration-chunk-g-20261007/calibration_bins.jsonl')
          rows=[json.loads(x) for x in p.read_text().splitlines() if x.strip()]
          last=max(r['minute_start_ms'] for r in rows)
          receipt=json.loads(p.with_name('receipt.json').read_text())
          assert all(not e for e in receipt['errors'].values()),receipt['errors']
          assert receipt['research_outcomes_opened']==0 and receipt['mexc_subscriptions']==0
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write(f'last_minute_ms={last}\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: liquidation-sourcecal-g-20261007
          path: evidence/liquidation-calibration-chunk-g-20261007/
          if-no-files-found: error
          retention-days: 90
  chunk-h:
    needs: chunk-g
    runs-on: ubuntu-latest
    timeout-minutes: 190
    outputs:
      last_minute_ms: ${{ steps.state.outputs.last_minute_ms }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
