name: Event10m BTC ETH External Public Spot Books V0.2
on:
  push:
    branches:
      - research/event10m-current-products-and-microstructure-source-2026-10-30
    paths:
      - .github/workflows/event10m-external-spot-source-v02.yml
permissions:
  contents: read
jobs:
  source-only-no-outcomes:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Install import dependency for shared source gate (no browser used)
        run: python -m pip install --disable-pip-version-check playwright==1.56.0
      - name: Two public Bybit/OKX spot books plus MEXC futures depth snapshots
        run: python research/mexc_event_direction_v01/event10m_alt_spot_source_v02.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: event10m-btc-eth-external-spot-book-source-v02
          path: artifacts/event10m_spot_source_v02/source_receipt.json
          if-no-files-found: warn
