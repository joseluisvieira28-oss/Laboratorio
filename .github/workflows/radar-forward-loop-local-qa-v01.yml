name: Radar Forward Loop Local QA V0.1

on:
  pull_request:
    branches:
      - crypto-edge-radar-postgres-v0.5

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crypto_edge_radar
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - run: python -m unittest tests.test_forward_loop_cli tests.test_forward_once_cli -v
      - run: python -m unittest discover -s tests -v
      - name: Assert Windows launcher contains no credential literal
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path("windows/START_FORWARD_LOOP_FAIL_CLOSED.bat").read_text()
          assert "RADAR_DATABASE_URL" in p
          assert "postgres://" not in p
          assert "postgresql://" not in p
          assert "python -m radar forward-loop --interval 30" in p
          print("WINDOWS_FORWARD_LOOP_FIREWALL_PASS")
          PY
