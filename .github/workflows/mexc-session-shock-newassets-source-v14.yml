name: MEXC Session Shock NewAssets Source V1.4
on:
  push:
    branches: [mexc-session-shock-newassets-v1.4-source-gate-2026-10-05]
permissions: {contents: read}
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install requests
      - run: |
          test -f research/mexc_global_assets/MEXC_SESSION_SHOCK_NEWASSET_SOURCE_FREEZE_V1.4.md
          python research/mexc_global_assets/mexc_session_shock_newassets_source_v14.py
      - uses: actions/upload-artifact@v4
        with:
          name: session-shock-newassets-source-v14-${{ github.run_id }}
          path: artifacts/mexc_global_assets/session_shock_newassets_v14_source
