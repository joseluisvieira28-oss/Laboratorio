name: BTC-CONVEX-001 prospective shadow snapshot

on:
  pull_request:
    paths:
      - '.github/workflows/btc_convex_forward_shadow_snapshot.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run deterministic prospective shadow snapshot
        run: python labs/btc-convex-trend-capture-001/prospective_shadow_snapshot_v0_1.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: BTC-CONVEX-001-PROSPECTIVE-SHADOW-SNAPSHOT-V01
          path: labs/btc-convex-trend-capture-001/evidence/PROSPECTIVE_SHADOW_SNAPSHOT_V0.1.json
