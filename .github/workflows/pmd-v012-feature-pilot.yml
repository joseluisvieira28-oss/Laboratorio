name: PMD-001 V012 Feature Pilot From Full Source
on:
  push:
    branches: [pumpfun-migration-direction-v0.1]
    paths:
      - 'Dream-Account-OS-v2.3-PARTIAL/research/pumpfun_migration_direction_001/RUN_V012_FEATURE_PILOT.trigger'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  feature-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pumpfun-migration-direction-v0.1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --upgrade pip requests solders
      - name: Download successful 4-row full-source pilot
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: joseluisvieira28-oss/Laboratorio
          run-id: 35311098471
          name: PMD-001-v012-fullsource-pilot-v07
          path: fullsource-pilot
      - name: Extract frozen V0.12 features source-only
        working-directory: Dream-Account-OS-v2.3-PARTIAL/research/pumpfun_migration_direction_001
        run: |
          python extract_chain_exact_features_v012.py             --input-root "$GITHUB_WORKSPACE/fullsource-pilot"             --out-dir "$GITHUB_WORKSPACE/feature-pilot"
      - name: Assert feature-pilot contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("feature-pilot/chain_exact_features_v012_receipt.json").read_text())
          assert r["economic_outcomes_opened"] is False
          assert r["promotion_authority"] is False
          assert r["summary_rows"]==4 and r["unique_mints"]==4
          print(json.dumps(r,indent=2,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: PMD-001-v012-feature-pilot
          retention-days: 30
          path: feature-pilot/
