name: PMD-001 V011 Flow Feature Autopsy

on:
  push:
    branches:
      - pumpfun-migration-direction-v0.1
    paths:
      - 'Dream-Account-OS-v2.3-PARTIAL/research/pumpfun_migration_direction_001/RUN_V011_FLOW_AUTOPSY.trigger'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  flow-autopsy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pumpfun-migration-direction-v0.1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip huggingface_hub pandas pyarrow numpy scipy duckdb
      - name: Download V0.8 frozen baseline outcomes
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: joseluisvieira28-oss/Laboratorio
          run-id: 35150072032
          name: PMD-001-exploratory-outcomes-v08
          path: v08-outcomes
      - name: Run causal flow feature autopsy
        run: |
          python Dream-Account-OS-v2.3-PARTIAL/research/pumpfun_migration_direction_001/flow_feature_autopsy_v011.py \
            --outcomes "$GITHUB_WORKSPACE/v08-outcomes/v08_frozen_t0_baseline_outcomes.csv" \
            --data-dir "$GITHUB_WORKSPACE/pmd_v011_data" \
            --out "$GITHUB_WORKSPACE/pmd_v011_flow_feature_autopsy.json"
      - uses: actions/upload-artifact@v4
        with:
          name: PMD-001-v011-flow-feature-autopsy
          retention-days: 30
          path: pmd_v011_flow_feature_autopsy.json
