name: MEXC V0.13 Liquidation Extended Public Source Only
on:
  push:
    branches:
      - mexc-event-futures-event-conditioned-v0.13-prereg-2026-10-03
    paths:
      - research/mexc_event_futures/LIQUIDATION_FLOW_FORWARD_CALIBRATION_FREEZE_V013_V01.md
permissions:
  contents: read
jobs:
  one-hour-public-source-only:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install websockets==15.0.1
      - name: Frozen source rejection checks
        run: python research/mexc_event_futures/priority_source_gates_v013.py --self-test
      - name: Extended public source observation without outcomes
        run: python research/mexc_event_futures/priority_source_gates_v013.py --family liquidation --seconds 3600 --output evidence/liquidation-extended-source
      - name: Preserve all raw messages and receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v013-liquidation-extended-public-source
          path: evidence/liquidation-extended-source/
          if-no-files-found: error
          retention-days: 90
