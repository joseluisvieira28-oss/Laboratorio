name: ROLL001 Morpho Borrower Funded Keeper Incentive Base Official Onchain Source V01
on:
  push:
    branches:
      - research/morpho-midnight-roll-keeper-source-v01-2026-10-30
    paths:
      - .github/workflows/roll001-morpho-base-public-source-v01.yml
permissions:
  contents: read
jobs:
  source-only:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify exact official Base event ABI topic and fail closed decoders
        run: |
          python -m py_compile research/morpho_roll_keeper_001/roll001_source_gate.py
          python -c "import sys;sys.path.insert(0,'research/morpho_roll_keeper_001');import roll001_source_gate as m;m.tests();print('ABI_DECODE_UNIT_TESTS_PASS')"
      - name: Single bounded read-only RPC original contract and exact 8192 block event log scan
        run: python research/morpho_roll_keeper_001/roll001_source_gate.py
      - if: always()
        name: Archive exact public RPC responses and source verdict including blocked cases
        uses: actions/upload-artifact@v4
        with:
          name: roll001-morpho-borrower-funded-incentive-public-source-v01
          path: artifacts/morpho_roll_keeper_source_v01/
          if-no-files-found: warn
