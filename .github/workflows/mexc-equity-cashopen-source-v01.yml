name: MEXC Multi-Equity CashOpen Source V0.1

on:
  push:
    branches:
      - mexc-equity-cashopen-v0.1-source-gate-2026-10-04

permissions:
  contents: read

jobs:
  source-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependency
        run: python -m pip install --disable-pip-version-check requests
      - name: Source-only freeze check
        run: |
          test "$GITHUB_REF_NAME" = "mexc-equity-cashopen-v0.1-source-gate-2026-10-04"
          test -f research/mexc_global_assets/MEXC_EQUITY_CASHOPEN_SOURCE_FREEZE_V0.1.md
          python -m py_compile research/mexc_global_assets/mexc_equity_cashopen_source_v01.py
          echo CASHOPEN_SOURCE_ONLY_PASS
      - name: Run source gate
        run: python research/mexc_global_assets/mexc_equity_cashopen_source_v01.py
      - name: Upload source evidence
        uses: actions/upload-artifact@v4
        with:
          name: mexc-equity-cashopen-source-v01-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/mexc_global_assets/equity_cashopen_source_v01
          if-no-files-found: error
          retention-days: 90