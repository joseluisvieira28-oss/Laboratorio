name: IPG-001 OpenMarket exact manifest inventory
on:
  push:
    branches: [information-propagation-graph-001-source-gate-v0.1]
    paths:
      - 'research/information_propagation_graph_001/openmarket_manifest_inventory_v01.py'
      - '.github/workflows/ipg001-openmarket-manifest-inventory-v01.yml'
      - 'research/information_propagation_graph_001/OPENMARKET_MANIFEST_TRIGGER.txt'
permissions:
  contents: write
jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {ref: information-propagation-graph-001-source-gate-v0.1}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check --quiet huggingface_hub
      - run: python research/information_propagation_graph_001/openmarket_manifest_inventory_v01.py
      - name: Persist receipt
        run: |
          cp artifacts/ipg001_openmarket_manifest_inventory_v01.json research/information_propagation_graph_001/OPENMARKET_MANIFEST_INVENTORY_RECEIPT.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/information_propagation_graph_001/OPENMARKET_MANIFEST_INVENTORY_RECEIPT.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "IPG-001: record exact OpenMarket manifest inventory [skip ci]"
          git push origin HEAD:information-propagation-graph-001-source-gate-v0.1
      - uses: actions/upload-artifact@v4
        with:
          name: ipg001-openmarket-manifest-inventory-v01
          path: artifacts/ipg001_openmarket_manifest_inventory_v01.json
          if-no-files-found: error
