name: BTC-CONVEX-001 FINAL expansion validation V0.1

on:
  pull_request:
    paths:
      - '.github/workflows/btc_convex_expansion_validation_final.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-expansion:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run frozen Parent-only expansion validation once
        run: python labs/btc-convex-trend-capture-001/expansion_cost_validation_v0_1.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: BTC-CONVEX-001-FINAL-EXPANSION-VALIDATION-V01
          path: labs/btc-convex-trend-capture-001/evidence/EXPANSION_COST_VALIDATION_V0.1.json
