name: CIRV BTC ETH Prospective Forward V0.3
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - ".github/workflows/cirv-prospective-forward-v03.yml"
      - "labs/CRYPTO_INTRAWEEK_RV_001/CIRV_FORWARD_DAILY_TRIGGER.txt"
      - "labs/CRYPTO_INTRAWEEK_RV_001/forward_watcher_v02.py"
      - "labs/CRYPTO_INTRAWEEK_RV_001/FORWARD_OPERATIONS_AMENDMENT_V0.3.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cirv-btceth-forward-v03
  cancel-in-progress: false

jobs:
  forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: crypto-intraweek-rv-forward-v0.1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check -q pandas numpy
      - name: Compile frozen-remediated watcher
        run: python -m py_compile labs/CRYPTO_INTRAWEEK_RV_001/forward_watcher_v02.py
      - name: Read prospective target trigger
        id: target
        shell: bash
        run: |
          FILE="labs/CRYPTO_INTRAWEEK_RV_001/CIRV_FORWARD_DAILY_TRIGGER.txt"
          if [[ ! -f "$FILE" ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "reason=NO_TRIGGER_FILE" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          TARGET="$(grep -E '^target_date=' "$FILE" | head -1 | cut -d= -f2 || true)"
          if [[ ! "$TARGET" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "reason=DISABLED_OR_INVALID_TRIGGER" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$TARGET" < "2026-09-23" ]]; then
            echo "Forbidden pre-remediation target: $TARGET"
            exit 12
          fi
          TODAY="$(date -u +%F)"
          HM="$(date -u +%H%M)"
          if [[ "$TARGET" != "$TODAY" ]]; then
            echo "Target $TARGET is not current UTC date $TODAY"
            exit 13
          fi
          if (( 10#$HM < 20 || 10#$HM > 130 )); then
            echo "Outside prospective arming window: $HM UTC"
            exit 14
          fi
          echo "target=$TARGET" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"
      - name: Generate prospective forecast
        if: steps.target.outputs.skip == 'false'
        run: python labs/CRYPTO_INTRAWEEK_RV_001/forward_watcher_v02.py "${{ steps.target.outputs.target }}"
      - name: Upload immutable forecast evidence
        if: steps.target.outputs.skip == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: CIRV_FORWARD_V03_${{ steps.target.outputs.target }}_${{ github.run_id }}
          path: cirv_forward_forecast_${{ steps.target.outputs.target }}.json
          if-no-files-found: error
          retention-days: 90
