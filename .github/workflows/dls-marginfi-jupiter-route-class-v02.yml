name: DLS Marginfi Jupiter Route Class Sharded V0.2

on:
  push:
    branches:
      - dls-signed-flow-authority-v01
    paths:
      - labs/DEFI_LIQUIDATION_SHOCK_001/LAUNCH_MARGINFI_JUPITER_ROUTE_SHARDED_V02.marker

permissions:
  actions: read
  contents: read

jobs:
  shard:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {sid: mfi-01, start: "2024-01-01T00:00:00Z", end: "2024-01-05T00:00:00Z"}
          - {sid: mfi-02, start: "2024-01-05T00:00:00Z", end: "2024-01-09T00:00:00Z"}
          - {sid: mfi-03, start: "2024-01-09T00:00:00Z", end: "2024-01-13T00:00:00Z"}
          - {sid: mfi-04, start: "2024-01-13T00:00:00Z", end: "2024-01-17T00:00:00Z"}
          - {sid: mfi-05, start: "2024-01-17T00:00:00Z", end: "2024-01-21T00:00:00Z"}
          - {sid: mfi-06, start: "2024-01-21T00:00:00Z", end: "2024-01-25T00:00:00Z"}
          - {sid: mfi-07, start: "2024-01-25T00:00:00Z", end: "2024-01-29T00:00:00Z"}
          - {sid: mfi-08, start: "2024-01-29T00:00:00Z", end: "2024-02-01T00:00:00Z"}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download frozen Jan-2024 Marginfi population
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 36263998920
          name: dls-field-enrichment-ms-marginfi-202401
          path: event_source
      - name: Compile shard census
        run: python -m py_compile labs/DEFI_LIQUIDATION_SHOCK_001/source/census_marginfi_jupiter_route_shard_v0_2.py
      - name: Execute shard
        run: >
          python labs/DEFI_LIQUIDATION_SHOCK_001/source/census_marginfi_jupiter_route_shard_v0_2.py
          --start "${{ matrix.start }}"
          --end "${{ matrix.end }}"
          --shard-id "${{ matrix.sid }}"
      - name: Upload shard evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dls-marginfi-jupiter-route-${{ matrix.sid }}-v02
          path: |
            labs/DEFI_LIQUIDATION_SHOCK_001/MARGINFI_JUPITER_ROUTE_SHARD_${{ matrix.sid }}_RECEIPT_V0.1.json
            labs/DEFI_LIQUIDATION_SHOCK_001/MARGINFI_JUPITER_ROUTE_SHARD_${{ matrix.sid }}_MEMBERS_V0.1.ndjson
          if-no-files-found: warn
          retention-days: 90

  merge:
    if: always()
    needs: shard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download all shard evidence
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ github.run_id }}
          pattern: dls-marginfi-jupiter-route-*-v02
          path: shard_evidence
      - name: Compile merge
        run: python -m py_compile labs/DEFI_LIQUIDATION_SHOCK_001/source/merge_marginfi_jupiter_route_shards_v0_2.py
      - name: Merge and adjudicate
        run: >
          python labs/DEFI_LIQUIDATION_SHOCK_001/source/merge_marginfi_jupiter_route_shards_v0_2.py
          --root shard_evidence
      - name: Upload global immutable receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dls-marginfi-jupiter-route-class-v02
          path: |
            labs/DEFI_LIQUIDATION_SHOCK_001/MARGINFI_JUPITER_ROUTE_CLASS_MEMBERSHIP_RECEIPT_V0.2.json
            labs/DEFI_LIQUIDATION_SHOCK_001/MARGINFI_JUPITER_ROUTE_CLASS_MEMBERS_V0.2.ndjson
          if-no-files-found: warn
          retention-days: 90
      - name: Firewall
        if: always()
        run: echo SOURCE_ONLY_SHARDED_NO_TOKEN_AMOUNTS_NO_PRICES_2025_2026_CLOSED
