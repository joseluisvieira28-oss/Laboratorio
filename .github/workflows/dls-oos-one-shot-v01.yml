name: DLS OOS One-Shot V0.1

on:
  push:
    branches:
      - dls-field-enrichment-v01
    paths:
      - labs/DEFI_LIQUIDATION_SHOCK_001/LAUNCH_OOS_V01.marker

permissions:
  actions: read
  contents: read

jobs:
  oos:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download locked Final Pre-Discovery authority
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 36483501137
          name: dls-final-pre-discovery-authority-v01
          path: final_authority

      - name: Download locked source-cluster census
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 36465385517
          name: dls-source-cluster-sample-gate-v01
          path: sample_gate

      - name: Download locked Market Data Source authority
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 36483390920
          name: dls-market-data-source-feasibility-v01
          path: market_data

      - name: Download canonical freeze-conformant Discovery receipt
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 36485865469
          name: dls-discovery-v01
          path: discovery

      - name: Assert canonical Discovery and OOS conformance
        run: |
          python -m py_compile labs/DEFI_LIQUIDATION_SHOCK_001/source/run_oos_v0_1.py
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          lock=json.loads(Path("labs/DEFI_LIQUIDATION_SHOCK_001/DISCOVERY_ADJUDICATION_LOCK_V0.1.json").read_text())
          conf=json.loads(Path("labs/DEFI_LIQUIDATION_SHOCK_001/OOS_PRELAUNCH_CONFORMANCE_RECEIPT_V0.1.json").read_text())
          p=Path("discovery/DISCOVERY_RESULT_RECEIPT_V0.1.json")
          r=json.loads(p.read_text())
          assert lock["classification"]=="SURVIVES_DISCOVERY"
          assert lock["canonical"] is True
          assert lock["workflow_run_id"]==36485865469
          assert conf["classification"]=="OOS_PRELAUNCH_IMPLEMENTATION_CONFORMANCE_PASS"
          assert conf["canonical_discovery"]["run_id"]==36485865469
          assert r["classification"]=="SURVIVES_DISCOVERY"
          assert r["oos_2024_opened"] is False
          assert r["protected_2025_2026_opened"] is False
          assert hashlib.sha256(p.read_bytes()).hexdigest()=="d75081066e885e835ecf915673d10af64a53fe4f298e5b2a8d4a287f9c12ea2d"
          print("CANONICAL_OOS_AUTHORITY_PASS")
          PY

      - name: Execute frozen OOS 2024 only
        run: >
          python labs/DEFI_LIQUIDATION_SHOCK_001/source/run_oos_v0_1.py
          --authority final_authority
          --sample-gate sample_gate
          --market-source market_data
          --discovery discovery
          --registry labs/DEFI_LIQUIDATION_SHOCK_001/MARKET_DATA_MAPPING_REGISTRY_V0.1.json
          --workers 16

      - name: Upload immutable canonical OOS evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dls-oos-v01-canonical
          path: |
            labs/DEFI_LIQUIDATION_SHOCK_001/OOS_MARKET_DATA_ACQUISITION_RECEIPT_V0.1.json
            labs/DEFI_LIQUIDATION_SHOCK_001/OOS_MARKET_DATA_ARCHIVE_MANIFEST_V0.1.ndjson
            labs/DEFI_LIQUIDATION_SHOCK_001/OOS_RESULT_RECEIPT_V0.1.json
            labs/DEFI_LIQUIDATION_SHOCK_001/OOS_PAIRED_OUTCOMES_V0.1.ndjson
          if-no-files-found: warn
          retention-days: 90

      - name: Firewall
        if: always()
        run: |
          echo OOS_2024_ONLY
          echo PROTECTED_2025_2026_CLOSED
          echo NO_POST_OUTCOME_TUNING
          echo NO_TRADING_NO_ORDERS_NO_WALLETS_NO_EXCHANGE_MUTATION_NO_MAIN_MERGE
