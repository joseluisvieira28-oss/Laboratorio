name: UKLS Common Crawl URL Index Transport V0.2.5B
on:
  push:
    branches:
      - upbit-krw-listing-shock-commoncrawl-urlindex-v0.2.5b
    paths:
      - 'Dream-Account-OS-v2.3-PARTIAL/research/upbit_krw_listing_shock_001/common_crawl_url_index_v025b.py'
      - '.github/workflows/upbit-krw-listing-shock-commoncrawl-urlindex-v025b.yml'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check duckdb
      - name: Verify frozen authority
        run: |
          test -f Dream-Account-OS-v2.3-PARTIAL/research/upbit_krw_listing_shock_001/COMMON_CRAWL_URL_INDEX_TRANSPORT_AUTHORITY_V0_2_5B.md
          python -m py_compile Dream-Account-OS-v2.3-PARTIAL/research/upbit_krw_listing_shock_001/common_crawl_url_index_v025b.py
      - name: Execute one-crawl public URL Index transport probe
        run: python Dream-Account-OS-v2.3-PARTIAL/research/upbit_krw_listing_shock_001/common_crawl_url_index_v025b.py
      - name: Enforce firewall
        run: |
          python - <<'PY'
          import json
          x=json.load(open('artifacts/UKLS_COMMON_CRAWL_URL_INDEX_V0_2_5B.json'))
          assert x['warc_payload_opened'] is False
          assert x['event_values_opened'] is False
          assert x['binance_opened'] is False
          print('CLASSIFICATION',x['classification'])
          print('PARQUET_OBJECTS',x.get('parquet_object_count'))
          print('MATCHED_ROWS',x.get('matched_index_rows'))
          print('PATH_COUNTS',x.get('path_family_counts'))
          print('FETCH_STATUS',x.get('fetch_status_counts'))
          print('FETCH_RANGE',x.get('earliest_fetch_time'),x.get('latest_fetch_time'))
          print('FAILURE',x.get('failure'))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: UKLS_COMMON_CRAWL_URL_INDEX_V0_2_5B
          path: |
            artifacts/UKLS_COMMON_CRAWL_URL_INDEX_V0_2_5B.json
            artifacts/UKLS_COMMON_CRAWL_URL_INDEX_V0_2_5B_ROWS.json
          if-no-files-found: error
          retention-days: 90
