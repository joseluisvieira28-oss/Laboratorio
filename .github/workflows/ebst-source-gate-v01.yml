name: EBST source gate v0.1
on:
  push:
    branches: [eth-blockspace-state-transition-v0.1]
    paths:
      - 'research/eth_blockspace_state_transition/**'
      - '.github/workflows/ebst-source-gate-v01.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Run fail-closed public source probe
        run: python research/eth_blockspace_state_transition/source_probe_v01.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ebst-source-probe-v01
          path: EBST_SOURCE_PROBE_V0_1.json
