name: Event10m Current Contract Payouts and Microstructure SOURCE-ONLY
on:
  push:
    branches:
      - research/event10m-current-products-and-microstructure-source-2026-10-30
    paths:
      - .github/workflows/event10m-current-source-v01.yml
permissions:
  contents: read
jobs:
  source-only-no-forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Install public browser (anonymous)
        run: |
          python -m pip install --disable-pip-version-check playwright==1.56.0
          python -m playwright install chromium
      - name: Three DISTINCT official 10m product HTTP responses, plus BTC/ETH depth source gate
        run: python research/mexc_event_direction_v01/event10m_current_source_v01.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: event10m-live-products-microstructure-source-v01
          path: artifacts/event10m_live_sources_v01/source_receipt.json
          if-no-files-found: warn
