name: BTC Options VRP — Tardis Source Probe V0.1

on:
  push:
    branches:
      - btc-options-vrp-tardis-source-probe-v0.1
    paths:
      - .github/btc-options-vrp-tardis-source-probe-v01.trigger

permissions:
  contents: read

concurrency:
  group: btc-options-vrp-tardis-source-probe-v01
  cancel-in-progress: false

jobs:
  source_probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout isolated source-probe branch
        uses: actions/checkout@v4
        with:
          ref: btc-options-vrp-tardis-source-probe-v0.1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install source dependency
        run: pip install --disable-pip-version-check requests

      - name: Verify frozen source-only authority
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          p='labs/BTC_OPTIONS_VRP_001/TARDIS_SOURCE_PROBE_AUTHORITY_V0.1.json'
          a=json.load(open(p))
          assert a['probe_id']=='OVRP-EXEC-SOURCE-TARDIS-PROBE-001'
          assert a['status']=='FROZEN_SOURCE_ONLY_OUTCOME_BLIND'
          assert a['parent_discovery_classification']=='DISCOVERY_PASS_VRP_EXISTS'
          assert a['closed_execution_classification']=='EXECUTION_DATA_LIQUIDITY_INSUFFICIENT'
          assert a['sample_dates']==['2021-06-01','2022-06-01','2023-06-01','2024-06-01']
          assert all(int(x[:4]) < 2025 for x in a['sample_dates'])
          s=a['safety']
          assert s['performance_outcomes_authorized'] is False
          assert s['strategy_pnl_authorized'] is False
          assert s['returns_authorized'] is False
          assert s['execution_mve_authorized'] is False
          assert s['paid_subscription_authorized'] is False
          assert s['api_key_authorized'] is False
          assert s['access_2025_authorized'] is False
          assert s['access_2026_authorized'] is False
          assert s['live_trading_authorized'] is False
          assert s['exchange_mutation_authorized'] is False
          assert s['wallet_access_authorized'] is False
          assert s['merge_to_main_authorized'] is False
          print('TARDIS_SOURCE_PROBE_AUTHORITY_PASS')
          PY

      - name: Compile source probe
        run: python -m py_compile labs/BTC_OPTIONS_VRP_001/tardis_source_probe_v01.py

      - name: Execute free-sample source-feasibility probe
        run: python labs/BTC_OPTIONS_VRP_001/tardis_source_probe_v01.py

      - name: Upload immutable source-probe receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BTC_OPTIONS_VRP_001_TARDIS_SOURCE_PROBE_V0_1
          path: artifacts/btc_options_vrp_tardis_source_probe_v01/
          retention-days: 90
          if-no-files-found: warn
