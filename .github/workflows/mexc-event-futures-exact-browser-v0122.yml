name: MEXC Event Futures Exact Browser V0.12.2 All Symbols

on:
  push:
    branches:
      - mexc-event-futures-exact-browser-v0.12.2-all-symbols-2026-10-02
    paths:
      - 'research/mexc_event_futures/**'
      - '.github/workflows/mexc-event-futures-exact-browser-v0122.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-browser-all:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install --upgrade pip playwright
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Syntax check
        run: python -m py_compile research/mexc_event_futures/exact_browser_v0122.py
      - name: Capture all exact public Event Futures records
        run: python research/mexc_event_futures/exact_browser_v0122.py
      - name: Verify boundary
        shell: bash
        run: |
          python - <<'PY'
          import json
          j=json.load(open('artifacts/mexc_event_futures/exact_browser_v0122.json',encoding='utf-8'))
          assert j['authenticated_requests']==0
          assert j['orders']==0
          assert j['account_mutations']==0
          print('BOUNDARY=PASS')
          print('VERDICT='+j['verdict'])
          print('TARGET_RECORDS='+str(len(j['records'])))
          PY
      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: mexc-event-futures-exact-browser-v0122-all-symbols
          path: artifacts/mexc_event_futures/exact_browser_v0122.json
          if-no-files-found: error
