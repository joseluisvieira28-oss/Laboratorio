name: source-t0-probe-v49a-secret-global-height-carriers
on:
  push:
    branches: [cosmos-native-emission-param-shock-001-v0.2-t0-remediation-2026-10-07]
    paths: [.github/workflows/source-t0-probe-v49a-secret-global-height-carriers.yml]
permissions: {contents: write}
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {ref: cosmos-native-emission-param-shock-001-v0.2-t0-remediation-2026-10-07}
      - name: Global exact consensus-height census
        run: |
          python3 - <<'PY'
          import json,urllib.request,urllib.error,ssl,os,datetime
          from concurrent.futures import ThreadPoolExecutor
          H=[11880918,11880919,11880920,11880921]
          E=[
          ("juno","https://juno-rpc.publicnode.com"),("axelar","https://axelar-rpc.publicnode.com"),
          ("stride","https://rpc.stride.citizenweb3.com"),("terra2","https://terra-rpc.polkachu.com"),
          ("kujira","https://kujira-rpc.polkachu.com"),("injective","https://injective-rpc.publicnode.com"),
          ("persistence","https://rpc.cosmos.directory/persistence"),("agoric","https://rpc.cosmos.directory/agoric"),
          ("terra","https://terra-classic-rpc.publicnode.com:443"),("sentinel","https://sentinel-rpc.publicnode.com:443"),
          ("noble","https://noble-rpc.polkachu.com:443"),("jackal","https://rpc.jackalprotocol.com"),
          ("celestia","https://rpc.archive.celestia.validatus.com"),("composable","https://composable-mainnet-rpc.autostake.com:443")]
          def one(x):
            n,u,h=x;q=f"update_client.consensus_height='4-{h}'"
            p={"jsonrpc":"2.0","id":1,"method":"tx_search","params":{"query":q,"prove":False,"page":"1","per_page":"100","order_by":"asc"}}
            try:
              req=urllib.request.Request(u,data=json.dumps(p).encode(),headers={"Content-Type":"application/json","User-Agent":"CryptoLab-v49a"},method="POST")
              with urllib.request.urlopen(req,timeout=10,context=ssl._create_unverified_context()) as z:
                d=json.loads(z.read());txs=(d.get("result") or {}).get("txs") or [];hits=[]
                for t in txs:
                  for ev in (t.get("tx_result") or {}).get("events") or []:
                    if ev.get("type")!="update_client":continue
                    a={v.get("key"):v.get("value") for v in ev.get("attributes") or []}
                    if a.get("consensus_height")==f"4-{h}":
                      hits.append({"tx_hash":t.get("hash"),"carrier_height":int(t["height"]),
                        "client_id":a.get("client_id"),"header_present":bool(a.get("header"))})
                return {"carrier":n,"endpoint":u,"height":h,"ok":True,"status":z.status,"hits":hits}
            except urllib.error.HTTPError as e:return {"carrier":n,"endpoint":u,"height":h,"ok":False,"status":e.code,"error":str(e),"hits":[]}
            except Exception as e:return {"carrier":n,"endpoint":u,"height":h,"ok":False,"status":None,"error":repr(e),"hits":[]}
          jobs=[(n,u,h) for n,u in E for h in H]
          with ThreadPoolExecutor(max_workers=48) as ex:rows=list(ex.map(one,jobs))
          hits=[r for r in rows if r["hits"]]
          out={"scope":"SOURCE_ONLY_NO_MARKET_DATA","target":"2023-12-07T02:54:58.930543213Z",
            "tested_utc":datetime.datetime.now(datetime.timezone.utc).isoformat(),"rows":rows,"hits":hits}
          p="research/cosmos_native_emission_param_shock_001_v0_2/SCRT287_GLOBAL_HEIGHT_CARRIERS_V49A.json"
          os.makedirs(os.path.dirname(p),exist_ok=True);open(p,"w").write(json.dumps(out,indent=2))
          print("V49A",json.dumps({"hits":hits}))
          PY
      - name: Persist
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/cosmos_native_emission_param_shock_001_v0_2/SCRT287_GLOBAL_HEIGHT_CARRIERS_V49A.json
          git commit -m "SCRT287: persist global exact-height carrier census v49a"
          git pull --rebase origin cosmos-native-emission-param-shock-001-v0.2-t0-remediation-2026-10-07
          git push origin HEAD:cosmos-native-emission-param-shock-001-v0.2-t0-remediation-2026-10-07
