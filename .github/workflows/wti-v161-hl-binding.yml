name: WTI V161 Hyperliquid Targeted Binding

on:
  push:
    branches:
      - mexc-hl-wti-crossvenue-v1.6.1-binding-2026-10-04
    paths:
      - 'research/mexc_global_assets/MEXC_HL_WTI_SOURCE_BINDING_AMENDMENT_V1.6.1.md'
      - 'research/mexc_global_assets/mexc_hl_wti_source_probe_v161.py'
      - '.github/workflows/wti-v161-hl-binding.yml'

permissions:
  contents: read

jobs:
  source-binding:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install requests
        run: python -m pip install --disable-pip-version-check requests
      - name: Pre-outcome identity check
        run: |
          test "$GITHUB_REF_NAME" = "mexc-hl-wti-crossvenue-v1.6.1-binding-2026-10-04"
          python -m py_compile research/mexc_global_assets/mexc_hl_wti_source_probe_v161.py
          grep -q 'OUTCOMES STILL CLOSED' research/mexc_global_assets/MEXC_HL_WTI_SOURCE_BINDING_AMENDMENT_V1.6.1.md
          grep -q 'xyz:CL' research/mexc_global_assets/MEXC_HL_WTI_SOURCE_BINDING_AMENDMENT_V1.6.1.md
      - name: Execute targeted public binding proof
        run: python research/mexc_global_assets/mexc_hl_wti_source_probe_v161.py
      - name: Upload immutable binding evidence
        uses: actions/upload-artifact@v4
        with:
          name: wti-v161-hl-binding-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/mexc_global_assets/hl_wti_source_gate_v161
          if-no-files-found: error
          retention-days: 90
