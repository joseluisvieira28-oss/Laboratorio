name: MEXC V0.13.1 Bybit ETH Market Liveness Diagnostic
on:
  push:
    branches:
      - mexc-event-futures-v013-source-completion-2026-10-03
    paths:
      - '.github/workflows/mexc-event-futures-v0131-eth-liveness.yml'
permissions:
  contents: read
jobs:
  eth-liveness:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install websockets==15.0.1
      - run: python research/mexc_event_futures/bybit_eth_market_liveness_v0131.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v0131-bybit-eth-market-liveness
          path: evidence/eth-liveness-v0131/
          if-no-files-found: error
          retention-days: 30
