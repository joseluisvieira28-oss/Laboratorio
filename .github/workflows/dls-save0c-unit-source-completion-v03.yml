name: DLS Save0c Unit Source Completion V0.3

on:
  push:
    branches:
      - dls-field-enrichment-v01
    paths:
      - labs/DEFI_LIQUIDATION_SHOCK_001/LAUNCH_SAVE0C_UNIT_SOURCE_COMPLETION_V03.marker

permissions:
  actions: read
  contents: read

jobs:
  complete:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download V0.1 aggregate
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 36265836324
          pattern: dls-save0c-unit-metadata-population-v01
          path: aggregate_v01
          merge-multiple: true

      - name: Download V0.1 partition receipts
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 36265836324
          pattern: dls-save0c-unit-*
          path: partitions_v01
          merge-multiple: true

      - name: Download historical reserve registry
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 36270414431
          pattern: dls-save0c-historical-reserve-registry-v01
          path: historical_registry
          merge-multiple: true

      - name: Compile hybrid resolver
        run: python -m py_compile labs/DEFI_LIQUIDATION_SHOCK_001/source/resolve_save0c_unit_metadata_partial_v0_3.py

      - name: Resolve exact aggregate-listed unmapped reserves
        run: >
          python labs/DEFI_LIQUIDATION_SHOCK_001/source/resolve_save0c_unit_metadata_partial_v0_3.py
          --aggregate aggregate_v01
          --partitions partitions_v01
          --historical-registry historical_registry

      - name: Upload V0.3 unit coverage receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dls-save0c-unit-metadata-source-completion-v03
          path: labs/DEFI_LIQUIDATION_SHOCK_001/SAVE0C_UNIT_METADATA_POPULATION_RECEIPT_V0.3.json
          if-no-files-found: warn
          retention-days: 30

      - name: Firewall
        if: always()
        run: echo SOURCE_ONLY_TRUE
