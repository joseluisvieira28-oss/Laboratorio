name: DLS Final 2026 Economic Holdout V0.1

on:
  push:
    branches: [dls-field-enrichment-v01]
    paths:
      - labs/DEFI_LIQUIDATION_SHOCK_001/LAUNCH_FINAL_2026_ECONOMIC_V01.marker

permissions:
  actions: read
  contents: read

jobs:
  holdout:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Require locked 2025 economic PASS
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("labs/DEFI_LIQUIDATION_SHOCK_001/PROTECTED_2025_ECONOMIC_ADJUDICATION_LOCK_V0.1.json").read_text())
          assert r["classification"]=="SURVIVES_2025_ECONOMIC_HOLDOUT"
          PY
      - name: Resolve immutable 2026 source run from launch marker
        id: source
        shell: bash
        run: |
          run_id="$(grep '^SOURCE_RUN_ID=' labs/DEFI_LIQUIDATION_SHOCK_001/LAUNCH_FINAL_2026_ECONOMIC_V01.marker | cut -d= -f2)"
          test -n "$run_id"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
      - name: Download immutable final 2026 source authority
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.source.outputs.run_id }}
          name: dls-final-2026-source-authority-v01
          path: source_2026
      - name: Assert source authority before market access
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("source_2026/FINAL_2026_SOURCE_AUTHORITY_RECEIPT_V0.1.json").read_text())
          assert r["classification"]=="FINAL_2026_SOURCE_AUTHORITY_PASS"
          assert r["firewall"]["prices_2026_opened"] is False
          PY
      - name: Compile frozen final holdout
        run: python -m py_compile labs/DEFI_LIQUIDATION_SHOCK_001/source/run_final_2026_economic_holdout_v0_1.py
      - name: Execute final 2026 economic holdout
        run: >
          python labs/DEFI_LIQUIDATION_SHOCK_001/source/run_final_2026_economic_holdout_v0_1.py
          --source-root source_2026
          --workers 16
      - name: Upload immutable final holdout evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dls-final-2026-economic-holdout-v01
          path: |
            labs/DEFI_LIQUIDATION_SHOCK_001/FINAL_2026_ECONOMIC_HOLDOUT_RECEIPT_V0.1.json
            labs/DEFI_LIQUIDATION_SHOCK_001/FINAL_2026_ECONOMIC_MARKET_QA_V0.1.json
            labs/DEFI_LIQUIDATION_SHOCK_001/FINAL_2026_SERIALIZED_TRADES_V0.1.ndjson
          if-no-files-found: warn
          retention-days: 90
      - name: Firewall
        if: always()
        run: echo NO_TUNING_NO_TRADING_NO_ORDERS_NO_WALLETS_NO_EXCHANGE_MUTATION_NO_MAIN_MERGE
