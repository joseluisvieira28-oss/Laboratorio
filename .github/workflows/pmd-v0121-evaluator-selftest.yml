name: PMD-001 V0121 Evaluator Eligibility Selftest
on:
  push:
    branches: [pumpfun-migration-direction-v0.1]
    paths:
      - 'Dream-Account-OS-v2.3-PARTIAL/research/pumpfun_migration_direction_001/RUN_V0121_EVALUATOR_SELFTEST.trigger'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  selftest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pumpfun-migration-direction-v0.1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --upgrade pip pandas numpy scipy
      - name: Run V0.12.1 eligibility self-test
        working-directory: Dream-Account-OS-v2.3-PARTIAL/research/pumpfun_migration_direction_001
        run: python v0121_evaluator_eligibility_selftest.py
