name: Emission T0 Recovery V0.2 Matrix

on:
  push:
    branches:
      - cosmos-native-emission-param-shock-001-source-remediation-v0.2-2026-10-07
    paths:
      - 'research/cosmos_native_emission_param_shock_001_v0_2_source_remediation/probe_emission_t0_v02.py'
      - '.github/workflows/emission_t0_recovery_v02_matrix.yml'

permissions:
  contents: read

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        event: [SCRT, KAVA, OSMO, AKT265, AKT283, CTK38]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Probe frozen T0
        env:
          ONLY_EVENT: ${{ matrix.event }}
        run: python3 research/cosmos_native_emission_param_shock_001_v0_2_source_remediation/probe_emission_t0_v02.py
      - name: Upload source receipt
        uses: actions/upload-artifact@v4
        with:
          name: emission-t0-${{ matrix.event }}-v02
          path: emission_t0_recovery_*_v02.json
          if-no-files-found: error
