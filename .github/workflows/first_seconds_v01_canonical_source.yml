name: First Seconds Cascade V0.1 2025 Development ONE SHOT
on:
  push:
    branches: [binance-listing-first-seconds-cascade-v0.1-prereg-2026-10-05]
    paths:
      - '.github/workflows/first_seconds_v01_canonical_source.yml'
permissions: {contents: read}
jobs:
  development:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python research/binance_listing_first_seconds_cascade/run_v01_2025_subminute_once.py
