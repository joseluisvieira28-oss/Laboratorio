# Bounded source-only research capture; activate only with an explicit trigger-file push.
# Prevents duplicate captures when editing workflow or forensic reports.
name: Liquidation Exhaustion V1 — single public source proof
on:
  push:
    branches:
      - research/liquidation-exhaustion-v1-2026-11-04
    paths:
      - research/liquidation_exhaustion_v1/EXPLICIT_SINGLE_CAPTURE_TRIGGER.txt
permissions:
  contents: read
jobs:
  free-source-only:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned public-only WS client
        run: python -m pip install --disable-pip-version-check websockets==15.0.1
      - name: Validate synthetic source guards
        run: python research/liquidation_exhaustion_v1/public_source_capture_v1.py --self-test
      - name: One bounded 180-second public positive-event source capture
        run: python research/liquidation_exhaustion_v1/public_source_capture_v1.py
      - name: Preserve source raw frames + receipt (including blocked sessions)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: liquidation-exhaustion-v1-public-source-raw
          path: artifacts/liquidation_exhaustion_v1/
          if-no-files-found: warn
          retention-days: 30
      - name: Add outcome to GitHub job summary (no issue-write permission)
        if: always()
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, pathlib
          p = pathlib.Path("artifacts/liquidation_exhaustion_v1/source_receipt.json")
          print("## Liquidation Exhaustion V1 — public-source-only receipt")
          if p.exists():
              r = json.loads(p.read_text())
              print("Status:", r["verdict"])
              print("Positive liquidation children observed:", r["liquidation_children"])
              print("Raw SHA-256:", r["raw_sha256"])
              print("No PnL, no trading, no source-census certification.")
          else:
              print("NO_RECEIPT — setup/test/source failure; not SOURCE_PASS.")
          PY
