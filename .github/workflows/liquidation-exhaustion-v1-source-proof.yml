# One-shot activation of source-only experiment, 2026-11-04.
# The restricted push path prevents data/code-only changes from retriggering a capture.
name: Liquidation Exhaustion V1 — single public source proof
on:
  push:
    branches:
      - research/liquidation-exhaustion-v1-2026-11-04
    paths:
      - .github/workflows/liquidation-exhaustion-v1-source-proof.yml
permissions:
  contents: read
  issues: write
jobs:
  free-source-only:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned public-only WS client
        run: python -m pip install --disable-pip-version-check websockets==15.0.1
      - name: Validate synthetic source guards
        run: python research/liquidation_exhaustion_v1/public_source_capture_v1.py --self-test
      - name: One bounded 180-second public positive-event source capture
        run: python research/liquidation_exhaustion_v1/public_source_capture_v1.py
      - name: Preserve source raw frames + receipt (including blocked sessions)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: liquidation-exhaustion-v1-public-source-raw
          path: artifacts/liquidation_exhaustion_v1/
          if-no-files-found: warn
          retention-days: 30
      - name: Publish one auditable outcome receipt to PR 332
        if: always()
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const p = 'artifacts/liquidation_exhaustion_v1/source_receipt.json';
            let summary;
            if (fs.existsSync(p)) {
              const r = JSON.parse(fs.readFileSync(p, 'utf8'));
              summary = [
                'Status: ' + r.verdict,
                'BTC liquidation frames: ' + r.counts['allLiquidation.BTCUSDT'],
                'ETH liquidation frames: ' + r.counts['allLiquidation.ETHUSDT'],
                'Observed liquidation child events: ' + r.liquidation_children,
                'BTC/ETH trade and book counts: ' + JSON.stringify(Object.fromEntries(Object.entries(r.counts).filter(([k])=>!k.startsWith('allLiquidation.')))),
                'Source errors: ' + JSON.stringify(r.errors),
                'Raw SHA256: ' + r.raw_sha256,
                'No economic outcomes opened; no trading.'
              ].join('\n');
            } else {
              summary = 'NO_SOURCE_RECEIPT — setup or tests failed before real capture. Examine job logs. NO SOURCE PASS.';
            }
            const body = 'LIQUIDATION EXHAUSTION V1 — ONE SOURCE-ONLY RUN\n\n' + summary +
              '\n\nEvidence: https://github.com/' + context.repo.owner + '/' + context.repo.repo +
              '/actions/runs/' + context.runId + '\nPR #332 remains research only. No LIVE GO.';
            await github.rest.issues.createComment({
              ...context.repo, issue_number: 332, body
            });
