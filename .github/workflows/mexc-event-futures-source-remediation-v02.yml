name: MEXC Event Futures Source Remediation V0.2

on:
  push:
    branches:
      - mexc-event-futures-source-remediation-v0.2-2026-10-02
    paths:
      - 'research/mexc_event_futures/**'
      - '.github/workflows/mexc-event-futures-source-remediation-v02.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-remediation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install
        run: python -m pip install --upgrade pip requests

      - name: Run source-only diagnostics
        run: python research/mexc_event_futures/source_remediation_v02.py

      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: mexc-event-futures-source-remediation-v02
          path: artifacts/mexc_event_futures/source_remediation_v02.json
          if-no-files-found: error
