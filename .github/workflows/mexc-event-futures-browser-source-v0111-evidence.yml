name: MEXC Event Futures Browser Source V0.11.1 Evidence

on:
  push:
    branches:
      - mexc-event-futures-browser-source-v0.11.1-evidence-2026-10-02
    paths:
      - 'research/mexc_event_futures/**'
      - '.github/workflows/mexc-event-futures-browser-source-v0111-evidence.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-source-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python deps
        run: python -m pip install --upgrade pip playwright
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Syntax check
        run: |
          python -m py_compile research/mexc_event_futures/browser_source_v011.py
          python -m py_compile research/mexc_event_futures/summarize_browser_source_v011.py
      - name: Run source probe
        run: python research/mexc_event_futures/browser_source_v011.py
      - name: Print sanitized evidence summary
        run: python research/mexc_event_futures/summarize_browser_source_v011.py
      - name: Verify boundary
        shell: bash
        run: |
          python - <<'PY'
          import json
          j=json.load(open('artifacts/mexc_event_futures/browser_source_v011.json',encoding='utf-8'))
          assert j['authenticated_requests']==0
          assert j['orders']==0
          assert j['account_mutations']==0
          print('BOUNDARY=PASS')
          print('VERDICT='+j['verdict'])
          PY
      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: mexc-event-futures-browser-source-v0111-evidence
          path: artifacts/mexc_event_futures/browser_source_v011.json
          if-no-files-found: error
