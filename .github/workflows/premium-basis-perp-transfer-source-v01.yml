name: Premium Basis Perp Transfer Source Gate V0.1

on:
  push:
    branches:
      - premium-basis-perp-transfer-v0.1-2026-10-08
    paths:
      - 'research/mexc_event_futures/premium_basis_perp_transfer_source_v01.py'
      - '.github/workflows/premium-basis-perp-transfer-source-v01.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests
      - name: Freeze and code preflight
        run: |
          grep -q 'Status: FROZEN PROSPECTIVE TRANSFER' research/mexc_event_futures/PREMIUM_BASIS_PERP_TRANSFER_001_PREOUTCOME_FREEZE_V0.1.md
          python -m py_compile research/mexc_event_futures/premium_basis_perp_transfer_source_v01.py
          echo PREMIUM_BASIS_PERP_TRANSFER_PREOUTCOME_PASS
      - name: Run source-only 630-second transport gate
        run: python research/mexc_event_futures/premium_basis_perp_transfer_source_v01.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: premium-basis-perp-transfer-source-v01-${{ github.run_id }}
          path: evidence/premium-basis-perp-transfer-source-v01/
          if-no-files-found: error
          retention-days: 90
