name: LCOD-001 SQD SDK Borrow universe V0.4
on:
  push:
    branches: [liquidation-convexity-oracle-distance-001-source-gate-v0.1]
    paths:
      - 'research/liquidation_convexity_oracle_distance_001/LCOD_SQD_SDK_BORROW_UNIVERSE_FREEZE_V0.4.md'
      - 'research/liquidation_convexity_oracle_distance_001/lcod_sqd_sdk_borrow_universe_v04.mjs'
      - '.github/workflows/lcod-001-sqd-sdk-borrow-universe-v04.yml'
permissions:
  contents: write
jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with: {ref: liquidation-convexity-oracle-distance-001-source-gate-v0.1}
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - name: Install pinned official SQD SDK
        run: npm install --no-save @subsquid/evm-stream@0.1.5
      - name: Stream full Borrow universe
        run: node research/liquidation_convexity_oracle_distance_001/lcod_sqd_sdk_borrow_universe_v04.mjs
      - name: Persist receipt
        if: always()
        run: |
          if [ -f artifacts/lcod_sqd_sdk_borrow_universe_v04.json ]; then
            cp artifacts/lcod_sqd_sdk_borrow_universe_v04.json research/liquidation_convexity_oracle_distance_001/LCOD_SQD_SDK_BORROW_UNIVERSE_RECEIPT.json
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add research/liquidation_convexity_oracle_distance_001/LCOD_SQD_SDK_BORROW_UNIVERSE_RECEIPT.json
            if ! git diff --cached --quiet; then
              git commit -m "LCOD-001: record complete SQD SDK Borrow universe [skip ci]"
              git push origin HEAD:liquidation-convexity-oracle-distance-001-source-gate-v0.1
            fi
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lcod-sqd-sdk-borrow-universe-v04
          path: artifacts/lcod_sqd_sdk_borrow_universe_v04.json
          if-no-files-found: error
