name: BTC-CONVEX-001 funding transport probe

on:
  pull_request:
    paths:
      - 'labs/btc-convex-trend-capture-001/funding_transport_probe_v0_1.py'
      - '.github/workflows/btc_convex_funding_transport_probe.yml'
      - 'labs/btc-convex-trend-capture-001/FUNDING_TRANSPORT_PROBE_TRIGGER.txt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Probe Binance funding transport hosts
        run: python labs/btc-convex-trend-capture-001/funding_transport_probe_v0_1.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: BTC-CONVEX-001-FUNDING-TRANSPORT-PROBE
          path: labs/btc-convex-trend-capture-001/evidence/FUNDING_TRANSPORT_PROBE_V0.1.json
