name: source-t0-probe-v12-atomscan-api

on:
  push:
    branches:
      - cosmos-native-emission-param-shock-001-v0.2-t0-remediation-2026-10-07
    paths:
      - .github/workflows/source-t0-probe-v12-atomscan-api.yml

permissions:
  contents: read

jobs:
  atomscan-api:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Parse ATOMScan application bundles and public API
        shell: bash
        run: |
          python3 - <<'PY'
          import re,json,urllib.request,ssl,urllib.parse
          UA={"User-Agent":"Mozilla/5.0 CryptoLab-source-only"}
          BASE="https://atomscan.com"
          def get(url,to=20):
            try:
              q=urllib.request.Request(url,headers=UA)
              with urllib.request.urlopen(q,timeout=to,context=ssl._create_unverified_context()) as r:
                return {"ok":True,"status":r.status,"url":r.geturl(),"text":r.read().decode("utf-8","replace")}
            except Exception as e:return {"ok":False,"url":url,"error":repr(e)}
          x=get(BASE+"/secret-network/blocks")
          out={"scope":"SOURCE_ONLY_NO_MARKET_DATA","page":{"ok":x["ok"]}}
          if x["ok"]:
            t=x["text"]
            # support quoted and unquoted src forms
            srcs=[]
            srcs += re.findall(r'<script[^>]*\ssrc=["\']([^"\']+)["\']',t,re.I)
            srcs += re.findall(r'<script[^>]*\ssrc=([^\s>]+)',t,re.I)
            srcs=list(dict.fromkeys(s.strip('"\'') for s in srcs))
            out["page"]["scripts"]=srcs
            out["page"]["tail"]=t[-5000:]
            bundles=[]
            for s in srcs:
              u=urllib.parse.urljoin(BASE,s)
              if "googlesyndication" in u or "cloudflareinsights" in u or "prebid" in u: continue
              bundles.append(u)
            out["bundles"]={}
            candidates=set()
            for u in bundles[:30]:
              b=get(u,30)
              rec={"ok":b["ok"],"status":b.get("status"),"error":b.get("error")}
              if b["ok"]:
                js=b["text"];rec["length"]=len(js)
                # Extract absolute urls and route-like strings
                absu=re.findall(r'https?://[A-Za-z0-9._~:/?#\[\]@!$&()*+,;=%-]+',js)
                route=re.findall(r'["\']([^"\']{1,250}(?:blocks?|governance|proposal|graphql|api|chain)[^"\']{0,250})["\']',js,re.I)
                hits=list(dict.fromkeys(absu+route))
                rec["hits"]=hits[:1000]
                for h in hits:
                  if any(k in h.lower() for k in ["api","block","graphql"]):
                    candidates.add(h)
                # contexts for axios/baseURL/fetch
                ctx=[]
                for needle in ["baseURL","axios.create","/blocks","getBlock","blockBy","graphql","apiUrl","API_URL","fetch("]:
                  pos=0
                  for _ in range(20):
                    pos=js.find(needle,pos)
                    if pos<0:break
                    ctx.append(js[max(0,pos-500):pos+1000])
                    pos+=len(needle)
                rec["contexts"]=ctx[:150]
              out["bundles"][u]=rec
            out["candidate_strings"]=sorted(candidates)[:2000]
          print("ATOMSCAN_API_V12_BEGIN")
          print(json.dumps(out,indent=2,sort_keys=True)[:900000])
          print("ATOMSCAN_API_V12_END")
          PY
