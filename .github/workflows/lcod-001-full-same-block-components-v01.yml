name: LCOD-001 full same-block component reconstruction V0.1
on:
  push:
    branches: [liquidation-convexity-oracle-distance-001-source-gate-v0.1]
    paths:
      - 'research/liquidation_convexity_oracle_distance_001/LCOD_FULL_SAME_BLOCK_COMPONENT_RECONSTRUCTION_FREEZE_V0.1.md'
      - 'research/liquidation_convexity_oracle_distance_001/lcod_full_same_block_component_reconstruction_v01.mjs'
      - '.github/workflows/lcod-001-full-same-block-components-v01.yml'
permissions:
  contents: write
jobs:
  reconstruct:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with: {ref: liquidation-convexity-oracle-distance-001-source-gate-v0.1}
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - run: npm install --no-save @subsquid/evm-stream@0.1.5 ethers@6.15.0
      - run: node research/liquidation_convexity_oracle_distance_001/lcod_full_same_block_component_reconstruction_v01.mjs
      - name: Persist receipt
        if: always()
        run: |
          if [ -f artifacts/lcod_full_same_block_component_reconstruction_v01.json ]; then
            cp artifacts/lcod_full_same_block_component_reconstruction_v01.json research/liquidation_convexity_oracle_distance_001/LCOD_FULL_SAME_BLOCK_COMPONENT_RECONSTRUCTION_RECEIPT.json
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add research/liquidation_convexity_oracle_distance_001/LCOD_FULL_SAME_BLOCK_COMPONENT_RECONSTRUCTION_RECEIPT.json
            if ! git diff --cached --quiet; then
              git commit -m "LCOD-001: record full same-block component reconstruction [skip ci]"
              git push origin HEAD:liquidation-convexity-oracle-distance-001-source-gate-v0.1
            fi
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lcod-full-same-block-components-v01
          path: artifacts/lcod_full_same_block_component_reconstruction_v01.json
          if-no-files-found: error
