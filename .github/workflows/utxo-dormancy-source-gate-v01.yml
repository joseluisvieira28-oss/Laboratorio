name: UTXO Dormancy V0.1 Source Gate

on:
  workflow_dispatch:
  push:
    branches:
      - utxo-dormancy-v0.1
    paths:
      - '.github/utxo-dormancy-source-gate.trigger'

permissions:
  contents: read

jobs:
  source-data-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout frozen branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Governance and syntax preflight
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "utxo-dormancy-v0.1"
          AUTH='research/utxo_dormancy/UTXO_DORMANCY_001_SOURCE_DATA_AUTHORITY_V0_1.md'
          SCRIPT='research/utxo_dormancy/source_gate.py'
          grep -q 'FAMILY_ID: UTXO-DORMANCY-001' "$AUTH"
          grep -q 'SOURCE_GATE_ID: UD-CDD-001' "$AUTH"
          grep -q 'SOURCE_START: 2017-01-01T00:00:00Z' "$AUTH"
          grep -q 'SOURCE_END: 2024-12-31T23:59:59Z' "$AUTH"
          grep -q 'Metric: TxTfrValDayDst only' "$AUTH"
          grep -q 'METRIC="TxTfrValDayDst"' "$SCRIPT"
          grep -q 'START_TIME="2017-01-01T00:00:00Z"' "$SCRIPT"
          grep -q 'END_TIME="2024-12-31T23:59:59Z"' "$SCRIPT"
          grep -q '"price_values_opened":False' "$SCRIPT"
          grep -q '"returns_computed":False' "$SCRIPT"
          grep -q '"pnl_computed":False' "$SCRIPT"
          grep -q '"access_2025":False' "$SCRIPT"
          grep -q '"access_2026":False' "$SCRIPT"
          if grep -Eqi 'api\.binance|coinbase\.com|bybit\.com|kraken\.com|coingecko\.com' "$SCRIPT"; then
            echo 'Forbidden market-data source found.'
            exit 41
          fi
          python -m py_compile "$SCRIPT"
          echo 'PREOUTCOME GOVERNANCE + SYNTAX: PASS'

      - name: Execute Source/Data Gate only
        id: gate
        shell: bash
        run: |
          set +e
          python research/utxo_dormancy/source_gate.py
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload immutable source-gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: utxo-dormancy-v01-source-gate-${{ github.run_id }}
          path: utxo_dormancy_source_gate_out/
          if-no-files-found: error
          retention-days: 90

      - name: Enforce gate result
        if: always()
        shell: bash
        run: |
          code='${{ steps.gate.outputs.exit_code }}'
          test -n "$code" || { echo 'Missing source-gate exit code'; exit 42; }
          exit "$code"
