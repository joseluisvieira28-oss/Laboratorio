name: Bitget Depth Download Source V0.1.8

on:
  push:
    branches:
      - bitget-maker-microstructure-v0.1-source-gate-2026-10-05
    paths:
      - research/cross_venue_stock/bitget_depth_download_source_v018.py
      - .github/workflows/bitget-depth-download-source-v018.yml

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check requests
      - name: Verify source freeze
        run: |
          test -f research/cross_venue_stock/BITGET_MAKER_MICROSTRUCTURE_SOURCE_FREEZE_V0.1.md
          python -m py_compile research/cross_venue_stock/bitget_depth_download_source_v018.py
          echo DEPTH_SOURCE_ONLY_PASS
      - name: Probe official depth download
        run: python research/cross_venue_stock/bitget_depth_download_source_v018.py
      - uses: actions/upload-artifact@v4
        with:
          name: bitget-depth-source-v018-${{ github.run_id }}
          path: artifacts/cross_venue_stock/bitget_depth_download_v018
          if-no-files-found: error
          retention-days: 90
