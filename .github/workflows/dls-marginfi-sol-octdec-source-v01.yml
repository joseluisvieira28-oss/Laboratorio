name: DLS Marginfi SOL Oct-Dec Signed Flow Source V0.1

on:
  push:
    branches:
      - dls-marginfi-binance-bbo-execution-v01
    paths:
      - labs/DEFI_LIQUIDATION_SHOCK_001/LAUNCH_MARGINFI_SOL_OCTDEC_SOURCE_V01.marker

permissions:
  actions: read
  contents: read

jobs:
  month:
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - {month: "202410", artifact: "dls-field-enrichment-ms-marginfi-202410"}
          - {month: "202411", artifact: "dls-field-enrichment-ms-marginfi-202411"}
          - {month: "202412", artifact: "dls-field-enrichment-ms-marginfi-202412"}
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download canonical field partition
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 36263998920
          name: ${{ matrix.artifact }}
          path: field_month
      - name: Download bank registry
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 36312418451
          name: dls-marginfi-bank-unit-source-completion-v02
          path: bank_registry
      - run: python -m py_compile labs/DEFI_LIQUIDATION_SHOCK_001/source/census_marginfi_sol_octdec_month_v0_1.py
      - name: Execute exact-slot source census
        run: >
          python labs/DEFI_LIQUIDATION_SHOCK_001/source/census_marginfi_sol_octdec_month_v0_1.py
          --field-root field_month
          --bank-registry-root bank_registry
          --month "${{ matrix.month }}"
          --workers 6
      - name: Upload monthly evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dls-marginfi-sol-octdec-source-${{ matrix.month }}-v01
          path: |
            labs/DEFI_LIQUIDATION_SHOCK_001/MARGINFI_SOL_OCTDEC_SOURCE_${{ matrix.month }}_RECEIPT_V0.1.json
            labs/DEFI_LIQUIDATION_SHOCK_001/MARGINFI_SOL_OCTDEC_SOURCE_${{ matrix.month }}_ROWS_V0.1.ndjson
            labs/DEFI_LIQUIDATION_SHOCK_001/MARGINFI_SOL_OCTDEC_POPULATION_${{ matrix.month }}_V0.1.ndjson
          if-no-files-found: warn
          retention-days: 90

  merge:
    if: always()
    needs: month
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download monthly evidence
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ github.run_id }}
          pattern: dls-marginfi-sol-octdec-source-*-v01
          path: monthly
          merge-multiple: false
      - run: python -m py_compile labs/DEFI_LIQUIDATION_SHOCK_001/source/merge_marginfi_sol_octdec_source_v0_1.py
      - name: Merge and adjudicate source gate
        run: >
          python labs/DEFI_LIQUIDATION_SHOCK_001/source/merge_marginfi_sol_octdec_source_v0_1.py
          --root monthly
      - name: Upload terminal source evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dls-marginfi-sol-octdec-signed-flow-source-v01
          path: |
            labs/DEFI_LIQUIDATION_SHOCK_001/MARGINFI_SOL_OCTDEC_SIGNED_FLOW_SOURCE_RECEIPT_V0.1.json
            labs/DEFI_LIQUIDATION_SHOCK_001/MARGINFI_SOL_OCTDEC_SIGNED_FLOW_SOURCE_ROWS_V0.1.ndjson
            labs/DEFI_LIQUIDATION_SHOCK_001/MARGINFI_SOL_OCTDEC_SOURCE_POPULATION_V0.1.ndjson
          if-no-files-found: warn
          retention-days: 90
      - if: always()
        run: echo SOURCE_ONLY_NO_OCTDEC_MARKET_OUTCOMES_NO_TRADING
