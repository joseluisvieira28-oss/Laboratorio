name: MLRTS V0.1.4 Public Kline Recovery

on:
  push:
    branches: [mexc-launchpool-reward-token-sellpressure-v0.1-2026-10-08]
    paths:
      - 'research/mexc_launchpool_reward_token_sellpressure/public_kline_recovery_v014.py'
      - '.github/workflows/mlrts_v014_public_kline_recovery.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - run: python research/mexc_launchpool_reward_token_sellpressure/public_kline_recovery_v014.py
      - uses: actions/upload-artifact@v4
        with:
          name: mlrts-v014-public-kline-recovery
          path: artifacts/mlrts_v014_public_kline_recovery/
          retention-days: 90
