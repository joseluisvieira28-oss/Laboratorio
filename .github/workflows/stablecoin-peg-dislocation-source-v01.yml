name: Stablecoin Peg Dislocation Source Gate V0.1

on:
  workflow_dispatch:
  push:
    branches:
      - stablecoin-peg-dislocation-v0.1
    paths:
      - 'labs/STABLECOIN_PEG_DISLOCATION_001/**'
      - '.github/workflows/stablecoin-peg-dislocation-source-v01.yml'

permissions:
  contents: read

jobs:
  source_gate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Execute outcome-blind source/data gate
        run: python labs/STABLECOIN_PEG_DISLOCATION_001/source_gate_v01.py

      - name: Upload immutable source-gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stablecoin-peg-dislocation-source-${{ github.run_id }}-${{ github.run_attempt }}
          path: stablecoin_peg_source_gate_artifact/
          if-no-files-found: warn
          retention-days: 90
