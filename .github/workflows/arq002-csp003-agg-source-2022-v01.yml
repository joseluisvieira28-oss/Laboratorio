name: ARQ-002-CSP-003 AggTrades Source 2022 V0.1
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  month:
    strategy:
      fail-fast: false
      matrix:
        month: ["2022-01","2022-02","2022-03","2022-04","2022-05","2022-06","2022-07","2022-08","2022-09","2022-10","2022-11","2022-12"]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arq002-csp003-clean-2022-2023-v0.1
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Execute source-only aggTrades month
        run: python research/arq002_csp003/ARQ002_CSP003_AGG_SOURCE_MONTH_V0.1.py --month ${{ matrix.month }}
      - uses: actions/upload-artifact@v4
        with:
          name: arq002-csp003-agg-${{ matrix.month }}
          path: arq002_csp003_agg_source_${{ matrix.month }}.json
          if-no-files-found: error
          retention-days: 30

  aggregate:
    needs: month
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arq002-csp003-clean-2022-2023-v0.1
      - uses: actions/download-artifact@v4
        with:
          pattern: arq002-csp003-agg-*
          path: monthly
          merge-multiple: true
      - run: python research/arq002_csp003/ARQ002_CSP003_AGG_SOURCE_AGG_V0.1.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arq002-csp003-agg-source-2022-final
          path: ARQ002_CSP003_AGG_SOURCE_CENSUS_2022_V0.1.json
          if-no-files-found: error
          retention-days: 30
