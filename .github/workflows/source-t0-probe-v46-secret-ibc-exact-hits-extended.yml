name: source-t0-probe-v46-secret-ibc-exact-hits-extended
on:
  push:
    branches: [cosmos-native-emission-param-shock-001-v0.2-t0-remediation-2026-10-07]
    paths: [.github/workflows/source-t0-probe-v46-secret-ibc-exact-hits-extended.yml]
permissions: {contents: write}
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {ref: cosmos-native-emission-param-shock-001-v0.2-t0-remediation-2026-10-07}
      - name: Extended exact IBC hit census
        run: |
          python3 - <<'PY'
          import json,urllib.request,urllib.error,ssl,os,datetime
          from concurrent.futures import ThreadPoolExecutor
          H=[11880918,11880919,11880920,11880921]
          C=[
          ("terra","07-tendermint-28","https://terra-classic-rpc.publicnode.com:443"),
          ("sentinel","07-tendermint-96","https://sentinel-rpc.publicnode.com:443"),
          ("sifchain","07-tendermint-171","https://sifchain-rpc.publicnode.com:443"),
          ("noble","07-tendermint-24","https://noble-rpc.polkachu.com:443"),
          ("archway","07-tendermint-24","https://archway-mainnet-archive.allthatnode.com:26657"),
          ("migaloo","07-tendermint-6","https://migaloo-rpc.publicnode.com:443"),
          ("comdex","07-tendermint-142","https://comdex-rpc.publicnode.com:443"),
          ("jackal","07-tendermint-6","https://rpc.jackalprotocol.com"),
          ("stargaze","07-tendermint-177","https://stargaze-rpc.publicnode.com:443"),
          ("evmos","07-tendermint-50","https://rpc.evmos.citizenweb3.com:443"),
          ("quicksilver","07-tendermint-28","https://rpc.quicksilver.citizenweb3.com"),
          ("stargaze2","07-tendermint-177","https://rpc.stargaze-apis.com/"),
          ("evmos2","07-tendermint-50","https://evmos-rpc.polkachu.com"),
          ("quicksilver2","07-tendermint-28","https://quicksilver-rpc.publicnode.com:443")]
          def one(x):
            n,c,u,h=x;q=f"update_client.client_id='{c}' AND update_client.consensus_height='4-{h}'"
            p={"jsonrpc":"2.0","id":1,"method":"tx_search","params":{"query":q,"prove":False,"page":"1","per_page":"100","order_by":"asc"}}
            try:
              req=urllib.request.Request(u,data=json.dumps(p).encode(),headers={"Content-Type":"application/json","User-Agent":"CryptoLab-v46"},method="POST")
              with urllib.request.urlopen(req,timeout=10,context=ssl._create_unverified_context()) as z:
                d=json.loads(z.read());txs=(d.get("result") or {}).get("txs") or []
                return {"carrier":n,"client":c,"endpoint":u,"height":h,"ok":True,"status":z.status,
                        "hits":[{"tx_hash":t.get("hash"),"carrier_height":int(t["height"])} for t in txs]}
            except urllib.error.HTTPError as e:return {"carrier":n,"client":c,"endpoint":u,"height":h,"ok":False,"status":e.code,"error":str(e),"hits":[]}
            except Exception as e:return {"carrier":n,"client":c,"endpoint":u,"height":h,"ok":False,"status":None,"error":repr(e),"hits":[]}
          jobs=[(n,c,u,h) for n,c,u in C for h in H]
          with ThreadPoolExecutor(max_workers=48) as ex:rows=list(ex.map(one,jobs))
          hits=[r for r in rows if r["hits"]]
          out={"scope":"SOURCE_ONLY_NO_MARKET_DATA","target":"2023-12-07T02:54:58.930543213Z",
            "historical_client_basis":"cosmos/chain-registry@1e09e733c20edd5b6a76d42e2abdfc2f085382df",
            "tested_utc":datetime.datetime.now(datetime.timezone.utc).isoformat(),"rows":rows,"hits":hits}
          p="research/cosmos_native_emission_param_shock_001_v0_2/SCRT287_IBC_EXACT_HITS_EXTENDED_V46.json"
          os.makedirs(os.path.dirname(p),exist_ok=True);open(p,"w").write(json.dumps(out,indent=2))
          print("V46",json.dumps({"hits":hits}))
          PY
      - name: Persist
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/cosmos_native_emission_param_shock_001_v0_2/SCRT287_IBC_EXACT_HITS_EXTENDED_V46.json
          git commit -m "SCRT287: persist extended exact IBC hit census v46"
          git pull --rebase origin cosmos-native-emission-param-shock-001-v0.2-t0-remediation-2026-10-07
          git push origin HEAD:cosmos-native-emission-param-shock-001-v0.2-t0-remediation-2026-10-07
