name: MEXC Event Futures Browser Exact Capture V0.11.6

on:
  push:
    branches:
      - mexc-event-futures-browser-source-v0.11.6-live-get-capture-2026-10-03
    paths:
      - 'research/mexc_event_futures/**'
      - '.github/workflows/mexc-event-futures-browser-exact-v0116.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-exact-capture:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Syntax check
        run: python -m py_compile research/mexc_event_futures/browser_exact_capture_v0116.py
      - name: Run browser exact-product capture
        run: python research/mexc_event_futures/browser_exact_capture_v0116.py
      - name: Verify fail-closed safety boundary
        shell: bash
        run: |
          python - <<'PY'
          import json
          p='artifacts/mexc_event_futures/browser_exact_capture_v0116.json'
          j=json.load(open(p,encoding='utf-8'))
          assert j['authenticated_requests']==0
          assert j['orders']==0
          assert j['account_mutations']==0
          assert j['private_routes_called']==0
          assert j['transmitted_non_gets']==0
          print('NO_AUTH=PASS')
          print('NO_ORDERS=PASS')
          print('NO_MUTATION=PASS')
          print('NO_PRIVATE=PASS')
          print('GET_ONLY_TRANSMITTED=PASS')
          print('VERDICT='+j['verdict'])
          print('COUNTERS='+json.dumps(j['counters'],sort_keys=True))
          PY
      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: mexc-event-futures-browser-exact-v0116-evidence
          path: artifacts/mexc_event_futures/browser_exact_capture_v0116.json
          if-no-files-found: error
