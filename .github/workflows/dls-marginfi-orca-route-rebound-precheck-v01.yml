name: DLS Marginfi Orca Route Rebound Pre-Outcome V0.1

on:
  push:
    branches:
      - dls-marginfi-orca-route-rebound-v01
    paths:
      - labs/DEFI_LIQUIDATION_SHOCK_001/LAUNCH_MARGINFI_ORCA_ROUTE_REBOUND_PRECHECK_V01.marker

permissions:
  actions: read
  contents: read

jobs:
  precheck:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download canonical Oct-Dec Orca source PASS
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 36782337541
          artifact-ids: 11127978050
          path: source_gate

      - name: Compile source-only precheck
        run: python -m py_compile labs/DEFI_LIQUIDATION_SHOCK_001/source/precheck_marginfi_orca_route_rebound_v0_1.py

      - name: Execute source-only precheck
        run: >
          python labs/DEFI_LIQUIDATION_SHOCK_001/source/precheck_marginfi_orca_route_rebound_v0_1.py
          --source-root source_gate

      - name: Upload immutable pre-outcome evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dls-marginfi-orca-route-rebound-precheck-v01
          path: |
            labs/DEFI_LIQUIDATION_SHOCK_001/MARGINFI_ORCA_ROUTE_REBOUND_V01_PREOUTCOME_RECEIPT.json
            labs/DEFI_LIQUIDATION_SHOCK_001/MARGINFI_ORCA_ROUTE_REBOUND_V01_PREOUTCOME_CASCADES.ndjson
          if-no-files-found: warn
          retention-days: 90

      - name: Firewall
        if: always()
        run: echo SOURCE_ONLY_NO_OCTDEC_OHLC_RETURNS_PNL_NO_TRADING
