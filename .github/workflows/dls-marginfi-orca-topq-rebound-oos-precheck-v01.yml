name: DLS Marginfi Orca Top-Quartile Rebound OOS Precheck V0.1

on:
  push:
    branches:
      - dls-marginfi-orca-rebound-oos-v01
    paths:
      - labs/DEFI_LIQUIDATION_SHOCK_001/LAUNCH_MARGINFI_ORCA_TOPQ_OOS_PRECHECK_V01.marker

permissions:
  actions: read
  contents: read

jobs:
  precheck:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download exact canonical Oct-Dec Orca source PASS
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 36814861360
          artifact-ids: 11140129257
          path: source_gate

      - name: Compile frozen pre-outcome gate
        run: python -m py_compile labs/DEFI_LIQUIDATION_SHOCK_001/source/precheck_marginfi_orca_topq_rebound_oos_v0_1.py

      - name: Execute feature-only OOS selection
        run: >
          python labs/DEFI_LIQUIDATION_SHOCK_001/source/precheck_marginfi_orca_topq_rebound_oos_v0_1.py
          --source-root source_gate
          --workers 12

      - name: Upload immutable pre-outcome evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dls-marginfi-orca-topq-rebound-oos-precheck-v01
          path: |
            labs/DEFI_LIQUIDATION_SHOCK_001/MARGINFI_ORCA_TOPQ_REBOUND_OOS_V01_PREOUTCOME_SELECTION_RECEIPT.json
            labs/DEFI_LIQUIDATION_SHOCK_001/MARGINFI_ORCA_TOPQ_REBOUND_OOS_V01_PREOUTCOME_SELECTION_ROWS.ndjson
            labs/DEFI_LIQUIDATION_SHOCK_001/MARGINFI_ORCA_TOPQ_REBOUND_OOS_V01_PREOUTCOME_VOLUME_MANIFEST.ndjson
          if-no-files-found: warn
          retention-days: 90

      - name: Firewall
        if: always()
        run: echo FEATURE_ONLY_NO_OCTDEC_OHLC_RETURNS_PNL
