name: STABLECOIN-EXCHANGE-FLOW-001 Daily Aggregation Gate V0.1

on:
  push:
    branches:
      - stablecoin-exchange-flow-v0.1
    paths:
      - 'labs/STABLECOIN_EXCHANGE_FLOW_001/blockchair_aggregation_gate_v01.py'
      - '.github/workflows/stablecoin-exchange-flow-aggregation-gate-v01.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  aggregation-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout isolated branch
        uses: actions/checkout@v4
      - name: Compile aggregation gate
        run: python -m py_compile labs/STABLECOIN_EXCHANGE_FLOW_001/blockchair_aggregation_gate_v01.py
      - name: Execute protected daily aggregation gate
        run: python labs/STABLECOIN_EXCHANGE_FLOW_001/blockchair_aggregation_gate_v01.py
      - name: Upload immutable receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stablecoin-exchange-flow-001-aggregation-gate-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/stablecoin_exchange_flow_aggregation_gate_v01/
          retention-days: 90
