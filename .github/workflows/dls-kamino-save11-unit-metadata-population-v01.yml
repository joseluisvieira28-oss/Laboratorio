name: DLS Kamino Save11 Unit Metadata Population V0.1

on:
  push:
    branches:
      - dls-field-enrichment-v01
    paths:
      - .github/workflows/dls-kamino-save11-unit-metadata-population-v01.yml

permissions:
  actions: read
  contents: read

jobs:
  units:
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - protocol: kamino
            id: kamino-202311
            start: '2023-11-17T14:48:24Z'
            end: '2023-12-01T00:00:00Z'
            baseline_pattern: 'dls-census-v043-k202311'
          - protocol: kamino
            id: kamino-202312
            start: '2023-12-01T00:00:00Z'
            end: '2024-01-01T00:00:00Z'
            baseline_pattern: 'dls-census-v043-k202312'
          - protocol: kamino
            id: kamino-202401
            start: '2024-01-01T00:00:00Z'
            end: '2024-02-01T00:00:00Z'
            baseline_pattern: 'dls-census-v043-k202401'
          - protocol: kamino
            id: kamino-202402
            start: '2024-02-01T00:00:00Z'
            end: '2024-03-01T00:00:00Z'
            baseline_pattern: 'dls-census-v043-k202402'
          - protocol: kamino
            id: kamino-202403
            start: '2024-03-01T00:00:00Z'
            end: '2024-04-01T00:00:00Z'
            baseline_pattern: 'dls-census-v043-k202403'
          - protocol: kamino
            id: kamino-202404
            start: '2024-04-01T00:00:00Z'
            end: '2024-05-01T00:00:00Z'
            baseline_pattern: 'dls-census-v043-k202404'
          - protocol: kamino
            id: kamino-202405
            start: '2024-05-01T00:00:00Z'
            end: '2024-06-01T00:00:00Z'
            baseline_pattern: 'dls-census-v043-k202405'
          - protocol: kamino
            id: kamino-202406
            start: '2024-06-01T00:00:00Z'
            end: '2024-07-01T00:00:00Z'
            baseline_pattern: 'dls-census-v043-k202406'
          - protocol: kamino
            id: kamino-202407
            start: '2024-07-01T00:00:00Z'
            end: '2024-08-01T00:00:00Z'
            baseline_pattern: 'dls-census-v043-k202407'
          - protocol: kamino
            id: kamino-202408
            start: '2024-08-01T00:00:00Z'
            end: '2024-09-01T00:00:00Z'
            baseline_pattern: 'dls-census-v043-k202408'
          - protocol: kamino
            id: kamino-202409
            start: '2024-09-01T00:00:00Z'
            end: '2024-10-01T00:00:00Z'
            baseline_pattern: 'dls-census-v043-k202409'
          - protocol: kamino
            id: kamino-202410
            start: '2024-10-01T00:00:00Z'
            end: '2024-11-01T00:00:00Z'
            baseline_pattern: 'dls-census-v043-k202410'
          - protocol: kamino
            id: kamino-202411
            start: '2024-11-01T00:00:00Z'
            end: '2024-12-01T00:00:00Z'
            baseline_pattern: 'dls-census-v043-k202411'
          - protocol: kamino
            id: kamino-202412
            start: '2024-12-01T00:00:00Z'
            end: '2025-01-01T00:00:00Z'
            baseline_pattern: 'dls-census-v043-k202412'
          - protocol: save11
            id: save11-202407
            start: '2024-07-19T19:30:52Z'
            end: '2024-08-01T00:00:00Z'
            baseline_pattern: 'dls-census-v043-s202407'
          - protocol: save11
            id: save11-202408
            start: '2024-08-01T00:00:00Z'
            end: '2024-09-01T00:00:00Z'
            baseline_pattern: 'dls-census-v043-s202408'
          - protocol: save11
            id: save11-202409
            start: '2024-09-01T00:00:00Z'
            end: '2024-10-01T00:00:00Z'
            baseline_pattern: 'dls-census-v043-s202409'
          - protocol: save11
            id: save11-202410
            start: '2024-10-01T00:00:00Z'
            end: '2024-11-01T00:00:00Z'
            baseline_pattern: 'dls-census-v043-s202410'
          - protocol: save11
            id: save11-202411
            start: '2024-11-01T00:00:00Z'
            end: '2024-12-01T00:00:00Z'
            baseline_pattern: 'dls-census-v043-s202411'
          - protocol: save11
            id: save11-202412
            start: '2024-12-01T00:00:00Z'
            end: '2025-01-01T00:00:00Z'
            baseline_pattern: 'dls-census-v043-s202412'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download canonical monthly baseline
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 35958824070
          pattern: ${{ matrix.baseline_pattern }}
          path: baseline
          merge-multiple: true
      - name: Compile unit metadata runner
        run: python -m py_compile labs/DEFI_LIQUIDATION_SHOCK_001/source/run_kamino_save11_unit_metadata_partition_v0_1.py
      - name: Exact-join and reconstruct event units
        run: >
          python labs/DEFI_LIQUIDATION_SHOCK_001/source/run_kamino_save11_unit_metadata_partition_v0_1.py
          --protocol "${{ matrix.protocol }}"
          --start "${{ matrix.start }}"
          --end "${{ matrix.end }}"
          --baseline baseline
          --partition-id "${{ matrix.id }}"
          --out "units/${{ matrix.id }}.json"
      - name: Upload unit partition
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dls-ks-unit-${{ matrix.id }}
          path: units/${{ matrix.id }}.json
          if-no-files-found: warn
          retention-days: 30
      - name: Firewall
        if: always()
        run: echo SOURCE_ONLY_TRUE

  aggregate:
    needs: units
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: dls-ks-unit-*
          path: unit_receipts
          merge-multiple: true
      - name: Compile aggregator
        run: python -m py_compile labs/DEFI_LIQUIDATION_SHOCK_001/source/aggregate_kamino_save11_unit_metadata_v0_1.py
      - name: Aggregate population unit coverage
        run: python labs/DEFI_LIQUIDATION_SHOCK_001/source/aggregate_kamino_save11_unit_metadata_v0_1.py unit_receipts
      - name: Upload population unit receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dls-kamino-save11-unit-metadata-population-v01
          path: labs/DEFI_LIQUIDATION_SHOCK_001/KAMINO_SAVE11_UNIT_METADATA_POPULATION_RECEIPT_V0.1.json
          if-no-files-found: warn
          retention-days: 30
      - name: Firewall
        if: always()
        run: echo SOURCE_ONLY_TRUE
