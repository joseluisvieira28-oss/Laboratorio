name: LL-0017 Positioning Ratio — Source Schema V0.1A

on:
  workflow_dispatch:
  push:
    branches:
      - ll-0017-positioning-ratio-v0.1
    paths:
      - 'research/ll0017_positioning/LL0017_SOURCE_V01A_TRIGGER.txt'

permissions:
  contents: read

jobs:
  source-schema-v01a:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m py_compile research/ll0017_positioning/source_schema_probe_v01a.py
      - run: pip install --disable-pip-version-check requests
      - run: python research/ll0017_positioning/source_schema_probe_v01a.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LL0017_POSITIONING_RATIO_SOURCE_SCHEMA_V0_1A
          path: ll0017_source_v01a_output/LL0017_POSITIONING_RATIO_SOURCE_SCHEMA_RECEIPT_V0_1A.json
          if-no-files-found: warn
          retention-days: 30
