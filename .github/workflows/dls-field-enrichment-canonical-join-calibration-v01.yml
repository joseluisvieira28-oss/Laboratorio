name: DLS Field Enrichment Canonical Join Calibration V0.1

on:
  push:
    branches:
      - dls-drift-sqd-boundary-v01
    paths:
      - .github/workflows/dls-field-enrichment-canonical-join-calibration-v01.yml

permissions:
  contents: read

jobs:
  calibrate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile
        run: python -m py_compile labs/DEFI_LIQUIDATION_SHOCK_001/source/calibrate_field_enrichment_canonical_join_v0_1.py
      - name: Compare baseline and enriched canonical key sets
        run: python labs/DEFI_LIQUIDATION_SHOCK_001/source/calibrate_field_enrichment_canonical_join_v0_1.py
      - name: Upload receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dls-field-enrichment-canonical-join-calibration-v01
          path: labs/DEFI_LIQUIDATION_SHOCK_001/FIELD_ENRICHMENT_CANONICAL_JOIN_CALIBRATION_RECEIPT_V0.1.json
          if-no-files-found: error
          retention-days: 30
      - name: Firewall
        if: always()
        run: echo SOURCE_ONLY_TRUE
