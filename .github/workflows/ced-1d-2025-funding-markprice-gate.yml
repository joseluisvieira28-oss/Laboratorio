name: CED 1D 2025 Funding MarkPrice Source Gate

on:
  push:
    branches:
      - ced-1d-v3-byte-recovery-2026-09-17
    paths:
      - '.github/workflows/ced-1d-2025-funding-markprice-gate.yml'
      - 'Dream-Account-OS-v2.3-PARTIAL/research/ced_1d_v3/CED_1D_2025_FUNDING_MARKPRICE_ARCHIVE_AMENDMENT_V0.3.json'
      - 'Dream-Account-OS-v2.3-PARTIAL/research/ced_1d_v3/ced_1d_2025_funding_markprice_archive_gate_v03.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  funding-markprice-source-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ROOT: Dream-Account-OS-v2.3-PARTIAL/research/ced_1d_v3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile source-only archive gate
        run: python -m py_compile "$ROOT/ced_1d_2025_funding_markprice_archive_gate_v03.py"
      - name: Recover exact 2025 funding settlements plus exact-timestamp mark price
        run: |
          python "$ROOT/ced_1d_2025_funding_markprice_archive_gate_v03.py" \
            --output "$RUNNER_TEMP/markprice-archive-gate"
      - name: Assert source-only funded-provenance gate
        run: |
          python - <<'PY'
          import json,os
          p=os.path.join(
              os.environ['RUNNER_TEMP'],
              'markprice-archive-gate',
              'CED_1D_2025_FUNDING_MARKPRICE_ARCHIVE_SOURCE_GATE_RECEIPT_V0.3.json'
          )
          x=json.load(open(p))
          assert x['status']=='FUNDING_MARKPRICE_SOURCE_PASS',x
          for symbol in ['AVAXUSDT','SOLUSDT']:
              assert x['symbols'][symbol]['funding_records']==1095,(symbol,x)
              assert x['symbols'][symbol]['paired_records']==1095,(symbol,x)
          for k in ['outcomes_computed','signals_computed','returns_computed','pnl_computed','promotion_computed','year_2026_accessed']:
              assert x[k] is False,(k,x)
          assert x['orders_created'] is False and x['live_capital_enabled'] is False,x
          print('FUNDING_MARKPRICE_ARCHIVE_SOURCE_GATE_PASS')
          PY
      - name: Remove bulky raw archives after receipt and pairing hashes are sealed
        if: always()
        run: |
          find "$RUNNER_TEMP/markprice-archive-gate" -type f \
            \( -name '*.zip' -o -name '*.CHECKSUM' \) -delete || true
      - name: Upload source-only funded-provenance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ced1d-2025-funding-markprice-archive-source-gate
          path: ${{ runner.temp }}/markprice-archive-gate/
          if-no-files-found: error
          retention-days: 30
