name: CVFB Native Oracle P0F Explorer Blocks Execute V0.1A

on:
  push:
    branches:
      - cross-venue-funding-basis-provenance-v0.5
    paths:
      - '.github/workflows/cvfb-native-oracle-p0f-execute-v01a.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bounded-requester-pays-source-schema-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install frozen P0F runtime
        run: python -m pip install --disable-pip-version-check -r research/cross_venue_funding_basis/requirements_p0e_v01.txt

      - name: Compile frozen P0F runner
        run: python -m py_compile research/cross_venue_funding_basis/cvfb_native_oracle_p0f_explorer_blocks_v01a.py

      - name: Verify immutable P0F authority before source access
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          freeze = json.loads(Path('research/cross_venue_funding_basis/CVFB_NATIVE_ORACLE_PROVENANCE_P0F_EXPLORER_BLOCKS_RAW_FREEZE_V0.1A.json').read_text())
          auth = json.loads(Path('research/cross_venue_funding_basis/CVFB_NATIVE_ORACLE_PROVENANCE_P0F_EXPLORER_BLOCKS_REQUESTER_PAYS_AUTHORIZATION_V0.1.json').read_text())
          assert auth['status'] == 'AUTHORIZED_BEFORE_FIRST_REQUESTER_PAYS_S3_REQUEST'
          assert auth['freeze_git_blob_sha'] == '3517c354b0ad6e7e79e7a85d0755127aa9c367ba'
          assert auth['requester_pays_charges_authorized'] is True
          assert auth['aws_credentials_authorized'] is True
          assert auth['execution_authorized'] is True
          assert auth['economic_outcomes_authorized'] is False
          assert auth['2026_authorized'] is False
          assert auth['live_trading_authorized'] is False
          assert auth['exchange_mutation_authorized'] is False
          assert auth['merge_to_main_authorized'] is False
          assert freeze['frozen_target']['scan_block_count'] == 301
          assert freeze['cost_and_completeness_caps']['max_list_requests'] == 0
          assert freeze['cost_and_completeness_caps']['max_head_requests'] == 4
          assert freeze['cost_and_completeness_caps']['max_get_requests'] == 4
          assert len(freeze['deterministic_object_hypothesis']['exact_keys']) == 4
          print('P0F_IMMUTABLE_AUTHORITY_GUARD_PASS')
          PY

      - name: Execute exact bounded P0F source-only probe
        id: execute
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.CVFB_P0E_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CVFB_P0E_AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ secrets.CVFB_P0E_AWS_SESSION_TOKEN }}
          CVFB_P0F_EXPLORER_BLOCKS_REQUESTER_PAYS_AUTHORIZED: 'YES'
        run: |
          mkdir -p out/cvfb_p0f
          set +e
          python research/cross_venue_funding_basis/cvfb_native_oracle_p0f_explorer_blocks_v01a.py \
            --execute \
            --authorization-confirmation 'I_EXPLICITLY_AUTHORIZE_CVFB_P0F_EXPLORER_BLOCKS_REQUESTER_PAYS' \
            --out out/cvfb_p0f/CVFB_NATIVE_ORACLE_PROVENANCE_P0F_RECEIPT_V0.1A.json
          rc=$?
          set -e
          echo "probe_rc=$rc" >> "$GITHUB_OUTPUT"
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 3 ]; then
            exit "$rc"
          fi

      - name: Enforce source-only receipt firewall
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('out/cvfb_p0f/CVFB_NATIVE_ORACLE_PROVENANCE_P0F_RECEIPT_V0.1A.json')
          assert p.exists(), 'P0F receipt missing'
          x = json.loads(p.read_text())
          assert x['freeze_git_blob_sha'] == '3517c354b0ad6e7e79e7a85d0755127aa9c367ba'
          assert x['raw_object_bodies_emitted'] is False
          assert x['market_numeric_values_emitted'] is False
          assert x['oracle_numeric_values_emitted'] is False
          assert x['economic_outcomes_computed'] is False
          assert x['primary_replication_reopened'] is False
          assert x['2026_opened'] is False
          assert x['live_trading_authorized'] is False
          assert x['merge_to_main_authorized'] is False
          if x['status'] == 'COMPLETE':
              assert x['decision'] in {
                  'PASS_ORACLE_SCHEMA_CANDIDATE_REQUIRES_IDENTITY_AUDIT',
                  'FAIL_NO_ORACLE_SCHEMA_VISIBLE',
              }
              s = x['source']
              assert s['list_requests'] == 0
              assert s['head_requests'] == 4
              assert s['get_requests'] == 4
              assert s['compressed_bytes'] <= 33554432
          else:
              assert x['status'] == 'TECHNICAL_BLOCKED'
              assert x['decision'] in {
                  'TECHNICAL_BLOCKED_SOURCE_COVERAGE',
                  'TECHNICAL_BLOCKED_COST_OR_DECODER',
                  'BLOCKED_NO_AUTHORIZATION',
                  'TECHNICAL_BLOCKED',
                  'FREEZE_BLOB_MISMATCH',
              }, x
          print('P0F_SOURCE_ONLY_FIREWALL_PASS', x['status'], x['decision'])
          PY

      - name: Upload P0F receipt
        uses: actions/upload-artifact@v4
        with:
          name: CVFB_NATIVE_ORACLE_PROVENANCE_P0F_V01A
          path: out/cvfb_p0f/CVFB_NATIVE_ORACLE_PROVENANCE_P0F_RECEIPT_V0.1A.json
          if-no-files-found: error
          retention-days: 90
