name: DIGUI-009 Point-in-Time Holder Audit
on:
  pull_request:
    paths:
      - "research/digui009/**"
      - ".github/workflows/digui-009-asof.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  asof:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install parquet + analysis dependencies
        run: python -m pip install "huggingface_hub>=0.25,<2" "hf_xet>=1,<3" "pyarrow>=17,<26" "numpy>=1.26,<3" "pandas>=2.2,<4" "scikit-learn>=1.4,<2" "fsspec>=2024.6" "duckdb>=1.0,<2"
      - name: Inspect raw trading schema at pinned revision
        run: python research/digui009/probe.py
      - name: Replay entire 33.58M historical trades (READ-ONLY)
        env:
          HF_HUB_DISABLE_TELEMETRY: '1'
        run: python research/digui009/analysis.py
      - name: Archive immutable audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: digui009-asof-${{ github.run_id }}
          path: digui009-evidence/
          retention-days: 90
          if-no-files-found: warn
