name: MLMXD V0.1.2 Official Tag Source Census

on:
  push:
    branches:
      - mexc-launchpool-mx-demand-v0.1-source-2026-10-07
    paths:
      - 'research/mexc_launchpool_mx_demand/source_census_tag_v012.py'
      - '.github/workflows/mlmxd_v012_source_census.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-census:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4
      - name: Run official MEXC Launchpool source census
        run: python research/mexc_launchpool_mx_demand/source_census_tag_v012.py
      - name: Verify outcome quarantine
        run: |
          python - <<'PY'
          import json
          p=json.load(open('artifacts/mexc_launchpool_mx_demand_v012_source/summary.json'))
          assert p['authenticated'] is False
          assert p['market_prices_opened'] is False
          print(json.dumps(p,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: mlmxd-v012-official-source-census
          path: artifacts/mexc_launchpool_mx_demand_v012_source/
          retention-days: 90
