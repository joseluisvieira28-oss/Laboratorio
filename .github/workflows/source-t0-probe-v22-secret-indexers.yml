name: source-t0-probe-v22-secret-indexers

on:
  push:
    branches:
      - cosmos-native-emission-param-shock-001-v0.2-t0-remediation-2026-10-07
    paths:
      - .github/workflows/source-t0-probe-v22-secret-indexers.yml

permissions:
  contents: read

jobs:
  secret-indexers:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Probe public Secret historical block metadata only
        shell: bash
        run: |
          python3 - <<'PY'
          import json, urllib.request, ssl, concurrent.futures
          from datetime import datetime

          TARGET="2023-12-07T02:54:58.930543213Z"
          TT=datetime.fromisoformat(TARGET.replace("Z","+00:00")).timestamp()
          UA={"User-Agent":"CryptoLab-source-only-secret-v22"}
          grid=[11752974,11820000,11850000,11870000,11885000,11900000,11920000]

          templates=[
            ("ankr_rpc","https://rpc.ankr.com/http/scrt/block?height={h}"),
            ("ankr_cosmos","https://rpc.ankr.com/http/scrt_cosmos/cosmos/base/tendermint/v1beta1/blocks/{h}"),
            ("cosmostation_api_blocks","https://api-secret.cosmostation.io/blocks/{h}"),
            ("cosmostation_api_block","https://api-secret.cosmostation.io/block/{h}"),
            ("cosmostation_lcd","https://lcd-secret.cosmostation.io/cosmos/base/tendermint/v1beta1/blocks/{h}"),
            ("sifchain_rpc","https://proxies.sifchain.finance/api/secret-4/rpc/block?height={h}"),
            ("sifchain_rest","https://proxies.sifchain.finance/api/secret-4/rest/cosmos/base/tendermint/v1beta1/blocks/{h}"),
          ]

          def get(url,to=10):
            try:
              q=urllib.request.Request(url,headers=UA)
              with urllib.request.urlopen(q,timeout=to,context=ssl._create_unverified_context()) as r:
                raw=r.read().decode("utf-8","replace")
                try:d=json.loads(raw)
                except:d=raw[:5000]
                return {"ok":True,"status":r.status,"url":r.geturl(),"data":d}
            except Exception as e:
              return {"ok":False,"url":url,"error":repr(e)[:500]}

          def parse(d):
            if not isinstance(d,dict): return None
            paths=[
              ("result","block","header"),
              ("block","header"),
              ("sdk_block","header"),
              ("header",),
              ("data","block","header"),
            ]
            for path in paths:
              z=d
              try:
                for k in path:z=z[k]
                h=z.get("height") or z.get("block_height")
                t=z.get("time") or z.get("timestamp")
                if h is not None and t:
                  return int(h),str(t)
              except: pass
            # explorer flattened shapes
            h=d.get("height") or d.get("block_height")
            t=d.get("time") or d.get("timestamp") or d.get("block_time")
            if h is not None and t:
              return int(h),str(t)
            return None

          def ts(t):
            try:
              if str(t).isdigit():
                x=int(t); return (x/1000 if x>10**12 else x)
              return datetime.fromisoformat(str(t).replace("Z","+00:00")).timestamp()
            except:return None

          def one(x):
            name,tpl,h=x; r=get(tpl.format(h=h))
            z=parse(r.get("data"))
            return {"name":name,"height_requested":h,"ok":r["ok"],"status":r.get("status"),
                    "url":r.get("url"),"error":r.get("error"),
                    "parsed":{"height":z[0],"time":z[1]} if z else None}

          jobs=[(n,t,h) for n,t in templates for h in grid]
          with concurrent.futures.ThreadPoolExecutor(max_workers=28) as ex:
            rows=list(ex.map(one,jobs))

          good=[r for r in rows if r["parsed"] and r["parsed"]["height"]==r["height_requested"]]
          by={}
          for r in good:
            tv=ts(r["parsed"]["time"])
            if tv is not None: by.setdefault(r["name"],[]).append((r["height_requested"],tv,r["parsed"]["time"]))
          brackets=[]
          for name,pts in by.items():
            pts.sort()
            for a,b in zip(pts,pts[1:]):
              if a[1] < TT <= b[1]:
                brackets.append({"name":name,"lo":a,"hi":b}); break

          exact=[]
          template_map=dict(templates)
          for br in brackets:
            name=br["name"];tpl=template_map[name]
            L,R=int(br["lo"][0]),int(br["hi"][0]);err=None
            while L<R:
              M=(L+R)//2
              rr=get(tpl.format(h=M)); z=parse(rr.get("data"))
              if not z or z[0]!=M or ts(z[1]) is None:
                err={"height":M,"ok":rr["ok"],"status":rr.get("status"),"error":rr.get("error")}; break
              if ts(z[1])>=TT:R=M
              else:L=M+1
            rec={"name":name,"error":err}
            if err is None:
              H=L;rec["H_vote_end_block"]=H;rec["neighbors"]=[]
              for h in range(H-2,H+3):
                rr=get(tpl.format(h=h));z=parse(rr.get("data"))
                rec["neighbors"].append({"requested":h,"parsed":{"height":z[0],"time":z[1]} if z else None,
                                         "ok":rr["ok"],"status":rr.get("status"),"error":rr.get("error")})
            exact.append(rec)

          out={"scope":"SOURCE_ONLY_NO_MARKET_DATA","target":TARGET,
               "successful_grid":good,"brackets":brackets,"exact":exact,
               "informative_failures":[r for r in rows if not r["parsed"]][:30]}
          print("SECRET_INDEXERS_V22_BEGIN")
          print(json.dumps(out,indent=2,sort_keys=True)[:600000])
          print("SECRET_INDEXERS_V22_END")
          PY
