name: PMD-001 IDX421 Source Density Profile
on:
  push:
    branches: [pumpfun-migration-direction-v0.1]
    paths:
      - 'Dream-Account-OS-v2.3-PARTIAL/research/pumpfun_migration_direction_001/RUN_IDX421_SOURCE_DENSITY_PROFILE.trigger'
permissions:
  contents: read
jobs:
  profile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pumpfun-migration-direction-v0.1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --upgrade pip duckdb huggingface_hub requests solders pytz
      - name: Rebuild frozen manifest
        working-directory: Dream-Account-OS-v2.3-PARTIAL/research/pumpfun_migration_direction_001
        run: |
          python build_source_rebuild_manifest_v01.py --data-dir profile_manifest_data --out pmd_source_rebuild_manifest_v01.jsonl --receipt profile_manifest_receipt.json
          test ! -e profile_manifest_data/postgard_outcomes.parquet
      - name: Profile index 421 without block fetch
        working-directory: Dream-Account-OS-v2.3-PARTIAL/research/pumpfun_migration_direction_001
        run: python profile_idx421_source_density.py
      - uses: actions/upload-artifact@v4
        with:
          name: PMD-001-idx421-source-density-profile
          retention-days: 30
          path: Dream-Account-OS-v2.3-PARTIAL/research/pumpfun_migration_direction_001/idx421_profile.json
