name: ARQ-002-CSP-003 Frozen Discovery 2024 V0.1

on:
  push:
    branches:
      - arq002-csp003-validity-mask-v0.1
    paths:
      - research/arq002_csp003/ARQ002_CSP003_DISCOVERY_MONTH_V0.1.py
      - research/arq002_csp003/ARQ002_CSP003_DISCOVERY_AGGREGATE_V0.1.py
      - research/arq002_csp003/ARQ002_CSP003_SOURCE_CLOSEOUT_V0.1.json
      - .github/workflows/arq002-csp003-discovery-v01.yml

permissions:
  contents: read

jobs:
  month:
    strategy:
      fail-fast: false
      matrix:
        month: ["2024-01","2024-02","2024-03","2024-04","2024-05","2024-06","2024-07","2024-08","2024-09","2024-10","2024-11","2024-12"]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile frozen runner
        run: python -m py_compile research/arq002_csp003/ARQ002_CSP003_DISCOVERY_MONTH_V0.1.py
      - name: Execute frozen month
        id: run
        continue-on-error: true
        run: python research/arq002_csp003/ARQ002_CSP003_DISCOVERY_MONTH_V0.1.py --month ${{ matrix.month }}
      - name: Upload month receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arq002-csp003-discovery-${{ matrix.month }}
          path: arq002_csp003_discovery_${{ matrix.month }}.json
          if-no-files-found: error
          retention-days: 30
      - name: Enforce month
        if: always()
        run: |
          python - <<'PY'
          import glob,json
          fs=glob.glob("arq002_csp003_discovery_*.json")
          if len(fs)!=1: raise SystemExit("FAIL_CLOSED: missing month receipt")
          r=json.load(open(fs[0]))
          if r.get("classification")!="DISCOVERY_MONTH_COMPLETE":
              raise SystemExit("FAIL_CLOSED: month incomplete")
          if r.get("source_mask_drift") is not False:
              raise SystemExit("FAIL_CLOSED: source validity mask drift")
          if r.get("confirmation_2025_accessed") is not False or r.get("final_holdout_2026_accessed") is not False:
              raise SystemExit("FAIL_CLOSED: protected period")
          print("DISCOVERY_MONTH_COMPLETE")
          PY

  aggregate:
    needs: month
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: arq002-csp003-discovery-*
          path: monthly_discovery
          merge-multiple: true
      - name: Compile frozen aggregate
        run: python -m py_compile research/arq002_csp003/ARQ002_CSP003_DISCOVERY_AGGREGATE_V0.1.py
      - name: Aggregate frozen 2024 Discovery
        id: aggregate
        continue-on-error: true
        run: python research/arq002_csp003/ARQ002_CSP003_DISCOVERY_AGGREGATE_V0.1.py
      - name: Upload final receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arq002-csp003-discovery-final-v01
          path: ARQ002_CSP003_DISCOVERY_RECEIPT_V0.1.json
          if-no-files-found: error
          retention-days: 30
      - name: Enforce terminal state
        if: always()
        run: |
          python - <<'PY'
          import json
          r=json.load(open("ARQ002_CSP003_DISCOVERY_RECEIPT_V0.1.json"))
          if r.get("classification") not in {"DISCOVERY_SURVIVES_NOT_EDGE","DISCOVERY_FAIL_NO_PROMOTION"}:
              raise SystemExit("FAIL_CLOSED: invalid terminal state")
          if r.get("confirmation_2025_accessed") is not False or r.get("final_holdout_2026_accessed") is not False:
              raise SystemExit("FAIL_CLOSED: protected period")
          if r.get("live_trading") is not False or r.get("exchange_mutation") is not False:
              raise SystemExit("FAIL_CLOSED: execution firewall")
          print(r["classification"])
          PY
