name: Binance Listing Cascade V0.3 Clean Discovery
on:
  push:
    branches: [binance-listing-cascade-v0.3-clean-pre2024-source-2026-10-05]
    paths:
      - '.github/workflows/binance_listing_cascade_v03_clean.yml'
permissions:
  contents: write
jobs:
  discovery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: binance-listing-cascade-v0.3-clean-pre2024-source-2026-10-05
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run frozen V0.3 clean discovery
        run: python research/binance_listing_information_cascade/run_v03_clean_pre2024.py
      - name: Persist frozen result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/binance_listing_information_cascade/results_v03_clean_pre2024
          git diff --cached --quiet || (git commit -m "Record frozen V0.3 clean pre-2024 outcomes" && git push)

