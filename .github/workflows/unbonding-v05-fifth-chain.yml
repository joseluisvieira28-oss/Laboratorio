name: Unbonding V0.5 Fifth Chain Qualification
on:
  push:
    branches: [pos-unbonding-completion-001-v0.5-source-expansion-2026-10-07]
    paths:
      - "research/pos_unbonding_completion_001_v0_5_source_expansion/v05_fifth_chain_qualification.py"
      - ".github/workflows/unbonding-v05-fifth-chain.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pos-unbonding-completion-001-v0.5-source-expansion-2026-10-07
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python research/pos_unbonding_completion_001_v0_5_source_expansion/v05_fifth_chain_qualification.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/pos_unbonding_completion_001_v0_5_source_expansion/V05_FIFTH_CHAIN_QUALIFICATION.json
          git diff --cached --quiet || (git commit -m "Record V0.5 fifth-chain source qualification" && git push origin HEAD:pos-unbonding-completion-001-v0.5-source-expansion-2026-10-07)
