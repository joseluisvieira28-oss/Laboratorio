name: LCOD-001 predictor-only viability review V0.1

on:
  push:
    branches:
      - liquidation-convexity-oracle-distance-001-source-gate-v0.1
    paths:
      - 'research/liquidation_convexity_oracle_distance_001/LCOD_FORWARD_SERIES_INDEX_V0.1.json'
      - 'research/liquidation_convexity_oracle_distance_001/forward_snapshots/*.json'
      - 'research/liquidation_convexity_oracle_distance_001/LCOD_PREDICTOR_ONLY_VIABILITY_REVIEW_FREEZE_V0.1.md'
      - 'research/liquidation_convexity_oracle_distance_001/lcod_predictor_only_viability_review_v01.py'
      - '.github/workflows/lcod-001-predictor-only-review-v01.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lcod-001-predictor-only-review-v01
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: liquidation-convexity-oracle-distance-001-source-gate-v0.1
      - name: Run fail-closed predictor-only review
        run: python research/liquidation_convexity_oracle_distance_001/lcod_predictor_only_viability_review_v01.py
      - name: Verify current accumulation gate remains closed
        shell: bash
        run: |
          python - <<'PY'
          import json
          p="research/liquidation_convexity_oracle_distance_001/LCOD_PREDICTOR_ONLY_VIABILITY_REVIEW_STATUS_V0.1.json"
          x=json.load(open(p))
          count=int(x["canonical_successful_daily_observation_count"])
          days=int(x["distinct_utc_day_count"])
          if count < 30 or days < 21:
              assert x["classification"]=="ACCUMULATION_GATE_NOT_READY", x
              assert x["metrics_opened"] is False, x
          print(json.dumps(x,indent=2,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lcod-predictor-only-review-status-v01
          path: research/liquidation_convexity_oracle_distance_001/LCOD_PREDICTOR_ONLY_VIABILITY_REVIEW_STATUS_V0.1.json
          if-no-files-found: error
