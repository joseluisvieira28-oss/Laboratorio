name: NVIDIA Event-10M One-Shot Read-Only Paper Event (DORMANT)
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  single-prospective-paper-event:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - name: Install public-only network dependencies
        run: |
          python -m pip install --disable-pip-version-check playwright==1.56.0 websockets==15.0.1
          python -m playwright install chromium
      - name: Produce one November frozen cash-reference 10m PAPER decision (fail closed)
        run: |
          python research/mexc_event_direction_v01/nvda_event10m_integrated_v05.py --decision
      - name: Upload exact decision.json BEFORE looking at any expiry tick
        id: artifact
        uses: actions/upload-artifact@v4
        with:
          name: nvda-event10m-preoutcome-decision
          path: artifacts/nvda_event10m_integrated_v05/decision.json
          if-no-files-found: error
          compression-level: 0
      - name: Read-only download of that GitHub artifact from the server
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.artifact.outputs.artifact-id }}
        run: |
          curl --fail --silent --show-error --location --retry 2 --max-time 40 \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -o "$RUNNER_TEMP/nvda-event10m-decision.zip" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip"
          test -s "$RUNNER_TEMP/nvda-event10m-decision.zip"
      - name: Independently verify server artifact timestamp and exact original ZIP member
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.artifact.outputs.artifact-id }}
          RUN_ID: ${{ github.run_id }}
        run: |
          python research/mexc_event_direction_v01/nvda_event10m_anchor_v07.py \
            --decision artifacts/nvda_event10m_integrated_v05/decision.json \
            --archive-path "$RUNNER_TEMP/nvda-event10m-decision.zip" \
            --artifact-id "$ARTIFACT_ID" --run-id "$RUN_ID" \
            --output artifacts/nvda_event10m_custody_v07/anchor.json
      - name: Check abstention before opening any market outcome
        id: decision_type
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          x=json.load(open('artifacts/nvda_event10m_integrated_v05/decision.json'))
          side=(x.get('forecast') or {}).get('candidate')
          if side not in ('UP','DOWN','ABSTAIN'):
              raise SystemExit('INVALID_PRE_FROZEN_CANDIDATE')
          print('qualified='+('true' if side in ('UP','DOWN') else 'false'))
          PY
      - name: Capture first on-time public NVIDIA index expiry tick and shadow-only outcome
        if: steps.decision_type.outputs.qualified == 'true'
        run: |
          python research/mexc_event_direction_v01/nvda_event10m_custody_expiry_v07.py \
            --decision artifacts/nvda_event10m_integrated_v05/decision.json \
            --anchor artifacts/nvda_event10m_custody_v07/anchor.json
      - name: Preserve published anchor and optional index-shadow expiry receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nvda-event10m-independent-paper-archive
          path: artifacts/nvda_event10m_custody_v07/
          if-no-files-found: warn
