name: source-t0-probe-v42-secret-historical-infra-ip

on:
  workflow_dispatch:
  push:
    branches:
      - cosmos-native-emission-param-shock-001-v0.2-t0-remediation-2026-10-07
    paths:
      - .github/workflows/source-t0-probe-v42-secret-historical-infra-ip.yml

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cosmos-native-emission-param-shock-001-v0.2-t0-remediation-2026-10-07
      - name: Probe historical Mantlemint feeder IP and ports
        shell: bash
        run: |
          python3 - <<'PY'
          import json,urllib.request,urllib.error,ssl,hashlib,os,datetime,re
          from concurrent.futures import ThreadPoolExecutor

          OUT="research/cosmos_native_emission_param_shock_001_v0_2/SCRT287_HISTORICAL_INFRA_IP_V42.json"
          hosts=[
            "http://20.104.20.173:26657",
            "http://20.104.20.173:1317",
            "https://20.104.20.173:26657",
            "https://20.104.20.173:1317",
          ]
          heights=[11752974,11800000,11840000,11850000,11860000,11880000,11900000]
          UA={"User-Agent":"CryptoLab-source-only-secret-v42","Accept":"application/json,*/*"}

          def get(u,to=8):
              try:
                  q=urllib.request.Request(u,headers=UA)
                  with urllib.request.urlopen(q,timeout=to,context=ssl._create_unverified_context()) as r:
                      b=r.read()
                      return {"ok":True,"status":getattr(r,"status",200),"url":r.geturl(),"headers":dict(r.headers),
                              "sha256":hashlib.sha256(b).hexdigest(),"body":b.decode("utf-8","replace")[:400000]}
              except urllib.error.HTTPError as e:
                  try:b=e.read()
                  except:b=b""
                  return {"ok":False,"status":e.code,"url":u,"error":str(e),
                          "sha256":hashlib.sha256(b).hexdigest() if b else None,
                          "body":b.decode("utf-8","replace")[:40000]}
              except Exception as e:return {"ok":False,"status":None,"url":u,"error":repr(e),"body":""}

          urls=[]
          for base in hosts:
              if base.endswith(":26657"):
                  urls += [(base,"status",base+"/status")]
                  for h in heights:
                      urls += [(base,f"block-{h}",base+f"/block?height={h}"),
                               (base,f"commit-{h}",base+f"/commit?height={h}")]
              else:
                  urls += [(base,"gov-current",base+"/cosmos/gov/v1beta1/proposals/287")]
                  for h in heights:
                      urls += [(base,f"gov-{h}",base+f"/cosmos/gov/v1beta1/proposals/287?height={h}")]
          def one(x):
              base,label,u=x;r=get(u)
              return {"base":base,"label":label,"url":u,"ok":r["ok"],"status":r.get("status"),
                      "sha256":r.get("sha256"),"error":r.get("error"),"body_excerpt":r.get("body","")[:10000]}
          with ThreadPoolExecutor(max_workers=32) as ex:
              rows=list(ex.map(one,urls))

          out={"scope":"SOURCE_ONLY_NO_MARKET_DATA","candidate":"SCRT Proposal 287",
               "provenance":"Official Mantlemint documentation used 20.104.20.173:26657 as the feeder RPC example.",
               "tested_utc":datetime.datetime.now(datetime.timezone.utc).isoformat(),
               "rows":rows}
          os.makedirs(os.path.dirname(OUT),exist_ok=True)
          with open(OUT,"w") as f:json.dump(out,f,indent=2)
          print("V42",json.dumps({"success":[{"label":x["label"],"url":x["url"],"status":x["status"]} for x in rows if x["ok"]]}))
          PY
      - name: Persist
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/cosmos_native_emission_param_shock_001_v0_2/SCRT287_HISTORICAL_INFRA_IP_V42.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "SCRT287: persist historical infra IP probe v42"
          git pull --rebase origin cosmos-native-emission-param-shock-001-v0.2-t0-remediation-2026-10-07
          git push origin HEAD:cosmos-native-emission-param-shock-001-v0.2-t0-remediation-2026-10-07
