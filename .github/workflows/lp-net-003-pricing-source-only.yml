name: LP-NET-003 | pre-registered historical USD prices and live pool source gate
on:
  pull_request:
    paths:
      - 'research/lp_net_003/**'
      - '.github/workflows/lp-net-003-pricing-source-only.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: lp-net-003-source-only-${{ github.ref }}
  cancel-in-progress: false
jobs:
  public-source:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Offline scientific guards
        run: |
          python -m unittest discover -s research/lp_net_003 -p 'test_*.py' -v
      - name: Historical token quotes at proven Ethereum mint and exit block timestamps
        run: |
          mkdir -p lp-net-003-evidence
          python research/lp_net_003/historical_price_markout.py --fixture research/lp_net_003/frozen_native_fixture.json --output lp-net-003-evidence/historical_usd_markout.json
      - name: First point-in-time pool snapshot with dual public sources
        run: |
          python research/lp_net_003/frozen_pool_snapshot.py --output lp-net-003-evidence/frozen_pool_pit_snapshot.json
      - name: Diagnose provider coverage without changing frozen selection
        run: |
          python research/lp_net_003/pool_coverage_diagnostic.py --output lp-net-003-evidence/pool_coverage_diagnostic.json
      - name: Archive source receipts and fail-closed economic outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lp-net-003-pit-source-audit
          path: lp-net-003-evidence/*.json
          if-no-files-found: warn
          retention-days: 30
