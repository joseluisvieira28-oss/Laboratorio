name: Index Rebalance V0.3 Frozen Discovery Once
on:
  push:
    branches: [crypto-index-rebalance-forced-flow-001-audit-v0.3-2026-10-06]
    paths: ['research/index_rebalance_forced_flow/V03_OUTCOME_ACTIVATION_2026-10-06.md']
permissions:
  contents: read
concurrency:
  group: index-rebalance-v03-once
  cancel-in-progress: false
jobs:
  discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python research/index_rebalance_forced_flow/run_index_v03_once.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: index-rebalance-v03-evidence
          path: index_v03_evidence
          if-no-files-found: error
          retention-days: 90
