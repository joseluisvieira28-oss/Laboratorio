name: source-t0-probe-v44a-secret-ibc-exact-hits
on:
  push:
    branches: [cosmos-native-emission-param-shock-001-v0.2-t0-remediation-2026-10-07]
    paths: [.github/workflows/source-t0-probe-v44a-secret-ibc-exact-hits.yml]
permissions: {contents: write}
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with: {ref: cosmos-native-emission-param-shock-001-v0.2-t0-remediation-2026-10-07}
      - name: Exact historical IBC hits
        run: |
          python3 - <<'PY'
          import json,urllib.request,urllib.error,ssl,os,datetime
          from concurrent.futures import ThreadPoolExecutor
          H=[11880918,11880919,11880920,11880921]
          C=[
          ("juno","07-tendermint-108","https://juno-rpc.publicnode.com"),
          ("axelar","07-tendermint-40","https://axelar-rpc.publicnode.com"),
          ("stride","07-tendermint-37","https://rpc.stride.citizenweb3.com"),
          ("terra2","07-tendermint-4","https://terra-rpc.polkachu.com"),
          ("stargaze","07-tendermint-177","https://stargaze-rpc.polkachu.com"),
          ("injective","07-tendermint-97","https://injective-rpc.publicnode.com"),
          ("evmos","07-tendermint-50","https://evmos-rpc.publicnode.com"),
          ("persistence","07-tendermint-106","https://rpc.cosmos.directory/persistence"),
          ("quicksilver","07-tendermint-28","https://rpc.cosmos.directory/quicksilver"),
          ("agoric","07-tendermint-17","https://rpc.cosmos.directory/agoric")]
          def one(x):
            n,c,u,h=x;q=f"update_client.client_id='{c}' AND update_client.consensus_height='4-{h}'"
            p={"jsonrpc":"2.0","id":1,"method":"tx_search","params":{"query":q,"prove":False,"page":"1","per_page":"100","order_by":"asc"}}
            try:
              r=urllib.request.Request(u,data=json.dumps(p).encode(),headers={"Content-Type":"application/json","User-Agent":"CryptoLab-v44a"},method="POST")
              with urllib.request.urlopen(r,timeout=10,context=ssl._create_unverified_context()) as z:
                d=json.loads(z.read());txs=(d.get("result") or {}).get("txs") or []
                return {"carrier":n,"client":c,"endpoint":u,"height":h,"ok":True,"status":z.status,
                        "hits":[{"tx_hash":t.get("hash"),"carrier_height":int(t["height"])} for t in txs]}
            except urllib.error.HTTPError as e:return {"carrier":n,"client":c,"endpoint":u,"height":h,"ok":False,"status":e.code,"error":str(e),"hits":[]}
            except Exception as e:return {"carrier":n,"client":c,"endpoint":u,"height":h,"ok":False,"status":None,"error":repr(e),"hits":[]}
          jobs=[(n,c,u,h) for n,c,u in C for h in H]
          with ThreadPoolExecutor(max_workers=40) as ex:rows=list(ex.map(one,jobs))
          hits=[r for r in rows if r["hits"]]
          out={"scope":"SOURCE_ONLY_NO_MARKET_DATA","target":"2023-12-07T02:54:58.930543213Z",
               "tested_utc":datetime.datetime.now(datetime.timezone.utc).isoformat(),"rows":rows,"hits":hits}
          p="research/cosmos_native_emission_param_shock_001_v0_2/SCRT287_IBC_EXACT_HITS_V44A.json"
          os.makedirs(os.path.dirname(p),exist_ok=True);open(p,"w").write(json.dumps(out,indent=2))
          print("V44A",json.dumps({"hits":hits}))
          PY
      - name: Persist
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/cosmos_native_emission_param_shock_001_v0_2/SCRT287_IBC_EXACT_HITS_V44A.json
          git commit -m "SCRT287: persist exact IBC hit census v44a"
          git pull --rebase origin cosmos-native-emission-param-shock-001-v0.2-t0-remediation-2026-10-07
          git push origin HEAD:cosmos-native-emission-param-shock-001-v0.2-t0-remediation-2026-10-07
