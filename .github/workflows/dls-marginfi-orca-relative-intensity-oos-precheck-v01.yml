name: DLS Marginfi Orca Relative-Intensity OOS Precheck V0.1

on:
  push:
    branches:
      - dls-marginfi-orca-relative-intensity-oos-v01
    paths:
      - labs/DEFI_LIQUIDATION_SHOCK_001/LAUNCH_MARGINFI_ORCA_RELATIVE_INTENSITY_PRECHECK_V01.marker

permissions:
  actions: read
  contents: read

jobs:
  precheck:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download Jul-Sep feature-only history
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 36781289721
          artifact-ids: 11127324942
          path: history

      - name: Download Oct-Dec feature-only current set
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 36815199005
          artifact-ids: 11140992589
          path: current

      - name: Compile frozen rolling precheck
        run: python -m py_compile labs/DEFI_LIQUIDATION_SHOCK_001/source/precheck_marginfi_orca_relative_intensity_oos_v0_1.py

      - name: Execute frozen rolling relative-intensity precheck
        run: >
          python labs/DEFI_LIQUIDATION_SHOCK_001/source/precheck_marginfi_orca_relative_intensity_oos_v0_1.py
          --history-root history
          --current-root current

      - name: Upload immutable pre-outcome evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dls-marginfi-orca-relative-intensity-oos-precheck-v01
          path: |
            labs/DEFI_LIQUIDATION_SHOCK_001/MARGINFI_ORCA_RELATIVE_INTENSITY_OOS_V01_PREOUTCOME_RECEIPT.json
            labs/DEFI_LIQUIDATION_SHOCK_001/MARGINFI_ORCA_RELATIVE_INTENSITY_OOS_V01_PREOUTCOME_ROWS.ndjson
          if-no-files-found: warn
          retention-days: 90

      - name: Firewall
        if: always()
        run: echo FEATURE_ONLY_ROLLING_PRECHECK_NO_OCTDEC_OUTCOMES
