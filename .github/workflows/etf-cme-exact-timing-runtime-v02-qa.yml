name: ETF-CME Exact Timing Runtime V0.2 QA

on:
  pull_request:
    branches:
      - crypto-edge-radar-postgres-v0.5
  push:
    branches:
      - etf-cme-exact-timing-runtime-v0.2
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crypto_edge_radar
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - name: Exact scheduler tests
        run: |
          python -m unittest             tests.test_etf_cme_exact_scheduler             tests.test_etf_cme_exact_scheduler_integration             tests.test_etf_cme_watcher -v
      - name: Full deterministic suite
        run: python -m unittest discover -s tests -v
      - name: Safety assertions
        run: |
          python - <<'PY'
          from pathlib import Path
          a=Path("authorities/ETF_CME_INSTFLOW_001_EXACT_RUNTIME_SCHEDULER_V0.2.md").read_text()
          assert "missed observation remains missed" in a.lower()
          assert "maximum technical lateness = 2 seconds" in a
          assert "historical_backfill=false" in a
          assert "orders=false" in a
          print("ETF_CME_EXACT_RUNTIME_FIREWALL_PASS")
          PY
