name: WTI V13 Frozen EIA Event Shock

on:
  push:
    branches:
      - mexc-wti-event-shock-v1.3-prereg-2026-10-04
    paths:
      - 'research/mexc_global_assets/MEXC_WTI_EVENT_SHOCK_RULE_V1.3.json'
      - 'research/mexc_global_assets/MEXC_WTI_EVENT_SHOCK_FREEZE_V1.3.md'
      - 'research/mexc_global_assets/mexc_wti_event_shock_v13.py'
      - '.github/workflows/wti-v13-eia-event-shock.yml'

permissions:
  contents: read

jobs:
  frozen-research:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install requests
        run: python -m pip install --disable-pip-version-check requests
      - name: Pre-outcome freeze check
        run: |
          test "$GITHUB_REF_NAME" = "mexc-wti-event-shock-v1.3-prereg-2026-10-04"
          python -m py_compile research/mexc_global_assets/mexc_wti_event_shock_v13.py
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          p=Path('research/mexc_global_assets/MEXC_WTI_EVENT_SHOCK_RULE_V1.3.json')
          x=json.loads(p.read_text())
          assert x['source_gate']=='MEXC_WTI_EIA_SOURCE_PASS'
          assert x['outcomes_opened_at_freeze']==0
          assert len(x['discovery_events_utc'])==30
          assert len(x['oos_events_utc'])==5
          assert x['shock_window_min']==5
          assert x['post_signal_wait_min']==1
          assert x['shock_thresholds_bps']==[0,10,20,40]
          assert x['modes']==['CONTINUATION','REVERSAL']
          assert x['horizons_min']==[5,15,30,60]
          assert x['protected_after_utc']=='2026-10-01T00:00:00Z'
          assert x['parameter_rescue_authorized'] is False
          assert x['inventory_surprise_authorized'] is False
          assert x['consensus_authorized'] is False
          assert x['live_trading_authorized'] is False
          print('RULE_SHA256='+hashlib.sha256(p.read_bytes()).hexdigest())
          print('PRE_OUTCOME_FREEZE_PASS')
          PY
      - name: Execute frozen WTI EIA study
        run: python research/mexc_global_assets/mexc_wti_event_shock_v13.py
      - name: Upload immutable evidence
        uses: actions/upload-artifact@v4
        with:
          name: wti-v13-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/mexc_global_assets/mexc_wti_event_shock_v13
          if-no-files-found: error
          retention-days: 90
