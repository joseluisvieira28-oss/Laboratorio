name: DLS Drift SQD Timeout Recovery V0.1

on:
  push:
    branches:
      - dls-drift-sqd-boundary-v01
    paths:
      - labs/DEFI_LIQUIDATION_SHOCK_001/LAUNCH_DRIFT_SQD_TIMEOUT_RECOVERY_V01.marker

permissions:
  contents: read

jobs:
  recover:
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - start: '2023-05-01T00:00:00Z'
            end: '2023-05-08T00:00:00Z'
            id: d202305a
          - start: '2023-05-08T00:00:00Z'
            end: '2023-05-15T00:00:00Z'
            id: d202305b
          - start: '2023-05-15T00:00:00Z'
            end: '2023-05-22T00:00:00Z'
            id: d202305c
          - start: '2023-05-22T00:00:00Z'
            end: '2023-05-29T00:00:00Z'
            id: d202305d
          - start: '2023-05-29T00:00:00Z'
            end: '2023-06-01T00:00:00Z'
            id: d202305e
          - start: '2023-06-01T00:00:00Z'
            end: '2023-06-08T00:00:00Z'
            id: d202306a
          - start: '2023-06-08T00:00:00Z'
            end: '2023-06-15T00:00:00Z'
            id: d202306b
          - start: '2023-06-15T00:00:00Z'
            end: '2023-06-22T00:00:00Z'
            id: d202306c
          - start: '2023-06-22T00:00:00Z'
            end: '2023-06-29T00:00:00Z'
            id: d202306d
          - start: '2023-06-29T00:00:00Z'
            end: '2023-07-01T00:00:00Z'
            id: d202306e
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile frozen runner
        run: python -m py_compile labs/DEFI_LIQUIDATION_SHOCK_001/source/run_drift_sqd_first_success_partition_v0_1.py
      - name: Run frozen remediation shard
        run: python labs/DEFI_LIQUIDATION_SHOCK_001/source/run_drift_sqd_first_success_partition_v0_1.py --start "${{ matrix.start }}" --end "${{ matrix.end }}" --out "drift_recovery/${{ matrix.id }}"
      - name: Upload remediation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dls-drift-sqd-recovery-${{ matrix.id }}
          path: drift_recovery/${{ matrix.id }}
          if-no-files-found: error
          retention-days: 30
      - name: Firewall
        if: always()
        run: echo SOURCE_ONLY_TRUE
