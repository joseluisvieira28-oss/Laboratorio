name: DLS Marginfi First Success RPC V0.2

on:
  push:
    branches:
      - dls-marginfi-first-success-rpc-v0.2
    paths:
      - '.github/workflows/dls-marginfi-first-success-rpc-v02.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dls-marginfi-first-success-rpc-v0.2
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile frozen resolver
        run: python -m py_compile labs/DEFI_LIQUIDATION_SHOCK_001/source/resolve_marginfi_first_success_rpc_v0_2.py
      - name: Execute source-only resolver
        run: python labs/DEFI_LIQUIDATION_SHOCK_001/source/resolve_marginfi_first_success_rpc_v0_2.py | tee STDOUT.txt
      - name: Package evidence
        if: always()
        run: |
          python - <<'PY'
          import hashlib,json,pathlib,zipfile
          root=pathlib.Path('dls_marginfi_rpc_boundary_v02')
          if root.exists():
              files=[]
              for p in sorted(root.glob('*')):
                  if p.is_file():
                      files.append({'name':p.name,'bytes':p.stat().st_size,'sha256':hashlib.sha256(p.read_bytes()).hexdigest()})
              pathlib.Path('MANIFEST.json').write_text(json.dumps({'files':files},indent=2)+'\n')
          PY
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dls-marginfi-first-success-rpc-v02
          path: |
            dls_marginfi_rpc_boundary_v02/
            MANIFEST.json
            STDOUT.txt
          if-no-files-found: warn
          retention-days: 30
      - name: Persist receipt
        if: always()
        run: |
          if [ -f dls_marginfi_rpc_boundary_v02/DLS_MARGINFI_RPC_FIRST_SUCCESS_RECEIPT_V0.2.json ]; then
            cp dls_marginfi_rpc_boundary_v02/DLS_MARGINFI_RPC_FIRST_SUCCESS_RECEIPT_V0.2.json labs/DEFI_LIQUIDATION_SHOCK_001/
            git config user.name "crypto-lab-source-audit"
            git config user.email "actions@users.noreply.github.com"
            git add labs/DEFI_LIQUIDATION_SHOCK_001/DLS_MARGINFI_RPC_FIRST_SUCCESS_RECEIPT_V0.2.json
            git commit -m "dls: persist marginfi first-success RPC v0.1" || true
            git push origin HEAD:dls-marginfi-first-success-rpc-v0.2
          fi
      - name: Firewall
        if: always()
        run: |
          echo SOURCE_ONLY_TRUE
          echo PRICES_FALSE
          echo RETURNS_FALSE
          echo PNL_FALSE
          echo DIRECTION_FALSE
          echo LIVE_TRADING_FALSE
          echo MERGE_MAIN_FALSE
