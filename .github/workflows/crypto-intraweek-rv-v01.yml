name: Crypto Intraweek RV HAR-DOW V0.1
on:
  push:
    branches: [crypto-intraweek-rv-v0.1]
    paths:
      - "labs/CRYPTO_INTRAWEEK_RV_001/PREFREEZE_V0.1.json"
      - "labs/CRYPTO_INTRAWEEK_RV_001/discovery_v01.py"
      - ".github/workflows/crypto-intraweek-rv-v01.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install --disable-pip-version-check -q pandas numpy
      - name: Compile
        run: python -m py_compile labs/CRYPTO_INTRAWEEK_RV_001/discovery_v01.py
      - name: Run source gate, Discovery, and conditional 2025 holdout
        run: python labs/CRYPTO_INTRAWEEK_RV_001/discovery_v01.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: CRYPTO_INTRAWEEK_RV_001_V0_1
          path: |
            cirv_source_receipt_v01.json
            cirv_discovery_receipt_v01.json
            cirv_holdout_source_receipt_v01.json
            cirv_final_receipt_v01.json
            cirv_*_discovery_forecasts_v01.csv
            cirv_*_holdout2025_forecasts_v01.csv
          if-no-files-found: warn
          retention-days: 30
