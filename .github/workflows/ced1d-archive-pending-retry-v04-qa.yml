name: CED1D Archive Pending Retry V0.4 QA

on:
  pull_request:
    branches:
      - crypto-edge-radar-postgres-v0.5
    paths:
      - "crypto_edge_radar/radar/ced1d_render_shadow_collector_v03.py"
      - "crypto_edge_radar/radar/ced1d_render_shadow_runtime.py"
      - "crypto_edge_radar/radar/forward_web.py"
      - "crypto_edge_radar/tests/test_ced1d_render_shadow_collector_v03.py"
      - "crypto_edge_radar/tests/test_ced1d_render_shadow_runtime.py"
      - "crypto_edge_radar/tests/test_forward_web_dashboard.py"
      - "governance/CED1D_0031_ARCHIVE_PENDING_RETRY_HARDENING_V0.4_2026-09-25.md"
      - ".github/workflows/ced1d-archive-pending-retry-v04-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          cd crypto_edge_radar
          python -m pip install -e .

      - name: Compile
        run: |
          cd crypto_edge_radar
          python -m compileall radar tests

      - name: Targeted CED1D retry tests
        run: |
          cd crypto_edge_radar
          python -m unittest -v             tests.test_ced1d_render_shadow_collector_v03             tests.test_ced1d_render_shadow_runtime             tests.test_forward_web_dashboard

      - name: Full deterministic Radar suite
        run: |
          cd crypto_edge_radar
          python -m unittest discover -s tests -v

      - name: Frozen-science guard
        run: |
          python - <<'PY'
          from pathlib import Path
          c=Path("crypto_edge_radar/radar/ced1d_render_shadow_collector_v03.py").read_text()
          r=Path("crypto_edge_radar/radar/ced1d_render_shadow_runtime.py").read_text()
          required=[
              'SYMBOL="AVAXUSDT"',
              'TARGET="CED1D-0031"',
              'LOOKBACK=20',
              'HORIZON=1',
              'BASE_REFERENCE_COST_BPS=14.0',
              'STRESS_REFERENCE_COST_BPS=20.0',
              'RESEARCH_NOTIONAL_USDT=100.0',
              'if through>today-timedelta(days=3)',
              'VISION="https://data.binance.vision/data/futures/um/daily"',
          ]
          for x in required:
              assert x in c, x
          forbidden=("create_order","place_order","private_key","api_secret")
          for x in forbidden:
              assert x not in c.lower(), x
          assert 'WAITING_SOURCE_ARCHIVE' not in c
          assert 'WAITING_SOURCE_ARCHIVE' in r
          assert 'retryable_latest_archive_404' in r
          print("CED1D_V04_FROZEN_SCIENCE_GUARD_PASS")
          PY
