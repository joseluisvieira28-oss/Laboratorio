name: ARQ018 source gate v0.1
on:
  push:
    branches: [arq018-forward-v0.1]
    paths:
      - 'research/breakout_acceptance/source_gate_v01.py'
      - '.github/workflows/arq018-source-gate-v01.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python research/breakout_acceptance/source_gate_v01.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arq018-source-gate-v01
          path: ARQ018_SOURCE_GATE_V0_1.json
