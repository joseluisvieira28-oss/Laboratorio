name: DLS Marginfi Stream-Paged 2025 Recovery V0.3A

on:
  push:
    branches: [dls-field-enrichment-v01]
    paths:
      - labs/DEFI_LIQUIDATION_SHOCK_001/LAUNCH_MARGINFI_STREAM_PAGED_2025_V03A.marker

permissions:
  contents: read

jobs:
  collect:
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        month: ["01","02","03","04","05","06","07","08","09","10","11","12"]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify frozen collector
        shell: bash
        run: test "$(git hash-object labs/DEFI_LIQUIDATION_SHOCK_001/source/collect_protected_2025_marginfi_stream_paged_v0_3a.py)" = "f0cd93f46d1099f81c7e5adb79a26c5ce2d02180"
      - name: Compile
        run: python -m py_compile labs/DEFI_LIQUIDATION_SHOCK_001/source/collect_protected_2025_marginfi_stream_paged_v0_3a.py
      - name: Collect exact month
        env:
          MONTH: ${{ matrix.month }}
          PYTHONUNBUFFERED: "1"
        run: |
          python - <<'PY'
          import os,subprocess,sys
          m=int(os.environ["MONTH"])
          start=f"2025-{m:02d}-01T00:00:00Z"
          end="2026-01-01T00:00:00Z" if m==12 else f"2025-{m+1:02d}-01T00:00:00Z"
          out=f"protected_source/marginfi-2025{m:02d}.json"
          subprocess.check_call([sys.executable,
            "labs/DEFI_LIQUIDATION_SHOCK_001/source/collect_protected_2025_marginfi_stream_paged_v0_3a.py",
            "--protocol","marginfi","--start",start,"--end",end,"--out",out])
          PY
      - name: Verify PASS/firewall
        shell: python
        env:
          MONTH: ${{ matrix.month }}
        run: |
          import json,os
          from pathlib import Path
          x=json.loads(Path(f"protected_source/marginfi-2025{os.environ['MONTH']}.json").read_text())
          assert x["classification"]=="PROTECTED_2025_PROTOCOL_SOURCE_PASS"
          assert x["duplicate_count"]==0 and x["error_count"]==0
          fw=x["firewall"]
          assert fw["prices_2025"] is False and fw["returns_2025"] is False and fw["pnl_2025"] is False
          assert fw["prices_2026"] is False and fw["returns_2026"] is False
          print("PASS",os.environ["MONTH"],x["successful_instruction_count"],x["sol_collateral_event_count"],x["request_count"])
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dls-protected-2025-marginfi-program-only-v03-${{ matrix.month }}
          path: protected_source/marginfi-2025${{ matrix.month }}.json
          if-no-files-found: warn
          retention-days: 90
      - name: Firewall
        if: always()
        run: echo SOURCE_ONLY_NO_MARKET_OUTCOMES_NO_TRADING
