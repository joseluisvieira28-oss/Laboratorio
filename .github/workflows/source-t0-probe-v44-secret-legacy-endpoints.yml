name: source-t0-probe-v44-secret-legacy-endpoints

on:
  workflow_dispatch:
  push:
    branches:
      - cosmos-native-emission-param-shock-001-v0.2-t0-remediation-2026-10-07
    paths:
      - .github/workflows/source-t0-probe-v44-secret-legacy-endpoints.yml

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cosmos-native-emission-param-shock-001-v0.2-t0-remediation-2026-10-07
      - name: Probe legacy Secret endpoints recovered from historical configs
        shell: bash
        run: |
          python3 - <<'PY'
          import json,urllib.request,urllib.error,urllib.parse,ssl,hashlib,os,datetime,re
          from concurrent.futures import ThreadPoolExecutor

          OUT="research/cosmos_native_emission_param_shock_001_v0_2/SCRT287_LEGACY_ENDPOINTS_V44.json"
          TARGET="2023-12-07T02:54:58.930543213Z"
          UA={"User-Agent":"CryptoLab-source-only-secret-v44","Accept":"application/json,*/*"}
          rpc=[
            ("scrt-network","https://rpc.scrt.network"),
            ("consensus-one","https://secret.rpc.consensus.one"),
            ("consensus-one-http","http://secret.rpc.consensus.one:443"),
            ("stakely","https://secretnetwork-rpc.stakely.io"),
            ("stream-wallet","https://rpc-secret.stream-wallet.app"),
            ("scrtlabs-lcd-rpc","https://lcd-secret.scrtlabs.com/rpc"),
          ]
          lcd=[
            ("scrt-api","https://api.scrt.network"),
            ("consensus-api","https://secret.api.consensus.one"),
            ("stakely-api","https://secretnetwork-lcd.stakely.io"),
            ("stream-wallet-lcd","https://lcd-secret.stream-wallet.app"),
          ]

          def get(u,to=10,headers=None):
              h=dict(UA);h.update(headers or {})
              try:
                  q=urllib.request.Request(u,headers=h)
                  with urllib.request.urlopen(q,timeout=to,context=ssl._create_unverified_context()) as r:
                      b=r.read()
                      return {"ok":True,"status":getattr(r,"status",200),"url":r.geturl(),"headers":dict(r.headers),
                              "sha256":hashlib.sha256(b).hexdigest(),"body":b.decode("utf-8","replace")[:500000]}
              except urllib.error.HTTPError as e:
                  try:b=e.read()
                  except:b=b""
                  return {"ok":False,"status":e.code,"url":u,"headers":dict(e.headers or {}),
                          "error":str(e),"sha256":hashlib.sha256(b).hexdigest() if b else None,
                          "body":b.decode("utf-8","replace")[:50000]}
              except Exception as e:return {"ok":False,"status":None,"url":u,"headers":{},"error":repr(e),"body":""}

          def walk(x):
              if isinstance(x,dict):
                  yield x
                  for v in x.values():yield from walk(v)
              elif isinstance(x,list):
                  for v in x:yield from walk(v)
          def headers(body):
              try:d=json.loads(body)
              except:return []
              out=[]
              for x in walk(d):
                  h=x.get("height");t=x.get("time")
                  if h is None or t is None:continue
                  try:hh=int(h)
                  except:continue
                  if re.match(r"\d{4}-\d{2}-\d{2}T",str(t)):
                      z={"height":hh,"time":str(t),"hash":x.get("hash")}
                      if z not in out:out.append(z)
              return out
          def gov_status(body):
              try:d=json.loads(body)
              except:return None
              for x in walk(d):
                  if not isinstance(x,dict):continue
                  st=x.get("status");pid=x.get("proposal_id") or x.get("proposalId")
                  if st is not None and (pid is None or str(pid)=="287"):
                      s=str(st)
                      if "PROPOSAL_STATUS_" in s or s in ("1","2","3","4","5"):return s
              return None

          anchor=11752974
          routes=[]
          for name,base in rpc:
              routes += [(name,"status",base+"/status"),
                         (name,"block",base+f"/block?height={anchor}"),
                         (name,"commit",base+f"/commit?height={anchor}"),
                         (name,"blockchain",base+f"/blockchain?minHeight={anchor}&maxHeight={anchor}")]
              q="active_proposal.proposal_id='287' AND active_proposal.proposal_result='proposal_passed'"
              routes += [(name,"block_search",base+"/block_search?"+urllib.parse.urlencode({"query":q,"page":"1","per_page":"100","order_by":"asc"}))]
          for name,base in lcd:
              routes += [(name,"gov-current",base+"/cosmos/gov/v1beta1/proposals/287")]
              for h in [11752974,11800000,11840000,11880000,11920000]:
                  routes += [(name,f"gov-height-{h}",base+f"/cosmos/gov/v1beta1/proposals/287?height={h}")]
          
          def one(x):
              name,kind,u=x;r=get(u)
              return {"provider":name,"kind":kind,"url":u,"ok":r["ok"],"status":r.get("status"),
                      "headers_found":headers(r.get("body","")),"gov_status":gov_status(r.get("body","")),
                      "response_height":r.get("headers",{}).get("x-cosmos-block-height") or r.get("headers",{}).get("X-Cosmos-Block-Height"),
                      "sha256":r.get("sha256"),"error":r.get("error"),"body_excerpt":r.get("body","")[:6000]}
          with ThreadPoolExecutor(max_workers=40) as ex:
              rows=list(ex.map(one,routes))

          winners=[x for x in rows if x["headers_found"] or x["gov_status"]]
          out={"scope":"SOURCE_ONLY_NO_MARKET_DATA","target_voting_end":TARGET,
               "tested_utc":datetime.datetime.now(datetime.timezone.utc).isoformat(),
               "source_provenance":"Legacy Secret endpoints recovered from historical public GitHub configs/forks; not limited to current Chain Registry.",
               "rows":rows,"winners":winners}
          os.makedirs(os.path.dirname(OUT),exist_ok=True)
          with open(OUT,"w") as f:json.dump(out,f,indent=2)
          print("V44",json.dumps({"winners":[{"provider":x["provider"],"kind":x["kind"],"status":x["status"],"headers":x["headers_found"],"gov":x["gov_status"],"response_height":x["response_height"]} for x in winners]}))
          PY
      - name: Persist
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/cosmos_native_emission_param_shock_001_v0_2/SCRT287_LEGACY_ENDPOINTS_V44.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "SCRT287: persist legacy endpoint forensic probe v44"
          git pull --rebase origin cosmos-native-emission-param-shock-001-v0.2-t0-remediation-2026-10-07
          git push origin HEAD:cosmos-native-emission-param-shock-001-v0.2-t0-remediation-2026-10-07
