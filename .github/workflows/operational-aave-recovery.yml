name: Operational aave frozen-source recovery
on:
  push:
    branches: ["ops/aave-daily-source-recovery-2026-10-12"]
    paths:
      - "ops/recovery/**"
      - ".github/workflows/operational-aave-recovery.yml"
permissions:
  contents: write
concurrency:
  group: operational-aave-source-recovery
  cancel-in-progress: false
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Offline UTC/New York frozen-window tests
        run: |
          cd ops/recovery
          python -m unittest -v test_source_window_recovery.py
      - name: Execute unchanged public-source collector within its authority
        run: python ops/recovery/source_window_recovery.py --mode aave
      - name: Preserve original source receipt bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aave-original-source-${{ github.run_id }}-${{ github.run_attempt }}
          path: Dream-Account-OS-v2.3-PARTIAL/runtime/aave_hf_crowding_001_calibration
          retention-days: 90
          if-no-files-found: warn
      - name: Append source state on this recovery branch only
        run: |
          set -euo pipefail
          git config user.name crypto-lab-source-recovery
          git config user.email actions@users.noreply.github.com
          git add "Dream-Account-OS-v2.3-PARTIAL/runtime/aave_hf_crowding_001_calibration"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Source recovery: append actual received aave evidence without changing science"
          git fetch origin "${{ github.ref_name }}"
          git rebase "origin/${{ github.ref_name }}"
          git push origin "HEAD:${{ github.ref_name }}"
