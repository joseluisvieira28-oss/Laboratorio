    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile frozen runner
        run: python -m py_compile labs/DEFI_LIQUIDATION_SHOCK_001/source/run_drift_sqd_first_success_partition_v0_1.py
      - name: Run frozen remediation shard
        run: python labs/DEFI_LIQUIDATION_SHOCK_001/source/run_drift_sqd_first_success_partition_v0_1.py --start "${{ matrix.start }}" --end "${{ matrix.end }}" --out "drift_recovery_v04/${{ matrix.id }}"
      - name: Upload remediation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dls-drift-sqd-recovery-v04-${{ matrix.id }}
          path: drift_recovery_v04/${{ matrix.id }}
          if-no-files-found: error
          retention-days: 30
      - name: Firewall
        if: always()
        run: echo SOURCE_ONLY_TRUE
