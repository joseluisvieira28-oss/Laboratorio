name: licp-hist-002-bybit-source-v01

on:
  push:
    branches:
      - liquidation-cascade-propagation-v0.1
    paths:
      - 'research/liquidation_cascade/LICP_HIST_002_PRE_OUTCOME_SOURCE_FREEZE_V0_1.md'
      - 'research/liquidation_cascade/licp_hist_002_bybit_source_v01.py'
      - '.github/workflows/licp-hist-002-bybit-source-v01.yml'

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python research/liquidation_cascade/licp_hist_002_bybit_source_v01.py
      - if: always()
        run: cat research/liquidation_cascade/receipts/licp_hist_002_bybit_2025_source_v01.json || true
