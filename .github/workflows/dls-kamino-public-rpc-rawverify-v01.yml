name: DLS Kamino Public RPC Raw Verify V0.1

on:
  push:
    branches:
      - defi-liquidation-kamino-public-rpc-rawverify-v0.1
    paths:
      - 'labs/DEFI_LIQUIDATION_SHOCK_001/source/verify_kamino_public_rpc_v0_1.py'
      - '.github/workflows/dls-kamino-public-rpc-rawverify-v01.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rawverify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Run frozen source-only verifier
        run: |
          python labs/DEFI_LIQUIDATION_SHOCK_001/source/verify_kamino_public_rpc_v0_1.py | tee DLS_KAMINO_PUBLIC_RPC_RAWVERIFY_STDOUT_V0.1.txt
      - name: Package evidence
        if: always()
        run: |
          python - <<'PY'
          import hashlib, json, pathlib, zipfile
          root=pathlib.Path("dls_kamino_public_rpc_rawverify_v01")
          if root.exists():
              manifest=[]
              for p in sorted(root.glob("*")):
                  if p.is_file():
                      manifest.append({"name":p.name,"sha256":hashlib.sha256(p.read_bytes()).hexdigest(),"bytes":p.stat().st_size})
              pathlib.Path("DLS_KAMINO_PUBLIC_RPC_RAWVERIFY_MANIFEST_V0.1.json").write_text(json.dumps({"files":manifest},indent=2)+"\n")
              with zipfile.ZipFile("DLS_KAMINO_PUBLIC_RPC_RAWVERIFY_EVIDENCE_V0.1.zip","w",zipfile.ZIP_DEFLATED) as z:
                  for p in sorted(root.glob("*")):
                      if p.is_file(): z.write(p,p.name)
                  z.write("DLS_KAMINO_PUBLIC_RPC_RAWVERIFY_MANIFEST_V0.1.json")
          PY
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dls-kamino-public-rpc-rawverify-v01
          path: |
            dls_kamino_public_rpc_rawverify_v01/
            DLS_KAMINO_PUBLIC_RPC_RAWVERIFY_MANIFEST_V0.1.json
            DLS_KAMINO_PUBLIC_RPC_RAWVERIFY_EVIDENCE_V0.1.zip
            DLS_KAMINO_PUBLIC_RPC_RAWVERIFY_STDOUT_V0.1.txt
          if-no-files-found: warn
          retention-days: 30
