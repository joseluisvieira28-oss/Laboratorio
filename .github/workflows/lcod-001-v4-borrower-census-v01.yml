name: LCOD-001 V4 borrower census source gate
on:
  push:
    branches: [liquidation-convexity-oracle-distance-001-source-gate-v0.1]
    paths:
      - 'research/liquidation_convexity_oracle_distance_001/lcod_v4_borrower_census_v01.py'
      - '.github/workflows/lcod-001-v4-borrower-census-v01.yml'
      - 'research/liquidation_convexity_oracle_distance_001/LCOD_CENSUS_TRIGGER.txt'
permissions:
  contents: write
jobs:
  census:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {ref: liquidation-convexity-oracle-distance-001-source-gate-v0.1}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python research/liquidation_convexity_oracle_distance_001/lcod_v4_borrower_census_v01.py
      - name: Persist receipt
        run: |
          cp artifacts/lcod_v4_borrower_census_v01.json research/liquidation_convexity_oracle_distance_001/LCOD_V4_BORROWER_CENSUS_RECEIPT.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/liquidation_convexity_oracle_distance_001/LCOD_V4_BORROWER_CENSUS_RECEIPT.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "LCOD-001: record V4 borrower census source receipt [skip ci]"
          git push origin HEAD:liquidation-convexity-oracle-distance-001-source-gate-v0.1
      - uses: actions/upload-artifact@v4
        with:
          name: lcod-001-v4-borrower-census-v01
          path: artifacts/lcod_v4_borrower_census_v01.json
          if-no-files-found: error
