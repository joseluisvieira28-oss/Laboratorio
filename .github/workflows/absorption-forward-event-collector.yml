name: ABSORPTION-FAILED-AUCTION-001 Forward Event Collector

on:
  push:
    branches: [absorption-failed-auction-v0.1]
    paths:
      - "absorption_failed_auction/COLLECT_TRIGGER.json"

permissions:
  contents: write
  actions: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify authority lock
        shell: python
        run: |
          import json
          from pathlib import Path
          g=json.loads(Path("absorption_failed_auction/PARENT_AUTHORITY.json").read_text())
          assert g["parent_classification"]=="PASS_STRONG"
          assert g["event_collection_open"] is True
          assert g["economic_outcomes_unlocked"] is False
          assert g["trading_authority"]=="NONE"
          assert g["event_open_boundary_ms"]==1790860200000
          print("PASS: event collection authority open; outcomes sealed")

      - name: Verify trigger seal
        shell: python
        run: |
          import json
          from pathlib import Path
          t=json.loads(Path("absorption_failed_auction/COLLECT_TRIGGER.json").read_text())
          assert t["lab_id"]=="ABSORPTION-FAILED-AUCTION-001"
          assert t["parent_classification"]=="PASS_STRONG"
          assert t["parent_receipt_commit"]=="39bd1f9c5721934beb648ecfa2f777fe4ff7234d"
          assert t["event_open_boundary_ms"]==1790860200000
          assert t["economic_outcomes_unlocked"] is False
          assert t["trading_authority"]=="NONE"
          p=t["intake_path"]
          assert p.startswith("absorption_failed_auction/intake/") and p.endswith(".csv")
          print("PASS: trigger is outcome-blind and path-bounded")

      - name: Fetch immutable parent comparison artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail --location --retry 5 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/actions/artifacts/11163421403/zip" \
            -o /tmp/parent.zip
          mkdir -p /tmp/parent
          unzip -q /tmp/parent.zip -d /tmp/parent
          test -f /tmp/parent/TVFP_TERMINAL_BAR_COMPARISON.csv

      - name: Fetch sealed Evidence Vault history
        run: |
          git fetch --depth=1 origin tv-evidence-vault-v0.1:refs/remotes/origin/tv-evidence-vault-v0.1
          mkdir -p /tmp/vault
          git ls-tree -r --name-only refs/remotes/origin/tv-evidence-vault-v0.1 tradingview_evidence_vault/archive \
            | grep -E '/[0-9]{4}-[0-9]{2}-[0-9]{2}\.jsonl$' \
            | sort > /tmp/vault_paths.txt
          test -s /tmp/vault_paths.txt
          while IFS= read -r p; do
            d="$(basename "$p" .jsonl)"
            git show "refs/remotes/origin/tv-evidence-vault-v0.1:$p" > "/tmp/vault/$d.jsonl"
          done < /tmp/vault_paths.txt

      - name: Run outcome-blind event classifier
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          CURRENT_INTAKE="$(python -c 'import json; from pathlib import Path; print(json.loads(Path("absorption_failed_auction/COLLECT_TRIGGER.json").read_text())["intake_path"])')"
          test -f "$CURRENT_INTAKE"
          python absorption_failed_auction/collector.py \
            --vault /tmp/vault/*.jsonl \
            --current "$CURRENT_INTAKE" \
            --terminal-comparison /tmp/parent/TVFP_TERMINAL_BAR_COMPARISON.csv \
            --authority absorption_failed_auction/PARENT_AUTHORITY.json \
            --outdir /tmp/absorption_forward

      - name: Enforce outcome seal
        shell: python
        run: |
          import json,re
          from pathlib import Path
          for line in Path("/tmp/absorption_forward/EVENT_LEDGER.jsonl").read_text().splitlines():
              x=json.loads(line)
              assert x["economic_outcomes_unlocked"] is False
              assert x["trading_authority"]=="NONE"
              assert not any(re.fullmatch(r"R\d+",str(k)) for k in x)
          s=json.loads(Path("/tmp/absorption_forward/COLLECTOR_STATE.json").read_text())
          assert s["economic_outcomes_unlocked"] is False
          assert s["outcome_fields_present"] is False
          print("PASS: no economic outcome fields opened")

      - name: Persist deterministic forward ledger
        run: |
          mkdir -p absorption_failed_auction/forward
          cp /tmp/absorption_forward/EVENT_LEDGER.jsonl absorption_failed_auction/forward/EVENT_LEDGER.jsonl
          cp /tmp/absorption_forward/COLLECTOR_STATE.json absorption_failed_auction/forward/COLLECTOR_STATE.json
          cp /tmp/absorption_forward/COLLECTOR_RECEIPT.json absorption_failed_auction/forward/COLLECTOR_RECEIPT.json
          git add absorption_failed_auction/forward
          if git diff --cached --quiet -- absorption_failed_auction/forward; then
            echo "No forward ledger change"
            exit 0
          fi
          git config user.name "crypto-lab-bot"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "absorption: append outcome-blind forward event state"
          git push origin HEAD:absorption-failed-auction-v0.1
