name: microstructure-transition-gate-v01

on:
  pull_request:
    paths:
      - 'research/microstructure_scalping/probe_bybit_transition_v01.py'
      - '.github/workflows/microstructure-transition-gate-v01.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  transition-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate pre-holdout L2 across archive transition
        run: python research/microstructure_scalping/probe_bybit_transition_v01.py
      - name: Print receipt
        if: always()
        run: cat research/microstructure_scalping/receipts/bybit_transition_gate_v01.json || true
