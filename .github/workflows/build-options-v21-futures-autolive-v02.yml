name: BUILD OPTIONS V21 FUTURES ONLY AUTO MICROLIVE V0.2.1

on:
  workflow_dispatch:
  push:
    branches:
      - options-v21-futures-only-autolive-v02-2026-09-25
    paths:
      - 'crypto_edge_radar/radar/options_v21_futures_*'
      - 'crypto_edge_radar/radar/options_v21_live.py'
      - 'crypto_edge_radar/radar/mexc_auth_trade.py'
      - 'crypto_edge_radar/scripts/options_v21_futures_autolive_agent.py'
      - 'crypto_edge_radar/tests/test_options_v21_futures_*'
      - 'crypto_edge_radar/tests/test_options_v21_live.py'
      - 'crypto_edge_radar/tests/test_mexc_auth_trade*.py'
      - 'crypto_edge_radar/windows/*OPTIONS_V21_Futures*'
      - 'crypto_edge_radar/windows/Set_MEXC_Preflight_Secrets.ps1'
      - 'crypto_edge_radar/windows/Run_MEXC_Ready_Check_V02.ps1'
      - 'crypto_edge_radar/OPTIONS_SPOTPERP_001_V21_FUTURES_ONLY_AUTOLIVE_V0.2.json'
      - 'crypto_edge_radar/OPTIONS_SPOTPERP_001_V21_FUTURES_ONLY_AUTOLIVE_V0.2.1_SOURCE_HOTFIX.json'
      - 'crypto_edge_radar/authorities/OPTIONS_SPOTPERP_001_V21_INVALID_IV_INDEX_ROW_HANDLING_AMENDMENT_01.md'
      - '.github/workflows/build-options-v21-futures-autolive-v02.yml'

permissions:
  contents: read

jobs:
  test-build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: crypto_edge_radar

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install
        run: |
          python -m pip install -e .
          python -m pip install "pyinstaller>=6,<7"

      - name: Compile
        run: |
          python -m compileall radar scripts tests

      - name: Run existing MEXC safety tests
        run: |
          python -m unittest discover -s tests -p "test_mexc_*.py" -v

      - name: Run frozen OPTIONS science tests
        run: |
          python -m unittest tests.test_options_v21_live -v
          python -m unittest tests.test_options_v21_watcher -v
          python -m unittest tests.test_options_v21_metrics -v

      - name: Run Futures-only execution fork tests
        run: |
          python -m unittest tests.test_options_v21_futures_execution_signal -v
          python -m unittest tests.test_options_v21_futures_autolive_engine -v
          python -m unittest tests.test_mexc_auth_trade_options_v02 -v

      - name: Verify frozen Futures-only contract and source hotfix
        shell: pwsh
        run: |
          $c=Get-Content OPTIONS_SPOTPERP_001_V21_FUTURES_ONLY_AUTOLIVE_V0.2.json | ConvertFrom-Json
          if ($c.status -ne "FROZEN_PROSPECTIVE_EXECUTION_FORK") { throw "contract not frozen" }
          if ($c.execution_fork.instrument -ne "BTC_USDT_PERPETUAL") { throw "wrong instrument" }
          if ($c.execution_fork.leverage -ne 1) { throw "leverage not exactly 1x" }
          if ($c.execution_fork.margin_mode -ne "ISOLATED") { throw "margin not isolated" }
          if ($c.execution_fork.long.entry_side -ne 1 -or $c.execution_fork.long.exit_side -ne 4) { throw "LONG side mapping mismatch" }
          if ($c.execution_fork.short.entry_side -ne 3 -or $c.execution_fork.short.exit_side -ne 2) { throw "SHORT side mapping mismatch" }
          if ($c.execution_fork.hold_hours -ne 24) { throw "24h horizon mismatch" }
          if ($c.risk.maximum_notional_usdt -ne 10) { throw "10 USDT cap mismatch" }
          if ($c.timing.operational_entry_ttl_seconds -ne 300) { throw "TTL mismatch" }
          if ($c.security.spot_order_transport) { throw "Spot transport unexpectedly enabled" }
          if ($c.security.transfer_endpoint -or $c.security.withdrawal_endpoint) { throw "wallet mutation unexpectedly enabled" }
          $h=Get-Content OPTIONS_SPOTPERP_001_V21_FUTURES_ONLY_AUTOLIVE_V0.2.1_SOURCE_HOTFIX.json | ConvertFrom-Json
          if ($h.status -ne "FROZEN_TECHNICAL_SOURCE_REMEDIATION") { throw "source hotfix not frozen" }
          if ($h.remediation.invalid_iv_or_index_row -ne "REJECT_ROW_INCREMENT_COUNTER_CONTINUE_WINDOW") { throw "invalid IV/index remediation mismatch" }
          if (-not $h.unchanged.execution_fork_futures_only -or $h.unchanged.spot_orders) { throw "hotfix changed execution scope" }

      - name: Static Futures-only audit
        shell: pwsh
        run: |
          $engine=Get-Content radar\options_v21_futures_autolive_engine.py -Raw
          $signal=Get-Content radar\options_v21_futures_execution_signal.py -Raw
          foreach ($forbidden in @(
            "MEXCSpotAuthenticatedClient",
            "MEXCSpotPublicFeed",
            "MEXC_SPOT_BTCUSDT",
            "submit_market_buy_quote",
            "submit_market_sell_quantity",
            "/api/v3/order"
          )) {
            if ($engine.Contains($forbidden) -or $signal.Contains($forbidden)) {
              throw "Spot surface leaked into V0.2: $forbidden"
            }
          }
          foreach ($required in @(
            "MEXC_USDT_PERP_BTC_USDT",
            "ORDER_INTENT",
            "blind_resend_allowed",
            "SCHEDULED_24H_EXIT",
            "promotion_credit_to_spot_parent"
          )) {
            if (-not $engine.Contains($required) -and -not $signal.Contains($required)) {
              throw "required Futures invariant missing: $required"
            }
          }
          $trade=Get-Content radar\mexc_auth_trade.py -Raw
          foreach ($forbidden in @(
            "/api/v1/private/account/transfer",
            "/api/v1/private/account/withdraw"
          )) {
            if ($trade.Contains($forbidden)) { throw "forbidden wallet endpoint present: $forbidden" }
          }

      - name: PowerShell syntax validation
        shell: pwsh
        run: |
          foreach ($s in @(
            "windows\Set_MEXC_Preflight_Secrets.ps1",
            "windows\Run_MEXC_Ready_Check_V02.ps1",
            "windows\Run_OPTIONS_V21_Futures_AutoLive_V02.ps1",
            "windows\Install_OPTIONS_V21_Futures_AutoLive_V02.ps1",
            "windows\Status_OPTIONS_V21_Futures_AutoLive_V02.ps1",
            "windows\Emergency_Kill_OPTIONS_V21_Futures_V02.ps1",
            "windows\Resume_OPTIONS_V21_Futures_V02.ps1",
            "windows\Disarm_OPTIONS_V21_Futures_V02.ps1"
          )) {
            $errors=$null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $s),[ref]$null,[ref]$errors)
            if ($errors.Count -gt 0) { $errors | Format-List; throw "PowerShell syntax failure: $s" }
          }

      - name: Build Futures-only autonomous agent
        run: |
          pyinstaller --clean --onefile --name OptionsV21FuturesAutoLive --paths . scripts/options_v21_futures_autolive_agent.py

      - name: Build authenticated preflight
        run: |
          pyinstaller --clean --onefile --name MEXCAuthenticatedPreflight --paths . scripts/mexc_authenticated_preflight.py

      - name: Build risk-state generator
        run: |
          pyinstaller --clean --onefile --name MEXCRiskState --paths . scripts/mexc_risk_state.py

      - name: Hash binaries
        shell: pwsh
        run: |
          foreach ($exe in @(
            "OptionsV21FuturesAutoLive.exe",
            "MEXCAuthenticatedPreflight.exe",
            "MEXCRiskState.exe"
          )) {
            $hash=(Get-FileHash (Join-Path "dist" $exe) -Algorithm SHA256).Hash.ToLower()
            "$exe sha256=$hash" | Set-Content -Path (Join-Path "dist" ($exe+".sha256.txt"))
          }

      - name: Assemble Futures-only Windows bundle
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path bundle\dist | Out-Null
          New-Item -ItemType Directory -Force -Path bundle\windows | Out-Null
          Copy-Item dist\OptionsV21FuturesAutoLive.exe bundle\dist\
          Copy-Item dist\MEXCAuthenticatedPreflight.exe bundle\dist\
          Copy-Item dist\MEXCRiskState.exe bundle\dist\
          Copy-Item dist\*.sha256.txt bundle\dist\
          Copy-Item windows\Set_MEXC_Preflight_Secrets.ps1 bundle\windows\
          Copy-Item windows\Run_MEXC_Ready_Check_V02.ps1 bundle\windows\
          Copy-Item windows\Run_OPTIONS_V21_Futures_AutoLive_V02.ps1 bundle\windows\
          Copy-Item windows\Install_OPTIONS_V21_Futures_AutoLive_V02.ps1 bundle\windows\
          Copy-Item windows\Status_OPTIONS_V21_Futures_AutoLive_V02.ps1 bundle\windows\
          Copy-Item windows\Emergency_Kill_OPTIONS_V21_Futures_V02.ps1 bundle\windows\
          Copy-Item windows\Resume_OPTIONS_V21_Futures_V02.ps1 bundle\windows\
          Copy-Item windows\Disarm_OPTIONS_V21_Futures_V02.ps1 bundle\windows\
          Copy-Item OPTIONS_SPOTPERP_001_V21_FUTURES_ONLY_AUTOLIVE_V0.2.json bundle\
          Copy-Item OPTIONS_SPOTPERP_001_V21_FUTURES_ONLY_AUTOLIVE_V0.2.1_SOURCE_HOTFIX.json bundle\
          Copy-Item authorities\OPTIONS_SPOTPERP_001_V21_INVALID_IV_INDEX_ROW_HANDLING_AMENDMENT_01.md bundle\

      - name: Upload Futures-only bundle
        uses: actions/upload-artifact@v4
        with:
          name: options-v21-futures-only-auto-microlive-v021
          path: crypto_edge_radar/bundle/**
          retention-days: 14
          if-no-files-found: error
