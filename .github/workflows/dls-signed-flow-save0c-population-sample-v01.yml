name: DLS Signed Flow Save0c Population Sample V0.1

on:
  push:
    branches:
      - dls-signed-flow-authority-v01
    paths:
      - labs/DEFI_LIQUIDATION_SHOCK_001/LAUNCH_SIGNED_FLOW_SAVE0C_SAMPLE_V01.marker

permissions:
  actions: read
  contents: read

jobs:
  sample:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download canonical Save0c population partition
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 36263998920
          name: dls-field-enrichment-ms-save0c-202205
          path: event_source
      - name: Compile source-only sampler
        run: python -m py_compile labs/DEFI_LIQUIDATION_SHOCK_001/source/sample_signed_flow_save0c_v0_1.py
      - name: Execute deterministic 64-event source sample
        run: python labs/DEFI_LIQUIDATION_SHOCK_001/source/sample_signed_flow_save0c_v0_1.py
      - name: Upload immutable sample receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dls-signed-flow-save0c-sample-v01
          path: labs/DEFI_LIQUIDATION_SHOCK_001/SIGNED_FLOW_SAVE0C_POPULATION_SAMPLE_RECEIPT_V0.1.json
          if-no-files-found: warn
          retention-days: 90
      - name: Firewall
        if: always()
        run: echo SOURCE_ONLY_NO_PRICES_2025_2026_CLOSED_NO_TRADING
