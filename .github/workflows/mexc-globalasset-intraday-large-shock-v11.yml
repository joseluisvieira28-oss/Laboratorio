name: MEXC GlobalAsset Intraday Large Shock V1.1
on:
  push:
    branches: [mexc-globalasset-intraday-large-shock-v1.1-prereg-2026-10-05]
permissions: {contents: read}
jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: m
        run: |
          python - <<'PY'
          import json,os
          b=json.load(open('research/mexc_global_assets/MEXC_GLOBALASSET_INTRADAY_LARGE_SHOCK_SOURCE_BINDING_V1.1.json'))
          m={'include':[{'target':x['target'],'external_binance':x['external_binance'],'external_bitget':x['external_bitget']} for x in b['candidates']]}
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write('matrix='+json.dumps(m,separators=(',',':'))+'\n')
          PY
  evaluate:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install requests
      - run: |
          test -f research/mexc_global_assets/MEXC_GLOBALASSET_INTRADAY_LARGE_SHOCK_FREEZE_V1.1.md
          python research/mexc_global_assets/mexc_globalasset_intraday_large_shock_asset_v11.py \
            --target "${{ matrix.target }}" \
            --external-binance "${{ matrix.external_binance }}" \
            --external-bitget "${{ matrix.external_bitget }}"
      - uses: actions/upload-artifact@v4
        with:
          name: intraday-large-shock-v11-${{ matrix.target }}
          path: artifacts/mexc_global_assets/intraday_large_shock_v11/assets/${{ matrix.target }}.json
  aggregate:
    needs: evaluate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: intraday-large-shock-v11-*
          path: artifacts/mexc_global_assets/intraday_large_shock_v11/assets
          merge-multiple: true
      - run: python research/mexc_global_assets/mexc_globalasset_intraday_large_shock_aggregate_v11.py
      - uses: actions/upload-artifact@v4
        with:
          name: intraday-large-shock-v11-closeout-${{ github.run_id }}
          path: artifacts/mexc_global_assets/intraday_large_shock_v11
