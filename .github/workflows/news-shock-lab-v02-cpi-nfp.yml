name: News Shock Lab V0.2 CPI NFP Robust Controls

on:
  push:
    branches:
      - dream-account-phase-b-signal-research-v0.1

jobs:
  news-shock-v02-cpi-nfp:
    if: ${{ contains(github.event.head_commit.message, '[NEWS V02 RUN]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify frozen V0.2 authority
        run: |
          cd Dream-Account-OS-v2.3-PARTIAL
          python -m pip install beautifulsoup4
          python -m compileall -q research
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          expected='92370dcfb389e2f3cae1c434bfb77dabe254c5514741bfd731fca6ecf3e23796'
          p=Path('research/NEWS_SHOCK_LAB_V02_CPI_NFP_ROBUST_CONTROLS_FREEZE.json')
          raw=json.loads(p.read_text())
          supplied=raw.pop('fingerprint')
          recomputed=hashlib.sha256(json.dumps(raw,sort_keys=True,separators=(',',':'),ensure_ascii=False).encode()).hexdigest()
          if supplied!=expected or recomputed!=expected:
              raise SystemExit('NEWS V0.2 FREEZE FINGERPRINT BLOCK')
          if raw['event_contract']['schedule_manifest_fingerprint']!='baececa93f922a71d328373c94109652c911deae6ae03e76ea4e23d3f8d90560':
              raise SystemExit('NEWS V0.2 MANIFEST BINDING BLOCK')
          if raw['control_contract']['candidate_lags_days']!=[7,14,21,28,35,42,49,56]:
              raise SystemExit('NEWS V0.2 CONTROL LAG BLOCK')
          if raw['control_contract']['minimum_valid_controls']!=4:
              raise SystemExit('NEWS V0.2 MIN CONTROL BLOCK')
          for k,v in raw['governance'].items():
              if v is not False:
                  raise SystemExit(f'NEWS V0.2 GOVERNANCE BLOCK {k}')
          print('NEWS V0.2 FREEZE PASS',expected)
          PY

      - name: Rebuild exact official BLS schedule manifest
        run: |
          cd Dream-Account-OS-v2.3-PARTIAL
          mkdir -p research/local_data/news_v02_output
          python research/news_shock_lab_v01_bls_schedule.py \
            research/local_data/news_v02_output/bls_schedule_manifest.json \
            | tee research/local_data/news_v02_output/bls_schedule_stdout.txt
          python - <<'PY'
          import json
          from pathlib import Path
          expected='baececa93f922a71d328373c94109652c911deae6ae03e76ea4e23d3f8d90560'
          m=json.loads(Path('research/local_data/news_v02_output/bls_schedule_manifest.json').read_text())
          if m['fingerprint']!=expected or m['event_counts']!={'CPI':56,'NFP':56} or m['event_count_total']!=112:
              raise SystemExit('NEWS V0.2 BLS MANIFEST BLOCK')
          print('NEWS V0.2 BLS MANIFEST PASS',expected)
          PY

      - name: Acquire exact official Binance metadata/evaluation corpus
        run: |
          cd Dream-Account-OS-v2.3-PARTIAL
          python - <<'PY'
          from concurrent.futures import ThreadPoolExecutor, as_completed
          import json, time
          from pathlib import Path
          from urllib.error import HTTPError, URLError
          from urllib.request import Request, urlopen
          from research.news_shock_lab_v01_cpi_nfp_runner import load_manifest
          from research.news_shock_lab_v02_metadata_preflight import required_days, SYMBOLS

          manifest=load_manifest(Path('research/local_data/news_v02_output/bls_schedule_manifest.json'))
          if manifest['fingerprint']!='baececa93f922a71d328373c94109652c911deae6ae03e76ea4e23d3f8d90560':
              raise SystemExit('NEWS V0.2 MANIFEST BLOCK BEFORE ACQUISITION')
          days=required_days(manifest)
          if any(day.startswith('2026-') for day in days):
              raise SystemExit('NEWS V0.2 2026 DAY GUARD BLOCK')
          if min(days)<'2020-11-01':
              raise SystemExit(f'NEWS V0.2 CONTROL FLOOR BLOCK {min(days)}')
          root=Path('research/local_data/news_v02_binance_raw')
          root.mkdir(parents=True,exist_ok=True)
          tasks=[]
          for symbol in SYMBOLS:
              d=root/symbol; d.mkdir(parents=True,exist_ok=True)
              for day in days:
                  filename=f'{symbol}-1m-{day}.zip'
                  url=f'https://data.binance.vision/data/spot/daily/klines/{symbol}/1m/{filename}'
                  tasks.append((url,d/filename))
                  tasks.append((url+'.CHECKSUM',d/(filename+'.CHECKSUM')))
          def one(task):
              url,path=task; last=None
              for attempt in range(1,5):
                  try:
                      req=Request(url,headers={'User-Agent':'DreamAccountOS-NewsShockV02/0.2'})
                      with urlopen(req,timeout=45) as response:
                          if response.status!=200: raise RuntimeError(f'HTTP {response.status}')
                          data=response.read()
                      if not data: raise RuntimeError('empty response')
                      path.write_bytes(data)
                      return str(path),len(data),None
                  except (HTTPError,URLError,TimeoutError,OSError,RuntimeError) as exc:
                      last=f'{type(exc).__name__}: {exc}'
                      if attempt<4: time.sleep(min(2**attempt,8))
              return str(path),0,last
          failures=[]; completed=0; total_bytes=0
          with ThreadPoolExecutor(max_workers=24) as pool:
              futures=[pool.submit(one,t) for t in tasks]
              for f in as_completed(futures):
                  path,size,error=f.result(); completed+=1; total_bytes+=size
                  if error: failures.append({'path':path,'error':error})
                  if completed%500==0 or completed==len(tasks):
                      print(f'NEWS V0.2 acquisition {completed}/{len(tasks)} failures={len(failures)}')
          receipt={
              'document_type':'NEWS_SHOCK_LAB_V02_BINANCE_ACQUISITION_RECEIPT',
              'version':'0.2',
              'status':'PASS' if not failures else 'FAILED_CLOSED',
              'freeze_fingerprint':'92370dcfb389e2f3cae1c434bfb77dabe254c5514741bfd731fca6ecf3e23796',
              'schedule_manifest_fingerprint':manifest['fingerprint'],
              'market_days':len(days),
              'first_market_day':min(days),
              'last_market_day':max(days),
              'symbols':list(SYMBOLS),
              'expected_archives':len(days)*len(SYMBOLS),
              'expected_checksums':len(days)*len(SYMBOLS),
              'expected_files_total':len(tasks),
              'files_downloaded':completed-len(failures),
              'failure_count':len(failures),
              'first_failures':failures[:20],
              'total_bytes_downloaded':total_bytes,
              'holdout_2026_accessed':False,
              'mexc_2025_09_through_2025_12_accessed':False,
              'exchange_mutation_performed':False,
              'live_trading_performed':False,
          }
          out=Path('research/local_data/news_v02_output/news_v02_acquisition_receipt.json')
          out.write_text(json.dumps(receipt,indent=2,sort_keys=True)+'\n')
          print(json.dumps(receipt,indent=2,sort_keys=True))
          if failures:
              raise SystemExit(f'NEWS V0.2 acquisition failed closed: {len(failures)} files')
          PY

      - name: Run timestamp-only V0.2 adequacy preflight
        run: |
          cd Dream-Account-OS-v2.3-PARTIAL
          set -o pipefail
          python -m research.news_shock_lab_v02_metadata_preflight \
            research/local_data/news_v02_binance_raw \
            research/local_data/news_v02_output/bls_schedule_manifest.json \
            research/local_data/news_v02_output/news_v02_metadata_preflight_receipt.json \
            | tee research/local_data/news_v02_output/news_v02_preflight_stdout.txt

      - name: Run frozen V0.2 diagnostic only after preflight PASS
        run: |
          cd Dream-Account-OS-v2.3-PARTIAL
          set -o pipefail
          python -m research.news_shock_lab_v02_cpi_nfp_runner \
            research/local_data/news_v02_binance_raw \
            research/local_data/news_v02_output/bls_schedule_manifest.json \
            research/local_data/news_v02_output/news_v02_metadata_preflight_receipt.json \
            research/local_data/news_v02_output/news_v02_cpi_nfp_receipt.json \
            | tee research/local_data/news_v02_output/news_v02_runner_stdout.txt

      - name: Upload News Shock V0.2 scientific receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: news-shock-v02-cpi-nfp-${{ github.sha }}
          path: |
            Dream-Account-OS-v2.3-PARTIAL/research/local_data/news_v02_output/bls_schedule_manifest.json
            Dream-Account-OS-v2.3-PARTIAL/research/local_data/news_v02_output/bls_schedule_stdout.txt
            Dream-Account-OS-v2.3-PARTIAL/research/local_data/news_v02_output/news_v02_acquisition_receipt.json
            Dream-Account-OS-v2.3-PARTIAL/research/local_data/news_v02_output/news_v02_metadata_preflight_receipt.json
            Dream-Account-OS-v2.3-PARTIAL/research/local_data/news_v02_output/news_v02_preflight_stdout.txt
            Dream-Account-OS-v2.3-PARTIAL/research/local_data/news_v02_output/news_v02_cpi_nfp_receipt.json
            Dream-Account-OS-v2.3-PARTIAL/research/local_data/news_v02_output/news_v02_runner_stdout.txt
          if-no-files-found: warn
          retention-days: 14
