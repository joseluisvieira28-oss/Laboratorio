name: DLS Marginfi SOL Oct-Dec Canonical Population V0.2

on:
  push:
    branches:
      - dls-marginfi-orca-impact-v02
    paths:
      - labs/DEFI_LIQUIDATION_SHOCK_001/LAUNCH_MARGINFI_SOL_OCTDEC_POPULATION_V02.marker

permissions:
  actions: read
  contents: read

jobs:
  population:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download October field authority
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 36263998920
          artifact-ids: 10924878593
          path: field_oct

      - name: Download November field authority
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 36263998920
          artifact-ids: 10925847270
          path: field_nov

      - name: Download December field authority
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 36263998920
          artifact-ids: 10927608033
          path: field_dec

      - name: Download Marginfi bank registry
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 36312418451
          artifact-ids: 10929339072
          path: bank_registry

      - name: Compile population builder
        run: python -m py_compile labs/DEFI_LIQUIDATION_SHOCK_001/source/build_marginfi_sol_octdec_population_v0_2.py

      - name: Build frozen Oct-Dec SOL population
        run: >
          python labs/DEFI_LIQUIDATION_SHOCK_001/source/build_marginfi_sol_octdec_population_v0_2.py
          --field-oct-root field_oct
          --field-nov-root field_nov
          --field-dec-root field_dec
          --bank-registry-root bank_registry

      - name: Upload canonical Oct-Dec SOL population
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dls-marginfi-sol-octdec-source-population-v02
          path: |
            labs/DEFI_LIQUIDATION_SHOCK_001/MARGINFI_SOL_OCTDEC_SOURCE_POPULATION_RECEIPT_V0.2.json
            labs/DEFI_LIQUIDATION_SHOCK_001/MARGINFI_SOL_OCTDEC_SOURCE_POPULATION_V0.2.ndjson
          if-no-files-found: warn
          retention-days: 90

      - name: Firewall
        if: always()
        run: echo SOURCE_ONLY_NO_OCTDEC_MARKET_OUTCOMES_NO_TRADING
