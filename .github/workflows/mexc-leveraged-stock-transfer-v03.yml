name: MEXC Leveraged Stock Transfer V0.3

on:
  push:
    branches:
      - mexc-leveraged-stock-transfer-v0.3-prereg-2026-10-04

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependency
        run: python -m pip install --disable-pip-version-check requests
      - name: Freeze check
        run: |
          test "$GITHUB_REF_NAME" = "mexc-leveraged-stock-transfer-v0.3-prereg-2026-10-04"
          test -f research/mexc_global_assets/MEXC_LEVERAGED_STOCK_TRANSFER_SOURCE_BINDING_V0.3.json
          test -f research/mexc_global_assets/MEXC_LEVERAGED_STOCK_TRANSFER_RULE_V0.3.json
          test -f research/mexc_global_assets/MEXC_LEVERAGED_STOCK_TRANSFER_FREEZE_V0.3.md
          python -m py_compile research/mexc_global_assets/mexc_leveraged_stock_transfer_v03.py
          echo PRE_OUTCOME_FREEZE_PASS
      - name: Run frozen evaluation
        run: python research/mexc_global_assets/mexc_leveraged_stock_transfer_v03.py
      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: mexc-leveraged-stock-transfer-v03-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/mexc_global_assets/leveraged_stock_transfer_v03
          if-no-files-found: error
          retention-days: 90