name: BTC-CONVEX-001 SOL source coverage probe
on:
  workflow_dispatch:

permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python labs/btc-convex-trend-capture-001/sol_coverage_gap_probe_v0_1.py
      - uses: actions/upload-artifact@v4
        with:
          name: BTC-CONVEX-001-SOL-COVERAGE-PROBE
          path: labs/btc-convex-trend-capture-001/evidence/SOLUSDT_1H_COVERAGE_GAP_PROBE_V0.1.json
