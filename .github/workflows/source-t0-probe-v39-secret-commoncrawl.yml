name: source-t0-probe-v39-secret-commoncrawl

on:
  workflow_dispatch:
  push:
    branches:
      - cosmos-native-emission-param-shock-001-v0.2-t0-remediation-2026-10-07
    paths:
      - .github/workflows/source-t0-probe-v39-secret-commoncrawl.yml

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cosmos-native-emission-param-shock-001-v0.2-t0-remediation-2026-10-07
      - name: Search Common Crawl for historical Secret block/API responses
        shell: bash
        run: |
          python3 - <<'PY'
          import json,urllib.request,urllib.error,urllib.parse,ssl,hashlib,os,datetime,re,gzip,io

          OUT="research/cosmos_native_emission_param_shock_001_v0_2/SCRT287_COMMONCRAWL_V39.json"
          UA={"User-Agent":"CryptoLab-source-only-secret-v39","Accept":"*/*"}
          indexes=["CC-MAIN-2023-50","CC-MAIN-2023-40","CC-MAIN-2024-10","CC-MAIN-2024-18"]
          patterns=[
            ("secret-express-block","rpc.secret.express/block*"),
            ("secret-express-commit","rpc.secret.express/commit*"),
            ("blockpane-block","scrt-rpc.blockpane.com/block*"),
            ("trivium-block","secret-4.api.trivium.network:26657/block*"),
            ("zonescan-secret","zonescan.io/*secret*"),
            ("mintscan-proposal287","mintscan.io/secret/proposals/287*"),
            ("ping-secret","ping.pub/secret*"),
          ]

          def req(url,headers=None,to=18):
              h=dict(UA);h.update(headers or {})
              try:
                  q=urllib.request.Request(url,headers=h)
                  with urllib.request.urlopen(q,timeout=to,context=ssl._create_unverified_context()) as r:
                      b=r.read()
                      return {"ok":True,"status":getattr(r,"status",200),"url":r.geturl(),
                              "headers":dict(r.headers),"sha256":hashlib.sha256(b).hexdigest(),"raw":b}
              except urllib.error.HTTPError as e:
                  try:b=e.read()
                  except Exception:b=b""
                  return {"ok":False,"status":e.code,"url":url,"error":str(e),
                          "headers":dict(e.headers or {}),"raw":b}
              except Exception as e:return {"ok":False,"status":None,"url":url,"error":repr(e),"headers":{},"raw":b""}

          reports=[]
          records=[]
          for idx in indexes:
              for name,pat in patterns:
                  q=urllib.parse.urlencode({"url":pat,"output":"json","filter":"status:200","collapse":"urlkey"})
                  u=f"https://index.commoncrawl.org/{idx}-index?{q}"
                  r=req(u,to=20)
                  lines=[]
                  if r["ok"]:
                      txt=r["raw"].decode("utf-8","replace")
                      for line in txt.splitlines():
                          try:
                              d=json.loads(line)
                              d["_index"]=idx;d["_source"]=name
                              lines.append(d);records.append(d)
                          except:pass
                  reports.append({"index":idx,"source":name,"pattern":pat,"ok":r["ok"],"status":r.get("status"),
                                  "error":r.get("error"),"record_count":len(lines),
                                  "records":lines[:200]})

          def extract_http_body(warc_bytes):
              try:
                  data=gzip.decompress(warc_bytes)
              except:
                  data=warc_bytes
              # WARC headers then embedded HTTP response. Find second header terminator.
              p=data.find(b"HTTP/")
              if p<0:return data
              q=data.find(b"\r\n\r\n",p)
              if q<0:q=data.find(b"\n\n",p)
              return data[q+4:] if q>=0 else data[p:]

          # Replay only API/block-looking captures and proposal page.
          chosen=[]
          for d in records:
              url=d.get("url","")
              if any(k in url.lower() for k in ["/block","/commit","proposals/287","proposal/287"]):
                  chosen.append(d)
          replays=[]
          for d in chosen[:80]:
              try:
                  off=int(d["offset"]);ln=int(d["length"]);fn=d["filename"]
              except:continue
              u="https://data.commoncrawl.org/"+fn
              r=req(u,{"Range":f"bytes={off}-{off+ln-1}"},to=25)
              body=extract_http_body(r["raw"]) if r["raw"] else b""
              txt=body.decode("utf-8","replace")[:500000]
              pairs=[]
              try:
                  obj=json.loads(txt)
                  def walk(x):
                      if isinstance(x,dict):
                          yield x
                          for v in x.values():yield from walk(v)
                      elif isinstance(x,list):
                          for v in x:yield from walk(v)
                  for x in walk(obj):
                      h=x.get("height");t=x.get("time")
                      if h is None or t is None:continue
                      try:hh=int(h)
                      except:continue
                      if re.match(r"\d{4}-\d{2}-\d{2}T",str(t)):
                          rec={"height":hh,"time":str(t),"hash":x.get("hash")}
                          if rec not in pairs:pairs.append(rec)
              except:pass
              replays.append({"source":d.get("_source"),"index":d.get("_index"),"captured_url":d.get("url"),
                              "timestamp":d.get("timestamp"),"filename":d.get("filename"),
                              "offset":d.get("offset"),"length":d.get("length"),
                              "range_ok":r["ok"],"range_status":r.get("status"),
                              "sha256":hashlib.sha256(r["raw"]).hexdigest() if r["raw"] else None,
                              "pairs":pairs,"body_excerpt":txt[:8000],"error":r.get("error")})
          useful=[x for x in replays if x["pairs"]]

          out={"scope":"SOURCE_ONLY_NO_MARKET_DATA",
               "target_voting_end":"2023-12-07T02:54:58.930543213Z",
               "tested_utc":datetime.datetime.now(datetime.timezone.utc).isoformat(),
               "indexes":indexes,"reports":reports,"capture_total":len(records),
               "replays":replays,"useful_replays":useful}
          os.makedirs(os.path.dirname(OUT),exist_ok=True)
          with open(OUT,"w") as f:json.dump(out,f,indent=2)
          print("SCRT287_V39",json.dumps({
              "captures":{f"{x['index']}:{x['source']}":x["record_count"] for x in reports},
              "useful":[{"url":x["captured_url"],"ts":x["timestamp"],"pairs":x["pairs"]} for x in useful]
          }))
          PY
      - name: Persist V39
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/cosmos_native_emission_param_shock_001_v0_2/SCRT287_COMMONCRAWL_V39.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "SCRT287: persist Common Crawl archive probe v39"
          git pull --rebase origin cosmos-native-emission-param-shock-001-v0.2-t0-remediation-2026-10-07
          git push origin HEAD:cosmos-native-emission-param-shock-001-v0.2-t0-remediation-2026-10-07
