name: BINANCE-COLLATERAL-HAIRCUT-001 Source Census
on:
  push:
    branches: [binance-collateral-haircut-v0.1]
    paths:
      - 'Dream-Account-OS-v2.3-PARTIAL/research/BINANCE_COLLATERAL_HAIRCUT_001_SOURCE_TRIGGER.txt'
permissions:
  contents: write
jobs:
  source:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: {ref: binance-collateral-haircut-v0.1}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install -q requests beautifulsoup4
      - name: Run frozen source census
        run: python Dream-Account-OS-v2.3-PARTIAL/research/binance_collateral_haircut_001_source_census.py
      - name: Commit immutable receipt
        if: always()
        run: |
          git config user.name "crypto-lab-bot"
          git config user.email "actions@users.noreply.github.com"
          git add Dream-Account-OS-v2.3-PARTIAL/runtime/binance_collateral_haircut_001/source_census_receipt.json || true
          git diff --cached --quiet && exit 0
          git commit -m "research: record Binance collateral haircut source census"
          git push origin HEAD:binance-collateral-haircut-v0.1
