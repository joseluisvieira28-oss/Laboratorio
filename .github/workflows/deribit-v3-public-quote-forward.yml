name: Deribit V3 public quote forward — OFF unless explicitly enabled

on:
  schedule:
    - cron: '2 8 * * *'  # UTC; runner may be delayed or skipped

permissions:
  contents: read

concurrency:
  group: deribit-v3-public-quote-forward-single-writer
  cancel-in-progress: false

jobs:
  quote-only:
    if: ${{ github.repository == 'joseluisvieira28-oss/Laboratorio' && vars.DERIBIT_V3_FORWARD_ENABLED == 'true' && vars.DERIBIT_V3_FORWARD_APPROVED_SHA == '5f18e1dfe118252bf580ef663b533bda8bbd86af' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: write
    steps:
      - name: Checkout audited immutable V3 collector (no credentials)
        uses: actions/checkout@v4
        with:
          ref: 5f18e1dfe118252bf580ef663b533bda8bbd86af
          path: source
          persist-credentials: false
      - name: Restore dedicated persistent evidence branch
        uses: actions/checkout@v4
        with:
          ref: evidence/deribit-v3-forward
          path: evidence
          fetch-depth: 0
          persist-credentials: true
      - name: Set audit-only Git author
        run: |
          git -C evidence config user.name "github-actions[bot]"
          git -C evidence config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Fail closed outside UTC window; public quotes only
        run: |
          python source/research/deribit_v3_microstructure/cloud_runner.py \
            --mode prospective \
            --evidence-checkout evidence \
            --evidence-branch evidence/deribit-v3-forward
      - name: Independently audit all recorded prospective technical PASS receipts
        run: |
          python - <<'PY'
          import json
          import sys
          from pathlib import Path
          source = Path("source/research/deribit_v3_microstructure")
          sys.path.insert(0, str(source))
          from v3_forward_audit import audit
          root = Path("evidence/research/deribit_v3_microstructure/forward_evidence/prospective")
          accepted = 0
          for receipt_path in sorted(root.glob("*/receipt.json")):
              receipt = json.loads(receipt_path.read_bytes())
              if receipt.get("prospective_v3") is True:
                  audit(receipt_path.parent, source)
                  accepted += 1
          assert accepted <= 20, "COHORT_CAP"
          print(f"INDEPENDENT_FORWARD_QUOTE_AUDIT_PASS: {accepted} of 20")
          PY
      - name: Verify evidence checkout clean following remote commit
        run: test -z "$(git -C evidence status --porcelain)"

# Activation requires BOTH repository variables exactly matching the pinned SHA.
# DO NOT set variables or merge this PR before release gates and final review.
# No exchange credentials/private requests/orders/PNL. All failures retained.
