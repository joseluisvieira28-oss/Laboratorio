name: Unbonding V0.3 Source Probe

on:
  push:
    branches:
      - pos-unbonding-completion-001-source-remediation-v0.3-raw-block-2026-10-07
    paths:
      - "research/pos_unbonding_completion_001_v0_3_raw_block/v03_source_probe.py"
      - ".github/workflows/unbonding-v03-source-probe.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  source-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pos-unbonding-completion-001-source-remediation-v0.3-raw-block-2026-10-07
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run bounded source-only probe
        run: python research/pos_unbonding_completion_001_v0_3_raw_block/v03_source_probe.py
      - name: Commit receipt
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/pos_unbonding_completion_001_v0_3_raw_block/SOURCE_PROBE_RECEIPT_V03.json
          if git diff --cached --quiet; then
            echo "No receipt changes"
          else
            git commit -m "Record V0.3 bounded archive source probe receipt"
            git push origin HEAD:pos-unbonding-completion-001-source-remediation-v0.3-raw-block-2026-10-07
          fi
