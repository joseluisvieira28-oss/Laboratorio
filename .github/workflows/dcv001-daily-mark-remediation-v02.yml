name: DCV-001 Daily Mark Remediation Probe V0.2

on:
  push:
    branches:
      - dcv001-funding-oi-vol-interaction-v0.1
    paths:
      - research/dcv001/DCV001_DAILY_MARK_REMEDIATION_PROBE_V0.2.py
      - research/dcv001/DCV001_DAILY_MARK_REMEDIATION_AUTHORITY_V0.2.md
      - .github/workflows/dcv001-daily-mark-remediation-v02.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile
        run: python -m py_compile research/dcv001/DCV001_DAILY_MARK_REMEDIATION_PROBE_V0.2.py
      - name: Run source-only remediation probe
        run: python research/dcv001/DCV001_DAILY_MARK_REMEDIATION_PROBE_V0.2.py
