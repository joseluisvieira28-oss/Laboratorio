name: DLS Global Field Gate Preflight V0.5

on:
  push:
    branches:
      - dls-field-enrichment-v01
    paths:
      - .github/workflows/dls-global-field-gate-preflight-v05.yml

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile current source-field tooling
        run: |
          python -m py_compile labs/DEFI_LIQUIDATION_SHOCK_001/source/run_kamino_save11_field_enrichment_partition_v0_2.py
          python -m py_compile labs/DEFI_LIQUIDATION_SHOCK_001/source/run_kamino_save11_unit_metadata_partition_v0_2.py
          python -m py_compile labs/DEFI_LIQUIDATION_SHOCK_001/source/aggregate_kamino_save11_field_enrichment_v0_2.py
          python -m py_compile labs/DEFI_LIQUIDATION_SHOCK_001/source/aggregate_kamino_save11_unit_metadata_v0_2.py
          python -m py_compile labs/DEFI_LIQUIDATION_SHOCK_001/source/resolve_save0c_unit_metadata_partial_v0_3.py
          python -m py_compile labs/DEFI_LIQUIDATION_SHOCK_001/source/resolve_marginfi_bank_unit_partial_v0_2.py
          python -m py_compile labs/DEFI_LIQUIDATION_SHOCK_001/source/adjudicate_drift_market_unit_registry_population_v0_3.py
          python -m py_compile labs/DEFI_LIQUIDATION_SHOCK_001/source/collect_global_field_gate_artifacts_v0_1.py
          python -m py_compile labs/DEFI_LIQUIDATION_SHOCK_001/source/adjudicate_global_field_coverage_final_v0_1.py
          python -m py_compile labs/DEFI_LIQUIDATION_SHOCK_001/source/build_source_cluster_sample_gate_v0_1.py
          python -m py_compile labs/DEFI_LIQUIDATION_SHOCK_001/source/finalize_pre_discovery_authority_v0_1.py

      - name: Verify current frozen authorities
        run: |
          test -f labs/DEFI_LIQUIDATION_SHOCK_001/KAMINO_HISTORICAL_ACCOUNT_LAYOUT_ADDENDUM_V0.2.md
          test -f labs/DEFI_LIQUIDATION_SHOCK_001/KAMINO_LAYOUT_RECOVERY_PRECEDENCE_ADDENDUM_V0.2.md
          test -f labs/DEFI_LIQUIDATION_SHOCK_001/GLOBAL_FIELD_FINALIZER_ARTIFACT_SELECTION_ADDENDUM_V0.2.md
          test -f labs/DEFI_LIQUIDATION_SHOCK_001/SAVE0C_HISTORICAL_RESERVE_REGISTRY_RETIREMENT_ADDENDUM_V0.2.md
          test -f labs/DEFI_LIQUIDATION_SHOCK_001/SAVE0C_UNIT_METADATA_SOURCE_COMPLETION_CORRECTION_V0.3.1.md
          test -f labs/DEFI_LIQUIDATION_SHOCK_001/PRE_DISCOVERY_TEMPORAL_HOLDOUT_FREEZE_V0.1.md
          test -f labs/DEFI_LIQUIDATION_SHOCK_001/CASCADE_CLUSTERING_FREEZE_V0.1.md
          test -f labs/DEFI_LIQUIDATION_SHOCK_001/SOURCE_SAMPLE_GATE_FREEZE_V0.1.md
          test -f labs/DEFI_LIQUIDATION_SHOCK_001/OUTCOME_STATISTICAL_AUTHORITY_FREEZE_V0.1.md
          test -f labs/DEFI_LIQUIDATION_SHOCK_001/MARKET_DATA_SOURCE_GATE_FREEZE_V0.1.md
          test -f labs/DEFI_LIQUIDATION_SHOCK_001/MARKET_DATA_SOURCE_FEASIBILITY_ADDENDUM_V0.2.md
          test -f labs/DEFI_LIQUIDATION_SHOCK_001/FINAL_PRE_DISCOVERY_AUTHORITY_EXECUTION_FREEZE_V0.1.md

      - name: Verify staged chain
        run: |
          test -f .github/workflows/dls-kamino-v16-layout-recovery-v02.yml
          test -f .github/workflows/dls-kamino-save11-layout-finalize-v02.yml
          test -f .github/workflows/dls-drift-field-enrichment-finalize-v03.yml
          test -f .github/workflows/dls-global-field-coverage-finalize-v01.yml
          test -f .github/workflows/dls-source-cluster-sample-gate-v01.yml

      - name: Firewall
        run: echo SOURCE_ONLY_TRUE
