name: Unbonding V0.5 Coreum Source Qualification

on:
  push:
    branches:
      - pos-unbonding-completion-001-v0.5-fifth-chain-remediation-2026-10-07
    paths:
      - "research/pos_unbonding_completion_001_v0_5_fifth_chain/v05_coreum_source_probe.py"
      - ".github/workflows/unbonding-v05-coreum-source.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pos-unbonding-completion-001-v0.5-fifth-chain-remediation-2026-10-07
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run Coreum source-only qualification
        run: python research/pos_unbonding_completion_001_v0_5_fifth_chain/v05_coreum_source_probe.py
      - name: Commit receipt
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/pos_unbonding_completion_001_v0_5_fifth_chain/COREUM_SOURCE_QUALIFICATION_V05.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Record V0.5 Coreum source qualification"
            git push origin HEAD:pos-unbonding-completion-001-v0.5-fifth-chain-remediation-2026-10-07
          fi
