name: Binance Listing V0.3 Technical Remediation
on:
  push:
    branches: [binance-listing-cascade-v0.3-clean-pre2024-source-2026-10-05]
    paths: ['.github/workflows/binance_listing_v03_remediation.yml']
permissions: {contents: write}
jobs:
  remediate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: binance-listing-cascade-v0.3-clean-pre2024-source-2026-10-05}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python research/binance_listing_information_cascade/run_v03_remediated.py
      - run: |
          git pull --rebase
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/binance_listing_information_cascade/results_v03_clean_pre2024_remediated
          git diff --cached --quiet || (git commit -m "Record V0.3 technically remediated clean discovery" && git push)
