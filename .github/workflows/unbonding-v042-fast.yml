name: Unbonding V0.4.2 Fast Probe

on:
  push:
    branches:
      - pos-unbonding-v042-fast-probe-2026-10-07
    paths:
      - "research/pos_unbonding_completion_001_v0_4_index_free/v042_fast_block_index_capability.py"
      - ".github/workflows/unbonding-v042-fast.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pos-unbonding-v042-fast-probe-2026-10-07
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run concurrency-only V0.4.2 probe
        run: python research/pos_unbonding_completion_001_v0_4_index_free/v042_fast_block_index_capability.py
      - name: Commit receipt
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/pos_unbonding_completion_001_v0_4_index_free/BLOCK_INDEX_CAPABILITY_V042_FAST.json
          if git diff --cached --quiet; then
            echo "No receipt changes"
          else
            git commit -m "Record concurrency-only V0.4.2 fast probe"
            git push origin HEAD:pos-unbonding-v042-fast-probe-2026-10-07
          fi
