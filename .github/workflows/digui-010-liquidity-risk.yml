name: DIGUI-010 Historical Liquidity Risk (read-only)
on:
  pull_request:
    paths:
      - "research/digui010/**"
      - ".github/workflows/digui-010-liquidity-risk.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  historical:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install analysis dependencies
        run: python -m pip install "huggingface_hub>=0.25,<2" "hf_xet>=1,<3" "pyarrow>=17,<26" "pandas>=2.2,<4" "numpy>=1.26,<3" "scikit-learn>=1.4,<2" "duckdb>=1.1,<2"
      - name: Verify historical source schema
        run: python research/digui010/probe.py
      - name: Audit paired 1m/1h snapshots before modeling
        run: python research/digui010/diagnostic.py
      - name: Run predefined risk-avoidance study if available
        run: |
          if [ -f research/digui010/analysis.py ]; then python research/digui010/analysis.py; fi
      - name: Adversarial liquidity-only loss test (post-hoc)
        run: python research/digui010/adversarial.py
      - name: Archive read-only results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: digui010-historical-${{ github.run_id }}
          path: digui010-evidence/
          retention-days: 90
          if-no-files-found: warn
