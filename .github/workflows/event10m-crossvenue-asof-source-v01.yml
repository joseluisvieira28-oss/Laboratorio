name: EVENT-10M Cross-Venue As-Of Source V0.1
on:
  push:
    branches:
      - research/event10m-crossvenue-source-v01-2026-10-30
    paths:
      - .github/workflows/event10m-crossvenue-asof-source-v01.yml
permissions:
  contents: read
jobs:
  source-only:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install public websocket runtime
        run: python -m pip install 'websockets>=12,<16'
      - name: Syntax and fail-closed stream parsers
        run: |
          python -m py_compile research/mexc_event_direction_v01/event10m_crossvenue_source_v01.py
          python -c "import sys;sys.path.insert(0,'research/mexc_event_direction_v01');import event10m_crossvenue_source_v01 as m;m.test_parsers();print('PARSER_TESTS_PASS')"
      - name: Independent second bounded dual-venue source receipt capture (unchanged scientific code)
        run: python research/mexc_event_direction_v01/event10m_crossvenue_source_v01.py
      - if: always()
        name: Preserve raw-receipt hashes and source-gate diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: event10m-crossvenue-asof-source-v01
          path: artifacts/event10m_crossvenue_source_v01/source_receipt.json
          if-no-files-found: warn
