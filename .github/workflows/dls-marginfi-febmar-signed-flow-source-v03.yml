        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download daily source shards
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ github.run_id }}
          pattern: dls-marginfi-febmar-source-v03-*
          path: shard_evidence
          merge-multiple: false
      - name: Compile daily merge
        run: python -m py_compile labs/DEFI_LIQUIDATION_SHOCK_001/source/merge_marginfi_febmar_signed_flow_v0_3.py
      - name: Merge and adjudicate unchanged source gate
        run: >
          python labs/DEFI_LIQUIDATION_SHOCK_001/source/merge_marginfi_febmar_signed_flow_v0_3.py
          --root shard_evidence
      - name: Upload terminal V0.3 source evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dls-marginfi-febmar-signed-flow-source-v03
