        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 36312418451
          name: dls-marginfi-bank-unit-source-completion-v02
          path: bank_registry
      - name: Compile exact-slot source shard
        run: python -m py_compile labs/DEFI_LIQUIDATION_SHOCK_001/source/census_marginfi_febmar_signed_flow_shard_v0_2.py
      - name: Execute daily exact-slot source shard
        run: >
          python labs/DEFI_LIQUIDATION_SHOCK_001/source/census_marginfi_febmar_signed_flow_shard_v0_2.py
          --start "${{ matrix.start }}"
          --end "${{ matrix.end }}"
          --shard-id "${{ matrix.sid }}"
          --bank-registry-root bank_registry
          --workers 8
      - name: Upload immutable daily shard evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dls-marginfi-febmar-source-v03-${{ matrix.sid }}
          path: |
            labs/DEFI_LIQUIDATION_SHOCK_001/MARGINFI_FEBMAR_SOURCE_V02_SHARD_${{ matrix.sid }}_RECEIPT.json
