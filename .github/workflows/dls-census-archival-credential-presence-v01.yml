name: DLS Census Archival Credential Presence V0.1

on:
  push:
    branches:
      - dls-kamino-save11-event-census-v0.1
    paths:
      - '.github/workflows/dls-census-archival-credential-presence-v01.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      HELIUS_API_KEY: ${{ secrets.HELIUS_API_KEY }}
      DLS_RPC_URL: ${{ secrets.DLS_RPC_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dls-kamino-save11-event-census-v0.1
          fetch-depth: 0

      - name: Presence-only preflight
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          h=bool(os.environ.get("HELIUS_API_KEY"))
          d=bool(os.environ.get("DLS_RPC_URL"))
          classification="ARCHIVAL_RPC_CREDENTIAL_PRESENT" if (h or d) else "ARCHIVAL_RPC_CREDENTIAL_ABSENT"
          rec={
            "schema_version":"0.1",
            "lab_id":"DEFI-LIQUIDATION-SHOCK-001",
            "classification":classification,
            "helius_api_key_present":h,
            "dls_rpc_url_present":d,
            "secret_values_exposed":False,
            "network_requests_made":False,
            "prices":False,"returns":False,"pnl":False,"direction":False,
            "live_trading":False,"merge_main":False
          }
          p=Path("labs/DEFI_LIQUIDATION_SHOCK_001/KAMINO_SAVE11_ARCHIVAL_CREDENTIAL_PRESENCE_RECEIPT_V0.1.json")
          p.write_text(json.dumps(rec,indent=2,sort_keys=True)+"\n")
          print(json.dumps(rec,indent=2,sort_keys=True))
          PY

      - name: Persist receipt
        run: |
          git config user.name "crypto-lab-source-audit"
          git config user.email "actions@users.noreply.github.com"
          git add labs/DEFI_LIQUIDATION_SHOCK_001/KAMINO_SAVE11_ARCHIVAL_CREDENTIAL_PRESENCE_RECEIPT_V0.1.json
          git commit -m "dls: persist census archival credential presence receipt" || true
          git push origin HEAD:dls-kamino-save11-event-census-v0.1
