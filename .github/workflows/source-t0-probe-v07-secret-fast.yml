name: source-t0-probe-v07-secret-fast

on:
  push:
    branches:
      - cosmos-native-emission-param-shock-001-v0.2-t0-remediation-2026-10-07
    paths:
      - .github/workflows/source-t0-probe-v07-secret-fast.yml

permissions:
  contents: read

jobs:
  fast-secret:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fast Secret archive binary search
        shell: bash
        run: |
          python3 - <<'PY'
          import json, urllib.request, ssl
          from datetime import datetime
          T="2023-12-07T02:54:58.930543213Z"
          TT=datetime.fromisoformat(T.replace("Z","+00:00")).timestamp()
          UA={"User-Agent":"CryptoLab-secret-fast/0.7"}
          providers=[
            "https://scrt-rpc.blockpane.com",
            "http://scrt-rpc.blockpane.com",
            "https://rpc.secret.express",
            "https://secret-4.api.trivium.network:26657",
          ]
          def req(url,timeout=7):
            try:
              q=urllib.request.Request(url,headers=UA)
              ctx=ssl._create_unverified_context() if url.startswith("https") else None
              with urllib.request.urlopen(q,timeout=timeout,context=ctx) as r:
                return {"ok":True,"status":r.status,"data":json.loads(r.read().decode()),"url":url}
            except Exception as e:return {"ok":False,"error":repr(e),"url":url}
          def block(p,h):
            x=req(p.rstrip("/")+f"/block?height={h}")
            try:
              hd=x["data"]["result"]["block"]["header"]
              return {"height":int(hd["height"]),"time":hd["time"],"hash":x["data"]["result"]["block_id"]["hash"]},x
            except:return None,x
          out={"target":T,"scope":"SOURCE_ONLY_NO_MARKET_DATA","providers":{}}
          for p in providers:
            rec={}
            # broad bracket based on documented 11,752,974 near Nov 28, 2023
            lo,hi=11752974,11920000
            a,ra=block(p,lo); b,rb=block(p,hi)
            rec["lo"]=a or ra;rec["hi"]=b or rb
            if a and b:
              ta=datetime.fromisoformat(a["time"].replace("Z","+00:00")).timestamp()
              tb=datetime.fromisoformat(b["time"].replace("Z","+00:00")).timestamp()
              rec["bracket_valid"]=ta<TT<=tb
              if rec["bracket_valid"]:
                L,R=lo,hi
                while L<R:
                  m=(L+R)//2
                  z,rz=block(p,m)
                  if not z:
                    rec["binary_error"]={"height":m,"raw":rz};break
                  tz=datetime.fromisoformat(z["time"].replace("Z","+00:00")).timestamp()
                  if tz>=TT:R=m
                  else:L=m+1
                if "binary_error" not in rec:
                  H=L;rec["H"]=H
                  rec["neighbors"]={}
                  for h in range(H-2,H+3):
                    z,rz=block(p,h);rec["neighbors"][str(h)]=z or rz
                  rec["results"]={}
                  for h in (H-1,H,H+1,H+2):
                    rec["results"][str(h)]=req(p.rstrip("/")+f"/block_results?height={h}",10)
                  out["providers"][p]=rec
                  break
            out["providers"][p]=rec
          print("SECRET_FAST_V07_BEGIN")
          print(json.dumps(out,indent=2,sort_keys=True)[:700000])
          print("SECRET_FAST_V07_END")
          PY
