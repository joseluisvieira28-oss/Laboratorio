name: source-t0-probe-v45-notional-snapshot-archive

on:
  workflow_dispatch:
  push:
    branches:
      - cosmos-native-emission-param-shock-001-v0.2-t0-remediation-2026-10-07
    paths:
      - .github/workflows/source-t0-probe-v45-notional-snapshot-archive.yml

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cosmos-native-emission-param-shock-001-v0.2-t0-remediation-2026-10-07
      - name: Probe current and archived Notional snapshot service
        shell: bash
        run: |
          python3 - <<'PY'
          import json,urllib.request,urllib.error,urllib.parse,ssl,hashlib,os,datetime,re,xml.etree.ElementTree as ET,socket
          OUT="research/cosmos_native_emission_param_shock_001_v0_2/SCRT287_NOTIONAL_SNAPSHOT_ARCHIVE_V45.json"
          UA={"User-Agent":"CryptoLab-source-only-secret-v45","Accept":"*/*"}

          def req(u,method="GET",to=15):
              try:
                  q=urllib.request.Request(u,headers=UA,method=method)
                  with urllib.request.urlopen(q,timeout=to,context=ssl._create_unverified_context()) as r:
                      b=b"" if method=="HEAD" else r.read()
                      return {"ok":True,"status":getattr(r,"status",200),"url":r.geturl(),"headers":dict(r.headers),
                              "sha256":hashlib.sha256(b).hexdigest() if b else None,"body":b.decode("utf-8","replace")[:1200000]}
              except urllib.error.HTTPError as e:
                  try:b=e.read()
                  except:b=b""
                  return {"ok":False,"status":e.code,"url":u,"headers":dict(e.headers or {}),"error":str(e),
                          "sha256":hashlib.sha256(b).hexdigest() if b else None,"body":b.decode("utf-8","replace")[:100000]}
              except Exception as e:return {"ok":False,"status":None,"url":u,"headers":{},"error":repr(e),"body":""}

          dns={}
          try:dns["snapshot.notional.ventures"]=socket.getaddrinfo("snapshot.notional.ventures",None)
          except Exception as e:dns["snapshot.notional.ventures"]=repr(e)

          roots=[]
          for scheme in ["https","http"]:
              base=f"{scheme}://snapshot.notional.ventures"
              for p in ["/","/secret/","/secretnetwork/","/secret-4/","/snapshots/","/index.html","/robots.txt"]:
                  r=req(base+p,to=12)
                  roots.append({"url":base+p,"ok":r["ok"],"status":r.get("status"),"final_url":r.get("url"),
                                "headers":r.get("headers"),"sha256":r.get("sha256"),"error":r.get("error"),
                                "body_excerpt":r.get("body","")[:25000]})

          # Common historical naming conventions; HEAD only.
          names=[
            "secret.tar.lz4","secret.tar.gz","secret.tar.zst","secretnetwork.tar.lz4",
            "secretnetwork.tar.gz","secretnetwork.tar.zst","secret-4.tar.lz4",
            "secret/latest.tar.lz4","secretnetwork/latest.tar.lz4","secret-4/latest.tar.lz4",
            "secret/secret.tar.lz4","secretnetwork/secretnetwork.tar.lz4"
          ]
          heads=[]
          for n in names:
              for scheme in ["https","http"]:
                  u=f"{scheme}://snapshot.notional.ventures/{n}"
                  r=req(u,"HEAD",to=10)
                  heads.append({"url":u,"ok":r["ok"],"status":r.get("status"),"final_url":r.get("url"),
                                "headers":r.get("headers"),"error":r.get("error")})

          # Wayback wildcard census for historical public files/pages.
          cdx=[]
          for pat in ["snapshot.notional.ventures/*","snapshot.notional.ventures/*secret*","snapshot.notional.ventures/*secretnetwork*"]:
              q=urllib.parse.urlencode({"url":pat,"from":"20220101","to":"20250131","output":"json",
                                        "fl":"timestamp,original,statuscode,mimetype,digest,length",
                                        "collapse":"urlkey","limit":"10000"})
              r=req("https://web.archive.org/cdx/search/cdx?"+q,to=25)
              caps=[]
              if r["ok"]:
                  try:
                      d=json.loads(r["body"])
                      if isinstance(d,list) and len(d)>1:
                          hdr=d[0];caps=[dict(zip(hdr,x)) for x in d[1:] if isinstance(x,list)]
                  except:pass
              cdx.append({"pattern":pat,"ok":r["ok"],"status":r.get("status"),"error":r.get("error"),
                          "sha256":r.get("sha256"),"captures":caps,"body_excerpt":r.get("body","")[:15000]})

          secret_caps=[]
          for x in cdx:
              for c in x["captures"]:
                  o=(c.get("original") or "").lower()
                  if "secret" in o or "scrt" in o:
                      secret_caps.append(c)

          out={"scope":"SOURCE_ONLY_NO_MARKET_DATA","candidate":"SCRT Proposal 287",
               "provenance":{"repo":"notional-labs/notional","commit":"c7c78027973a60f21a8ffe95220917f20413b75c",
                             "claim":"Public snapshot service at snapshot.notional.ventures; infrastructure README says archive nodes feed IPFS snapshot distribution."},
               "tested_utc":datetime.datetime.now(datetime.timezone.utc).isoformat(),
               "dns":dns,"current_roots":roots,"head_candidates":heads,"cdx":cdx,"secret_captures":secret_caps}
          os.makedirs(os.path.dirname(OUT),exist_ok=True)
          with open(OUT,"w") as f:json.dump(out,f,indent=2)
          print("V45",json.dumps({"current_ok":[x["url"] for x in roots if x["ok"]],
                                 "head_hits":[x["url"] for x in heads if x["ok"]],
                                 "secret_captures":secret_caps[:100]}))
          PY
      - name: Persist
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/cosmos_native_emission_param_shock_001_v0_2/SCRT287_NOTIONAL_SNAPSHOT_ARCHIVE_V45.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "SCRT287: persist Notional snapshot archive probe v45"
          git pull --rebase origin cosmos-native-emission-param-shock-001-v0.2-t0-remediation-2026-10-07
          git push origin HEAD:cosmos-native-emission-param-shock-001-v0.2-t0-remediation-2026-10-07
