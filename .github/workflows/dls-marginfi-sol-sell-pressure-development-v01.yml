name: DLS Marginfi SOL Sell Pressure Development V0.1

on:
  push:
    branches:
      - dls-marginfi-signed-return-v01
    paths:
      - labs/DEFI_LIQUIDATION_SHOCK_001/LAUNCH_MARGINFI_SOL_SELL_PRESSURE_DEV_V01.marker

permissions:
  actions: read
  contents: read

jobs:
  development:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download canonical signed-flow source PASS
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 36558125697
          name: dls-marginfi-multihop-signed-flow-source-v02
          path: source_pass

      - name: Download canonical Jan-2024 membership PASS
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 36546170744
          name: dls-marginfi-jupiter-route-class-v02
          path: membership

      - name: Compile frozen executor
        run: python -m py_compile labs/DEFI_LIQUIDATION_SHOCK_001/source/run_marginfi_sol_sell_pressure_dev_v0_1.py

      - name: Execute frozen Jan-2024 Development
        run: >
          python labs/DEFI_LIQUIDATION_SHOCK_001/source/run_marginfi_sol_sell_pressure_dev_v0_1.py
          --source-root source_pass
          --membership-root membership
          --workers 12

      - name: Upload immutable Development evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dls-marginfi-sol-sell-pressure-development-v01
          path: |
            labs/DEFI_LIQUIDATION_SHOCK_001/MARGINFI_SOL_SELL_PRESSURE_RETURN_V01_DEVELOPMENT_RECEIPT.json
            labs/DEFI_LIQUIDATION_SHOCK_001/MARGINFI_SOL_SELL_PRESSURE_RETURN_V01_DEVELOPMENT_LEDGER.ndjson
            labs/DEFI_LIQUIDATION_SHOCK_001/MARGINFI_SOL_SELL_PRESSURE_RETURN_V01_MARKET_DATA_MANIFEST.ndjson
          if-no-files-found: warn
          retention-days: 90

      - name: Firewall
        if: always()
        run: echo JAN2024_DEV_ONLY_FEBMAR_OOS_APRJUN_HOLDOUT_2025_2026_CLOSED_NO_TRADING
