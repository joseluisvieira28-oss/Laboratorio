name: DLS Kamino Bulk API Credential Readiness V0.1

on:
  push:
    branches:
      - defi-liquidation-kamino-first-success-exec-v0.1
    paths:
      - '.github/workflows/dls-kamino-bulk-api-credential-readiness-v01.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      KAMINO_API_USERNAME: ${{ secrets.KAMINO_API_USERNAME }}
      KAMINO_API_PASSWORD: ${{ secrets.KAMINO_API_PASSWORD }}
      KAMINO_USERNAME: ${{ secrets.KAMINO_USERNAME }}
      KAMINO_PASSWORD: ${{ secrets.KAMINO_PASSWORD }}
      KAMINO_BASIC_AUTH: ${{ secrets.KAMINO_BASIC_AUTH }}
      KAMINO_API_AUTH: ${{ secrets.KAMINO_API_AUTH }}
      KAMINO_API_KEY: ${{ secrets.KAMINO_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: defi-liquidation-kamino-first-success-exec-v0.1
          fetch-depth: 0
      - name: Test secret presence only
        run: |
          python - <<'PY'
          import os, json
          from pathlib import Path
          names=[
            "KAMINO_API_USERNAME","KAMINO_API_PASSWORD","KAMINO_USERNAME",
            "KAMINO_PASSWORD","KAMINO_BASIC_AUTH","KAMINO_API_AUTH","KAMINO_API_KEY"
          ]
          presence={n:bool(os.environ.get(n)) for n in names}
          paired=(presence["KAMINO_API_USERNAME"] and presence["KAMINO_API_PASSWORD"]) or (presence["KAMINO_USERNAME"] and presence["KAMINO_PASSWORD"])
          bundled=presence["KAMINO_BASIC_AUTH"] or presence["KAMINO_API_AUTH"]
          status="KAMINO_BULK_API_CREDENTIAL_PRESENT" if paired or bundled else "KAMINO_BULK_API_CREDENTIAL_ABSENT"
          out={
            "schema_version":"0.1","lab_id":"DEFI-LIQUIDATION-SHOCK-001","status":status,
            "secret_presence":presence,"secret_values_read":False,"secret_values_recorded":False,
            "network_request_made":False,"account_created":False,"money_spent":False,
            "source_only":True,"outcome_blind":True
          }
          p=Path("labs/DEFI_LIQUIDATION_SHOCK_001/audit_receipts/DLS_KAMINO_BULK_API_CREDENTIAL_READINESS_V0.1.json")
          p.parent.mkdir(parents=True,exist_ok=True)
          p.write_text(json.dumps(out,indent=2,sort_keys=True)+"\n")
          print(json.dumps({"status":status,"presence":presence},sort_keys=True))
          PY
      - name: Persist receipt
        run: |
          git config user.name "crypto-lab-source-audit"
          git config user.email "actions@users.noreply.github.com"
          git add labs/DEFI_LIQUIDATION_SHOCK_001/audit_receipts/DLS_KAMINO_BULK_API_CREDENTIAL_READINESS_V0.1.json
          git commit -m "audit: persist Kamino bulk API credential readiness"
          git push origin HEAD:defi-liquidation-kamino-first-success-exec-v0.1
