name: MEXC HL NAS100 Dislocation V0.6 One-Shot

on:
  push:
    branches:
      - mexc-hl-nas100-dislocation-v0.6-prereg-2026-10-04
    paths:
      - 'research/mexc_global_assets/MEXC_HL_NAS100_SOURCE_BINDING_V0.5.1.json'
      - 'research/mexc_global_assets/MEXC_HL_NAS100_DISLOCATION_RULE_V0.6.json'
      - 'research/mexc_global_assets/MEXC_HL_NAS100_DISLOCATION_FREEZE_V0.6.md'
      - 'research/mexc_global_assets/mexc_hl_nas100_dislocation_v06.py'
      - '.github/workflows/mexc-hl-nas100-dislocation-v06.yml'

permissions:
  contents: read

jobs:
  frozen-run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependency
        run: python -m pip install --disable-pip-version-check requests

      - name: Bind pre-outcome freeze
        run: |
          test "$GITHUB_REF_NAME" = "mexc-hl-nas100-dislocation-v0.6-prereg-2026-10-04"
          python -m py_compile research/mexc_global_assets/mexc_hl_nas100_dislocation_v06.py
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          rp=Path('research/mexc_global_assets/MEXC_HL_NAS100_DISLOCATION_RULE_V0.6.json')
          bp=Path('research/mexc_global_assets/MEXC_HL_NAS100_SOURCE_BINDING_V0.5.1.json')
          r=json.loads(rp.read_text()); b=json.loads(bp.read_text())
          assert b['source_gate_verdict']=='HYPERLIQUID_NAS100_SOURCE_PASS__XYZ_XYZ100'
          assert r['outcomes_opened_at_freeze']==0
          assert r['signal_mode']=='FADE_LEVEL_DISLOCATION'
          assert r['thresholds_bps']==[10,20,40,80]
          assert r['entry_delay_min']==1
          assert r['horizons_min']==[1,2,5,15]
          assert r['windows']['hard_fetch_end_exclusive']=='2026-10-01T00:00:00Z'
          assert r['october_holdout_authorized'] is False
          assert r['parameter_rescue_authorized'] is False
          assert r['live_trading_authorized'] is False
          print('RULE_SHA256='+hashlib.sha256(rp.read_bytes()).hexdigest())
          print('BINDING_SHA256='+hashlib.sha256(bp.read_bytes()).hexdigest())
          print('PRE_OUTCOME_FREEZE_PASS')
          PY

      - name: Execute frozen September Discovery and selected OOS
        run: python research/mexc_global_assets/mexc_hl_nas100_dislocation_v06.py

      - name: Upload immutable raw evidence and closeout
        uses: actions/upload-artifact@v4
        with:
          name: mexc-hl-nas100-dislocation-v06-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/mexc_global_assets/mexc_hl_nas100_dislocation_v06
          if-no-files-found: error
          retention-days: 90

      - name: Governance closeout
        run: |
          echo 'NO DATA >= 2026-10-01T00:00:00Z'
          echo 'OCTOBER HOLDOUT UNOPENED'
          echo 'NO PARAMETER RESCUE'
          echo 'NO PRIVATE ENDPOINT / ACCOUNT / WALLET'
          echo 'NO ORDERS / NO MUTATION / NO LIVE TRADING'
