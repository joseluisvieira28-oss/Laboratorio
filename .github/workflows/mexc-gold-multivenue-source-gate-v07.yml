name: MEXC GOLD MultiVenue Source Gate V0.7

on:
  push:
    branches:
      - mexc-gold-multivenue-v0.7-source-gate-2026-10-04
    paths:
      - 'research/mexc_global_assets/MEXC_GOLD_MULTIVENUE_SOURCE_GATE_V0.7.md'
      - 'research/mexc_global_assets/mexc_gold_multivenue_source_probe_v07.py'
      - '.github/workflows/mexc-gold-multivenue-source-gate-v07.yml'

permissions:
  contents: read

jobs:
  source-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependency
        run: python -m pip install --disable-pip-version-check requests

      - name: Governance preflight
        run: |
          test "$GITHUB_REF_NAME" = "mexc-gold-multivenue-v0.7-source-gate-2026-10-04"
          python -m py_compile research/mexc_global_assets/mexc_gold_multivenue_source_probe_v07.py
          grep -q 'SOURCE-ONLY' research/mexc_global_assets/MEXC_GOLD_MULTIVENUE_SOURCE_GATE_V0.7.md
          grep -q 'OUTCOMES CLOSED' research/mexc_global_assets/MEXC_GOLD_MULTIVENUE_SOURCE_GATE_V0.7.md
          echo 'GOLD_SOURCE_GATE_PREOUTCOME_PASS'

      - name: Execute public multi-venue source gate
        run: python research/mexc_global_assets/mexc_gold_multivenue_source_probe_v07.py

      - name: Upload immutable source evidence
        uses: actions/upload-artifact@v4
        with:
          name: mexc-gold-multivenue-source-v07-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/mexc_global_assets/gold_multivenue_source_gate_v07
          if-no-files-found: error
          retention-days: 90

      - name: Governance closeout
        run: |
          echo 'SOURCE ONLY'
          echo 'NO HISTORICAL OUTCOMES / NO LEAD-LAG SCORING'
          echo 'NO PRIVATE ENDPOINTS / NO ACCOUNT READS / NO WALLETS'
          echo 'NO ORDERS / NO MUTATION / NO LIVE TRADING'
