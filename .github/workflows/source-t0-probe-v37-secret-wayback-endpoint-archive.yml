name: source-t0-probe-v37-secret-wayback-endpoint-archive

on:
  workflow_dispatch:
  push:
    branches:
      - cosmos-native-emission-param-shock-001-v0.2-t0-remediation-2026-10-07
    paths:
      - .github/workflows/source-t0-probe-v37-secret-wayback-endpoint-archive.yml

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cosmos-native-emission-param-shock-001-v0.2-t0-remediation-2026-10-07
      - name: Probe Wayback for historical Secret endpoint responses
        shell: bash
        run: |
          python3 - <<'PY'
          import json,urllib.request,urllib.error,urllib.parse,hashlib,os,datetime,re
          from concurrent.futures import ThreadPoolExecutor

          OUT="research/cosmos_native_emission_param_shock_001_v0_2/SCRT287_WAYBACK_ENDPOINT_ARCHIVE_V37.json"
          UA={"User-Agent":"CryptoLab-source-only-secret-v37","Accept":"application/json,text/plain,*/*"}
          target="2023-12-07T02:54:58.930543213Z"

          patterns=[
            ("secret-express-rpc-block","rpc.secret.express/block*"),
            ("secret-express-rpc-commit","rpc.secret.express/commit*"),
            ("secret-express-rpc-blockchain","rpc.secret.express/blockchain*"),
            ("secret-express-lcd-gov287","lcd.secret.express/cosmos/gov/v1beta1/proposals/287*"),
            ("blockpane-archive-block","scrt-rpc.blockpane.com/block*"),
            ("blockpane-archive-commit","scrt-rpc.blockpane.com/commit*"),
            ("trivium-block","secret-4.api.trivium.network:26657/block*"),
          ]

          def get(u,to=20):
              try:
                  q=urllib.request.Request(u,headers=UA)
                  with urllib.request.urlopen(q,timeout=to) as r:
                      b=r.read()
                      return {"ok":True,"status":getattr(r,"status",200),"url":r.geturl(),
                              "sha256":hashlib.sha256(b).hexdigest(),
                              "body":b.decode("utf-8","replace")[:1000000]}
              except urllib.error.HTTPError as e:
                  try:b=e.read()
                  except Exception:b=b""
                  return {"ok":False,"status":e.code,"url":u,"error":str(e),
                          "sha256":hashlib.sha256(b).hexdigest() if b else None,
                          "body":b.decode("utf-8","replace")[:100000]}
              except Exception as e:
                  return {"ok":False,"status":None,"url":u,"error":repr(e),"body":""}

          def cdx(name,pat):
              q=urllib.parse.urlencode({
                  "url":pat,
                  "from":"20231201",
                  "to":"20231215",
                  "output":"json",
                  "filter":"statuscode:200",
                  "collapse":"urlkey",
                  "limit":"1000",
                  "fl":"timestamp,original,statuscode,mimetype,digest"
              })
              u="https://web.archive.org/cdx/search/cdx?"+q
              r=get(u,25)
              rows=[]
              if r["ok"]:
                  try:
                      d=json.loads(r["body"])
                      if isinstance(d,list) and len(d)>1:
                          hdr=d[0]
                          rows=[dict(zip(hdr,x)) for x in d[1:] if isinstance(x,list)]
                  except Exception:
                      pass
              return {"name":name,"pattern":pat,"query_url":u,"ok":r["ok"],"status":r.get("status"),
                      "sha256":r.get("sha256"),"error":r.get("error"),
                      "captures":rows,"body_excerpt":r.get("body","")[:20000]}

          with ThreadPoolExecutor(max_workers=len(patterns)) as ex:
              reports=list(ex.map(lambda x:cdx(*x),patterns))

          # Replay only captures that look potentially useful: exact block/commit responses or gov 287.
          candidates=[]
          for rep in reports:
              for cap in rep["captures"]:
                  orig=cap.get("original","")
                  if any(k in orig.lower() for k in ["/block","/commit","proposal"]):
                      candidates.append({"source":rep["name"],**cap})

          replays=[]
          for cap in candidates[:120]:
              ts=cap.get("timestamp");orig=cap.get("original")
              if not ts or not orig:continue
              replay="https://web.archive.org/web/"+ts+"id_/"+orig
              r=get(replay,20)
              # Extract machine-readable height/time pairs only.
              pairs=[]
              try:
                  d=json.loads(r.get("body",""))
                  def walk(x):
                      if isinstance(x,dict):
                          yield x
                          for v in x.values():yield from walk(v)
                      elif isinstance(x,list):
                          for v in x:yield from walk(v)
                  for x in walk(d):
                      h=x.get("height");t=x.get("time")
                      if h is None or t is None:continue
                      try:hh=int(h)
                      except:continue
                      if re.match(r"\d{4}-\d{2}-\d{2}T",str(t)):
                          z={"height":hh,"time":str(t),"hash":x.get("hash")}
                          if z not in pairs:pairs.append(z)
              except Exception:
                  pass
              replays.append({"capture":cap,"replay_url":replay,"ok":r["ok"],"status":r.get("status"),
                              "sha256":r.get("sha256"),"pairs":pairs,
                              "error":r.get("error"),"body_excerpt":r.get("body","")[:6000]})

          useful=[x for x in replays if x["pairs"]]
          out={"scope":"SOURCE_ONLY_NO_MARKET_DATA","target_voting_end":target,
               "tested_utc":datetime.datetime.now(datetime.timezone.utc).isoformat(),
               "rule":"Archived endpoint responses are acceptable only if machine-readable historical height/time or governance state is preserved. No estimates.",
               "reports":reports,"candidate_capture_count":len(candidates),
               "replays":replays,"useful_replays":useful}
          os.makedirs(os.path.dirname(OUT),exist_ok=True)
          with open(OUT,"w") as f:json.dump(out,f,indent=2)
          print("V37",json.dumps({
            "captures":{x["name"]:len(x["captures"]) for x in reports},
            "useful":[{"source":x["capture"].get("source"),"original":x["capture"].get("original"),"pairs":x["pairs"]} for x in useful]
          }))
          PY
      - name: Persist
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/cosmos_native_emission_param_shock_001_v0_2/SCRT287_WAYBACK_ENDPOINT_ARCHIVE_V37.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "SCRT287: persist Wayback historical-endpoint probe v37"
          git pull --rebase origin cosmos-native-emission-param-shock-001-v0.2-t0-remediation-2026-10-07
          git push origin HEAD:cosmos-native-emission-param-shock-001-v0.2-t0-remediation-2026-10-07
