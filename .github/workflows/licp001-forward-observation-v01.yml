name: licp001-forward-observation-v01

on:
  push:
    branches:
      - liquidation-cascade-propagation-v0.1
    paths:
      - 'research/liquidation_cascade/LICP_001_TRIGGER_CONFIG_V0_1.json'
      - '.github/workflows/licp001-forward-observation-v01.yml'

permissions:
  contents: read

jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'websockets>=13,<16'
      - name: Observe frozen LICP propagation durable block
        env:
          PYTHONPATH: .
          LICP_OBSERVE_SECONDS: '20700'
        run: python research/liquidation_cascade/licp001_forward_observation_v01.py
      - if: always()
        run: cat research/liquidation_cascade/receipts/licp001_forward_observation_v01.json || true
      - name: Upload immutable forward outcome block
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: licp001-forward-outcome-${{ github.run_id }}-${{ github.run_attempt }}
          path: research/liquidation_cascade/receipts/licp001_forward_observation_v01.json
          retention-days: 30
          if-no-files-found: error
