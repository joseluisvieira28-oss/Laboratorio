name: Unbonding V0.3 Indexer Probe

on:
  push:
    branches:
      - pos-unbonding-completion-001-source-remediation-v0.3-raw-block-2026-10-07
    paths:
      - "research/pos_unbonding_completion_001_v0_3_raw_block/v03_indexer_probe.py"
      - ".github/workflows/unbonding-v03-indexer-probe.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  indexer-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pos-unbonding-completion-001-source-remediation-v0.3-raw-block-2026-10-07
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run historical-only indexer/source probe
        run: python research/pos_unbonding_completion_001_v0_3_raw_block/v03_indexer_probe.py
      - name: Commit receipt
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/pos_unbonding_completion_001_v0_3_raw_block/INDEXER_AND_SECOND_SOURCE_PROBE_V03.json
          if git diff --cached --quiet; then
            echo "No receipt changes"
          else
            git commit -m "Record V0.3 historical indexer and second-source probe"
            git push origin HEAD:pos-unbonding-completion-001-source-remediation-v0.3-raw-block-2026-10-07
          fi
