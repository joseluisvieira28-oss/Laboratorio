name: Unbonding Raw Lifecycle V0.3

on:
  push:
    branches:
      - pos-unbonding-completion-001-source-remediation-v0.3-2026-10-07
    paths:
      - 'research/pos_unbonding_completion_001_v0_3_source_remediation/**'
      - '.github/workflows/unbonding_raw_lifecycle_v03.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Run bounded raw-block lifecycle capability probe
        run: |
          python3 research/pos_unbonding_completion_001_v0_3_source_remediation/probe_raw_lifecycle_v03.py
      - name: Upload source capability receipt
        uses: actions/upload-artifact@v4
        with:
          name: unbonding-v03-capability
          path: unbonding_v03_capability.json
          if-no-files-found: error
