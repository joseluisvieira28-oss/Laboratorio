name: source-t0-probe-v23-secret-registry-sweep

on:
  push:
    branches:
      - cosmos-native-emission-param-shock-001-v0.2-t0-remediation-2026-10-07
    paths:
      - .github/workflows/source-t0-probe-v23-secret-registry-sweep.yml

permissions:
  contents: read

jobs:
  registry-sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Sweep all registered public Secret RPCs for historical block metadata
        shell: bash
        run: |
          python3 - <<'PY'
          import json,urllib.request,ssl,concurrent.futures
          from datetime import datetime

          UA={"User-Agent":"CryptoLab-source-only-secret-v23"}
          TARGET="2023-12-07T02:54:58.930543213Z"
          TT=datetime.fromisoformat(TARGET.replace("Z","+00:00")).timestamp()
          REG="https://raw.githubusercontent.com/cosmos/chain-registry/master/secretnetwork/chain.json"

          def get(url,to=8):
            try:
              q=urllib.request.Request(url,headers=UA)
              with urllib.request.urlopen(q,timeout=to,context=ssl._create_unverified_context()) as r:
                raw=r.read().decode("utf-8","replace")
                try:d=json.loads(raw)
                except:d=raw[:3000]
                return {"ok":True,"status":r.status,"url":r.geturl(),"data":d}
            except Exception as e:return {"ok":False,"url":url,"error":repr(e)[:350]}

          reg=get(REG,15)
          d=reg.get("data") if reg.get("ok") else {}
          rpcs=[]
          for x in ((d.get("apis") or {}).get("rpc") or []):
            if isinstance(x,dict) and x.get("address"):
              rpcs.append({"address":x["address"].rstrip("/"),"provider":x.get("provider")})
          # Explicit public aggregators/current docs, deduped with registry.
          extra=[
            {"address":"https://rpc.cosmos.directory/secretnetwork","provider":"cosmos.directory"},
            {"address":"https://rpc.statesync.secretsaturn.net:443","provider":"SecretSaturn statesync"},
            {"address":"https://rpc.archive.scrt.marionode.com","provider":"Mario archive"},
          ]
          seen=set(); eps=[]
          for x in rpcs+extra:
            a=x["address"].rstrip("/")
            if a not in seen:seen.add(a);eps.append({"address":a,"provider":x.get("provider")})

          def parse(x):
            d=x.get("data")
            try:
              hd=d["result"]["block"]["header"]
              return {"height":int(hd["height"]),"time":hd["time"],"hash":d["result"].get("block_id",{}).get("hash")}
            except:return None

          anchor=11752974
          def probe(ep):
            x=get(ep["address"]+f"/block?height={anchor}",7)
            z=parse(x)
            return {**ep,"anchor_ok":bool(z and z["height"]==anchor),"anchor":z,
                    "http_ok":x["ok"],"status":x.get("status"),"error":x.get("error")}
          with concurrent.futures.ThreadPoolExecutor(max_workers=48) as ex:
            anchor_rows=list(ex.map(probe,eps))
          winners=[r for r in anchor_rows if r["anchor_ok"]]

          # For every actual historical winner, establish broad bracket then exact first block >= voting end.
          grid=[11752974,11820000,11850000,11870000,11885000,11900000,11920000]
          exact=[]
          for w in winners:
            base=w["address"]; pts=[]
            for h in grid:
              x=get(base+f"/block?height={h}",8); z=parse(x)
              if z and z["height"]==h:
                tv=datetime.fromisoformat(z["time"].replace("Z","+00:00")).timestamp()
                pts.append((h,tv,z))
            pts.sort()
            br=None
            for a,b in zip(pts,pts[1:]):
              if a[1] < TT <= b[1]: br=(a,b);break
            rec={"provider":w["provider"],"address":base,"grid":[x[2] for x in pts],"bracket":None}
            if br:
              rec["bracket"]={"lo":br[0][2],"hi":br[1][2]}
              L,R=br[0][0],br[1][0];err=None
              while L<R:
                M=(L+R)//2;x=get(base+f"/block?height={M}",8);z=parse(x)
                if not z or z["height"]!=M:
                  err={"height":M,"ok":x["ok"],"status":x.get("status"),"error":x.get("error")};break
                tv=datetime.fromisoformat(z["time"].replace("Z","+00:00")).timestamp()
                if tv>=TT:R=M
                else:L=M+1
              rec["binary_error"]=err
              if err is None:
                H=L;rec["H_vote_end_block"]=H;rec["neighbors"]=[]
                for h in range(H-2,H+3):
                  x=get(base+f"/block?height={h}",8);z=parse(x)
                  rec["neighbors"].append(z if z else {"height":h,"error":x.get("error"),"status":x.get("status")})
                # source-only block_results around execution boundary
                rec["block_results"]=[]
                for h in [H-1,H,H+1]:
                  x=get(base+f"/block_results?height={h}",8)
                  rec["block_results"].append({"height":h,"ok":x["ok"],"status":x.get("status"),
                                               "error":x.get("error"),"data":x.get("data") if x["ok"] else None})
            exact.append(rec)

          out={"scope":"SOURCE_ONLY_NO_MARKET_DATA","target":TARGET,
               "registry_ok":reg["ok"],"endpoint_count":len(eps),
               "historical_anchor_winners":winners,
               "exact":exact,
               "sample_failures":[r for r in anchor_rows if not r["anchor_ok"]][:60]}
          print("SECRET_REGISTRY_V23_BEGIN")
          print(json.dumps(out,indent=2,sort_keys=True)[:800000])
          print("SECRET_REGISTRY_V23_END")
          PY
