name: DLS Public RPC History Feasibility V0.1

on:
  push:
    branches:
      - defi-liquidation-public-rpc-history-feasibility-v0.1
    paths:
      - '.github/workflows/dls-public-rpc-history-feasibility-v01.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Run source-only pagination probe
        run: |
          python labs/DEFI_LIQUIDATION_SHOCK_001/source/public_rpc_history_pagination_feasibility_v0_1.py | tee DLS_PUBLIC_RPC_HISTORY_FEASIBILITY_STDOUT_V0.1.txt
      - name: Package evidence
        if: always()
        run: |
          python - <<'PY'
          import hashlib,json,pathlib,zipfile
          root=pathlib.Path("dls_public_rpc_history_feasibility_v01")
          manifest=[]
          for p in sorted(root.glob("*")):
              if p.is_file(): manifest.append({"name":p.name,"sha256":hashlib.sha256(p.read_bytes()).hexdigest(),"bytes":p.stat().st_size})
          m=pathlib.Path("DLS_PUBLIC_RPC_HISTORY_FEASIBILITY_MANIFEST_V0.1.json")
          m.write_text(json.dumps({"files":manifest},indent=2)+"\n")
          with zipfile.ZipFile("DLS_PUBLIC_RPC_HISTORY_FEASIBILITY_EVIDENCE_V0.1.zip","w",zipfile.ZIP_DEFLATED) as z:
              for p in sorted(root.glob("*")):
                  if p.is_file(): z.write(p,p.name)
              z.write(m,m.name)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dls-public-rpc-history-feasibility-v01
          path: |
            dls_public_rpc_history_feasibility_v01/
            DLS_PUBLIC_RPC_HISTORY_FEASIBILITY_MANIFEST_V0.1.json
            DLS_PUBLIC_RPC_HISTORY_FEASIBILITY_EVIDENCE_V0.1.zip
            DLS_PUBLIC_RPC_HISTORY_FEASIBILITY_STDOUT_V0.1.txt
          retention-days: 30
