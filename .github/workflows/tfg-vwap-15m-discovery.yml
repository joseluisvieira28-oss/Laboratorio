name: TFG VWAP 15M Frozen Discovery

on:
  push:
    branches:
      - tf-gap-vwap-15m-v0.1
    paths:
      - '.github/workflows/tfg-vwap-15m-discovery.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
        working-directory: Dream-Account-OS-v2.3-PARTIAL

    steps:
      - name: Checkout frozen research branch
        uses: actions/checkout@v4
        with:
          ref: tf-gap-vwap-15m-v0.1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install research dependencies
        run: python -m pip install --disable-pip-version-check numpy pandas zstandard

      - name: Download prospectively frozen Discovery source artifact
        uses: actions/download-artifact@v4
        with:
          name: tfg-vwap-15m-recovered-normalized-discovery
          path: Dream-Account-OS-v2.3-PARTIAL/research/local_data/tfg_vwap_15m_recovered_normalized
          github-token: ${{ github.token }}
          repository: joseluisvieira28-oss/Laboratorio
          run-id: 35020214067

      - name: Verify Discovery source binding exists
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('research/timeframe_gap/TFG_VWAP_15M_001_DISCOVERY_SOURCE_FINGERPRINT_FREEZE_V0.1.json')
          d = json.loads(p.read_text(encoding='utf-8'))
          assert d['experiment_id'] == 'TFG-VWAP-15M-001'
          assert d['status'] == 'FROZEN_BEFORE_ANY_VWAP_15M_OUTCOME_EVALUATION'
          assert d['frozen_discovery_source_member_fingerprint'] == 'aa6083e8302fde760a1b78340d8b15f34d3e469f0726b4418d8d1a95b75b6b24'
          assert d['internal_oos_2024_remains_locked'] is True
          assert d['protected_2025_remains_locked'] is True
          assert d['locked_2026_onward_remains_locked'] is True
          print('DISCOVERY_SOURCE_BINDING=PASS')
          PY

      - name: Frozen runner self-test
        run: python -m research.timeframe_gap.tfg_vwap_15m_discovery_v01 --self-test

      - name: Execute Discovery 2022-2023 only
        id: discovery
        continue-on-error: true
        run: |
          mkdir -p research/local_data/tfg_vwap_15m_discovery
          set +e
          python -m research.timeframe_gap.tfg_vwap_15m_discovery_v01 \
            --normalized-dir research/local_data/tfg_vwap_15m_recovered_normalized \
            --binding research/timeframe_gap/TFG_VWAP_15M_001_DISCOVERY_SOURCE_FINGERPRINT_FREEZE_V0.1.json \
            --output-dir research/local_data/tfg_vwap_15m_discovery
          rc=$?
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload Discovery receipt and ledger
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tfg-vwap-15m-discovery-result
          path: |
            Dream-Account-OS-v2.3-PARTIAL/research/local_data/tfg_vwap_15m_discovery/TFG_VWAP_15M_001_DISCOVERY_RECEIPT_V0.1.json
            Dream-Account-OS-v2.3-PARTIAL/research/local_data/tfg_vwap_15m_discovery/TFG_VWAP_15M_001_DISCOVERY_TRADES_V0.1.csv
            Dream-Account-OS-v2.3-PARTIAL/research/local_data/tfg_vwap_15m_discovery/TFG_VWAP_15M_001_DISCOVERY_BLOCKED_V0.1.json
          if-no-files-found: warn
          retention-days: 14

      - name: Fail closed on technical or data gate failure
        if: steps.discovery.outputs.rc != '0'
        run: |
          echo "Discovery did not produce a scientific classification. 2024 remains locked."
          exit 1
