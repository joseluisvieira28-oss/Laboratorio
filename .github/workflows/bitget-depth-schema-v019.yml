name: Bitget Depth Schema V0.1.9

on:
  push:
    branches:
      - bitget-maker-microstructure-v0.1-source-gate-2026-10-05
    paths:
      - research/cross_venue_stock/bitget_depth_schema_v019.py
      - .github/workflows/bitget-depth-schema-v019.yml

permissions:
  contents: read

jobs:
  schema:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check requests openpyxl
      - name: Source-only schema check
        run: |
          test -f research/cross_venue_stock/BITGET_MAKER_MICROSTRUCTURE_SOURCE_FREEZE_V0.1.md
          python -m py_compile research/cross_venue_stock/bitget_depth_schema_v019.py
          python research/cross_venue_stock/bitget_depth_schema_v019.py
      - uses: actions/upload-artifact@v4
        with:
          name: bitget-depth-schema-v019-${{ github.run_id }}
          path: artifacts/cross_venue_stock/bitget_depth_schema_v019
          if-no-files-found: error
          retention-days: 90
