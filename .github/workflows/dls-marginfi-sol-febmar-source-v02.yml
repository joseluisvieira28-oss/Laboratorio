name: DLS Marginfi SOL Feb-Mar Signed Flow Source V0.2

on:
  push:
    branches:
      - dls-marginfi-transient-reversion-v01
    paths:
      - labs/DEFI_LIQUIDATION_SHOCK_001/LAUNCH_MARGINFI_SOL_FEBMAR_SOURCE_V02.marker

permissions:
  actions: read
  contents: read

jobs:
  month:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {month: "202402", artifact: "dls-field-enrichment-ms-marginfi-202402"}
          - {month: "202403", artifact: "dls-field-enrichment-ms-marginfi-202403"}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download canonical monthly Marginfi field-enrichment
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 36263998920
          name: ${{ matrix.artifact }}
          path: field_month
      - name: Download source-authoritative Marginfi bank registry
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 36312418451
          name: dls-marginfi-bank-unit-source-completion-v02
          path: bank_registry
      - name: Compile SOL-only source census
        run: python -m py_compile labs/DEFI_LIQUIDATION_SHOCK_001/source/census_marginfi_sol_febmar_month_v0_2.py
      - name: Execute exact-slot SOL-only source census
        run: >
          python labs/DEFI_LIQUIDATION_SHOCK_001/source/census_marginfi_sol_febmar_month_v0_2.py
          --field-root field_month
          --bank-registry-root bank_registry
          --month "${{ matrix.month }}"
          --workers 24
      - name: Upload monthly immutable evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dls-marginfi-sol-febmar-source-${{ matrix.month }}-v02
          path: |
            labs/DEFI_LIQUIDATION_SHOCK_001/MARGINFI_SOL_FEBMAR_SOURCE_${{ matrix.month }}_RECEIPT_V0.2.json
            labs/DEFI_LIQUIDATION_SHOCK_001/MARGINFI_SOL_FEBMAR_SOURCE_${{ matrix.month }}_ROWS_V0.2.ndjson
            labs/DEFI_LIQUIDATION_SHOCK_001/MARGINFI_SOL_FEBMAR_POPULATION_${{ matrix.month }}_V0.2.ndjson
          if-no-files-found: warn
          retention-days: 90

  merge:
    if: always()
    needs: month
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download monthly source evidence
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ github.run_id }}
          pattern: dls-marginfi-sol-febmar-source-*-v02
          path: monthly
          merge-multiple: false
      - name: Compile SOL source merge
        run: python -m py_compile labs/DEFI_LIQUIDATION_SHOCK_001/source/merge_marginfi_sol_febmar_source_v0_2.py
      - name: Merge and adjudicate SOL source prerequisite
        run: >
          python labs/DEFI_LIQUIDATION_SHOCK_001/source/merge_marginfi_sol_febmar_source_v0_2.py
          --root monthly
      - name: Upload terminal SOL source evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dls-marginfi-sol-febmar-signed-flow-source-v02
          path: |
            labs/DEFI_LIQUIDATION_SHOCK_001/MARGINFI_SOL_FEBMAR_SIGNED_FLOW_SOURCE_RECEIPT_V0.2.json
            labs/DEFI_LIQUIDATION_SHOCK_001/MARGINFI_SOL_FEBMAR_SIGNED_FLOW_SOURCE_ROWS_V0.2.ndjson
            labs/DEFI_LIQUIDATION_SHOCK_001/MARGINFI_SOL_FEBMAR_SOURCE_POPULATION_V0.2.ndjson
          if-no-files-found: warn
          retention-days: 90
      - name: Firewall
        if: always()
        run: echo SOL_SOURCE_ONLY_NO_MARKET_OUTCOMES_NO_TRADING
