name: DLS SolanaFM Render Execution V0.2

on:
  push:
    branches:
      - dls-solanafm-render-execution-v0.2
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-only:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Call canonical Render source-only endpoint
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            --max-time 90 \
            --retry 2 \
            --retry-delay 2 \
            'https://crypto-edge-radar-v05-canary.onrender.com/api/dls-solanafm-source-probe' \
            -o dls_solanafm_render_receipt.json
          python - <<'PY'
          import json
          p='dls_solanafm_render_receipt.json'
          x=json.load(open(p))
          assert x['lab_id']=='DEFI-LIQUIDATION-SHOCK-001'
          assert x['probe_version']=='V0.2_RENDER'
          assert x['source_data_pass'] is False
          for k in ('prices','returns','pnl','direction','market_response','first_success_boundary_adjudicated','authenticated_exchange_api_used','orders_created','wallets_used','exchange_mutation_performed','live_capital_enabled'):
              assert x[k] is False,(k,x[k])
          print('CLASSIFICATION='+x['classification'])
          print('ACCESSIBLE_PROTOCOLS='+','.join(x['accessible_protocols']))
          for row in x['results']:
              print('RESULT',row['protocol'],'HTTP',row.get('http_status'),'PASS',row.get('transport_schema_pass'),'ERROR',row.get('error'))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: dls-solanafm-render-probe-v02
          path: dls_solanafm_render_receipt.json
          if-no-files-found: error
          retention-days: 30
