name: STABLECOIN-EXCHANGE-FLOW-001 Ethereum RPC Source Gate V0.1

on:
  push:
    branches:
      - stablecoin-exchange-flow-v0.1
    paths:
      - 'labs/STABLECOIN_EXCHANGE_FLOW_001/ethereum_rpc_source_gate_v01.py'
      - '.github/workflows/stablecoin-exchange-flow-rpc-gate-v01.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rpc-source-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Compile RPC source gate
        run: python -m py_compile labs/STABLECOIN_EXCHANGE_FLOW_001/ethereum_rpc_source_gate_v01.py
      - name: Execute protected historical log gate
        run: python labs/STABLECOIN_EXCHANGE_FLOW_001/ethereum_rpc_source_gate_v01.py
      - name: Upload immutable receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stablecoin-exchange-flow-001-rpc-gate-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/stablecoin_exchange_flow_rpc_gate_v01/
          retention-days: 90
