name: PROP COMPAT 001E TFG MEXC15 Source Equivalence V0.1

on:
  push:
    branches: [prop-compat-001-v0.1]
    paths:
      - '.github/workflows/prop-compat-001e-tfg-mexc15-source-equivalence-v01.yml'
      - 'Dream-Account-OS-v2.3-PARTIAL/research/prop_compat/prop_compat_001e_tfg_mexc15_source_equivalence_v01.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  source-equivalence:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: prop-compat-001-v0.1
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify recovery authority
        working-directory: Dream-Account-OS-v2.3-PARTIAL
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('research/prop_compat/PROP_COMPAT_001E_TFG_EXACT_RECOVERY_FREEZE_V0.1.json').read_text())
          assert d['status']=='FROZEN_BEFORE_RECOVERY_EXECUTION'
          assert d['source_authority']['parent_source_artifact_id']==10419067320
          assert d['governance']['2026_historical_outcome_access'] is False
          assert d['governance']['live_trading'] is False
          print('TFG_RECOVERY_AUTHORITY_PASS')
          PY
      - name: Compile source gate
        working-directory: Dream-Account-OS-v2.3-PARTIAL
        run: python -m py_compile research/prop_compat/prop_compat_001e_tfg_mexc15_source_equivalence_v01.py
      - name: Download exact parent source artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p _parent
          curl --fail --location --silent --show-error \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/10419067320/zip" \
            -o _parent/parent.zip
          unzip -q _parent/parent.zip -d _parent/data
          test "$(find _parent/data -name '*_USDT-Min15-2024-12-01.csv' | wc -l)" -eq 6
      - name: Run fail-closed MEXC 15m equivalence gate
        id: gate
        continue-on-error: true
        working-directory: Dream-Account-OS-v2.3-PARTIAL
        run: |
          python research/prop_compat/prop_compat_001e_tfg_mexc15_source_equivalence_v01.py ../../_parent/data
      - name: Upload source equivalence receipt
        uses: actions/upload-artifact@v4
        with:
          name: PROP_COMPAT_001E_TFG_MEXC15_SOURCE_EQUIVALENCE_V01
          path: Dream-Account-OS-v2.3-PARTIAL/research/local_data/prop_compat_001e_source_gate/PROP_COMPAT_001E_TFG_MEXC15_SOURCE_EQUIVALENCE_V0.1.json
          if-no-files-found: error
          retention-days: 90
      - name: Enforce gate result after receipt upload
        if: steps.gate.outcome != 'success'
        run: exit 2
