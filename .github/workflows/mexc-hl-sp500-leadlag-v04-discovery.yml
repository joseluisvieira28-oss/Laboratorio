name: MEXC HL SP500 LeadLag V0.4 Frozen Discovery Run

on:
  push:
    branches:
      - mexc-hl-sp500-leadlag-v0.4-prereg-2026-10-04
    paths:
      - 'research/mexc_global_assets/MEXC_HL_SP500_SOURCE_BINDING_V0.3.1.json'
      - 'research/mexc_global_assets/MEXC_HL_SP500_LEADLAG_RULE_V0.4.json'
      - 'research/mexc_global_assets/MEXC_HL_SP500_LEADLAG_FREEZE_V0.4.md'
      - 'research/mexc_global_assets/mexc_hl_sp500_leadlag_v04.py'
      - '.github/workflows/mexc-hl-sp500-leadlag-v04-discovery.yml'

permissions:
  contents: read

jobs:
  frozen-discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependency
        run: python -m pip install --disable-pip-version-check requests

      - name: Bind pre-outcome authority
        run: |
          test "$GITHUB_REF_NAME" = "mexc-hl-sp500-leadlag-v0.4-prereg-2026-10-04"
          python -m py_compile research/mexc_global_assets/mexc_hl_sp500_leadlag_v04.py
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          rp=Path('research/mexc_global_assets/MEXC_HL_SP500_LEADLAG_RULE_V0.4.json')
          bp=Path('research/mexc_global_assets/MEXC_HL_SP500_SOURCE_BINDING_V0.3.1.json')
          r=json.loads(rp.read_text()); b=json.loads(bp.read_text())
          assert b['verdict']=='HYPERLIQUID_SP500_SOURCE_PASS__XYZ_SP500'
          assert r['outcomes_opened_at_freeze']==0
          assert r['hyperliquid_coin']=='xyz:SP500'
          assert r['mexc_symbol']=='SPX500_USDT'
          assert r['signal']['direction']=='FOLLOW_HYPERLIQUID'
          assert r['discovery_end_exclusive']=='2026-10-04T09:00:00Z'
          assert r['retrospective_oos_authorized'] is False
          assert r['live_trading_authorized'] is False
          print('RULE_SHA256='+hashlib.sha256(rp.read_bytes()).hexdigest())
          print('BINDING_SHA256='+hashlib.sha256(bp.read_bytes()).hexdigest())
          print('PRE_OUTCOME_FREEZE_PASS')
          PY

      - name: Execute frozen source-aligned discovery
        run: python research/mexc_global_assets/mexc_hl_sp500_leadlag_v04.py

      - name: Upload immutable discovery closeout
        uses: actions/upload-artifact@v4
        with:
          name: mexc-hl-sp500-leadlag-v04-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/mexc_global_assets/mexc_hl_sp500_leadlag_v04
          if-no-files-found: error
          retention-days: 90

      - name: Governance closeout
        run: |
          echo 'DISCOVERY ONLY'
          echo 'NO RETROSPECTIVE OOS'
          echo 'NO DATA >= 2026-10-04T09:00:00Z'
          echo 'NO ACCOUNT / WALLET / PRIVATE ENDPOINT'
          echo 'NO ORDERS / NO MUTATION / NO LIVE TRADING'
