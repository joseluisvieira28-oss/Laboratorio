name: MLMXD V0.1 Source Probe

on:
  push:
    branches:
      - mexc-launchpool-mx-demand-v0.1-source-2026-10-07
    paths:
      - 'research/mexc_launchpool_mx_demand/source_probe_v01.py'
      - '.github/workflows/mlmxd_v01_source_probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install ccxt
      - name: Run outcome-blind source probe
        run: python research/mexc_launchpool_mx_demand/source_probe_v01.py
      - name: Verify no market outcomes
        run: |
          python - <<'PY'
          import json
          p=json.load(open('artifacts/mexc_launchpool_mx_demand_v01_source/source_probe_summary.json'))
          assert p['authenticated'] is False
          assert p['market_prices_opened'] is False
          print(json.dumps(p,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: mlmxd-v01-source-probe
          path: artifacts/mexc_launchpool_mx_demand_v01_source/
          retention-days: 90
