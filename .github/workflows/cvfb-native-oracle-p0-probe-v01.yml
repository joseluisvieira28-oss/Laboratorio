name: cvfb-native-oracle-p0-probe-v01

on:
  pull_request:
    paths:
      - 'research/cross_venue_funding_basis/**'
      - '.github/workflows/cvfb-native-oracle-p0-probe-v01.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-schema-probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile frozen source-only probe
        run: python -m py_compile research/cross_venue_funding_basis/cvfb_native_oracle_p0_probe_v01.py
      - name: Verify freeze remains source-only
        run: |
          python - <<'PY'
          import json
          p='research/cross_venue_funding_basis/CVFB_NATIVE_ORACLE_PROVENANCE_P0_FREEZE_V0.1.json'
          x=json.load(open(p,encoding='utf-8'))
          assert x['status']=='FROZEN_BEFORE_PROBE'
          assert x['economic_outcomes_authorized'] is False
          assert x['primary_replication_reopened'] is False
          assert x['2026_authorized'] is False
          assert x['live_trading_authorized'] is False
          assert x['frozen_probe']['target_epoch_ms']==1725148800000
          assert x['frozen_probe']['height_bracket']==[100000000,600000000]
          assert x['frozen_probe']['scan_radius_blocks_each_side']==150
          print('FREEZE_GUARD_PASS')
          PY
      - name: Execute fixed historical schema probe
        run: |
          mkdir -p out/cvfb_p0
          python research/cross_venue_funding_basis/cvfb_native_oracle_p0_probe_v01.py \
            --out out/cvfb_p0/CVFB_NATIVE_ORACLE_PROVENANCE_P0_RECEIPT_V0.1.json
      - name: Publish source-only receipt
        uses: actions/upload-artifact@v4
        with:
          name: CVFB_NATIVE_ORACLE_PROVENANCE_P0_V01
          path: out/cvfb_p0/CVFB_NATIVE_ORACLE_PROVENANCE_P0_RECEIPT_V0.1.json
          if-no-files-found: error
          retention-days: 90
