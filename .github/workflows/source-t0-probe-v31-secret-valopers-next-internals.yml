name: source-t0-probe-v31-secret-valopers-next-internals
on:
  workflow_dispatch:
  push:
    branches: [cosmos-native-emission-param-shock-001-v0.2-t0-remediation-2026-10-07]
    paths: [.github/workflows/source-t0-probe-v31-secret-valopers-next-internals.yml]
permissions: {contents: write}
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {ref: cosmos-native-emission-param-shock-001-v0.2-t0-remediation-2026-10-07}
      - name: Probe Valopers Next internals without market data
        run: |
          python3 - <<'PY'
          import urllib.request,urllib.error,urllib.parse,re,json,hashlib,os,datetime
          BASE="https://secret.valopers.com"; API="https://api.valopers.com"
          OUT="research/cosmos_native_emission_param_shock_001_v0_2/SCRT287_VALOPERS_NEXT_INTERNALS_V31.json"
          H=11752974
          def get(u,to=15,headers=None):
            hh={"User-Agent":"Mozilla/5.0 CryptoLab-source-only-v31"}; hh.update(headers or {})
            try:
              with urllib.request.urlopen(urllib.request.Request(u,headers=hh),timeout=to) as r:
                b=r.read(); return {"ok":1,"status":r.status,"url":r.geturl(),"ct":r.headers.get("content-type",""),"sha256":hashlib.sha256(b).hexdigest(),"body":b.decode("utf-8","replace")[:1500000]}
            except urllib.error.HTTPError as e:
              try:b=e.read()
              except:b=b""
              return {"ok":0,"status":e.code,"url":u,"error":str(e),"body":b.decode("utf-8","replace")[:100000]}
            except Exception as e:return {"ok":0,"status":None,"url":u,"error":repr(e),"body":""}
          pages={}
          for p in ["/blocks/"+str(H),"/blocks","/proposals/287","/governance","/"]:
            r=get(BASE+p); pages[p]={"status":r.get("status"),"url":r.get("url"),"ct":r.get("ct"),"sha256":r.get("sha256"),"excerpt":r.get("body","")[:30000]}
          refs=set()
          for x in pages.values():
            b=x.get("excerpt","")
            for m in re.finditer(r'(?:src|href)=["\']([^"\']+)["\']',b):
              s=m.group(1)
              if "_next/static" in s: refs.add(urllib.parse.urljoin(BASE,s))
          # manifests often expose route-specific chunks
          for p in ["/_next/static/BUILD_ID","/_next/static/chunks/app/blocks/%5Bheight%5D/page.js","/_next/static/chunks/app/blocks/page.js","/_next/static/chunks/app/proposals/%5Bid%5D/page.js","/_next/static/chunks/app/governance/page.js"]:
            refs.add(BASE+p)
          assets=[]
          endpoints=set()
          for u in sorted(refs):
            r=get(u,20); b=r.get("body","")
            ctx=[]
            for needle in ["api.valopers.com","/blocks","blocks?","blockHeight","height=","/proposals","governance","rpc","lcd","rest"]:
              pos=0
              while len(ctx)<200:
                pos=b.lower().find(needle.lower(),pos)
                if pos<0:break
                ex=b[max(0,pos-700):pos+2200]; ctx.append({"needle":needle,"excerpt":ex})
                for z in re.findall(r'https?://[^"\'<>\\ ]+',ex):
                  if "price" not in z.lower() and "market" not in z.lower(): endpoints.add(z[:1000])
                pos+=len(needle)
            assets.append({"url":u,"status":r.get("status"),"ok":r.get("ok"),"ct":r.get("ct"),"sha256":r.get("sha256"),"contexts":ctx[:200],"error":r.get("error")})
          # Probe only discovered api.valopers.com URLs that are metadata-like.
          probes=[]
          for u in sorted(endpoints):
            if "api.valopers.com" not in u: continue
            if any(x in u.lower() for x in ["price","market","volume"]): continue
            rr=get(u,15)
            probes.append({"url":u,"status":rr.get("status"),"ct":rr.get("ct"),"sha256":rr.get("sha256"),"error":rr.get("error"),"excerpt":rr.get("body","")[:10000]})
          out={"scope":"SOURCE_ONLY_NO_MARKET_DATA","target":"SCRT Proposal 287 exact historical execution boundary","tested_utc":datetime.datetime.now(datetime.timezone.utc).isoformat(),"pages":pages,"assets":assets,"discovered_nonmarket_urls":sorted(endpoints),"probes":probes}
          os.makedirs(os.path.dirname(OUT),exist_ok=True); json.dump(out,open(OUT,"w"),indent=2)
          print(json.dumps({"assets":len(assets),"urls":len(endpoints),"api_probes":len(probes)}))
          PY
      - name: Persist V31 receipt
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/cosmos_native_emission_param_shock_001_v0_2/SCRT287_VALOPERS_NEXT_INTERNALS_V31.json
          git diff --cached --quiet || (git commit -m "SCRT287: persist Valopers Next internals v31" && git push origin HEAD:cosmos-native-emission-param-shock-001-v0.2-t0-remediation-2026-10-07)
