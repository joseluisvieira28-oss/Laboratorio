name: L2 Resiliency 001 — 2024 BTC Source Inventory V0.1

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  head-only-inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install frozen source dependency
        run: python -m pip install --disable-pip-version-check boto3

      - name: Static compile
        run: python -m py_compile research/l2_resiliency/l2r_2024_btc_source_inventory_v01.py

      - name: Execute exact 2024 BTC HEAD-only requester-pays inventory
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.L2R_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.L2R_AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ secrets.L2R_AWS_SESSION_TOKEN }}
        run: |
          mkdir -p out/l2r
          set +e
          python research/l2_resiliency/l2r_2024_btc_source_inventory_v01.py \
            --execute \
            --authorization-confirmation 'I_AUTHORIZE_L2R_2024_BTC_HEAD_ONLY_REQUESTER_PAYS_INVENTORY' \
            --out out/l2r/L2_RESILIENCY_001_2024_BTC_SOURCE_INVENTORY_V0_1.json
          rc=$?
          set -e
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 2 ] && [ "$rc" -ne 3 ]; then
            exit "$rc"
          fi

      - name: Enforce source-only firewall
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('out/l2r/L2_RESILIENCY_001_2024_BTC_SOURCE_INVENTORY_V0_1.json')
          x=json.loads(p.read_text())
          assert x['year']==2024
          assert x['asset']=='BTC'
          assert x['expected_keys']==8784
          assert x['list_requests']==0
          assert x['get_requests']==0
          assert x['object_bodies_read'] is False
          assert x['decompression_performed'] is False
          for k in ['sweep_events_computed','replenishment_computed','midpoint_response_computed','returns_computed','pnl_computed','access_2025','access_2026','live_trading','exchange_mutation']:
              assert x[k] is False, (k,x[k])
          assert x['classification'] in {'SOURCE_INVENTORY_PASS','SOURCE_INVENTORY_FAIL_CLOSED','BLOCKED_NO_AWS_CREDENTIALS'}
          print('L2R_SOURCE_ONLY_FIREWALL_PASS',x['classification'])
          PY

      - name: Upload canonical source inventory receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: L2_RESILIENCY_001_2024_BTC_SOURCE_INVENTORY_V0_1
          path: out/l2r/L2_RESILIENCY_001_2024_BTC_SOURCE_INVENTORY_V0_1.json
          if-no-files-found: error
          retention-days: 90
