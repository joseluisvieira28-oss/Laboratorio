name: Lighter NVDA History Source V0.1.1
on:
  push:
    branches:
      - lighter-nvda-portability-v0.1-source-gate-2026-10-05
permissions:
  contents: read
jobs:
  history:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check requests
      - name: Freeze check
        run: |
          test -f research/lighter_nvda/LIGHTER_NVDA_HISTORY_SOURCE_FREEZE_V0.1.1.md
          python -m py_compile research/lighter_nvda/lighter_nvda_history_source_v011.py
          echo HISTORY_SOURCE_PRE_OUTCOME_FREEZE_PASS
      - run: python research/lighter_nvda/lighter_nvda_history_source_v011.py
      - uses: actions/upload-artifact@v4
        with:
          name: lighter-nvda-history-v011-${{ github.run_id }}
          path: artifacts/lighter_nvda/v011_history
          if-no-files-found: error
          retention-days: 90
