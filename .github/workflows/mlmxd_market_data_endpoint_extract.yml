name: MLMXD Historical Download Endpoint Extract

on:
  push:
    branches:
      - mexc-launchpool-mx-demand-v0.1-source-2026-10-07
    paths:
      - 'research/mexc_launchpool_mx_demand/market_data_endpoint_extract.py'
      - '.github/workflows/mlmxd_market_data_endpoint_extract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - run: python research/mexc_launchpool_mx_demand/market_data_endpoint_extract.py
