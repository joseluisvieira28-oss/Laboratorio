name: CBBTC-ETH-MINT-BURN-FLOW-001 flow state sample gate V0.1

on:
  push:
    branches:
      - cbbtc-eth-mint-burn-flow-001-source-gate-v01
    paths:
      - 'research/cbbtc_eth_mint_burn_flow_001/FLOW_SAMPLE_TRIGGER_V0.1.md'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cbbtc-eth-mint-burn-flow-001-flow-sample-v01
  cancel-in-progress: true

jobs:
  sample_gate:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Require exact passing census
        run: |
          python - <<'PY'
          import json
          p="research/cbbtc_eth_mint_burn_flow_001/FLOW_CENSUS_RECEIPT_V0.1.json"
          x=json.load(open(p))
          assert x["classification"]=="PREDICTOR_FLOW_CENSUS_PASS", x
          assert x["supply_reconciliation"]["exact_equal"] is True, x
          assert x["protected_2026_opened"] is False, x
          PY
      - name: Compute pre-frozen calibration thresholds
        run: python research/cbbtc_eth_mint_burn_flow_001/cbbtc_flow_state_calibration_v01.py
      - name: Run outcome-blind H2 2025 predictor sample gate
        run: python research/cbbtc_eth_mint_burn_flow_001/cbbtc_discovery_flow_sample_gate_v01.py
      - name: Persist calibration and sample evidence
        shell: bash
        run: |
          cp research/cbbtc_eth_mint_burn_flow_001/FLOW_STATE_CALIBRATION_RECEIPT_V0.1.json /tmp/cbbtc_cal.json
          cp research/cbbtc_eth_mint_burn_flow_001/DISCOVERY_FLOW_PREDICTOR_SAMPLE_RECEIPT_V0.1.json /tmp/cbbtc_sample.json
          cp research/cbbtc_eth_mint_burn_flow_001/DISCOVERY_FLOW_PREDICTOR_SAMPLE_ROWS_V0.1.json /tmp/cbbtc_sample_rows.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin cbbtc-eth-mint-burn-flow-001-source-gate-v01
          git checkout -B cbbtc-sample-persist origin/cbbtc-eth-mint-burn-flow-001-source-gate-v01
          cp /tmp/cbbtc_cal.json research/cbbtc_eth_mint_burn_flow_001/FLOW_STATE_CALIBRATION_RECEIPT_V0.1.json
          cp /tmp/cbbtc_sample.json research/cbbtc_eth_mint_burn_flow_001/DISCOVERY_FLOW_PREDICTOR_SAMPLE_RECEIPT_V0.1.json
          cp /tmp/cbbtc_sample_rows.json research/cbbtc_eth_mint_burn_flow_001/DISCOVERY_FLOW_PREDICTOR_SAMPLE_ROWS_V0.1.json
          git add research/cbbtc_eth_mint_burn_flow_001/FLOW_STATE_CALIBRATION_RECEIPT_V0.1.json research/cbbtc_eth_mint_burn_flow_001/DISCOVERY_FLOW_PREDICTOR_SAMPLE_RECEIPT_V0.1.json research/cbbtc_eth_mint_burn_flow_001/DISCOVERY_FLOW_PREDICTOR_SAMPLE_ROWS_V0.1.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "CBBTC-ETH-MINT-BURN-FLOW-001: persist outcome-blind flow sample gate [skip ci]"
          git push origin HEAD:cbbtc-eth-mint-burn-flow-001-source-gate-v01
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cbbtc-flow-state-sample-gate-v01
          path: |
            research/cbbtc_eth_mint_burn_flow_001/FLOW_STATE_CALIBRATION_RECEIPT_V0.1.json
            research/cbbtc_eth_mint_burn_flow_001/DISCOVERY_FLOW_PREDICTOR_SAMPLE_RECEIPT_V0.1.json
            research/cbbtc_eth_mint_burn_flow_001/DISCOVERY_FLOW_PREDICTOR_SAMPLE_ROWS_V0.1.json
          if-no-files-found: warn
