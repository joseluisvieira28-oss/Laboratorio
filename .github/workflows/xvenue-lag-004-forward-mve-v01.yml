name: xvenue-lag-004-forward-mve-v01

on:
  push:
    branches:
      - microstructure-scalping-lab-v0.1
    paths:
      - 'research/microstructure_scalping/XVENUE_LAG_004_FORWARD_FREEZE_V0_1.md'
      - 'research/microstructure_scalping/xvenue_lag_004_forward_v01.py'
      - '.github/workflows/xvenue-lag-004-forward-mve-v01.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  xvenue-lag-004:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'websockets>=13,<16'
      - name: Capture and evaluate public cross-venue BBO
        run: python -m research.microstructure_scalping.xvenue_lag_004_forward_v01
      - name: Print receipt
        if: always()
        run: cat research/microstructure_scalping/receipts/xvenue_lag_004_forward_v01.json || true
