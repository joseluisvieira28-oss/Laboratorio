    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download accepted Save0c baseline
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ matrix.baseline_run }}
          pattern: ${{ matrix.baseline_pattern }}
          path: baseline
          merge-multiple: true
      - name: Compile Save0c unit runner
        run: python -m py_compile labs/DEFI_LIQUIDATION_SHOCK_001/source/run_save0c_unit_metadata_partition_v0_1.py
      - name: Reconstruct direct units and pinned reserve coverage
        run: >
          python labs/DEFI_LIQUIDATION_SHOCK_001/source/run_save0c_unit_metadata_partition_v0_1.py
          --start "${{ matrix.start }}"
          --end "${{ matrix.end }}"
          --baseline baseline
          --partition-id "${{ matrix.id }}"
          --registry labs/DEFI_LIQUIDATION_SHOCK_001/SAVE0C_2021_PRODUCTION_RESERVE_REGISTRY_V0.1.json
          --out "units/${{ matrix.id }}.json"
      - name: Upload Save0c unit partition
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dls-save0c-unit-${{ matrix.id }}
          path: units/${{ matrix.id }}.json
          if-no-files-found: warn
          retention-days: 30
      - name: Firewall
        if: always()
        run: echo SOURCE_ONLY_TRUE

  aggregate:
    needs: units
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: dls-save0c-unit-*
          path: unit_receipts
          merge-multiple: true
      - name: Compile aggregator
        run: python -m py_compile labs/DEFI_LIQUIDATION_SHOCK_001/source/aggregate_save0c_unit_metadata_v0_1.py
      - name: Aggregate Save0c unit coverage
        run: python labs/DEFI_LIQUIDATION_SHOCK_001/source/aggregate_save0c_unit_metadata_v0_1.py unit_receipts
      - name: Upload Save0c unit population receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dls-save0c-unit-metadata-population-v01
          path: labs/DEFI_LIQUIDATION_SHOCK_001/SAVE0C_UNIT_METADATA_POPULATION_RECEIPT_V0.1.json
          if-no-files-found: warn
          retention-days: 30
      - name: Firewall
        if: always()
        run: echo SOURCE_ONLY_TRUE
