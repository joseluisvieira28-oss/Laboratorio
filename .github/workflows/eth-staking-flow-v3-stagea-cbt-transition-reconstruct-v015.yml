name: ETH-STAKING-FLOW-001 CBT transition reconstruction V0.1.5

on:
  push:
    branches:
      - eth-staking-flow-v3-stagea-cbt-transition-v015
    paths:
      - 'research/eth_staking_flow/ETH_STAKING_FLOW_001_V3_STAGEA_CBT_SPARSE_LIFECYCLE_ADDENDUM_V0_1_5A.md'
      - 'research/eth_staking_flow/cbt_transition_reconstruct_v015.py'
      - '.github/workflows/eth-staking-flow-v3-stagea-cbt-transition-reconstruct-v015.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: eth-staking-flow-v3-stagea-cbt-transition-v015
  cancel-in-progress: false

jobs:
  reconstruct:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: eth-staking-flow-v3-stagea-cbt-transition-v015
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download immutable legacy Stage-A monthly artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 35387477455 --repo joseluisvieira28-oss/Laboratorio --pattern 'ETH_V3_REP_SOURCE_*' --dir legacy_artifacts
      - name: Reconstruct exact 608-day queue source and enforce 601/601 equivalence
        run: python research/eth_staking_flow/cbt_transition_reconstruct_v015.py
      - name: Persist SOURCE_REPLICATION_PASS evidence
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          cp artifacts/cbt_v015/ETH_STAKING_FLOW_001_V3_REPLICATION_SOURCE_V0_1_5.json research/eth_staking_flow/
          cp artifacts/cbt_v015/ETH_STAKING_FLOW_001_V3_REPLICATION_SOURCE_LEDGER_V0_1_5.json research/eth_staking_flow/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/eth_staking_flow/ETH_STAKING_FLOW_001_V3_REPLICATION_SOURCE_V0_1_5.json research/eth_staking_flow/ETH_STAKING_FLOW_001_V3_REPLICATION_SOURCE_LEDGER_V0_1_5.json
          git commit -m "ETH-STAKING-FLOW-001: persist V0.1.5 Stage-A source replication PASS [skip ci]"
          git push origin HEAD:eth-staking-flow-v3-stagea-cbt-transition-v015
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ETH_STAKING_FLOW_001_V3_STAGEA_CBT_TRANSITION_V0_1_5
          path: artifacts/cbt_v015/*
          if-no-files-found: error
