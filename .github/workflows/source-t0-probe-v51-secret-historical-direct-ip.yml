name: source-t0-probe-v51-secret-historical-direct-ip
on:
  push:
    branches: [cosmos-native-emission-param-shock-001-v0.2-t0-remediation-2026-10-07]
    paths: [.github/workflows/source-t0-probe-v51-secret-historical-direct-ip.yml]
permissions: {contents: write}
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: {ref: cosmos-native-emission-param-shock-001-v0.2-t0-remediation-2026-10-07}
      - name: Probe documented Mantlemint historical RPC upstream IP
        run: |
          python3 - <<'PY'
          import json,urllib.request,urllib.error,ssl,hashlib,os,datetime
          OUT="research/cosmos_native_emission_param_shock_001_v0_2/SCRT287_DIRECT_IP_UPSTREAM_V51.json"
          bases=["http://20.104.20.173:26657","https://20.104.20.173:26657"]
          hs=list(range(11880917,11880924))
          def get(u,to=10):
            try:
              q=urllib.request.Request(u,headers={"User-Agent":"CryptoLab-source-only-v51","Host":"20.104.20.173"})
              with urllib.request.urlopen(q,timeout=to,context=ssl._create_unverified_context()) as r:
                b=r.read()
                return {"ok":True,"status":r.status,"url":r.geturl(),"sha256":hashlib.sha256(b).hexdigest(),
                        "body":b.decode("utf-8","replace")}
            except urllib.error.HTTPError as e:
              try:b=e.read()
              except:b=b""
              return {"ok":False,"status":e.code,"url":u,"error":str(e),"body":b.decode("utf-8","replace")}
            except Exception as e:return {"ok":False,"status":None,"url":u,"error":repr(e),"body":""}
          rows=[]
          for b in bases:
            for p in ["/status"]+[f"/block?height={h}" for h in hs]+[f"/commit?height={h}" for h in hs]:
              r=get(b+p)
              parsed=None
              if r["ok"]:
                try:
                  d=json.loads(r["body"])
                  z=(d.get("result") or {})
                  hd=(z.get("block") or {}).get("header") or z.get("signed_header",{}).get("header")
                  if hd:parsed={"height":int(hd["height"]),"time":hd["time"],"hash":(z.get("block_id") or {}).get("hash")}
                except:pass
              rows.append({"url":b+p,"ok":r["ok"],"status":r.get("status"),"error":r.get("error"),
                           "sha256":r.get("sha256"),"parsed":parsed,"body_excerpt":r.get("body","")[:3000]})
          useful=[x for x in rows if x["parsed"]]
          out={"scope":"SOURCE_ONLY_NO_MARKET_DATA",
               "source_provenance":"Secret Network Mantlemint docs RPC_ENDPOINTS/WS_ENDPOINTS example",
               "documented_ip":"20.104.20.173","tested_utc":datetime.datetime.now(datetime.timezone.utc).isoformat(),
               "rows":rows,"useful":useful}
          os.makedirs(os.path.dirname(OUT),exist_ok=True);open(OUT,"w").write(json.dumps(out,indent=2))
          print("V51",json.dumps({"useful":useful}))
          PY
      - name: Persist
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/cosmos_native_emission_param_shock_001_v0_2/SCRT287_DIRECT_IP_UPSTREAM_V51.json
          git commit -m "SCRT287: persist documented direct-IP historical RPC probe v51"
          git pull --rebase origin cosmos-native-emission-param-shock-001-v0.2-t0-remediation-2026-10-07
          git push origin HEAD:cosmos-native-emission-param-shock-001-v0.2-t0-remediation-2026-10-07
