name: OPTIONS-SPOTPERP-001 Monthly 10000-Count Source Audit V0.1
# Infrastructure retry after correcting the monthly-window monkeypatch target.

on:
  push:
    branches:
      - options-spotperp-v0.1
    paths:
      - '.github/workflows/options-source-audit-monthly-count10000-v01.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  monthly-equivalent-source-audit:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, 'prove monthly-window equivalence and execute source audit')
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Checkout exact Options branch
        uses: actions/checkout@v4

      - name: Bind authority and compile outcome-blind tooling
        working-directory: Dream-Account-OS-v2.3-PARTIAL/research/options_spotperp_v0_1
        run: |
          echo "HEAD_SHA=$(git rev-parse HEAD)"
          test "${GITHUB_REF_NAME}" = "options-spotperp-v0.1"
          python3 preflight_source_audit.py
          python3 -m py_compile \
            source_audit.py \
            source_audit_count10000_v01.py \
            source_audit_count10000_monthly_v01.py \
            source_audit_gate.py \
            source_audit_gate_authority_reconciled_v01.py \
            source_gate_calendar_day_reconciler_v01.py \
            verify_count10000_first_day_trade_ids_v01.py \
            discovery_runner_v01.py \
            test_discovery_runner_v01.py \
            test_source_audit_gate_authority_reconciled_v01.py \
            test_source_gate_calendar_day_reconciler_v01.py
          python3 test_source_audit_gate_authority_reconciled_v01.py
          python3 test_source_gate_calendar_day_reconciler_v01.py
          python3 test_discovery_runner_v01.py

      - name: Acquire April 2021 using 30 daily top-level windows
        working-directory: Dream-Account-OS-v2.3-PARTIAL/research/options_spotperp_v0_1
        shell: bash
        run: |
          set +e
          python3 source_audit_count10000_v01.py --probe-days 30 --output april_daily
          rc=$?
          set -e
          echo "APRIL_DAILY_EXIT=$rc"
          test "$rc" -eq 4

      - name: Acquire April 2021 using one monthly top-level window
        working-directory: Dream-Account-OS-v2.3-PARTIAL/research/options_spotperp_v0_1
        shell: bash
        run: |
          set +e
          python3 source_audit_count10000_monthly_v01.py --probe-days 1 --output april_monthly
          rc=$?
          set -e
          echo "APRIL_MONTHLY_EXIT=$rc"
          test "$rc" -eq 4

      - name: Prove exact April 2021 trade-id equivalence
        working-directory: Dream-Account-OS-v2.3-PARTIAL/research/options_spotperp_v0_1
        run: |
          python3 - <<'PY'
          import gzip, hashlib, json
          from pathlib import Path

          def ids_and_ts(root):
              root=Path(root)
              m=json.loads((root/'source_manifest.json').read_text())
              ids=[]; ts=[]; rows=0
              for e in m['raw_pages']:
                  p=root/'raw'/e['page']
                  obj=json.loads(gzip.decompress(p.read_bytes()).decode())
                  trades=obj['result']['trades']
                  rows += len(trades)
                  for r in trades:
                      ids.append(str(r['trade_id']))
                      ts.append(int(r['timestamp']))
              assert len(ids)==len(set(ids)), f'duplicate trade ids in {root}'
              h=hashlib.sha256(('\n'.join(sorted(ids))+'\n').encode()).hexdigest()
              return ids,ts,rows,h,m

          dids,dts,drows,dh,dm=ids_and_ts('april_daily')
          mids,mts,mrows,mh,mm=ids_and_ts('april_monthly')
          assert sorted(dids)==sorted(mids), (len(dids),len(mids),dh,mh)
          assert drows==mrows
          assert min(dts)==min(mts) and max(dts)==max(mts)
          assert dm['holdout_accessed'] is False and mm['holdout_accessed'] is False
          assert dm['locked_2026_accessed'] is False and mm['locked_2026_accessed'] is False
          print('APRIL_2021_MONTHLY_WINDOW_EQUIVALENCE_PASS')
          print('TRADE_IDS=',len(dids))
          print('TRADE_ID_SET_SHA256=',dh)
          print('DAILY_RAW_PAGES=',len(dm['raw_pages']))
          print('MONTHLY_RAW_PAGES=',len(mm['raw_pages']))
          print('NO SKEW / NO RETURNS / NO PNL / 2025 LOCKED / 2026 LOCKED')
          PY

      - name: Execute full frozen monthly-window Deribit acquisition
        id: acquisition
        working-directory: Dream-Account-OS-v2.3-PARTIAL/research/options_spotperp_v0_1
        shell: bash
        run: |
          set +e
          python3 source_audit_count10000_monthly_v01.py --output source_audit_data
          rc=$?
          set -e
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          echo "ACQUISITION_EXIT_CODE=$rc"
          test "$rc" -eq 0 -o "$rc" -eq 2 -o "$rc" -eq 12

      - name: Validate full acquisition firewalls
        if: always() && steps.acquisition.outputs.rc != '' && steps.acquisition.outputs.rc != '12'
        working-directory: Dream-Account-OS-v2.3-PARTIAL/research/options_spotperp_v0_1
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path('source_audit_data/source_manifest.json').read_text())
          r=json.loads(Path('source_audit_data/source_audit_report.json').read_text())
          assert m['probe_mode'] is False
          assert m['source_fetch_complete'] is True
          assert m['holdout_accessed'] is False
          assert m['locked_2026_accessed'] is False
          assert r['outcome_metrics_computed'] is False
          assert r['audit']['skew_values_computed'] is False
          assert r['audit']['forward_returns_computed'] is False
          assert r['audit']['pnl_computed'] is False
          print('MONTHLY_FULL_RAW_ACQUISITION_COMPLETE')
          print('RAW_PAGES=',len(m['raw_pages']))
          print('TOTAL_TRADES=',r['audit']['total_trades'])
          print('FRACTIONAL_DTE_DIAGNOSTIC_ONLY=',r['audit']['valid_signal_coverage_days'])
          PY

      - name: Verify exact first-day trade-id baseline
        if: always() && steps.acquisition.outputs.rc != '' && steps.acquisition.outputs.rc != '12'
        working-directory: Dream-Account-OS-v2.3-PARTIAL/research/options_spotperp_v0_1
        run: |
          python3 verify_count10000_first_day_trade_ids_v01.py --input source_audit_data

      - name: Execute latest canonical calendar-day Source/Data Gate
        id: canonical
        if: always() && steps.acquisition.outputs.rc != '' && steps.acquisition.outputs.rc != '12'
        working-directory: Dream-Account-OS-v2.3-PARTIAL/research/options_spotperp_v0_1
        shell: bash
        run: |
          rm -f source_audit_data/source_gate_calendar_day_reconciled_receipt.json
          rm -f source_audit_data/source_gate_calendar_day_daily_coverage.json
          set +e
          python3 source_gate_calendar_day_reconciler_v01.py --input source_audit_data
          rc=$?
          set -e
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          echo "CANONICAL_EXIT_CODE=$rc"
          test "$rc" -eq 0 -o "$rc" -eq 2 -o "$rc" -eq 12

      - name: Validate final canonical source-only receipt
        if: always() && steps.canonical.outputs.rc != ''
        working-directory: Dream-Account-OS-v2.3-PARTIAL/research/options_spotperp_v0_1
        env:
          CANONICAL_RC: ${{ steps.canonical.outputs.rc }}
        run: |
          python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          rc=int(os.environ['CANONICAL_RC'])
          x=json.loads(Path('source_audit_data/source_gate_calendar_day_reconciled_receipt.json').read_text())
          expected={0:'SOURCE_AUDIT_PASS',2:'SOURCE_AUDIT_BLOCKED',12:'EXECUTION_ENVIRONMENT_BLOCKED'}[rc]
          assert x['status']==expected,(rc,x['status'])
          assert x['authority']['authority_sha256']=='138cee737d75d27b43d9f377fc9a77e823e8fb2015f360b300cdc4a16cf67cfa'
          assert x['skew_values_computed'] is False
          assert x['signals_computed'] is False
          assert x['forward_returns_computed'] is False
          assert x['pnl_computed'] is False
          assert x['holdout_2025_accessed'] is False
          assert x['year_2026_accessed'] is False
          c=x.get('calendar_day_coverage_audit') or {}
          if c:
              assert c.get('dte_definition')=='calendar_date_difference_days'
              p=Path('source_audit_data/source_gate_calendar_day_daily_coverage.json')
              assert p.exists()
              sha=hashlib.sha256(p.read_bytes()).hexdigest()
              assert sha==c.get('daily_coverage_sha256')
              assert c.get('daily_coverage_rows')==1371
              assert c.get('daily_coverage_contains_outcomes') is False
          print('FINAL_CANONICAL_STATUS=',x['status'])
          print('VALID_DAYS_TOTAL=',c.get('valid_signal_coverage_days'))
          print('VALID_DAYS_BY_YEAR=',c.get('valid_signal_coverage_days_by_year'))
          print('COVERAGE_RATIO_BY_YEAR=',c.get('coverage_ratio_by_year'))
          print('MIN_REQUIRED=',c.get('min_required_valid_days'))
          print('ELIGIBLE_TRADE_ROWS=',c.get('eligible_trade_rows'))
          print('DAILY_COVERAGE_SHA256=',c.get('daily_coverage_sha256'))
          print('BTC_PRICE_AUDIT=',x.get('btc_price_audit'))
          print('NO DISCOVERY / NO SKEW / NO RETURNS / NO PNL')
          print('2025 LOCKED / 2026 LOCKED')
          PY

      - name: Upload final monthly canonical receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: options-spotperp-001-monthly-final-receipts-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            Dream-Account-OS-v2.3-PARTIAL/research/options_spotperp_v0_1/source_audit_data/source_manifest.json
            Dream-Account-OS-v2.3-PARTIAL/research/options_spotperp_v0_1/source_audit_data/source_audit_report.json
            Dream-Account-OS-v2.3-PARTIAL/research/options_spotperp_v0_1/source_audit_data/source_gate_calendar_day_reconciled_receipt.json
            Dream-Account-OS-v2.3-PARTIAL/research/options_spotperp_v0_1/source_audit_data/source_gate_calendar_day_daily_coverage.json
          if-no-files-found: warn
          retention-days: 90

      - name: Upload final monthly raw provenance
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: options-spotperp-001-monthly-raw-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            Dream-Account-OS-v2.3-PARTIAL/research/options_spotperp_v0_1/source_audit_data/raw/
            Dream-Account-OS-v2.3-PARTIAL/research/options_spotperp_v0_1/source_audit_data/raw_binance_btcusdt_1d/
          if-no-files-found: warn
          compression-level: 0
          retention-days: 30

      - name: Governance receipt
        if: always()
        run: |
          echo 'SOURCE/DATA AUDIT ONLY — MONTHLY TOP-LEVEL WINDOWS'
          echo 'MONTHLY ROUTE REQUIRED EXACT APRIL 2021 TRADE-ID EQUIVALENCE FIRST'
          echo 'NO DISCOVERY / NO REAL SKEW / NO RETURNS / NO PNL'
          echo '2025 LOCKED / 2026 LOCKED'
          echo 'NO LIVE TRADING / NO EXCHANGE MUTATION'

      - name: Enforce classified final state
        if: always()
        env:
          ACQ_RC: ${{ steps.acquisition.outputs.rc }}
          CANONICAL_RC: ${{ steps.canonical.outputs.rc }}
        run: |
          if [ "$ACQ_RC" = "12" ]; then echo 'EXECUTION_ENVIRONMENT_BLOCKED_DURING_ACQUISITION'; exit 12; fi
          case "$CANONICAL_RC" in
            0) echo 'SOURCE_AUDIT_PASS'; exit 0 ;;
            2) echo 'SOURCE_AUDIT_BLOCKED'; exit 2 ;;
            12) echo 'EXECUTION_ENVIRONMENT_BLOCKED'; exit 12 ;;
            *) echo "UNEXPECTED_STATE ACQ=$ACQ_RC CANONICAL=$CANONICAL_RC"; exit 99 ;;
          esac
