name: Stablecoin DEX Stress V0.1 Source Gate

on:
  workflow_dispatch:
  push:
    branches:
      - stablecoin-dex-stress-v0.1
    paths:
      - '.github/stablecoin-dex-stress-source-gate-v01.trigger'

permissions:
  contents: read

jobs:
  source-data-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout frozen branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Governance and syntax preflight
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "stablecoin-dex-stress-v0.1"
          CONTRACT='Dream-Account-OS-v2.3-PARTIAL/research/stablecoin_dex_stress_v0_1/SDS_CURVE3POOL_PEG_001_SOURCE_CONTRACT_V01.json'
          SCRIPT='Dream-Account-OS-v2.3-PARTIAL/research/stablecoin_dex_stress_v0_1/source_gate.py'
          grep -q '"mve_id": "SDS-CURVE3POOL-PEG-001"' "$CONTRACT"
          grep -q '"discovery_trigger_authorized": false' "$CONTRACT"
          grep -q '"access_2025_allowed": false' "$CONTRACT"
          grep -q '"eth_price_values_allowed": false' "$CONTRACT"
          grep -q 'END_BLOCK = 21_525_890' "$SCRIPT"
          grep -q '"price_values_opened": False' "$SCRIPT"
          grep -q '"returns_computed": False' "$SCRIPT"
          grep -q '"pnl_computed": False' "$SCRIPT"
          grep -q '"access_2025": False' "$SCRIPT"
          grep -q '"access_2026": False' "$SCRIPT"
          if grep -Eqi 'binance|coinbase|mexc|bybit|kraken|coingecko|cryptocompare' "$SCRIPT"; then
            echo 'Forbidden market-data source token found in source-gate implementation.'
            exit 41
          fi
          python -m py_compile "$SCRIPT"
          echo 'PREOUTCOME GOVERNANCE + SYNTAX: PASS'

      - name: Execute Source/Data Gate only
        id: gate
        shell: bash
        run: |
          set +e
          python Dream-Account-OS-v2.3-PARTIAL/research/stablecoin_dex_stress_v0_1/source_gate.py
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload immutable source-gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stablecoin-dex-stress-v01-source-gate-${{ github.run_id }}
          path: stablecoin_dex_stress_source_gate_out/
          if-no-files-found: error
          retention-days: 90
          compression-level: 6

      - name: Enforce gate result
        if: always()
        shell: bash
        run: |
          code='${{ steps.gate.outputs.exit_code }}'
          test -n "$code" || { echo 'Missing source-gate exit code'; exit 42; }
          exit "$code"
