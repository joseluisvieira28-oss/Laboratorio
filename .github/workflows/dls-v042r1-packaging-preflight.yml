name: DLS V0.4.2-R1 Packaging Preflight

on:
  push:
    branches:
      - dls-census-v042-transport-r1
    paths:
      - .github/workflows/dls-v042r1-packaging-preflight.yml

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile authority chain
        run: |
          python -m py_compile labs/DEFI_LIQUIDATION_SHOCK_001/source/run_sqd_event_census_partition_v0_4_2.py
          python -m py_compile labs/DEFI_LIQUIDATION_SHOCK_001/source/run_sqd_event_census_partition_transport_r1.py
          python -m py_compile labs/DEFI_LIQUIDATION_SHOCK_001/source/aggregate_sqd_event_census_v0_4_2.py
          python -m py_compile labs/DEFI_LIQUIDATION_SHOCK_001/source/reconcile_sqd_census_raw_sample_v0_4_2.py
          python -m py_compile labs/DEFI_LIQUIDATION_SHOCK_001/source/finalize_kamino_save11_event_census_v0_4_2.py
      - name: Firewall
        run: echo SOURCE_ONLY_TRUE
