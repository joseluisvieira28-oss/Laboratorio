name: source-t0-probe-v51b-secret-historical-direct-ip-fast
on:
  push:
    branches: [cosmos-native-emission-param-shock-001-v0.2-t0-remediation-2026-10-07]
    paths: [.github/workflows/source-t0-probe-v51b-secret-historical-direct-ip-fast.yml]
permissions: {contents: write}
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with: {ref: cosmos-native-emission-param-shock-001-v0.2-t0-remediation-2026-10-07}
      - name: Concurrent direct-IP probe
        run: |
          python3 - <<'PY'
          import json,urllib.request,urllib.error,ssl,hashlib,os,datetime
          from concurrent.futures import ThreadPoolExecutor
          OUT="research/cosmos_native_emission_param_shock_001_v0_2/SCRT287_DIRECT_IP_UPSTREAM_V51B.json"
          bases=["http://20.104.20.173:26657","https://20.104.20.173:26657"]
          hs=list(range(11880917,11880924))
          jobs=[]
          for b in bases:
            jobs.append((b+"/status",None))
            for h in hs:
              jobs.extend([(b+f"/block?height={h}",h),(b+f"/commit?height={h}",h),(b+f"/blockchain?minHeight={h}&maxHeight={h}",h)])
          def one(j):
            u,want=j
            try:
              q=urllib.request.Request(u,headers={"User-Agent":"CryptoLab-source-only-v51b"})
              with urllib.request.urlopen(q,timeout=5,context=ssl._create_unverified_context()) as r:
                bb=r.read();parsed=[]
                try:
                  d=json.loads(bb)
                  def walk(x):
                    if isinstance(x,dict):
                      yield x
                      for v in x.values():yield from walk(v)
                    elif isinstance(x,list):
                      for v in x:yield from walk(v)
                  for x in walk(d):
                    if "height" in x and "time" in x:
                      try:h=int(x["height"])
                      except:continue
                      if str(x["time"]).startswith("2023-"):
                        z={"height":h,"time":str(x["time"]),"hash":x.get("hash")}
                        if z not in parsed:parsed.append(z)
                except:pass
                return {"url":u,"wanted":want,"ok":True,"status":r.status,"sha256":hashlib.sha256(bb).hexdigest(),"parsed":parsed}
            except urllib.error.HTTPError as e:return {"url":u,"wanted":want,"ok":False,"status":e.code,"error":str(e),"parsed":[]}
            except Exception as e:return {"url":u,"wanted":want,"ok":False,"status":None,"error":repr(e),"parsed":[]}
          with ThreadPoolExecutor(max_workers=44) as ex:rows=list(ex.map(one,jobs))
          out={"scope":"SOURCE_ONLY_NO_MARKET_DATA","source_provenance":"Secret Mantlemint docs example RPC_ENDPOINTS=20.104.20.173:26657",
            "tested_utc":datetime.datetime.now(datetime.timezone.utc).isoformat(),"rows":rows,
            "useful":[x for x in rows if x["parsed"]]}
          os.makedirs(os.path.dirname(OUT),exist_ok=True);open(OUT,"w").write(json.dumps(out,indent=2))
          print("V51B",json.dumps({"useful":out["useful"],"statuses":sorted(set(str(x["status"]) for x in rows))}))
          PY
      - name: Persist
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/cosmos_native_emission_param_shock_001_v0_2/SCRT287_DIRECT_IP_UPSTREAM_V51B.json
          git commit -m "SCRT287: persist fast documented direct-IP probe v51b"
          git pull --rebase origin cosmos-native-emission-param-shock-001-v0.2-t0-remediation-2026-10-07
          git push origin HEAD:cosmos-native-emission-param-shock-001-v0.2-t0-remediation-2026-10-07
