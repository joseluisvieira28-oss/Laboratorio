name: licp-hist-xalt-003-discovery-v01

on:
  push:
    branches:
      - liquidation-cascade-propagation-v0.1
    paths:
      - 'research/liquidation_cascade/licp_hist_xalt_003_discovery_v01.py'
      - 'research/liquidation_cascade/LICP_HIST_XALT_003_PRE_OUTCOME_FREEZE_V0_1.md'
      - '.github/workflows/licp-hist-xalt-003-discovery-v01.yml'

permissions:
  contents: read

jobs:
  discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pandas pyarrow
      - run: python research/liquidation_cascade/licp_hist_xalt_003_discovery_v01.py
      - if: always()
        run: cat research/liquidation_cascade/receipts/licp_hist_xalt_003_discovery_v01.json || true
