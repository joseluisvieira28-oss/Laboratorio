name: CONVEX Kraken 16 Public Historical SOURCE-only Checks
on:
  push:
    branches:
      - research/convex-kraken-historical-source-gate-2026-10-17
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-source-only:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Synthetic schema and chronology checks
        run: python -m unittest discover -s research/convex_kraken_history_gate_v01 -p 'test_*.py' -v
      - name: Bounded 16 public metadata-only source checks, no market PnL
        run: python -m research.convex_kraken_history_gate_v01.source_gate --output-dir research/convex_kraken_history_gate_v01/receipts
      - name: Save only dates count hashes and statuses
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: KRAKEN-HISTORICAL-16-SOURCE-ONLY-RECEIPTS
          path: research/convex_kraken_history_gate_v01/receipts/**
          retention-days: 30
          if-no-files-found: warn
