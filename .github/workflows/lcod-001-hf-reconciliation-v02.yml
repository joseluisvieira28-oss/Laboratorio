name: LCOD-001 HF raw reconciliation V0.2
on:
  push:
    branches: [liquidation-convexity-oracle-distance-001-source-gate-v0.1]
    paths:
      - 'research/liquidation_convexity_oracle_distance_001/lcod_hf_reconciliation_v02.py'
      - '.github/workflows/lcod-001-hf-reconciliation-v02.yml'
      - 'research/liquidation_convexity_oracle_distance_001/LCOD_HF_RECON_V02_TRIGGER.txt'
permissions:
  contents: write
jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: {ref: liquidation-convexity-oracle-distance-001-source-gate-v0.1}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python research/liquidation_convexity_oracle_distance_001/lcod_hf_reconciliation_v02.py
      - name: Persist receipt
        run: |
          cp artifacts/lcod_hf_reconciliation_v02.json research/liquidation_convexity_oracle_distance_001/LCOD_HF_RECONCILIATION_V02_RECEIPT.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/liquidation_convexity_oracle_distance_001/LCOD_HF_RECONCILIATION_V02_RECEIPT.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "LCOD-001: record raw HF reconciliation V0.2 [skip ci]"
          git push origin HEAD:liquidation-convexity-oracle-distance-001-source-gate-v0.1
      - uses: actions/upload-artifact@v4
        with:
          name: lcod-001-hf-reconciliation-v02
          path: artifacts/lcod_hf_reconciliation_v02.json
          if-no-files-found: error
