name: SP500 Public BBO OffHours V0.3

on:
  push:
    branches:
      - mexc-sp500-public-bbo-v0.3-offhours-probe-2026-10-04
    paths:
      - 'research/mexc_global_assets/SP500_PUBLIC_BBO_OFFHOURS_FREEZE_V0.3.md'
      - 'research/mexc_global_assets/sp500_public_bbo_offhours_v03.py'
      - '.github/workflows/sp500-public-bbo-offhours-v03.yml'

permissions:
  contents: read

jobs:
  bbo-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependency
        run: python -m pip install --disable-pip-version-check requests
      - name: Governance preflight
        run: |
          test "$GITHUB_REF_NAME" = "mexc-sp500-public-bbo-v0.3-offhours-probe-2026-10-04"
          python -m py_compile research/mexc_global_assets/sp500_public_bbo_offhours_v03.py
          grep -q 'SUNDAY_OFF_HOURS_DIAGNOSTIC_ONLY' research/mexc_global_assets/SP500_PUBLIC_BBO_OFFHOURS_FREEZE_V0.3.md
          echo 'OFFHOURS_BBO_PRECHECK_PASS'
      - name: Collect 60 public BBO snapshots
        run: python research/mexc_global_assets/sp500_public_bbo_offhours_v03.py
      - name: Upload immutable BBO evidence
        uses: actions/upload-artifact@v4
        with:
          name: sp500-public-bbo-offhours-v03-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/mexc_global_assets/sp500_bbo_offhours_v03
          if-no-files-found: error
          retention-days: 90
      - name: Governance closeout
        run: |
          echo 'SUNDAY OFF-HOURS DIAGNOSTIC ONLY'
          echo 'PUBLIC DEPTH ONLY'
          echo 'NO ACCOUNT / PRIVATE ENDPOINT / ORDER / MUTATION'
          echo 'NO LIVE TRADING AUTHORIZATION'
