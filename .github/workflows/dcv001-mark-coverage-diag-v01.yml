name: DCV-001 Mark Coverage Diagnostic V0.1

on:
  push:
    branches:
      - dcv001-funding-oi-vol-interaction-v0.1
    paths:
      - research/dcv001/DCV001_MARK_COVERAGE_DIAG_V0.1.py
      - .github/workflows/dcv001-mark-coverage-diag-v01.yml

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile
        run: python -m py_compile research/dcv001/DCV001_MARK_COVERAGE_DIAG_V0.1.py
      - name: Run timestamp-only coverage diagnostic
        run: python research/dcv001/DCV001_MARK_COVERAGE_DIAG_V0.1.py
