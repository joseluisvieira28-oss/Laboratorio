name: BNB Diamond V0.2 Sidecar QA

on:
  push:
    branches:
      - bnb-diamond-v02-runtime-sidecar-2026-09-24
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          cd crypto_edge_radar
          python -m pip install -e .
      - name: Compile
        run: |
          cd crypto_edge_radar
          python -m compileall radar tests
      - name: BNB Diamond and parent regressions
        run: |
          cd crypto_edge_radar
          python -m unittest -v             tests.test_bnb_diamond_v02             tests.test_bnb_launchpool_watcher             tests.test_bnb_launchpool_market_binding             tests.test_diamond_board
      - name: Full deterministic Radar suite
        run: |
          cd crypto_edge_radar
          python -m unittest discover -s tests -v
      - name: Safety and frozen-rule guard
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path("crypto_edge_radar/radar/bnb_diamond_v02.py").read_text()
          for bad in ("create_order", "cancel_order", "api_key", "leverage="):
              assert bad not in p, bad
          parent=Path("crypto_edge_radar/radar/strategies/bnb_launchpool_demand.py").read_text()
          required=[
              'PAIR = "BNBBTC"',
              'INTERVAL = "15m"',
              'HOLD_MS = 24 * 60 * 60 * 1000',
              'BASE_COST_BPS = 20.0',
              'STRESS_COST_BPS = 30.0',
          ]
          for x in required:
              assert x in parent, x
          print("BNB_DIAMOND_V02_SIDECAR_GUARD_PASS")
          PY
