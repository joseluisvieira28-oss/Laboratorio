name: cvfb-native-oracle-p0e-execute-v01

on:
  workflow_dispatch:
    inputs:
      authorization_confirmation:
        description: 'Exact frozen P0E requester-pays authorization confirmation'
        required: true
        type: string

permissions:
  contents: read

jobs:
  bounded-requester-pays-source-probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fail closed unless immutable authorization amendment exists
        env:
          AUTH_CONFIRMATION: ${{ inputs.authorization_confirmation }}
        run: |
          test "$AUTH_CONFIRMATION" = 'I_EXPLICITLY_AUTHORIZE_CVFB_P0E_REQUESTER_PAYS'
          test -f research/cross_venue_funding_basis/CVFB_NATIVE_ORACLE_PROVENANCE_P0E_REQUESTER_PAYS_AUTHORIZATION_V0.1.json
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('research/cross_venue_funding_basis/CVFB_NATIVE_ORACLE_PROVENANCE_P0E_REQUESTER_PAYS_AUTHORIZATION_V0.1.json')
          x=json.loads(p.read_text(encoding='utf-8'))
          assert x['status']=='AUTHORIZED_BEFORE_FIRST_REQUESTER_PAYS_S3_REQUEST'
          assert x['freeze_git_blob_sha']=='3f4e3a43636ea9a17a1c9cbc60e25410bff6a6fe'
          assert x['requester_pays_charges_authorized'] is True
          assert x['aws_credentials_authorized'] is True
          assert x['execution_authorized'] is True
          assert x['economic_outcomes_authorized'] is False
          assert x['primary_replication_reopened'] is False
          assert x['2026_authorized'] is False
          print('P0E_IMMUTABLE_AUTHORIZATION_GUARD_PASS')
          PY

      - name: Install frozen P0E runtime
        run: python -m pip install --disable-pip-version-check -r research/cross_venue_funding_basis/requirements_p0e_v01.txt

      - name: Compile and re-run zero-S3 synthetic guards
        env:
          AWS_ACCESS_KEY_ID: ''
          AWS_SECRET_ACCESS_KEY: ''
          AWS_SESSION_TOKEN: ''
          CVFB_P0E_REQUESTER_PAYS_AUTHORIZED: ''
        run: |
          python -m py_compile research/cross_venue_funding_basis/cvfb_native_oracle_p0e_replica_cmds_v01.py
          python research/cross_venue_funding_basis/cvfb_native_oracle_p0e_synthetic_v01.py

      - name: Require dedicated AWS credentials without printing them
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.CVFB_P0E_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CVFB_P0E_AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ secrets.CVFB_P0E_AWS_SESSION_TOKEN }}
        run: |
          test -n "$AWS_ACCESS_KEY_ID"
          test -n "$AWS_SECRET_ACCESS_KEY"
          echo 'P0E_AWS_CREDENTIAL_PRESENCE_GUARD_PASS'

      - name: Execute exact frozen bounded requester-pays source probe
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.CVFB_P0E_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CVFB_P0E_AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ secrets.CVFB_P0E_AWS_SESSION_TOKEN }}
          CVFB_P0E_REQUESTER_PAYS_AUTHORIZED: 'YES'
          AUTH_CONFIRMATION: ${{ inputs.authorization_confirmation }}
        run: |
          mkdir -p out/cvfb_p0e
          python research/cross_venue_funding_basis/cvfb_native_oracle_p0e_replica_cmds_v01.py \
            --execute \
            --authorization-confirmation "$AUTH_CONFIRMATION" \
            --out out/cvfb_p0e/CVFB_NATIVE_ORACLE_PROVENANCE_P0E_RECEIPT_V0.1.json

      - name: Enforce source-only P0E receipt firewall
        run: |
          python - <<'PY'
          import json
          p='out/cvfb_p0e/CVFB_NATIVE_ORACLE_PROVENANCE_P0E_RECEIPT_V0.1.json'
          x=json.load(open(p,encoding='utf-8'))
          assert x['status']=='COMPLETE'
          assert x['decision'] in {'PASS_NATIVE_ORACLE_SCHEMA_CANDIDATE','FAIL_NO_NATIVE_ORACLE_SCHEMA_VISIBLE'}
          assert x['source']['block_count']==301
          assert x['source']['compressed_bytes']<=33554432
          assert x['market_numeric_values_emitted'] is False
          assert x['raw_object_bodies_emitted'] is False
          assert x['economic_outcomes_computed'] is False
          assert x['primary_replication_reopened'] is False
          assert x['2026_opened'] is False
          assert x['live_trading_authorized'] is False
          assert x['merge_to_main_authorized'] is False
          print('P0E_FINAL_SOURCE_ONLY_FIREWALL_PASS', x['decision'])
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: CVFB_NATIVE_ORACLE_PROVENANCE_P0E_V01
          path: out/cvfb_p0e/CVFB_NATIVE_ORACLE_PROVENANCE_P0E_RECEIPT_V0.1.json
          if-no-files-found: error
          retention-days: 90
