name: Hyperliquid XYZ NVDA Source V0.1
on:
  push:
    branches:
      - hyperliquid-xyz-nvda-v0.1-source-gate-2026-10-05
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check requests
      - run: |
          test -f research/hyperliquid_xyz_nvda/HYPERLIQUID_XYZ_NVDA_SOURCE_FREEZE_V0.1.md
          python -m py_compile research/hyperliquid_xyz_nvda/hyperliquid_xyz_nvda_source_v01.py
          echo HL_SOURCE_PRE_OUTCOME_FREEZE_PASS
      - run: python research/hyperliquid_xyz_nvda/hyperliquid_xyz_nvda_source_v01.py
      - uses: actions/upload-artifact@v4
        with:
          name: hl-xyz-nvda-source-v01-${{ github.run_id }}
          path: artifacts/hyperliquid_xyz_nvda/v01_source
          if-no-files-found: error
          retention-days: 90
