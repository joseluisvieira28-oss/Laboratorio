# Separate single v1.2 source qualification only, no economic outcomes.
name: Liquidation Exhaustion V1.2 — Bybit plus MEXC depth joint source
on:
  push:
    branches:
      - research/liquidation-exhaustion-economic-forward-v1-2026-11-04
    paths:
      - .github/workflows/liquidation-exhaustion-joint-depth-v12.yml
permissions:
  contents: read
jobs:
  one-source-window:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned public websocket library
        run: python -m pip install --disable-pip-version-check websockets==15.0.1
      - name: Fixed source-only synthetic guards
        run: python research/liquidation_exhaustion_economic_forward_v1/dual_venue_depth_v12.py --self-test
      - name: 240s prospective public Bybit + MEXC full-depth source
        run: python research/liquidation_exhaustion_economic_forward_v1/dual_venue_depth_v12.py
      - name: Keep both source receipt and raw frames whether fail or pass
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: liquidation-exhaustion-v12-dual-source-raw
          path: artifacts/liquidation_exhaustion_joint_depth_v12/
          if-no-files-found: warn
          retention-days: 30
