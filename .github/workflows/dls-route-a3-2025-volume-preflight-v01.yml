name: DLS Route A3 2025 Volume Preflight V0.1
on:
  push:
    branches: [dls-field-enrichment-v01]
    paths:
      - "labs/DEFI_LIQUIDATION_SHOCK_001/LAUNCH_ROUTE_A3_2025_VOLUME_PREFLIGHT_V01.marker"
permissions:
  contents: read
jobs:
  census:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HELIUS_API_KEY: ${{ secrets.HELIUS_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify authority
        run: |
          test -f labs/DEFI_LIQUIDATION_SHOCK_001/DLS_ROUTE_A3_2025_VOLUME_PREFLIGHT_FREEZE_V0.1.md
          python -m py_compile labs/DEFI_LIQUIDATION_SHOCK_001/source/run_route_a3_2025_volume_preflight_v0_1.py
      - name: Count source transport volume only
        run: python labs/DEFI_LIQUIDATION_SHOCK_001/source/run_route_a3_2025_volume_preflight_v0_1.py
      - name: Upload receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dls-route-a3-2025-volume-preflight-v01
          path: route_a3_volume/
          if-no-files-found: warn
          retention-days: 30
