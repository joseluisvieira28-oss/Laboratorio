name: Perp Crowding Unwind Cross-Asset Replication V0.1
on:
  push:
    branches: [perp-crowding-unwind-xasset-v0.1]
    paths:
      - "labs/PERP_CROWDING_UNWIND_XASSET_001/REPLICATION_PREFREEZE_V0.1.json"
      - "labs/PERP_CROWDING_UNWIND_XASSET_001/replication_v01.py"
      - ".github/workflows/perp-crowding-unwind-xasset-v01.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  replication:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install --disable-pip-version-check -q pandas numpy
      - run: python -m py_compile labs/PERP_CROWDING_UNWIND_XASSET_001/replication_v01.py
      - name: Run frozen SOL+BNB replication battery
        run: python labs/PERP_CROWDING_UNWIND_XASSET_001/replication_v01.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: PERP_CROWDING_UNWIND_XASSET_001_V0_1
          path: |
            xasset_replication_receipt_v01.json
            xasset_out/*.csv
          if-no-files-found: warn
          retention-days: 30
