name: OPTIONS V2.1 — Live Shadow Source Probe

on:
  push:
    branches:
      - options-spotperp-v21-live-shadow-v0.1
    paths:
      - 'crypto_edge_radar/radar/options_v21_live.py'
      - 'crypto_edge_radar/tests/test_options_v21_live.py'
      - 'crypto_edge_radar/radar/options_v21_watcher.py'
      - 'crypto_edge_radar/tests/test_options_v21_watcher.py'
      - 'crypto_edge_radar/radar/options_v21_metrics.py'
      - 'crypto_edge_radar/OPTIONS_SPOTPERP_001_V21_LIVE_SHADOW_FREEZE_V0.1.json'
      - '.github/workflows/options-v21-live-shadow-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-probe:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crypto_edge_radar
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install runtime
        run: python -m pip install -e .
      - name: Compile and targeted tests
        run: |
          python -m compileall radar tests
          python -m unittest tests.test_options_v21_live tests.test_options_v21_watcher -v
          python -m unittest discover -s tests -v
      - name: Capture strictly post-freeze Deribit schema receipt
        run: |
          mkdir -p options_v21_live_artifacts
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path
          from radar.options_v21_live import (
              FREEZE_MS,
              DeribitBTCOptionTradeFeed,
              source_schema_probe,
          )

          now_ms = int(datetime.now(timezone.utc).timestamp() * 1000)
          # Keep this schema probe small and strictly post-freeze.
          start_ms = max(FREEZE_MS, now_ms - 5 * 60 * 1000)
          receipt = source_schema_probe(
              DeribitBTCOptionTradeFeed(timeout=20),
              start_ms=start_ms,
              end_ms=now_ms,
          )
          Path('options_v21_live_artifacts/deribit_postfreeze_schema_receipt.json').write_text(
              json.dumps(receipt, sort_keys=True, indent=2), encoding='utf-8'
          )
          print(json.dumps(receipt, sort_keys=True))
          PY
      - name: Validate hard governance
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('options_v21_live_artifacts/deribit_postfreeze_schema_receipt.json').read_text())
          assert p['used_as_forward_evidence'] is False, p
          assert p['authenticated_api_used'] is False, p
          assert p['orders_created'] is False, p
          assert p['exchange_mutation_performed'] is False, p
          assert p['status'] in {'PASS_SOURCE_SCHEMA','PASS_SOURCE_EMPTY_WINDOW'}, p
          print(json.dumps({
              'status':p['status'],
              'trade_count':p['trade_count'],
              'provider':p['provider'],
              'used_as_forward_evidence':p['used_as_forward_evidence'],
          }, sort_keys=True))
          PY
      - name: Upload source probe receipt
        uses: actions/upload-artifact@v4
        with:
          name: options-v21-live-shadow-source-probe-${{ github.run_id }}
          path: crypto_edge_radar/options_v21_live_artifacts/
          if-no-files-found: error
          retention-days: 30
