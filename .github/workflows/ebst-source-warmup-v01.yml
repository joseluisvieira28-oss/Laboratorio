name: EBST source warmup v0.1
on:
  push:
    branches: [eth-blockspace-state-transition-v0.1]
    paths:
      - 'research/eth_blockspace_state_transition/source_warmup_v01.py'
      - '.github/workflows/ebst-source-warmup-v01.yml'
  workflow_dispatch:
  schedule:
    - cron: '35 0 * * *'
permissions:
  contents: read
jobs:
  source-warmup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Build source-only rolling state
        run: python research/eth_blockspace_state_transition/source_warmup_v01.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ebst-source-warmup-v01
          path: EBST_SOURCE_WARMUP_V0_1.json
