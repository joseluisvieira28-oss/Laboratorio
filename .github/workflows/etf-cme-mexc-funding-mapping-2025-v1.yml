name: ETF-CME MEXC FUNDING MAPPING 2025 V1

on:
  push:
    branches:
      - crypto-edge-radar-aggressive-v0.7-render
    paths:
      - 'crypto_edge_radar/radar/funding_mapping.py'
      - 'crypto_edge_radar/tests/test_funding_mapping.py'
      - '.github/workflows/etf-cme-mexc-funding-mapping-2025-v1.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  funding-mapping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install radar runtime
        run: cd crypto_edge_radar && python -m pip install -e .
      - name: Download immutable ETF-CME 2025 OOS artifact
        uses: actions/download-artifact@v4
        with:
          name: etf-cme-instflow-001-oos-2025-34815006815-1
          run-id: 34815006815
          github-token: ${{ github.token }}
          path: immutable_oos_2025
      - name: Verify frozen source artifact files
        run: |
          test -f immutable_oos_2025/oos_2025_observations.csv
          test -f immutable_oos_2025/oos_2025_closeout.json
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          for name in ['oos_2025_observations.csv','oos_2025_closeout.json']:
              p=Path('immutable_oos_2025')/name
              print(name, hashlib.sha256(p.read_bytes()).hexdigest())
          closeout=json.loads(Path('immutable_oos_2025/oos_2025_closeout.json').read_text())
          assert closeout['replication_id']=='ETF-CME-INSTFLOW-001-OOS-2025-V0.1', closeout
          assert closeout['evaluable_weeks']==50, closeout
          PY
      - name: Run public MEXC funding mapping diagnostic
        run: |
          mkdir -p artifacts/etf_cme_mexc_funding_mapping_2025_v1
          cd crypto_edge_radar
          python -m radar.funding_mapping \
            --events ../immutable_oos_2025/oos_2025_observations.csv \
            --output ../artifacts/etf_cme_mexc_funding_mapping_2025_v1/report.json
      - name: Validate governance and coverage
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('artifacts/etf_cme_mexc_funding_mapping_2025_v1/report.json').read_text())
          assert p['diagnostic_id']=='ETF-CME-INSTFLOW-001-MEXC-FUNDING-MAPPING-2025-V1', p
          assert p['event_count_total']==50, p
          assert p['directional_event_count']>=40, p
          assert p['market_outcome_columns_read'] is False, p
          assert p['scientific_signal_changed'] is False, p
          assert p['trade_selection_changed'] is False, p
          assert p['capital_enabled'] is False, p
          assert p['orders_created'] is False, p
          print(json.dumps({k:v for k,v in p.items() if k!='events'}, sort_keys=True, indent=2))
          PY
      - name: Upload immutable funding mapping receipt
        uses: actions/upload-artifact@v4
        with:
          name: etf-cme-mexc-funding-mapping-2025-v1-${{ github.run_id }}
          path: artifacts/etf_cme_mexc_funding_mapping_2025_v1/
          if-no-files-found: error
          retention-days: 90
