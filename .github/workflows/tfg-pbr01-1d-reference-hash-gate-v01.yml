name: TFG PBR01 1D MEXC Reference Hash Gate

on:
  push:
    branches:
      - tf-gap-pbr01-1d-v0.1
    paths:
      - '.github/workflows/tfg-pbr01-1d-reference-hash-gate-v01.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
        working-directory: Dream-Account-OS-v2.3-PARTIAL
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tf-gap-pbr01-1d-v0.1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Playwright
        run: |
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install --with-deps chromium
      - name: Verify frozen reference authority
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          a=json.loads(Path('research/timeframe_gap/TFG_PBR01_1D_001_ACTIVATION_V0.1.json').read_text())
          assert a['source_lock']['reference_file']=='BTC_USDT-Min15-2023-02-01.csv'
          assert a['source_lock']['reference_sha256']=='31eff305411e5e5589e53b22e47554c9b50208d372322b19422270bfe5766e25'
          assert not a['authorization_scope']['validation_2025']
          assert not a['authorization_scope']['holdout_2026']
          assert not a['authorization_scope']['exchange_mutation']
          print('REFERENCE_AUTHORITY=PASS')
          PY
      - name: Download exactly one official reference CSV and hash raw bytes only
        id: gate
        continue-on-error: true
        run: |
          mkdir -p research/local_data/tfg_pbr01_1d_reference_gate
          set +e
          python -m research.timeframe_gap.tfg_pbr01_1d_reference_hash_gate_v01 \
            --receipt research/local_data/tfg_pbr01_1d_reference_gate/TFG_PBR01_1D_REFERENCE_HASH_GATE_V0.1.json
          rc=$?
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tfg-pbr01-1d-reference-hash-gate
          path: Dream-Account-OS-v2.3-PARTIAL/research/local_data/tfg_pbr01_1d_reference_gate/TFG_PBR01_1D_REFERENCE_HASH_GATE_V0.1.json
          if-no-files-found: error
          retention-days: 14
      - name: Fail closed unless reference byte identity passes
        if: steps.gate.outputs.rc != '0'
        run: |
          echo 'Reference-file byte identity did not pass. No corpus/outcome authorization.'
          exit 1
