name: BTC10M Original 24 ZIP Timestamp Only Historical Source Forensics No Prices
on:
  push:
    branches:
      - audit/btc10m-2023-2024-original-24zip-timecoverage-source-only-2026-11-01
    paths:
      - .github/workflows/btc10m-24zip-timestamp-only-source-audit.yml
permissions:
  contents: read
  actions: read
jobs:
  no-prices-source-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: btc10m-behavioural-conditions-2023-selection-2024-oos-v01
          run-id: 41294978457
          github-token: ${{ github.token }}
          path: downloaded
      - name: Independent ZIP source SHA and timestamp column 0 coverage, all 24 fixed months, NO OPEN CLOSE OR OUTCOMES
        run: python -u research/btc10m_behavioural_v01/btc10m_original_zip_timestamp_forensics_v01.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: btc10m-original-24zip-timestamp-only-source-quality-audit
          path: artifacts/btc10m_24zip_original_timestamp_audit/
          if-no-files-found: warn
