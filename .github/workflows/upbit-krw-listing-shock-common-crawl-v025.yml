name: UKLS Common Crawl Index Probe V0.2.5
on:
  push:
    branches:
      - upbit-krw-listing-shock-source-recovery-v0.2
    paths:
      - 'Dream-Account-OS-v2.3-PARTIAL/research/upbit_krw_listing_shock_001/common_crawl_index_v025.py'
      - '.github/workflows/upbit-krw-listing-shock-common-crawl-v025.yml'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify authority
        run: |
          test -f Dream-Account-OS-v2.3-PARTIAL/research/upbit_krw_listing_shock_001/COMMON_CRAWL_INDEX_AUTHORITY_V0_2_5.md
          python -m py_compile Dream-Account-OS-v2.3-PARTIAL/research/upbit_krw_listing_shock_001/common_crawl_index_v025.py
      - name: Execute index-only scan
        run: python Dream-Account-OS-v2.3-PARTIAL/research/upbit_krw_listing_shock_001/common_crawl_index_v025.py
      - name: Enforce firewall
        run: |
          python - <<'PY'
          import json
          x=json.load(open('artifacts/UKLS_COMMON_CRAWL_INDEX_V0_2_5.json'))
          assert x['warc_payload_opened'] is False
          assert x['event_values_opened'] is False
          print('CLASSIFICATION',x['classification'])
          print('CRAWLS',x['selected_crawls'])
          print('AGGREGATE',x['aggregate'])
          print('QUERY_OK',sum(q['http_status']==200 for q in x['queries']),'OF',len(x['queries']))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: UKLS_COMMON_CRAWL_INDEX_V0_2_5
          path: artifacts/UKLS_COMMON_CRAWL_INDEX_V0_2_5.json
          retention-days: 90
