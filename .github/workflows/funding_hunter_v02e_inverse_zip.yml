name: FUNDING HUNTER V02E 2025 Original BTC USD Inverse ZIP Header
on:
  push:
    branches: [research/funding-hunter-v02-source-rescue-2026-10-19]
    paths: [.github/workflows/funding_hunter_v02e_inverse_zip.yml]
permissions:
  contents: read
jobs:
  metadata-and-one-original-zip-header:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Inspect ONLY original 2025 inverse funding ZIP header (no payout rows)
        run: python -m research.funding_hunter_v02.btc_usd_inverse_funding_zip_schema
      - uses: actions/upload-artifact@v4
        with:
          name: FUNDING-HUNTER-V02E-INVERSE-2025-HEADER-ONLY
          path: research/funding_hunter_v02/receipts/V02E_BTC_USD_INVERSE_FUNDING_ZIP_SCHEMA.json
          retention-days: 15
