name: POB BRTI Readonly Source Readiness V0.1

on:
  pull_request:
    branches: [main]
    paths:
      - 'research/prediction_oracle_basis/POB_BRTI_READONLY_SOURCE_ACCESS_AUTHORITY_V0.1.md'
      - 'research/prediction_oracle_basis/brti_readonly_source_access.py'
      - '.github/workflows/prediction_oracle_basis_brti_readiness.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  self-test-and-secret-presence:
    if: github.head_ref == 'prediction-oracle-basis-v0.1' || github.ref_name == 'prediction-oracle-basis-v0.1'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      KALSHI_API_KEY_ID: ${{ secrets.KALSHI_API_KEY_ID }}
      KALSHI_PRIVATE_KEY_PEM: ${{ secrets.KALSHI_PRIVATE_KEY_PEM }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run synthetic signing self-test only
        run: python research/prediction_oracle_basis/brti_readonly_source_access.py --self-test

      - name: Record secret-presence readiness without values
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          p=Path("artifacts/prediction_oracle_basis/brti_readonly_source")
          p.mkdir(parents=True,exist_ok=True)
          out={
            "schema":"POB_BRTI_CREDENTIAL_PRESENCE_V0.1",
            "kalshi_api_key_id_present": bool(os.environ.get("KALSHI_API_KEY_ID")),
            "kalshi_private_key_pem_present": bool(os.environ.get("KALSHI_PRIVATE_KEY_PEM")),
            "credential_values_persisted": False,
            "authenticated_request_made": False,
            "orders": False,
            "economic_outputs_computed": False,
          }
          (p/"credential_presence_receipt.json").write_text(json.dumps(out,indent=2,sort_keys=True))
          print(json.dumps(out,indent=2,sort_keys=True))
          PY

      - name: Verify no authenticated access occurred
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          a=json.loads(Path("artifacts/prediction_oracle_basis/brti_readonly_source/brti_source_access_receipt.json").read_text())
          p=json.loads(Path("artifacts/prediction_oracle_basis/brti_readonly_source/credential_presence_receipt.json").read_text())
          assert a["self_test"]["classification"]=="SELF_TEST_PASS"
          assert a["source_access"]["classification"]=="BRTI_REAL_ACCESS_NOT_ACTIVATED"
          assert a["source_access"]["network_request_made"] is False
          assert a["source_access"]["real_credentials_used"] is False
          assert p["credential_values_persisted"] is False
          assert p["authenticated_request_made"] is False
          print("BRTI_READINESS_FIREWALL_PASS")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: POB_BRTI_READINESS_V01
          path: |
            artifacts/prediction_oracle_basis/brti_readonly_source/brti_source_access_receipt.json
            artifacts/prediction_oracle_basis/brti_readonly_source/credential_presence_receipt.json
          if-no-files-found: error
