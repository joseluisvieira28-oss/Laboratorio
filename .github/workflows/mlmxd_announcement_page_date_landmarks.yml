name: MLMXD Announcement Page Date Landmarks
on:
  push:
    branches: [mexc-launchpool-mx-demand-v0.1-source-2026-10-07]
    paths:
      - 'research/mexc_launchpool_mx_demand/announcement_page_date_landmarks.py'
      - '.github/workflows/mlmxd_announcement_page_date_landmarks.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install ccxt
      - run: python research/mexc_launchpool_mx_demand/announcement_page_date_landmarks.py
