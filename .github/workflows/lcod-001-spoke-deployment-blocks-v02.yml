name: LCOD-001 Spoke deployment block pin V0.2
on:
  push:
    branches: [liquidation-convexity-oracle-distance-001-source-gate-v0.1]
    paths:
      - 'research/liquidation_convexity_oracle_distance_001/LCOD_BORROW_EVENT_TRANSPORT_REMEDIATION_V0.2.md'
      - 'research/liquidation_convexity_oracle_distance_001/lcod_spoke_deployment_blocks_v02.py'
      - '.github/workflows/lcod-001-spoke-deployment-blocks-v02.yml'
permissions:
  contents: write
jobs:
  pin:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {ref: liquidation-convexity-oracle-distance-001-source-gate-v0.1}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python research/liquidation_convexity_oracle_distance_001/lcod_spoke_deployment_blocks_v02.py
      - name: Persist receipt
        if: always()
        run: |
          if [ -f artifacts/lcod_spoke_deployment_blocks_v02.json ]; then
            cp artifacts/lcod_spoke_deployment_blocks_v02.json research/liquidation_convexity_oracle_distance_001/LCOD_SPOKE_DEPLOYMENT_BLOCKS_V02_RECEIPT.json
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add research/liquidation_convexity_oracle_distance_001/LCOD_SPOKE_DEPLOYMENT_BLOCKS_V02_RECEIPT.json
            if ! git diff --cached --quiet; then
              git commit -m "LCOD-001: record exact Spoke deployment blocks V0.2 [skip ci]"
              git pull --rebase origin liquidation-convexity-oracle-distance-001-source-gate-v0.1
              git push origin HEAD:liquidation-convexity-oracle-distance-001-source-gate-v0.1
            fi
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: lcod-spoke-deployment-blocks-v02
          path: artifacts/lcod_spoke_deployment_blocks_v02.json
          if-no-files-found: error
