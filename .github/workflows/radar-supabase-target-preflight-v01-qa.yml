name: Radar Supabase Target Preflight V0.1 QA

on:
  pull_request:
    branches:
      - crypto-edge-radar-postgres-v0.5
    paths:
      - "crypto_edge_radar/radar/target_connection_preflight.py"
      - "crypto_edge_radar/radar/forward_web.py"
      - "crypto_edge_radar/tests/test_target_connection_preflight.py"
      - "crypto_edge_radar/authorities/RADAR_SUPABASE_TARGET_CONNECTION_PREFLIGHT_V0.1_2026-09-27.md"
      - ".github/workflows/radar-supabase-target-preflight-v01-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          cd crypto_edge_radar
          python -m pip install -e .
      - name: Compile
        run: |
          cd crypto_edge_radar
          python -m compileall radar tests
      - name: Targeted target-preflight tests
        run: |
          cd crypto_edge_radar
          python -m unittest -v tests.test_target_connection_preflight
      - name: Full deterministic Radar suite
        run: |
          cd crypto_edge_radar
          python -m unittest discover -s tests -v
      - name: Secret and mutation firewall guard
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path("crypto_edge_radar/radar/target_connection_preflight.py").read_text()
          assert "RADAR_MIGRATION_TARGET_URL" in p
          assert "SET TRANSACTION READ ONLY" in p
          assert "TARGET_PREFLIGHT_PASS_AT_BACKUP_BOUNDARY" in p
          assert "database_url_switch_authorized" in p
          assert "secret_value_exposed" in p
          lower=p.lower()
          for forbidden in (
              "insert into",
              "update radar_",
              "delete from",
              "drop table",
              "alter table",
              "setval(",
              "create table",
          ):
              assert forbidden not in lower, forbidden
          print("RADAR_SUPABASE_TARGET_PREFLIGHT_V01_GUARD_PASS")
          PY
