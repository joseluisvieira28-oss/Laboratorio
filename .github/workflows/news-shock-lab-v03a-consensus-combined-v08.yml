name: News Shock Lab V0.3A Consensus Combined V0.8

# Tranche 08: remaining pre-holdout 2025 provenance-only expansion to 33/44 COMPLETE_A.
on:
  push:
    branches:
      - dream-account-phase-b-signal-research-v0.1
    paths:
      - 'Dream-Account-OS-v2.3-PARTIAL/research/NEWS_SHOCK_LAB_V03A_CONSENSUS_SEED_TRANCHE08_FREEZE_V0.1.json'
      - 'Dream-Account-OS-v2.3-PARTIAL/research/NEWS_SHOCK_LAB_V03A_CONSENSUS_SEED_TRANCHE08_V0.1.json'
      - 'Dream-Account-OS-v2.3-PARTIAL/research/news_shock_lab_v03a_consensus_combined_v08.py'
      - '.github/workflows/news-shock-lab-v03a-consensus-combined-v08.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  news-shock-v03a-consensus-combined-v08:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install parser dependency and compile
        run: |
          cd Dream-Account-OS-v2.3-PARTIAL
          python -m pip install beautifulsoup4
          python -m compileall -q research
      - name: Verify frozen authority chain
        run: |
          cd Dream-Account-OS-v2.3-PARTIAL
          python - <<'PY'
          from research.news_shock_lab_v03a_consensus_combined_v08 import load_authority
          *_, freeze8, seed8 = load_authority()
          assert freeze8['fingerprint'] == '43744f6953f734eab08733032f70964008f93bb3457ae01ba76c5958440dc9d2'
          assert seed8['fingerprint'] == '681bde65cf0c76b2b3de92820a8deced319fd8873d5905dd2e89e60945467ef8'
          assert freeze8['parent_combined_manifest_fingerprint'] == 'aaa6d864fb3ba71a9a407e47a1c3830b368469f5ff6c00df1380de7a5ca1d5d7'
          assert freeze8['parent_validation_fingerprint'] == 'a92e746a076a268d7473b449fe8fb5e4120ed734013368544c9b4855cda80246'
          assert freeze8['authority']['may_access_mexc_2025_09_through_2025_12'] is False
          assert freeze8['authority']['may_access_holdout_2026'] is False
          print('NEWS V03A COMBINED V08 AUTHORITY PASS')
          PY
      - name: Rebuild BLS actuals and validate thirty-three consensus events
        run: |
          cd Dream-Account-OS-v2.3-PARTIAL
          mkdir -p research/local_data/news_v03a_consensus_combined_v08_output
          set -o pipefail
          python -m research.news_shock_lab_v03a_consensus_combined_v08 \
            research/local_data/news_v03a_consensus_combined_v08_output \
            | tee research/local_data/news_v03a_consensus_combined_v08_output/combined_v08_stdout.txt
      - name: Assert 33 COMPLETE_A and all outcome guards closed
        run: |
          cd Dream-Account-OS-v2.3-PARTIAL
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('research/local_data/news_v03a_consensus_combined_v08_output')
          s = json.loads((root/'combined_v08_summary.json').read_text())
          expected_counts = {'COMPLETE_A': 33, 'CONSENSUS_PROVENANCE_INCOMPLETE': 11}
          if s['status_counts'] != expected_counts:
              raise SystemExit(f"NEWS V03A V08 STATUS COUNT DRIFT: {s['status_counts']}")
          if s.get('complete_b_count', 0) != 0:
              raise SystemExit('NEWS V03A V08 UNEXPECTED COMPLETE_B')
          if len(s['complete_a_event_ids']) != 33:
              raise SystemExit('NEWS V03A V08 COMPLETE_A COUNT DRIFT')
          new_ids = ('US_CPI_2025-01-15','US_CPI_2025-03-12','US_CPI_2025-05-13')
          for event_id in new_ids:
              if event_id not in s['complete_a_event_ids']:
                  raise SystemExit(f'NEWS V03A V08 NEW EVENT MISSING: {event_id}')
          for event_id in s['complete_a_event_ids']:
              if event_id.startswith('US_CPI_2025-09') or event_id.startswith('US_CPI_2025-10') or event_id.startswith('US_CPI_2025-11') or event_id.startswith('US_CPI_2025-12'):
                  raise SystemExit(f'NEWS V03A V08 LOCKED 2025 HOLDOUT LEAKED IN: {event_id}')
          for key, value in s['guards'].items():
              if value is not False:
                  raise SystemExit(f'NEWS V03A V08 OUTCOME GUARD DRIFT: {key}')
          print('NEWS V03A COMBINED V08 VALIDATION PASS', s['validation_fingerprint'])
          PY
      - name: Upload combined V0.8 provenance receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: news-shock-v03a-consensus-combined-v08-${{ github.sha }}
          path: |
            Dream-Account-OS-v2.3-PARTIAL/research/local_data/news_v03a_consensus_combined_v08_output/combined_v08_consensus_manifest.json
            Dream-Account-OS-v2.3-PARTIAL/research/local_data/news_v03a_consensus_combined_v08_output/combined_v08_validation_receipt.json
            Dream-Account-OS-v2.3-PARTIAL/research/local_data/news_v03a_consensus_combined_v08_output/combined_v08_summary.json
            Dream-Account-OS-v2.3-PARTIAL/research/local_data/news_v03a_consensus_combined_v08_output/combined_v08_stdout.txt
          if-no-files-found: warn
          retention-days: 30
