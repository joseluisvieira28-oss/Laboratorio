name: licp-hist-xalt-003-holdout-v01

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  holdout:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Fail closed — holdout already opened
        run: |
          if test -f research/liquidation_cascade/LICP_HIST_XALT_003_HOLDOUT_OPENED.lock; then
            echo "LICP-HIST-XALT-003 holdout is permanently closed after canonical run 36234052123."
            exit 42
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pandas pyarrow
      - name: Open locked holdout once
        run: python research/liquidation_cascade/licp_hist_xalt_003_holdout_v01.py
      - if: always()
        run: cat research/liquidation_cascade/receipts/licp_hist_xalt_003_holdout_v01.json || true
