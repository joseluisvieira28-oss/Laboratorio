name: AAVE Liquidation Overhang 001 — R1 V0.2A Failure Diagnostic

on:
  push:
    branches:
      - aave-liquidation-overhang-v0.1
    paths:
      - 'research/aave_liquidation_overhang/R1_V02A_FAILURE_DIAG_TRIGGER.txt'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download exact canonical V0.2A receipt
        uses: actions/download-artifact@v4
        with:
          name: AAVE_LIQUIDATION_OVERHANG_001_R1_SCALED_LEDGER_AUDIT_V0_2A
          path: downloaded_v02a
          github-token: ${{ github.token }}
          repository: joseluisvieira28-oss/Laboratorio
          run-id: '35375172202'
      - name: Summarize source/reconstruction failures only
        run: python research/aave_liquidation_overhang/r1_v02a_failure_diagnostic.py
      - name: Upload diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: AAVE_R1_V0_2A_FAILURE_DIAGNOSTIC
          path: r1_v02a_diag_output/AAVE_R1_V0_2A_FAILURE_DIAGNOSTIC.json
          retention-days: 30
