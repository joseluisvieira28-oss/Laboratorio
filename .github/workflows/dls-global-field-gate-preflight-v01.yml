name: DLS Global Field Gate Preflight V0.1

on:
  push:
    branches:
      - dls-field-enrichment-v01
    paths:
      - .github/workflows/dls-global-field-gate-preflight-v01.yml

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile field enrichment and unit tooling
        run: |
          python -m py_compile labs/DEFI_LIQUIDATION_SHOCK_001/source/run_marginfi_save0c_field_enrichment_partition_v0_1.py
          python -m py_compile labs/DEFI_LIQUIDATION_SHOCK_001/source/aggregate_marginfi_save0c_field_enrichment_v0_1.py
          python -m py_compile labs/DEFI_LIQUIDATION_SHOCK_001/source/run_kamino_save11_field_enrichment_partition_v0_1.py
          python -m py_compile labs/DEFI_LIQUIDATION_SHOCK_001/source/aggregate_kamino_save11_field_enrichment_v0_1.py
          python -m py_compile labs/DEFI_LIQUIDATION_SHOCK_001/source/run_drift_field_enrichment_partition_v0_1.py
          python -m py_compile labs/DEFI_LIQUIDATION_SHOCK_001/source/aggregate_drift_field_enrichment_v0_1.py
          python -m py_compile labs/DEFI_LIQUIDATION_SHOCK_001/source/build_drift_historical_market_unit_registry_v0_1.py
          python -m py_compile labs/DEFI_LIQUIDATION_SHOCK_001/source/adjudicate_drift_market_unit_registry_population_v0_1.py
          python -m py_compile labs/DEFI_LIQUIDATION_SHOCK_001/source/resolve_save0c_unit_metadata_partial_v0_2.py
          python -m py_compile labs/DEFI_LIQUIDATION_SHOCK_001/source/calibrate_marginfi_bank_metadata_dataslice_v0_1.py
          python -m py_compile labs/DEFI_LIQUIDATION_SHOCK_001/source/resolve_marginfi_bank_unit_partial_v0_2.py
          python -m py_compile labs/DEFI_LIQUIDATION_SHOCK_001/source/adjudicate_global_field_coverage_final_v0_1.py

      - name: Verify staged workflows exist
        run: |
          test -f .github/workflows/dls-drift-field-enrichment-finalize-v02.yml
          test -f .github/workflows/dls-save0c-unit-source-completion-v02.yml
          test -f .github/workflows/dls-marginfi-bank-unit-source-completion-v02.yml

      - name: Verify frozen gates exist
        run: |
          test -f labs/DEFI_LIQUIDATION_SHOCK_001/GLOBAL_FIELD_COVERAGE_FINAL_GATE_FREEZE_V0.1.md
          test -f labs/DEFI_LIQUIDATION_SHOCK_001/SAVE0C_UNIT_METADATA_SOURCE_COMPLETION_FREEZE_V0.2.md
          test -f labs/DEFI_LIQUIDATION_SHOCK_001/MARGINFI_BANK_UNIT_SOURCE_COMPLETION_FREEZE_V0.2.md
          test -f labs/DEFI_LIQUIDATION_SHOCK_001/DRIFT_MARKET_UNIT_REGISTRY_FREEZE_V0.1.md

      - name: Firewall
        run: echo SOURCE_ONLY_TRUE
