name: PMD-001 Chain-Exact Ceiling V073 Distributed

on:
  push:
    branches:
      - pumpfun-migration-direction-v0.1
    paths:
      - 'Dream-Account-OS-v2.3-PARTIAL/research/pumpfun_migration_direction_001/RUN_CHAIN_EXACT_CEILING_V073_DISTRIBUTED.trigger'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pumpfun-migration-direction-v0.1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install manifest dependencies
        run: python -m pip install --upgrade pip huggingface_hub duckdb pytz
      - name: Rebuild frozen 1,012-row manifest
        working-directory: Dream-Account-OS-v2.3-PARTIAL/research/pumpfun_migration_direction_001
        run: |
          python build_source_rebuild_manifest_v01.py \
            --data-dir "$GITHUB_WORKSPACE/pmd_v073_manifest_data" \
            --out "$GITHUB_WORKSPACE/pmd_source_rebuild_manifest_v01.jsonl" \
            --receipt "$GITHUB_WORKSPACE/pmd_source_rebuild_manifest_v01_receipt.json"
          test ! -e "$GITHUB_WORKSPACE/pmd_v073_manifest_data/postgard_outcomes.parquet"
      - name: Build deterministic 253-shard matrix
        id: matrix
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          include=[{'shard':i,'start':i*4,'limit':4} for i in range(253)]
          assert include[-1]['start']==1008
          assert include[-1]['start']+include[-1]['limit']==1012
          print('matrix='+json.dumps({'include':include},separators=(',',':')))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: PMD-001-v073-distributed-manifest
          retention-days: 30
          path: |
            pmd_source_rebuild_manifest_v01.jsonl
            pmd_source_rebuild_manifest_v01_receipt.json

  ceiling-shards:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pumpfun-migration-direction-v0.1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --upgrade pip requests solders huggingface_hub duckdb
      - uses: actions/download-artifact@v4
        with:
          name: PMD-001-v073-distributed-manifest
          path: ceiling-manifest
      - name: Syntax check block-first collector
        run: python -m py_compile Dream-Account-OS-v2.3-PARTIAL/research/pumpfun_migration_direction_001/chain_exact_ceiling_v073_blockfirst.py
      - name: Run V0.7.3 block-first ceiling shard
        working-directory: Dream-Account-OS-v2.3-PARTIAL/research/pumpfun_migration_direction_001
        run: |
          python chain_exact_ceiling_v073_blockfirst.py \
            --manifest "$GITHUB_WORKSPACE/ceiling-manifest/pmd_source_rebuild_manifest_v01.jsonl" \
            --out-dir "$GITHUB_WORKSPACE/pmd_v073_shard_${{ matrix.shard }}" \
            --start ${{ matrix.start }} \
            --limit ${{ matrix.limit }} \
            --rpc-url https://api.mainnet-beta.solana.com \
            --source-name solana_public_rpc_chain_exact_ceiling_v073_blockfirst \
            --pace-seconds 0.05
      - name: Assert shard source-only contract
        if: success()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('pmd_v073_shard_${{ matrix.shard }}')
          rows=[json.loads(x) for x in (root/'chain_exact_ceiling_details.jsonl').read_text().splitlines() if x.strip()]
          receipt=json.loads((root/'chain_exact_ceiling_shard_receipt.json').read_text())
          assert len(rows)==${{ matrix.limit }}
          assert all(r.get('outcomes_opened') is False and r.get('economic_outcomes_opened') is False for r in rows)
          assert all(r.get('stage')=='CHAIN_EXACT_CEILING_V073_BLOCKFIRST_SHARD' for r in rows)
          assert all(r.get('transport_version')=='V073_FINALIZED_BLOCK_FIRST' for r in rows)
          assert all(r.get('boundary_parser_version')=='V07_MIGRATE_AND_MIGRATE_V2' for r in rows)
          assert receipt.get('stage')=='CHAIN_EXACT_CEILING_V073_BLOCKFIRST_SHARD'
          assert receipt.get('transport_version')=='V073_FINALIZED_BLOCK_FIRST'
          assert receipt.get('boundary_parser_version')=='V07_MIGRATE_AND_MIGRATE_V2'
          assert receipt.get('economic_outcomes_opened') is False
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: PMD-001-chain-exact-ceiling-v073-shard-${{ matrix.shard }}
          retention-days: 30
          path: pmd_v073_shard_${{ matrix.shard }}/

  aggregate:
    needs: ceiling-shards
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pumpfun-migration-direction-v0.1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: PMD-001-chain-exact-ceiling-v073-shard-*
          path: ceiling-shards
          merge-multiple: false
      - name: Aggregate distributed V0.7.3 ceiling
        continue-on-error: true
        working-directory: Dream-Account-OS-v2.3-PARTIAL/research/pumpfun_migration_direction_001
        run: |
          python aggregate_chain_exact_ceiling_v073.py \
            --input-root "$GITHUB_WORKSPACE/ceiling-shards" \
            --out-dir "$GITHUB_WORKSPACE/pmd_v073_aggregate"
      - name: Print aggregate receipt
        if: always()
        run: cat pmd_v073_aggregate/chain_exact_ceiling_v073_receipt.json || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: PMD-001-chain-exact-ceiling-v073-aggregate
          retention-days: 30
          path: pmd_v073_aggregate/
