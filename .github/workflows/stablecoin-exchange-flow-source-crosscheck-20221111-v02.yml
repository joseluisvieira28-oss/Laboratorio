name: STABLECOIN-EXCHANGE-FLOW-001 Source Crosscheck 2022-11-11 V0.2

on:
  push:
    branches: [ stablecoin-exchange-flow-v0.1 ]
    paths:
      - 'labs/STABLECOIN_EXCHANGE_FLOW_001/source_crosscheck_20221111_v02.py'
      - '.github/workflows/stablecoin-exchange-flow-source-crosscheck-20221111-v02.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-crosscheck-v02:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: python -m py_compile labs/STABLECOIN_EXCHANGE_FLOW_001/source_crosscheck_20221111_v02.py
      - name: Execute protected parallel-range source crosscheck
        run: python labs/STABLECOIN_EXCHANGE_FLOW_001/source_crosscheck_20221111_v02.py
      - uses: actions/upload-artifact@v4
        with:
          name: stablecoin-exchange-flow-001-source-crosscheck-v02-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/stablecoin_exchange_flow_source_crosscheck_20221111_v02/
          retention-days: 90
