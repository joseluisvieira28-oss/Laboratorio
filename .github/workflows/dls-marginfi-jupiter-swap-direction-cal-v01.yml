name: DLS Marginfi Jupiter Swap Direction Calibration V0.1

on:
  push:
    branches:
      - dls-signed-flow-authority-v01
    paths:
      - labs/DEFI_LIQUIDATION_SHOCK_001/LAUNCH_MARGINFI_JUPITER_SWAP_DIRECTION_CAL_V01.marker

permissions:
  actions: read
  contents: read

jobs:
  calibrate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download Marginfi Jupiter membership PASS
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 36546170744
          name: dls-marginfi-jupiter-route-class-v02
          path: members
      - name: Download source-authoritative Marginfi bank registry
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 36312418451
          name: dls-marginfi-bank-unit-source-completion-v02
          path: bank_registry
      - name: Compile frozen calibration decoder
        run: python -m py_compile labs/DEFI_LIQUIDATION_SHOCK_001/source/calibrate_marginfi_jupiter_swap_direction_v0_1.py
      - name: Execute source-only calibration
        run: >
          python labs/DEFI_LIQUIDATION_SHOCK_001/source/calibrate_marginfi_jupiter_swap_direction_v0_1.py
          --members-root members
          --bank-registry-root bank_registry
      - name: Upload immutable calibration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dls-marginfi-jupiter-swap-direction-cal-v01
          path: |
            labs/DEFI_LIQUIDATION_SHOCK_001/MARGINFI_JUPITER_SWAP_DIRECTION_CALIBRATION_RECEIPT_V0.1.json
            labs/DEFI_LIQUIDATION_SHOCK_001/MARGINFI_JUPITER_SWAP_DIRECTION_CALIBRATION_ROWS_V0.1.ndjson
          if-no-files-found: warn
          retention-days: 90
      - name: Firewall
        if: always()
        run: echo SOURCE_ONLY_NO_PRICES_NO_RETURNS_2025_2026_CLOSED_NO_TRADING
