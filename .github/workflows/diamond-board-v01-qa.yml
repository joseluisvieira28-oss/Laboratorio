name: Diamond Board V0.1 QA

on:
  push:
    branches:
      - diamond-board-v0.1-2026-09-24
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile
        run: |
          cd crypto_edge_radar
          python -m compileall radar tests
      - name: Diamond board tests
        run: |
          cd crypto_edge_radar
          python -m unittest -v tests.test_diamond_board
      - name: Safety guard
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path("crypto_edge_radar/radar/diamond_board.py").read_text()
          forbidden=["urlopen(", "requests.", "create_order", "place_order", "cancel_order"]
          for x in forbidden:
              assert x not in p, x
          fw=Path("crypto_edge_radar/radar/forward_web.py").read_text()
          assert '"/api/diamond"' in fw
          assert 'state["diamond_board"] = build_diamond_board(state)' in fw
          print("DIAMOND_BOARD_READ_ONLY_GUARD_PASS")
          PY
