name: source-t0-probe-v10-secret-corrected-rpc

on:
  push:
    branches:
      - cosmos-native-emission-param-shock-001-v0.2-t0-remediation-2026-10-07
    paths:
      - .github/workflows/source-t0-probe-v10-secret-corrected-rpc.yml

permissions:
  contents: read

jobs:
  corrected-secret-rpc:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Exact-doc public RPC probes and binary search
        shell: bash
        run: |
          python3 - <<'PY'
          import json,urllib.request,ssl
          from datetime import datetime
          T="2023-12-07T02:54:58.930543213Z";TT=datetime.fromisoformat(T.replace("Z","+00:00")).timestamp()
          UA={"User-Agent":"CryptoLab-secret-rpc/1.0"}
          P=[
           "https://secretnetwork-rpc.highstakes.ch:26657",
           "https://secretnetwork-rpc.lavenderfive.com:443",
           "https://rpc-secret.whispernode.com:443",
           "https://rpc-secret.01node.com",
           "https://public.stakewolle.com/cosmos/secretnetwork/rpc",
           "https://scrt.public-rpc.com",
           "https://rpc.mainnet.secretsaturn.net",
          ]
          def get(u,to=8):
            try:
              q=urllib.request.Request(u,headers=UA)
              with urllib.request.urlopen(q,timeout=to,context=ssl._create_unverified_context()) as r:
                return {"ok":True,"status":r.status,"data":json.loads(r.read().decode()),"url":u}
            except Exception as e:return {"ok":False,"error":repr(e),"url":u}
          def block(p,h,to=8):
            x=get(p.rstrip("/")+f"/block?height={h}",to)
            try:
              hd=x["data"]["result"]["block"]["header"]
              return {"height":int(hd["height"]),"time":hd["time"],"hash":x["data"]["result"]["block_id"]["hash"]},x
            except:return None,x
          out={"scope":"SOURCE_ONLY_NO_MARKET_DATA","target":T,"providers":{}}
          for p in P:
            rec={}
            lo,hi=11752974,11920000
            a,ra=block(p,lo);b,rb=block(p,hi)
            rec["lo"]=a or ra;rec["hi"]=b or rb
            if a and b:
              ta=datetime.fromisoformat(a["time"].replace("Z","+00:00")).timestamp()
              tb=datetime.fromisoformat(b["time"].replace("Z","+00:00")).timestamp()
              rec["bracket_valid"]=ta<TT<=tb
              if rec["bracket_valid"]:
                L,R=lo,hi
                while L<R:
                  m=(L+R)//2;z,rz=block(p,m,10)
                  if not z:rec["binary_error"]={"height":m,"raw":rz};break
                  tz=datetime.fromisoformat(z["time"].replace("Z","+00:00")).timestamp()
                  if tz>=TT:R=m
                  else:L=m+1
                if "binary_error" not in rec:
                  H=L;rec["H"]=H;rec["neighbors"]={}
                  for h in range(H-3,H+4):
                    z,rz=block(p,h,10);rec["neighbors"][str(h)]=z or rz
                  rec["results"]={}
                  for h in (H-1,H,H+1,H+2):
                    rec["results"][str(h)]=get(p.rstrip("/")+f"/block_results?height={h}",10)
                  out["providers"][p]=rec;break
            out["providers"][p]=rec
          print("SECRET_CORRECTED_V10_BEGIN")
          print(json.dumps(out,indent=2,sort_keys=True)[:700000])
          print("SECRET_CORRECTED_V10_END")
          PY
