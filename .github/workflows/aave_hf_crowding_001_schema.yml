name: AAVE-HF-CROWDING-001 Read Schema Probe
on:
  push:
    branches: [aave-health-factor-crowding-v0.1]
    paths:
      - 'Dream-Account-OS-v2.3-PARTIAL/research/AAVE_HF_CROWDING_001_SCHEMA_TRIGGER.txt'
permissions:
  contents: write
jobs:
  schema:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {ref: aave-health-factor-crowding-v0.1}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python Dream-Account-OS-v2.3-PARTIAL/research/aave_hf_crowding_001_read_schema.py
      - run: |
          git config user.name "crypto-lab-bot"
          git config user.email "actions@users.noreply.github.com"
          git add Dream-Account-OS-v2.3-PARTIAL/runtime/aave_hf_crowding_001_schema_receipt.json
          git diff --cached --quiet && exit 0
          git commit -m "research: record AAVE-HF-CROWDING read schema"
          git push origin HEAD:aave-health-factor-crowding-v0.1
