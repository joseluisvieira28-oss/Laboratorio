name: DLS Kamino Save11 Event Census Source Feasibility V0.1

on:
  push:
    branches:
      - dls-kamino-save11-event-census-v0.1
    paths:
      - '.github/workflows/dls-kamino-save11-census-source-v01.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dls-kamino-save11-event-census-v0.1
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install footer-query tooling
        run: pip install --disable-pip-version-check --quiet duckdb pandas

      - name: Compile
        run: python -m py_compile labs/DEFI_LIQUIDATION_SHOCK_001/source/probe_solarchive_event_census_route_v0_1.py

      - name: Execute source-only coverage + footer schema probe
        run: python labs/DEFI_LIQUIDATION_SHOCK_001/source/probe_solarchive_event_census_route_v0_1.py | tee STDOUT.txt

      - name: Package evidence
        if: always()
        run: |
          python - <<'PY'
          import hashlib,json,pathlib
          paths=[
            pathlib.Path("labs/DEFI_LIQUIDATION_SHOCK_001/KAMINO_SAVE11_EVENT_CENSUS_SOURCE_FEASIBILITY_FREEZE_V0.1.md"),
            pathlib.Path("labs/DEFI_LIQUIDATION_SHOCK_001/KAMINO_SAVE11_SOLARCHIVE_FEASIBILITY_RECEIPT_V0.1.json"),
            pathlib.Path("STDOUT.txt")
          ]
          files=[]
          for p in paths:
              if p.exists():
                  files.append({"name":str(p),"bytes":p.stat().st_size,"sha256":hashlib.sha256(p.read_bytes()).hexdigest()})
          pathlib.Path("MANIFEST_SOLARCHIVE_V01.json").write_text(json.dumps({"files":files},indent=2)+"\n")
          PY

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dls-kamino-save11-solarchive-feasibility-v01
          path: |
            labs/DEFI_LIQUIDATION_SHOCK_001/KAMINO_SAVE11_SOLARCHIVE_FEASIBILITY_RECEIPT_V0.1.json
            labs/DEFI_LIQUIDATION_SHOCK_001/KAMINO_SAVE11_EVENT_CENSUS_SOURCE_FEASIBILITY_FREEZE_V0.1.md
            MANIFEST_SOLARCHIVE_V01.json
            STDOUT.txt
          if-no-files-found: warn
          retention-days: 30

      - name: Persist receipt
        if: always()
        run: |
          if [ -f labs/DEFI_LIQUIDATION_SHOCK_001/KAMINO_SAVE11_SOLARCHIVE_FEASIBILITY_RECEIPT_V0.1.json ]; then
            git config user.name "crypto-lab-source-audit"
            git config user.email "actions@users.noreply.github.com"
            git add labs/DEFI_LIQUIDATION_SHOCK_001/KAMINO_SAVE11_SOLARCHIVE_FEASIBILITY_RECEIPT_V0.1.json
            git commit -m "dls: persist Kamino Save11 SolArchive feasibility receipt v0.1" || true
            git push origin HEAD:dls-kamino-save11-event-census-v0.1
          fi

      - name: Firewall
        if: always()
        run: |
          echo SOURCE_ONLY_TRUE
          echo TRANSACTION_ROWS_READ_FALSE
          echo PARQUET_FOOTER_ONLY_TRUE
          echo PRICES_FALSE
          echo RETURNS_FALSE
          echo PNL_FALSE
          echo DIRECTION_FALSE
          echo ECONOMIC_OUTCOMES_FALSE
          echo LIVE_TRADING_FALSE
          echo MERGE_MAIN_FALSE
