name: BUILD MEXC TIER2 MICROLIVE V0.3

on:
  workflow_dispatch:
  push:
    branches:
      - mexc-tier2-microlive-v03-2026-09-25
    paths:
      - 'crypto_edge_radar/radar/mexc_tier2_*'
      - 'crypto_edge_radar/radar/mexc_spot.py'
      - 'crypto_edge_radar/radar/mexc_spot_auth.py'
      - 'crypto_edge_radar/scripts/mexc_tier2_*'
      - 'crypto_edge_radar/scripts/mexc_options_v21_*'
      - 'crypto_edge_radar/scripts/mexc_spot_preflight_v03.py'
      - 'crypto_edge_radar/tests/test_mexc_*'
      - 'crypto_edge_radar/windows/*V03.ps1'
      - 'crypto_edge_radar/windows/*V03.bat'
      - 'crypto_edge_radar/OPTIONS_SPOTPERP_001_V21_MICROLIVE_SHORT_AUTHORITY_TEMPLATE_V0.3.json'
      - 'crypto_edge_radar/OPTIONS_SPOTPERP_001_V21_MICROLIVE_LONG_SPOT_AUTHORITY_TEMPLATE_V0.3.json'
      - 'crypto_edge_radar/MEXC_TIER2_MICROLIVE_V03_OPERATOR_GUIDE.md'
      - '.github/workflows/build-mexc-tier2-microlive-v03.yml'

permissions:
  contents: read

jobs:
  test-build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: crypto_edge_radar
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install
        run: |
          python -m pip install -e .
          python -m pip install "pyinstaller>=6,<7"

      - name: Compile
        run: python -m compileall radar scripts tests

      - name: Run legacy MEXC safety suite
        run: python -m unittest discover -s tests -p "test_mexc_*.py" -v

      - name: Verify V0.3 template cannot authorize orders
        shell: pwsh
        run: |
          $a=Get-Content OPTIONS_SPOTPERP_001_V21_MICROLIVE_SHORT_AUTHORITY_TEMPLATE_V0.3.json | ConvertFrom-Json
          if ($a.status -ne "TEMPLATE_NOT_AUTHORITY") { throw "V0.3 template unexpectedly active" }
          if ($a.orders_authorized_by_this_template) { throw "V0.3 template authorizes orders" }
          if ($a.max_notional_usdt -ne 10) { throw "V0.3 max notional is not 10 USDT" }
          if ($a.daily_realized_loss_kill_usdt -ne 2) { throw "V0.3 daily kill is not 2 USDT" }
          if ($a.rolling_7d_realized_loss_kill_usdt -ne 5) { throw "V0.3 7d kill is not 5 USDT" }
          if ($a.leverage -ne 1) { throw "V0.3 leverage not exactly 1x" }
          if ($a.margin_mode -ne "ISOLATED") { throw "V0.3 margin not isolated" }
          if ($a.direction -ne "SHORT") { throw "V0.3 first lane must remain SHORT-only" }

      - name: Verify LONG Spot template cannot authorize orders
        shell: pwsh
        run: |
          $a=Get-Content OPTIONS_SPOTPERP_001_V21_MICROLIVE_LONG_SPOT_AUTHORITY_TEMPLATE_V0.3.json | ConvertFrom-Json
          if ($a.status -ne "TEMPLATE_NOT_AUTHORITY") { throw "LONG Spot template unexpectedly active" }
          if ($a.orders_authorized_by_this_template) { throw "LONG Spot template authorizes orders" }
          if ($a.max_quote_order_qty_usdt -ne 10) { throw "LONG Spot cap is not 10 USDT" }
          if ($a.leverage -ne 1) { throw "LONG Spot leverage is not 1x" }
          if ($a.margin_mode -ne "SPOT_UNLEVERED") { throw "LONG Spot margin mode invalid" }
          if ($a.direction -ne "LONG") { throw "LONG Spot direction invalid" }

      - name: Static mutation-surface check
        shell: pwsh
        run: |
          $src=Get-Content radar\mexc_auth_trade.py -Raw
          foreach ($forbidden in @(
            "/api/v1/private/account/transfer",
            "/api/v1/private/account/withdraw",
            "/api/v1/private/order/submit"
          )) {
            if ($src.Contains($forbidden)) { throw "forbidden/stale mutation endpoint present: $forbidden" }
          }
          foreach ($required in @(
            "/api/v1/private/order/create",
            "/api/v1/private/order/cancel_with_external",
            "/api/v1/private/position/change_leverage",
            "/api/v1/private/position/change_auto_add_im"
          )) {
            if (-not $src.Contains($required)) { throw "required endpoint missing: $required" }
          }

      - name: Prove old 0.1 percent budget is absent from V0.3 gate/executor
        shell: pwsh
        run: |
          $gate=Get-Content radar\mexc_tier2_live_gate.py -Raw
          $exe=Get-Content scripts\mexc_tier2_live_executor.py -Raw
          if ($gate.Contains("0.001")) { throw "old 0.1% budget leaked into V0.3 gate" }
          if ($exe.Contains("0.001")) { throw "old 0.1% budget leaked into V0.3 executor" }
          if (-not $gate.Contains("10.0")) { throw "10 USDT cap missing from gate" }

      - name: Prove Spot transport has no transfer or withdrawal surface
        shell: pwsh
        run: |
          $src=Get-Content radar\mexc_spot_auth.py -Raw
          foreach ($forbidden in @("/api/v3/capital/transfer","/api/v3/capital/withdraw","/api/v3/sub-account/transfer")) {
            if ($src.Contains($forbidden)) { throw "forbidden Spot money-movement endpoint present: $forbidden" }
          }
          if (-not $src.Contains("/api/v3/order")) { throw "Spot order endpoint missing" }
          if (-not $src.Contains("/api/v3/order/test")) { throw "Spot test-order endpoint missing" }

      - name: Verify safe stop and crash-idempotent exits
        shell: pwsh
        run: |
          $stop=Get-Content windows\STOP_MEXC_OPTIONS_24X7_V03.ps1 -Raw
          if (-not $stop.Contains("KILL_SWITCH")) { throw "safe stop does not create kill switch" }
          if ($stop.Contains("Stop-Process")) { throw "safe stop must not kill exit guards" }
          $installer=Get-Content windows\INSTALL_MEXC_OPTIONS_24X7_V03.ps1 -Raw
          if (-not $installer.Contains("KILL_SWITCH is active")) { throw "live installer does not refuse active kill switch" }
          $spotExit=Get-Content scripts\mexc_tier2_spot_exit_guard.py -Raw
          if (-not $spotExit.Contains("NO_BLIND_RESUBMIT")) { throw "Spot exit lacks reconcile-before-resubmit guard" }
          if (-not $spotExit.Contains("NO_BLIND_RETRY")) { throw "Spot exit lacks unknown-ack guard" }
          $futuresExit=Get-Content scripts\mexc_tier2_exit_guard.py -Raw
          if (-not $futuresExit.Contains("NO_BLIND_RESUBMIT")) { throw "Futures exit lacks reconcile-before-resubmit guard" }
          if (-not $futuresExit.Contains("NO_BLIND_RETRY")) { throw "Futures exit lacks unknown-ack guard" }
          $watch=Get-Content windows\RUN_MEXC_OPTIONS_24X7_V03.ps1 -Raw
          if (-not $watch.Contains("powershell.exe")) { throw "watchdog child process isolation missing" }

      - name: PowerShell syntax
        shell: pwsh
        run: |
          foreach ($s in Get-ChildItem windows\*V03.ps1) {
            $errors=$null
            [void][System.Management.Automation.Language.Parser]::ParseFile($s.FullName,[ref]$null,[ref]$errors)
            if ($errors.Count -gt 0) { $errors | Format-List; throw "PowerShell syntax failure: $($s.Name)" }
          }

      - name: Build authenticated preflight
        run: pyinstaller --clean --onefile --name MEXCAuthenticatedPreflight --paths . scripts/mexc_authenticated_preflight.py

      - name: Build unattended Tier2 Futures preflight
        run: pyinstaller --clean --onefile --name MEXCTier2FuturesPreflight --paths . scripts/mexc_tier2_futures_preflight_v03.py

      - name: Build OPTIONS V2.1 signal bridge
        run: pyinstaller --clean --onefile --name MEXCOptionsV21SignalBridge --paths . scripts/mexc_options_v21_signal_bridge_v03.py

      - name: Build OPTIONS V2.1 authority builder
        run: pyinstaller --clean --onefile --name MEXCOptionsAuthorityBuilder --paths . scripts/mexc_options_v21_authority_builder_v03.py

      - name: Build Tier2 risk state
        run: pyinstaller --clean --onefile --name MEXCTier2RiskState --paths . scripts/mexc_tier2_risk_state.py

      - name: Build Tier2 live executor
        run: pyinstaller --clean --onefile --name MEXCTier2LiveExecutor --paths . scripts/mexc_tier2_live_executor.py

      - name: Build Tier2 exit guard
        run: pyinstaller --clean --onefile --name MEXCTier2ExitGuard --paths . scripts/mexc_tier2_exit_guard.py

      - name: Build Spot preflight
        run: pyinstaller --clean --onefile --name MEXCSpotPreflight --paths . scripts/mexc_spot_preflight_v03.py

      - name: Build Tier2 Spot risk state
        run: pyinstaller --clean --onefile --name MEXCTier2SpotRiskState --paths . scripts/mexc_tier2_spot_risk_state.py

      - name: Build Tier2 Spot executor
        run: pyinstaller --clean --onefile --name MEXCTier2SpotExecutor --paths . scripts/mexc_tier2_spot_executor.py

      - name: Build Tier2 Spot exit guard
        run: pyinstaller --clean --onefile --name MEXCTier2SpotExitGuard --paths . scripts/mexc_tier2_spot_exit_guard.py

      - name: Hash binaries
        shell: pwsh
        run: |
          foreach ($exe in @(
            "MEXCAuthenticatedPreflight.exe",
            "MEXCTier2FuturesPreflight.exe",
            "MEXCOptionsV21SignalBridge.exe",
            "MEXCOptionsAuthorityBuilder.exe",
            "MEXCTier2RiskState.exe",
            "MEXCTier2LiveExecutor.exe",
            "MEXCTier2ExitGuard.exe",
            "MEXCSpotPreflight.exe",
            "MEXCTier2SpotRiskState.exe",
            "MEXCTier2SpotExecutor.exe",
            "MEXCTier2SpotExitGuard.exe"
          )) {
            $hash=(Get-FileHash (Join-Path "dist" $exe) -Algorithm SHA256).Hash.ToLower()
            "$exe sha256=$hash" | Tee-Object -FilePath (Join-Path "dist" ($exe+".sha256.txt"))
          }

      - name: Assemble Windows pre-live bundle
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path bundle\dist | Out-Null
          New-Item -ItemType Directory -Force -Path bundle\windows | Out-Null
          Copy-Item dist\MEXCAuthenticatedPreflight.exe bundle\dist\
          Copy-Item dist\MEXCTier2FuturesPreflight.exe bundle\dist\
          Copy-Item dist\MEXCOptionsV21SignalBridge.exe bundle\dist\
          Copy-Item dist\MEXCOptionsAuthorityBuilder.exe bundle\dist\
          Copy-Item dist\MEXCTier2RiskState.exe bundle\dist\
          Copy-Item dist\MEXCTier2LiveExecutor.exe bundle\dist\
          Copy-Item dist\MEXCTier2ExitGuard.exe bundle\dist\
          Copy-Item dist\MEXCSpotPreflight.exe bundle\dist\
          Copy-Item dist\MEXCTier2SpotRiskState.exe bundle\dist\
          Copy-Item dist\MEXCTier2SpotExecutor.exe bundle\dist\
          Copy-Item dist\MEXCTier2SpotExitGuard.exe bundle\dist\
          Copy-Item dist\*.sha256.txt bundle\dist\
          Copy-Item windows\Set_MEXC_Preflight_Secrets.ps1 bundle\windows\
          Copy-Item windows\Set_MEXC_Tier2_Secrets_V03.ps1 bundle\windows\
          Copy-Item windows\Run_MEXC_Tier2_Ready_Check_V03.ps1 bundle\windows\
          Copy-Item windows\Run_MEXC_OPTIONS_Auto_Cycle_V03.ps1 bundle\windows\
          Copy-Item windows\Recover_MEXC_OPTIONS_Exits_V03.ps1 bundle\windows\
          Copy-Item windows\RUN_MEXC_OPTIONS_24X7_V03.ps1 bundle\windows\
          Copy-Item windows\INSTALL_MEXC_OPTIONS_24X7_V03.ps1 bundle\windows\
          Copy-Item windows\STOP_MEXC_OPTIONS_24X7_V03.ps1 bundle\windows\
          Copy-Item windows\01_SETUP_MEXC_V03.bat bundle\windows\
          Copy-Item windows\02_READY_CHECK_MEXC_V03.bat bundle\windows\
          Copy-Item windows\03_ACTIVATE_OPTIONS_LIVE_24X7_V03.bat bundle\windows\
          Copy-Item windows\04_STOP_OPTIONS_LIVE_V03.bat bundle\windows\
          Copy-Item windows\05_CLEAR_KILL_SWITCH_V03.bat bundle\windows\
          Copy-Item OPTIONS_SPOTPERP_001_V21_MICROLIVE_SHORT_AUTHORITY_TEMPLATE_V0.3.json bundle\
          Copy-Item OPTIONS_SPOTPERP_001_V21_MICROLIVE_LONG_SPOT_AUTHORITY_TEMPLATE_V0.3.json bundle\
          Copy-Item MEXC_TIER2_MICROLIVE_V03_OPERATOR_GUIDE.md bundle\

      - name: Upload V0.3 bundle
        uses: actions/upload-artifact@v4
        with:
          name: mexc-tier2-microlive-v03-prelive
          path: crypto_edge_radar/bundle/**
          retention-days: 14
          if-no-files-found: error
