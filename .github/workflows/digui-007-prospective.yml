name: DIGUI-007 Prospective Read-Only Solana
on:
  pull_request:
    paths:
      - "research/digui007/**"
      - ".github/workflows/digui-007-prospective.yml"
  workflow_dispatch:
  # Scheduled on default branch only, NOT active while in draft PR
  schedule:
    - cron: "17 */2 * * *"
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Unit tests
        run: python -m unittest discover -s research/digui007 -p 'test_*.py' -v
      - name: Prospective capture (NO ORDERS)
        env:
          DIGUI007_MAX_ENRICH: "4"
          DIGUI007_OUTPUT_DIR: "digui007-evidence"
        run: python research/digui007/collector.py
      - name: Store timestamped evidence, including API failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: digui007-observation-${{ github.run_id }}
          path: digui007-evidence/
          retention-days: 90
          if-no-files-found: warn
