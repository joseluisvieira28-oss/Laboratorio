name: Cross-Venue Funding Basis Provenance Regime V0.4.2

on:
  push:
    branches:
      - dream-account-phase-b-signal-research-v0.1
    paths:
      - 'Dream-Account-OS-v2.3-PARTIAL/research/CROSS_VENUE_FUNDING_BASIS_PROVENANCE_REGIME_DIAGNOSTIC_V042.json'
      - 'Dream-Account-OS-v2.3-PARTIAL/research/cross_venue_funding_basis_provenance_regime_v042.py'
      - 'Dream-Account-OS-v2.3-PARTIAL/tests/test_cross_venue_funding_basis_provenance_regime_v042.py'
      - '.github/workflows/cross-venue-funding-basis-provenance-regime-v042.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  provenance-regime-v042:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run V0.4.2 offline governance tests
        run: |
          cd Dream-Account-OS-v2.3-PARTIAL
          python -m pip install pytest
          python -m pytest -q tests/test_cross_venue_funding_basis_provenance_regime_v042.py

      - name: Compile V0.4.2 provenance diagnostic
        run: |
          cd Dream-Account-OS-v2.3-PARTIAL
          python -m py_compile research/cross_venue_funding_basis_provenance_regime_v042.py tests/test_cross_venue_funding_basis_provenance_regime_v042.py

      - name: Verify V0.4.2 authority remains outcome blind
        run: |
          cd Dream-Account-OS-v2.3-PARTIAL
          python - <<'PY'
          import json
          from pathlib import Path
          a = json.loads(Path('research/CROSS_VENUE_FUNDING_BASIS_PROVENANCE_REGIME_DIAGNOSTIC_V042.json').read_text())
          assert a['status'] == 'AUTHORIZED_PROVENANCE_REGIME_AND_MISSING_SLOT_DIAGNOSTIC_ONLY'
          assert a['trigger']['economic_outcomes_observed'] is False
          assert a['historical_regime_reconstruction_rule']['economic_values_forbidden'] is True
          assert a['g04_missingness_rule']['interpolation_forbidden'] is True
          assert a['g10_preoutcome_interpretation']['outcome_dependent_period_selection'] is False
          for key, value in a['scientific_boundary'].items():
              assert value is False, key
          print('PASS: V0.4.2 authority is provenance-only')
          PY

      - name: Static guard against economic analysis or mutation
        run: |
          cd Dream-Account-OS-v2.3-PARTIAL
          python - <<'PY'
          import ast
          from pathlib import Path
          p = Path('research/cross_venue_funding_basis_provenance_regime_v042.py')
          tree = ast.parse(p.read_text())
          forbidden = {'mean','median','stdev','variance','corr','correlation','sharpe','sortino','profit_factor','win_rate','expectancy'}
          hits = []
          for node in ast.walk(tree):
              if isinstance(node, ast.Name) and node.id.lower() in forbidden:
                  hits.append((node.id, node.lineno))
              if isinstance(node, ast.Attribute) and node.attr.lower() in {'put','patch','delete'}:
                  hits.append((node.attr, node.lineno))
          if hits:
              raise SystemExit(f'forbidden economic/mutation primitives: {hits}')
          text = p.read_text().lower()
          for marker in ('carry_computed = false','apr_apy_computed = false','pnl_computed = false','signals_computed = false'):
              assert marker in text, marker
          print('PASS: static outcome/mutation guard')
          PY

      - name: Run outcome-blind regime and missing-slot diagnostic
        env:
          PREFREEZE_PROVENANCE_V042_RECEIPT: CROSS_VENUE_FUNDING_BASIS_PROVENANCE_REGIME_V042_RECEIPT.json
        run: |
          cd Dream-Account-OS-v2.3-PARTIAL
          python research/cross_venue_funding_basis_provenance_regime_v042.py

      - name: Assert G03 G04 and deterministic G10 candidate
        run: |
          cd Dream-Account-OS-v2.3-PARTIAL
          python - <<'PY'
          import json
          from pathlib import Path
          r = json.loads(Path('CROSS_VENUE_FUNDING_BASIS_PROVENANCE_REGIME_V042_RECEIPT.json').read_text())
          assert r['status'] == 'PASS'
          assert r['g03_funding_regimes_status'] == 'PASS'
          assert r['g04_raw_provenance_status'] == 'PASS_WITH_EXPLICIT_MONTH_EXCLUSION'
          assert r['binance_historical_interval_metadata']['BTCUSDT']['observed_values_hours'] == [8]
          assert r['binance_historical_interval_metadata']['ETHUSDT']['observed_values_hours'] == [8]
          assert r['common_eligible_month_count'] == 27
          assert r['provenance_excluded_months'] == ['2024-08']
          assert r['g10_materialization_candidate']['definition'] == 'ALL_COMMON_FULL_UTC_MONTHS_PASSING_G03_G04'
          assert r['g10_materialization_candidate']['outcome_based_selection_used'] is False
          for key in ('locked_2026_accessed','mexc_accessed','authenticated_account_data_used','exchange_mutation_used',
                      'funding_rate_values_summarized','economic_fields_summarized','carry_computed','apr_apy_computed',
                      'pnl_computed','signals_computed','discovery_authorized','trading_authorized'):
              assert r[key] is False, key
          print('G03=' + r['g03_funding_regimes_status'])
          print('G04=' + r['g04_raw_provenance_status'])
          print('EXCLUDED=' + ','.join(r['provenance_excluded_months']))
          print('COMMON_MONTHS=' + str(r['common_eligible_month_count']))
          print('PASS: V0.4.2 provenance boundary')
          PY

      - name: Upload V0.4.2 provenance receipt
        uses: actions/upload-artifact@v4
        with:
          name: cross-venue-funding-basis-provenance-regime-v042-receipt
          path: Dream-Account-OS-v2.3-PARTIAL/CROSS_VENUE_FUNDING_BASIS_PROVENANCE_REGIME_V042_RECEIPT.json
          if-no-files-found: error
          retention-days: 30
