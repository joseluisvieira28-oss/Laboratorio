name: CONVEX V05C Offline Local-Archive Reader Synthetic Tests Only
on:
  push:
    branches:
      - research/convex-okx-l2-custody-and-sweep-v05-2026-10-19
    paths:
      - .github/workflows/convex-v05c-offline-user-archive-reader-tests.yml
permissions:
  contents: read
jobs:
  local-file-offline-source-contracts:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Hermetic pure-library historical L2 tests
        run: python -m unittest discover -s research/convex_okx_l2_v05 -p 'test_v05.py' -v
      - name: No-network personal source filename, tar archive and future quote tests
        run: python -m unittest discover -s research/convex_okx_l2_v05 -p 'test_local_importer.py' -v
