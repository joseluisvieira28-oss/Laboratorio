name: reactive-shock-scalp-005-discovery-v01

on:
  push:
    branches:
      - microstructure-scalping-lab-v0.1
    paths:
      - 'research/microstructure_scalping/REACTIVE_SHOCK_SCALP_005_FREEZE_V0_1.md'
      - 'research/microstructure_scalping/reactive_shock_scalp_005_v01.py'
      - '.github/workflows/reactive-shock-scalp-005-discovery-v01.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reactive-shock-005:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install beautifulsoup4
      - name: Run frozen reactive shock Discovery MVE
        run: python -m research.microstructure_scalping.reactive_shock_scalp_005_v01
      - name: Print receipt
        if: always()
        run: cat research/microstructure_scalping/receipts/reactive_shock_scalp_005_v01.json || true
