name: PMD-001 Pre-Outcome Source Rebuild Gate

on:
  push:
    branches:
      - pumpfun-migration-direction-v0.1
    paths:
      - '.github/workflows/pmd-source-rebuild-preoutcome.yml'
      - 'Dream-Account-OS-v2.3-PARTIAL/research/pumpfun_migration_direction_001/build_source_rebuild_manifest_v01.py'
      - 'Dream-Account-OS-v2.3-PARTIAL/research/pumpfun_migration_direction_001/source_rebuild_helius_v01.py'
      - 'Dream-Account-OS-v2.3-PARTIAL/research/pumpfun_migration_direction_001/source_rebuild_coverage_gate_v01.py'
      - 'Dream-Account-OS-v2.3-PARTIAL/research/pumpfun_migration_direction_001/SOURCE_REBUILD_AUTHORITY_V01.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-source-manifest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout scientific branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install source-gate dependencies
        run: python -m pip install --upgrade pip duckdb huggingface_hub requests solders pytz

      - name: Syntax-check source rebuild scripts
        run: |
          python -m py_compile \
            Dream-Account-OS-v2.3-PARTIAL/research/pumpfun_migration_direction_001/build_source_rebuild_manifest_v01.py \
            Dream-Account-OS-v2.3-PARTIAL/research/pumpfun_migration_direction_001/source_rebuild_helius_v01.py \
            Dream-Account-OS-v2.3-PARTIAL/research/pumpfun_migration_direction_001/source_rebuild_coverage_gate_v01.py

      - name: Build frozen outcome-blind 1,012-candidate manifest
        working-directory: Dream-Account-OS-v2.3-PARTIAL/research/pumpfun_migration_direction_001
        run: |
          python build_source_rebuild_manifest_v01.py \
            --data-dir pmd_source_rebuild_manifest_data \
            --out pmd_source_rebuild_manifest_v01.jsonl \
            --receipt pmd_source_rebuild_manifest_v01_receipt.json

      - name: Assert no forbidden outcome file was materialized
        working-directory: Dream-Account-OS-v2.3-PARTIAL/research/pumpfun_migration_direction_001
        run: |
          test ! -e pmd_source_rebuild_manifest_data/postgard_outcomes.parquet
          python - <<'PY'
          import json
          r=json.load(open('pmd_source_rebuild_manifest_v01_receipt.json'))
          assert r['outcomes_opened'] is False
          assert r['post_price_values_projected'] is False
          assert r['postgard_outcomes_opened'] is False
          assert r['pass'] is True
          assert r['rows'] == 1012
          assert r['distinct_dates'] == 20
          print('PMD-001 PUBLIC SOURCE MANIFEST GATE PASS')
          PY

      - name: Upload pre-outcome manifest evidence
        uses: actions/upload-artifact@v4
        with:
          name: PMD-001-source-rebuild-manifest-v01
          if-no-files-found: error
          retention-days: 30
          path: |
            Dream-Account-OS-v2.3-PARTIAL/research/pumpfun_migration_direction_001/pmd_source_rebuild_manifest_v01.jsonl
            Dream-Account-OS-v2.3-PARTIAL/research/pumpfun_migration_direction_001/pmd_source_rebuild_manifest_v01_receipt.json
