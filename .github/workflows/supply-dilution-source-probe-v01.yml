name: SUPPLY-DILUTION-001 Source Probe V0.1
on:
  push:
    branches: [supply-dilution-v0.1]
    paths:
      - '.github/supply-dilution-source-probe.trigger'
jobs:
  source-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout frozen branch
        uses: actions/checkout@v4
      - name: Verify outcome-blind probe
        run: |
          test "${GITHUB_REF_NAME}" = "supply-dilution-v0.1"
          python3 -m py_compile Dream-Account-OS-v2.3-PARTIAL/research/supply_dilution_v0_1/source_probe_v01.py
          echo 'SOURCE PROBE ONLY / NO SIGNAL / NO RETURNS / NO PNL / 2025 LOCKED / 2026 LOCKED'
      - name: Probe historical source access
        working-directory: Dream-Account-OS-v2.3-PARTIAL/research/supply_dilution_v0_1
        run: python3 source_probe_v01.py
      - name: Validate firewall
        working-directory: Dream-Account-OS-v2.3-PARTIAL/research/supply_dilution_v0_1
        run: |
          python3 - <<'PY'
          import json
          x=json.load(open('source_probe_output/SUPPLY_DILUTION_001_SOURCE_PROBE_V01.json'))
          assert x['signal_computed'] is False
          assert x['returns_computed'] is False
          assert x['pnl_computed'] is False
          assert x['holdout_2025_accessed'] is False
          assert x['year_2026_accessed'] is False
          print('SOURCE_PROBE_FIREWALL_PASS',x['classification'])
          PY
      - name: Upload immutable source probe
        uses: actions/upload-artifact@v4
        with:
          name: supply-dilution-001-source-probe-${{ github.run_id }}-${{ github.run_attempt }}
          path: Dream-Account-OS-v2.3-PARTIAL/research/supply_dilution_v0_1/source_probe_output/SUPPLY_DILUTION_001_SOURCE_PROBE_V01.json
          if-no-files-found: error
