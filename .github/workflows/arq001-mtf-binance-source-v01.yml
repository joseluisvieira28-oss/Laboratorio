name: ARQ-001-MTF Binance 1H Source V0.1

on:
  push:
    branches:
      - arq001-mtf-dominance-v0.1
    paths:
      - research/arq001_mtf/ARQ001_MTF_BINANCE_1H_SOURCE_V0.1.py
      - .github/workflows/arq001-mtf-binance-source-v01.yml

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile
        run: python -m py_compile research/arq001_mtf/ARQ001_MTF_BINANCE_1H_SOURCE_V0.1.py
      - name: Download and verify official Binance 1H corpus
        id: source
        continue-on-error: true
        run: python research/arq001_mtf/ARQ001_MTF_BINANCE_1H_SOURCE_V0.1.py
      - name: Upload census
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arq001-mtf-binance-source-census
          path: arq001_mtf_binance_1h_source_census.json
          if-no-files-found: error
          retention-days: 30
      - name: Upload normalized corpus
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arq001-mtf-binance-1h-normalized
          path: arq001_mtf_binance_1h_2023_12_2024.csv.gz
          if-no-files-found: error
          retention-days: 30
      - name: Enforce source pass
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("arq001_mtf_binance_1h_source_census.json")
          if not p.exists(): raise SystemExit("FAIL_CLOSED: missing census")
          r=json.loads(p.read_text())
          if r.get("classification")!="SOURCE_CENSUS_PASS":
              raise SystemExit("FAIL_CLOSED: source census")
          if r.get("protected_2025_accessed") is not False or r.get("protected_2026_accessed") is not False:
              raise SystemExit("FAIL_CLOSED: protected period")
          if r.get("strategy_outcomes_opened") is not False or r.get("pnl_computed") is not False:
              raise SystemExit("FAIL_CLOSED: outcome firewall")
          print("SOURCE_CENSUS_PASS")
          PY
