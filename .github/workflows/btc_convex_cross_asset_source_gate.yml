name: BTC-CONVEX-001 cross-asset source gate

on:
  pull_request:
    paths:
      - 'labs/btc-convex-trend-capture-001/CROSS_ASSET_SOURCE_GATE_TRIGGER_V005.txt'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: btc-convex-cross-asset-source-gate-v005-observable-1
  cancel-in-progress: false

jobs:
  source-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify official Binance price/funding/mark coverage only
        run: python labs/btc-convex-trend-capture-001/cross_asset_source_gate_v0_1.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: BTC-CONVEX-001-CROSS-ASSET-SOURCE-GATE-V005
          path: labs/btc-convex-trend-capture-001/evidence/CROSS_ASSET_SOURCE_GATE_V0.1D.json
