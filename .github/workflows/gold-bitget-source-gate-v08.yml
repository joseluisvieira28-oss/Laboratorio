name: GOLD Bitget MEXC Source Gate V0.8

on:
  push:
    branches:
      - mexc-gold-bitget-crossvenue-v0.8-source-gate-2026-10-04
    paths:
      - 'research/mexc_global_assets/GOLD_BITGET_SOURCE_GATE_V0.8.md'
      - 'research/mexc_global_assets/gold_bitget_source_probe_v08.py'
      - '.github/workflows/gold-bitget-source-gate-v08.yml'

permissions:
  contents: read

jobs:
  source-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependency
        run: python -m pip install --disable-pip-version-check requests
      - name: Governance preflight
        run: |
          test "$GITHUB_REF_NAME" = "mexc-gold-bitget-crossvenue-v0.8-source-gate-2026-10-04"
          python -m py_compile research/mexc_global_assets/gold_bitget_source_probe_v08.py
          grep -q 'SOURCE-ONLY' research/mexc_global_assets/GOLD_BITGET_SOURCE_GATE_V0.8.md
          grep -q 'Historical outcomes remain CLOSED' research/mexc_global_assets/GOLD_BITGET_SOURCE_GATE_V0.8.md
          echo 'GOLD_SOURCE_GATE_PREOUTCOME_PASS'
      - name: Execute public GOLD source gate
        run: python research/mexc_global_assets/gold_bitget_source_probe_v08.py
      - name: Upload immutable source evidence
        uses: actions/upload-artifact@v4
        with:
          name: gold-bitget-source-gate-v08-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/mexc_global_assets/gold_bitget_source_gate_v08
          if-no-files-found: error
          retention-days: 90
      - name: Governance closeout
        run: |
          echo 'SOURCE ONLY'
          echo 'NO HISTORICAL OUTCOMES / NO LEAD-LAG SCORING'
          echo 'NO ACCOUNT / WALLET / PRIVATE ENDPOINT'
          echo 'NO ORDERS / NO MUTATION / NO LIVE TRADING'
