name: CROSS-VENUE-DIAMOND-REPLICATION-002 AVAX20 OKX Raw Pilot

on:
  pull_request:
    branches: [ ced-1d-v3-byte-recovery-2026-09-17 ]
    paths:
      - "governance/CROSS_VENUE_DIAMOND_REPLICATION_002_OKX_JAN2025_RAW_ACQUISITION_FREEZE_2026-09-18.md"
      - "Dream-Account-OS-v2.3-PARTIAL/research/cross_venue_diamond_replication_002/**"
      - ".github/workflows/cross-venue-diamond-replication-002-avax20-source-probe.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  okx-raw-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Compile frozen raw acquisition
        run: python -m py_compile Dream-Account-OS-v2.3-PARTIAL/research/cross_venue_diamond_replication_002/okx_jan2025_raw_acquisition_v01.py
      - name: Execute frozen Jan-2025 raw acquisition
        run: python Dream-Account-OS-v2.3-PARTIAL/research/cross_venue_diamond_replication_002/okx_jan2025_raw_acquisition_v01.py
      - name: Upload raw source pilot and receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cross-venue-diamond-replication-002-okx-jan2025-raw-v01
          path: Dream-Account-OS-v2.3-PARTIAL/research/local_data/cross_venue_diamond_replication_002_okx_raw_pilot/
          if-no-files-found: error
