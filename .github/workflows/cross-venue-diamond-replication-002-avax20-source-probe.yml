name: CROSS-VENUE-DIAMOND-REPLICATION-002 AVAX20 Source Coverage

on:
  pull_request:
    branches: [ ced-1d-v3-byte-recovery-2026-09-17 ]
    paths:
      - "governance/CROSS_VENUE_DIAMOND_REPLICATION_002_AVAX20_FREEZE_2026-09-18.md"
      - "governance/CROSS_VENUE_DIAMOND_REPLICATION_002_OKX_HISTORICAL_SOURCE_BINDING_V0.1.md"
      - "Dream-Account-OS-v2.3-PARTIAL/research/cross_venue_diamond_replication_002/**"
      - ".github/workflows/cross-venue-diamond-replication-002-avax20-source-probe.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Compile source probe
        run: python -m py_compile Dream-Account-OS-v2.3-PARTIAL/research/cross_venue_diamond_replication_002/okx_historical_archive_metadata_gate_v01.py
      - name: Execute outcome-blind OKX historical archive metadata gate
        run: python Dream-Account-OS-v2.3-PARTIAL/research/cross_venue_diamond_replication_002/okx_historical_archive_metadata_gate_v01.py
      - name: Upload metadata-only receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cross-venue-diamond-replication-002-okx-archive-metadata-v01
          path: Dream-Account-OS-v2.3-PARTIAL/research/local_data/cross_venue_diamond_replication_002_okx_archive_metadata_v01/
          if-no-files-found: error
