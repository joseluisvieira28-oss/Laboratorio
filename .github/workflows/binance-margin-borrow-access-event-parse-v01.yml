name: Binance Margin Borrow Access 001 — Event Parse V0.1

on:
  push:
    branches:
      - binance-margin-borrow-access-v0.1
    paths:
      - research/binance_margin_borrow_access/event_parser_v01.py
      - research/binance_margin_borrow_access/BINANCE_MARGIN_BORROW_ACCESS_001_EVENT_PARSER_PROTOCOL_V0_1.md
      - .github/workflows/binance-margin-borrow-access-event-parse-v01.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  parse:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - name: Checkout frozen research branch
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install source dependencies
        run: pip install --disable-pip-version-check requests beautifulsoup4
      - name: Compile frozen parser
        run: python -m py_compile research/binance_margin_borrow_access/event_parser_v01.py
      - name: Parse frozen event shard
        run: >-
          python research/binance_margin_borrow_access/event_parser_v01.py shard
          --input research/binance_margin_borrow_access/BINANCE_MARGIN_BORROW_ACCESS_001_EVENT_SOURCE_SCHEMA_INPUT_V0_1.json
          --shard ${{ matrix.shard }}
          --out event_parse_shard_${{ matrix.shard }}
      - name: Upload event parse shard
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BINANCE_MARGIN_BORROW_ACCESS_001_EVENT_PARSE_V0_1_SHARD_${{ matrix.shard }}
          path: event_parse_shard_${{ matrix.shard }}/event_parse_shard_${{ matrix.shard }}.json
          if-no-files-found: warn
          retention-days: 30

  aggregate:
    runs-on: ubuntu-latest
    needs: parse
    if: always()
    steps:
      - name: Checkout frozen research branch
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download all event parse shards
        uses: actions/download-artifact@v4
        with:
          pattern: BINANCE_MARGIN_BORROW_ACCESS_001_EVENT_PARSE_V0_1_SHARD_*
          path: event_parse_shards
      - name: Aggregate canonical event parse
        run: >-
          python research/binance_margin_borrow_access/event_parser_v01.py aggregate
          --input research/binance_margin_borrow_access/BINANCE_MARGIN_BORROW_ACCESS_001_EVENT_SOURCE_SCHEMA_INPUT_V0_1.json
          --shards event_parse_shards
          --out event_parse_canonical
      - name: Upload canonical event parse receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BINANCE_MARGIN_BORROW_ACCESS_001_EVENT_PARSE_V0_1
          path: event_parse_canonical/BINANCE_MARGIN_BORROW_ACCESS_001_EVENT_PARSE_RECEIPT_V0_1.json
          if-no-files-found: warn
          retention-days: 30
