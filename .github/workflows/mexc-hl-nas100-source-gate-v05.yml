name: MEXC HL NAS100 Source Gate V0.5

on:
  push:
    branches:
      - mexc-hl-nas100-crossvenue-v0.5-source-gate-2026-10-04
    paths:
      - 'research/mexc_global_assets/MEXC_HL_NAS100_SOURCE_GATE_V0.5.md'
      - 'research/mexc_global_assets/mexc_hl_nas100_source_probe_v05.py'
      - '.github/workflows/mexc-hl-nas100-source-gate-v05.yml'

permissions:
  contents: read

jobs:
  source-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependency
        run: python -m pip install --disable-pip-version-check requests

      - name: Governance preflight
        run: |
          test "$GITHUB_REF_NAME" = "mexc-hl-nas100-crossvenue-v0.5-source-gate-2026-10-04"
          python -m py_compile research/mexc_global_assets/mexc_hl_nas100_source_probe_v05.py
          grep -q 'SOURCE-ONLY' research/mexc_global_assets/MEXC_HL_NAS100_SOURCE_GATE_V0.5.md
          grep -q 'OUTCOMES CLOSED' research/mexc_global_assets/MEXC_HL_NAS100_SOURCE_GATE_V0.5.md
          echo 'NAS100_SOURCE_GATE_PREOUTCOME_PASS'

      - name: Execute public NAS100 source binding
        run: python research/mexc_global_assets/mexc_hl_nas100_source_probe_v05.py

      - name: Upload immutable source evidence
        uses: actions/upload-artifact@v4
        with:
          name: mexc-hl-nas100-source-gate-v05-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/mexc_global_assets/hl_nas100_source_gate_v05
          if-no-files-found: error
          retention-days: 90

      - name: Governance closeout
        run: |
          echo 'SOURCE ONLY'
          echo 'NO HISTORICAL OUTCOMES / NO LEAD-LAG SCORING'
          echo 'NO ACCOUNT / WALLET / PRIVATE ENDPOINT'
          echo 'NO ORDERS / NO MUTATION / NO LIVE TRADING'
