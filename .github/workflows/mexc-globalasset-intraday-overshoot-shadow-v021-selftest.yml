name: MEXC Overshoot Shadow V0.2.1 Self-Test

on:
  push:
    branches:
      - mexc-globalasset-intraday-overshoot-shadow-v0.2.1-remediation-2026-10-05
    paths:
      - 'research/mexc_global_assets/mexc_globalasset_intraday_overshoot_shadow_v021.py'
      - 'research/mexc_global_assets/mexc_globalasset_intraday_overshoot_shadow_aggregate_v021.py'
      - 'research/mexc_global_assets/MEXC_GLOBALASSET_INTRADAY_OVERSHOOT_SHADOW_AMENDMENT_V0.2.1.md'
      - '.github/workflows/mexc-globalasset-intraday-overshoot-shadow-v021-selftest.yml'

permissions:
  contents: read

jobs:
  selftest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - name: Compile
        run: |
          python -m py_compile research/mexc_global_assets/mexc_globalasset_intraday_overshoot_shadow_v021.py
          python -m py_compile research/mexc_global_assets/mexc_globalasset_intraday_overshoot_shadow_aggregate_v021.py
      - name: Synthetic same-contract fill invariant
        run: |
          python - <<'PY'
          import importlib.util
          p='research/mexc_global_assets/mexc_globalasset_intraday_overshoot_shadow_v021.py'
          s=importlib.util.spec_from_file_location('shadow',p)
          m=importlib.util.module_from_spec(s); s.loader.exec_module(m)
          book={'asks':[(100.0,1000.0),(101.0,1000.0)],'bids':[(99.0,1000.0),(98.0,1000.0)]}
          meta={'contract_size':0.01,'vol_unit':1.0,'min_vol':1.0,'max_vol':100000.0}
          e=m.entry_fill(book,'BUY',25.0,meta)
          assert e['fillable'] and e['contracts'] >= 1
          x=m.fill_contracts(book,'SELL',e['contracts'],meta['contract_size'])
          assert x['fillable']
          assert abs(x['contracts']-e['contracts']) < 1e-12
          print({'entry_contracts':e['contracts'],'exit_contracts':x['contracts'],'same_contracts':True})
          PY
      - name: Empty prospective sample is underpowered
        run: |
          mkdir -p /tmp/empty-shadow
          python research/mexc_global_assets/mexc_globalasset_intraday_overshoot_shadow_aggregate_v021.py             --root /tmp/empty-shadow --out /tmp/aggregate.json
          grep -q '"overall_verdict": "EXECUTION_SHADOW_UNDERPOWERED"' /tmp/aggregate.json
      - name: Binance public endpoint route probe
        run: |
          python - <<'PY'
          import requests
          hosts=['fapi.binance.com','fapi1.binance.com','fapi2.binance.com','fapi3.binance.com','fapi4.binance.com']
          out=[]
          for h in hosts:
              try:
                  r=requests.get(f'https://{h}/fapi/v1/klines',params={'symbol':'MSTRUSDT','interval':'1m','limit':2},timeout=10)
                  out.append((h,r.status_code,len(r.content),r.text[:120]))
              except Exception as e:
                  out.append((h,'ERR',0,str(e)))
          print(out)
          if not any(x[1]==200 for x in out):
              raise SystemExit('NO_BINANCE_PUBLIC_FUTURES_ROUTE_FROM_RUNNER')
          PY
      - name: Public source-only 35/35 preflight
        run: |
          python - <<'PY'
          import importlib.util
          from concurrent.futures import ThreadPoolExecutor, as_completed
          from datetime import datetime, timezone, timedelta
          p='research/mexc_global_assets/mexc_globalasset_intraday_overshoot_shadow_v021.py'
          s=importlib.util.spec_from_file_location('shadow',p)
          m=importlib.util.module_from_spec(s); s.loader.exec_module(m)
          meta,detail_ev=m.contract_meta()
          expected={c['target'] for c in m.B['candidates']}
          missing=sorted(expected-set(meta))
          if missing:
              raise SystemExit('METADATA_MISSING:'+','.join(missing))
          dt=datetime.now(timezone.utc).replace(second=0,microsecond=0)-timedelta(minutes=2)
          def probe(c):
              mc,_=m.parse_mexc_closes(c['target'],dt)
              bc,_=m.parse_binance_closes(c['external_binance'],dt)
              gc,_=m.parse_bitget_closes(c['external_bitget'],dt)
              bk=m.depth(c['target'])
              if len(mc)<2 or len(bc)<2 or len(gc)<2 or not bk['bids'] or not bk['asks']:
                  raise RuntimeError('INCOMPLETE_PUBLIC_SOURCE')
              return c['target']
          passed=[]
          failures=[]
          with ThreadPoolExecutor(max_workers=12) as pool:
              fs={pool.submit(probe,c):c for c in m.B['candidates']}
              for f in as_completed(fs):
                  c=fs[f]
                  try: passed.append(f.result())
                  except Exception as e: failures.append((c['target'],str(e)))
          print({'metadata_pass':len(meta & {}) if False else len(expected),'public_source_pass':len(passed),'failures':failures})
          if failures or len(passed)!=35:
              raise SystemExit('PUBLIC_SOURCE_PREFLIGHT_FAIL')
          PY
