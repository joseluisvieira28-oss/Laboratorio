name: Crypto shadow operator tests and Windows package
on:
  pull_request:
    paths:
      - 'tools/crypto_shadow/**'
      - 'Dream-Account-OS-v2.3-PARTIAL/src/dream_account/reliability.py'
      - '.github/workflows/crypto-shadow-windows.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tools/crypto_shadow -p test_shadow.py -v
      - name: Existing transport regression
        working-directory: Dream-Account-OS-v2.3-PARTIAL
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -p test_v22.py -v
      - name: Build Windows portable folder
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python -m pip install pyinstaller==6.20.0
          python -m PyInstaller --noconfirm --onedir --name CryptoShadow --paths Dream-Account-OS-v2.3-PARTIAL/src --paths tools/crypto_shadow --add-data "tools/crypto_shadow/shadow.py;." --add-data "tools/crypto_shadow/existing_signals.py;." --add-data "tools/crypto_shadow/existing_custody_gate.py;." tools/crypto_shadow/shadow.py
          Copy-Item tools/crypto_shadow/*.cmd dist/
          Copy-Item tools/crypto_shadow/README_PT.md dist/
          Get-FileHash dist/CryptoShadow/CryptoShadow.exe -Algorithm SHA256 | Format-List | Out-File dist/SHA256_EXE.txt
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: CryptoShadow-Windows
          path: dist/
          retention-days: 14
