name: Binance Listing V2.0 2025 Holdout ONE SHOT
on:
  push:
    branches: [binance-listing-cascade-v2-lbank-2025-prereg-2026-10-05]
    paths:
      - 'research/binance_listing_information_cascade/run_v20_2025_holdout_once.py'
permissions: {contents: read}
jobs:
  holdout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python research/binance_listing_information_cascade/run_v20_2025_holdout_once.py
