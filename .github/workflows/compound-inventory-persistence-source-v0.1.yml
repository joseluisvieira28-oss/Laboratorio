name: Compound Inventory Persistence Source V0.1

on:
  push:
    branches:
      - pressure-mining-program-v0.1
    paths:
      - "pressure_mining_v0_1/compound_inventory_persistence_source.py"
      - "pressure_mining_v0_1/labs/COMPOUND_INVENTORY_PERSISTENCE_001_SOURCE_MECHANISM_FREEZE_V0.1.md"
      - ".github/workflows/compound-inventory-persistence-source-v0.1.yml"
  pull_request:
    branches:
      - main
    paths:
      - "pressure_mining_v0_1/compound_inventory_persistence_source.py"
      - "pressure_mining_v0_1/labs/COMPOUND_INVENTORY_PERSISTENCE_001_SOURCE_MECHANISM_FREEZE_V0.1.md"
      - ".github/workflows/compound-inventory-persistence-source-v0.1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile
        run: python -m py_compile pressure_mining_v0_1/compound_inventory_persistence_source.py
      - name: Run source-only archive coverage
        run: python pressure_mining_v0_1/compound_inventory_persistence_source.py
      - name: Verify
        run: test -s pressure_mining_v0_1/receipts/COMPOUND_INVENTORY_PERSISTENCE_SOURCE_COVERAGE_V0.1.json
      - uses: actions/upload-artifact@v4
        with:
          name: compound-inventory-persistence-source-v01
          path: pressure_mining_v0_1/receipts/COMPOUND_INVENTORY_PERSISTENCE_SOURCE_COVERAGE_V0.1.json
          if-no-files-found: error
