name: MVE SIMPLE4H 01 — 2025 Source Preflight
on:
  push:
    branches: [simple4h-recovery-v0.2]
    paths:
      - '.github/workflows/mve-simple4h-01-source-preflight.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas
      - name: Freeze structure preflight
        run: python mve_simple4h_01_preflight.py --source-root "$RUNNER_TEMP/mve_simple4h_2025" --structure-only
      - name: Download exactly authorized 2025 Binance USD-M Futures 1m archives
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/mve_simple4h_2025"
          for S in BTCUSDT ETHUSDT SOLUSDT BNBUSDT XRPUSDT DOGEUSDT; do
            mkdir -p "$ROOT/$S"
            for M in $(seq -w 1 12); do
              F="${S}-1m-2025-${M}.zip"
              U="https://data.binance.vision/data/futures/um/monthly/klines/${S}/1m/${F}"
              curl --fail --silent --show-error --location "$U" --output "$ROOT/$S/$F"
            done
          done
          test "$(find "$ROOT" -type f -name '*.zip' | wc -l)" -eq 72
      - name: Timestamp-only source gate
        run: python mve_simple4h_01_preflight.py --source-root "$RUNNER_TEMP/mve_simple4h_2025"
      - name: Record source hashes only
        shell: bash
        run: |
          ROOT="$RUNNER_TEMP/mve_simple4h_2025"
          find "$ROOT" -type f -name '*.zip' -print0 | sort -z | xargs -0 sha256sum > MVE_SIMPLE4H_01_2025_SOURCE_SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: mve-simple4h-01-2025-source-receipt
          path: MVE_SIMPLE4H_01_2025_SOURCE_SHA256.txt
          retention-days: 90
