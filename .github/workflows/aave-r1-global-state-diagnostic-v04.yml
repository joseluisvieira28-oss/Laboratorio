name: AAVE R1 Global State Diagnostic V0.4

on:
  push:
    branches:
      - aave-liquidation-overhang-v0.1
    paths:
      - '.github/workflows/aave-r1-global-state-diagnostic-v04.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  global-state-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests 'eth-hash[pycryptodome]'
      - uses: actions/download-artifact@v4
        with:
          name: AAVE_R1_AUDIT_CANONICAL_V0_2E
          run-id: 35378692311
          github-token: ${{ github.token }}
          path: downloaded_r1_audit
      - uses: actions/download-artifact@v4
        with:
          name: AAVE_RECON_R0_BOOTSTRAP
          run-id: 35218275356
          github-token: ${{ github.token }}
          path: downloaded_r0_bootstrap
      - name: Execute exact V0.4 diagnostic-preserving global gate
        run: python research/aave_liquidation_overhang/r1_global_state_v04.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AAVE_R1_GLOBAL_STATE_DIAGNOSTIC_V0_4
          path: r1_global_state_output/AAVE_LIQUIDATION_OVERHANG_001_R1_GLOBAL_STATE_V0_1.json
          if-no-files-found: error
          retention-days: 30
