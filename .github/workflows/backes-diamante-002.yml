name: BACKES-002 public Binance BTC ETH rotation (read-only)
on:
  push:
    branches:
      - research/backes-diamante-001-public-source-audit-20261123
    paths:
      - 'research/backes-diamante-002/**'
      - '.github/workflows/backes-diamante-002.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: backes-002-${{ github.ref }}
  cancel-in-progress: true
jobs:
  historical-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Sanity tests, no market access
        run: python -m unittest discover -s research/backes-diamante-002 -p 'test_*.py' -v
      - name: Download Binance public source ZIPs; run deterministic research
        run: python research/backes-diamante-002/rotation_backtest.py
      - name: Preserve source hashes and results (even on acquisition failure)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backes-002-source-and-economic-report-${{ github.run_id }}
          path: research/backes-diamante-002/results/
          if-no-files-found: warn
          retention-days: 30
