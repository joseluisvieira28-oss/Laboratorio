name: Radar Deploy Drift Semantic V0.3 QA

on:
  pull_request:
    branches:
      - crypto-edge-radar-postgres-v0.5
  push:
    branches:
      - radar-deploy-drift-semantic-v0.3
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crypto_edge_radar
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - name: Deploy drift semantic tests
        run: python -m unittest tests.test_deploy_drift tests.test_deploy_drift_runtime_integration -v
      - name: Full deterministic suite
        run: python -m unittest discover -s tests -v
      - name: Safety assertions
        run: |
          python - <<'PY'
          from pathlib import Path
          a=Path("authorities/RADAR_DEPLOY_DRIFT_SEMANTIC_V0.3.md").read_text()
          assert "automatic_deploy=false" in a
          assert "Authority files are deliberately NOT ignored" in a
          assert "crypto_edge_radar/receipts/" in a
          assert "crypto_edge_radar/tests/" in a
          print("RADAR_DEPLOY_DRIFT_SEMANTIC_FIREWALL_PASS")
          PY
