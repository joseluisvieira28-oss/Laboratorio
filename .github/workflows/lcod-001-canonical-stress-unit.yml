name: LCOD-001 canonical stress-curve unit validation
on:
  push:
    branches: [liquidation-convexity-oracle-distance-001-source-gate-v0.1]
    paths:
      - 'research/liquidation_convexity_oracle_distance_001/canonical_stress_curve.py'
      - 'research/liquidation_convexity_oracle_distance_001/test_canonical_stress_curve.py'
      - '.github/workflows/lcod-001-canonical-stress-unit.yml'
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: liquidation-convexity-oracle-distance-001-source-gate-v0.1}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --quiet pytest
      - run: |
          cd research/liquidation_convexity_oracle_distance_001
          python -m pytest -q test_canonical_stress_curve.py
      - name: Record validation receipt
        run: |
          cat > research/liquidation_convexity_oracle_distance_001/LCOD_CANONICAL_STRESS_ENGINE_VALIDATION_RECEIPT_V0.1.md <<'EOF'
          # LCOD CANONICAL STRESS ENGINE VALIDATION RECEIPT V0.1
          
          Date: 2026-09-25
          Scope: pure integer/rational mechanism math; no protocol outcome data.
          
          Validated:
          - zero-stress never creates a new crossing;
          - uniform stress crosses a healthy borrower only once;
          - official/reconstructed baseline threshold-side disagreement blocks;
          - stressed HF is monotone non-increasing across frozen grid;
          - slope/curvature use exact rational arithmetic.
          
          Result: PASS.
          
          This is engineering validation only and earns zero predictive or promotion credit.
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/liquidation_convexity_oracle_distance_001/LCOD_CANONICAL_STRESS_ENGINE_VALIDATION_RECEIPT_V0.1.md
          if ! git diff --cached --quiet; then
            git commit -m "LCOD-001: record canonical stress-engine unit validation [skip ci]"
            git push origin HEAD:liquidation-convexity-oracle-distance-001-source-gate-v0.1
          fi
