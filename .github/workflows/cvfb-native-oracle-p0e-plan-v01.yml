name: cvfb-native-oracle-p0e-plan-v01

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  plan-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile P0E runner
        run: python -m py_compile research/cross_venue_funding_basis/cvfb_native_oracle_p0e_replica_cmds_v01.py
      - name: Verify plan-only guard
        run: |
          python research/cross_venue_funding_basis/cvfb_native_oracle_p0e_replica_cmds_v01.py --plan > p0e_plan.json
          python - <<'PY'
          import json
          x=json.load(open('p0e_plan.json',encoding='utf-8'))
          assert x['status']=='PLAN_ONLY'
          assert x['execution_authorized'] is False
          assert x['freeze_git_blob_sha']=='3f4e3a43636ea9a17a1c9cbc60e25410bff6a6fe'
          print('P0E_PLAN_ONLY_GUARD_PASS')
          PY
      - name: Prove execution is blocked before S3 without authorization
        run: |
          set +e
          python research/cross_venue_funding_basis/cvfb_native_oracle_p0e_replica_cmds_v01.py --execute --out should_not_exist.json >blocked.out 2>blocked.err
          RC=$?
          set -e
          test "$RC" -eq 3
          grep -q 'BLOCKED_NO_AUTHORIZATION' blocked.err
          test ! -f should_not_exist.json
          echo 'P0E_UNAUTHORIZED_EXECUTION_FAIL_CLOSED_PASS'
