name: First Seconds Cascade V0.1 Gate Archive Census
on:
  push:
    branches: [binance-listing-first-seconds-cascade-v0.1-prereg-2026-10-05]
    paths:
      - '.github/workflows/first_seconds_v01_archive_census.yml'
      - 'research/binance_listing_first_seconds_cascade/v01_gate_archive_census.py'
permissions: {contents: read}
jobs:
  census:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python research/binance_listing_first_seconds_cascade/v01_gate_archive_census.py
