name: DLS Public RPC Arbitrary Cursor Probe V0.1

on:
  push:
    branches:
      - defi-liquidation-kamino-boundary-execution-v0.1
    paths:
      - '.github/workflows/dls-public-rpc-arbitrary-cursor-v01.yml'
      - 'labs/DEFI_LIQUIDATION_SHOCK_001/source/probe_public_rpc_arbitrary_cursor_v0_1.py'
      - 'labs/DEFI_LIQUIDATION_SHOCK_001/KAMINO_PUBLIC_RPC_ARBITRARY_CURSOR_TRIGGER_V0.1.txt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Run source-transport cursor probe
        run: |
          python labs/DEFI_LIQUIDATION_SHOCK_001/source/probe_public_rpc_arbitrary_cursor_v0_1.py | tee DLS_PUBLIC_RPC_ARBITRARY_CURSOR_STDOUT_V0.1.txt
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dls-public-rpc-arbitrary-cursor-v01
          path: |
            DLS_KAMINO_PUBLIC_RPC_ARBITRARY_CURSOR_SEMANTICS_RECEIPT_V0.1.json
            DLS_PUBLIC_RPC_ARBITRARY_CURSOR_STDOUT_V0.1.txt
          if-no-files-found: warn
          retention-days: 30
