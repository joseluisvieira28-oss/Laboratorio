name: Binance BTC Options Geometry Zero Diagnostic V0.1
on:
  push:
    branches: [btc-options-vrp-binance-eoh-source-v0.1]
    paths:
      - "labs/BTC_OPTIONS_VRP_BINANCE_001/GEOMETRY_ZERO_DIAGNOSTIC_AUTHORITY_V0.1.md"
      - "labs/BTC_OPTIONS_VRP_BINANCE_001/geometry_zero_diag_v01.py"
      - ".github/workflows/btc-options-vrp-binance-geometry-zero-diag-v01.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m py_compile labs/BTC_OPTIONS_VRP_BINANCE_001/geometry_zero_diag_v01.py
      - run: python labs/BTC_OPTIONS_VRP_BINANCE_001/geometry_zero_diag_v01.py
      - uses: actions/upload-artifact@v4
        with:
          name: BTC_OPTIONS_VRP_BINANCE_001_GEOMETRY_ZERO_DIAG_V0_1
          path: binance_geometry_zero_diag_v01.json
          retention-days: 30
