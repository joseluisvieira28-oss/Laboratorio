name: LOR-RF-001 Scientific Gates (no trading)
on:
  push:
    branches:
      - research/lorenz-price-action-source-gate-2026-10-09
    paths:
      - research/lorenz_price_action/**
      - .github/workflows/lor-rf-001-science-v01.yml
permissions:
  contents: read

jobs:
  synthetic-and-source:
    name: Synthetic regressions and public source-only gate
    if: github.ref == 'refs/heads/research/lorenz-price-action-source-gate-2026-10-09'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    defaults:
      run:
        working-directory: research/lorenz_price_action
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Restore SHA256-verified Python source
        run: python restore_sources_v01.py
      - name: Synthetic test suite
        run: python -m unittest -v test_lor_rf_v01.py
      - name: Public source metadata only (NO historical candles)
        run: python lor_rf_source_gate_v01.py
      - name: Preserve transparent code and source-only receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lor-rf-001-preoutcome-source-only
          path: |
            research/lorenz_price_action/lor_rf_engine_v01.py
            research/lorenz_price_action/lor_rf_source_gate_v01.py
            research/lorenz_price_action/test_lor_rf_v01.py
            research/lorenz_price_action/LOR_RF_001_SOURCE_METADATA_RECEIPT.json
            research/lorenz_price_action/LOR_RF_001_ECONOMIC_PREOUTCOME_FREEZE_V0_1.json
          if-no-files-found: warn
          retention-days: 90

  discovery:
    name: Outcomes-locked 2024 Discovery only
    needs: synthetic-and-source
    if: github.ref == 'refs/heads/research/lorenz-price-action-source-gate-2026-10-09' && contains(github.event.head_commit.message, '[RUN-LOR-RF-DISCOVERY]')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: research/lorenz_price_action
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Restore immutable SHA256-verified Python source
        run: python restore_sources_v01.py
      - name: Exact-regression verification
        run: python -m unittest -q test_lor_rf_v01.py
      - name: Frozen Discovery only, 2024 BTCUSDT USD-M, public sources
        run: python lor_rf_engine_v01.py LOR_RF_001_ECONOMIC_PREOUTCOME_FREEZE_V0_1.json "$RUNNER_TEMP/lor_rf_archive_cache"
      - name: Preserve source hashes and economic verdict
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lor-rf-001-discovery-2024-only
          path: |
            research/lorenz_price_action/LOR_RF_001_DISCOVERY_RECEIPT.json
            research/lorenz_price_action/LOR_RF_001_ECONOMIC_PREOUTCOME_FREEZE_V0_1.json
          if-no-files-found: warn
          retention-days: 90
