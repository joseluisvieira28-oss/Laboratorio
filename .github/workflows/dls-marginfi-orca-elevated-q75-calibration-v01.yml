name: DLS Marginfi Orca Elevated Flow Q75 Calibration V0.1

on:
  push:
    branches:
      - dls-marginfi-orca-elevated-flow-rebound-v01
    paths:
      - labs/DEFI_LIQUIDATION_SHOCK_001/LAUNCH_MARGINFI_ORCA_ELEVATED_Q75_CAL_V01.marker

permissions:
  actions: read
  contents: read

jobs:
  q75:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download canonical Orca feature calibration
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 36816611039
          artifact-ids: 11141731925
          path: calibration

      - name: Compile Q75 calibration
        run: python -m py_compile labs/DEFI_LIQUIDATION_SHOCK_001/source/calibrate_marginfi_orca_elevated_q75_v0_1.py

      - name: Compute feature-only Q75
        run: >
          python labs/DEFI_LIQUIDATION_SHOCK_001/source/calibrate_marginfi_orca_elevated_q75_v0_1.py
          --calibration-root calibration

      - name: Upload immutable Q75 receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dls-marginfi-orca-elevated-q75-calibration-v01
          path: labs/DEFI_LIQUIDATION_SHOCK_001/MARGINFI_ORCA_ELEVATED_FLOW_Q75_CALIBRATION_RECEIPT_V0.1.json
          if-no-files-found: warn
          retention-days: 90

      - name: Firewall
        if: always()
        run: echo FEATURE_ONLY_NO_JULSEP_OUTCOMES
