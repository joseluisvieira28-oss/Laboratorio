name: CBBTC-ETH-MINT-BURN-FLOW-001 single-run attack V0.1F

on:
  push:
    branches:
      - cbbtc-eth-mint-burn-flow-001-source-gate-v01
    paths:
      - 'research/cbbtc_eth_mint_burn_flow_001/SINGLE_RUN_RETRY_TRIGGER_V0.1F.md'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cbbtc-eth-mint-burn-flow-001-source-gate-v01
  cancel-in-progress: true

jobs:
  attack:
    runs-on: macos-15
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm install --no-save ethers@6.15.0

      - id: source
        name: Run frozen source gate
        continue-on-error: true
        env:
          ETH_RPC_URL: https://ethereum-rpc.publicnode.com
          ETH_ARCHIVE_RPC_URL: https://rpc-eth.blockmachine.io
        run: node research/cbbtc_eth_mint_burn_flow_001/cbbtc_eth_mint_burn_source_probe_v01.mjs

      - name: Persist source receipt locally
        if: always()
        shell: bash
        run: |
          if [ -f artifacts/CBBTC_ETH_MINT_BURN_SOURCE_GATE_RECEIPT_V0.1.json ]; then
            cp artifacts/CBBTC_ETH_MINT_BURN_SOURCE_GATE_RECEIPT_V0.1.json research/cbbtc_eth_mint_burn_flow_001/SOURCE_GATE_RECEIPT_V0.1.json
          fi

      - id: chain
        name: Execute frozen downstream gate chain
        if: ${{ steps.source.outcome == 'success' }}
        continue-on-error: true
        env:
          ETH_RPC_URL: https://ethereum-rpc.publicnode.com
          ETH_ARCHIVE_RPC_URL: https://rpc-eth.blockmachine.io
        run: python research/cbbtc_eth_mint_burn_flow_001/cbbtc_continue_v01.py

      - name: Finalize terminal or post-Discovery status
        if: ${{ always() && steps.source.outcome == 'success' }}
        continue-on-error: true
        run: python research/cbbtc_eth_mint_burn_flow_001/cbbtc_finalize_continuation_v01.py

      - name: Classify source failure without premature scientific closeout
        if: ${{ always() && steps.source.outcome == 'failure' }}
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from datetime import datetime, timezone
          here=Path("research/cbbtc_eth_mint_burn_flow_001")
          p=here/"SOURCE_GATE_RECEIPT_V0.1.json"
          x=json.load(open(p)) if p.exists() else {}
          evaluated=x.get("source_gate_evaluated") is True
          now=datetime.now(timezone.utc).isoformat().replace("+00:00","Z")
          if evaluated:
              rec={
                "lab_id":"CBBTC-ETH-MINT-BURN-FLOW-001",
                "stage":"CLOSEOUT_V0.1",
                "closed_at_utc":now,
                "final_classification":"SOURCE_BLOCKED",
                "terminal":True,
                "source_gate_evaluated":True,
                "source_receipt_classification":x.get("classification"),
                "source_errors":x.get("errors",[]),
                "market_returns_opened":False,
                "protected_2026_opened":False,
                "pnl_opened":False,
                "live_trading":False,
                "mutation":False,
                "promotion_credit":0,
                "rescue_allowed":False
              }
              (here/"CLOSEOUT_RECEIPT_V0.1.json").write_text(json.dumps(rec,indent=2,sort_keys=True)+"\n")
              (here/"CLOSEOUT_V0.1.md").write_text(
                "# CBBTC-ETH-MINT-BURN-FLOW-001 — CLOSEOUT V0.1\n\n"
                "Final classification: **SOURCE_BLOCKED**\n\n"
                "The two frozen source windows were evaluated and the frozen Gate-1 criteria did not pass.\n"
                "No BTC market outcomes, 2026 data, PnL or trading data were opened.\n"
                "Per GOVERNANCE_DECISION_TREE_V0.1, the exact lab is closed with no rescue.\n"
              )
          else:
              rec={
                "lab_id":"CBBTC-ETH-MINT-BURN-FLOW-001",
                "stage":"TECHNICAL_SOURCE_TRANSPORT_STATUS_V0.1",
                "captured_at_utc":now,
                "classification":"TECHNICAL_SOURCE_TRANSPORT_BLOCKED",
                "terminal":False,
                "source_gate_evaluated":False,
                "completed_window_count":x.get("completed_window_count",0),
                "source_errors":x.get("errors",[]),
                "market_returns_opened":False,
                "protected_2026_opened":False,
                "pnl_opened":False,
                "live_trading":False,
                "mutation":False,
                "promotion_credit":0
              }
              (here/"TECHNICAL_SOURCE_TRANSPORT_STATUS_V0.1.json").write_text(json.dumps(rec,indent=2,sort_keys=True)+"\n")
          PY

      - name: Persist durable evidence
        if: always()
        shell: bash
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin cbbtc-eth-mint-burn-flow-001-source-gate-v01
          git add research/cbbtc_eth_mint_burn_flow_001/SOURCE_GATE_RECEIPT_V0.1.json                   research/cbbtc_eth_mint_burn_flow_001/FLOW_*.json                   research/cbbtc_eth_mint_burn_flow_001/DISCOVERY_*.json                   research/cbbtc_eth_mint_burn_flow_001/DAILY_FLOW_V0.1.json                   research/cbbtc_eth_mint_burn_flow_001/CLOSEOUT_*.json                   research/cbbtc_eth_mint_burn_flow_001/CLOSEOUT_*.md \
                  research/cbbtc_eth_mint_burn_flow_001/TECHNICAL_SOURCE_TRANSPORT_STATUS_V0.1.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No new durable evidence."
          else
            git commit -m "CBBTC-ETH-MINT-BURN-FLOW-001: persist single-run gate evidence [skip ci]"
            git push origin HEAD:cbbtc-eth-mint-burn-flow-001-source-gate-v01
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cbbtc-single-run-v01d
          path: |
            artifacts/CBBTC_ETH_MINT_BURN_SOURCE_GATE_RECEIPT_V0.1.json
            artifacts/cbbtc_continuation_manifest_v01.json
            artifacts/census/*
            research/cbbtc_eth_mint_burn_flow_001/SOURCE_GATE_RECEIPT_V0.1.json
            research/cbbtc_eth_mint_burn_flow_001/FLOW_STATE_CALIBRATION_RECEIPT_V0.1.json
            research/cbbtc_eth_mint_burn_flow_001/DISCOVERY_FLOW_PREDICTOR_SAMPLE_RECEIPT_V0.1.json
            research/cbbtc_eth_mint_burn_flow_001/FLOW_DISCOVERY_RESULT_V0.1.json
            research/cbbtc_eth_mint_burn_flow_001/CLOSEOUT_RECEIPT_V0.1.json
            research/cbbtc_eth_mint_burn_flow_001/TECHNICAL_SOURCE_TRANSPORT_STATUS_V0.1.json
          if-no-files-found: warn

      - name: Preserve fail-closed blocker
        if: ${{ steps.source.outcome == 'failure' || steps.chain.outcome == 'failure' }}
        run: exit 2
