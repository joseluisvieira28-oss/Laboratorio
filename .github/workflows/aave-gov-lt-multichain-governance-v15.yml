name: Aave Gov LT Multichain Governance V15
on:
  push:
    branches: [aave-gov-lt-forced-deleveraging-v0.1]
    paths:
      - '.github/workflows/aave-gov-lt-multichain-governance-v15.yml'
      - 'research/aave_gov_lt_forced_deleveraging/multichain_governance_lineage_v15.py'
permissions:
  contents: read
jobs:
  source:
    strategy:
      fail-fast: false
      matrix:
        chain: [polygon, avalanche, arbitrum]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CHAIN: ${{ matrix.chain }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pycryptodome==3.23.0
      - run: python research/aave_gov_lt_forced_deleveraging/multichain_governance_lineage_v15.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aave-gov-lt-${{ matrix.chain }}-governance-v15
          path: out/aave_${{ matrix.chain }}_governance_v15
          retention-days: 30
