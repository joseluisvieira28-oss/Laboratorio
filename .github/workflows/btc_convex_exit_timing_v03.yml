name: BTC-CONVEX-001 exit timing forensic diagnostic

on:
  push:
    branches:
      - btc-convex-trend-capture-001-v0.1
    paths:
      - 'labs/btc-convex-trend-capture-001/**'
      - '.github/workflows/btc_convex_exit_timing_v03.yml'
  pull_request:
    paths:
      - 'labs/btc-convex-trend-capture-001/**'
      - '.github/workflows/btc_convex_exit_timing_v03.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exit-timing:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run frozen 4pct stop / 12pct trail timing diagnostic
        run: python labs/btc-convex-trend-capture-001/exit_timing_diagnostic_v0_3.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: BTC-CONVEX-001-EXIT-TIMING-V03
          path: labs/btc-convex-trend-capture-001/evidence/EXIT_TIMING_DIAGNOSTIC_V0.3.json
