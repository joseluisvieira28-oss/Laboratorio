name: MEXC HL NAS100 Targeted Source Proof V0.5.1

on:
  push:
    branches:
      - mexc-hl-nas100-crossvenue-v0.5-source-gate-2026-10-04
    paths:
      - 'research/mexc_global_assets/MEXC_HL_NAS100_SOURCE_BINDING_AMENDMENT_V0.5.1.md'
      - 'research/mexc_global_assets/mexc_hl_nas100_source_probe_v051.py'
      - '.github/workflows/mexc-hl-nas100-source-gate-v051.yml'

permissions:
  contents: read

jobs:
  targeted-source-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependency
        run: python -m pip install --disable-pip-version-check requests

      - name: Pre-outcome governance
        run: |
          test "$GITHUB_REF_NAME" = "mexc-hl-nas100-crossvenue-v0.5-source-gate-2026-10-04"
          python -m py_compile research/mexc_global_assets/mexc_hl_nas100_source_probe_v051.py
          grep -q 'PRE-OUTCOME SOURCE CORRECTION' research/mexc_global_assets/MEXC_HL_NAS100_SOURCE_BINDING_AMENDMENT_V0.5.1.md
          grep -q 'outcomes remain CLOSED' research/mexc_global_assets/MEXC_HL_NAS100_SOURCE_BINDING_AMENDMENT_V0.5.1.md
          echo 'TARGETED_SOURCE_PROOF_PREOUTCOME_PASS'

      - name: Execute targeted xyz:XYZ100 source proof
        run: python research/mexc_global_assets/mexc_hl_nas100_source_probe_v051.py

      - name: Upload immutable targeted source evidence
        uses: actions/upload-artifact@v4
        with:
          name: mexc-hl-nas100-source-gate-v051-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/mexc_global_assets/hl_nas100_source_gate_v051
          if-no-files-found: error
          retention-days: 90

      - name: Governance closeout
        run: |
          echo 'SOURCE ONLY'
          echo 'NO HISTORICAL OUTCOMES / NO LEAD-LAG SCORING'
          echo 'NO PRIVATE ENDPOINTS / NO ACCOUNT READS / NO WALLETS'
          echo 'NO ORDERS / NO MUTATION / NO LIVE TRADING'
