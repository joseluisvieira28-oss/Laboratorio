name: MEXC FRICTION SHADOW V1 — HOURLY

on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  friction-shadow:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crypto_edge_radar
    steps:
      - uses: actions/checkout@v4
        with:
          ref: crypto-edge-radar-aggressive-v0.7-render
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install runtime
        run: python -m pip install -e .
      - name: Capture public-only MEXC friction receipt
        run: |
          mkdir -p hourly_friction
          python -m radar mexc-friction-shadow > hourly_friction/mexc_friction_shadow_v1.json
      - name: Validate no capital or order path
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          receipt = json.loads(Path('hourly_friction/mexc_friction_shadow_v1.json').read_text())
          assert receipt['receipt_type'] == 'MEXC_FRICTION_SHADOW_V1', receipt
          assert receipt['capital_enabled'] is False, receipt
          assert receipt['orders_created'] is False, receipt
          assert receipt['provider'] == 'MEXC_FUTURES_PUBLIC', receipt
          print(json.dumps({
              'checked_at_utc': receipt['checked_at_utc'],
              'spread_bps': receipt['top_of_book']['spread_bps'],
              'current_funding_bps': receipt['funding_and_basis']['current_funding_rate_bps_per_settlement'],
              'trailing_7d_funding_bps': receipt['funding_and_basis']['trailing_7d_settled_funding']['rate_sum_bps'],
              'long_proxy_bps': receipt['edge_budget']['trailing_7d_directional_proxy']['long_fee_spread_funding_bps'],
              'short_proxy_bps': receipt['edge_budget']['trailing_7d_directional_proxy']['short_fee_spread_funding_bps'],
          }, sort_keys=True))
          PY
      - name: Upload hourly friction receipt
        uses: actions/upload-artifact@v4
        with:
          name: mexc-friction-shadow-${{ github.run_id }}
          path: crypto_edge_radar/hourly_friction/mexc_friction_shadow_v1.json
          if-no-files-found: error
          retention-days: 7
