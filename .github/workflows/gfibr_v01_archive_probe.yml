name: GFIBR V0.1 Archive Probe

on:
  push:
    branches:
      - gate-funding-interval-basis-replication-v0.1-source-2026-10-07
    paths:
      - research/gate_funding_interval_basis_replication/archive_probe_v01.py
      - .github/workflows/gfibr_v01_archive_probe.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4
      - run: python -m py_compile research/gate_funding_interval_basis_replication/archive_probe_v01.py
      - run: python research/gate_funding_interval_basis_replication/archive_probe_v01.py
