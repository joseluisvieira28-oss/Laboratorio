name: Dual Precursor V0.1.2 Alpha Futures Source Census
on:
  push:
    branches: [binance-dual-precursor-spot-hazard-003-v0.1-prereg-2026-10-05]
    paths:
      - '.github/workflows/dual_precursor_v012_source_census.yml'
      - 'research/binance_dual_precursor_spot_hazard/v012_alpha_futures_source_census.py'
permissions:
  contents: read
jobs:
  source_census:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python research/binance_dual_precursor_spot_hazard/v012_alpha_futures_source_census.py
