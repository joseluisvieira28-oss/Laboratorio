name: WTI V16 Hyperliquid Source Gate

on:
  push:
    branches:
      - mexc-hl-wti-crossvenue-v1.6-source-gate-2026-10-04
    paths:
      - 'research/mexc_global_assets/MEXC_HL_WTI_SOURCE_GATE_V1.6.md'
      - 'research/mexc_global_assets/mexc_hl_wti_source_probe_v16.py'
      - '.github/workflows/wti-v16-hl-source-gate.yml'

permissions:
  contents: read

jobs:
  source-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install requests
        run: python -m pip install --disable-pip-version-check requests
      - name: Source-only preflight
        run: |
          test "$GITHUB_REF_NAME" = "mexc-hl-wti-crossvenue-v1.6-source-gate-2026-10-04"
          python -m py_compile research/mexc_global_assets/mexc_hl_wti_source_probe_v16.py
          grep -q 'SOURCE-ONLY' research/mexc_global_assets/MEXC_HL_WTI_SOURCE_GATE_V1.6.md
          grep -q 'OUTCOMES CLOSED' research/mexc_global_assets/MEXC_HL_WTI_SOURCE_GATE_V1.6.md
      - name: Execute public Hyperliquid source gate
        run: python research/mexc_global_assets/mexc_hl_wti_source_probe_v16.py
      - name: Upload immutable source evidence
        uses: actions/upload-artifact@v4
        with:
          name: wti-v16-hl-source-gate-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/mexc_global_assets/hl_wti_source_gate_v16
          if-no-files-found: error
          retention-days: 90
