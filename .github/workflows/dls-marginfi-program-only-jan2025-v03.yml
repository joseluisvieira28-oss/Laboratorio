name: DLS Marginfi Program-Only Jan2025 Probe V0.3

on:
  push:
    branches: [dls-field-enrichment-v01]
    paths:
      - labs/DEFI_LIQUIDATION_SHOCK_001/LAUNCH_MARGINFI_PROGRAM_ONLY_JAN2025_V03.marker

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify frozen binding
        shell: python
        run: |
          import subprocess
          sha=subprocess.check_output(["git","hash-object","labs/DEFI_LIQUIDATION_SHOCK_001/source/collect_protected_2025_marginfi_program_only_v0_3.py"],text=True).strip()
          assert sha=="e136e109d7d3dd08fb4f208eaafd2ae41f9f7d55",sha
          print("PASS: exact derived collector blob")
      - name: Compile
        run: python -m py_compile labs/DEFI_LIQUIDATION_SHOCK_001/source/collect_protected_2025_marginfi_program_only_v0_3.py
      - name: Collect January 2025 source only
        env:
          PYTHONUNBUFFERED: "1"
        run: >-
          python labs/DEFI_LIQUIDATION_SHOCK_001/source/collect_protected_2025_marginfi_program_only_v0_3.py
          --protocol marginfi
          --start 2025-01-01T00:00:00Z
          --end 2025-02-01T00:00:00Z
          --out protected_source/marginfi-202501.json
      - name: Verify PASS and firewall
        shell: python
        run: |
          import json
          from pathlib import Path
          x=json.loads(Path("protected_source/marginfi-202501.json").read_text())
          assert x["classification"]=="PROTECTED_2025_PROTOCOL_SOURCE_PASS"
          assert x["duplicate_count"]==0 and x["error_count"]==0
          fw=x["firewall"]
          assert fw["prices_2025"] is False and fw["returns_2025"] is False and fw["pnl_2025"] is False
          assert fw["prices_2026"] is False and fw["returns_2026"] is False
          print("PASS",x["successful_instruction_count"],x["sol_collateral_event_count"],x["request_count"])
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dls-marginfi-program-only-v03-202501
          path: protected_source/marginfi-202501.json
          if-no-files-found: warn
          retention-days: 90
      - name: Firewall
        if: always()
        run: echo SOURCE_ONLY_NO_MARKET_OUTCOMES_NO_TRADING
