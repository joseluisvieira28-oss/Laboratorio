name: News Shock Lab V0.3A Consensus Combined V0.3

# Tranche 04: provenance-only expansion to 16/44 COMPLETE_A; no market outcomes authorized
on:
  push:
    branches:
      - dream-account-phase-b-signal-research-v0.1
    paths:
      - 'Dream-Account-OS-v2.3-PARTIAL/research/NEWS_SHOCK_LAB_V03A_CONSENSUS_SEED_TRANCHE04_FREEZE_V0.1.json'
      - 'Dream-Account-OS-v2.3-PARTIAL/research/NEWS_SHOCK_LAB_V03A_CONSENSUS_SEED_TRANCHE04_V0.1.json'
      - 'Dream-Account-OS-v2.3-PARTIAL/research/news_shock_lab_v03a_consensus_combined_v03.py'
      - '.github/workflows/news-shock-lab-v03a-consensus-combined-v03.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  news-shock-v03a-consensus-combined-v03:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install parser dependency and compile
        run: |
          cd Dream-Account-OS-v2.3-PARTIAL
          python -m pip install beautifulsoup4
          python -m compileall -q research
      - name: Verify frozen authority chain
        run: |
          cd Dream-Account-OS-v2.3-PARTIAL
          python - <<'PY'
          from research.news_shock_lab_v03a_consensus_combined_v03 import load_authority
          seed1, freeze2, seed2, freeze3, seed3, freeze4, seed4 = load_authority()
          assert freeze4['fingerprint'] == '294680037de76d770c129fb0c6e3d2b903d43cda389dddcc2300c9fbe26688bf'
          assert seed4['fingerprint'] == '0f43162e4b3b4f6155a8d0a642c2bc6c563ab94517a4334d293185c7a71f5997'
          assert freeze4['parent_combined_manifest_fingerprint'] == 'bbe69cdf1909dda75343685ee62ef8173c7314067e1a07059ab22781692e1b89'
          assert freeze4['parent_validation_fingerprint'] == '118980f25cb888423c9a50427be22891f6172cf489b7c7a15297b53a336ed881'
          print('NEWS V03A COMBINED V03 AUTHORITY PASS')
          PY
      - name: Rebuild BLS actuals and validate sixteen consensus events
        run: |
          cd Dream-Account-OS-v2.3-PARTIAL
          mkdir -p research/local_data/news_v03a_consensus_combined_v03_output
          set -o pipefail
          python -m research.news_shock_lab_v03a_consensus_combined_v03 \
            research/local_data/news_v03a_consensus_combined_v03_output \
            | tee research/local_data/news_v03a_consensus_combined_v03_output/combined_v03_stdout.txt
      - name: Assert 16 COMPLETE_A and all outcome guards closed
        run: |
          cd Dream-Account-OS-v2.3-PARTIAL
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('research/local_data/news_v03a_consensus_combined_v03_output')
          s = json.loads((root/'combined_v03_summary.json').read_text())
          expected_counts = {'COMPLETE_A': 16, 'CONSENSUS_PROVENANCE_INCOMPLETE': 28}
          if s['status_counts'] != expected_counts:
              raise SystemExit(f"NEWS V03A V03 STATUS COUNT DRIFT: {s['status_counts']}")
          if s.get('complete_b_count', 0) != 0:
              raise SystemExit('NEWS V03A V03 UNEXPECTED COMPLETE_B')
          if len(s['complete_a_event_ids']) != 16:
              raise SystemExit('NEWS V03A V03 COMPLETE_A COUNT DRIFT')
          for key, value in s['guards'].items():
              if value is not False:
                  raise SystemExit(f'NEWS V03A V03 OUTCOME GUARD DRIFT: {key}')
          print('NEWS V03A COMBINED V03 VALIDATION PASS', s['validation_fingerprint'])
          PY
      - name: Upload combined V0.3 provenance receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: news-shock-v03a-consensus-combined-v03-${{ github.sha }}
          path: |
            Dream-Account-OS-v2.3-PARTIAL/research/local_data/news_v03a_consensus_combined_v03_output/combined_v03_consensus_manifest.json
            Dream-Account-OS-v2.3-PARTIAL/research/local_data/news_v03a_consensus_combined_v03_output/combined_v03_validation_receipt.json
            Dream-Account-OS-v2.3-PARTIAL/research/local_data/news_v03a_consensus_combined_v03_output/combined_v03_summary.json
            Dream-Account-OS-v2.3-PARTIAL/research/local_data/news_v03a_consensus_combined_v03_output/combined_v03_stdout.txt
          if-no-files-found: warn
          retention-days: 30
