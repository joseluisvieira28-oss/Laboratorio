name: CONVEX WINDOWS EXECUTOR RC1 ENGINEERING
on:
  push:
    branches:
      - radar/convex-trailing-ethsolbnb-intake-2026-10-12
    paths:
      - 'crypto_edge_radar/convex_trailing_ethsolbnb/windows_executor_rc1/**'
      - '.github/workflows/convex_windows_executor_rc1.yml'
permissions:
  contents: read
jobs:
  no-live-regression:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Python compile and mocked lifecycle tests (NO keys, NO trading)
        shell: bash
        run: |
          cd crypto_edge_radar/convex_trailing_ethsolbnb/windows_executor_rc1
          python -m compileall -q app tests
          python -m unittest discover -s tests -v
          python app/engine.py selftest
      - name: PowerShell scripts parse without executing (Windows only)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-ChildItem 'crypto_edge_radar/convex_trailing_ethsolbnb/windows_executor_rc1/scripts/*.ps1' | ForEach-Object {
            $tokens=$null; $errors=$null
            $null=[System.Management.Automation.Language.Parser]::ParseFile($_.FullName,[ref]$tokens,[ref]$errors)
            if ($errors.Count -gt 0) { throw ("PowerShell parsing FAILED: "+$_.Name+": "+($errors | Out-String)) }
          }
