name: DLS Archival RPC Credential Readiness V0.1

on:
  push:
    branches:
      - defi-liquidation-shock-v0.1
    paths:
      - 'labs/DEFI_LIQUIDATION_SHOCK_001/ARCHIVAL_RPC_CREDENTIAL_READINESS_TRIGGER_V0.1.txt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  zero-rpc-readiness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify source posture
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path('labs/DEFI_LIQUIDATION_SHOCK_001/MANIFEST_V0.6.json').read_text(encoding='utf-8'))
          assert m['source_data_pass'] is False
          assert m['outcome_accessed'] is False
          g=m['governance']
          for k in ['prices','returns','pnl','direction','live_trading','orders','wallets','exchange_mutation','alerts_webhooks','merge_main']:
              assert g[k] is False
          print('DLS_SOURCE_ONLY_GOVERNANCE_GUARD_PASS')
          PY

      - name: Check archival credential presence only
        env:
          HELIUS_API_KEY: ${{ secrets.HELIUS_API_KEY }}
          DLS_RPC_URL: ${{ secrets.DLS_RPC_URL }}
        run: |
          python - <<'PY'
          import json, os
          helius=bool(os.environ.get('HELIUS_API_KEY'))
          explicit=bool(os.environ.get('DLS_RPC_URL'))
          status='ARCHIVAL_RPC_CREDENTIAL_PRESENT' if (helius or explicit) else 'ARCHIVAL_RPC_CREDENTIAL_ABSENT'
          print(json.dumps({
            'status':status,
            'helius_api_key_present':helius,
            'explicit_rpc_url_present':explicit,
            'rpc_request_made':False,
            'bigquery_request_made':False,
            'prices_opened':False,
            'returns_opened':False,
            'pnl_opened':False,
            '2025_or_2026_opened':False,
            'live_trading':False,
            'exchange_mutation':False
          },sort_keys=True))
          PY
