name: Bitget Module33453 V0.1.7

on:
  push:
    branches:
      - bitget-maker-microstructure-v0.1-source-gate-2026-10-05
    paths:
      - research/cross_venue_stock/bitget_module33453_v017.py
      - .github/workflows/bitget-module33453-v017.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check requests
      - run: python research/cross_venue_stock/bitget_module33453_v017.py
      - uses: actions/upload-artifact@v4
        with:
          name: bitget-module33453-v017-${{ github.run_id }}
          path: artifacts/cross_venue_stock/bitget_module33453_v017
          if-no-files-found: error
          retention-days: 90
