name: BUILD CRYPTO EDGE RADAR WINDOWS NODE

on:
  workflow_dispatch:
  push:
    branches:
      - crypto-edge-radar-aggressive-v0.7-render
      - htf-dh03-12h-standalone-forward-v0.1
      - crypto-edge-radar-v0.13-integration
      - crypto-edge-radar-cleanup-v1
      - crypto-edge-radar-v014-windows-seven-motor
      - crypto-edge-radar-v0141-windows-resilient-bootstrap
    paths:
      - 'crypto_edge_radar/**'
      - '.github/workflows/build-radar-windows-node.yml'

concurrency:
  group: build-radar-windows-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-windows-node:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: crypto_edge_radar
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install runtime and packager
        run: |
          python -m pip install -e .
          python -m pip install "pyinstaller>=6,<7"
      - name: Compile and unit tests
        run: |
          python -m compileall radar tests windows_node_entry.py
          python -m unittest discover -s tests -v
      - name: Build local operator node EXE
        run: |
          pyinstaller --clean --onefile --name CryptoEdgeRadarNode --add-data "deployment_registry_v1.json;." windows_node_entry.py
      - name: Verify packaged and materialized deployment registry
        shell: pwsh
        run: |
          $env:RADAR_PACKAGING_SELFTEST = "1"
          $output = & .\dist\CryptoEdgeRadarNode.exe
          Write-Host $output
          $state = $output | ConvertFrom-Json
          if ($state.status -ne "PASS") { throw "package self-test did not PASS" }
          if ($state.build_id -ne "v0.14.1-win-seven-motor-resilient-bootstrap") { throw "unexpected Windows build_id: $($state.build_id)" }
          if ($state.registry_version -ne "3.6") { throw "unexpected packaged registry_version: $($state.registry_version)" }
          if (-not $state.required_strategy_present) { throw "ETF-CME strategy missing from packaged registry" }
          if ([int]$state.candidate_count -ne 7) { throw "packaged seven-motor registry candidate count mismatch" }
          if (-not $state.dh03_strategy_present) { throw "DH03 standalone strategy missing from packaged registry" }
          if (-not $state.ced1d_strategy_present) { throw "CED1D external T+3 strategy missing from packaged registry" }
          if (-not $state.ema6h_strategy_present) { throw "EMA6H regime forward strategy missing from packaged registry" }
          if (-not $state.dh03_collector_importable) { throw "DH03 collector not importable in packaged EXE" }
          if (-not $state.local_forward_supervisor_importable) { throw "Unified local forward supervisor not importable in packaged EXE" }
          if (-not $state.render_sentinel_importable) { throw "Render sentinel not importable in packaged EXE" }
          if (-not $state.resilient_control_plane_bootstrap) { throw "resilient control-plane bootstrap missing" }
          if (-not $state.runtime_registry_materialized) { throw "runtime registry was not materialized" }
          if ([int]$state.runtime_candidate_count -ne [int]$state.candidate_count) { throw "runtime registry candidate count mismatch" }
      - name: Hash executable
        shell: pwsh
        run: |
          $hash = (Get-FileHash dist\CryptoEdgeRadarNode.exe -Algorithm SHA256).Hash.ToLower()
          "sha256=$hash" | Out-File -FilePath dist\CryptoEdgeRadarNode.sha256.txt -Encoding ascii
          Get-Content dist\CryptoEdgeRadarNode.sha256.txt
      - name: Upload Windows node artifact
        uses: actions/upload-artifact@v4
        with:
          name: crypto-edge-radar-v0141-windows-resilient-bootstrap
          path: |
            crypto_edge_radar/dist/CryptoEdgeRadarNode.exe
            crypto_edge_radar/dist/CryptoEdgeRadarNode.sha256.txt
            crypto_edge_radar/LOCAL_OPERATOR_NODE_V1.md
            crypto_edge_radar/LOCAL_OPERATOR_NODE_V010.md
            crypto_edge_radar/LOCAL_OPERATOR_NODE_V011.md
            crypto_edge_radar/LOCAL_OPERATOR_NODE_V012.md
            crypto_edge_radar/LOCAL_OPERATOR_NODE_V0132.md
            crypto_edge_radar/LOCAL_OPERATOR_NODE_V014.md
            crypto_edge_radar/LOCAL_OPERATOR_NODE_V0141.md
          if-no-files-found: error
          retention-days: 14
