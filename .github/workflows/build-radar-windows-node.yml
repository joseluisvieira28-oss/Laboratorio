name: BUILD CRYPTO EDGE RADAR WINDOWS NODE

on:
  workflow_dispatch:
  push:
    branches:
      - crypto-edge-radar-aggressive-v0.7-render
    paths:
      - 'crypto_edge_radar/**'
      - '.github/workflows/build-radar-windows-node.yml'

permissions:
  contents: read

jobs:
  build-windows-node:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: crypto_edge_radar
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install runtime and packager
        run: |
          python -m pip install -e .
          python -m pip install "pyinstaller>=6,<7"
      - name: Compile and unit tests
        run: |
          python -m compileall radar tests windows_node_entry.py
          python -m unittest discover -s tests -v
      - name: Build local operator node EXE
        run: |
          pyinstaller --clean --onefile --name CryptoEdgeRadarNode --add-data "deployment_registry_v1.json;." windows_node_entry.py
      - name: Verify packaged and materialized deployment registry
        shell: pwsh
        run: |
          $env:RADAR_PACKAGING_SELFTEST = "1"
          $output = & .\dist\CryptoEdgeRadarNode.exe
          Write-Host $output
          $state = $output | ConvertFrom-Json
          if ($state.status -ne "PASS") { throw "package self-test did not PASS" }
          if (-not $state.required_strategy_present) { throw "ETF-CME strategy missing from packaged registry" }
          if ([int]$state.candidate_count -lt 4) { throw "packaged registry unexpectedly small" }
          if (-not $state.runtime_registry_materialized) { throw "runtime registry was not materialized" }
          if ([int]$state.runtime_candidate_count -ne [int]$state.candidate_count) { throw "runtime registry candidate count mismatch" }
      - name: Hash executable
        shell: pwsh
        run: |
          $hash = (Get-FileHash dist\CryptoEdgeRadarNode.exe -Algorithm SHA256).Hash.ToLower()
          "sha256=$hash" | Out-File -FilePath dist\CryptoEdgeRadarNode.sha256.txt -Encoding ascii
          Get-Content dist\CryptoEdgeRadarNode.sha256.txt
      - name: Upload Windows node artifact
        uses: actions/upload-artifact@v4
        with:
          name: crypto-edge-radar-v07-windows-node
          path: |
            crypto_edge_radar/dist/CryptoEdgeRadarNode.exe
            crypto_edge_radar/dist/CryptoEdgeRadarNode.sha256.txt
            crypto_edge_radar/LOCAL_OPERATOR_NODE_V1.md
          if-no-files-found: error
          retention-days: 14
