name: DLS Protected-2025 Hybrid Gap Fill V0.1

on:
  push:
    branches: [dls-field-enrichment-v01]
    paths:
      - labs/DEFI_LIQUIDATION_SHOCK_001/DLS_HYBRID_GAP_FILL_TRIGGER_V0.1.json

permissions:
  actions: read
  contents: read

concurrency:
  group: dls-protected-2025-route-a3a-v01
  cancel-in-progress: true

jobs:
  gap:
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - {group: kamino, month: "05"}
          - {group: kamino, month: "06"}
          - {group: kamino, month: "07"}
          - {group: save, month: "01"}
          - {group: save, month: "02"}
          - {group: save, month: "03"}
          - {group: save, month: "05"}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify frozen gap-fill authority
        shell: python
        run: |
          import json,py_compile
          from pathlib import Path
          t=json.loads(Path("labs/DEFI_LIQUIDATION_SHOCK_001/DLS_HYBRID_GAP_FILL_TRIGGER_V0.1.json").read_text())
          assert t["action"]=="RUN_HYBRID_GAP_FILL_SOURCE_ONLY"
          assert t["freeze_commit"]=="5be13b94a6ccea1ca8c941281ac2ebba34712f8c"
          assert t["kamino_shape_correction_commit"]=="8d9eb09b0f5319f155d38caae6d2c3079ed13b5c"
          assert t["market_outcomes_opened"] is False
          assert t["trading_authority"]=="NONE"
          py_compile.compile("labs/DEFI_LIQUIDATION_SHOCK_001/source/run_route_a3a_protected_2025_partition_v0_1.py",doraise=True)
          py_compile.compile("labs/DEFI_LIQUIDATION_SHOCK_001/source/run_route_a3b_protected_2025_partition_v0_1.py",doraise=True)
          print("PASS: gap-fill authority")
      - name: Collect missing A3B partition
        env:
          HELIUS_API_KEY: ${{ secrets.HELIUS_API_KEY }}
          GROUP: ${{ matrix.group }}
          MONTH: ${{ matrix.month }}
          PYTHONUNBUFFERED: "1"
        run: |
          mkdir -p gap_source
          python labs/DEFI_LIQUIDATION_SHOCK_001/source/run_route_a3b_protected_2025_partition_v0_1.py \
            --group "$GROUP" --month "$MONTH" --outdir gap_source
      - name: Gap firewall
        if: always()
        run: echo SOURCE_ONLY_NO_2025_PRICES_NO_RETURNS_NO_PNL_NO_2026_NO_TRADING
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dls-protected-2025-gap-${{ matrix.group }}-${{ matrix.month }}
          path: gap_source/*.json
          if-no-files-found: warn
          retention-days: 90

  finalize:
    needs: gap
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download reusable SQD PASS set A
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 36740555628
          pattern: dls-protected-2025-source-v02-*
          path: /tmp/hybrid/runA
          merge-multiple: true

      - name: Download reusable SQD PASS set B
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 36733498831
          pattern: dls-protected-2025-source-v02-*
          path: /tmp/hybrid/runB
          merge-multiple: true

      - name: Download A3B Marginfi 12/12 PASS receipts
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 36986263576
          pattern: dls-protected-2025-a3b-marginfi-*
          path: /tmp/hybrid/marginfi
          merge-multiple: true

      - name: Download current gap-fill receipts
        uses: actions/download-artifact@v4
        with:
          pattern: dls-protected-2025-gap-*
          path: /tmp/hybrid/gaps
          merge-multiple: true

      - name: Materialize exact 48 PASS partitions
        run: |
          python -m py_compile labs/DEFI_LIQUIDATION_SHOCK_001/source/materialize_hybrid_protected_2025_source_v0_1.py
          mkdir -p /tmp/selected48
          python labs/DEFI_LIQUIDATION_SHOCK_001/source/materialize_hybrid_protected_2025_source_v0_1.py \
            --root /tmp/hybrid \
            --outdir /tmp/selected48 \
            --receipt labs/DEFI_LIQUIDATION_SHOCK_001/DLS_PROTECTED_2025_HYBRID_MATERIALIZATION_RECEIPT_V0.1.json

      - name: Run unchanged Protected-2025 finalizer
        run: |
          python -m py_compile labs/DEFI_LIQUIDATION_SHOCK_001/source/finalize_protected_2025_source_v0_2.py
          python labs/DEFI_LIQUIDATION_SHOCK_001/source/finalize_protected_2025_source_v0_2.py --root /tmp/selected48

      - name: Enforce final source PASS and firewall
        shell: python
        run: |
          import json
          from pathlib import Path
          h=json.loads(Path("labs/DEFI_LIQUIDATION_SHOCK_001/DLS_PROTECTED_2025_HYBRID_MATERIALIZATION_RECEIPT_V0.1.json").read_text())
          assert h["classification"]=="HYBRID_48_PARTITION_PASS"
          assert h["selected_partition_count"]==48
          x=json.loads(Path("labs/DEFI_LIQUIDATION_SHOCK_001/PROTECTED_2025_SOURCE_AUTHORITY_RECEIPT_V0.2.json").read_text())
          assert x["classification"]=="PROTECTED_2025_SOURCE_AUTHORITY_PASS"
          f=x["firewall"]
          assert f["prices_2025_opened"] is False and f["returns_2025_opened"] is False
          assert f["pnl_2025_opened"] is False and f["prices_2026_opened"] is False
          print("PASS:",x["classification"],"clusters",x["sol_cluster_count"])

      - uses: actions/upload-artifact@v4
        with:
          name: dls-protected-2025-source-authority-hybrid-v01
          path: |
            labs/DEFI_LIQUIDATION_SHOCK_001/DLS_PROTECTED_2025_HYBRID_MATERIALIZATION_RECEIPT_V0.1.json
            labs/DEFI_LIQUIDATION_SHOCK_001/PROTECTED_2025_SOURCE_AUTHORITY_RECEIPT_V0.2.json
            labs/DEFI_LIQUIDATION_SHOCK_001/PROTECTED_2025_SOURCE_CLUSTER_CENSUS_V0.2.ndjson
          if-no-files-found: error
          retention-days: 90

      - name: Firewall
        if: always()
        run: echo SOURCE_ONLY_NO_MARKET_OUTCOMES_NO_2026_NO_TRADING
