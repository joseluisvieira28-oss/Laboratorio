name: Radar Postgres Sequence Finalization V0.1 QA

on:
  pull_request:
    branches:
      - crypto-edge-radar-postgres-v0.5
    paths:
      - "crypto_edge_radar/radar/sequence_finalization.py"
      - "crypto_edge_radar/tests/test_sequence_finalization.py"
      - "crypto_edge_radar/authorities/RADAR_POSTGRES_SEQUENCE_FINALIZATION_V0.1_2026-09-27.md"
      - ".github/workflows/radar-postgres-sequence-finalization-v01-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          cd crypto_edge_radar
          python -m pip install -e .

      - name: Compile
        run: |
          cd crypto_edge_radar
          python -m compileall radar tests

      - name: Sequence finalization targeted tests
        run: |
          cd crypto_edge_radar
          python -m unittest -v             tests.test_sequence_finalization             tests.test_evidence_prefix_reconciliation             tests.test_evidence_portability

      - name: Full deterministic Radar suite
        run: |
          cd crypto_edge_radar
          python -m unittest discover -s tests -v

      - name: Sequence-only mutation firewall guard
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path("crypto_edge_radar/radar/sequence_finalization.py").read_text()
          assert "setval(" in p
          for forbidden in (
              "INSERT INTO",
              "UPDATE radar_events",
              "UPDATE radar_event_keys",
              "DELETE FROM radar_events",
              "DELETE FROM radar_event_keys",
              "TRUNCATE",
              "ALTER TABLE",
              "DROP TABLE",
          ):
              assert forbidden not in p, forbidden
          assert "cutover_authorized" in p
          assert "secret_value_exposed" in p
          print("RADAR_POSTGRES_SEQUENCE_FINALIZATION_V01_GUARD_PASS")
          PY
