name: TOKEN-UNLOCK-EVENT-001 Source Manifest V0.1

on:
  push:
    branches:
      - token-unlock-event-001-source-gate-v01
    paths:
      - 'Dream-Account-OS-v2.3-PARTIAL/research/token_unlock_event_001/build_6mv_candidate_manifest_v01.py'
      - 'Dream-Account-OS-v2.3-PARTIAL/research/token_unlock_event_001/SOURCE_QUARANTINE_ADDENDUM_V01.md'
      - '.github/workflows/token-unlock-source-manifest-v01.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  source-manifest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout scientific branch
        uses: actions/checkout@v4
        with:
          ref: token-unlock-event-001-source-gate-v01

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build quarantined source-only candidate manifest
        run: |
          python Dream-Account-OS-v2.3-PARTIAL/research/token_unlock_event_001/build_6mv_candidate_manifest_v01.py

      - name: Guard forbidden outcome artifacts
        shell: bash
        run: |
          set -euo pipefail
          OUT='Dream-Account-OS-v2.3-PARTIAL/research/token_unlock_event_001/source_probe_output_v02'
          test -f "$OUT/TUE_6MV_CANDIDATE_RECEIPT_V01.json"
          test -f "$OUT/TUE_6MV_CANDIDATE_MANIFEST_2023_2024_V01.json"
          python - <<'PY'
          import json
          from datetime import date
          from pathlib import Path
          out=Path('Dream-Account-OS-v2.3-PARTIAL/research/token_unlock_event_001/source_probe_output_v02')
          r=json.loads((out/'TUE_6MV_CANDIDATE_RECEIPT_V01.json').read_text())
          rows=json.loads((out/'TUE_6MV_CANDIDATE_MANIFEST_2023_2024_V01.json').read_text())
          g=r['guards']
          assert g['future_event_rows_serialized'] is False
          assert g['price_data_accessed'] is False
          assert g['returns_computed'] is False
          assert g['pnl_computed'] is False
          assert g['profit_factor_computed'] is False
          assert g['year_2025_market_data_accessed'] is False
          assert g['year_2026_market_data_accessed'] is False
          assert r['source_gate_pass'] is False
          assert all(date.fromisoformat(x['scheduled_date_utc']) <= date(2024,12,31) for x in rows)
          assert all(int(x['known_lead_days']) >= 30 for x in rows)
          assert all(x['outcome_data_accessed'] is False for x in rows)
          print('GUARDS_PASS')
          PY

      - name: Persist filtered source-only outputs on scientific branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          OUT='Dream-Account-OS-v2.3-PARTIAL/research/token_unlock_event_001/source_probe_output_v02'
          git add "$OUT/TUE_6MV_CANDIDATE_RECEIPT_V01.json" \
                  "$OUT/TUE_6MV_CANDIDATE_MANIFEST_2023_2024_V01.json" \
                  "$OUT/TUE_6MV_CANDIDATE_MANIFEST_2023_2024_V01.csv"
          if git diff --cached --quiet; then
            echo 'No output changes to persist.'
          else
            git commit -m 'TOKEN-UNLOCK-EVENT-001: persist filtered source manifest [skip ci]'
            git push origin HEAD:token-unlock-event-001-source-gate-v01
          fi

      - name: Upload source-only receipt and manifest
        uses: actions/upload-artifact@v4
        with:
          name: token-unlock-event-001-source-manifest-v01
          path: Dream-Account-OS-v2.3-PARTIAL/research/token_unlock_event_001/source_probe_output_v02/
          if-no-files-found: error
          retention-days: 30
