name: SOL XRP Binance 5m Missing Source Dates Audit
on:
  push:
    branches:
      - audit/convex-sol-xrp-source-coverage-2026-10-13
    paths:
      - 'research/convex_multialt_source_audit_20261013/**'
      - '.github/workflows/convex-sol-xrp-missing-source-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-source-only:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        symbol: [SOLUSDT, XRPUSDT]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Find missing 5m UTC intervals in publisher-verified source only
        run: |
          python -m research.convex_multialt_source_audit_20261013.gap_audit \
            --symbol ${{ matrix.symbol }} \
            --output-dir research/convex_multialt_source_audit_20261013/receipts/${{ matrix.symbol }}
      - name: Archive gap-audit only result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: OFFICIAL-5M-GAP-AUDIT-${{ matrix.symbol }}
          path: research/convex_multialt_source_audit_20261013/receipts/${{ matrix.symbol }}/**
          if-no-files-found: warn
          retention-days: 30
