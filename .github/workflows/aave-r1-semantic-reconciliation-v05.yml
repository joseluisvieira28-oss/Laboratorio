name: AAVE R1 Semantic Reconciliation Continuation V0.5

on:
  push:
    branches:
      - aave-liquidation-overhang-v0.1
    paths:
      - '.github/workflows/aave-r1-semantic-reconciliation-v05.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  V03_RUN_ID: '35378904880'
  V03_HEAD_SHA: '1ec8c78b492b10108c92472f3bbcb49f99e3b9ec'
  GLOBAL_V04_RUN_ID: '35384377212'
  GLOBAL_V04_HEAD_SHA: 'ca871e1d55a18c0a058e1c45ae5b397b6afec15b'

jobs:
  wait-and-adjudicate:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Wait for exact upstream runs only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json,os,time,urllib.request
          repo='joseluisvieira28-oss/Laboratorio'
          targets=[
            (int(os.environ['V03_RUN_ID']),os.environ['V03_HEAD_SHA']),
            (int(os.environ['GLOBAL_V04_RUN_ID']),os.environ['GLOBAL_V04_HEAD_SHA']),
          ]
          deadline=time.time()+95*60
          pending=set(r for r,_ in targets)
          while pending and time.time()<deadline:
            for run_id,sha in targets:
              if run_id not in pending: continue
              req=urllib.request.Request(
                f'https://api.github.com/repos/{repo}/actions/runs/{run_id}',
                headers={'Authorization':f"Bearer {os.environ['GH_TOKEN']}",'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}
              )
              with urllib.request.urlopen(req,timeout=30) as r: o=json.load(r)
              assert o['head_sha']==sha,(run_id,o['head_sha'],sha)
              if o['status']=='completed':
                print(json.dumps({'run_id':run_id,'status':o['status'],'conclusion':o['conclusion'],'head_sha':o['head_sha']},sort_keys=True))
                pending.remove(run_id)
            if pending: time.sleep(30)
          if pending: raise SystemExit(f'upstream wait timeout {sorted(pending)}')
          PY

      - uses: actions/download-artifact@v4
        with:
          pattern: AAVE_R1_V03_RESERVE_SHARD_*
          path: downloaded_r1_shards
          merge-multiple: true
          run-id: 35378904880
          github-token: ${{ github.token }}

      - name: Reconcile only proven stale-flag semantics
        continue-on-error: true
        run: python research/aave_liquidation_overhang/reconcile_r1_reserve_shards_flag_v01.py

      - name: Bind reconciled shard corpus for aggregate
        run: |
          test "$(find reconciled_r1_shards -maxdepth 1 -name 'r1_reserve_shard_reconciled_*.json' | wc -l)" -eq 8
          rm -rf downloaded_r1_shards
          mkdir downloaded_r1_shards
          cp reconciled_r1_shards/r1_reserve_shard_reconciled_*.json downloaded_r1_shards/

      - uses: actions/download-artifact@v4
        with:
          name: AAVE_R1_GLOBAL_STATE_DIAGNOSTIC_V0_4
          path: downloaded_r1_global
          run-id: 35384377212
          github-token: ${{ github.token }}

      - uses: actions/download-artifact@v4
        with:
          name: AAVE_R1_AUDIT_CANONICAL_V0_2E
          path: downloaded_r1_audit
          run-id: 35378692311
          github-token: ${{ github.token }}

      - uses: actions/download-artifact@v4
        with:
          name: AAVE_RECON_R0_BOOTSTRAP
          path: downloaded_r0_bootstrap
          run-id: 35218275356
          github-token: ${{ github.token }}

      - name: Canonical R1 adjudication after semantic reconciliation
        continue-on-error: true
        run: python research/aave_liquidation_overhang/aggregate_r1_reconstruction_v02.py

      - name: Outcome firewall
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('r1_canonical_output/AAVE_LIQUIDATION_OVERHANG_001_RECONSTRUCTION_R1_CANONICAL_V0_2.json')
          assert p.exists()
          x=json.loads(p.read_text())
          s=x['safety']
          assert s['health_factor_computed'] is False
          assert s['overhang_computed'] is False
          assert s['future_liquidation_outcome_computed'] is False
          assert s['market_returns_opened'] is False
          assert s['returns_opened'] is False
          assert s['pnl_opened'] is False
          assert s['accessed_2025_or_2026'] is False
          assert s['live_trading'] is False
          assert s['exchange_mutation'] is False
          print('V05_CANONICAL_FIREWALL_PASS',x['classification'],x.get('next_authorized_phase'))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: AAVE_R1_SEMANTIC_RECONCILIATION_V0_5
          path: |
            reconciled_r1_shards/*.json
            r1_canonical_output/AAVE_LIQUIDATION_OVERHANG_001_RECONSTRUCTION_R1_CANONICAL_V0_2.json
          if-no-files-found: error
          retention-days: 30
