name: BINANCE-004 Pre-Frozen 30s Absorption Proxy Forward Pilot (NO TRADING)
on:
  pull_request:
    paths:
      - "research/binance_diamante004/**"
      - ".github/workflows/binance-diamante-004-forward-pilot.yml"
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  prospectively-frozen-one-shot:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Offline fail-closed frozen science and timing tests (NO network)
        run: |
          python -m unittest discover -s research/binance_diamante003 -p 'test_*.py' -v
          python -m unittest discover -s research/binance_diamante004 -p 'test_*.py' -v
      - name: Install only anonymous WebSocket transport
        run: python -m pip install "websockets>=14,<16"
      - name: ONE previously frozen new 480s public WS source capture (3 public REST snapshots)
        env:
          PYTHONUNBUFFERED: "1"
        run: python research/binance_diamante004/capture_forward.py
      - name: Freeze-locked 30s event/60s hypothetical marketable quote evaluation
        run: python research/binance_diamante004/study.py
      - name: Independently reopen exact raw journal, hashes and shadow ledger
        run: python research/binance_diamante004/verify_offline.py
      - name: Preserve exact raw source and all receipts on failure or success
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: binance004-frozen-forward-${{ github.run_id }}
          path: binance004-evidence/
          retention-days: 60
          if-no-files-found: warn
