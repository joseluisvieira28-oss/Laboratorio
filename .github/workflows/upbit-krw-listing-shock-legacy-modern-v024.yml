name: UKLS Legacy Modern Equivalence V0.2.4
on:
  push:
    branches:
      - upbit-krw-listing-shock-source-recovery-v0.2
    paths:
      - 'Dream-Account-OS-v2.3-PARTIAL/research/upbit_krw_listing_shock_001/legacy_modern_equivalence_v024.py'
      - '.github/workflows/upbit-krw-listing-shock-legacy-modern-v024.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check brotli
      - name: Verify frozen authority
        run: |
          test -f Dream-Account-OS-v2.3-PARTIAL/research/upbit_krw_listing_shock_001/LEGACY_MODERN_EQUIVALENCE_AUTHORITY_V0_2_4.md
          python -m py_compile Dream-Account-OS-v2.3-PARTIAL/research/upbit_krw_listing_shock_001/legacy_modern_equivalence_v024.py
      - name: Execute source-only cross-family equivalence audit
        run: python Dream-Account-OS-v2.3-PARTIAL/research/upbit_krw_listing_shock_001/legacy_modern_equivalence_v024.py
      - name: Enforce firewall
        run: |
          python - <<'PY'
          import json
          x=json.load(open('artifacts/UKLS_LEGACY_MODERN_EQUIVALENCE_V0_2_4.json'))
          assert x['event_values_emitted'] is False
          assert x['source_gate_opened'] is False
          assert x['binance_opened'] is False
          print('CLASSIFICATION',x['classification'])
          print('OVERLAP_IDS',x['overlap_id_count'])
          print('COMPARABLE_IDS',x['comparable_id_count'])
          print('TITLE_EXACT',x['title_exact_count'])
          print('CREATED_FIRST_EXACT',x['created_to_first_exact_count'])
          print('UPDATED_LISTED_EXACT',x['updated_to_listed_exact_count'])
          print('ALL_EXACT',x['all_fields_exact_count'])
          print('GAPS',x['gap_seconds'])
          print('AGG_SHA',x['comparison_aggregate_sha256'])
          print('FAMILIES',x['families'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: UKLS_LEGACY_MODERN_EQUIVALENCE_V0_2_4
          path: artifacts/UKLS_LEGACY_MODERN_EQUIVALENCE_V0_2_4.json
          retention-days: 90
