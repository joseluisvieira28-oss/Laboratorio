name: CED1D-0031 Micro-Live V0.2 Preflight

on:
  workflow_dispatch:
  push:
    paths:
      - 'crypto_edge_radar/radar/ced1d0031_public.py'
      - 'crypto_edge_radar/radar/ced1d0031_microlive.py'
      - 'crypto_edge_radar/radar/ced1d0031_preflight.py'
      - 'crypto_edge_radar/radar/binance_trading.py'
      - 'crypto_edge_radar/tests/test_ced1d0031_microlive.py'
      - '.github/workflows/ced1d0031-microlive-v02-preflight.yml'

permissions:
  contents: read

jobs:
  offline-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MICROLIVE_EXECUTION_ENABLED: "0"
      BINANCE_API_KEY: ""
      BINANCE_API_SECRET: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile V0.2 modules
        run: |
          python -m py_compile crypto_edge_radar/radar/ced1d0031_public.py
          python -m py_compile crypto_edge_radar/radar/binance_trading.py
          python -m py_compile crypto_edge_radar/radar/ced1d0031_microlive.py
          python -m py_compile crypto_edge_radar/radar/ced1d0031_preflight.py
      - name: Run V0.2 safety tests
        working-directory: crypto_edge_radar
        run: |
          python -m unittest tests.test_ced1d0031_microlive -v
      - name: Assert no embedded exchange secrets
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path

          paths = [
              Path("crypto_edge_radar/radar/binance_trading.py"),
              *sorted(Path("crypto_edge_radar/radar").glob("ced1d0031_*.py")),
          ]
          forbidden_text = ("BEGIN PRIVATE KEY", "BEGIN RSA PRIVATE KEY", "BEGIN OPENSSH PRIVATE KEY")
          secret_names = {"BINANCE_API_KEY", "BINANCE_API_SECRET"}

          findings = []
          for path in paths:
              text = path.read_text(encoding="utf-8")
              for marker in forbidden_text:
                  if marker in text:
                      findings.append(f"{path}:private-key-marker:{marker}")
              tree = ast.parse(text, filename=str(path))
              for node in ast.walk(tree):
                  if isinstance(node, ast.Assign):
                      targets = [t.id for t in node.targets if isinstance(t, ast.Name)]
                      for name in targets:
                          if name in secret_names and isinstance(node.value, ast.Constant):
                              value = node.value.value
                              if isinstance(value, str) and value.strip():
                                  findings.append(f"{path}:literal-secret-assignment:{name}")
          if findings:
              raise SystemExit("Potential embedded credential found: " + " | ".join(findings))
          print("CED1D0031_MICROLIVE_V02_OFFLINE_PREFLIGHT_PASS")
          PY
