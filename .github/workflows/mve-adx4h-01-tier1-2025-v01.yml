name: MVE ADX4H 01 — Tier1 2025 Confirmation V0.1

on:
  push:
    branches: [mve-adx4h-01-tier1-2025-v01]
    paths:
      - 'Dream-Account-OS-v2.3-PARTIAL/research/mve_adx4h_01_tier1_2025_v01.py'
      - 'Dream-Account-OS-v2.3-PARTIAL/research/MVE_ADX4H_01_2025_AUTHORIZATION_RECEIPT_V01.json'
      - '.github/workflows/mve-adx4h-01-tier1-2025-v01.yml'

permissions:
  contents: read

jobs:
  frozen-2025-confirmation:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Assert frozen authority bytes and explicit authorization
        shell: bash
        run: |
          test "$(git hash-object Dream-Account-OS-v2.3-PARTIAL/research/classic_indicators_gap_v01.py)" = "21398ba193d10d465c10b392e1dc8461270a0491"
          test "$(git hash-object Dream-Account-OS-v2.3-PARTIAL/research/CLASSIC_INDICATORS_GAP_LAB_V01_PROTOCOL.json)" = "0ac36b01d682064576b6d1279d26a1d7056c780f"
          test "$(git hash-object Dream-Account-OS-v2.3-PARTIAL/research/cigl_adx_01_action_v01.py)" = "bd8cd57e3ea7b25df1eab5a4c8c80fbe7fd5694c"
          test "$(git hash-object Dream-Account-OS-v2.3-PARTIAL/research/MVE_ADX4H_01_TIER1_CONFIRMATION_PRE2025_FREEZE_V01.json)" = "f6fda1a76a480ae4c0ee54fe5ae08b207fe1379f"
          grep -q '"open_2025": true' Dream-Account-OS-v2.3-PARTIAL/research/MVE_ADX4H_01_2025_AUTHORIZATION_RECEIPT_V01.json
          grep -q '"open_2026": false' Dream-Account-OS-v2.3-PARTIAL/research/MVE_ADX4H_01_2025_AUTHORIZATION_RECEIPT_V01.json
          echo 'Frozen authority and 2025 authorization PASS'
      - name: Install isolated research dependencies
        run: python -m pip install --disable-pip-version-check numpy pandas zstandard
      - name: Compile confirmation runner
        run: |
          cd Dream-Account-OS-v2.3-PARTIAL/research
          python -m py_compile mve_adx4h_01_tier1_2025_v01.py
      - name: Execute one-shot 2025 confirmation
        run: |
          cd Dream-Account-OS-v2.3-PARTIAL/research
          python mve_adx4h_01_tier1_2025_v01.py --work ../outputs/MVE_ADX4H_01_TIER1_2025_V01
      - name: Upload immutable confirmation receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mve-adx4h-01-tier1-2025-v01-${{ github.sha }}
          path: Dream-Account-OS-v2.3-PARTIAL/outputs/MVE_ADX4H_01_TIER1_2025_V01/outputs/
          if-no-files-found: error
          retention-days: 90
