name: source-t0-probe-v30-secret-public-index-archive-corrected

on:
  push:
    branches:
      - cosmos-native-emission-param-shock-001-v0.2-t0-remediation-2026-10-07
    paths:
      - .github/workflows/source-t0-probe-v30-secret-public-index-archive-corrected.yml

permissions:
  contents: write

jobs:
  corrected-public-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cosmos-native-emission-param-shock-001-v0.2-t0-remediation-2026-10-07
      - name: Corrected public historical index and archive probe
        run: |
          python - <<'PY'
          import json, re, urllib.request, urllib.error, datetime, hashlib, os
          from concurrent.futures import ThreadPoolExecutor

          TARGET="2023-12-07T02:54:58.930543213Z"
          TT=datetime.datetime.fromisoformat(TARGET.replace("Z","+00:00")).timestamp()
          UA={"User-Agent":"CryptoLab-source-only-secret-v30/1.0"}
          OUT="research/cosmos_native_emission_param_shock_001_v0_2/SCRT287_PUBLIC_INDEX_ARCHIVE_PROBE_V30.json"

          def get(url, timeout=15):
              req=urllib.request.Request(url,headers=UA)
              try:
                  with urllib.request.urlopen(req,timeout=timeout) as r:
                      b=r.read()
                      return {"ok":True,"status":getattr(r,"status",200),"url":url,
                              "content_type":r.headers.get("content-type",""),
                              "sha256":hashlib.sha256(b).hexdigest(),
                              "body":b.decode("utf-8","replace")[:500000]}
              except urllib.error.HTTPError as e:
                  try:b=e.read()
                  except Exception:b=b""
                  return {"ok":False,"status":e.code,"url":url,"error":str(e),
                          "sha256":hashlib.sha256(b).hexdigest() if b else None,
                          "body":b.decode("utf-8","replace")[:50000]}
              except Exception as e:
                  return {"ok":False,"url":url,"error":repr(e)}

          def walk(x):
              if isinstance(x,dict):
                  yield x
                  for v in x.values(): yield from walk(v)
              elif isinstance(x,list):
                  for v in x: yield from walk(v)

          def parse_block(resp, requested=None):
              body=resp.get("body","")
              try:d=json.loads(body)
              except Exception:d=None
              if d is not None:
                  for x in walk(d):
                      h=x.get("height") or x.get("block_height") or x.get("blockHeight")
                      t=x.get("time") or x.get("timestamp") or x.get("block_time") or x.get("blockTime")
                      hs=x.get("hash") or x.get("block_hash") or x.get("blockHash")
                      if h is not None and t:
                          try:
                              h=int(h)
                              if requested is None or h==requested:
                                  return {"height":h,"time":str(t),"hash":hs}
                          except Exception: pass
              # Corrected HTML regexes: no quote-escaping syntax fault.
              mh=re.search(r"(?i)(?:height|blockHeight|block_height)[^0-9]{0,40}(1[0-9]{7,8})",body)
              mt=re.search(r"(2023-12-[0-9]{2}T[0-9:.+-]+Z?)",body)
              if mh and mt:
                  h=int(mh.group(1))
                  if requested is None or h==requested:
                      return {"height":h,"time":mt.group(1),"hash":None}
              return None

          # Search-aid grid only. Never promote an estimated height.
          grid=[11752974,11800000,11840000,11860000,11875000,11880000,11885000,11890000,11900000,11920000]
          templates=[
            ("cosmostation-chain-api","https://api-secret.cosmostation.io/blocks/{h}"),
            ("cosmostation-chain-api-singular","https://api-secret.cosmostation.io/block/{h}"),
            ("cosmostation-chain-api-v1","https://api-secret.cosmostation.io/v1/blocks/{h}"),
            ("cosmostation-chain-api-v1-singular","https://api-secret.cosmostation.io/v1/block/{h}"),
            ("cosmostation-unified-v1-blocks","https://api.cosmostation.io/v1/secret/blocks/{h}"),
            ("cosmostation-unified-v1-block","https://api.cosmostation.io/v1/secret/block/{h}"),
            ("cosmostation-lcd","https://lcd-secret.cosmostation.io/cosmos/base/tendermint/v1beta1/blocks/{h}"),
            ("mintscan-page","https://www.mintscan.io/secret/block/{h}"),
            ("atomscan-page","https://atomscan.com/secret-network/block/{h}"),
            ("explorers-guru-page","https://secret.explorers.guru/block/{h}"),
            ("secretnodes-blocks","https://secretnodes.com/secret/chains/secret-4/blocks/{h}"),
            ("secretnodes-block","https://secretnodes.com/secret/chains/secret-4/block/{h}"),
          ]

          rows=[]
          jobs=[]
          with ThreadPoolExecutor(max_workers=32) as ex:
              for name,tpl in templates:
                  for h in grid:
                      jobs.append((name,tpl,h,ex.submit(get,tpl.format(h=h),15)))
              for name,tpl,h,f in jobs:
                  r=f.result(); p=parse_block(r,h)
                  rows.append({"source":name,"template":tpl,"requested_height":h,
                               "ok":r.get("ok"),"status":r.get("status"),"url":r.get("url"),
                               "parsed":p,"sha256":r.get("sha256"),"error":r.get("error"),
                               "body_excerpt":r.get("body","")[:2500]})

          pts={}
          for r in rows:
              p=r.get("parsed")
              if not p: continue
              try: tv=datetime.datetime.fromisoformat(p["time"].replace("Z","+00:00")).timestamp()
              except Exception: continue
              pts.setdefault(r["source"],[]).append((p["height"],tv,p["time"],r["template"]))

          exact={}
          for name,arr in pts.items():
              arr=sorted(arr)
              bracket=None
              for a,b in zip(arr,arr[1:]):
                  if a[1] < TT <= b[1]:
                      bracket=(a,b);break
              if not bracket: continue
              tpl=bracket[0][3]; L,R=bracket[0][0],bracket[1][0]; failure=None
              while L<R:
                  M=(L+R)//2
                  rr=get(tpl.format(h=M),15); z=parse_block(rr,M)
                  if not z:
                      failure={"height":M,"status":rr.get("status"),"error":rr.get("error"),
                               "url":rr.get("url"),"body_excerpt":rr.get("body","")[:2000]}
                      break
                  try: tv=datetime.datetime.fromisoformat(z["time"].replace("Z","+00:00")).timestamp()
                  except Exception as e:
                      failure={"height":M,"time":z.get("time"),"error":repr(e)};break
                  if tv < TT: L=M+1
                  else: R=M
              rec={"bracket":{"lo":bracket[0][:3],"hi":bracket[1][:3]},"failure":failure}
              if failure is None:
                  H=L; neighbors=[]
                  for hh in (H-1,H,H+1):
                      rr=get(tpl.format(h=hh),15); z=parse_block(rr,hh)
                      neighbors.append({"height":hh,"parsed":z,"status":rr.get("status"),
                                        "url":rr.get("url"),"sha256":rr.get("sha256"),
                                        "error":rr.get("error"),"body_excerpt":rr.get("body","")[:4000]})
                  rec["H_vote_end_block"]=H;rec["neighbors"]=neighbors
              exact[name]=rec

          # CDX snapshots are independent of the live explorer backend.
          cdx=[
            "https://web.archive.org/cdx/search/cdx?url=www.mintscan.io/secret/block/*&from=20231206&to=20231208&output=json&filter=statuscode:200&collapse=urlkey&limit=1000",
            "https://web.archive.org/cdx/search/cdx?url=atomscan.com/secret-network/block/*&from=20231206&to=20231208&output=json&filter=statuscode:200&collapse=urlkey&limit=1000",
            "https://web.archive.org/cdx/search/cdx?url=secretnodes.com/secret/*&from=20231206&to=20231208&output=json&filter=statuscode:200&collapse=urlkey&limit=1000",
            "https://web.archive.org/cdx/search/cdx?url=secret.explorers.guru/block/*&from=20231206&to=20231208&output=json&filter=statuscode:200&collapse=urlkey&limit=1000",
          ]
          cdx_rows=[]
          for u in cdx:
              r=get(u,25)
              cdx_rows.append({"url":u,"ok":r.get("ok"),"status":r.get("status"),
                               "sha256":r.get("sha256"),"error":r.get("error"),
                               "body_excerpt":r.get("body","")[:30000]})

          # Frontend bundle discovery, metadata-only.
          frontends={}
          for u in ["https://www.mintscan.io/secret","https://atomscan.com/secret-network/",
                    "https://secretnodes.com/secret","https://secret.explorers.guru"]:
              r=get(u,20); body=r.get("body","")
              scripts=sorted(set(re.findall(r"""<script[^>]+src=["']([^"']+)""",body,re.I)))
              hosts=sorted(set(re.findall(r"""https?://[^"'<> ]+""",body)))
              frontends[u]={"ok":r.get("ok"),"status":r.get("status"),"error":r.get("error"),
                            "sha256":r.get("sha256"),"scripts":scripts[:150],"hosts":hosts[:150],
                            "body_excerpt":body[:12000]}

          out={
            "scope":"SOURCE_ONLY_NO_MARKET_DATA",
            "technical_correction_of":"V27",
            "scientific_rules_changed":False,
            "target_voting_end":TARGET,
            "rule":"Estimated heights are discovery aids only. Canonical H requires actual immutable historical block metadata proving first timestamp >= voting end.",
            "tested_utc":datetime.datetime.now(datetime.timezone.utc).isoformat(),
            "grid_results":rows,
            "exact_candidates":exact,
            "wayback_cdx":cdx_rows,
            "frontend_discovery":frontends,
          }
          os.makedirs(os.path.dirname(OUT),exist_ok=True)
          with open(OUT,"w",encoding="utf-8") as f: json.dump(out,f,indent=2,ensure_ascii=False)
          print("SCRT287_V30",json.dumps({"parsed_grid":sum(1 for r in rows if r.get("parsed")),
                                         "exact_sources":list(exact.keys())}))
          PY
      - name: Persist corrected public-index/archive receipt
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/cosmos_native_emission_param_shock_001_v0_2/SCRT287_PUBLIC_INDEX_ARCHIVE_PROBE_V30.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "SCRT287: persist corrected public index/archive source probe v30"
          git push origin HEAD:cosmos-native-emission-param-shock-001-v0.2-t0-remediation-2026-10-07
