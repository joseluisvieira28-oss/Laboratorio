name: DLS Source Credential Audit 2026-09-21

on:
  push:
    branches:
      - defi-liquidation-shock-source-audit-2026-09-21
    paths:
      - '.github/workflows/dls-source-credential-audit-2026-09-21.yml'

permissions:
  contents: write

jobs:
  zero-rpc-readiness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: defi-liquidation-shock-source-audit-2026-09-21
          fetch-depth: 0

      - name: Verify source-only governance
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path('labs/DEFI_LIQUIDATION_SHOCK_001/MANIFEST_V0.6.json').read_text())
          assert m['source_data_pass'] is False
          assert m['outcome_accessed'] is False
          for k in ['prices','returns','pnl','direction','live_trading','orders','wallets','exchange_mutation','alerts_webhooks','merge_main']:
              assert m['governance'][k] is False
          print('DLS_SOURCE_ONLY_GOVERNANCE_GUARD_PASS')
          PY

      - name: Check credential presence only and persist receipt
        env:
          HELIUS_API_KEY: ${{ secrets.HELIUS_API_KEY }}
          DLS_RPC_URL: ${{ secrets.DLS_RPC_URL }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          helius=bool(os.environ.get('HELIUS_API_KEY'))
          explicit=bool(os.environ.get('DLS_RPC_URL'))
          status='ARCHIVAL_RPC_CREDENTIAL_PRESENT' if (helius or explicit) else 'ARCHIVAL_RPC_CREDENTIAL_ABSENT'
          out={
            'lab_id':'DEFI-LIQUIDATION-SHOCK-001',
            'audit_date':'2026-09-21',
            'status':status,
            'helius_api_key_present':helius,
            'explicit_rpc_url_present':explicit,
            'rpc_request_made':False,
            'bigquery_request_made':False,
            'prices_opened':False,
            'returns_opened':False,
            'pnl_opened':False,
            'year_2025_or_2026_opened':False,
            'live_trading':False,
            'exchange_mutation':False,
            'secret_values_recorded':False
          }
          p=Path('labs/DEFI_LIQUIDATION_SHOCK_001/audit_receipts')
          p.mkdir(parents=True,exist_ok=True)
          (p/'DLS_ARCHIVAL_RPC_CREDENTIAL_READINESS_2026_09_21.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          print(json.dumps(out,sort_keys=True))
          PY
          git config user.name "crypto-lab-source-audit"
          git config user.email "actions@users.noreply.github.com"
          git add labs/DEFI_LIQUIDATION_SHOCK_001/audit_receipts/
          git commit -m "audit: persist DLS archival credential readiness"
          git push origin HEAD:defi-liquidation-shock-source-audit-2026-09-21
