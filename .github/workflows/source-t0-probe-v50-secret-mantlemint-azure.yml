name: source-t0-probe-v50-secret-mantlemint-azure
on:
  push:
    branches: [cosmos-native-emission-param-shock-001-v0.2-t0-remediation-2026-10-07]
    paths: [.github/workflows/source-t0-probe-v50-secret-mantlemint-azure.yml]
permissions: {contents: write}
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with: {ref: cosmos-native-emission-param-shock-001-v0.2-t0-remediation-2026-10-07}
      - name: Probe Mantlemint Azure snapshot inventory
        run: |
          python3 - <<'PY'
          import json,urllib.request,urllib.error,ssl,os,datetime,re
          BASE="https://engfilestorage.blob.core.windows.net/mm-snapshots"
          OUT="research/cosmos_native_emission_param_shock_001_v0_2/SCRT287_MANTLEMINT_AZURE_V50.json"
          UA={"User-Agent":"CryptoLab-source-only-v50"}
          def req(u,method="GET",to=12):
            try:
              q=urllib.request.Request(u,headers=UA,method=method)
              with urllib.request.urlopen(q,timeout=to,context=ssl._create_unverified_context()) as r:
                b=r.read(200000 if method=="GET" else 0)
                return {"ok":True,"status":r.status,"url":r.geturl(),"headers":dict(r.headers),
                        "body":b.decode("utf-8","replace")}
            except urllib.error.HTTPError as e:
              try:b=e.read(50000)
              except:b=b""
              return {"ok":False,"status":e.code,"url":u,"headers":dict(e.headers or {}),"error":str(e),
                      "body":b.decode("utf-8","replace")}
            except Exception as e:return {"ok":False,"status":None,"url":u,"headers":{},"error":repr(e),"body":""}
          listing=req(BASE+"?restype=container&comp=list",to=15)
          blobs=[]
          if listing["ok"]:
            blobs=re.findall(r"<Name>([^<]+)</Name>",listing["body"])
          # Probe likely snapshot cadence around historical region + known control.
          heights=sorted(set([3340000]+list(range(9000000,13000001,100000))+list(range(11500000,12200001,10000))))
          heads=[]
          for h in heights:
            u=f"{BASE}/height_{h}.tar"
            r=req(u,"HEAD",8)
            if r["status"] not in (404,None) or h==3340000:
              heads.append({"height":h,"url":u,"ok":r["ok"],"status":r["status"],
                "content_length":r["headers"].get("Content-Length"),"last_modified":r["headers"].get("Last-Modified"),
                "etag":r["headers"].get("ETag"),"error":r.get("error")})
          out={"scope":"SOURCE_ONLY_NO_MARKET_DATA","tested_utc":datetime.datetime.now(datetime.timezone.utc).isoformat(),
            "source_doc":"Secret Network Mantlemint docs",
            "container":BASE,"list_probe":{"ok":listing["ok"],"status":listing["status"],"error":listing.get("error"),
              "headers":listing["headers"],"body_excerpt":listing["body"][:10000]},
            "listed_blob_count":len(blobs),"listed_blobs":blobs[:10000],"positive_or_control_heads":heads}
          os.makedirs(os.path.dirname(OUT),exist_ok=True);open(OUT,"w").write(json.dumps(out,indent=2))
          print("V50",json.dumps({"list_ok":listing["ok"],"blob_count":len(blobs),"heads":heads}))
          PY
      - name: Persist
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/cosmos_native_emission_param_shock_001_v0_2/SCRT287_MANTLEMINT_AZURE_V50.json
          git commit -m "SCRT287: persist Mantlemint Azure snapshot probe v50"
          git pull --rebase origin cosmos-native-emission-param-shock-001-v0.2-t0-remediation-2026-10-07
          git push origin HEAD:cosmos-native-emission-param-shock-001-v0.2-t0-remediation-2026-10-07
