name: ETH Staking Flow 001 — Xatu V0.3A Metadata Feasibility

on:
  workflow_dispatch:
  push:
    branches:
      - eth-staking-flow-v0.3-xatu
    paths:
      - '.github/workflows/eth-staking-flow-xatu-v03a-metadata.yml'

permissions:
  contents: read

jobs:
  v03a-metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install metadata dependencies
        run: pip install --disable-pip-version-check pyarrow fsspec aiohttp
      - name: Static compile
        run: python -m py_compile research/eth_staking_flow/xatu_v03a_metadata_probe.py
      - name: Execute V0.3A metadata feasibility
        run: python research/eth_staking_flow/xatu_v03a_metadata_probe.py
      - name: Upload receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ETH_STAKING_FLOW_001_XATU_V03A_METADATA
          path: xatu_v03a_metadata_output/ETH_STAKING_FLOW_001_XATU_V03A_METADATA_RECEIPT.json
          if-no-files-found: warn
          retention-days: 30
