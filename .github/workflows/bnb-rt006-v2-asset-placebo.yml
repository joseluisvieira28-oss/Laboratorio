name: BNB RT006 V2 Asset Placebo

on:
  workflow_dispatch:
  push:
    branches:
      - crypto-lab-adversarial-review-v0.1
    paths:
      - "adversarial_review/pilots/BNB-LAUNCHPOOL-DEMAND-001/rt006_v2_asset_placebo_protocol_v0_1.json"
      - "adversarial_review/pilots/BNB-LAUNCHPOOL-DEMAND-001/rt006_v2_asset_placebo_runner_v0_1.py"
      - ".github/workflows/bnb-rt006-v2-asset-placebo.yml"

concurrency:
  group: bnb-rt006-v2-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  asset-placebo:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile
        run: python -m py_compile adversarial_review/pilots/BNB-LAUNCHPOOL-DEMAND-001/rt006_v2_asset_placebo_runner_v0_1.py
      - name: Run frozen RT006 V2
        run: python adversarial_review/pilots/BNB-LAUNCHPOOL-DEMAND-001/rt006_v2_asset_placebo_runner_v0_1.py
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bnb-rt006-v2-asset-placebo
          path: adversarial_review/pilots/BNB-LAUNCHPOOL-DEMAND-001/rt006_v2_asset_placebo_result_v0_1.json
          if-no-files-found: error
