name: CROSS-VENUE-DIAMOND-REPLICATION-001 Source Coverage

on:
  pull_request:
    branches: [ main ]
    paths:
      - "governance/CROSS_VENUE_DIAMOND_REPLICATION_001_DONCHIAN6H_FREEZE_2026-09-18.md"
      - "Dream-Account-OS-v2.3-PARTIAL/research/cross_venue_diamond_replication_001/**"
      - ".github/workflows/cross-venue-diamond-replication-001-source-probe.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout frozen replication branch
        uses: actions/checkout@v4

      - name: Python version
        run: python --version

      - name: Compile source probe
        run: python -m py_compile Dream-Account-OS-v2.3-PARTIAL/research/cross_venue_diamond_replication_001/okx_dateaggr_probe_v01.py

      - name: Execute outcome-blind source coverage gate
        run: python Dream-Account-OS-v2.3-PARTIAL/research/cross_venue_diamond_replication_001/okx_dateaggr_probe_v01.py

      - name: Upload source coverage receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cross-venue-diamond-replication-001-okx-dateaggr-diag-v01
          path: Dream-Account-OS-v2.3-PARTIAL/research/local_data/cross_venue_diamond_replication_001_okx_dateaggr_diag_v01/
          if-no-files-found: error
