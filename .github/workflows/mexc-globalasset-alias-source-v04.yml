name: MEXC GlobalAsset Alias Source V0.4

on:
  push:
    branches:
      - mexc-globalasset-alias-v0.4-source-gate-2026-10-04

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependency
        run: python -m pip install --disable-pip-version-check requests
      - name: Freeze check
        run: |
          test "$GITHUB_REF_NAME" = "mexc-globalasset-alias-v0.4-source-gate-2026-10-04"
          test -f research/mexc_global_assets/MEXC_GLOBALASSET_ALIAS_MAP_V0.4.json
          test -f research/mexc_global_assets/MEXC_GLOBALASSET_ALIAS_SOURCE_FREEZE_V0.4.md
          python -m py_compile research/mexc_global_assets/mexc_globalasset_alias_source_v04.py
          echo ALIAS_SOURCE_PRE_OUTCOME_FREEZE_PASS
      - name: Run alias source gate
        run: python research/mexc_global_assets/mexc_globalasset_alias_source_v04.py
      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: mexc-globalasset-alias-v04-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/mexc_global_assets/globalasset_alias_source_v04
          if-no-files-found: error
          retention-days: 90