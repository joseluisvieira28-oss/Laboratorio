name: Binance Listing V0.3 Frozen 2025 Holdout
on:
  push:
    branches: [binance-listing-information-cascade-v0.1-prereg-2026-10-05]
    paths: ['.github/workflows/binance_listing_v03_2025_holdout.yml']
permissions: {contents: write}
jobs:
  holdout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: binance-listing-information-cascade-v0.1-prereg-2026-10-05}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python research/binance_listing_information_cascade/run_v03_2025_holdout.py
      - run: |
          git pull --rebase
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/binance_listing_information_cascade/results_v03_2025_holdout
          git diff --cached --quiet || (git commit -m "Record frozen V0.3 2025 holdout result" && git push)
