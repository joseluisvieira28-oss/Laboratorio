name: BTC-OPTIONS-VRP-001 Source Gate V0.1

on:
  push:
    branches:
      - btc-options-vrp-v0.1
    paths:
      - '.github/workflows/btc-options-vrp-source-gate-v01.yml'
      - 'labs/BTC_OPTIONS_VRP_001/**'

permissions:
  contents: read

jobs:
  source-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: btc-options-vrp-v0.1
      - name: Verify frozen authority
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          a=json.load(open('labs/BTC_OPTIONS_VRP_001/SOURCE_AUTHORITY_V0.1.json'))
          assert a['outcomes_authorized'] is False
          assert a['future_realized_variance_authorized'] is False
          assert a['btc_forward_returns_authorized'] is False
          assert a['pnl_authorized'] is False
          assert a['access_2025_authorized'] is False
          assert a['access_2026_authorized'] is False
          assert a['binance']['inspect_price_columns'] is False
          print('SOURCE_AUTHORITY_PASS')
          PY
      - name: Compile source-only runner
        run: python -m py_compile labs/BTC_OPTIONS_VRP_001/source_gate_v01.py
      - name: Execute source-only gate
        run: python labs/BTC_OPTIONS_VRP_001/source_gate_v01.py
      - name: Upload source evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: btc-options-vrp-source-gate-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/btc_options_vrp_source_v01/
          retention-days: 90
