name: DLS Drift Fourth Class Candidate RAW V0.1

on:
  push:
    branches:
      - dls-drift-sqd-boundary-v01
    paths:
      - .github/workflows/dls-drift-fourth-class-candidate-raw-v01.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile
        run: python -m py_compile labs/DEFI_LIQUIDATION_SHOCK_001/source/verify_drift_fourth_class_candidate_raw_v0_1.py
      - name: Verify candidate via official Solana RPC
        run: python labs/DEFI_LIQUIDATION_SHOCK_001/source/verify_drift_fourth_class_candidate_raw_v0_1.py
      - name: Upload receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dls-drift-fourth-class-first-candidate-raw-v01
          path: labs/DEFI_LIQUIDATION_SHOCK_001/DRIFT_FOURTH_CLASS_FIRST_CANDIDATE_RAW_RECEIPT_V0.1.json
          if-no-files-found: error
          retention-days: 30
      - name: Firewall
        if: always()
        run: echo SOURCE_ONLY_TRUE
