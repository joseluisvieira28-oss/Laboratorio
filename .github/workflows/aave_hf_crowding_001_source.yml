name: AAVE-HF-CROWDING-001 Official MCP Source Gate

on:
  push:
    branches:
      - aave-health-factor-crowding-v0.1
    paths:
      - 'Dream-Account-OS-v2.3-PARTIAL/research/AAVE_HF_CROWDING_001_SOURCE_TRIGGER.txt'

permissions:
  contents: write

jobs:
  source:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: aave-health-factor-crowding-v0.1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run official Aave MCP source capability gate
        run: python Dream-Account-OS-v2.3-PARTIAL/research/aave_hf_crowding_001_source_capability.py
      - name: Commit immutable source receipt
        run: |
          git config user.name "crypto-lab-bot"
          git config user.email "actions@users.noreply.github.com"
          git add Dream-Account-OS-v2.3-PARTIAL/runtime/aave_hf_crowding_001_source_capability_receipt.json
          git diff --cached --quiet && exit 0
          git commit -m "research: record AAVE-HF-CROWDING source capability receipt"
          git push origin HEAD:aave-health-factor-crowding-v0.1
