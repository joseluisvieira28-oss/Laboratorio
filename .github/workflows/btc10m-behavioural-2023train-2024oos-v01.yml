name: BTC 10m Behavioural Conditions 2023 Train Q4 Select 2024 Single Sealed OOS
on:
  push:
    branches:
      - research/btc10m-behavioural-conditions-discovery-2023train-2024oos-v01-2026-11-01
    paths:
      - .github/workflows/btc10m-behavioural-2023train-2024oos-v01.yml
permissions:
  contents: read
jobs:
  historical-conditions-and-one-sealed-oos:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install reproducible numerical and model dependencies
        run: python -m pip install numpy==2.1.3 pandas==2.2.3 scikit-learn==1.6.1
      - name: Synthetic time-series no-future-leakage guards BEFORE any market file
        run: |
          python -m py_compile research/btc10m_behavioural_v01/btc10m_behavioural_condition_scan_v01.py
          python -c "import sys;sys.path.insert(0,'research/btc10m_behavioural_v01');import btc10m_behavioural_condition_scan_v01 as m;m.unit_tests();print('NO_LOOKAHEAD_SYNTHETIC_GUARDS_PASS')"
      - name: Exact 24 Binance official 2023/2024 spot ZIP checksum source and 8-condition 2023 selection, single 2024 OOS
        run: python -u research/btc10m_behavioural_v01/btc10m_behavioural_condition_scan_v01.py
      - if: always()
        name: Preserve original ZIPs, official checksums, source hashes, 2023-only selection, exactly one selected 2024 signals + explicit fail receipt
        uses: actions/upload-artifact@v4
        with:
          name: btc10m-behavioural-conditions-2023-selection-2024-oos-v01
          path: artifacts/btc10m_behavioural_discovery_v01/
          if-no-files-found: warn
          compression-level: 1
