name: CRYPTO EDGE RADAR V0.9 PROMOTION SPRINT

on:
  push:
    branches:
      - crypto-edge-radar-promotion-sprint-v0.9
      - crypto-edge-radar-cleanup-v1
    paths:
      - 'crypto_edge_radar/**'
      - '.github/workflows/crypto-edge-radar-v09-promotion.yml'
  workflow_dispatch:

concurrency:
  group: crypto-edge-radar-v09-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deterministic-safety:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crypto_edge_radar
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install runtime dependencies
        run: python -m pip install -e .
      - name: Compile radar and tests
        run: python -m compileall radar tests
      - name: Full deterministic unit suite
        run: python -m unittest discover -s tests -v

  tfg-mexc-spot-source-gate:
    needs: deterministic-safety
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crypto_edge_radar
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install runtime dependencies
        run: python -m pip install -e .
      - name: Prepare receipts
        run: mkdir -p v09_artifacts
      - name: Real public MEXC Spot TFG source probe
        run: |
          python - <<'PY'
          from datetime import datetime, timezone
          import json
          from pathlib import Path
          from radar.strategies.tfg_donchian_regime_forward import MEXCSpotKlineFeed, source_probe

          now_ms = int(datetime.now(timezone.utc).timestamp() * 1000)
          receipt = source_probe(MEXCSpotKlineFeed(timeout=15), now_ms=now_ms)
          Path('v09_artifacts/tfg_mexc_spot_source_probe.json').write_text(
              json.dumps(receipt, indent=2, sort_keys=True) + '\n', encoding='utf-8'
          )
          assert receipt['status'] == 'PASS_SOURCE_ONLY', receipt
          assert receipt['provider'] == 'MEXC_SPOT_PUBLIC', receipt
          assert receipt['market'] == 'SPOT', receipt
          assert receipt['endpoint'] == '/api/v3/klines', receipt
          assert receipt['authenticated_exchange_api_used'] is False, receipt
          assert receipt['order_created'] is False, receipt
          assert receipt['exchange_mutation_performed'] is False, receipt
          assert set(receipt['coverage']) == {'BTCUSDT','ETHUSDT','SOLUSDT','BNBUSDT','XRPUSDT','DOGEUSDT'}, receipt
          for symbol, row in receipt['coverage'].items():
              assert row['12h_complete_rows'] >= 40, (symbol, row)
              assert row['1d_rows'] >= 220, (symbol, row)
          print(json.dumps(receipt, sort_keys=True))
          PY
      - name: Upload TFG source receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crypto-edge-radar-v09-tfg-mexc-spot-source
          path: crypto_edge_radar/v09_artifacts/
          if-no-files-found: error
          retention-days: 30

  bnb-launchpool-market-source-gate:
    needs: deterministic-safety
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crypto_edge_radar
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install runtime dependencies
        run: python -m pip install -e .
      - name: Prepare receipts
        run: mkdir -p v09_artifacts
      - name: Real public Binance Spot BNBBTC 15m source probe
        run: |
          python - <<'PY'
          from datetime import datetime, timezone
          import json
          from pathlib import Path
          from radar.strategies.bnb_launchpool_demand import BinanceSpotBNBBTCKlineFeed, source_probe

          now_ms = int(datetime.now(timezone.utc).timestamp() * 1000)
          receipt = source_probe(BinanceSpotBNBBTCKlineFeed(timeout=15), now_ms=now_ms)
          Path('v09_artifacts/bnb_launchpool_bnbbtc_source_probe.json').write_text(
              json.dumps(receipt, indent=2, sort_keys=True) + '\n', encoding='utf-8'
          )
          assert receipt['status'] == 'PASS_SOURCE_ONLY', receipt
          assert receipt['strategy_id'] == 'BNB-LAUNCHPOOL-DEMAND-001', receipt
          assert receipt['provider'] == 'BINANCE_SPOT_DATA_API_PUBLIC', receipt
          assert receipt['market'] == 'SPOT', receipt
          assert receipt['symbol'] == 'BNBBTC', receipt
          assert receipt['interval'] == '15m', receipt
          assert receipt['complete_15m_rows'] >= 190, receipt
          assert receipt['authenticated_exchange_api_used'] is False, receipt
          assert receipt['order_created'] is False, receipt
          assert receipt['exchange_mutation_performed'] is False, receipt
          probe = receipt['strict_entry_rule_probe']
          assert probe['entry_after_boundary'] > probe['signal_on_boundary'], receipt
          assert probe['entry_after_inside_bar'] > probe['signal_inside_bar'], receipt
          print(json.dumps(receipt, sort_keys=True))
          PY
      - name: Upload BNB market-source receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crypto-edge-radar-v09-bnb-launchpool-bnbbtc-source
          path: crypto_edge_radar/v09_artifacts/
          if-no-files-found: error
          retention-days: 30

  bnb-launchpool-official-source-gate:
    needs: deterministic-safety
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crypto_edge_radar
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install runtime dependencies
        run: python -m pip install -e .
      - name: Prepare receipts
        run: mkdir -p v09_artifacts
      - name: Real official Binance Support CMS source probe
        run: |
          python - <<'PY'
          from datetime import datetime, timezone
          import json
          from pathlib import Path
          from radar.bnb_launchpool_watcher import BinanceOfficialLaunchpoolSource

          now_ms = int(datetime.now(timezone.utc).timestamp() * 1000)
          receipt = BinanceOfficialLaunchpoolSource(timeout=15).source_probe(now_ms=now_ms)
          Path('v09_artifacts/bnb_launchpool_official_cms_source_probe.json').write_text(
              json.dumps(receipt, indent=2, sort_keys=True) + '\n', encoding='utf-8'
          )
          assert receipt['status'] == 'PASS_SOURCE_ONLY', receipt
          assert receipt['provider'] == 'BINANCE_SUPPORT_CMS_PUBLIC', receipt
          assert receipt['catalog_id'] == 48, receipt
          assert receipt['authenticated_exchange_api_used'] is False, receipt
          assert receipt['order_created'] is False, receipt
          assert receipt['exchange_mutation_performed'] is False, receipt
          print(json.dumps(receipt, sort_keys=True))
          PY
      - name: Upload BNB official-source receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crypto-edge-radar-v09-bnb-launchpool-official-cms-source
          path: crypto_edge_radar/v09_artifacts/
          if-no-files-found: error
          retention-days: 30

  forward-shadow-e2e-smoke:
    needs:
      - tfg-mexc-spot-source-gate
      - bnb-launchpool-market-source-gate
      - bnb-launchpool-official-source-gate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crypto_edge_radar
    env:
      RADAR_DB: /tmp/radar_v09_forward_smoke.sqlite3
      RADAR_FORWARD_STATUS: /tmp/radar_v09_forward_status.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install runtime dependencies
        run: python -m pip install -e .
      - name: Run one integrated public-shadow cycle
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from radar.config import Settings
          from radar.forward_web import ForwardShadowRuntime

          runtime = ForwardShadowRuntime(settings=Settings.from_env())
          state = runtime.run_cycle()
          assert state['health'] == 'OK', state
          assert state['evidence_backend'] == 'sqlite', state
          assert state['authenticated_exchange_api_used'] is False, state
          assert state['orders_created'] is False, state
          assert state['exchange_mutation_performed'] is False, state
          Path('v09_forward_e2e_state.json').write_text(
              json.dumps(state, indent=2, sort_keys=True) + '\n', encoding='utf-8'
          )
          print(json.dumps(state, sort_keys=True))
          PY
      - name: Upload integrated shadow state
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crypto-edge-radar-v09-forward-shadow-e2e
          path: crypto_edge_radar/v09_forward_e2e_state.json
          if-no-files-found: error
          retention-days: 30
