name: MFIBR V0.1.2 Article Transport Probe
on:
  push:
    branches:
      - mexc-funding-interval-basis-replication-v0.1-source-2026-10-07
    paths:
      - research/mexc_funding_interval_basis_replication/article_transport_probe_v012.py
      - .github/workflows/mfibr_v012_article_transport_probe.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - run: python research/mexc_funding_interval_basis_replication/article_transport_probe_v012.py
