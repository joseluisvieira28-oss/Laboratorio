name: MEXC V0.13.1 Liquidation Independent Topic Ack Audit

on:
  push:
    branches:
      - mexc-event-futures-v013-source-completion-2026-10-03
    paths:
      - '.github/workflows/mexc-event-futures-v0131-liquidation-ack-audit.yml'

permissions:
  contents: read

jobs:
  ack-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install websockets==15.0.1
      - name: Run 90-second independent-topic public source audit
        run: python research/mexc_event_futures/liquidation_eth_source_completion_v0131.py --seconds 90 --output evidence/liquidation-v0131-ack-audit
      - name: Summarize
        if: always()
        run: |
          python - <<'PY'
          import json
          p='evidence/liquidation-v0131-ack-audit/receipt.json'
          j=json.load(open(p))
          print('VERDICT='+j['verdict'])
          print('BTC_ACK='+str(j['state']['BTCUSDT']['ack']))
          print('ETH_ACK='+str(j['state']['ETHUSDT']['ack']))
          print('BTC_VALID='+str(j['state']['BTCUSDT']['valid_events']))
          print('ETH_VALID='+str(j['state']['ETHUSDT']['valid_events']))
          print('OUTCOMES_OPENED='+str(j['research_outcomes_opened']))
          PY
      - name: Preserve evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v0131-liquidation-independent-topic-ack-audit
          path: evidence/liquidation-v0131-ack-audit/
          if-no-files-found: error
          retention-days: 90
