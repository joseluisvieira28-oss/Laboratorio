name: News Shock Lab V0.3A BLS Actuals Amendment 03

on:
  push:
    branches:
      - dream-account-phase-b-signal-research-v0.1
    paths:
      - 'Dream-Account-OS-v2.3-PARTIAL/research/news_shock_lab_v03a_bls_actuals_amend03.py'
      - 'Dream-Account-OS-v2.3-PARTIAL/research/NEWS_SHOCK_LAB_V03A_BLS_ARCHIVE_FORMAT_NORMALIZATION_AMENDMENT_V0.3.json'
      - '.github/workflows/news-shock-lab-v03a-bls-actuals-amend03.yml'
  workflow_dispatch:

jobs:
  news-shock-v03a-bls-actuals-amend03:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify frozen V0.3A authority and parser amendment 03
        run: |
          cd Dream-Account-OS-v2.3-PARTIAL
          python -m pip install beautifulsoup4
          python -m compileall -q research
          python - <<'PY'
          from research.news_shock_lab_v03a_provenance import load_freeze
          from research.news_shock_lab_v03a_bls_actuals_amend03 import load_amendment, EXPECTED_AMENDMENT_FINGERPRINT
          freeze = load_freeze()
          amendment = load_amendment()
          if amendment['parent_freeze_fingerprint'] != freeze['fingerprint']:
              raise SystemExit('NEWS V0.3A AMEND03 PARENT FREEZE BLOCK')
          if amendment['authority']['authorizes_parser_normalization_only'] is not True:
              raise SystemExit('NEWS V0.3A AMEND03 AUTHORITY BLOCK')
          if amendment['trigger']['crypto_market_outcomes_accessed'] is not False:
              raise SystemExit('NEWS V0.3A AMEND03 OUTCOME BLOCK')
          if amendment['normalization']['headline_and_core_actuals_source'] != 'TABLE_A_ROWS':
              raise SystemExit('NEWS V0.3A AMEND03 TABLE A SOURCE BLOCK')
          print('NEWS V0.3A ACTUALS AMEND03 AUTHORITY PASS', EXPECTED_AMENDMENT_FINGERPRINT)
          PY
      - name: Collect all consecutive BLS actuals from frozen Table A rows
        run: |
          cd Dream-Account-OS-v2.3-PARTIAL
          mkdir -p research/local_data/news_v03a_actuals_amend03_output
          set -o pipefail
          python -m research.news_shock_lab_v03a_bls_actuals_amend03 \
            research/local_data/news_v03a_actuals_amend03_output/cpi_actual_provenance_manifest.json \
            research/local_data/news_v03a_actuals_amend03_output/actuals_validation_receipt.json \
            | tee research/local_data/news_v03a_actuals_amend03_output/bls_actuals_stdout.txt
      - name: Assert complete actual provenance and untouched outcome guards
        run: |
          cd Dream-Account-OS-v2.3-PARTIAL
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('research/local_data/news_v03a_actuals_amend03_output')
          manifest = json.loads((root/'cpi_actual_provenance_manifest.json').read_text())
          validation = json.loads((root/'actuals_validation_receipt.json').read_text())
          if manifest['event_count'] != 44:
              raise SystemExit('NEWS V0.3A AMEND03 EVENT COUNT DRIFT')
          if validation['status_counts'].get('ACTUAL_PROVENANCE_INCOMPLETE', 0) != 0:
              raise SystemExit('NEWS V0.3A AMEND03 ACTUAL PROVENANCE INCOMPLETE')
          if validation['complete_a_count'] != 0 or validation['complete_b_count'] != 0:
              raise SystemExit('NEWS V0.3A AMEND03 FALSE CONSENSUS COMPLETION')
          guards = manifest['guards']
          required_false = ['market_outcomes_accessed','crypto_returns_computed','profitability_computed','holdout_2026_accessed','mexc_2025_09_through_2025_12_accessed']
          for key in required_false:
              if guards.get(key) is not False:
                  raise SystemExit(f'NEWS V0.3A AMEND03 GUARD DRIFT: {key}')
          print('NEWS V0.3A AMEND03 VALIDATION PASS', manifest['fingerprint'])
          PY
      - name: Upload V0.3A BLS Amendment 03 receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: news-shock-v03a-bls-actuals-amend03-${{ github.sha }}
          path: |
            Dream-Account-OS-v2.3-PARTIAL/research/local_data/news_v03a_actuals_amend03_output/cpi_actual_provenance_manifest.json
            Dream-Account-OS-v2.3-PARTIAL/research/local_data/news_v03a_actuals_amend03_output/actuals_validation_receipt.json
            Dream-Account-OS-v2.3-PARTIAL/research/local_data/news_v03a_actuals_amend03_output/bls_actuals_stdout.txt
          if-no-files-found: warn
          retention-days: 30
