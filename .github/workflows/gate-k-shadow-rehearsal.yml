name: Gate K shadow rehearsal

on:
  push:
    branches:
      - dream-account-gate-k-execution-layer-v0.1
    paths:
      - '.gate-k-shadow-rehearsal-trigger.txt'

permissions:
  contents: read

env:
  MEXC_READONLY_SCOPE_ATTESTED: '1'
  MEXC_READONLY_RECONCILE_ENABLE: '1'
  MEXC_SHADOW_REHEARSAL_ENABLE: '1'
  MEXC_READONLY_ACCESS_KEY: ${{ secrets.MEXC_READONLY_ACCESS_KEY }}
  MEXC_READONLY_SECRET_KEY: ${{ secrets.MEXC_READONLY_SECRET_KEY }}

jobs:
  rehearse:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Dream-Account-OS-v2.3-PARTIAL
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Gate K branch
        run: python -m pip install -e .
      - name: Re-prove execution boundary is GET-only
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          files = sorted(Path('src/dream_account').glob('execution*.py'))
          hits = []
          for path in files:
              tree = ast.parse(path.read_text(encoding='utf-8'), filename=str(path))
              for node in ast.walk(tree):
                  if not isinstance(node, ast.Call):
                      continue
                  func = node.func
                  if isinstance(func, ast.Attribute) and func.attr.lower() in {'post','put','patch','delete'}:
                      hits.append(f'{path}:{node.lineno}:{func.attr}')
                  name = func.id if isinstance(func, ast.Name) else (func.attr if isinstance(func, ast.Attribute) else '')
                  if name == 'Request':
                      method_kw = next((kw.value for kw in node.keywords if kw.arg == 'method'), None)
                      if not (isinstance(method_kw, ast.Constant) and isinstance(method_kw.value, str) and method_kw.value.upper() == 'GET'):
                          hits.append(f'{path}:{node.lineno}:non-GET urllib Request')
          if hits:
              raise SystemExit('BLOCKED: network mutation primitive detected: ' + '; '.join(hits))
          print(f'PASS: {len(files)} execution modules are GET-only')
          PY
      - name: Require read-only secrets without revealing values
        shell: bash
        run: |
          set -euo pipefail
          test -n "$MEXC_READONLY_ACCESS_KEY" || { echo 'BLOCKED: access-key secret missing'; exit 2; }
          test -n "$MEXC_READONLY_SECRET_KEY" || { echo 'BLOCKED: secret-key secret missing'; exit 2; }
          echo 'PASS: read-only secrets present; values not printed'
      - name: Run real-market plus deterministic shadow rehearsal
        shell: bash
        run: |
          set -euo pipefail
          python -m dream_account.execution_shadow_rehearsal > /tmp/gate-k-shadow-rehearsal.json
          python - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path('/tmp/gate-k-shadow-rehearsal.json').read_text(encoding='utf-8'))
          allowed = {
              'status','live_scan_status','live_pairs_scanned','live_fast_pass','live_deep_pass',
              'live_candidate_count','live_actionable_count','live_trade_proposals_created',
              'live_block_reason_counts','fixture_pipeline_state','fixture_submitted_to_exchange',
              'fixture_journal_integrity','fixture_idempotent_replay','reconciliation_status',
              'reconciliation_symbols_queried','reconciliation_daos_open_orders',
              'reconciliation_daos_recent_trades','exchange_mutation_routes','risk_semantics_note',
              'note','fingerprint'
          }
          unexpected = sorted(set(payload) - allowed)
          if unexpected:
              raise SystemExit(f'BLOCKED: unexpected report fields: {unexpected}')
          if not str(payload.get('status','')).startswith('PASS_'):
              raise SystemExit('BLOCKED: shadow rehearsal status not PASS')
          if payload.get('exchange_mutation_routes') != 0:
              raise SystemExit('BLOCKED: exchange mutation route invariant failed')
          if payload.get('fixture_submitted_to_exchange') is not False:
              raise SystemExit('BLOCKED: deterministic fixture claims exchange submission')
          if payload.get('fixture_pipeline_state') != 'SHADOW_RECORDED':
              raise SystemExit('BLOCKED: deterministic shadow pipeline did not reach SHADOW_RECORDED')
          if payload.get('fixture_journal_integrity') != 'ok' or payload.get('fixture_idempotent_replay') is not True:
              raise SystemExit('BLOCKED: journal/idempotency gate failed')
          if payload.get('reconciliation_status') != 'PASS_CLEAN':
              raise SystemExit('BLOCKED: MEXC read-only reconciliation not clean')
          if payload.get('live_trade_proposals_created') != 0:
              raise SystemExit('BLOCKED: Gate K real sizing is not frozen; live proposal creation forbidden')
          print(json.dumps(payload, sort_keys=True))
          PY
      - name: Final safety statement
        run: |
          echo 'PASS: Gate K shadow rehearsal completed.'
          echo 'Real market was observed; no live TradeProposal was manufactured without a complete upstream signal and frozen sizing authority.'
          echo 'No order, cancel, amend, transfer, withdraw, or other exchange mutation is implemented or authorized.'
