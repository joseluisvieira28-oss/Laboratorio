name: DLS Census Index Credential Presence V0.1

on:
  push:
    branches:
      - dls-kamino-save11-event-census-v0.1
    paths:
      - '.github/workflows/dls-census-index-credential-presence-v01.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DUNE_API_KEY: ${{ secrets.DUNE_API_KEY }}
      GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}
      GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}
      GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
      GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dls-kamino-save11-event-census-v0.1
          fetch-depth: 0

      - name: Presence-only preflight
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          names=[
            "DUNE_API_KEY",
            "GOOGLE_APPLICATION_CREDENTIALS_JSON",
            "GCP_SERVICE_ACCOUNT_JSON",
            "GOOGLE_CREDENTIALS",
            "GCP_PROJECT_ID",
          ]
          present={k:bool(os.environ.get(k)) for k in names}
          rec={
            "schema_version":"0.1",
            "lab_id":"DEFI-LIQUIDATION-SHOCK-001",
            "classification":"INDEX_CREDENTIAL_PRESENT" if any(present.values()) else "INDEX_CREDENTIAL_ABSENT",
            "presence":present,
            "secret_values_exposed":False,
            "network_requests_made":False,
            "prices":False,"returns":False,"pnl":False,"direction":False,
            "live_trading":False,"merge_main":False
          }
          p=Path("labs/DEFI_LIQUIDATION_SHOCK_001/KAMINO_SAVE11_INDEX_CREDENTIAL_PRESENCE_RECEIPT_V0.1.json")
          p.write_text(json.dumps(rec,indent=2,sort_keys=True)+"\n")
          print(json.dumps(rec,indent=2,sort_keys=True))
          PY

      - name: Persist receipt
        run: |
          git config user.name "crypto-lab-source-audit"
          git config user.email "actions@users.noreply.github.com"
          git add labs/DEFI_LIQUIDATION_SHOCK_001/KAMINO_SAVE11_INDEX_CREDENTIAL_PRESENCE_RECEIPT_V0.1.json
          git commit -m "dls: persist census index credential presence receipt" || true
          git push origin HEAD:dls-kamino-save11-event-census-v0.1
