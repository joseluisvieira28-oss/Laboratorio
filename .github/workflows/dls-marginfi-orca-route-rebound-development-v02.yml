name: DLS Marginfi Orca Route Rebound Development V0.2

on:
  push:
    branches:
      - dls-marginfi-orca-route-rebound-v02
    paths:
      - labs/DEFI_LIQUIDATION_SHOCK_001/LAUNCH_MARGINFI_ORCA_ROUTE_REBOUND_DEV_V02.marker

permissions:
  actions: read
  contents: read

jobs:
  development:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download exact pre-outcome READY candidate manifest
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 36783063662
          artifact-ids: 11128253922
          path: precheck

      - name: Compile frozen Development executor
        run: python -m py_compile labs/DEFI_LIQUIDATION_SHOCK_001/source/run_marginfi_orca_route_rebound_dev_v0_2.py

      - name: Execute frozen Oct-Dec Development
        run: >
          python labs/DEFI_LIQUIDATION_SHOCK_001/source/run_marginfi_orca_route_rebound_dev_v0_2.py
          --precheck-root precheck
          --workers 12

      - name: Upload immutable Development evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dls-marginfi-orca-route-rebound-development-v02
          path: |
            labs/DEFI_LIQUIDATION_SHOCK_001/MARGINFI_ORCA_ROUTE_REBOUND_V02_DEVELOPMENT_RECEIPT.json
            labs/DEFI_LIQUIDATION_SHOCK_001/MARGINFI_ORCA_ROUTE_REBOUND_V02_DEVELOPMENT_LEDGER.ndjson
            labs/DEFI_LIQUIDATION_SHOCK_001/MARGINFI_ORCA_ROUTE_REBOUND_V02_MARKET_DATA_MANIFEST.ndjson
          if-no-files-found: warn
          retention-days: 90

      - name: Firewall
        if: always()
        run: echo OCTDEC_DEV_ONLY_2025_2026_CLOSED_NO_TRADING
