name: MEXC Multi-Stable Historical Coverage Remediation V0.2.1

on:
  push:
    branches:
      - mexc-multistable-basis-v0.1-source-gate-2026-10-07
    paths:
      - 'research/mexc_multistable_basis/historical_coverage_remediation_v021.py'
      - 'research/mexc_multistable_basis/HISTORICAL_COVERAGE_REMEDIATION_V0.2.1.md'
      - '.github/workflows/mexc-multistable-basis-coverage-v021.yml'

permissions:
  contents: read

jobs:
  coverage-remediation:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - name: Compile
        run: python -m py_compile research/mexc_multistable_basis/historical_coverage_remediation_v021.py
      - name: Run source-only remediation
        run: python research/mexc_multistable_basis/historical_coverage_remediation_v021.py
      - uses: actions/upload-artifact@v4
        with:
          name: mexc-multistable-coverage-v021-${{ github.run_id }}
          path: artifacts/mexc_multistable_basis/coverage_v021/report.json
