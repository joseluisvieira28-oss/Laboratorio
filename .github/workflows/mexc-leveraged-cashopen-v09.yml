name: MEXC Leveraged CashOpen V0.9
on:
  push:
    branches: [mexc-leveraged-cashopen-v0.9-prereg-2026-10-05]
permissions: {contents: read}
jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install requests
      - run: |
          test -f research/mexc_global_assets/MEXC_LEVERAGED_CASHOPEN_FREEZE_V0.9.md
          python research/mexc_global_assets/mexc_leveraged_cashopen_v09.py
      - uses: actions/upload-artifact@v4
        with:
          name: leveraged-cashopen-v09-${{ github.run_id }}
          path: artifacts/mexc_global_assets/leveraged_cashopen_v09
