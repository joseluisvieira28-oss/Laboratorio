          repository: ${{ github.repository }}
          run-id: 36262823596
          pattern: dls-drift-sqd-final-authority-v04
          path: source_authority
          merge-multiple: true

      - name: Compile aggregate authority
        run: python -m py_compile labs/DEFI_LIQUIDATION_SHOCK_001/source/aggregate_drift_field_enrichment_v0_1.py

      - name: Aggregate Drift population field coverage
        run: >
          python labs/DEFI_LIQUIDATION_SHOCK_001/source/aggregate_drift_field_enrichment_v0_1.py
          --receipts population_receipts
