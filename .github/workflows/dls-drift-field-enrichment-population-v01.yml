            end: '2025-01-01T00:00:00Z'
            baseline_run: '36230135405'
            baseline_pattern: 'dls-drift-sqd-recovery-v04-d202412e'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download accepted canonical baseline evidence
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ matrix.baseline_run }}
          pattern: ${{ matrix.baseline_pattern }}
          path: baseline
          merge-multiple: true

      - name: Compile source-only Drift enrichment runner
        run: python -m py_compile labs/DEFI_LIQUIDATION_SHOCK_001/source/run_drift_field_enrichment_partition_v0_1.py

      - name: Re-query and exact-join canonical Drift population
        run: >
          python labs/DEFI_LIQUIDATION_SHOCK_001/source/run_drift_field_enrichment_partition_v0_1.py
          --start "${{ matrix.start }}"
          --end "${{ matrix.end }}"
          --baseline baseline
          --partition-id "${{ matrix.id }}"
          --out "enrichment/${{ matrix.id }}.json"

      - name: Upload enrichment partition receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dls-field-enrichment-drift-${{ matrix.id }}
          path: enrichment/${{ matrix.id }}.json
          if-no-files-found: warn
          retention-days: 30

      - name: Firewall
        if: always()
        run: echo SOURCE_ONLY_TRUE

  aggregate:
    needs: enrich
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
