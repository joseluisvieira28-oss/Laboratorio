name: ARQ-002-CSP-003 Light Source Census 2022 V0.1
on:
  push:
    branches: [arq002-csp003-clean-2022-2023-v0.1]
    paths:
      - research/arq002_csp003/ARQ002_CSP003_LIGHT_SOURCE_MONTH_V0.1.py
      - research/arq002_csp003/ARQ002_CSP003_LIGHT_SOURCE_AGG_V0.1.py
      - .github/workflows/arq002-csp003-light-source-2022-v01.yml
permissions:
  contents: read
jobs:
  month:
    strategy:
      fail-fast: false
      matrix:
        month: ["2022-01","2022-02","2022-03","2022-04","2022-05","2022-06","2022-07","2022-08","2022-09","2022-10","2022-11","2022-12"]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python research/arq002_csp003/ARQ002_CSP003_LIGHT_SOURCE_MONTH_V0.1.py --month ${{ matrix.month }}
      - uses: actions/upload-artifact@v4
        with:
          name: arq002-csp003-light-${{ matrix.month }}
          path: arq002_csp003_light_source_${{ matrix.month }}.json
          if-no-files-found: error
          retention-days: 30
  aggregate:
    needs: month
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: arq002-csp003-light-*
          path: monthly
          merge-multiple: true
      - run: python research/arq002_csp003/ARQ002_CSP003_LIGHT_SOURCE_AGG_V0.1.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arq002-csp003-light-source-2022-final
          path: ARQ002_CSP003_LIGHT_SOURCE_CENSUS_2022_V0.1.json
          if-no-files-found: error
          retention-days: 30
