name: source-t0-probe-v35b-secret-historical-gov-state-fast

on:
  workflow_dispatch:
  push:
    branches:
      - cosmos-native-emission-param-shock-001-v0.2-t0-remediation-2026-10-07
    paths:
      - .github/workflows/source-t0-probe-v35b-secret-historical-gov-state-fast.yml

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cosmos-native-emission-param-shock-001-v0.2-t0-remediation-2026-10-07
      - name: Concurrent historical governance-state boundary recovery
        shell: bash
        run: |
          python3 - <<'PY'
          import json,urllib.request,urllib.error,ssl,hashlib,os,datetime
          from concurrent.futures import ThreadPoolExecutor

          OUT="research/cosmos_native_emission_param_shock_001_v0_2/SCRT287_HISTORICAL_GOV_STATE_V35B.json"
          UA="CryptoLab-source-only-secret-v35b"
          endpoints=[
            ("mario-archive","https://lcd.archive.scrt.marionode.com"),
            ("ankr","https://rpc.ankr.com/http/scrt_cosmos"),
            ("stakely","https://secretnetwork-lcd.stakely.io"),
            ("trivium","https://secret-4.api.trivium.network:1317"),
            ("lavender","https://secretnetwork-api.lavenderfive.com:443"),
            ("01node","https://rest-secret.01node.com"),
            ("highstakes","https://secretnetwork-api.highstakes.ch:1317"),
          ]
          paths=["/cosmos/gov/v1beta1/proposals/287","/gov/proposals/287"]
          seed=[11780000,11830000,11870000,11900000]
          modes=["header","query"]
          
          def request(base,path,h,mode,to=9):
              headers={"User-Agent":UA,"Accept":"application/json"}
              url=base+path
              if mode=="header":
                  headers["x-cosmos-block-height"]=str(h)
              else:
                  url += ("&" if "?" in url else "?")+"height="+str(h)
              try:
                  q=urllib.request.Request(url,headers=headers)
                  with urllib.request.urlopen(q,timeout=to,context=ssl._create_unverified_context()) as r:
                      b=r.read()
                      return {"ok":True,"http":getattr(r,"status",200),"url":r.geturl(),
                              "headers":dict(r.headers),"sha256":hashlib.sha256(b).hexdigest(),
                              "body":b.decode("utf-8","replace")[:300000]}
              except urllib.error.HTTPError as e:
                  try:b=e.read()
                  except Exception:b=b""
                  return {"ok":False,"http":e.code,"url":url,"headers":dict(e.headers or {}),
                          "error":str(e),"sha256":hashlib.sha256(b).hexdigest() if b else None,
                          "body":b.decode("utf-8","replace")[:30000]}
              except Exception as e:
                  return {"ok":False,"http":None,"url":url,"headers":{},"error":repr(e),"body":""}

          def status(body):
              try:d=json.loads(body)
              except:return None
              def walk(x):
                  if isinstance(x,dict):
                      pid=x.get("proposal_id") or x.get("proposalId")
                      st=x.get("status")
                      if st is not None and (pid is None or str(pid)=="287"):
                          s=str(st)
                          if "PROPOSAL_STATUS_" in s or s in ("1","2","3","4","5"):
                              return s
                      for v in x.values():
                          z=walk(v)
                          if z:return z
                  elif isinstance(x,list):
                      for v in x:
                          z=walk(v)
                          if z:return z
                  return None
              return walk(d)

          def passed(s):
              return s=="3" or (s is not None and "PASSED" in str(s))

          jobs=[(n,b,p,m,h) for n,b in endpoints for p in paths for m in modes for h in seed]
          def one(x):
              n,b,p,m,h=x;r=request(b,p,h,m)
              rh=r.get("headers",{}).get("x-cosmos-block-height") or r.get("headers",{}).get("X-Cosmos-Block-Height")
              return {"provider":n,"base":b,"path":p,"mode":m,"requested_height":h,
                      "ok":r["ok"],"http":r.get("http"),"proposal_status":status(r.get("body","")),
                      "response_height":rh,"sha256":r.get("sha256"),"error":r.get("error"),
                      "body_excerpt":r.get("body","")[:1800]}
          with ThreadPoolExecutor(max_workers=32) as ex:
              rows=list(ex.map(one,jobs))

          groups={}
          for x in rows:
              groups.setdefault((x["provider"],x["base"],x["path"],x["mode"]),[]).append(x)

          eligible=[]
          for k,xs in groups.items():
              xs=sorted(xs,key=lambda z:z["requested_height"])
              known=[x for x in xs if x["proposal_status"]]
              # Need actual state change across requested heights. Same latest PASSED everywhere is rejected.
              br=None
              for a,b in zip(known,known[1:]):
                  if not passed(a["proposal_status"]) and passed(b["proposal_status"]):
                      br=(a,b);break
              if br:
                  eligible.append({"key":k,"lo":br[0],"hi":br[1]})

          exact=[]
          for e in eligible:
              provider,base,path,mode=e["key"];L=e["lo"]["requested_height"];R=e["hi"]["requested_height"];trace=[];err=None
              while L<R:
                  M=(L+R)//2;r=request(base,path,M,mode,10);s=status(r.get("body",""))
                  rh=r.get("headers",{}).get("x-cosmos-block-height") or r.get("headers",{}).get("X-Cosmos-Block-Height")
                  row={"height":M,"proposal_status":s,"ok":r["ok"],"http":r.get("http"),
                       "response_height":rh,"sha256":r.get("sha256"),"error":r.get("error"),
                       "body_excerpt":r.get("body","")[:2500]}
                  trace.append(row)
                  if s is None:
                      err=row;break
                  if passed(s):R=M
                  else:L=M+1
              rec={"provider":provider,"base":base,"path":path,"mode":mode,
                   "seed_lo":e["lo"],"seed_hi":e["hi"],"binary_trace":trace,"error":err}
              if err is None:
                  H=L;neigh=[]
                  for hh in [H-1,H,H+1]:
                      r=request(base,path,hh,mode,10);s=status(r.get("body",""))
                      rh=r.get("headers",{}).get("x-cosmos-block-height") or r.get("headers",{}).get("X-Cosmos-Block-Height")
                      neigh.append({"requested_height":hh,"proposal_status":s,"http":r.get("http"),
                                    "response_height":rh,"sha256":r.get("sha256"),"error":r.get("error"),
                                    "body_excerpt":r.get("body","")[:3500]})
                  verified=bool(neigh[0]["proposal_status"] and not passed(neigh[0]["proposal_status"]) and
                                neigh[1]["proposal_status"] and passed(neigh[1]["proposal_status"]) and
                                neigh[2]["proposal_status"] and passed(neigh[2]["proposal_status"]))
                  # If server exposes x-cosmos-block-height, require it to agree at all three neighbors.
                  reported=[x["response_height"] for x in neigh if x.get("response_height") is not None]
                  if reported:
                      verified=verified and all(str(x["response_height"])==str(x["requested_height"]) for x in neigh)
                  rec["H_execution_block"]=H
                  rec["T0_first_new_param_mint_block"]=H+1
                  rec["neighbors"]=neigh
                  rec["state_transition_verified"]=verified
              exact.append(rec)

          out={"scope":"SOURCE_ONLY_NO_MARKET_DATA","candidate":"SCRT Proposal 287",
               "tested_utc":datetime.datetime.now(datetime.timezone.utc).isoformat(),
               "rule":"PASS requires demonstrably height-sensitive gov state: non-PASSED at H-1 and PASSED at H/H+1. Constant current state is rejected. T0=H+1 per pinned EndBlock/BeginBlock semantics.",
               "seed_heights":seed,"rows":rows,"eligible_routes":eligible,"exact":exact,
               "pass_records":[x for x in exact if x.get("state_transition_verified")]}
          os.makedirs(os.path.dirname(OUT),exist_ok=True)
          with open(OUT,"w") as f:json.dump(out,f,indent=2)
          print("V35B",json.dumps({"eligible":len(eligible),"passes":[{"provider":x["provider"],"H":x.get("H_execution_block"),"T0":x.get("T0_first_new_param_mint_block")} for x in out["pass_records"]]}))
          PY
      - name: Persist
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/cosmos_native_emission_param_shock_001_v0_2/SCRT287_HISTORICAL_GOV_STATE_V35B.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "SCRT287: persist fast historical governance-state probe v35b"
          git pull --rebase origin cosmos-native-emission-param-shock-001-v0.2-t0-remediation-2026-10-07
          git push origin HEAD:cosmos-native-emission-param-shock-001-v0.2-t0-remediation-2026-10-07
