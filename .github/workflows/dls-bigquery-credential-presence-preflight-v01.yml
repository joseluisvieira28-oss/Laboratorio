name: DLS BigQuery Credential Presence Preflight V0.1

on:
  push:
    branches:
      - defi-liquidation-kamino-boundary-execution-v0.1
    paths:
      - '.github/workflows/dls-bigquery-credential-presence-preflight-v01.yml'
      - 'labs/DEFI_LIQUIDATION_SHOCK_001/BIGQUERY_CREDENTIAL_PREFLIGHT_TRIGGER_V0.1.txt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      HAS_GCP_SA_KEY: ${{ secrets.GCP_SA_KEY != '' }}
      HAS_GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON != '' }}
      HAS_BIGQUERY_SERVICE_ACCOUNT_JSON: ${{ secrets.BIGQUERY_SERVICE_ACCOUNT_JSON != '' }}
      HAS_GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS != '' }}
      HAS_GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON != '' }}
      HAS_GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID != '' }}
      HAS_BIGQUERY_PROJECT_ID: ${{ secrets.BIGQUERY_PROJECT_ID != '' }}
      HAS_GOOGLE_CLOUD_PROJECT: ${{ secrets.GOOGLE_CLOUD_PROJECT != '' }}
    steps:
      - name: Presence-only audit
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          keys = [
            "HAS_GCP_SA_KEY",
            "HAS_GCP_SERVICE_ACCOUNT_JSON",
            "HAS_BIGQUERY_SERVICE_ACCOUNT_JSON",
            "HAS_GOOGLE_CREDENTIALS",
            "HAS_GOOGLE_APPLICATION_CREDENTIALS_JSON",
            "HAS_GCP_PROJECT_ID",
            "HAS_BIGQUERY_PROJECT_ID",
            "HAS_GOOGLE_CLOUD_PROJECT",
          ]
          vals = {k: os.environ.get(k, "false").lower() == "true" for k in keys}
          credential_present = any(vals[k] for k in keys[:5])
          project_hint_present = any(vals[k] for k in keys[5:])
          receipt = {
            "schema_version": "0.1",
            "lab_id": "DEFI-LIQUIDATION-SHOCK-001",
            "purpose": "presence-only BigQuery/GCP credential readiness",
            "credential_present": credential_present,
            "project_hint_present": project_hint_present,
            "presence_flags": vals,
            "network_calls": False,
            "secret_values_read_by_script": False,
            "secret_values_printed": False,
            "bigquery_query_executed": False,
            "bigquery_dry_run_executed": False,
            "billing_mutation": False,
            "prices_queried": False,
            "returns_computed": False,
            "pnl_computed": False,
          }
          print("BIGQUERY_CREDENTIAL_PRESENT" if credential_present else "BIGQUERY_CREDENTIAL_ABSENT")
          print("BIGQUERY_PROJECT_HINT_PRESENT" if project_hint_present else "BIGQUERY_PROJECT_HINT_ABSENT")
          open("DLS_BIGQUERY_CREDENTIAL_PRESENCE_PREFLIGHT_V0.1.json","w").write(json.dumps(receipt,indent=2,sort_keys=True)+"\n")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: dls-bigquery-credential-presence-preflight-v01
          path: DLS_BIGQUERY_CREDENTIAL_PRESENCE_PREFLIGHT_V0.1.json
          if-no-files-found: error
          retention-days: 30
