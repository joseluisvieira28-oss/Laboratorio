name: Bitget Download Helper V0.1.4

on:
  push:
    branches:
      - bitget-maker-microstructure-v0.1-source-gate-2026-10-05
    paths:
      - research/cross_venue_stock/bitget_download_helper_v014.py
      - .github/workflows/bitget-download-helper-v014.yml

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check requests
      - name: Resolve official helper
        run: python research/cross_venue_stock/bitget_download_helper_v014.py
      - uses: actions/upload-artifact@v4
        with:
          name: bitget-download-helper-v014-${{ github.run_id }}
          path: artifacts/cross_venue_stock/bitget_download_helper_v014
          if-no-files-found: error
          retention-days: 90
