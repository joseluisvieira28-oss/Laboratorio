name: News Shock Lab V0.3A Consensus Combined V0.7

# Tranche 07: systematic 2022 provenance-only expansion to 30/44 COMPLETE_A; no market outcomes authorized
on:
  push:
    branches:
      - dream-account-phase-b-signal-research-v0.1
    paths:
      - 'Dream-Account-OS-v2.3-PARTIAL/research/NEWS_SHOCK_LAB_V03A_CONSENSUS_SEED_TRANCHE07_FREEZE_V0.1.json'
      - 'Dream-Account-OS-v2.3-PARTIAL/research/NEWS_SHOCK_LAB_V03A_CONSENSUS_SEED_TRANCHE07_V0.1.json'
      - 'Dream-Account-OS-v2.3-PARTIAL/research/news_shock_lab_v03a_consensus_combined_v07.py'
      - '.github/workflows/news-shock-lab-v03a-consensus-combined-v07.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  news-shock-v03a-consensus-combined-v07:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install parser dependency and compile
        run: |
          cd Dream-Account-OS-v2.3-PARTIAL
          python -m pip install beautifulsoup4
          python -m compileall -q research
      - name: Verify frozen authority chain
        run: |
          cd Dream-Account-OS-v2.3-PARTIAL
          python - <<'PY'
          from research.news_shock_lab_v03a_consensus_combined_v07 import load_authority
          *_, freeze7, seed7 = load_authority()
          assert freeze7['fingerprint'] == '15d20b6857622717cadb5e92d314ad6fb253b5ccb678f4359c23287c49582fc5'
          assert seed7['fingerprint'] == '392fd2d3e4c8935d2d3e23f7d5bcc35f04c2fa02b8618d85c8df34d3cbf5a7b7'
          assert freeze7['parent_combined_manifest_fingerprint'] == '5040b59e3d8f3f4aa769df8744357ee7a7d51d784f781ce28f6f059cc9c43777'
          assert freeze7['parent_validation_fingerprint'] == '2263fad55efe19beede24cea448c13f1b39ae124e7fe07b77b05f066fca854e9'
          print('NEWS V03A COMBINED V07 AUTHORITY PASS')
          PY
      - name: Rebuild BLS actuals and validate thirty consensus events
        run: |
          cd Dream-Account-OS-v2.3-PARTIAL
          mkdir -p research/local_data/news_v03a_consensus_combined_v07_output
          set -o pipefail
          python -m research.news_shock_lab_v03a_consensus_combined_v07 \
            research/local_data/news_v03a_consensus_combined_v07_output \
            | tee research/local_data/news_v03a_consensus_combined_v07_output/combined_v07_stdout.txt
      - name: Assert 30 COMPLETE_A and all outcome guards closed
        run: |
          cd Dream-Account-OS-v2.3-PARTIAL
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('research/local_data/news_v03a_consensus_combined_v07_output')
          s = json.loads((root/'combined_v07_summary.json').read_text())
          expected_counts = {'COMPLETE_A': 30, 'CONSENSUS_PROVENANCE_INCOMPLETE': 14}
          if s['status_counts'] != expected_counts:
              raise SystemExit(f"NEWS V03A V07 STATUS COUNT DRIFT: {s['status_counts']}")
          if s.get('complete_b_count', 0) != 0:
              raise SystemExit('NEWS V03A V07 UNEXPECTED COMPLETE_B')
          if len(s['complete_a_event_ids']) != 30:
              raise SystemExit('NEWS V03A V07 COMPLETE_A COUNT DRIFT')
          new_ids = (
              'US_CPI_2022-02-10','US_CPI_2022-03-10','US_CPI_2022-05-11',
              'US_CPI_2022-07-13','US_CPI_2022-09-13','US_CPI_2022-11-10','US_CPI_2022-12-13',
          )
          for event_id in new_ids:
              if event_id not in s['complete_a_event_ids']:
                  raise SystemExit(f'NEWS V03A V07 NEW EVENT MISSING: {event_id}')
          for rejected in ('US_CPI_2022-01-12','US_CPI_2022-04-12','US_CPI_2022-08-10','US_CPI_2022-10-13'):
              if rejected in s['complete_a_event_ids']:
                  raise SystemExit(f'NEWS V03A V07 REJECTED EVENT LEAKED IN: {rejected}')
          for key, value in s['guards'].items():
              if value is not False:
                  raise SystemExit(f'NEWS V03A V07 OUTCOME GUARD DRIFT: {key}')
          print('NEWS V03A COMBINED V07 VALIDATION PASS', s['validation_fingerprint'])
          PY
      - name: Upload combined V0.7 provenance receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: news-shock-v03a-consensus-combined-v07-${{ github.sha }}
          path: |
            Dream-Account-OS-v2.3-PARTIAL/research/local_data/news_v03a_consensus_combined_v07_output/combined_v07_consensus_manifest.json
            Dream-Account-OS-v2.3-PARTIAL/research/local_data/news_v03a_consensus_combined_v07_output/combined_v07_validation_receipt.json
            Dream-Account-OS-v2.3-PARTIAL/research/local_data/news_v03a_consensus_combined_v07_output/combined_v07_summary.json
            Dream-Account-OS-v2.3-PARTIAL/research/local_data/news_v03a_consensus_combined_v07_output/combined_v07_stdout.txt
          if-no-files-found: warn
          retention-days: 30
