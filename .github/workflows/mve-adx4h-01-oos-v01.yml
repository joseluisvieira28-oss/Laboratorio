name: MVE ADX4H 01 — Frozen 2024 OOS V0.1

on:
  push:
    branches: [mve-adx4h-01-oos-v01]
    paths:
      - '.github/workflows/mve-adx4h-01-oos-v01.yml'
      - 'Dream-Account-OS-v2.3-PARTIAL/research/mve_adx4h_01_oos_v01.py'

permissions:
  contents: read

jobs:
  frozen-2024-oos:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Assert frozen ADX authority bytes
        shell: bash
        run: |
          test "$(git hash-object Dream-Account-OS-v2.3-PARTIAL/research/classic_indicators_gap_v01.py)" = "21398ba193d10d465c10b392e1dc8461270a0491"
          test "$(git hash-object Dream-Account-OS-v2.3-PARTIAL/research/CLASSIC_INDICATORS_GAP_LAB_V01_PROTOCOL.json)" = "0ac36b01d682064576b6d1279d26a1d7056c780f"
          test "$(git hash-object Dream-Account-OS-v2.3-PARTIAL/research/cigl_adx_01_action_v01.py)" = "bd8cd57e3ea7b25df1eab5a4c8c80fbe7fd5694c"
          echo 'Frozen ADX authority byte identity PASS'
      - name: Install isolated research dependencies
        run: python -m pip install --disable-pip-version-check numpy pandas zstandard
      - name: Compile frozen OOS runner
        run: |
          cd Dream-Account-OS-v2.3-PARTIAL/research
          python -m py_compile mve_adx4h_01_oos_v01.py
      - name: Execute one-shot 2024 OOS
        run: |
          cd Dream-Account-OS-v2.3-PARTIAL/research
          python mve_adx4h_01_oos_v01.py --work ../outputs/MVE_ADX4H_01_OOS_V01
      - name: Upload immutable OOS receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mve-adx4h-01-oos-v01-${{ github.sha }}
          path: Dream-Account-OS-v2.3-PARTIAL/outputs/MVE_ADX4H_01_OOS_V01/outputs/
          if-no-files-found: error
          retention-days: 90
