name: ABSORPTION-001 frozen-sensor source freshness audit (read-only)
on:
  push:
    branches:
      - audit/absorption-sensor-freshness-2026-10-09
    paths:
      - "absorption_failed_auction/sensor_freshness_audit_v01.py"
      - "absorption_failed_auction/test_sensor_freshness_audit_v01.py"
      - ".github/workflows/absorption-sensor-freshness-audit-v01.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-freshness:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Read-only tests, no scientific outcome access
        run: |
          python -m py_compile absorption_failed_auction/sensor_freshness_audit_v01.py absorption_failed_auction/test_sensor_freshness_audit_v01.py
          cd absorption_failed_auction && python -m unittest -v test_sensor_freshness_audit_v01.py
      - name: Read last immutable MM-V1 Vault manifest only
        run: |
          git fetch --depth=1 origin tv-evidence-vault-v0.1:refs/remotes/origin/tv-evidence-vault-v0.1
          git ls-tree -r --name-only refs/remotes/origin/tv-evidence-vault-v0.1 tradingview_evidence_vault/archive |
            grep -E '/[0-9]{4}-[0-9]{2}-[0-9]{2}\.manifest\.json$' |
            sort | tail -1 > /tmp/latest_vault_path
          test -s /tmp/latest_vault_path
          git show "refs/remotes/origin/tv-evidence-vault-v0.1:$(cat /tmp/latest_vault_path)" > /tmp/latest_vault_manifest.json
      - name: Classify actual source currency, never reconstruct missing bars
        shell: bash
        run: |
          set +e
          python absorption_failed_auction/sensor_freshness_audit_v01.py \
            --trigger absorption_failed_auction/COLLECT_TRIGGER.json \
            --forward absorption_failed_auction/forward/COLLECTOR_STATE.json \
            --intake absorption_failed_auction/intake/TVFP_2026-10-01.csv \
            --vault-manifest /tmp/latest_vault_manifest.json \
            --output absorption_failed_auction/forward/SENSOR_FRESHNESS_AUDIT.json
          status=$?
          set -e
          echo "FRESHNESS_GATE_EXIT=$status"
          test "$status" -eq 0 -o "$status" -eq 3
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path("absorption_failed_auction/forward/SENSOR_FRESHNESS_AUDIT.json").read_text())
          assert x["trading_authority"]=="NONE"
          assert x["economic_outcomes_unlocked"] is False
          assert x["not_an_edge_verdict"] is True
          print("AUDIT_REPORT_VERIFIED",x["state"])
          PY
      - name: Preserve observational receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: absorption-001-sensor-freshness-audit
          path: absorption_failed_auction/forward/SENSOR_FRESHNESS_AUDIT.json
          if-no-files-found: warn
