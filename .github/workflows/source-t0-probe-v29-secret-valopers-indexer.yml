name: source-t0-probe-v29-secret-valopers-indexer

on:
  workflow_dispatch:
  push:
    branches:
      - cosmos-native-emission-param-shock-001-v0.2-t0-remediation-2026-10-07
    paths:
      - .github/workflows/source-t0-probe-v29-secret-valopers-indexer.yml

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cosmos-native-emission-param-shock-001-v0.2-t0-remediation-2026-10-07

      - name: Discover Valopers historical index/backend routes
        shell: bash
        run: |
          python3 - <<'PY'
          import json,re,urllib.request,urllib.error,urllib.parse,hashlib,os,datetime
          from concurrent.futures import ThreadPoolExecutor

          TARGET="2023-12-07T02:54:58.930543213Z"
          OUT="research/cosmos_native_emission_param_shock_001_v0_2/SCRT287_VALOPERS_INDEXER_DISCOVERY_V29.json"
          UA={"User-Agent":"Mozilla/5.0 CryptoLab-source-only-secret-v29"}

          def get(u,to=15):
              q=urllib.request.Request(u,headers=UA)
              try:
                  with urllib.request.urlopen(q,timeout=to) as r:
                      b=r.read()
                      return {"ok":True,"status":getattr(r,"status",200),"url":r.geturl(),
                              "content_type":r.headers.get("content-type",""),
                              "sha256":hashlib.sha256(b).hexdigest(),
                              "body":b.decode("utf-8","replace")[:1000000]}
              except urllib.error.HTTPError as e:
                  try:b=e.read()
                  except Exception:b=b""
                  return {"ok":False,"status":e.code,"url":u,"error":str(e),
                          "sha256":hashlib.sha256(b).hexdigest() if b else None,
                          "body":b.decode("utf-8","replace")[:50000]}
              except Exception as e:
                  return {"ok":False,"status":None,"url":u,"error":repr(e),"body":""}

          def parse_json_block(body,requested=None):
              try:d=json.loads(body)
              except Exception:return None
              def walk(x):
                  if isinstance(x,dict):
                      h=x.get("height") or x.get("block_height") or x.get("blockHeight")
                      t=x.get("time") or x.get("timestamp") or x.get("block_time") or x.get("blockTime")
                      hs=x.get("hash") or x.get("block_hash") or x.get("blockHash")
                      if h is not None and t is not None:
                          try:
                              hh=int(h)
                              if requested is None or hh==requested:
                                  return {"height":hh,"time":str(t),"hash":hs}
                          except Exception: pass
                      for v in x.values():
                          z=walk(v)
                          if z:return z
                  elif isinstance(x,list):
                      for v in x:
                          z=walk(v)
                          if z:return z
                  return None
              return walk(d)

          def parse_html_block(body,h):
              # Only accept explicit machine-readable pairings that mention the requested height
              patterns=[
                rf'(?s)"height"\s*:\s*"?{h}"?.{{0,800}}?"(?:time|timestamp|block_time|blockTime)"\s*:\s*"([^"]+)"',
                rf'(?s)"(?:time|timestamp|block_time|blockTime)"\s*:\s*"([^"]+)".{{0,800}}?"height"\s*:\s*"?{h}"?',
              ]
              for p in patterns:
                  m=re.search(p,body)
                  if m:return {"height":h,"time":m.group(1),"hash":None}
              return None

          base="https://secret.valopers.com"
          grid=[11752974,11820000,11850000,11870000,11885000,11900000,11920000]
          page_templates=[
              ("valopers-blocks-page",base+"/blocks/{h}"),
              ("valopers-block-page",base+"/block/{h}"),
          ]
          api_templates=[
              ("same-origin-api-blocks",base+"/api/blocks/{h}"),
              ("same-origin-api-block",base+"/api/block/{h}"),
              ("same-origin-api-v1-blocks",base+"/api/v1/blocks/{h}"),
              ("same-origin-api-v1-block",base+"/api/v1/block/{h}"),
              ("same-origin-v1-blocks",base+"/v1/blocks/{h}"),
              ("same-origin-v1-block",base+"/v1/block/{h}"),
          ]

          pages=[]
          jobs=[]
          with ThreadPoolExecutor(max_workers=20) as ex:
              for name,tpl in page_templates+api_templates:
                  for h in grid:
                      jobs.append((name,h,ex.submit(get,tpl.format(h=h),12)))
              for name,h,f in jobs:
                  r=f.result()
                  p=parse_json_block(r.get("body",""),h) or parse_html_block(r.get("body",""),h)
                  pages.append({"source":name,"requested_height":h,"url":r.get("url"),
                                "ok":r.get("ok"),"status":r.get("status"),"content_type":r.get("content_type"),
                                "parsed":p,"sha256":r.get("sha256"),"error":r.get("error"),
                                "body_excerpt":r.get("body","")[:3500]})

          controls={}
          for u in [base+"/proposals/287",base+"/blocks/23473353",base+"/blocks",base]:
              r=get(u,15)
              b=r.get("body","")
              scripts=re.findall(r'<script[^>]+src=["\']([^"\']+)',b,re.I)
              controls[u]={"ok":r.get("ok"),"status":r.get("status"),"url":r.get("url"),
                           "sha256":r.get("sha256"),"scripts":scripts[:100],
                           "body_excerpt":b[:8000]}

          script_urls=[]
          for page,rec in controls.items():
              for s in rec["scripts"]:
                  script_urls.append(urllib.parse.urljoin(page,s))
          script_urls=list(dict.fromkeys(script_urls))[:80]

          bundles=[]
          for u in script_urls:
              r=get(u,20)
              b=r.get("body","")
              abs_urls=sorted(set(re.findall(r'https?://[^"\'<>\\ ]+',b)))
              interesting=[]
              for needle in ["graphql","/api/","block","blocks","proposal","hasura","indexer","backend","timestamp"]:
                  pos=0
                  while len(interesting)<120:
                      pos=b.lower().find(needle.lower(),pos)
                      if pos<0:break
                      interesting.append({"needle":needle,"excerpt":b[max(0,pos-400):pos+1000]})
                      pos+=len(needle)
              bundles.append({"url":u,"ok":r.get("ok"),"status":r.get("status"),
                              "sha256":r.get("sha256"),
                              "absolute_urls":[x[:800] for x in abs_urls[:250]],
                              "interesting":interesting[:120],
                              "error":r.get("error")})

          good=[x for x in pages if x.get("parsed") and x["parsed"]["height"]==x["requested_height"]]

          out={
              "scope":"SOURCE_ONLY_NO_MARKET_DATA",
              "target_voting_end":TARGET,
              "candidate":"COSMOS-NATIVE-EMISSION-PARAM-SHOCK-001 V0.2 / SCRT Proposal 287",
              "rule":"Discovery only. No T0 promotion unless exact H-1/H/H+1 immutable block metadata is recovered and boundary is proven.",
              "tested_utc":datetime.datetime.now(datetime.timezone.utc).isoformat(),
              "page_and_api_probes":pages,
              "successful_machine_readable_grid":good,
              "control_pages":controls,
              "bundle_discovery":bundles,
          }
          os.makedirs(os.path.dirname(OUT),exist_ok=True)
          with open(OUT,"w",encoding="utf-8") as f:json.dump(out,f,indent=2,ensure_ascii=False)
          print("SCRT287_V29_RESULT",json.dumps({
              "good_rows":len(good),
              "script_count":len(script_urls),
              "bundle_ok":sum(1 for x in bundles if x.get("ok")),
              "absolute_hosts":sorted(set(urllib.parse.urlparse(u).netloc for x in bundles for u in x.get("absolute_urls",[]) if urllib.parse.urlparse(u).netloc))[:100]
          }))
          PY

      - name: Persist V29 source-only discovery receipt
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/cosmos_native_emission_param_shock_001_v0_2/SCRT287_VALOPERS_INDEXER_DISCOVERY_V29.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "SCRT287: persist Valopers indexer discovery v29"
          git push origin HEAD:cosmos-native-emission-param-shock-001-v0.2-t0-remediation-2026-10-07
