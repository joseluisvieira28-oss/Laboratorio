name: DLS Drift Market Index Census V0.1

on:
  push:
    branches:
      - dls-field-enrichment-v01
    paths:
      - labs/DEFI_LIQUIDATION_SHOCK_001/LAUNCH_DRIFT_MARKET_INDEX_CENSUS_V01.marker

permissions:
  actions: read
  contents: read

jobs:
  census:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download Drift enrichment partitions
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 36264543005
          pattern: dls-field-enrichment-drift-*
          path: evidence/partitions
          merge-multiple: true

      - name: Download Drift population enrichment authority
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 36264543005
          pattern: dls-drift-field-enrichment-population-v01
          path: evidence/aggregate
          merge-multiple: true

      - name: Compile market-index census
        run: python -m py_compile labs/DEFI_LIQUIDATION_SHOCK_001/source/aggregate_drift_market_index_census_v0_1.py

      - name: Freeze observed Drift market-index universe
        run: >
          python labs/DEFI_LIQUIDATION_SHOCK_001/source/aggregate_drift_market_index_census_v0_1.py
          --root evidence

      - name: Upload market-index census receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dls-drift-market-index-census-v01
          path: labs/DEFI_LIQUIDATION_SHOCK_001/DRIFT_MARKET_INDEX_CENSUS_RECEIPT_V0.1.json
          if-no-files-found: warn
          retention-days: 30

      - name: Firewall
        if: always()
        run: echo SOURCE_ONLY_TRUE
