name: MEXC GlobalAsset CashOpen V0.7
on:
  push:
    branches: [mexc-globalasset-cashopen-v0.7-prereg-2026-10-05]
permissions: {contents: read}
jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: m
        run: |
          python - <<'PY'
          import json,os
          b=json.load(open('research/mexc_global_assets/MEXC_GLOBALASSET_CASHOPEN_SOURCE_BINDING_V0.7.json'))
          m={'include':[{'target':x['target'],'external':x['external_binance']} for x in b['candidates']]}
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write('matrix='+json.dumps(m,separators=(',',':'))+'\n')
          PY
  eval:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install requests
      - run: |
          test -f research/mexc_global_assets/MEXC_GLOBALASSET_CASHOPEN_FREEZE_V0.7.md
          python research/mexc_global_assets/mexc_globalasset_cashopen_asset_v07.py --target "${{ matrix.target }}" --external "${{ matrix.external }}"
      - uses: actions/upload-artifact@v4
        with:
          name: cashopen-v07-${{ matrix.target }}
          path: artifacts/mexc_global_assets/cashopen_v07/assets/${{ matrix.target }}.json
  aggregate:
    needs: eval
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: cashopen-v07-*
          path: artifacts/mexc_global_assets/cashopen_v07/assets
          merge-multiple: true
      - run: python research/mexc_global_assets/mexc_globalasset_cashopen_aggregate_v07.py
      - uses: actions/upload-artifact@v4
        with:
          name: cashopen-v07-closeout-${{ github.run_id }}
          path: artifacts/mexc_global_assets/cashopen_v07
