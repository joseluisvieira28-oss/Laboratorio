name: DLS Drift User Prefix Index Probe V0.1

on:
  push:
    branches:
      - dls-drift-user-prefix-index-probe-v0.1
    paths:
      - '.github/workflows/dls-drift-user-prefix-index-v01.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dls-drift-user-prefix-index-probe-v0.1
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile
        run: python -m py_compile labs/DEFI_LIQUIDATION_SHOCK_001/source/probe_drift_user_prefix_index_v0_1.py
      - name: Execute metadata-only user prefix probe
        run: python labs/DEFI_LIQUIDATION_SHOCK_001/source/probe_drift_user_prefix_index_v0_1.py
      - name: Persist receipt
        if: always()
        run: |
          if [ -f labs/DEFI_LIQUIDATION_SHOCK_001/DRIFT_USER_PREFIX_INDEX_PROBE_RECEIPT_V0.1.json ]; then
            git config user.name "crypto-lab-source-audit"
            git config user.email "actions@users.noreply.github.com"
            git add labs/DEFI_LIQUIDATION_SHOCK_001/DRIFT_USER_PREFIX_INDEX_PROBE_RECEIPT_V0.1.json
            git commit -m "dls: persist Drift user prefix index receipt v0.1" || true
            git push origin HEAD:dls-drift-user-prefix-index-probe-v0.1
          fi
      - name: Firewall
        if: always()
        run: |
          echo METADATA_ONLY_TRUE
          echo OBJECT_BODIES_FALSE
          echo EVENT_ROWS_FALSE
          echo PRICES_FALSE
          echo RETURNS_FALSE
          echo PNL_FALSE
          echo DIRECTION_FALSE
          echo LIVE_TRADING_FALSE
