name: DLS Protected 2025 Source Partitioned V0.2

on:
  push:
    branches: [dls-field-enrichment-v01]
    paths:
      - labs/DEFI_LIQUIDATION_SHOCK_001/LAUNCH_PROTECTED_2025_SOURCE_V02.marker

permissions:
  actions: read
  contents: read

jobs:
  collect:
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - {protocol: marginfi, part: 2025Q1, start: '2025-01-01T00:00:00Z', end: '2025-04-01T00:00:00Z'}
          - {protocol: marginfi, part: 2025Q2, start: '2025-04-01T00:00:00Z', end: '2025-07-01T00:00:00Z'}
          - {protocol: marginfi, part: 2025Q3, start: '2025-07-01T00:00:00Z', end: '2025-10-01T00:00:00Z'}
          - {protocol: marginfi, part: 2025Q4, start: '2025-10-01T00:00:00Z', end: '2026-01-01T00:00:00Z'}
          - {protocol: save0c, part: 2025Q1, start: '2025-01-01T00:00:00Z', end: '2025-04-01T00:00:00Z'}
          - {protocol: save0c, part: 2025Q2, start: '2025-04-01T00:00:00Z', end: '2025-07-01T00:00:00Z'}
          - {protocol: save0c, part: 2025Q3, start: '2025-07-01T00:00:00Z', end: '2025-10-01T00:00:00Z'}
          - {protocol: save0c, part: 2025Q4, start: '2025-10-01T00:00:00Z', end: '2026-01-01T00:00:00Z'}
          - {protocol: kamino, part: 2025Q1, start: '2025-01-01T00:00:00Z', end: '2025-04-01T00:00:00Z'}
          - {protocol: kamino, part: 2025Q2, start: '2025-04-01T00:00:00Z', end: '2025-07-01T00:00:00Z'}
          - {protocol: kamino, part: 2025Q3, start: '2025-07-01T00:00:00Z', end: '2025-10-01T00:00:00Z'}
          - {protocol: kamino, part: 2025Q4, start: '2025-10-01T00:00:00Z', end: '2026-01-01T00:00:00Z'}
          - {protocol: save11, part: 2025Q1, start: '2025-01-01T00:00:00Z', end: '2025-04-01T00:00:00Z'}
          - {protocol: save11, part: 2025Q2, start: '2025-04-01T00:00:00Z', end: '2025-07-01T00:00:00Z'}
          - {protocol: save11, part: 2025Q3, start: '2025-07-01T00:00:00Z', end: '2025-10-01T00:00:00Z'}
          - {protocol: save11, part: 2025Q4, start: '2025-10-01T00:00:00Z', end: '2026-01-01T00:00:00Z'}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect partition source-only
        run: >
          python labs/DEFI_LIQUIDATION_SHOCK_001/source/collect_protected_2025_source_v0_1.py
          --protocol ${{ matrix.protocol }}
          --start ${{ matrix.start }}
          --end ${{ matrix.end }}
          --out protected_parts/${{ matrix.protocol }}-${{ matrix.part }}.json
      - name: Upload partition receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dls-protected-2025-v02-${{ matrix.protocol }}-${{ matrix.part }}
          path: protected_parts/${{ matrix.protocol }}-${{ matrix.part }}.json
          if-no-files-found: warn
          retention-days: 90

  finalize:
    needs: collect
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: dls-protected-2025-v02-*
          path: protected_parts
          merge-multiple: true
      - name: Compile exact-union finalizer
        run: python -m py_compile labs/DEFI_LIQUIDATION_SHOCK_001/source/finalize_protected_2025_source_partitioned_v0_2.py
      - name: Finalize exact source union
        run: python labs/DEFI_LIQUIDATION_SHOCK_001/source/finalize_protected_2025_source_partitioned_v0_2.py --root protected_parts
      - name: Upload source authority
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dls-protected-2025-source-authority-v01
          path: |
            labs/DEFI_LIQUIDATION_SHOCK_001/PROTECTED_2025_SOURCE_AUTHORITY_RECEIPT_V0.1.json
            labs/DEFI_LIQUIDATION_SHOCK_001/PROTECTED_2025_SOURCE_CLUSTER_CENSUS_V0.1.ndjson
          if-no-files-found: warn
          retention-days: 90
      - name: Firewall
        if: always()
        run: echo SOURCE_ONLY_NO_2025_PRICES_NO_2026_NO_TRADING
