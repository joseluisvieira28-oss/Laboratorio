name: UKLS Wayback Numeric Detail Census V0.2.8
on:
  push:
    branches:
      - upbit-krw-listing-shock-detail-census-v0.2.8
    paths:
      - 'Dream-Account-OS-v2.3-PARTIAL/research/upbit_krw_listing_shock_001/wayback_numeric_detail_census_v028.py'
      - '.github/workflows/upbit-krw-listing-shock-detail-census-v028.yml'
permissions:
  contents: read
jobs:
  census:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify authority and compile
        run: |
          test -f Dream-Account-OS-v2.3-PARTIAL/research/upbit_krw_listing_shock_001/WAYBACK_NUMERIC_DETAIL_CENSUS_AUTHORITY_V0_2_8.md
          python -m py_compile Dream-Account-OS-v2.3-PARTIAL/research/upbit_krw_listing_shock_001/wayback_numeric_detail_census_v028.py
      - name: Execute index-only census
        run: python Dream-Account-OS-v2.3-PARTIAL/research/upbit_krw_listing_shock_001/wayback_numeric_detail_census_v028.py
      - name: Enforce firewall
        run: |
          python - <<'PY'
          import json
          x=json.load(open('artifacts/UKLS_WAYBACK_NUMERIC_DETAIL_CENSUS_V0_2_8.json'))
          assert x['archived_payload_opened'] is False
          assert x['event_values_opened'] is False
          assert x['binance_opened'] is False
          print('CLASSIFICATION',x['classification'])
          for k,v in x['families'].items():
              print(k,v['distinct_numeric_id_count'],v['numeric_coverage_fraction'],v['missing_numeric_id_count'],v['max_internal_numeric_id_gap'],v['earliest_capture'],v['latest_capture'],v['completeness_candidate_pass'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: UKLS_WAYBACK_NUMERIC_DETAIL_CENSUS_V0_2_8
          path: artifacts/UKLS_WAYBACK_NUMERIC_DETAIL_CENSUS_V0_2_8.json
          retention-days: 90
