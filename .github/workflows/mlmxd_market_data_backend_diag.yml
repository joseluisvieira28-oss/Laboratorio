name: MLMXD Historical Download Backend Diagnostic

on:
  push:
    branches:
      - mexc-launchpool-mx-demand-v0.1-source-2026-10-07
    paths:
      - 'research/mexc_launchpool_mx_demand/market_data_download_backend_diag.py'
      - '.github/workflows/mlmxd_market_data_backend_diag.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - run: python research/mexc_launchpool_mx_demand/market_data_download_backend_diag.py
      - uses: actions/upload-artifact@v4
        with:
          name: mlmxd-market-data-backend-diag
          path: artifacts/mlmxd_market_data_backend_diag/
          retention-days: 90
