name: source-t0-probe-v44a-secret-exact-ibc-hit-census
on:
  push:
    branches: [cosmos-native-emission-param-shock-001-v0.2-t0-remediation-2026-10-07]
    paths: [.github/workflows/source-t0-probe-v44a-secret-exact-ibc-hit-census.yml]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cosmos-native-emission-param-shock-001-v0.2-t0-remediation-2026-10-07
      - name: Exact IBC hit census
        shell: bash
        run: |
          python3 - <<'PY'
          import json,urllib.request,urllib.error,ssl,hashlib,os,datetime
          from concurrent.futures import ThreadPoolExecutor,as_completed
          OUT="research/cosmos_native_emission_param_shock_001_v0_2/SCRT287_EXACT_IBC_HIT_CENSUS_V44A.json"
          H=[11880918,11880919,11880920,11880921,11880922]
          C=[
            ("osmosis","07-tendermint-1588",["https://rpc.archive.osmosis.zone","https://rpc.cosmos.directory/osmosis"]),
            ("cosmoshub","07-tendermint-492",["https://rpc.cosmoshub-4-archive.citizenweb3.com","https://rpc.cosmos.directory/cosmoshub"]),
            ("juno","07-tendermint-108",["https://juno-rpc.publicnode.com","https://rpc.cosmos.directory/juno"]),
            ("evmos","07-tendermint-50",["https://evmos-rpc.publicnode.com","https://rpc.cosmos.directory/evmos"]),
            ("stride","07-tendermint-37",["https://rpc.stride.citizenweb3.com","https://rpc.cosmos.directory/stride"]),
            ("terra2","07-tendermint-4",["https://terra-rpc.polkachu.com","https://rpc.cosmos.directory/terra2"]),
            ("kujira","07-tendermint-12",["https://kujira-rpc.polkachu.com","https://rpc.cosmos.directory/kujira"]),
            ("axelar","07-tendermint-40",["https://axelar-rpc.publicnode.com","https://axelar-rpc.polkachu.com","https://rpc.cosmos.directory/axelar"]),
            ("stargaze","07-tendermint-177",["https://stargaze-rpc.polkachu.com","https://rpc.cosmos.directory/stargaze"]),
            ("injective","07-tendermint-97",["https://injective-rpc.publicnode.com","https://injective-rpc.polkachu.com","https://rpc.cosmos.directory/injective"]),
            ("persistence","07-tendermint-106",["https://rpc.cosmos.directory/persistence"]),
            ("quicksilver","07-tendermint-28",["https://rpc.cosmos.directory/quicksilver"]),
            ("gravitybridge","07-tendermint-140",["https://rpc.cosmos.directory/gravitybridge"]),
            ("crescent","07-tendermint-18",["https://rpc.cosmos.directory/crescent"]),
            ("chihuahua","07-tendermint-70",["https://rpc.cosmos.directory/chihuahua"]),
            ("agoric","07-tendermint-17",["https://rpc.cosmos.directory/agoric"])
          ]
          UA={"User-Agent":"CryptoLab-source-only-v44a","Content-Type":"application/json"}
          def one(job):
            name,cid,base,h=job
            q=f"update_client.client_id='{cid}' AND update_client.consensus_height='4-{h}'"
            payload={"jsonrpc":"2.0","id":1,"method":"tx_search","params":{"query":q,"prove":False,"page":"1","per_page":"100","order_by":"asc"}}
            data=json.dumps(payload).encode()
            try:
              req=urllib.request.Request(base,data=data,headers=UA,method="POST")
              with urllib.request.urlopen(req,timeout=9,context=ssl._create_unverified_context()) as r:
                b=r.read(); d=json.loads(b); txs=(d.get("result") or {}).get("txs") or []
                hits=[]
                for tx in txs:
                  for ev in (tx.get("tx_result") or {}).get("events") or []:
                    if ev.get("type")!="update_client": continue
                    a={x.get("key"):x.get("value") for x in ev.get("attributes") or []}
                    if a.get("client_id")==cid and a.get("consensus_height")==f"4-{h}":
                      hx=a.get("header") or ""
                      hits.append({"carrier_height":int(tx["height"]),"tx_hash":tx.get("hash"),
                        "client_id":cid,"consensus_height":a.get("consensus_height"),
                        "header_hex_sha256":hashlib.sha256(bytes.fromhex(hx)).hexdigest() if hx else None,
                        "header_hex_len":len(hx)})
                return {"carrier":name,"endpoint":base,"height":h,"ok":True,"status":r.status,"hits":hits}
            except urllib.error.HTTPError as e:
              return {"carrier":name,"endpoint":base,"height":h,"ok":False,"status":e.code,"error":str(e),"hits":[]}
            except Exception as e:
              return {"carrier":name,"endpoint":base,"height":h,"ok":False,"status":None,"error":repr(e),"hits":[]}
          jobs=[(n,c,e,h) for n,c,eps in C for e in eps for h in H]
          rows=[]
          with ThreadPoolExecutor(max_workers=50) as ex:
            fs=[ex.submit(one,j) for j in jobs]
            for f in as_completed(fs): rows.append(f.result())
          hits=[{**x,"hit":z} for x in rows for z in x["hits"]]
          out={"scope":"SOURCE_ONLY_NO_MARKET_DATA","target_voting_end":"2023-12-07T02:54:58.930543213Z",
            "tested_utc":datetime.datetime.now(datetime.timezone.utc).isoformat(),
            "historical_client_basis":"2023-10-24 chain-registry relationships","rows":rows,"hits":hits}
          os.makedirs(os.path.dirname(OUT),exist_ok=True)
          open(OUT,"w").write(json.dumps(out,indent=2))
          print("V44A",json.dumps({"hits":hits}))
          PY
      - name: Persist
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/cosmos_native_emission_param_shock_001_v0_2/SCRT287_EXACT_IBC_HIT_CENSUS_V44A.json
          git commit -m "SCRT287: persist exact IBC hit census v44a"
          git pull --rebase origin cosmos-native-emission-param-shock-001-v0.2-t0-remediation-2026-10-07
          git push origin HEAD:cosmos-native-emission-param-shock-001-v0.2-t0-remediation-2026-10-07
