name: Aave Gov LT Ethereum 2025 RPC Census V02
on:
  push:
    branches: [aave-gov-lt-forced-deleveraging-v0.1]
    paths: [research/aave_gov_lt_forced_deleveraging/ethereum_2025_rpc_census_v02.py, .github/workflows/aave-gov-lt-ethereum-2025-v02.yml]
permissions:
  contents: read
jobs:
  census:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python research/aave_gov_lt_forced_deleveraging/ethereum_2025_rpc_census_v02.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aave-gov-lt-ethereum-2025-rpc-v02
          path: out/aave_2025_rpc_v02/
          retention-days: 30
