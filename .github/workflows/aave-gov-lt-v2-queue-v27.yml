name: Aave Gov LT V2 Queue V27
on:
  push:
    branches: [aave-gov-lt-forced-deleveraging-v0.1]
    paths:
      - '.github/workflows/aave-gov-lt-v2-queue-v27.yml'
      - 'research/aave_gov_lt_forced_deleveraging/v2_queue_v27.py'
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pycryptodome==3.23.0
      - run: python research/aave_gov_lt_forced_deleveraging/v2_queue_v27.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aave-gov-lt-v2-queue-v27
          path: out/aave_v2_queue_v27
          retention-days: 30
