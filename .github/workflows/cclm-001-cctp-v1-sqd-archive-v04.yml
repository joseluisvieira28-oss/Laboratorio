name: CCLM-001 Ethereum SQD archive probe V0.4
on:
  push:
    branches: [crosschain-liquidity-migration-001-source-gate-v0.1]
    paths:
      - 'research/crosschain_liquidity_migration_001/cctp_v1_sqd_archive_probe_v04.py'
      - '.github/workflows/cclm-001-cctp-v1-sqd-archive-v04.yml'
      - 'research/crosschain_liquidity_migration_001/CCLM_SQD_ARCHIVE_V04_TRIGGER.txt'
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {ref: crosschain-liquidity-migration-001-source-gate-v0.1}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python research/crosschain_liquidity_migration_001/cctp_v1_sqd_archive_probe_v04.py
      - name: Persist receipt
        run: |
          cp artifacts/cclm_cctp_v1_sqd_archive_probe_v04.json research/crosschain_liquidity_migration_001/CCTP_V1_SQD_ARCHIVE_V04_RECEIPT.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/crosschain_liquidity_migration_001/CCTP_V1_SQD_ARCHIVE_V04_RECEIPT.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "CCLM-001: record Ethereum SQD archive probe V0.4 [skip ci]"
          git push origin HEAD:crosschain-liquidity-migration-001-source-gate-v0.1
      - uses: actions/upload-artifact@v4
        with:
          name: cclm-001-cctp-v1-sqd-archive-v04
          path: artifacts/cclm_cctp_v1_sqd_archive_probe_v04.json
          if-no-files-found: error
