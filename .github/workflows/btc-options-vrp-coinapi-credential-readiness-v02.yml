name: BTC Options VRP CoinAPI Credential Readiness V0.2

on:
  push:
    branches:
      - btc-options-vrp-coinapi-source-probe-v0.1
    paths:
      - '.github/btc-options-vrp-coinapi-credential-readiness-v02.trigger'

permissions:
  contents: read

jobs:
  zero-network-readiness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify frozen source-only authority
        run: |
          python - <<'PY'
          import json
          a=json.load(open('labs/BTC_OPTIONS_VRP_001/COINAPI_SOURCE_PROBE_AUTHORITY_V0.1.json'))
          assert a['status']=='FROZEN_SOURCE_ONLY_CREDENTIAL_GATED_NO_PURCHASE'
          s=a['safety']
          assert s['purchase_authorized'] is False
          assert s['paid_overage_authorized'] is False
          assert s['performance_outcomes_authorized'] is False
          assert s['access_2025_authorized'] is False
          assert s['access_2026_authorized'] is False
          print('COINAPI_READINESS_V02_AUTHORITY_GUARD_PASS')
          PY
      - name: Write credential-presence receipt only
        env:
          COINAPI_KEY: ${{ secrets.COINAPI_KEY }}
        run: |
          mkdir -p artifacts/btc_options_vrp_coinapi_readiness_v02
          python - <<'PY'
          import json, os, pathlib
          present=bool(os.environ.get('COINAPI_KEY'))
          receipt={
            'status':'COINAPI_CREDENTIAL_PRESENT' if present else 'COINAPI_CREDENTIAL_ABSENT',
            'credential_present':present,
            'network_request_made':False,
            'key_printed':False,
            'key_hashed':False,
            'key_persisted':False,
            'purchase_authorized':False,
            'paid_overage_authorized':False,
            'outcomes_opened':False,
            'returns_opened':False,
            'pnl_opened':False,
            'access_2025_or_2026':False,
            'live_trading':False,
            'exchange_mutation':False
          }
          p=pathlib.Path('artifacts/btc_options_vrp_coinapi_readiness_v02/COINAPI_CREDENTIAL_READINESS_RECEIPT_V0.2.json')
          p.write_text(json.dumps(receipt,indent=2,sort_keys=True)+'\n')
          print(receipt['status'])
          PY
      - name: Upload readiness receipt
        uses: actions/upload-artifact@v4
        with:
          name: BTC_OPTIONS_VRP_001_COINAPI_CREDENTIAL_READINESS_V0_2
          path: artifacts/btc_options_vrp_coinapi_readiness_v02/
          retention-days: 30
