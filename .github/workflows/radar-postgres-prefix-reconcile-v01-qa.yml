name: Radar Postgres Prefix Reconcile V0.1 QA

on:
  pull_request:
    branches:
      - crypto-edge-radar-postgres-v0.5
    paths:
      - "crypto_edge_radar/radar/evidence_portability.py"
      - "crypto_edge_radar/tests/test_evidence_portability.py"
      - "crypto_edge_radar/tests/test_evidence_prefix_reconciliation.py"
      - "crypto_edge_radar/tests/test_forward_web_quiesce.py"
      - "crypto_edge_radar/authorities/RADAR_POSTGRES_APPEND_ONLY_PREFIX_RECONCILIATION_V0.1_2026-09-27.md"
      - ".github/workflows/radar-postgres-prefix-reconcile-v01-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          cd crypto_edge_radar
          python -m pip install -e .

      - name: Compile
        run: |
          cd crypto_edge_radar
          python -m compileall radar tests

      - name: Targeted portability tests
        run: |
          cd crypto_edge_radar
          python -m unittest -v             tests.test_evidence_portability             tests.test_evidence_prefix_reconciliation \
            tests.test_forward_web_quiesce

      - name: Full deterministic Radar suite
        run: |
          cd crypto_edge_radar
          python -m unittest discover -s tests -v

      - name: Append-only reconciliation guard
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path("crypto_edge_radar/radar/evidence_portability.py").read_text()
          assert "TARGET_PREFIX_FAIL_CLOSED_NO_MUTATION" in p
          assert "TARGET_DELTA_ROWS_VERIFIED__SEQUENCE_FINALIZATION_REQUIRED" in p
          assert "TARGET_ALREADY_EXACT__SEQUENCE_ALIGNED" in p
          assert "TARGET_EVENTS_NOT_EXACT_SOURCE_PREFIX" in p
          assert "TARGET_KEYS_NOT_EXACT_SOURCE_PREFIX" in p
          assert "TARGET_SEQUENCE_NOT_ALIGNED_TO_PREFIX_MAX_ID" in p
          assert "sequence_finalization_required" in p
          assert "pg_advisory_xact_lock" in p
          assert "POSTGRES_CHAIN_LOCK_ID" in p

          segment=p[p.index("def reconcile_target_prefix"):p.index("def restore_snapshot")]
          upper=segment.upper()
          assert "UPDATE RADAR_EVENTS" not in upper
          assert "DELETE FROM RADAR_EVENTS" not in upper
          assert "TRUNCATE RADAR_EVENTS" not in upper
          assert "ON CONFLICT" not in upper
          assert "SETVAL(" not in upper
          print("RADAR_POSTGRES_PREFIX_RECONCILE_V01_GUARD_PASS")
          PY
