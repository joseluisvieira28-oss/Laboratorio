name: Cross-Venue Funding Basis Provenance Slots V0.4

on:
  push:
    branches:
      - dream-account-phase-b-signal-research-v0.1
    paths:
      - 'Dream-Account-OS-v2.3-PARTIAL/research/CROSS_VENUE_FUNDING_BASIS_PROVENANCE_SLOT_NORMALIZATION_V04.json'
      - 'Dream-Account-OS-v2.3-PARTIAL/research/cross_venue_funding_basis_provenance_slots_v04.py'
      - 'Dream-Account-OS-v2.3-PARTIAL/tests/test_cross_venue_funding_basis_provenance_slots_v04.py'
      - '.github/workflows/cross-venue-funding-basis-provenance-slots-v04.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  provenance-slots-v04:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run V0.4 offline slot-normalization tests
        run: |
          cd Dream-Account-OS-v2.3-PARTIAL
          python -m pip install pytest
          python -m pytest -q tests/test_cross_venue_funding_basis_provenance_slots_v04.py

      - name: Compile V0.4 provenance normalization
        run: |
          cd Dream-Account-OS-v2.3-PARTIAL
          python -m py_compile research/cross_venue_funding_basis_provenance_slots_v04.py tests/test_cross_venue_funding_basis_provenance_slots_v04.py

      - name: Verify V0.4 amendment is source-semantics only
        run: |
          cd Dream-Account-OS-v2.3-PARTIAL
          python - <<'PY'
          import json
          from pathlib import Path
          a = json.loads(Path('research/CROSS_VENUE_FUNDING_BASIS_PROVENANCE_SLOT_NORMALIZATION_V04.json').read_text(encoding='utf-8'))
          assert a['status'] == 'AUTHORIZED_SOURCE_SEMANTICS_NORMALIZATION_DIAGNOSTIC_ONLY'
          assert a['trigger']['economic_values_consulted'] is False
          for key, value in a['scientific_boundary'].items():
              assert value is False, key
          assert a['source_semantics']['binance']['nominal_funding_interval_hours'] == 8
          assert a['source_semantics']['hyperliquid']['nominal_funding_interval_hours'] == 1
          assert a['source_semantics']['economic_field_use'] == 'FORBIDDEN_FOR_NORMALIZATION_OR_COVERAGE'
          print('PASS: V0.4 changes timestamp semantics only')
          PY

      - name: Static guard against outcome analysis and mutation
        run: |
          cd Dream-Account-OS-v2.3-PARTIAL
          python - <<'PY'
          import ast
          from pathlib import Path
          p = Path('research/cross_venue_funding_basis_provenance_slots_v04.py')
          tree = ast.parse(p.read_text(encoding='utf-8'))
          forbidden_names = {'mean','median','stdev','variance','corr','correlation','sharpe','sortino','profit_factor','win_rate','expectancy'}
          hits = []
          for node in ast.walk(tree):
              if isinstance(node, ast.Name) and node.id.lower() in forbidden_names:
                  hits.append((node.id, node.lineno))
              if isinstance(node, ast.Attribute) and node.attr.lower() in {'put','patch','delete'}:
                  hits.append((node.attr, node.lineno))
          if hits:
              raise SystemExit(f'forbidden outcome/mutation primitives: {hits}')
          text = p.read_text(encoding='utf-8').lower()
          for marker in ('carry_computed = false','apr_apy_computed = false','pnl_computed = false','signals_computed = false'):
              if marker not in text:
                  raise SystemExit(f'missing governance marker: {marker}')
          print('PASS: V0.4 remains outcome-blind and mutation-free')
          PY

      - name: Run checksum-verified nominal-slot provenance diagnostic
        env:
          PREFREEZE_PROVENANCE_SLOT_V04_RECEIPT: CROSS_VENUE_FUNDING_BASIS_PROVENANCE_SLOT_V04_RECEIPT.json
        run: |
          cd Dream-Account-OS-v2.3-PARTIAL
          python research/cross_venue_funding_basis_provenance_slots_v04.py

      - name: Verify V0.4 receipt boundary and report gate
        run: |
          cd Dream-Account-OS-v2.3-PARTIAL
          python - <<'PY'
          import json
          from pathlib import Path
          r = json.loads(Path('CROSS_VENUE_FUNDING_BASIS_PROVENANCE_SLOT_V04_RECEIPT.json').read_text(encoding='utf-8'))
          assert r['classification'] == 'PROVENANCE_SLOT_NORMALIZATION_DIAGNOSTIC_ONLY_NOT_ECONOMIC_DISCOVERY'
          assert r['status'] == 'PASS'
          assert r['binance_archive_checksums_all_match'] is True
          assert r['binance_interval_metadata_validated_8h'] is True
          assert r['locked_2026_accessed'] is False
          assert r['mexc_accessed'] is False
          assert r['authenticated_account_data_used'] is False
          assert r['exchange_mutation_used'] is False
          assert r['funding_rate_values_summarized'] is False
          assert r['economic_fields_summarized'] is False
          assert r['carry_computed'] is False
          assert r['apr_apy_computed'] is False
          assert r['pnl_computed'] is False
          assert r['signals_computed'] is False
          assert r['discovery_authorized'] is False
          assert r['trading_authorized'] is False
          print('SLOT_GATE_STATUS=' + r['slot_coverage_gate_status'])
          print('COMMON_FULL_MONTH_COUNT=' + str(r['common_full_month_count']))
          print('FIRST_COMMON_FULL_MONTH=' + str(r['first_common_full_month']))
          print('LAST_COMMON_FULL_MONTH=' + str(r['last_common_full_month']))
          print('PASS: V0.4 receipt preserves scientific boundary')
          PY

      - name: Upload V0.4 provenance slot receipt
        uses: actions/upload-artifact@v4
        with:
          name: cross-venue-funding-basis-provenance-slots-v04-receipt
          path: Dream-Account-OS-v2.3-PARTIAL/CROSS_VENUE_FUNDING_BASIS_PROVENANCE_SLOT_V04_RECEIPT.json
          if-no-files-found: error
          retention-days: 30
