name: MEXC NVIDIA RegSession Source V0.4

on:
  push:
    branches:
      - mexc-nvidia-regsession-leadlag-v0.4-source-gate-2026-10-04

permissions:
  contents: read

jobs:
  source-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependency
        run: python -m pip install --disable-pip-version-check requests
      - name: Source-only check
        run: |
          test "$GITHUB_REF_NAME" = "mexc-nvidia-regsession-leadlag-v0.4-source-gate-2026-10-04"
          test -f research/mexc_global_assets/MEXC_NVIDIA_REGSESSION_SOURCE_FREEZE_V0.4.md
          python -m py_compile research/mexc_global_assets/mexc_nvidia_regsession_source_v04.py
          echo SOURCE_ONLY_PASS
      - name: Run regular-session source gate
        run: python research/mexc_global_assets/mexc_nvidia_regsession_source_v04.py
      - name: Upload source evidence
        uses: actions/upload-artifact@v4
        with:
          name: mexc-nvidia-regsession-source-v04-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/mexc_global_assets/nvidia_regsession_source_v04
          if-no-files-found: error
          retention-days: 90