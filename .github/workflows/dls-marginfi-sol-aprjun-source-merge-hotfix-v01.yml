name: DLS Marginfi SOL Apr-Jun Source Merge Hotfix V0.1

on:
  push:
    branches:
      - dls-marginfi-flow-turnover-impact-v01
    paths:
      - labs/DEFI_LIQUIDATION_SHOCK_001/LAUNCH_MARGINFI_SOL_APRJUN_SOURCE_MERGE_HOTFIX_V01.marker

permissions:
  actions: read
  contents: read

jobs:
  merge:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download exact April source artifact
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 36686194844
          artifact-ids: 11084591611
          path: monthly/apr

      - name: Download exact May source artifact
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 36686194844
          artifact-ids: 11083783717
          path: monthly/may

      - name: Download exact June source artifact
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 36686194844
          artifact-ids: 11084090889
          path: monthly/jun

      - name: Compile corrected source merge
        run: python -m py_compile labs/DEFI_LIQUIDATION_SHOCK_001/source/merge_marginfi_sol_aprjun_source_v0_1.py

      - name: Merge and adjudicate source gate
        run: >
          python labs/DEFI_LIQUIDATION_SHOCK_001/source/merge_marginfi_sol_aprjun_source_v0_1.py
          --root monthly

      - name: Upload canonical terminal source evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dls-marginfi-sol-aprjun-signed-flow-source-v01-hotfix
          path: |
            labs/DEFI_LIQUIDATION_SHOCK_001/MARGINFI_SOL_APRJUN_SIGNED_FLOW_SOURCE_RECEIPT_V0.1.json
            labs/DEFI_LIQUIDATION_SHOCK_001/MARGINFI_SOL_APRJUN_SIGNED_FLOW_SOURCE_ROWS_V0.1.ndjson
            labs/DEFI_LIQUIDATION_SHOCK_001/MARGINFI_SOL_APRJUN_SOURCE_POPULATION_V0.1.ndjson
          if-no-files-found: warn
          retention-days: 90

      - name: Firewall
        if: always()
        run: echo SOURCE_ONLY_MERGE_HOTFIX_NO_MARKET_OUTCOMES_NO_TRADING
