name: ETF-CREATION-FLOW-001 Source Feasibility V0.1
on:
  push:
    branches: [etf-creation-flow-v0.1]
    paths:
      - 'labs/ETF_CREATION_FLOW_001/SOURCE_FEASIBILITY_V0.1.md'
      - 'labs/ETF_CREATION_FLOW_001/source_probe_v01.py'
      - '.github/workflows/etf-creation-flow-source-probe-v01.yml'
jobs:
  source-probe:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: etf-creation-flow-v0.1
      - name: Verify frozen source contract
        run: |
          set -euo pipefail
          test -f labs/ETF_CREATION_FLOW_001/SOURCE_FEASIBILITY_V0.1.md
          test -f labs/ETF_CREATION_FLOW_001/source_probe_v01.py
          grep -q '2024-12-30' labs/ETF_CREATION_FLOW_001/SOURCE_FEASIBILITY_V0.1.md
          grep -q 'No BTC data' labs/ETF_CREATION_FLOW_001/SOURCE_FEASIBILITY_V0.1.md
      - name: Compile source probe
        run: python -m py_compile labs/ETF_CREATION_FLOW_001/source_probe_v01.py
      - name: Execute official iShares source probe only
        run: python labs/ETF_CREATION_FLOW_001/source_probe_v01.py
      - name: Upload immutable probe evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: etf-creation-flow-001-source-probe-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/etf_creation_flow_source_probe_v01/
          retention-days: 90
          if-no-files-found: warn
