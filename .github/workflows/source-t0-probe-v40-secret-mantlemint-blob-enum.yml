name: source-t0-probe-v40-secret-mantlemint-blob-enum

on:
  workflow_dispatch:
  push:
    branches:
      - cosmos-native-emission-param-shock-001-v0.2-t0-remediation-2026-10-07
    paths:
      - .github/workflows/source-t0-probe-v40-secret-mantlemint-blob-enum.yml

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cosmos-native-emission-param-shock-001-v0.2-t0-remediation-2026-10-07

      - name: Enumerate plausible Mantlemint archival snapshot blob names
        shell: bash
        run: |
          python3 - <<'PY'
          import json,urllib.request,urllib.error,ssl,os,datetime
          from concurrent.futures import ThreadPoolExecutor, as_completed

          OUT="research/cosmos_native_emission_param_shock_001_v0_2/SCRT287_MANTLEMINT_BLOB_ENUM_V40.json"
          base="https://engfilestorage.blob.core.windows.net/mm-snapshots"
          UA={"User-Agent":"CryptoLab-source-only-secret-v40","Accept":"*/*"}

          # Discovery heights only; never scientific T0 evidence by themselves.
          known=[
            3340000,3343000,5309200,5941700,6317200,6537300,7760000,
            8248000,8779000,9611000,10824000,11136666,11238000,11752974
          ]
          # Dense around the event region; coarse across later Mantlemint lifetime.
          dense=list(range(11000000,12250001,10000))
          coarse=list(range(3400000,11000000,100000))
          candidates=sorted(set(known+dense+coarse))
          exts=[".tar",".tar.gz",".tar.lz4",".tar.zst"]

          def head(h,ext):
              url=f"{base}/height_{h}{ext}"
              try:
                  q=urllib.request.Request(url,headers=UA,method="HEAD")
                  with urllib.request.urlopen(q,timeout=8,context=ssl._create_unverified_context()) as r:
                      return {"height":h,"ext":ext,"url":url,"ok":True,"status":getattr(r,"status",200),
                              "headers":dict(r.headers)}
              except urllib.error.HTTPError as e:
                  return {"height":h,"ext":ext,"url":url,"ok":False,"status":e.code,"error":str(e)}
              except Exception as e:
                  return {"height":h,"ext":ext,"url":url,"ok":False,"status":None,"error":repr(e)}

          rows=[]
          jobs=[(h,e) for h in candidates for e in exts]
          with ThreadPoolExecutor(max_workers=64) as ex:
              futs=[ex.submit(head,h,e) for h,e in jobs]
              for f in as_completed(futs):
                  rows.append(f.result())

          hits=sorted([x for x in rows if x["ok"]],key=lambda x:(x["height"],x["ext"]))
          out={
            "scope":"SOURCE_ONLY_NO_MARKET_DATA",
            "candidate":"SCRT Proposal 287",
            "target_voting_end":"2023-12-07T02:54:58.930543213Z",
            "tested_utc":datetime.datetime.now(datetime.timezone.utc).isoformat(),
            "known_documented_snapshot":"height_3340000.tar",
            "candidate_height_count":len(candidates),
            "request_count":len(rows),
            "hits":hits,
            "non404_anomalies":[x for x in rows if not x["ok"] and x.get("status") not in (404,None)],
            "rule":"Blob existence is only artifact discovery. Exact T0 still requires chain/event/state evidence from the artifact."
          }
          os.makedirs(os.path.dirname(OUT),exist_ok=True)
          with open(OUT,"w") as f:json.dump(out,f,indent=2)
          print("V40",json.dumps({"hits":[{"height":x["height"],"ext":x["ext"],"len":x["headers"].get("Content-Length"),"modified":x["headers"].get("Last-Modified")} for x in hits]}))
          PY

      - name: Persist
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/cosmos_native_emission_param_shock_001_v0_2/SCRT287_MANTLEMINT_BLOB_ENUM_V40.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "SCRT287: persist Mantlemint blob enumeration v40"
          git pull --rebase origin cosmos-native-emission-param-shock-001-v0.2-t0-remediation-2026-10-07
          git push origin HEAD:cosmos-native-emission-param-shock-001-v0.2-t0-remediation-2026-10-07
