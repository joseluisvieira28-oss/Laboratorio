name: source-t0-probe-v17-targeted-archives

on:
  push:
    branches:
      - cosmos-native-emission-param-shock-001-v0.2-t0-remediation-2026-10-07
    paths:
      - .github/workflows/source-t0-probe-v17-targeted-archives.yml

permissions:
  contents: read

jobs:
  targeted:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Target exact mainnet historical endpoints only
        shell: bash
        run: |
          python3 - <<'PY'
          import json,urllib.request,ssl
          UA={"User-Agent":"CryptoLab-source-only/1.7"}
          def get(url,headers=None,to=8):
            h=dict(UA);h.update(headers or {})
            try:
              q=urllib.request.Request(url,headers=h)
              with urllib.request.urlopen(q,timeout=to,context=ssl._create_unverified_context()) as r:
                raw=r.read().decode("utf-8","replace")
                try:d=json.loads(raw)
                except:d=raw[:3000]
                return {"ok":True,"status":r.status,"url":r.geturl(),"data":d}
            except Exception as e:return {"ok":False,"url":url,"error":repr(e)}
          def compact(x):
            if x["ok"]: return x
            return {"ok":False,"url":x["url"],"error":x.get("error")}
          out={"scope":"SOURCE_ONLY_NO_MARKET_DATA","akash":{},"secret":{}}
          ak_rest=[
            "https://proxy.atomscan.com/akash-lcd",
            "https://akash.c29r3.xyz:443/api",
            "https://akash.api.pocket.network",
            "https://akash.rpc.uquad.org:443",
            "https://rest-akash.ecostake.com",
            "https://akash-api.polkachu.com",
            "https://akash-api.kleomedes.network",
            "https://akash-mainnet-rest.cosmonautstakes.com:443",
            "https://akash-rest.publicnode.com",
            "https://akash-api.validatornode.com",
            "https://akash.api.arcturian.tech",
            "https://akash-mainnet-api.crouton.digital"
          ]
          cases={"265":17526666,"283":20631473}
          for pid,H in cases.items():
            rows=[]
            for base in ak_rest:
              for hh in range(H-1,H+3):
                paths=[
                  f"/cosmos/base/tendermint/v1beta1/blocks/{hh}",
                  "/cosmos/mint/v1beta1/inflation",
                  "/cosmos/mint/v1beta1/params"
                ]
                for path in paths:
                  hdr={"x-cosmos-block-height":str(hh)} if "mint/" in path else {}
                  z=get(base.rstrip("/")+path,hdr,7)
                  if z["ok"] or ("prun" not in z.get("error","").lower() and "404" not in z.get("error","")):
                    rows.append({"provider":base,"height":hh,"path":path,"response":compact(z)})
            out["akash"][pid]=rows

          sec_rest=[
            "https://proxy.atomscan.com/secretnetwork-lcd",
            "https://rest.lavenderfive.com:443/secretnetwork",
            "https://1rpc.io/scrt-lcd",
            "https://lcd.mainnet.secretsaturn.net",
            "https://rest-secret.01node.com",
            "https://public.stakewolle.com/cosmos/secretnetwork/rest"
          ]
          grid=[11752974,11800000,11840000,11880000,11920000]
          rows=[]
          for base in sec_rest:
            for hh in grid:
              z=get(base.rstrip("/")+f"/cosmos/base/tendermint/v1beta1/blocks/{hh}",to=7)
              if z["ok"] or ("prun" not in z.get("error","").lower() and "404" not in z.get("error","")):
                rows.append({"provider":base,"height":hh,"response":compact(z)})
          out["secret"]["grid"]=rows
          print("TARGETED_ARCHIVES_V17_BEGIN")
          print(json.dumps(out,indent=2,sort_keys=True)[:700000])
          print("TARGETED_ARCHIVES_V17_END")
          PY
