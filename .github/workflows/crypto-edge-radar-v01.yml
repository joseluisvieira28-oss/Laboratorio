name: CRYPTO EDGE RADAR CI + PUBLIC SOAK

on:
  push:
    branches:
      - crypto-edge-radar-v0.1
      - crypto-edge-radar-aggressive-v0.3
      - crypto-edge-radar-aggressive-v0.7-render
      - crypto-edge-radar-postgres-v0.5
      - crypto-edge-radar-ops-hardening-phase2-2026-09-18
    paths:
      - 'crypto_edge_radar/**'
      - '.github/workflows/crypto-edge-radar-v01.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'crypto_edge_radar/**'
      - '.github/workflows/crypto-edge-radar-v01.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-safety-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crypto_edge_radar
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install runtime dependencies
        run: python -m pip install -e .
      - name: Compile
        run: python -m compileall radar tests
      - name: Unit tests
        run: python -m unittest discover -s tests -v

  public-shadow-soak:
    needs: offline-safety-tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crypto_edge_radar
    env:
      RADAR_DB: ci_artifacts/radar_evidence.sqlite3
      RADAR_STATUS: ci_artifacts/radar_status.json
      RADAR_NOTIFICATIONS: ci_artifacts/radar_notifications.jsonl
      RADAR_PROVIDER: binance_spot_public
      RADAR_UNIVERSE_MODE: core5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare artifact directory
        run: mkdir -p ci_artifacts
      - name: Real public-data bounded soak — 3 cycles
        run: python -m radar service --interval 5 --max-cycles 3
      - name: Capture ETF-CME current public-source trap
        run: python -m radar etf-cme-signal > ci_artifacts/etf_cme_current_signal.json
      - name: Verify evidence chain
        run: python -m radar verify-evidence
      - name: Verify final heartbeat and exactly one runtime shadow bot
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          status = json.loads(Path('ci_artifacts/radar_status.json').read_text())
          assert status['health'] == 'OK', status
          assert status['cycle'] == 3, status
          assert status['provider'] == 'BINANCE_SPOT_DATA_API_PUBLIC', status
          assert status['evidence_backend'] == 'sqlite', status
          assert status['registered_strategies'] == 1, status
          assert status['valid_signal_count'] == 0, status
          assert len(status['universe']) == 5, status
          print(json.dumps(status, sort_keys=True))
          PY
      - name: Upload public shadow and source-trap receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crypto-edge-radar-v07-public-shadow-receipt
          path: crypto_edge_radar/ci_artifacts/
          if-no-files-found: warn
          retention-days: 14

  mexc-futures-public-soak:
    needs: offline-safety-tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crypto_edge_radar
    env:
      RADAR_DB: mexc_ci_artifacts/radar_evidence.sqlite3
      RADAR_STATUS: mexc_ci_artifacts/radar_status.json
      RADAR_NOTIFICATIONS: mexc_ci_artifacts/radar_notifications.jsonl
      RADAR_PROVIDER: mexc_futures_public
      RADAR_UNIVERSE_MODE: core5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare MEXC artifact directory
        run: mkdir -p mexc_ci_artifacts
      - name: Real MEXC public futures observation — bounded one cycle
        run: python -m radar service --interval 5 --max-cycles 1
      - name: Live MEXC contract eligibility gate for ETF-CME execution mapping
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from radar.market import MEXCFuturesPublicFeed

          feed = MEXCFuturesPublicFeed(timeout=10)
          eligible = sorted(feed.eligible_usdt_perpetual_symbols())
          receipt = {
              'provider': feed.provider,
              'source_path': '/api/v1/contract/detail',
              'candidate_execution_symbol_canonical': 'BTCUSDT',
              'candidate_execution_symbol_mexc': 'BTC_USDT',
              'btc_usdt_api_eligible': 'BTCUSDT' in eligible,
              'core5_eligible': [s for s in ['BTCUSDT','ETHUSDT','SOLUSDT','BNBUSDT','XRPUSDT'] if s in eligible],
              'authenticated_exchange_api_used': False,
              'order_created': False,
          }
          Path('mexc_ci_artifacts/mexc_contract_eligibility.json').write_text(
              json.dumps(receipt, sort_keys=True, indent=2), encoding='utf-8'
          )
          assert receipt['btc_usdt_api_eligible'] is True, receipt
          print(json.dumps(receipt, sort_keys=True))
          PY
      - name: Capture MEXC friction shadow V1
        run: python -m radar mexc-friction-shadow > mexc_ci_artifacts/mexc_friction_shadow_v1.json
      - name: Validate friction shadow remains public-only and fail-closed
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          receipt = json.loads(Path('mexc_ci_artifacts/mexc_friction_shadow_v1.json').read_text())
          assert receipt['receipt_type'] == 'MEXC_FRICTION_SHADOW_V1', receipt
          assert receipt['status'] == 'PUBLIC_OBSERVATION_ONLY', receipt
          assert receipt['capital_enabled'] is False, receipt
          assert receipt['orders_created'] is False, receipt
          assert receipt['contract']['api_allowed'] is True, receipt
          assert receipt['fees']['taker_round_trip_bps'] == 16.0, receipt
          assert receipt['edge_budget']['historical_estimated_break_even_round_trip_bps'] == 21.2, receipt
          assert receipt['top_of_book']['spread_bps'] >= 0, receipt
          print(json.dumps(receipt, sort_keys=True))
          PY
      - name: Verify MEXC evidence chain
        run: python -m radar verify-evidence
      - name: Verify MEXC public heartbeat, core5 and ETF-CME shadow bot
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          status = json.loads(Path('mexc_ci_artifacts/radar_status.json').read_text())
          assert status['health'] == 'OK', status
          assert status['cycle'] == 1, status
          assert status['provider'] == 'MEXC_FUTURES_PUBLIC', status
          assert status['evidence_backend'] == 'sqlite', status
          assert status['registered_strategies'] == 1, status
          assert status['valid_signal_count'] == 0, status
          assert status['universe'] == ['BTCUSDT', 'ETHUSDT', 'SOLUSDT', 'BNBUSDT', 'XRPUSDT'], status
          print(json.dumps(status, sort_keys=True))
          PY
      - name: Upload MEXC public observation receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crypto-edge-radar-v07-mexc-public-receipt
          path: crypto_edge_radar/mexc_ci_artifacts/
          if-no-files-found: warn
          retention-days: 14