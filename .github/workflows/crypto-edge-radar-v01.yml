name: CRYPTO EDGE RADAR V0.3 CI + PUBLIC SOAK

on:
  push:
    branches:
      - crypto-edge-radar-v0.1
    paths:
      - 'crypto_edge_radar/**'
      - '.github/workflows/crypto-edge-radar-v01.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'crypto_edge_radar/**'
      - '.github/workflows/crypto-edge-radar-v01.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-safety-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crypto_edge_radar
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile
        run: python -m compileall radar tests
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Validate promoted motor manifest
        run: |
          python - <<'PY'
          import json
          x=json.load(open('PROMOTED_MOTOR_MANIFEST_V0.3.json'))
          motors={m['candidate']:m for m in x['motors']}
          a=motors['CED1D-0031']
          assert a['tier']=='TIER_2_PROMOTED_CANDIDATE_QUASE_DIAMANTE',a
          assert a['radar_mode']=='NATIVE_ADAPTER_ACTIVE_ON_BINANCE_USDM',a
          assert a['first_eligible_signal_completion']=='2026-09-19T00:00:00Z',a
          assert a['live_authorized'] is False,a
          assert motors['HTF-DONCHIAN-DH-02-HO1-6H']['radar_mode']=='NATIVE_ADAPTER_BLOCKED_PENDING_CANDIDATE_SPECIFIC_2026_AUTHORITY'
          assert x['radar_governance']['live_trading'] is False
          assert x['radar_governance']['orders'] is False
          print('PROMOTED_MOTOR_MANIFEST_PASS')
          PY

  public-shadow-soak:
    needs: offline-safety-tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crypto_edge_radar
    env:
      RADAR_DB: ci_artifacts/radar_evidence.sqlite3
      RADAR_STATUS: ci_artifacts/radar_status.json
      RADAR_NOTIFICATIONS: ci_artifacts/radar_notifications.jsonl
      RADAR_PROVIDER: binance_spot_public
      RADAR_UNIVERSE_MODE: core5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare artifact directory
        run: mkdir -p ci_artifacts
      - name: Real public-data bounded soak — 3 cycles
        run: python -m radar service --interval 5 --max-cycles 3
      - name: Verify evidence chain
        run: python -m radar verify-evidence
      - name: Verify Spot validation heartbeat and zero compatible promoted strategies
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          status = json.loads(Path('ci_artifacts/radar_status.json').read_text())
          assert status['health'] == 'OK', status
          assert status['cycle'] == 3, status
          assert status['provider'] == 'BINANCE_SPOT_DATA_API_PUBLIC', status
          assert status['registered_strategies'] == 0, status
          assert status['valid_signal_count'] == 0, status
          assert len(status['universe']) == 5, status
          print(json.dumps(status, sort_keys=True))
          PY
      - name: Upload public shadow receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crypto-edge-radar-v02-public-shadow-receipt
          path: crypto_edge_radar/ci_artifacts/
          if-no-files-found: warn
          retention-days: 14
