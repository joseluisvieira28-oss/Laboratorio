name: source-t0-probe-v27-secret-public-index-archive

on:
  workflow_dispatch:
  push:
    branches:
      - cosmos-native-emission-param-shock-001-v0.2-t0-remediation-2026-10-07
    paths:
      - .github/workflows/source-t0-probe-v27-secret-public-index-archive.yml

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cosmos-native-emission-param-shock-001-v0.2-t0-remediation-2026-10-07
      - name: Probe genuinely distinct public historical index/archive routes
        run: |
          python - <<'PY'
          import json, re, urllib.request, urllib.error, datetime, hashlib, os
          from concurrent.futures import ThreadPoolExecutor, as_completed

          TARGET="2023-12-07T02:54:58.930543213Z"
          TT=datetime.datetime.fromisoformat(TARGET.replace("Z","+00:00")).timestamp()
          UA={"User-Agent":"CryptoLab-source-only-secret-v27/1.0"}
          OUT="research/cosmos_native_emission_param_shock_001_v0_2/SCRT287_PUBLIC_INDEX_ARCHIVE_PROBE_V27.json"

          def get(url, timeout=12):
              req=urllib.request.Request(url, headers=UA)
              try:
                  with urllib.request.urlopen(req, timeout=timeout) as r:
                      b=r.read()
                      ct=r.headers.get("content-type","")
                      return {"ok":True,"status":getattr(r,"status",200),"url":url,"content_type":ct,
                              "sha256":hashlib.sha256(b).hexdigest(),
                              "body":b.decode("utf-8","replace")[:200000]}
              except urllib.error.HTTPError as e:
                  try:b=e.read()
                  except Exception:b=b""
                  return {"ok":False,"status":e.code,"url":url,"error":str(e),
                          "sha256":hashlib.sha256(b).hexdigest() if b else None,
                          "body":b.decode("utf-8","replace")[:20000]}
              except Exception as e:
                  return {"ok":False,"url":url,"error":repr(e)}

          def walk(obj):
              if isinstance(obj,dict):
                  yield obj
                  for v in obj.values(): yield from walk(v)
              elif isinstance(obj,list):
                  for v in obj: yield from walk(v)

          def parse_block(resp):
              body=resp.get("body","")
              try:d=json.loads(body)
              except Exception:d=None
              if d is not None:
                  for x in walk(d):
                      h=x.get("height") or x.get("block_height") or x.get("blockHeight")
                      t=x.get("time") or x.get("timestamp") or x.get("block_time") or x.get("blockTime")
                      hs=x.get("hash") or x.get("block_hash") or x.get("blockHash")
                      if h is not None and t:
                          try:return {"height":int(h),"time":str(t),"hash":hs}
                          except Exception:pass
              # HTML / Next.js fallback
              mh=re.search(r'(?i)(?:height|blockHeight|block_height)[^0-9]{0,20}(1[0-9]{7,8})',body)
              mt=re.search(r'(2023-12-[0-9]{2}T[0-9:.]+Z)',body)
              if mh and mt:return {"height":int(mh.group(1)),"time":mt.group(1),"hash":None}
              return None

          # Estimate-only grid is used only to discover a source bracket. It can never be promoted to T0.
          grid=[11752974,11800000,11840000,11860000,11880000,11900000,11920000,11950000,12000000]
          templates=[
            ("cosmostation-chain-api","https://api-secret.cosmostation.io/blocks/{h}"),
            ("cosmostation-chain-api-singular","https://api-secret.cosmostation.io/block/{h}"),
            ("cosmostation-chain-api-v1","https://api-secret.cosmostation.io/v1/blocks/{h}"),
            ("cosmostation-chain-api-v1-singular","https://api-secret.cosmostation.io/v1/block/{h}"),
            ("cosmostation-legacy-unified-1","https://api.cosmostation.io/v1/secret/blocks/{h}"),
            ("cosmostation-legacy-unified-2","https://api.cosmostation.io/v1/secret/block/{h}"),
            ("cosmostation-lcd","https://lcd-secret.cosmostation.io/cosmos/base/tendermint/v1beta1/blocks/{h}"),
            ("secretnodes-old-route-blocks","https://secretnodes.com/secret/chains/secret-4/blocks/{h}"),
            ("secretnodes-old-route-block","https://secretnodes.com/secret/chains/secret-4/block/{h}"),
            ("explorers-guru-html","https://secret.explorers.guru/block/{h}"),
            ("mintscan-public-page","https://www.mintscan.io/secret/block/{h}"),
          ]

          rows=[]
          jobs=[]
          with ThreadPoolExecutor(max_workers=24) as ex:
              for name,tpl in templates:
                  for h in grid:
                      jobs.append((name,h,ex.submit(get,tpl.format(h=h),10)))
              for name,h,f in jobs:
                  r=f.result()
                  p=parse_block(r)
                  rows.append({"source":name,"requested_height":h,
                               "ok":r.get("ok"),"status":r.get("status"),"url":r.get("url"),
                               "parsed":p,"sha256":r.get("sha256"),
                               "error":r.get("error"),
                               "body_excerpt":r.get("body","")[:1200]})

          good=[x for x in rows if x.get("parsed") and x["parsed"]["height"]==x["requested_height"]]
          source_points={}
          for r in good:
              try:
                  tv=datetime.datetime.fromisoformat(r["parsed"]["time"].replace("Z","+00:00")).timestamp()
              except Exception:
                  continue
              source_points.setdefault(r["source"],[]).append((r["requested_height"],tv,r["parsed"]["time"],r["url"]))

          exact={}
          for name,pts in source_points.items():
              pts=sorted(pts)
              br=None
              for a,b in zip(pts,pts[1:]):
                  if a[1] < TT <= b[1]:
                      br=(a,b); break
              if not br: continue
              # resolve the template for this source
              tpl=dict(templates)[name]
              L,R=br[0][0],br[1][0]
              err=None
              while L<R:
                  M=(L+R)//2
                  rr=get(tpl.format(h=M),10); z=parse_block(rr)
                  if not z or z["height"]!=M:
                      err={"height":M,"status":rr.get("status"),"error":rr.get("error"),
                           "url":rr.get("url"),"excerpt":rr.get("body","")[:1000]}
                      break
                  try:tv=datetime.datetime.fromisoformat(z["time"].replace("Z","+00:00")).timestamp()
                  except Exception:
                      err={"height":M,"parse_time":z["time"]};break
                  if tv < TT:L=M+1
                  else:R=M
              rec={"bracket":{"lo":br[0],"hi":br[1]},"error":err}
              if err is None:
                  H=L; n=[]
                  for hh in [H-1,H,H+1]:
                      rr=get(tpl.format(h=hh),12); z=parse_block(rr)
                      n.append({"requested_height":hh,"parsed":z,"url":rr.get("url"),
                                "status":rr.get("status"),"sha256":rr.get("sha256"),
                                "body_excerpt":rr.get("body","")[:1600]})
                  rec["H_vote_end_block"]=H
                  rec["neighbors"]=n
              exact[name]=rec

          # Wayback is a genuinely distinct archived-explorer route; metadata only.
          wayback_urls=[
            "https://web.archive.org/cdx/search/cdx?url=www.mintscan.io/secret/block/*&from=20231206&to=20231208&output=json&filter=statuscode:200&filter=mimetype:text/html&collapse=urlkey&limit=200",
            "https://web.archive.org/cdx/search/cdx?url=secretnodes.com/secret/chains/secret-4/blocks/*&from=20231206&to=20231208&output=json&filter=statuscode:200&collapse=urlkey&limit=200",
            "https://web.archive.org/cdx/search/cdx?url=secretnodes.com/secret/chains/secret-4/block/*&from=20231206&to=20231208&output=json&filter=statuscode:200&collapse=urlkey&limit=200",
          ]
          wayback=[]
          for u in wayback_urls:
              rr=get(u,20)
              wayback.append({"url":u,"ok":rr.get("ok"),"status":rr.get("status"),
                              "sha256":rr.get("sha256"),"error":rr.get("error"),
                              "body_excerpt":rr.get("body","")[:12000]})

          # Frontend reverse-engineering: discover API hosts/routes without market fields.
          frontends={}
          for u in ["https://secretnodes.com/secret","https://secret.explorers.guru",
                    "https://atomscan.com/secret-network/","https://www.mintscan.io/secret"]:
              rr=get(u,15)
              body=rr.get("body","")
              urls=sorted(set(re.findall(r"https?://[^\\\"'<> ]+",body)))
              scripts=sorted(set(re.findall(r"<script[^>]+src=[\\\"']([^\\\"']+)",body,re.I)))
              frontends[u]={"ok":rr.get("ok"),"status":rr.get("status"),
                            "sha256":rr.get("sha256"),"urls":[x[:500] for x in urls[:100]],
                            "scripts":scripts[:100],"error":rr.get("error")}

          out={
            "scope":"SOURCE_ONLY_NO_MARKET_DATA",
            "target_voting_end":TARGET,
            "rule":"No estimated height may be promoted. PASS requires immutable historical block metadata identifying first block timestamp >= voting end.",
            "tested_utc":datetime.datetime.now(datetime.timezone.utc).isoformat(),
            "protocol_version_anchor":{"secret_binary":"v1.12.0","cosmos_sdk_declared":"v0.45.16",
              "secret_fork":"github.com/scrtlabs/cosmos-sdk v0.45.13-0.20230802150248-ea64f27dc58d"},
            "grid_results":rows,
            "exact_candidates":exact,
            "wayback":wayback,
            "frontend_discovery":frontends,
          }
          os.makedirs(os.path.dirname(OUT),exist_ok=True)
          with open(OUT,"w",encoding="utf-8") as f:json.dump(out,f,indent=2,ensure_ascii=False)
          print("SCRT287_V27_RESULT",json.dumps({"good_rows":len(good),"exact_sources":list(exact.keys())}))
          PY
      - name: Persist source-only probe receipt
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/cosmos_native_emission_param_shock_001_v0_2/SCRT287_PUBLIC_INDEX_ARCHIVE_PROBE_V27.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "SCRT287: persist public index/archive source probe v27"
          git push origin HEAD:cosmos-native-emission-param-shock-001-v0.2-t0-remediation-2026-10-07
