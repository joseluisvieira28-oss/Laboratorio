name: DLS Drift Historical S3 GET Status Control V0.3

on:
  push:
    branches:
      - dls-drift-historical-s3-get-control-v0.3
    paths:
      - '.github/workflows/dls-drift-historical-s3-get-status-v03.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dls-drift-historical-s3-get-control-v0.3
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile
        run: python -m py_compile labs/DEFI_LIQUIDATION_SHOCK_001/source/probe_drift_historical_s3_get_status_v0_3.py
      - name: Execute GET-status-only controls
        run: python labs/DEFI_LIQUIDATION_SHOCK_001/source/probe_drift_historical_s3_get_status_v0_3.py
      - name: Persist receipt
        if: always()
        run: |
          if [ -f labs/DEFI_LIQUIDATION_SHOCK_001/DRIFT_HISTORICAL_S3_GET_STATUS_CONTROL_RECEIPT_V0.3.json ]; then
            git config user.name "crypto-lab-source-audit"
            git config user.email "actions@users.noreply.github.com"
            git add labs/DEFI_LIQUIDATION_SHOCK_001/DRIFT_HISTORICAL_S3_GET_STATUS_CONTROL_RECEIPT_V0.3.json
            git commit -m "dls: persist Drift historical S3 GET-status control receipt v0.3" || true
            git push origin HEAD:dls-drift-historical-s3-get-control-v0.3
          fi
      - name: Firewall
        if: always()
        run: |
          echo GET_STATUS_ONLY_TRUE
          echo BODY_BYTES_READ_0
          echo EVENT_ROWS_FALSE
          echo PRICES_FALSE
          echo FUNDING_VALUES_FALSE
          echo RETURNS_FALSE
          echo PNL_FALSE
          echo DIRECTION_FALSE
          echo LIVE_TRADING_FALSE
