name: MEXC Stock Transfer Source V0.1

on:
  push:
    branches:
      - mexc-stock-transfer-operational-v0.1-source-gate-2026-10-04

permissions:
  contents: read

jobs:
  source-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependency
        run: python -m pip install --disable-pip-version-check requests
      - name: Freeze check
        run: |
          test "$GITHUB_REF_NAME" = "mexc-stock-transfer-operational-v0.1-source-gate-2026-10-04"
          test -f research/mexc_global_assets/MEXC_STOCK_TRANSFER_SOURCE_GATE_FREEZE_V0.1.md
          python -m py_compile research/mexc_global_assets/mexc_stock_transfer_source_v01.py
          echo PRE_OUTCOME_SOURCE_FREEZE_PASS
      - name: Run source gate
        run: python research/mexc_global_assets/mexc_stock_transfer_source_v01.py
      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: mexc-stock-transfer-source-v01-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/mexc_global_assets/stock_transfer_operational_v01_source
          if-no-files-found: error
          retention-days: 90