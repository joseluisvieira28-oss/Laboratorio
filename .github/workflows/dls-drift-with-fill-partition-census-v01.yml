name: DLS Drift With-Fill Partition Census V0.1
on:
  push:
    branches:
      - dls-signed-flow-authority-v01
    paths:
      - labs/DEFI_LIQUIDATION_SHOCK_001/LAUNCH_DRIFT_WITH_FILL_PARTITIONS_V01.marker
permissions:
  contents: read
jobs:
  census:
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: p2022
            start: "2022-11-04T15:17:54Z"
            end: "2023-01-01T00:00:00Z"
          - id: p2023
            start: "2023-01-01T00:00:00Z"
            end: "2024-01-01T00:00:00Z"
          - id: p2024
            start: "2024-01-01T00:00:00Z"
            end: "2025-01-01T00:00:00Z"
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      DLS_PARTITION: ${{ matrix.id }}
      DLS_START: ${{ matrix.start }}
      DLS_END: ${{ matrix.end }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile
        run: python -m py_compile labs/DEFI_LIQUIDATION_SHOCK_001/source/census_drift_with_fill_partition_v0_1.py
      - name: Execute source-only partition census
        run: python labs/DEFI_LIQUIDATION_SHOCK_001/source/census_drift_with_fill_partition_v0_1.py
      - name: Upload partition receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dls-drift-with-fill-${{ matrix.id }}-v01
          path: |
            labs/DEFI_LIQUIDATION_SHOCK_001/DRIFT_WITH_FILL_CENSUS_${{ matrix.id }}_RECEIPT_V0.1.json
            labs/DEFI_LIQUIDATION_SHOCK_001/DRIFT_WITH_FILL_CENSUS_${{ matrix.id }}_V0.1.ndjson
          if-no-files-found: warn
          retention-days: 90
      - name: Firewall
        if: always()
        run: echo SOURCE_ONLY_PARTITION_NO_PRICES_2025_2026_CLOSED
