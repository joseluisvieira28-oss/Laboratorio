name: DLS Solscan Enhanced Entitlement Probe V0.1

on:
  push:
    branches:
      - defi-liquidation-solscan-entitlement-probe-v0.1
    paths:
      - '.github/workflows/dls-solscan-entitlement-probe-v01.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SOLSCAN_API_KEY: ${{ secrets.SOLSCAN_API_KEY }}
      SOLSCAN_PRO_API_KEY: ${{ secrets.SOLSCAN_PRO_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: defi-liquidation-solscan-entitlement-probe-v0.1
          fetch-depth: 0

      - name: Probe pre-existing free entitlement only
        run: |
          python - <<'PY'
          import json, os, urllib.parse, urllib.request, urllib.error
          from pathlib import Path

          key = os.environ.get("SOLSCAN_API_KEY") or os.environ.get("SOLSCAN_PRO_API_KEY")
          out = {
            "lab_id":"DEFI-LIQUIDATION-SHOCK-001",
            "date":"2026-09-22",
            "probe":"SOLSCAN_ENHANCED_FREE_ENTITLEMENT_V0.1",
            "credential_present": bool(key),
            "credential_value_recorded": False,
            "account_created": False,
            "paid_source": False,
            "prices": False,
            "returns": False,
            "pnl": False,
            "direction": False,
            "live_trading": False,
            "orders": False,
            "wallets": False,
            "exchange_mutation": False,
            "merge_main": False
          }
          if not key:
              out["classification"]="SOLSCAN_FREE_ENTITLEMENT_CREDENTIAL_ABSENT"
              Path("labs/DEFI_LIQUIDATION_SHOCK_001/SOLSCAN_ENHANCED_ENTITLEMENT_PROBE_RECEIPT_V0.1.json").write_text(json.dumps(out,indent=2,sort_keys=True)+"\n")
              print(json.dumps(out,sort_keys=True))
              raise SystemExit(0)

          program="KLend2g3cP87fffoy8q1mQqGKjrxjC8boSyAYavgmjD"
          disc="b1479abce2854a37"
          params=[
            ("address",program),
            ("from_time","1734220800"),
            ("to_time","1734307200"),
            ("status","true"),
            ("instruction[]",program+disc),
            ("limit","1"),
            ("encoding","jsonParsed"),
          ]
          url="https://pro-api.solscan.io/playground/account/transactions/enhanced?"+urllib.parse.urlencode(params)
          req=urllib.request.Request(url,headers={"accept":"application/json","token":key,"User-Agent":"crypto-lab-dls-source-only/0.1"})
          try:
              with urllib.request.urlopen(req,timeout=45) as resp:
                  raw=resp.read()
                  out["http_status"]=resp.status
                  try:
                      obj=json.loads(raw)
                  except Exception:
                      obj=None
                  if resp.status==200 and isinstance(obj,dict) and obj.get("success") is True:
                      txs=((obj.get("data") or {}).get("transactions") or [])
                      out["returned_transactions"]=len(txs)
                      out["classification"]="SOLSCAN_FREE_ENTITLEMENT_SOURCE_PROBE_PASS" if txs else "SOLSCAN_FREE_ENTITLEMENT_SCHEMA_FAIL_CLOSED"
                  else:
                      out["classification"]="SOLSCAN_FREE_ENTITLEMENT_SCHEMA_FAIL_CLOSED"
          except urllib.error.HTTPError as e:
              out["http_status"]=e.code
              out["classification"]="SOLSCAN_FREE_ENTITLEMENT_AUTH_BLOCKED" if e.code in (401,403) else "SOLSCAN_FREE_ENTITLEMENT_TRANSPORT_BLOCKED"
          except Exception as e:
              out["classification"]="SOLSCAN_FREE_ENTITLEMENT_TRANSPORT_BLOCKED"
              out["error_type"]=type(e).__name__

          Path("labs/DEFI_LIQUIDATION_SHOCK_001/SOLSCAN_ENHANCED_ENTITLEMENT_PROBE_RECEIPT_V0.1.json").write_text(json.dumps(out,indent=2,sort_keys=True)+"\n")
          print(json.dumps(out,sort_keys=True))
          PY

      - name: Persist receipt
        run: |
          git config user.name "crypto-lab-source-audit"
          git config user.email "actions@users.noreply.github.com"
          git add labs/DEFI_LIQUIDATION_SHOCK_001/SOLSCAN_ENHANCED_ENTITLEMENT_PROBE_RECEIPT_V0.1.json
          git commit -m "dls: persist Solscan enhanced entitlement receipt" || true
          git push origin HEAD:defi-liquidation-solscan-entitlement-probe-v0.1
