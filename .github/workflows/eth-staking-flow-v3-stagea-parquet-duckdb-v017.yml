name: ETH-STAKING-FLOW-001 alternate Parquet reader V0.1.7

on:
  push:
    branches:
      - eth-staking-flow-v3-stagea-parquet-duckdb-v017
    paths:
      - 'research/eth_staking_flow/ETH_STAKING_FLOW_001_V3_STAGEA_ALT_PARQUET_READER_V0_1_7.md'
      - 'research/eth_staking_flow/alt_parquet_reader_v017.py'
      - '.github/workflows/eth-staking-flow-v3-stagea-parquet-duckdb-v017.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: eth-staking-flow-v3-stagea-parquet-duckdb-v017
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install frozen independent Parquet reader
        run: python -m pip install 'duckdb==1.4.1'
      - name: Execute exact-object alternate reader recovery
        run: python research/eth_staking_flow/alt_parquet_reader_v017.py
      - name: Persist recovery receipt on PASS
        if: success()
        shell: bash
        run: |
          cp artifacts/ETH_STAKING_FLOW_001_ALT_PARQUET_READER_RECOVERY_V0_1_7.json research/eth_staking_flow/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/eth_staking_flow/ETH_STAKING_FLOW_001_ALT_PARQUET_READER_RECOVERY_V0_1_7.json
          git commit -m "ETH-STAKING-FLOW-001: persist V0.1.7 exact Parquet recovery PASS [skip ci]"
          git push origin HEAD:eth-staking-flow-v3-stagea-parquet-duckdb-v017
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ETH_STAKING_FLOW_001_ALT_PARQUET_READER_V0_1_7
          path: artifacts/ETH_STAKING_FLOW_001_ALT_PARQUET_READER_RECOVERY_V0_1_7.json
          if-no-files-found: error
