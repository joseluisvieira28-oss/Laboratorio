name: EXCHANGE-DELISTING-SHOCK-001 Source Data Gate V0.2

on:
  push:
    branches:
      - exchange-delisting-shock-v0.2-source-remediation
    paths:
      - '.github/workflows/exchange-delisting-shock-source-gate-v02.yml'
      - 'Dream-Account-OS-v2.3-PARTIAL/research/exchange_delisting_shock_001/SOURCE_REMEDIATION_V02.json'
      - 'Dream-Account-OS-v2.3-PARTIAL/research/exchange_delisting_shock_001/source_gate_v02.py'

permissions:
  contents: write

jobs:
  source-data-gate-v02:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout source-remediation branch
        uses: actions/checkout@v4
        with:
          ref: exchange-delisting-shock-v0.2-source-remediation

      - name: Governance and static preflight
        shell: bash
        run: |
          set -euo pipefail
          BASE='Dream-Account-OS-v2.3-PARTIAL/research/exchange_delisting_shock_001'
          python -m py_compile "$BASE/source_gate_v02.py"
          python - <<'PY'
          import json
          base='Dream-Account-OS-v2.3-PARTIAL/research/exchange_delisting_shock_001'
          p=json.load(open(base+'/PRE_SOURCE_PROTOCOL_V01.json'))
          r=json.load(open(base+'/SOURCE_REMEDIATION_V02.json'))
          assert p['status']=='FROZEN_PRE_SOURCE_OUTCOME_BLIND'
          assert p['authorization']=='SOURCE_DATA_GATE_ONLY_DISCOVERY_PROHIBITED'
          assert p['source_event_gate']['minimum_qualified_token_events']==30
          assert p['source_event_gate']['minimum_distinct_tokens']==15
          assert r['status']=='FROZEN_SOURCE_REMEDIATION_ONLY'
          assert r['scientific_invariants_unchanged']['minimum_qualified_token_events']==30
          assert r['scientific_invariants_unchanged']['minimum_distinct_tokens']==15
          assert r['scientific_invariants_unchanged']['required_years']==[2023,2024]
          assert r['scientific_invariants_unchanged']['market_price_value_access'] is False
          assert r['scientific_invariants_unchanged']['returns_authorized'] is False
          assert r['scientific_invariants_unchanged']['pnl_authorized'] is False
          assert r['scientific_invariants_unchanged']['year_2025_access'] is False
          assert r['scientific_invariants_unchanged']['year_2026_access'] is False
          assert r['scientific_invariants_unchanged']['live_trading'] is False
          assert r['scientific_invariants_unchanged']['exchange_mutation'] is False
          PY
          ! grep -Eqi 'zipfile|csv\.reader|pandas|profit.factor|sharpe|requests\.(post|put|patch|delete)' "$BASE/source_gate_v02.py"

      - name: Run V0.2 source and metadata-only market-route gate
        shell: bash
        run: |
          set -euo pipefail
          BASE='Dream-Account-OS-v2.3-PARTIAL/research/exchange_delisting_shock_001'
          set +e
          python "$BASE/source_gate_v02.py"
          rc=$?
          set -e
          echo "SOURCE_GATE_RC=$rc" >> "$GITHUB_ENV"
          test -f "$BASE/source_evidence/EDS_SOURCE_DATA_GATE_V02.json"

      - name: Audit V0.2 receipt firewalls
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          p='Dream-Account-OS-v2.3-PARTIAL/research/exchange_delisting_shock_001/source_evidence/EDS_SOURCE_DATA_GATE_V02.json'
          d=json.load(open(p)); r=d['receipt']; g=r['guards']
          assert d['source_remediation_version']=='V0.2'
          assert r['classification'] in {'SOURCE_DATA_PASS','INSUFFICIENT_SOURCE_SAMPLE','INSUFFICIENT_MARKET_ROUTE_SAMPLE','SOURCE_ACCESS_BLOCKED'}
          assert g['market_price_values_opened'] is False
          assert g['returns_computed'] is False
          assert g['pnl_computed'] is False
          assert g['year_2025_opened'] is False
          assert g['year_2026_opened'] is False
          assert g['live_trading'] is False
          assert g['exchange_mutation'] is False
          if r['classification']=='SOURCE_DATA_PASS':
              assert r['qualified_token_events']>=30
              assert r['qualified_distinct_tokens']>=15
              assert {2023,2024}.issubset(set(r['qualified_years']))
              assert r['route_qualified_token_events']>=30
              assert r['route_qualified_distinct_tokens']>=15
              assert {2023,2024}.issubset(set(r['route_qualified_years']))
          print(json.dumps(r,indent=2,sort_keys=True))
          PY

      - name: Persist immutable V0.2 receipt to branch
        shell: bash
        run: |
          set -euo pipefail
          BASE='Dream-Account-OS-v2.3-PARTIAL/research/exchange_delisting_shock_001'
          git config user.name 'crypto-lab-source-gate-bot'
          git config user.email 'crypto-lab-source-gate-bot@users.noreply.github.com'
          git add "$BASE/source_evidence/EDS_SOURCE_DATA_GATE_V02.json"
          git diff --cached --quiet && exit 0
          git commit -m 'EXCHANGE-DELISTING-SHOCK-001: source gate V0.2 receipt [skip ci]'
          git pull --rebase origin exchange-delisting-shock-v0.2-source-remediation
          git push origin HEAD:exchange-delisting-shock-v0.2-source-remediation

      - name: Upload V0.2 source evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exchange-delisting-shock-source-gate-v02-${{ github.run_id }}-${{ github.run_attempt }}
          path: Dream-Account-OS-v2.3-PARTIAL/research/exchange_delisting_shock_001/source_evidence/
          retention-days: 90
          if-no-files-found: error
