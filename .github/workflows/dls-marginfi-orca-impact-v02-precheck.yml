name: DLS Marginfi Orca Impact V0.2 Pre-Outcome Gate

on:
  push:
    branches: [dls-marginfi-route-migration-v01]
    paths: [labs/DEFI_LIQUIDATION_SHOCK_001/LAUNCH_MARGINFI_ORCA_IMPACT_V02_PRECHECK.marker]

permissions: {actions: read, contents: read}

jobs:
  precheck:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {ref: "${{ github.sha }}"}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Download canonical Oct-Dec Orca source PASS
        uses: actions/download-artifact@v4
        with:
          github-token: "${{ github.token }}"
          repository: "${{ github.repository }}"
          run-id: 36817151374
          name: dls-marginfi-orca-octdec-signed-flow-source-v02
          path: source_gate
      - name: Execute source-only sample gate
        run: python labs/DEFI_LIQUIDATION_SHOCK_001/source/precheck_marginfi_orca_impact_v0_2.py --source-root source_gate
      - name: Upload immutable precheck
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dls-marginfi-orca-impact-v02-precheck
          path: |
            labs/DEFI_LIQUIDATION_SHOCK_001/MARGINFI_ORCA_IMPACT_V02_PREOUTCOME_RECEIPT.json
            labs/DEFI_LIQUIDATION_SHOCK_001/MARGINFI_ORCA_IMPACT_V02_PREOUTCOME_CASCADES.ndjson
          retention-days: 90
      - name: Firewall
        if: always()
        run: echo SOURCE_ONLY_NO_OCTDEC_MARKET_OUTCOMES
