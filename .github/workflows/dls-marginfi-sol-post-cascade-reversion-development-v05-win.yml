name: DLS Marginfi SOL Post-Cascade Reversion Development V0.5 Windows

on:
  push:
    branches:
      - dls-marginfi-transient-reversion-v01
    paths:
      - labs/DEFI_LIQUIDATION_SHOCK_001/LAUNCH_MARGINFI_SOL_POST_CASCADE_REVERSION_DEV_V05_WIN.marker

permissions:
  actions: read
  contents: read

jobs:
  development:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download exact canonical Feb-Mar source PASS artifact
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 36589912203
          artifact-ids: 11053637340
          path: source_gate

      - name: Compile frozen Development executor
        shell: pwsh
        run: python -m py_compile labs/DEFI_LIQUIDATION_SHOCK_001/source/run_marginfi_sol_post_cascade_reversion_dev_v0_1.py

      - name: Execute unchanged frozen Feb-Mar Development
        shell: pwsh
        run: >
          python labs/DEFI_LIQUIDATION_SHOCK_001/source/run_marginfi_sol_post_cascade_reversion_dev_v0_1.py
          --source-root source_gate
          --workers 12

      - name: Upload immutable Development evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dls-marginfi-sol-post-cascade-reversion-development-v05-win
          path: |
            labs/DEFI_LIQUIDATION_SHOCK_001/MARGINFI_SOL_POST_CASCADE_REVERSION_V01_DEVELOPMENT_RECEIPT.json
            labs/DEFI_LIQUIDATION_SHOCK_001/MARGINFI_SOL_POST_CASCADE_REVERSION_V01_DEVELOPMENT_LEDGER.ndjson
            labs/DEFI_LIQUIDATION_SHOCK_001/MARGINFI_SOL_POST_CASCADE_REVERSION_V01_SOURCE_CASCADES.ndjson
            labs/DEFI_LIQUIDATION_SHOCK_001/MARGINFI_SOL_POST_CASCADE_REVERSION_V01_MARKET_DATA_MANIFEST.ndjson
          if-no-files-found: warn
          retention-days: 90

      - name: Firewall
        if: always()
        shell: pwsh
        run: Write-Output "WINDOWS_RUNNER_ONLY_SCIENCE_UNCHANGED_FEBMAR_DEV_ONLY_NO_TRADING"
