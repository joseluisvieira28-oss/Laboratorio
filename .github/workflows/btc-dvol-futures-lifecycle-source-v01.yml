name: BTC DVOL Futures Lifecycle Source Gate V0.1

on:
  push:
    branches:
      - btc-dvol-futures-termstructure-v0.1
    paths:
      - 'labs/BTC_DVOL_FUTURES_TERMSTRUCTURE_001/LIFECYCLE_SOURCE_AUTHORITY_V0.1.json'
      - 'labs/BTC_DVOL_FUTURES_TERMSTRUCTURE_001/LIFECYCLE_SOURCE_TECHNICAL_SPEC_V0.1.json'
      - 'labs/BTC_DVOL_FUTURES_TERMSTRUCTURE_001/lifecycle_source_gate_v01.py'
      - '.github/workflows/btc-dvol-futures-lifecycle-source-v01.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lifecycle-source-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependency
        run: python -m pip install --disable-pip-version-check requests==2.32.3
      - name: Compile guard
        run: python -m py_compile labs/BTC_DVOL_FUTURES_TERMSTRUCTURE_001/lifecycle_source_gate_v01.py
      - name: Execute lifecycle source-only gate
        run: python labs/BTC_DVOL_FUTURES_TERMSTRUCTURE_001/lifecycle_source_gate_v01.py
      - name: Upload source receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: btc-dvol-futures-lifecycle-source-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/btc_dvol_futures_lifecycle_source_v01/
          if-no-files-found: error
          retention-days: 90
