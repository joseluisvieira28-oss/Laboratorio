name: ETH Demand Fee Flow 45D Replication V0.1
on:
  push:
    branches: [eth-demand-fee-flow-v0.1]
    paths:
      - "labs/ETH_DEMAND_FEE_FLOW_001/REPLICATION_PREFREEZE_V0.1.json"
      - "labs/ETH_DEMAND_FEE_FLOW_001/replication_v01.py"
      - ".github/workflows/eth-demand-fee-flow-replication-v01.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  replication:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install --disable-pip-version-check -q pandas numpy statsmodels
      - name: Compile
        run: python -m py_compile labs/ETH_DEMAND_FEE_FLOW_001/replication_v01.py
      - name: Run frozen independent-source 45d replication
        run: python labs/ETH_DEMAND_FEE_FLOW_001/replication_v01.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ETH_DEMAND_FEE_FLOW_001_REPLICATION_V0_1
          path: |
            edff_replication_receipt_v01.json
            edff_replication_rows_v01.csv
          if-no-files-found: warn
          retention-days: 30
