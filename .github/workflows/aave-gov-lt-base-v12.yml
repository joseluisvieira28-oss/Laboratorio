name: Aave Gov LT Base Source V12
on:
  push:
    branches: [aave-gov-lt-forced-deleveraging-v0.1]
    paths:
      - '.github/workflows/aave-gov-lt-base-v12.yml'
      - 'research/aave_gov_lt_forced_deleveraging/base_configurator_census_v12.py'
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pycryptodome==3.23.0
      - run: python research/aave_gov_lt_forced_deleveraging/base_configurator_census_v12.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aave-gov-lt-base-v12
          path: out/aave_base_v12
          retention-days: 30
