name: News Shock Lab V0.3A Consensus Combined V0.2

# audit retrigger: validate frozen 11/44 provenance corpus; no market outcomes authorized
on:
  push:
    branches:
      - dream-account-phase-b-signal-research-v0.1
    paths:
      - 'Dream-Account-OS-v2.3-PARTIAL/research/NEWS_SHOCK_LAB_V03A_CONSENSUS_SEED_TRANCHE03_FREEZE_V0.1.json'
      - 'Dream-Account-OS-v2.3-PARTIAL/research/NEWS_SHOCK_LAB_V03A_CONSENSUS_SEED_TRANCHE03_V0.1.json'
      - 'Dream-Account-OS-v2.3-PARTIAL/research/news_shock_lab_v03a_consensus_combined_v02.py'
      - '.github/workflows/news-shock-lab-v03a-consensus-combined-v02.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  news-shock-v03a-consensus-combined-v02:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install parser dependency and compile
        run: |
          cd Dream-Account-OS-v2.3-PARTIAL
          python -m pip install beautifulsoup4
          python -m compileall -q research
      - name: Verify frozen authority chain
        run: |
          cd Dream-Account-OS-v2.3-PARTIAL
          python - <<'PY'
          from research.news_shock_lab_v03a_consensus_combined_v02 import load_authority
          seed1, freeze2, seed2, freeze3, seed3 = load_authority()
          assert seed1['fingerprint'] == 'c0fdfc834cd4eb6c8f2186392de2175857c50e7ba71f4cd4bca820695ba79382'
          assert freeze2['fingerprint'] == '2f0ef842f242ec452b5dab7171ab7ce52eafc53494f2cd22131f5cbbd24ad471'
          assert seed2['fingerprint'] == '1260ea66f0e9296ac3b80dd272783b0a07a78cb31892c2d4011da9b8e3a4ec7d'
          assert freeze3['fingerprint'] == '6ed43441957a31d3f3cff59a47174f69eb8af2e79d9e48001d6a1ddeaf9fc43a'
          assert seed3['fingerprint'] == '06b06d5d151f6fd66b916322dc42e380472acc78ca7eccbeff15b91ada8d70d6'
          print('NEWS V03A COMBINED V02 AUTHORITY PASS')
          PY
      - name: Rebuild BLS actuals and validate eleven consensus events
        run: |
          cd Dream-Account-OS-v2.3-PARTIAL
          mkdir -p research/local_data/news_v03a_consensus_combined_v02_output
          set -o pipefail
          python -m research.news_shock_lab_v03a_consensus_combined_v02 \
            research/local_data/news_v03a_consensus_combined_v02_output \
            | tee research/local_data/news_v03a_consensus_combined_v02_output/combined_v02_stdout.txt
      - name: Assert 11 COMPLETE_A and all outcome guards closed
        run: |
          cd Dream-Account-OS-v2.3-PARTIAL
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('research/local_data/news_v03a_consensus_combined_v02_output')
          s = json.loads((root/'combined_v02_summary.json').read_text())
          expected_counts = {'COMPLETE_A': 11, 'CONSENSUS_PROVENANCE_INCOMPLETE': 33}
          if s['status_counts'] != expected_counts:
              raise SystemExit(f"NEWS V03A V02 STATUS COUNT DRIFT: {s['status_counts']}")
          if s.get('complete_b_count', 0) != 0:
              raise SystemExit('NEWS V03A V02 UNEXPECTED COMPLETE_B')
          if len(s['complete_a_event_ids']) != 11:
              raise SystemExit('NEWS V03A V02 COMPLETE_A COUNT DRIFT')
          for key, value in s['guards'].items():
              if value is not False:
                  raise SystemExit(f'NEWS V03A V02 OUTCOME GUARD DRIFT: {key}')
          print('NEWS V03A COMBINED V02 VALIDATION PASS', s['validation_fingerprint'])
          PY
      - name: Upload combined V0.2 provenance receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: news-shock-v03a-consensus-combined-v02-${{ github.sha }}
          path: |
            Dream-Account-OS-v2.3-PARTIAL/research/local_data/news_v03a_consensus_combined_v02_output/combined_v02_consensus_manifest.json
            Dream-Account-OS-v2.3-PARTIAL/research/local_data/news_v03a_consensus_combined_v02_output/combined_v02_validation_receipt.json
            Dream-Account-OS-v2.3-PARTIAL/research/local_data/news_v03a_consensus_combined_v02_output/combined_v02_summary.json
            Dream-Account-OS-v2.3-PARTIAL/research/local_data/news_v03a_consensus_combined_v02_output/combined_v02_stdout.txt
          if-no-files-found: warn
          retention-days: 30
