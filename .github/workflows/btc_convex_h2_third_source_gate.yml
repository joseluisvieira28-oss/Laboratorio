name: BTC-CONVEX-001 H2 third-basket source gate

on:
  pull_request:
    paths:
      - '.github/workflows/btc_convex_h2_third_source_gate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run H2 third-basket source gate only
        run: python labs/btc-convex-trend-capture-001/h2_third_basket_source_gate_v0_1.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: BTC-CONVEX-001-H2-THIRD-SOURCE-GATE-V01
          path: labs/btc-convex-trend-capture-001/evidence/H2_THIRD_BASKET_SOURCE_GATE_V0.1.json
