name: H04 flow-persistence discovery

on:
  push:
    branches:
      - dream-account-phase-b-signal-research-v0.1

jobs:
  h04-flow-discovery:
    if: ${{ contains(github.event.head_commit.message, '[H04 RUN]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install project and compile H04
        run: |
          cd Dream-Account-OS-v2.3-PARTIAL
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m py_compile research/phase_b_h04_binance_daily_manifest_v01.py research/phase_b_h04_binance_offline_adapter_v01.py research/phase_b_h04_research_evaluator_v01.py research/phase_b_h04_stage_classifier_v01.py research/phase_b_h04_discovery_runner_v01.py
      - name: Verify exact H04 authority before market-data access
        run: |
          cd Dream-Account-OS-v2.3-PARTIAL
          python - <<'PY'
          import json, hashlib
          from pathlib import Path
          from research.phase_b_h04_binance_daily_manifest_v01 import build_h04_manifest_receipt, FREEZE_FINGERPRINT
          from research.phase_b_h04_discovery_runner_v01 import _load_auth, DEFAULT_AUTHORIZATION_PATH, EXPECTED_AUTHORIZATION_FINGERPRINT, EXPECTED_MANIFEST_FINGERPRINT
          freeze=json.loads(Path('research/PHASE_B_H04_POSITIVE_TAKER_FLOW_PERSISTENCE_PROSPECTIVE_FREEZE_V0.1.json').read_text())
          unsigned=dict(freeze); supplied=unsigned.pop('fingerprint')
          recomputed=hashlib.sha256(json.dumps(unsigned,sort_keys=True,separators=(',',':'),ensure_ascii=False).encode()).hexdigest()
          assert supplied == FREEZE_FINGERPRINT == recomputed
          auth=_load_auth(DEFAULT_AUTHORIZATION_PATH)
          assert auth['fingerprint']==EXPECTED_AUTHORIZATION_FINGERPRINT
          assert build_h04_manifest_receipt()['fingerprint']==EXPECTED_MANIFEST_FINGERPRINT
          assert auth['mexc_2025_09_through_2025_12_authorized'] is False
          assert auth['holdout_2026_authorized'] is False
          assert auth['exchange_mutation_authorized'] is False
          assert auth['live_trading_authorized'] is False
          print('PASS: H04 freeze/auth/manifest exact; protected data remains locked')
          PY
      - name: Acquire exact official Binance H04 corpus
        run: |
          cd Dream-Account-OS-v2.3-PARTIAL
          python - <<'PY'
          from concurrent.futures import ThreadPoolExecutor, as_completed
          import json, time
          from pathlib import Path
          from urllib.error import HTTPError, URLError
          from urllib.request import Request, urlopen
          from research.phase_b_h04_binance_daily_manifest_v01 import expected_h04_daily_objects
          root=Path('research/local_data/h04_binance_raw'); root.mkdir(parents=True,exist_ok=True)
          tasks=[]
          for item in expected_h04_daily_objects():
              d=root/item['symbol']; d.mkdir(parents=True,exist_ok=True)
              tasks.append((item['archive_url'],d/item['archive_filename']))
              tasks.append((item['checksum_url'],d/(item['archive_filename']+'.CHECKSUM')))
          def dl(task):
              url,path=task; last=None
              for attempt in range(1,5):
                  try:
                      req=Request(url,headers={'User-Agent':'DreamAccountOS-H04-Research/0.1'})
                      with urlopen(req,timeout=45) as response:
                          if response.status!=200: raise RuntimeError(f'HTTP {response.status}')
                          data=response.read()
                      if not data: raise RuntimeError('empty response')
                      path.write_bytes(data); return str(path),len(data),None
                  except (HTTPError,URLError,TimeoutError,OSError,RuntimeError) as exc:
                      last=f'{type(exc).__name__}: {exc}'
                      if attempt<4: time.sleep(min(2**attempt,8))
              return str(path),0,last
          failures=[]; total=0; completed=0
          with ThreadPoolExecutor(max_workers=32) as pool:
              futures=[pool.submit(dl,t) for t in tasks]
              for f in as_completed(futures):
                  path,size,error=f.result(); completed+=1; total+=size
                  if error: failures.append({'path':path,'error':error})
                  if completed%750==0 or completed==len(tasks): print(f'H04 acquisition {completed}/{len(tasks)} failures={len(failures)}')
          receipt={'document_type':'PHASE_B_H04_NETWORK_ACQUISITION_RECEIPT','version':'0.1','expected_files_total':len(tasks),'files_downloaded':completed-len(failures),'total_bytes_downloaded':total,'failure_count':len(failures),'first_failures':failures[:20],'mexc_2025_09_through_2025_12_accessed':False,'holdout_2026_accessed':False,'exchange_mutation_performed':False,'live_trading_performed':False}
          out=Path('research/local_data/h04_binance_output'); out.mkdir(parents=True,exist_ok=True); (out/'h04_network_acquisition_receipt.json').write_text(json.dumps(receipt,indent=2,sort_keys=True)+'\n')
          if failures: raise SystemExit(f'H04 acquisition failed closed: {len(failures)}')
          PY
      - name: Run frozen H04 discovery
        run: |
          cd Dream-Account-OS-v2.3-PARTIAL
          set -o pipefail
          python -m research.phase_b_h04_discovery_runner_v01 research/local_data/h04_binance_raw research/local_data/h04_binance_output/latest_h04_discovery_receipt.json research/PHASE_B_H04_BINANCE_DATA_ACCESS_AUTHORIZATION_V0.1.json | tee research/local_data/h04_binance_output/h04_runner_stdout.txt
      - name: Upload H04 scientific receipts only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: h04-flow-discovery-${{ github.sha }}
          path: |
            Dream-Account-OS-v2.3-PARTIAL/research/local_data/h04_binance_output/h04_network_acquisition_receipt.json
            Dream-Account-OS-v2.3-PARTIAL/research/local_data/h04_binance_output/latest_h04_discovery_receipt.json
            Dream-Account-OS-v2.3-PARTIAL/research/local_data/h04_binance_output/h04_runner_stdout.txt
          if-no-files-found: warn
          retention-days: 14
