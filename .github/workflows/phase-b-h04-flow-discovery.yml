name: H04 flow-persistence discovery

on:
  push:
    branches:
      - dream-account-phase-b-signal-research-v0.1

jobs:
  h04-flow-discovery:
    if: ${{ contains(github.event.head_commit.message, '[H04 RUN]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Pre-data fingerprint diagnostic only
        run: |
          cd Dream-Account-OS-v2.3-PARTIAL
          python -m pip install -e .
          python - <<'PY'
          import json, hashlib
          from pathlib import Path
          from research.phase_b_h04_binance_daily_manifest_v01 import build_h04_manifest_receipt, FREEZE_FINGERPRINT
          from research.phase_b_h04_discovery_runner_v01 import EXPECTED_AUTHORIZATION_FINGERPRINT, EXPECTED_MANIFEST_FINGERPRINT
          freeze=json.loads(Path('research/PHASE_B_H04_POSITIVE_TAKER_FLOW_PERSISTENCE_PROSPECTIVE_FREEZE_V0.1.json').read_text())
          unsigned=dict(freeze); supplied=unsigned.pop('fingerprint')
          recomputed=hashlib.sha256(json.dumps(unsigned,sort_keys=True,separators=(',',':'),ensure_ascii=False).encode()).hexdigest()
          auth=json.loads(Path('research/PHASE_B_H04_BINANCE_DATA_ACCESS_AUTHORIZATION_V0.1.json').read_text())
          au=dict(auth); auth_supplied=au.pop('fingerprint')
          auth_recomputed=hashlib.sha256(json.dumps(au,sort_keys=True,separators=(',',':'),ensure_ascii=False).encode()).hexdigest()
          manifest=build_h04_manifest_receipt()
          print('FREEZE_SUPPLIED', supplied)
          print('FREEZE_MODULE_EXPECTED', FREEZE_FINGERPRINT)
          print('FREEZE_RECOMPUTED', recomputed)
          print('AUTH_SUPPLIED', auth_supplied)
          print('AUTH_RUNNER_EXPECTED', EXPECTED_AUTHORIZATION_FINGERPRINT)
          print('AUTH_RECOMPUTED', auth_recomputed)
          print('MANIFEST_RUNTIME', manifest['fingerprint'])
          print('MANIFEST_RUNNER_EXPECTED', EXPECTED_MANIFEST_FINGERPRINT)
          raise SystemExit('PRE_DATA_DIAGNOSTIC_STOP_NO_MARKET_DATA_ACCESSED')
          PY
