name: DLS Marginfi Q1-2025 Liability-Regime Source V0.1

on:
  push:
    branches:
      - dls-marginfi-2025-q1-regime-source-v01
    paths:
      - labs/DEFI_LIQUIDATION_SHOCK_001/LAUNCH_MARGINFI_2025_Q1_LIABILITY_REGIME_V01.marker

permissions:
  actions: read
  contents: read

jobs:
  month:
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        month: ["202501","202502","202503"]
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile frozen source collector
        run: python -m py_compile labs/DEFI_LIQUIDATION_SHOCK_001/source/collect_marginfi_2025_q1_liability_regime_v0_1.py

      - name: Collect one Q1 source month
        run: >
          python labs/DEFI_LIQUIDATION_SHOCK_001/source/collect_marginfi_2025_q1_liability_regime_v0_1.py
          --month ${{ matrix.month }}

      - name: Upload immutable monthly evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dls-marginfi-2025-q1-liability-regime-${{ matrix.month }}-v01
          path: |
            labs/DEFI_LIQUIDATION_SHOCK_001/MARGINFI_2025_Q1_LIABILITY_REGIME_${{ matrix.month }}_RECEIPT_V0.1.json
            labs/DEFI_LIQUIDATION_SHOCK_001/MARGINFI_2025_Q1_LIABILITY_REGIME_${{ matrix.month }}_ROWS_V0.1.ndjson
          if-no-files-found: warn
          retention-days: 90

      - name: Firewall
        if: always()
        run: echo SOURCE_ONLY_NO_2025_MARKET_OUTCOMES_NO_2026_NO_TRADING

  merge:
    if: always()
    needs: month
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download Q1 monthly evidence
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ github.run_id }}
          pattern: dls-marginfi-2025-q1-liability-regime-*-v01
          path: months
          merge-multiple: false

      - name: Compile frozen source merge
        run: python -m py_compile labs/DEFI_LIQUIDATION_SHOCK_001/source/merge_marginfi_2025_q1_liability_regime_v0_1.py

      - name: Merge and adjudicate Q1 source regime
        run: >
          python labs/DEFI_LIQUIDATION_SHOCK_001/source/merge_marginfi_2025_q1_liability_regime_v0_1.py
          --root months

      - name: Upload terminal Q1 source evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dls-marginfi-2025-q1-liability-regime-source-v01
          path: |
            labs/DEFI_LIQUIDATION_SHOCK_001/MARGINFI_2025_Q1_LIABILITY_REGIME_SOURCE_RECEIPT_V0.1.json
          if-no-files-found: warn
          retention-days: 90

      - name: Firewall
        if: always()
        run: echo SOURCE_ONLY_NO_2025_MARKET_OUTCOMES_NO_2026_NO_TRADING
