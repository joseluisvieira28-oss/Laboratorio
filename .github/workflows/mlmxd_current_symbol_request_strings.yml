name: MLMXD Current Spot Symbol Request Strings
on:
  push:
    branches: [mexc-launchpool-mx-demand-v0.1-source-2026-10-07]
    paths: ['research/mexc_launchpool_mx_demand/current_symbol_request_strings.py','.github/workflows/mlmxd_current_symbol_request_strings.yml']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  extract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install requests
      - run: python research/mexc_launchpool_mx_demand/current_symbol_request_strings.py
