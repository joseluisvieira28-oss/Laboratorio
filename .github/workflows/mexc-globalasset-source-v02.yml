name: MEXC GlobalAsset Source Discovery V0.2

on:
  push:
    branches:
      - mexc-globalasset-operational-v0.2-source-discovery-2026-10-04

permissions:
  contents: read

jobs:
  source-discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependency
        run: python -m pip install --disable-pip-version-check requests
      - name: Freeze check
        run: |
          test "$GITHUB_REF_NAME" = "mexc-globalasset-operational-v0.2-source-discovery-2026-10-04"
          test -f research/mexc_global_assets/MEXC_GLOBALASSET_SOURCE_DISCOVERY_FREEZE_V0.2.md
          python -m py_compile research/mexc_global_assets/mexc_globalasset_source_discovery_v02.py
          echo SOURCE_ONLY_DISCOVERY_FREEZE_PASS
      - name: Run source discovery
        run: python research/mexc_global_assets/mexc_globalasset_source_discovery_v02.py
      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: mexc-globalasset-source-v02-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/mexc_global_assets/globalasset_source_discovery_v02
          if-no-files-found: error
          retention-days: 90