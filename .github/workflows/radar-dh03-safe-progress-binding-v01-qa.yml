name: Radar DH03 Safe Progress Binding V0.1 QA

on:
  pull_request:
    branches:
      - crypto-edge-radar-postgres-v0.5
    paths:
      - "crypto_edge_radar/radar/external_freshness.py"
      - "crypto_edge_radar/tests/test_external_freshness.py"
      - "governance/HTF_DH03_12H_SAFE_PROGRESS_TELEMETRY_V0.1_2026-09-26.md"
      - ".github/workflows/radar-dh03-safe-progress-binding-v01-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          cd crypto_edge_radar
          python -m pip install -e .
      - name: Compile
        run: |
          cd crypto_edge_radar
          python -m compileall radar tests
      - name: Targeted external freshness tests
        run: |
          cd crypto_edge_radar
          python -m unittest -v tests.test_external_freshness
      - name: Full deterministic Radar suite
        run: |
          cd crypto_edge_radar
          python -m unittest discover -s tests -v
      - name: DH03 safe telemetry firewall guard
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path("crypto_edge_radar/radar/external_freshness.py").read_text()
          assert "DH03_SAFE_PROGRESS_V0.1" in p
          assert "source_workflow_run_id" in p
          assert "SAFE_AGGREGATE_PROGRESS_BOUND_TO_WORKFLOW_RUN__NO_OUTCOMES_IMPORTED" in p
          assert "safe_progress_outcomes_imported" in p
          assert '"eligible_event_count": counts["signals"]' in p
          assert '"resolved_forward_count": counts["final_resolutions"]' in p
          for forbidden in (
              'base_net_r',
              'stress_net_r',
              'entry_price',
              'exit_price',
              'profit_factor',
          ):
              assert forbidden not in p, forbidden
          print("RADAR_DH03_SAFE_PROGRESS_BINDING_V01_GUARD_PASS")
          PY
