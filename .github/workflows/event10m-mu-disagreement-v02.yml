name: EVENT-10M MU Historical Disagreement V0.2 (Discovery Only)
on:
  push:
    branches:
      - research/event10m-mu-divergence-pilot-v02-2026-10-29
    paths:
      - .github/workflows/event10m-mu-disagreement-v02.yml
permissions:
  contents: read
jobs:
  research-proxy-only:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Audit prevalidated canonical source hashes and run unchanged historical ten-minute disagreement proxy
        run: python research/mexc_event_direction_v01/event10m_mu_divergence_v02.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: event10m-mu-disagreement-v02
          path: artifacts/event10m_mu_divergence_v02/receipt.json
          if-no-files-found: warn
