name: Binance Margin Borrow Access 001 — Source Census V0.1

on:
  push:
    branches:
      - binance-margin-borrow-access-v0.1
    paths:
      - research/binance_margin_borrow_access/source_census.py
      - .github/workflows/binance-margin-borrow-access-source-census-v01.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-census:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout frozen research branch
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependency
        run: pip install --disable-pip-version-check requests
      - name: Execute outcome-blind announcement census
        run: python research/binance_margin_borrow_access/source_census.py
      - name: Upload canonical census receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BINANCE_MARGIN_BORROW_ACCESS_001_SOURCE_CENSUS_V0_1
          path: source_census_output/BINANCE_MARGIN_BORROW_ACCESS_001_SOURCE_CENSUS_RECEIPT_V0_1.json
          if-no-files-found: warn
          retention-days: 30
