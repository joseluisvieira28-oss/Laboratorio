name: Triple Fishing Capacity Audit V0.1

on:
  push:
    branches:
      - triple-fishing-capacity-audit-v01-2026-10-02
    paths:
      - 'crypto_edge_radar/capacity_audit/**'
      - 'crypto_edge_radar/tests/test_triple_fishing_capacity_audit_v01.py'
      - '.github/workflows/triple-fishing-capacity-audit-v01.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install runtime and run deterministic capacity tests
        working-directory: crypto_edge_radar
        run: |
          python -m pip install -e .
          PYTHONPATH=. python -m unittest tests.test_triple_fishing_capacity_audit_v01 -v

      - name: Download latest successful DH03 prospective shadow evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p audit_inputs/dh03
          RUN_ID="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs?branch=htf-dh03-12h-standalone-forward-v0.1&status=success&per_page=100"             --jq '.workflow_runs[] | select(.name=="HTF DH03 12H — Prospective Archive Shadow") | .id' | head -n 1)"
          test -n "$RUN_ID"
          echo "DH03_SOURCE_RUN_ID=$RUN_ID"
          gh run download "$RUN_ID" -n dh03-shadow-state -D audit_inputs/dh03
          test -f audit_inputs/dh03/latest_receipt.json

      - name: Capture current public BNB Launchpool snapshot
        working-directory: crypto_edge_radar
        shell: bash
        run: |
          mkdir -p ../audit_inputs
          set +e
          PYTHONPATH=. python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path
          from radar.bnb_launchpool_watcher import BinanceOfficialLaunchpoolSource, _cluster_announcements
          from radar.bnb_operator_source_v03 import _build_signal
          now_ms=int(datetime.now(timezone.utc).timestamp()*1000)
          try:
              src=BinanceOfficialLaunchpoolSource(timeout=20)
              events=src.discover_eligible(now_ms=now_ms)
              clusters=_cluster_announcements(events)
              payload={
                  "status":"PASS_PUBLIC_SOURCE",
                  "checked_at_utc":datetime.now(timezone.utc).isoformat().replace("+00:00","Z"),
                  "eligible_events":[
                      {
                          "article_code":e.article_code,
                          "title":e.title,
                          "published_utc":e.published_utc,
                          "published_ms":e.published_ms,
                      } for e in events
                  ],
                  "signals":[_build_signal(c) for c in clusters],
                  "authenticated_exchange_api_used":False,
                  "orders_created":False,
                  "exchange_mutation_performed":False,
              }
          except Exception as exc:
              payload={
                  "status":"BLOCKED_PUBLIC_SOURCE",
                  "checked_at_utc":datetime.now(timezone.utc).isoformat().replace("+00:00","Z"),
                  "eligible_events":[],
                  "signals":[],
                  "error":f"{type(exc).__name__}:{exc}",
                  "authenticated_exchange_api_used":False,
                  "orders_created":False,
                  "exchange_mutation_performed":False,
              }
          Path("../audit_inputs/bnb_snapshot.json").write_text(json.dumps(payload,indent=2,sort_keys=True)+"\n",encoding="utf-8")
          print(json.dumps(payload,sort_keys=True))
          PY
          exit 0

      - name: Run capacity and architecture audit
        run: |
          mkdir -p capacity_audit_out
          python crypto_edge_radar/capacity_audit/audit_triple_fishing_capacity_v01.py             --repo-root "$GITHUB_WORKSPACE"             --dh03-receipt audit_inputs/dh03/latest_receipt.json             --bnb-snapshot audit_inputs/bnb_snapshot.json             --output-json capacity_audit_out/TRIPLE_FISHING_CAPACITY_AUDIT_V0.1.json             --output-md capacity_audit_out/TRIPLE_FISHING_CAPACITY_AUDIT_V0.1.md

      - name: Assert audit is non-mutating and current authority unchanged
        run: |
          python - <<'PY'
          import json
          r=json.load(open("capacity_audit_out/TRIPLE_FISHING_CAPACITY_AUDIT_V0.1.json",encoding="utf-8"))
          g=r["governance"]
          assert g["live_trading_authorized"] is False
          assert g["orders_created"] is False
          assert g["exchange_mutation_performed"] is False
          assert g["current_authority_modified"] is False
          assert r["findings"]["single_global_slot_is_current_authority"] is True
          print(r["verdict"])
          print("DH03 blocked under 1 slot:",r["findings"]["dh03_single_slot_blocked"])
          print("DH03 peak concurrency:",r["findings"]["dh03_peak_cross_symbol_concurrency_observed_or_open"])
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: triple-fishing-capacity-audit-v01
          retention-days: 90
          if-no-files-found: error
          path: capacity_audit_out/*
