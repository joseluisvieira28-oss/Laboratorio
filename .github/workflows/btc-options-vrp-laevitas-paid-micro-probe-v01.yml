name: BTC-OPTIONS-VRP-001 Laevitas Paid Micro-Probe V0.1

on:
  workflow_dispatch:
    inputs:
      network:
        description: 'Settlement network. Must match the funded dedicated micro-wallet secret.'
        required: true
        type: choice
        options:
          - base
          - solana
      confirmation:
        description: 'Type exactly PAY-EXACTLY-0.10-USDC-ONE-BUNDLE'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: btc-options-vrp-laevitas-paid-micro-probe-v01
  cancel-in-progress: false

jobs:
  paid-micro-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      LAEVITAS_X402_NETWORK: ${{ inputs.network }}
      LAEVITAS_X402_CONFIRM: ${{ inputs.confirmation }}
      LAEVITAS_X402_EVM_PRIVATE_KEY: ${{ secrets.LAEVITAS_X402_EVM_PRIVATE_KEY }}
      LAEVITAS_X402_SOLANA_PRIVATE_KEY: ${{ secrets.LAEVITAS_X402_SOLANA_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: btc-options-vrp-laevitas-source-v0.1

      - name: Verify frozen paid authority and frozen x402 challenge
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          a=json.load(open('labs/BTC_OPTIONS_VRP_001/LAEVITAS_PAID_MICRO_PROBE_AUTHORITY_V0.1.json'))
          c=json.load(open('labs/BTC_OPTIONS_VRP_001/LAEVITAS_X402_CHALLENGE_FROZEN_V0.1.json'))
          assert a['authority_drive_id']=='1ubeAsxZjdSi-78zZLGY8LT_1mhoWeaE7fkwDz6zD7b8'
          assert a['provider_payment_cap_usdc']==0.10
          assert a['max_bundle_purchases']==1
          assert a['outcomes_authorized'] is False
          assert a['strategy_pnl_authorized'] is False
          assert a['access_2025_authorized'] is False
          assert a['access_2026_authorized'] is False
          assert c['challenge_run_id']==35080638186
          assert c['x402_version']==2
          assert c['accepts']['base']['amount']=='100000'
          assert c['accepts']['solana']['amount']=='100000'
          print('PAID_MICRO_AUTHORITY_AND_CHALLENGE_PASS')
          PY

      - name: Reject absent selected signer before installing payment client
        shell: bash
        run: |
          set -euo pipefail
          if [ "${LAEVITAS_X402_CONFIRM}" != "PAY-EXACTLY-0.10-USDC-ONE-BUNDLE" ]; then
            echo 'Confirmation token mismatch; refusing payment.' >&2
            exit 2
          fi
          if [ "${LAEVITAS_X402_NETWORK}" = "base" ]; then
            test -n "${LAEVITAS_X402_EVM_PRIVATE_KEY}" || { echo 'Missing LAEVITAS_X402_EVM_PRIVATE_KEY secret.' >&2; exit 2; }
          elif [ "${LAEVITAS_X402_NETWORK}" = "solana" ]; then
            test -n "${LAEVITAS_X402_SOLANA_PRIVATE_KEY}" || { echo 'Missing LAEVITAS_X402_SOLANA_PRIVATE_KEY secret.' >&2; exit 2; }
          else
            echo 'Unsupported network.' >&2
            exit 2
          fi

      - name: Install pinned x402 client dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm init -y >/dev/null 2>&1
          npm install --no-save --ignore-scripts \
            @x402/fetch@2.26.0 \
            @x402/evm@2.26.0 \
            @x402/svm@2.26.0 \
            viem@2.48.11 \
            @solana/kit@5.1.0 \
            @scure/base@1.2.6

      - name: Execute exactly one payment-enabled historical source request
        shell: bash
        run: |
          set -euo pipefail
          node labs/BTC_OPTIONS_VRP_001/laevitas_paid_micro_probe_v01.mjs

      - name: Upload paid source evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: btc-options-vrp-laevitas-paid-micro-probe-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/btc_options_vrp_laevitas_paid_micro_probe_v01/
          retention-days: 90
          if-no-files-found: warn
