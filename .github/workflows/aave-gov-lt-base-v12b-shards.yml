name: Aave Gov LT Base V12B Shards
on:
  push:
    branches: [aave-gov-lt-forced-deleveraging-v0.1]
    paths:
      - '.github/workflows/aave-gov-lt-base-v12b-shards.yml'
      - 'research/aave_gov_lt_forced_deleveraging/base_v12b_shard.py'
permissions:
  contents: read
jobs:
  source:
    strategy:
      fail-fast: false
      matrix:
        shard: [0,1,2,3,4,5]
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      SHARD: ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pycryptodome==3.23.0
      - run: python research/aave_gov_lt_forced_deleveraging/base_v12b_shard.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aave-gov-lt-base-v12b-shard-${{ matrix.shard }}
          path: out/aave_base_v12b_shard_${{ matrix.shard }}
          retention-days: 30
