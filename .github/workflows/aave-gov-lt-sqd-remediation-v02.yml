name: Aave Gov LT SQD Source V02
on:
  push:
    branches: [aave-gov-lt-forced-deleveraging-v0.1]
    paths: [research/aave_gov_lt_forced_deleveraging/sqd_transport_v02.py, .github/workflows/aave-gov-lt-sqd-remediation-v02.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pycryptodome==3.23.0
      - run: python research/aave_gov_lt_forced_deleveraging/sqd_transport_v02.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aave-gov-lt-sqd-source-v02
          path: out/aave_sqd_v02/
          retention-days: 30
