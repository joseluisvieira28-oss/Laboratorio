name: microstructure-source-gate-v01

on:
  pull_request:
    paths:
      - 'research/microstructure_scalping/**'
      - '.github/workflows/microstructure-source-gate-v01.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run source probe
        run: python research/microstructure_scalping/probe_sources_v01.py
      - name: Print receipt
        if: always()
        run: cat research/microstructure_scalping/receipts/source_probe_v01.json || true
