name: source-t0-probe-v47-secret-bft-time-reconstruction
on:
  push:
    branches: [cosmos-native-emission-param-shock-001-v0.2-t0-remediation-2026-10-07]
    paths: [.github/workflows/source-t0-probe-v47-secret-bft-time-reconstruction.yml]
permissions: {contents: write}
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with: {ref: cosmos-native-emission-param-shock-001-v0.2-t0-remediation-2026-10-07}
      - name: Reconstruct BFT next-block timestamps
        run: |
          python3 - <<'PY'
          import json,urllib.request,ssl,hashlib,datetime,os
          RPC="https://rpc.archive.osmosis.zone"
          OUT="research/cosmos_native_emission_param_shock_001_v0_2/SCRT287_BFT_TIME_RECONSTRUCTION_V47.json"
          TX917="A6C41AB15E9B2CA4A9ADB690B1E1FC4C98858D449F769DBD1247D73FF6B5E660"
          TX969="6A8E61D877781D41D6D87677D62CDB4EE9511AB05CE03F61B10C1FC8C8BC35DA"
          TX970="8FF39B8CB8B515ED272394BC1A312F71A2D110CC73FDDBDB6669B4AB2466CCE8"
          TARGET_NS=1701917698930543213
          def gettx(h):
            u=f"{RPC}/tx?hash=0x{h}&prove=false"
            q=urllib.request.Request(u,headers={"User-Agent":"CryptoLab-v47"})
            with urllib.request.urlopen(q,timeout=20,context=ssl._create_unverified_context()) as r:
              b=r.read();return json.loads(b),hashlib.sha256(b).hexdigest()
          def vi(b,i):
            x=s=0
            while 1:
              c=b[i];i+=1;x|=(c&127)<<s
              if not c&128:return x,i
              s+=7
          def fields(b):
            i=0;o=[]
            while i<len(b):
              try:k,i=vi(b,i)
              except:break
              n,w=k>>3,k&7
              if w==0:v,i=vi(b,i);o.append((n,w,v))
              elif w==1:o.append((n,w,b[i:i+8]));i+=8
              elif w==2:
                l,i=vi(b,i);o.append((n,w,b[i:i+l]));i+=l
              elif w==5:o.append((n,w,b[i:i+4]));i+=4
              else:break
            return o
          def vals(a,n,w=None):
            return [z for x,y,z in a if x==n and (w is None or y==w)]
          def one(a,n,w=None):
            z=vals(a,n,w);return z[0] if z else None
          def ts(pb):
            a=fields(pb);sec=int(one(a,1,0) or 0);nano=int(one(a,2,0) or 0)
            return sec*10**9+nano
          def iso(n):
            sec,nano=divmod(n,10**9);d=datetime.datetime.fromtimestamp(sec,tz=datetime.timezone.utc)
            return d.strftime("%Y-%m-%dT%H:%M:%S")+("."+(f"{nano:09d}").rstrip("0") if nano else "")+"Z"
          def headerhex(tx):
            for ev in ((tx.get("result") or {}).get("tx_result") or {}).get("events") or []:
              if ev.get("type")!="update_client":continue
              a={x.get("key"):x.get("value") for x in ev.get("attributes") or []}
              if a.get("client_id")=="07-tendermint-1588":return a.get("header")
            raise ValueError("Secret update_client header missing")
          def decode(hx):
            raw=bytes.fromhex(hx);af=fields(raw);iv=one(af,2,2);ih=fields(iv)
            sh=fields(one(ih,1,2));tmh=fields(one(sh,1,2));commit=fields(one(sh,2,2))
            vs=fields(one(ih,2,2))
            chain=one(tmh,2,2).decode();height=int(one(tmh,3,0));ht=ts(one(tmh,4,2))
            powers={}
            for vb in vals(vs,1,2):
              v=fields(vb);addr=one(v,1,2);power=one(v,3,0)
              if addr is not None and power is not None:powers[addr.hex().upper()]=int(power)
            weighted=[];missing=[];absent=0
            for sb in vals(commit,4,2):
              s=fields(sb);flag=int(one(s,1,0) or 0)
              if flag==1:absent+=1;continue
              addr=one(s,2,2);tb=one(s,3,2)
              if addr is None or tb is None:continue
              key=addr.hex().upper();p=powers.get(key)
              if p is None:missing.append(key);continue
              weighted.append((ts(tb),p,key,flag))
            total=sum(x[1] for x in weighted);med=total//2
            weighted.sort(key=lambda x:x[0])
            chosen=None;remain=med
            for t,p,a,f in weighted:
              if remain<=p:
                chosen=t;break
              remain-=p
            return {"chain_id":chain,"height":height,"header_time_ns":ht,"header_time":iso(ht),
              "validator_count":len(powers),"commit_signature_count":len(vals(commit,4,2)),
              "non_absent_weighted_count":len(weighted),"absent_count":absent,
              "missing_validator_addresses":missing,"total_signed_voting_power":total,
              "median_initial":med,"next_block_time_ns":chosen,"next_block_time":iso(chosen),
              "header_hex_sha256":hashlib.sha256(raw).hexdigest()}
          tx917,s917=gettx(TX917);tx969,s969=gettx(TX969);tx970,s970=gettx(TX970)
          a917=decode(headerhex(tx917));a969=decode(headerhex(tx969));a970=decode(headerhex(tx970))
          control=(a969["height"]==11880969 and a970["height"]==11880970 and
                   a969["next_block_time_ns"]==a970["header_time_ns"] and not a969["missing_validator_addresses"])
          t918=a917["next_block_time_ns"] if control and not a917["missing_validator_addresses"] else None
          decision=None
          if t918 is not None:
            if t918>=TARGET_NS:
              decision={"H_vote_end_block":11880918,"T0_first_new_param_mint_block":11880919,
                "proof":"BFT weighted median reconstructs block 11880918 time from signed commit 11880917"}
            else:
              decision={"eliminated_height":11880918,"remaining_H_candidates":[11880919,11880920,11880921,11880922]}
          out={"scope":"SOURCE_ONLY_NO_MARKET_DATA","target_voting_end":"2023-12-07T02:54:58.930543213Z",
            "version_anchor":{"SecretNetwork":"v1.12.0","tendermint_fork":"d62916253d52",
              "rule":"state.MakeBlock uses MedianTime(commit,state.LastValidators); MedianTime uses WeightedMedian vote timestamps by voting power"},
            "carrier_receipts":{"tx917_sha256":s917,"tx969_sha256":s969,"tx970_sha256":s970},
            "source_917":a917,"control_969":a969,"control_actual_970":a970,
            "control_exact_match":control,
            "reconstructed_11880918_time":iso(t918) if t918 is not None else None,
            "reconstructed_11880918_time_ns":t918,"decision":decision,
            "tested_utc":datetime.datetime.now(datetime.timezone.utc).isoformat()}
          os.makedirs(os.path.dirname(OUT),exist_ok=True);open(OUT,"w").write(json.dumps(out,indent=2))
          print("V47",json.dumps({"control":control,"actual970":a970["header_time"],"pred970":a969["next_block_time"],
            "t918":out["reconstructed_11880918_time"],"decision":decision}))
          PY
      - name: Persist
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/cosmos_native_emission_param_shock_001_v0_2/SCRT287_BFT_TIME_RECONSTRUCTION_V47.json
          git commit -m "SCRT287: persist BFT-time reconstruction v47"
          git pull --rebase origin cosmos-native-emission-param-shock-001-v0.2-t0-remediation-2026-10-07
          git push origin HEAD:cosmos-native-emission-param-shock-001-v0.2-t0-remediation-2026-10-07
