name: Binance Margin Borrow Access 001 — Source Census V0.2

on:
  push:
    branches:
      - binance-margin-borrow-access-v0.1
    paths:
      - research/binance_margin_borrow_access/source_census_v02.py
      - research/binance_margin_borrow_access/BINANCE_MARGIN_BORROW_ACCESS_001_SOURCE_TRANSPORT_REMEDIATION_V0_2.md
      - .github/workflows/binance-margin-borrow-access-source-census-v02.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-census-v02:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout frozen research branch
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install source dependencies
        run: pip install --disable-pip-version-check requests beautifulsoup4
      - name: Execute protected-period-safe source census V0.2
        run: python research/binance_margin_borrow_access/source_census_v02.py
      - name: Upload source census V0.2 receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BINANCE_MARGIN_BORROW_ACCESS_001_SOURCE_CENSUS_V0_2
          path: source_census_v02_output/BINANCE_MARGIN_BORROW_ACCESS_001_SOURCE_CENSUS_RECEIPT_V0_2.json
          if-no-files-found: warn
          retention-days: 30
