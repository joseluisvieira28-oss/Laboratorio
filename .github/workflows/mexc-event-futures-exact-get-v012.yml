name: MEXC Event Futures Exact GET V0.12

on:
  push:
    branches:
      - mexc-event-futures-exact-get-v0.12-2026-10-02
    paths:
      - 'research/mexc_event_futures/**'
      - '.github/workflows/mexc-event-futures-exact-get-v012.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-get:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install --upgrade pip requests
      - name: Syntax check
        run: python -m py_compile research/mexc_event_futures/exact_get_v012.py
      - name: Probe exact public Event Futures route
        run: python research/mexc_event_futures/exact_get_v012.py
      - name: Verify boundary
        shell: bash
        run: |
          python - <<'PY'
          import json
          j=json.load(open('artifacts/mexc_event_futures/exact_get_v012.json',encoding='utf-8'))
          assert j['authenticated_requests']==0
          assert j['orders']==0
          assert j['account_mutations']==0
          print('BOUNDARY=PASS')
          print('VERDICT='+j['verdict'])
          PY
      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: mexc-event-futures-exact-get-v012-evidence
          path: artifacts/mexc_event_futures/exact_get_v012.json
          if-no-files-found: error
