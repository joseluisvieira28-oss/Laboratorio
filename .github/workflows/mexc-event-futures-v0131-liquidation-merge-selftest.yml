name: MEXC V0.13.1 Liquidation Calibration Merge Self-Test
on:
  push:
    branches:
      - mexc-event-futures-v013-source-completion-2026-10-03
    paths:
      - '.github/workflows/mexc-event-futures-v0131-liquidation-merge-selftest.yml'
permissions:
  contents: read
jobs:
  selftest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: |
          python -m py_compile research/mexc_event_futures/liquidation_flow_calibration_merge_v0131.py
          python research/mexc_event_futures/liquidation_flow_calibration_merge_v0131.py --self-test
