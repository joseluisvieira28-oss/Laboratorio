name: FUNDING HUNTER V02C Same Venue OKX USDC Source Discovery
on:
  push:
    branches: [research/funding-hunter-v02-source-rescue-2026-10-19]
    paths: [.github/workflows/funding_hunter_v02c_usdc_source.yml]
permissions:
  contents: read
jobs:
  read-only-2025-usdc-catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Four 2025-only public OKX USDC archive-catalogue GETs, no funding numbers
        run: python -m research.funding_hunter_v02.okx_usdc_2025_metadata
      - uses: actions/upload-artifact@v4
        with:
          name: FUNDING-HUNTER-V02C-USDC-2025-CATALOGUE-NO-OUTCOMES
          path: research/funding_hunter_v02/receipts/V02C_USDC_OFFICIAL_METADATA_ONLY.json
          retention-days: 15
