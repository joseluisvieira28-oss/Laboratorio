name: BNB Launchpool Demand 2025 OOS Source Gate V0.1

on:
  push:
    branches:
      - bnb-launchpool-demand-v2-oos-2025-v01

permissions:
  contents: write

jobs:
  source-gate:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout OOS branch
        uses: actions/checkout@v4
        with:
          ref: bnb-launchpool-demand-v2-oos-2025-v01
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Preflight freeze
        shell: bash
        run: |
          set -euo pipefail
          BASE='Dream-Account-OS-v2.3-PARTIAL/research/bnb_launchpool_demand_001'
          python -m py_compile "$BASE/oos_2025/source_gate_v01.py"
          python - <<'PY'
          import json
          b='Dream-Account-OS-v2.3-PARTIAL/research/bnb_launchpool_demand_001'
          f=json.load(open(b+'/BNB_LAUNCHPOOL_DEMAND_001_V2_OOS_2025_FREEZE_V0.1.json'))
          s=json.load(open(b+'/oos_2025/BNB_LAUNCHPOOL_DEMAND_001_OOS_2025_SOURCE_SEED_V0.1.json'))
          assert f['status']=='FROZEN_PRE_2025_SOURCE_AND_MARKET_OUTCOME_ACCESS'
          assert f['parent_evidence_binding']['sealed_parent_head']=='46104f6057701abf6b7c6330263f94f0557fcb42'
          assert f['governing_policy']['support_path']=='PATH_2_GENUINELY_INDEPENDENT_OOS_REPLICATION'
          assert [e['n'] for e in s['events']]==list(range(64,72))
          assert s['market_prices_opened'] is False
          PY
      - name: Execute source-only gate
        shell: bash
        run: |
          set -euo pipefail
          BASE='Dream-Account-OS-v2.3-PARTIAL/research/bnb_launchpool_demand_001'
          python "$BASE/oos_2025/source_gate_v01.py"
          python - <<'PY'
          import json
          p='Dream-Account-OS-v2.3-PARTIAL/research/bnb_launchpool_demand_001/oos_2025/source_gate_v01/BNB_LAUNCHPOOL_DEMAND_001_OOS_2025_SOURCE_GATE_V0.1.json'
          d=json.load(open(p))
          assert d['classification']=='SOURCE_DATA_PASS', d['classification']
          assert d['clean_events']==8
          assert d['market_prices_opened'] is False and d['returns_computed'] is False and d['pnl_computed'] is False
          assert d['access_2026_market'] is False
          print(d['canonical_event_manifest_sha256'])
          PY
      - name: Upload immutable source evidence
        uses: actions/upload-artifact@v4
        with:
          name: bnb-launchpool-demand-001-oos-2025-source-${{ github.run_id }}-${{ github.run_attempt }}
          path: Dream-Account-OS-v2.3-PARTIAL/research/bnb_launchpool_demand_001/oos_2025/source_gate_v01/
          retention-days: 90
          if-no-files-found: error
      - name: Persist source gate receipt
        shell: bash
        run: |
          set -euo pipefail
          BASE='Dream-Account-OS-v2.3-PARTIAL/research/bnb_launchpool_demand_001'
          git config user.name 'crypto-lab-bnb-launchpool-bot'
          git config user.email 'crypto-lab-bnb-launchpool-bot@users.noreply.github.com'
          git add "$BASE/oos_2025/source_gate_v01/BNB_LAUNCHPOOL_DEMAND_001_OOS_2025_SOURCE_GATE_V0.1.json"
          git commit -m 'BNB-LAUNCHPOOL-DEMAND-001: 2025 OOS SOURCE_DATA_PASS [skip ci]'
          git pull --rebase origin bnb-launchpool-demand-v2-oos-2025-v01
          git push origin HEAD:bnb-launchpool-demand-v2-oos-2025-v01
