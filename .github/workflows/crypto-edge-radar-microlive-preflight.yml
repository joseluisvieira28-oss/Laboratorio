name: Crypto Edge Radar Micro-Live Preflight

on:
  workflow_dispatch:
  push:
    paths:
      - 'crypto_edge_radar/radar/execution.py'
      - 'crypto_edge_radar/radar/binance_trading.py'
      - 'crypto_edge_radar/radar/mexc_trading.py'
      - 'crypto_edge_radar/radar/microlive_service.py'
      - 'crypto_edge_radar/radar/credential_preflight.py'
      - 'crypto_edge_radar/radar/__main__.py'
      - 'crypto_edge_radar/tests/test_microlive_execution.py'
      - '.github/workflows/crypto-edge-radar-microlive-preflight.yml'

permissions:
  contents: read

jobs:
  offline-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile executor
        run: |
          python -m py_compile crypto_edge_radar/radar/execution.py
          python -m py_compile crypto_edge_radar/radar/binance_trading.py
          python -m py_compile crypto_edge_radar/radar/mexc_trading.py
          python -m py_compile crypto_edge_radar/radar/microlive_service.py
          python -m py_compile crypto_edge_radar/radar/credential_preflight.py
          python -m py_compile crypto_edge_radar/radar/__main__.py
      - name: Run micro-live safety tests
        working-directory: crypto_edge_radar
        env:
          MICROLIVE_EXECUTION_ENABLED: "0"
          BINANCE_API_KEY: ""
          BINANCE_API_SECRET: ""
          MEXC_API_KEY: ""
          MEXC_API_SECRET: ""
        run: |
          python -m unittest tests.test_microlive_execution -v
      - name: Assert no obvious embedded credentials
        run: |
          if grep -RIE 'BEGIN PRIVATE KEY|BINANCE_API_SECRET[[:space:]]*=[[:space:]]*["'"'][^"'"']+|MEXC_API_SECRET[[:space:]]*=[[:space:]]*["'"'][^"'"']+' crypto_edge_radar/radar; then
            echo "Potential embedded credential detected"
            exit 1
          fi
          echo OFFLINE_MICROLIVE_PREFLIGHT_PASS
