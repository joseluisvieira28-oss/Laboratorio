name: DLS Drift Historical S3 HEAD Calibration V0.2A

on:
  push:
    branches:
      - dls-drift-historical-s3-head-probe-v0.2a
    paths:
      - '.github/workflows/dls-drift-historical-s3-head-v01.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dls-drift-historical-s3-head-probe-v0.1
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile
        run: python -m py_compile labs/DEFI_LIQUIDATION_SHOCK_001/source/probe_drift_historical_s3_head_v0_2.py
      - name: Execute HEAD-only calibration
        run: python labs/DEFI_LIQUIDATION_SHOCK_001/source/probe_drift_historical_s3_head_v0_1.py
      - name: Persist receipt
        if: always()
        run: |
          if [ -f labs/DEFI_LIQUIDATION_SHOCK_001/DRIFT_HISTORICAL_S3_HEAD_CALIBRATION_RECEIPT_V0.2.json ]; then
            git config user.name "crypto-lab-source-audit"
            git config user.email "actions@users.noreply.github.com"
            git add labs/DEFI_LIQUIDATION_SHOCK_001/DRIFT_HISTORICAL_S3_HEAD_CALIBRATION_RECEIPT_V0.1.json
            git commit -m "dls: persist corrected Drift historical S3 HEAD calibration receipt v0.2" || true
            git push origin HEAD:dls-drift-historical-s3-head-probe-v0.1
          fi
      - name: Firewall
        if: always()
        run: |
          echo HEAD_ONLY_TRUE
          echo GET_FALSE
          echo OBJECT_BODIES_FALSE
          echo EVENT_ROWS_FALSE
          echo PRICES_FALSE
          echo RETURNS_FALSE
          echo PNL_FALSE
          echo DIRECTION_FALSE
          echo LIVE_TRADING_FALSE
