name: STETH Redemption Basis 001 — Source Gate V0.1

on:
  push:
    branches:
      - empty-territory-hunt-v0.1
    paths:
      - research/steth_redemption_basis/**
      - .github/workflows/steth-redemption-basis-source-gate-v01.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # Transport-only remediation after the first outcome-blind technical failure.
      # No economic/source definitions are changed by this provider expansion.
      ETH_SOURCE_GATE_RPCS: >-
        https://ethereum-rpc.publicnode.com,
        https://eth.llamarpc.com,
        https://rpc.flashbots.net,
        https://eth.drpc.org,
        https://1rpc.io/eth,
        https://rpc.mevblocker.io,
        https://eth-mainnet.public.blastapi.io
    steps:
      - name: Checkout frozen research branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install source-probe dependencies
        run: pip install --disable-pip-version-check requests 'eth-hash[pycryptodome]'

      - name: Execute source-only outcome-blind probe
        run: python research/steth_redemption_basis/source_gate.py

      - name: Upload source-gate receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: STETH_REDEMPTION_BASIS_001_SOURCE_GATE_V0_1
          path: source_gate_output/STETH_REDEMPTION_BASIS_001_SOURCE_GATE_RECEIPT_V0_1.json
          if-no-files-found: warn
          retention-days: 30
