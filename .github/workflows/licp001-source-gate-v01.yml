name: licp001-source-gate-v01

on:
  push:
    branches:
      - liquidation-cascade-propagation-v0.1
    paths:
      - 'research/liquidation_cascade/licp001_source_probe_v01.py'
      - 'research/liquidation_cascade/LICP_001_PRE_OUTCOME_FREEZE_V0_1.md'
      - '.github/workflows/licp001-source-gate-v01.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'websockets>=13,<16'
      - name: Probe liquidation and target BBO sources
        run: python research/liquidation_cascade/licp001_source_probe_v01.py
      - name: Print source receipt
        if: always()
        run: cat research/liquidation_cascade/receipts/licp001_source_gate_v01.json || true
