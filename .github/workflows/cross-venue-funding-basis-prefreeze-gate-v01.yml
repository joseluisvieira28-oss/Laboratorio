name: Cross-Venue Funding Basis Final Pre-Freeze Gate V0.1

on:
  push:
    branches:
      - dream-account-phase-b-signal-research-v0.1
    paths:
      - 'Dream-Account-OS-v2.3-PARTIAL/research/CROSS_VENUE_FUNDING_BASIS_LAB_COST_CAPITAL_EXECUTION_FREEZE_V01.json'
      - 'Dream-Account-OS-v2.3-PARTIAL/research/cross_venue_funding_basis_prefreeze_gate_v01.py'
      - 'Dream-Account-OS-v2.3-PARTIAL/tests/test_cross_venue_funding_basis_prefreeze_gate_v01.py'
      - '.github/workflows/cross-venue-funding-basis-prefreeze-gate-v01.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  outcome-blind-prefreeze-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pytest
        run: python -m pip install pytest
      - name: Run final pre-freeze gate tests
        run: |
          cd Dream-Account-OS-v2.3-PARTIAL
          python -m pytest -q tests/test_cross_venue_funding_basis_prefreeze_gate_v01.py
      - name: Compile gate engine
        run: |
          cd Dream-Account-OS-v2.3-PARTIAL
          python -m py_compile research/cross_venue_funding_basis_prefreeze_gate_v01.py tests/test_cross_venue_funding_basis_prefreeze_gate_v01.py
      - name: Assert current expected fail-closed state
        run: |
          cd Dream-Account-OS-v2.3-PARTIAL
          python - <<'PY'
          import importlib.util
          import json
          from pathlib import Path

          root = Path('research')
          p = root / 'cross_venue_funding_basis_prefreeze_gate_v01.py'
          spec = importlib.util.spec_from_file_location('gate', p)
          gate = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(gate)
          result = gate.evaluate(root, None)
          assert result['status'] == 'DISCOVERY_BLOCKED_PREFREEZE_INCOMPLETE'
          assert result['discovery_authorized'] is False
          assert result['edge_status'] == 'UNPROVEN'
          assert result['historical_executable_return_claim_authorized'] is False
          assert result['economic_outcomes_inspected_by_gate_engine'] is False
          assert set(result['blockers']) == {
              'G03_FUNDING_REGIMES',
              'G04_RAW_PROVENANCE',
              'G10_REPLICATION_PARTITION_MATERIALIZED',
          }
          Path('CROSS_VENUE_FUNDING_BASIS_PREFREEZE_GATE_V01_RECEIPT.json').write_text(
              json.dumps(result, indent=2, sort_keys=True) + '\n', encoding='utf-8'
          )
          print(json.dumps({
              'status': result['status'],
              'edge_status': result['edge_status'],
              'blockers': result['blockers'],
              'discovery_authorized': result['discovery_authorized'],
          }, sort_keys=True))
          PY
      - name: Upload gate receipt
        uses: actions/upload-artifact@v4
        with:
          name: cross-venue-funding-basis-prefreeze-gate-v01-receipt
          path: Dream-Account-OS-v2.3-PARTIAL/CROSS_VENUE_FUNDING_BASIS_PREFREEZE_GATE_V01_RECEIPT.json
          if-no-files-found: error
          retention-days: 30
