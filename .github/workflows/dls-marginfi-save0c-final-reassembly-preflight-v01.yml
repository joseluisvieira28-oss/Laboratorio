name: DLS Marginfi Save0c Final Reassembly Preflight V0.1

on:
  push:
    branches:
      - dls-marginfi-save0c-sqd-boundary-v01
    paths:
      - .github/workflows/dls-marginfi-save0c-final-reassembly-preflight-v01.yml

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile hardened final authority tooling
        run: |
          python -m py_compile labs/DEFI_LIQUIDATION_SHOCK_001/source/aggregate_marginfi_save0c_sqd_census_v0_2.py
          python -m py_compile labs/DEFI_LIQUIDATION_SHOCK_001/source/reconcile_marginfi_save0c_sqd_raw_sample_v0_1.py
          python -m py_compile labs/DEFI_LIQUIDATION_SHOCK_001/source/finalize_marginfi_save0c_sqd_census_v0_1.py
      - name: Verify final workflow exists
        run: test -f .github/workflows/dls-marginfi-save0c-final-reassembly-v01.yml
      - name: Firewall
        run: echo SOURCE_ONLY_TRUE
