name: MEXC Event Futures Index Equivalence V0.6.4.1

on:
  push:
    branches:
      - mexc-event-futures-index-equivalence-v0.6.4.1-2026-10-02
    paths:
      - 'research/mexc_event_futures/**'
      - '.github/workflows/mexc-event-futures-multihorizon-v062.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  equivalence:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright requests
          python -m playwright install --with-deps chromium
      - name: Run current-display index equivalence probe
        run: python research/mexc_event_futures/index_equivalence_v064.py
      - name: Verify source gate
        shell: bash
        run: |
          python - <<'PY'
          import json
          p='artifacts/mexc_event_futures/index_equivalence_v064.json'
          j=json.load(open(p,encoding='utf-8'))
          print('SOURCE_GATE='+j['source_gate'])
          print('VALID_PAIRS='+str(j['valid_pairs']))
          print('WITHIN_1BP='+str(j['within_1bp_fraction']))
          print('MEDIAN_BPS='+str(j['median_difference_bps']))
          assert j['settlement_equivalence']=='NOT_PROVEN'
          PY
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mexc-event-futures-index-equivalence-v064
          path: artifacts/mexc_event_futures/index_equivalence_v064.json
          if-no-files-found: error
