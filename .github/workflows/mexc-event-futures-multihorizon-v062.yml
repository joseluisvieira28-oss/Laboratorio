name: MEXC Event Futures Multi Horizon Source V0.6.2

on:
  push:
    branches:
      - mexc-event-futures-multihorizon-source-v0.6.2-2026-10-02
    paths:
      - 'research/mexc_event_futures/**'
      - '.github/workflows/mexc-event-futures-multihorizon-v062.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Probe all assets and horizons read-only
        run: python research/mexc_event_futures/multihorizon_dom_probe_v062.py
      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: mexc-event-futures-multihorizon-v062-evidence
          path: artifacts/mexc_event_futures/multihorizon_dom_probe_v062.json
          if-no-files-found: error
