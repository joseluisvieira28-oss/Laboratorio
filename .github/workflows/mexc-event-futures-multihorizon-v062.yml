name: MEXC Event Futures Current Product Matrix V0.6.3.4

on:
  push:
    branches:
      - mexc-event-futures-product-matrix-v0.6.3.4-2026-10-02
    paths:
      - 'research/mexc_event_futures/**'
      - '.github/workflows/mexc-event-futures-multihorizon-v062.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright requests
          python -m playwright install --with-deps chromium
      - name: Collect current product matrix
        run: python research/mexc_event_futures/current_product_matrix_v0634.py
      - name: Verify source gate
        shell: bash
        run: |
          python - <<'PY'
          import json
          p='artifacts/mexc_event_futures/current_product_matrix_v0634.json'
          j=json.load(open(p,encoding='utf-8'))
          print('SOURCE_GATE='+j['source_gate'])
          print('PASS_COUNT='+str(j['pass_count']))
          print('HORIZON_MATRIX='+json.dumps(j['current_horizon_matrix'],sort_keys=True))
          if j['source_gate']!='PASS_CURRENT_PRODUCT_MATRIX':
              raise SystemExit('current product matrix source gate did not fully pass')
          PY
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mexc-event-futures-current-product-matrix-v0634
          path: |
            artifacts/mexc_event_futures/current_product_matrix_v0634.json
            artifacts/mexc_event_futures/current_product_matrix_v0634.jsonl
          if-no-files-found: error
