name: DLS Cancel Superseded A3A Transport V0.1

on:
  push:
    branches: [dls-field-enrichment-v01]
    paths:
      - labs/DEFI_LIQUIDATION_SHOCK_001/CANCEL_SUPERSEDED_A3A_RUN_36984543345.marker

permissions:
  actions: write
  contents: read

jobs:
  cancel:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel superseded source-transport run only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body --request POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/actions/runs/36984543345/cancel"
          echo "CANCEL_REQUESTED_FOR_SUPERSEDED_A3A_TRANSPORT_ONLY"
      - name: Scientific firewall
        run: |
          echo NO_SOURCE_ADJUDICATION_CHANGED
          echo NO_MARKET_OUTCOMES_OPENED
          echo NO_TRADING_NO_ORDERS_NO_WALLETS_NO_EXCHANGE_MUTATION
