name: Radar Database Target Mode Telemetry V0.1 QA

on:
  pull_request:
    branches:
      - crypto-edge-radar-postgres-v0.5
    paths:
      - "crypto_edge_radar/radar/forward_web.py"
      - "crypto_edge_radar/tests/test_forward_web_quiesce.py"
      - "crypto_edge_radar/tests/test_config_preprovisioned.py"
      - "crypto_edge_radar/authorities/RADAR_DATABASE_TARGET_MODE_TELEMETRY_V0.1_2026-09-27.md"
      - ".github/workflows/radar-database-target-mode-telemetry-v01-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          cd crypto_edge_radar
          python -m pip install -e .

      - name: Compile
        run: |
          cd crypto_edge_radar
          python -m compileall radar tests

      - name: Target mode telemetry tests
        run: |
          cd crypto_edge_radar
          python -m unittest -v             tests.test_config_preprovisioned             tests.test_forward_web_quiesce

      - name: Full deterministic Radar suite
        run: |
          cd crypto_edge_radar
          python -m unittest discover -s tests -v

      - name: Non-secret telemetry guard
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path("crypto_edge_radar/radar/forward_web.py").read_text()
          assert p.count('"database_target_mode"') >= 4
          assert 'self.settings.database_target_mode' in p
          assert 'runtime.settings.database_target_mode' in p
          authority=Path("crypto_edge_radar/authorities/RADAR_DATABASE_TARGET_MODE_TELEMETRY_V0.1_2026-09-27.md").read_text()
          for forbidden in (
              '"RADAR_SUPABASE_POOLER_PASSWORD":',
              '"RADAR_DATABASE_URL":',
              '"database_url":',
          ):
              assert forbidden not in p, forbidden
          assert "SUPABASE_POOLER" in authority
          assert "SOURCE" in authority
          print("RADAR_DATABASE_TARGET_MODE_TELEMETRY_V01_GUARD_PASS")
          PY
