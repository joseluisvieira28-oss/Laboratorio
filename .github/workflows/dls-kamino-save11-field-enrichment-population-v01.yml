name: DLS Kamino Save11 Field Enrichment Population V0.1

on:
  push:
    branches:
      - dls-field-enrichment-v01
    paths:
      - .github/workflows/dls-kamino-save11-field-enrichment-population-v01.yml

permissions:
  actions: read
  contents: read

jobs:
  enrich:
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - protocol: kamino
            start: '2023-11-17T14:48:24Z'
            end: '2023-12-01T00:00:00Z'
            id: kamino-202311
            baseline_pattern: 'dls-census-v043-k202311'
          - protocol: kamino
            start: '2023-12-01T00:00:00Z'
            end: '2024-01-01T00:00:00Z'
            id: kamino-202312
            baseline_pattern: 'dls-census-v043-k202312'
          - protocol: kamino
            start: '2024-01-01T00:00:00Z'
            end: '2024-02-01T00:00:00Z'
            id: kamino-202401
            baseline_pattern: 'dls-census-v043-k202401'
          - protocol: kamino
            start: '2024-02-01T00:00:00Z'
            end: '2024-03-01T00:00:00Z'
            id: kamino-202402
            baseline_pattern: 'dls-census-v043-k202402'
          - protocol: kamino
            start: '2024-03-01T00:00:00Z'
            end: '2024-04-01T00:00:00Z'
            id: kamino-202403
            baseline_pattern: 'dls-census-v043-k202403'
          - protocol: kamino
            start: '2024-04-01T00:00:00Z'
            end: '2024-05-01T00:00:00Z'
            id: kamino-202404
            baseline_pattern: 'dls-census-v043-k202404'
          - protocol: kamino
            start: '2024-05-01T00:00:00Z'
            end: '2024-06-01T00:00:00Z'
            id: kamino-202405
            baseline_pattern: 'dls-census-v043-k202405'
          - protocol: kamino
            start: '2024-06-01T00:00:00Z'
            end: '2024-07-01T00:00:00Z'
            id: kamino-202406
            baseline_pattern: 'dls-census-v043-k202406'
          - protocol: kamino
            start: '2024-07-01T00:00:00Z'
            end: '2024-08-01T00:00:00Z'
            id: kamino-202407
            baseline_pattern: 'dls-census-v043-k202407'
          - protocol: kamino
            start: '2024-08-01T00:00:00Z'
            end: '2024-09-01T00:00:00Z'
            id: kamino-202408
            baseline_pattern: 'dls-census-v043-k202408'
          - protocol: kamino
            start: '2024-09-01T00:00:00Z'
            end: '2024-10-01T00:00:00Z'
            id: kamino-202409
            baseline_pattern: 'dls-census-v043-k202409'
          - protocol: kamino
            start: '2024-10-01T00:00:00Z'
            end: '2024-11-01T00:00:00Z'
            id: kamino-202410
            baseline_pattern: 'dls-census-v043-k202410'
          - protocol: kamino
            start: '2024-11-01T00:00:00Z'
            end: '2024-12-01T00:00:00Z'
            id: kamino-202411
            baseline_pattern: 'dls-census-v043-k202411'
          - protocol: kamino
            start: '2024-12-01T00:00:00Z'
            end: '2025-01-01T00:00:00Z'
            id: kamino-202412
            baseline_pattern: 'dls-census-v043-k202412'
          - protocol: save11
            start: '2024-07-19T19:30:52Z'
            end: '2024-08-01T00:00:00Z'
            id: save11-202407
            baseline_pattern: 'dls-census-v043-s202407'
          - protocol: save11
            start: '2024-08-01T00:00:00Z'
            end: '2024-09-01T00:00:00Z'
            id: save11-202408
            baseline_pattern: 'dls-census-v043-s202408'
          - protocol: save11
            start: '2024-09-01T00:00:00Z'
            end: '2024-10-01T00:00:00Z'
            id: save11-202409
            baseline_pattern: 'dls-census-v043-s202409'
          - protocol: save11
            start: '2024-10-01T00:00:00Z'
            end: '2024-11-01T00:00:00Z'
            id: save11-202410
            baseline_pattern: 'dls-census-v043-s202410'
          - protocol: save11
            start: '2024-11-01T00:00:00Z'
            end: '2024-12-01T00:00:00Z'
            id: save11-202411
            baseline_pattern: 'dls-census-v043-s202411'
          - protocol: save11
            start: '2024-12-01T00:00:00Z'
            end: '2025-01-01T00:00:00Z'
            id: save11-202412
            baseline_pattern: 'dls-census-v043-s202412'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download canonical monthly baseline
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 35958824070
          pattern: ${{ matrix.baseline_pattern }}
          path: baseline
          merge-multiple: true

      - name: Compile source-only enrichment runner
        run: python -m py_compile labs/DEFI_LIQUIDATION_SHOCK_001/source/run_kamino_save11_field_enrichment_partition_v0_1.py

      - name: Re-query and exact-join canonical population
        run: >
          python labs/DEFI_LIQUIDATION_SHOCK_001/source/run_kamino_save11_field_enrichment_partition_v0_1.py
          --protocol "${{ matrix.protocol }}"
          --start "${{ matrix.start }}"
          --end "${{ matrix.end }}"
          --baseline baseline
          --partition-id "${{ matrix.id }}"
          --out "enrichment/${{ matrix.id }}.json"

      - name: Upload enrichment partition receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dls-field-enrichment-ks-${{ matrix.id }}
          path: enrichment/${{ matrix.id }}.json
          if-no-files-found: warn
          retention-days: 30

      - name: Firewall
        if: always()
        run: echo SOURCE_ONLY_TRUE

  aggregate:
    needs: enrich
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download all partition receipts
        uses: actions/download-artifact@v4
        with:
          pattern: dls-field-enrichment-ks-*
          path: population_receipts
          merge-multiple: true

      - name: Compile aggregator
        run: python -m py_compile labs/DEFI_LIQUIDATION_SHOCK_001/source/aggregate_kamino_save11_field_enrichment_v0_1.py

      - name: Aggregate population field coverage
        run: python labs/DEFI_LIQUIDATION_SHOCK_001/source/aggregate_kamino_save11_field_enrichment_v0_1.py population_receipts

      - name: Upload population authority receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dls-kamino-save11-field-enrichment-population-v01
          path: labs/DEFI_LIQUIDATION_SHOCK_001/KAMINO_SAVE11_FIELD_ENRICHMENT_POPULATION_RECEIPT_V0.1.json
          if-no-files-found: warn
          retention-days: 30

      - name: Firewall
        if: always()
        run: echo SOURCE_ONLY_TRUE
