name: Gate K execution-layer tests

on:
  push:
    branches:
      - dream-account-gate-k-execution-layer-v0.1
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Dream-Account-OS-v2.3-PARTIAL
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q src tests
      - name: Prove Gate K has no HTTP order verbs
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/dream_account/execution_layer.py')
          text = p.read_text(encoding='utf-8').lower()
          forbidden = ['requests.post(', 'requests.delete(', 'urllib.request.request(', 'httpx.post(', 'aiohttp.post(']
          hits = [x for x in forbidden if x in text]
          if hits:
              raise SystemExit(f'forbidden live network primitives found: {hits}')
          print('PASS: Gate K execution layer contains no direct live-order HTTP primitive')
          PY
