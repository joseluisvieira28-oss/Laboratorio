name: Gate K execution-layer tests

on:
  push:
    branches:
      - dream-account-gate-k-execution-layer-v0.1
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Dream-Account-OS-v2.3-PARTIAL
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q src tests
      - name: Prove Gate K execution modules have no live-order HTTP primitives
        run: |
          python - <<'PY'
          from pathlib import Path
          files = sorted(Path('src/dream_account').glob('execution*.py'))
          forbidden = [
              'requests.post(', 'requests.put(', 'requests.patch(', 'requests.delete(',
              'urllib.request.request(', 'httpx.post(', 'httpx.put(', 'httpx.delete(',
              'aiohttp.post(', 'aiohttp.put(', 'aiohttp.delete(',
          ]
          hits = []
          for path in files:
              text = path.read_text(encoding='utf-8').lower()
              for token in forbidden:
                  if token in text:
                      hits.append(f'{path}:{token}')
          if hits:
              raise SystemExit(f'forbidden live network primitives found: {hits}')
          print(f'PASS: scanned {len(files)} Gate K execution modules; no direct live-order HTTP primitive')
          PY
