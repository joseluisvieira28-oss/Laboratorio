name: CIRV Forward Sourcecheck V0.2
on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/cirv-forward-sourcecheck-v02.yml"
      - "labs/CRYPTO_INTRAWEEK_RV_001/forward_watcher_v02.py"
      - "labs/CRYPTO_INTRAWEEK_RV_001/FORWARD_OPERATIONS_AMENDMENT_V0.3.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sourcecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: crypto-intraweek-rv-forward-v0.1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check -q pandas numpy
      - name: Compile remediated watcher
        run: python -m py_compile labs/CRYPTO_INTRAWEEK_RV_001/forward_watcher_v02.py
      - name: Source-only completed-day check
        run: python labs/CRYPTO_INTRAWEEK_RV_001/forward_watcher_v02.py sourcecheck:2026-09-21
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: CIRV_FORWARD_SOURCECHECK_V02
          path: cirv_forward_sourcecheck_v02.json
          if-no-files-found: warn
          retention-days: 30
