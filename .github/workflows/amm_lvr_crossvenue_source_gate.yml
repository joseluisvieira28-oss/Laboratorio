name: AMM-LVR-CROSSVENUE-001 Source Gate

on:
  pull_request:
    paths:
      - 'labs/amm-lvr-crossvenue-001/**'
      - '.github/workflows/amm_lvr_crossvenue_source_gate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run one-day sample source gate
        run: python labs/amm-lvr-crossvenue-001/source_gate.py
      - name: Attack historical-free vs forward-free source routes
        run: python labs/amm-lvr-crossvenue-001/source_attack_v0_2.py
      - name: Probe archival Ethereum replay on frozen public sample
        run: python labs/amm-lvr-crossvenue-001/historical_onchain_replay_probe_v0_1.py
      - name: Probe no-key archive RPC matrix
        run: python labs/amm-lvr-crossvenue-001/archive_rpc_matrix_v0_1.py
      - name: Probe frozen Uniswap executable quote routes
        run: python labs/amm-lvr-crossvenue-001/uniswap_quoter_source_probe_v0_1.py
      - name: Run 120-second frozen-registry forward collector
        run: python labs/amm-lvr-crossvenue-001/forward_observability_v0_2.py
      - name: Smoke-test 120-second forward shadow evidence collector
        run: python labs/amm-lvr-crossvenue-001/forward_shadow_collector_v0_1.py --seconds 120 --poll 2
      - uses: actions/upload-artifact@v4
        with:
          name: AMM-LVR-CROSSVENUE-001-SOURCE-EVIDENCE
          path: |
            labs/amm-lvr-crossvenue-001/evidence/
            labs/amm-lvr-crossvenue-001/forward_data/
