name: News Shock Lab V0.3A Consensus Combined V0.5

# Tranche 05: provenance-only expansion to 17/44 COMPLETE_A; no market outcomes authorized
on:
  push:
    branches:
      - dream-account-phase-b-signal-research-v0.1
    paths:
      - 'Dream-Account-OS-v2.3-PARTIAL/research/NEWS_SHOCK_LAB_V03A_CONSENSUS_SEED_TRANCHE05_FREEZE_V0.1.json'
      - 'Dream-Account-OS-v2.3-PARTIAL/research/NEWS_SHOCK_LAB_V03A_CONSENSUS_SEED_TRANCHE05_V0.1.json'
      - 'Dream-Account-OS-v2.3-PARTIAL/research/news_shock_lab_v03a_consensus_combined_v05.py'
      - '.github/workflows/news-shock-lab-v03a-consensus-combined-v05.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  news-shock-v03a-consensus-combined-v05:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install parser dependency and compile
        run: |
          cd Dream-Account-OS-v2.3-PARTIAL
          python -m pip install beautifulsoup4
          python -m compileall -q research
      - name: Verify frozen authority chain
        run: |
          cd Dream-Account-OS-v2.3-PARTIAL
          python - <<'PY'
          from research.news_shock_lab_v03a_consensus_combined_v05 import load_authority
          *_, freeze5, seed5 = load_authority()
          assert freeze5['fingerprint'] == 'b7a897c9e09df2302b1393d5bc9aa6ca45b8f910ccfc67f4f3b20e8ce2379a9b'
          assert seed5['fingerprint'] == '9ebc9d226792e7ee438b16edd133f3847f552d459dbc6bdbde0acdbb538d71e3'
          assert freeze5['parent_combined_manifest_fingerprint'] == '2b4090e9219a3ffd8a73304dd5b07ca8da640d8ed801ddb47649ad16d5186a58'
          assert freeze5['parent_validation_fingerprint'] == 'c9e3d6ae18323985a4e40f99a65c95b3cb7b562c7aad290320d0d0d428833495'
          print('NEWS V03A COMBINED V05 AUTHORITY PASS')
          PY
      - name: Rebuild BLS actuals and validate seventeen consensus events
        run: |
          cd Dream-Account-OS-v2.3-PARTIAL
          mkdir -p research/local_data/news_v03a_consensus_combined_v05_output
          set -o pipefail
          python -m research.news_shock_lab_v03a_consensus_combined_v05 \
            research/local_data/news_v03a_consensus_combined_v05_output \
            | tee research/local_data/news_v03a_consensus_combined_v05_output/combined_v05_stdout.txt
      - name: Assert 17 COMPLETE_A and all outcome guards closed
        run: |
          cd Dream-Account-OS-v2.3-PARTIAL
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('research/local_data/news_v03a_consensus_combined_v05_output')
          s = json.loads((root/'combined_v05_summary.json').read_text())
          expected_counts = {'COMPLETE_A': 17, 'CONSENSUS_PROVENANCE_INCOMPLETE': 27}
          if s['status_counts'] != expected_counts:
              raise SystemExit(f"NEWS V03A V05 STATUS COUNT DRIFT: {s['status_counts']}")
          if s.get('complete_b_count', 0) != 0:
              raise SystemExit('NEWS V03A V05 UNEXPECTED COMPLETE_B')
          if len(s['complete_a_event_ids']) != 17:
              raise SystemExit('NEWS V03A V05 COMPLETE_A COUNT DRIFT')
          for event_id in ('US_CPI_2023-06-13', 'US_CPI_2024-04-10'):
              if event_id not in s['complete_a_event_ids']:
                  raise SystemExit(f'NEWS V03A V05 NEW EVENT MISSING: {event_id}')
          for key, value in s['guards'].items():
              if value is not False:
                  raise SystemExit(f'NEWS V03A V05 OUTCOME GUARD DRIFT: {key}')
          print('NEWS V03A COMBINED V05 VALIDATION PASS', s['validation_fingerprint'])
          PY
      - name: Upload combined V0.5 provenance receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: news-shock-v03a-consensus-combined-v05-${{ github.sha }}
          path: |
            Dream-Account-OS-v2.3-PARTIAL/research/local_data/news_v03a_consensus_combined_v05_output/combined_v05_consensus_manifest.json
            Dream-Account-OS-v2.3-PARTIAL/research/local_data/news_v03a_consensus_combined_v05_output/combined_v05_validation_receipt.json
            Dream-Account-OS-v2.3-PARTIAL/research/local_data/news_v03a_consensus_combined_v05_output/combined_v05_summary.json
            Dream-Account-OS-v2.3-PARTIAL/research/local_data/news_v03a_consensus_combined_v05_output/combined_v05_stdout.txt
          if-no-files-found: warn
          retention-days: 30
