name: MEXC Overnight Gap Source V1.3
on:
  push:
    branches: [mexc-overnight-gap-catchup-v1.3-source-gate-2026-10-05]
permissions: {contents: read}
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install requests
      - run: |
          test -f research/mexc_global_assets/MEXC_OVERNIGHT_GAP_SOURCE_FREEZE_V1.3.md
          python research/mexc_global_assets/mexc_overnight_gap_source_v13.py
      - uses: actions/upload-artifact@v4
        with:
          name: overnight-gap-source-v13-${{ github.run_id }}
          path: artifacts/mexc_global_assets/overnight_gap_v13_source
