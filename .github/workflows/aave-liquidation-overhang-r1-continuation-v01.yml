name: AAVE Liquidation Overhang 001 — R1 Continuation V0.1

on:
  workflow_dispatch:
  push:
    branches:
      - aave-liquidation-overhang-v0.1
    paths:
      - '.github/workflows/aave-liquidation-overhang-r1-continuation-v01.yml'

permissions:
  contents: read
  actions: read

env:
  PINNED_AUDIT_RUN_ID: '35355395431'
  PINNED_R0_RUN_ID: '35218275356'

jobs:
  gate-exact-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 125
    steps:
      - name: Checkout frozen branch
        uses: actions/checkout@v4

      - name: Wait only for exact pinned audit run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, os, time, urllib.request
          run_id = os.environ["PINNED_AUDIT_RUN_ID"]
          url = f"https://api.github.com/repos/joseluisvieira28-oss/Laboratorio/actions/runs/{run_id}"
          headers = {
              "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
          }
          deadline = time.time() + 7200
          while True:
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req, timeout=30) as r:
                  obj = json.load(r)
              status = obj.get("status")
              conclusion = obj.get("conclusion")
              print(json.dumps({"run_id": run_id, "status": status, "conclusion": conclusion}, sort_keys=True), flush=True)
              if status == "completed":
                  if conclusion != "success":
                      raise SystemExit(f"FAIL_CLOSED: pinned audit run conclusion={conclusion}")
                  break
              if time.time() >= deadline:
                  raise SystemExit("FAIL_CLOSED: pinned audit run did not complete before orchestration deadline")
              time.sleep(30)
          PY

      - name: Download exact pinned R1 audit artifact
        uses: actions/download-artifact@v4
        with:
          name: AAVE_LIQUIDATION_OVERHANG_001_R1_SCALED_LEDGER_AUDIT_V0_1
          path: downloaded_r1_audit
          github-token: ${{ github.token }}
          repository: joseluisvieira28-oss/Laboratorio
          run-id: ${{ env.PINNED_AUDIT_RUN_ID }}

      - name: Verify exact audit receipt classification
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          files = list(Path("downloaded_r1_audit").rglob("*.json"))
          if len(files) != 1:
              raise SystemExit(f"FAIL_CLOSED: expected exactly one audit receipt, found {len(files)}")
          obj = json.loads(files[0].read_text(encoding="utf-8"))
          c = obj.get("classification")
          print(json.dumps({"classification": c, "receipt": str(files[0])}, sort_keys=True))
          if c != "R1_AUDIT_PASS":
              raise SystemExit(f"FAIL_CLOSED: audit classification={c}")
          safety = obj.get("safety") or {}
          forbidden = ["health_factor_computed","overhang_computed","future_liquidation_outcome_computed","market_returns_opened","returns_opened","pnl_opened","accessed_2025_or_2026","live_trading","exchange_mutation"]
          if any(bool(safety.get(k)) for k in forbidden):
              raise SystemExit("FAIL_CLOSED: audit safety receipt violated")
          PY

  reserve-replay-shards:
    needs: gate-exact-audit
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        shard_id: [0,1,2,3,4,5,6,7]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install source dependencies
        run: pip install --disable-pip-version-check requests 'eth-hash[pycryptodome]'

      - name: Download exact pinned R1 audit
        uses: actions/download-artifact@v4
        with:
          name: AAVE_LIQUIDATION_OVERHANG_001_R1_SCALED_LEDGER_AUDIT_V0_1
          path: downloaded_r1_audit
          github-token: ${{ github.token }}
          repository: joseluisvieira28-oss/Laboratorio
          run-id: ${{ env.PINNED_AUDIT_RUN_ID }}

      - name: Download canonical R0 bootstrap
        uses: actions/download-artifact@v4
        with:
          name: AAVE_RECON_R0_BOOTSTRAP
          path: downloaded_r0_bootstrap
          github-token: ${{ github.token }}
          repository: joseluisvieira28-oss/Laboratorio
          run-id: ${{ env.PINNED_R0_RUN_ID }}

      - name: Execute frozen reserve replay shard
        env:
          R1_SHARD_ID: ${{ matrix.shard_id }}
          R1_SHARD_COUNT: '8'
        run: python research/aave_liquidation_overhang/r1_reserve_shard_v02.py

      - name: Upload reserve replay shard receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AAVE_R1_RESERVE_SHARD_${{ matrix.shard_id }}
          path: r1_reserve_shards/r1_reserve_shard_v02_${{ matrix.shard_id }}.json
          if-no-files-found: warn
          retention-days: 30

  global-state-oracle:
    needs: gate-exact-audit
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install source dependencies
        run: pip install --disable-pip-version-check requests 'eth-hash[pycryptodome]'

      - name: Download exact pinned R1 audit
        uses: actions/download-artifact@v4
        with:
          name: AAVE_LIQUIDATION_OVERHANG_001_R1_SCALED_LEDGER_AUDIT_V0_1
          path: downloaded_r1_audit
          github-token: ${{ github.token }}
          repository: joseluisvieira28-oss/Laboratorio
          run-id: ${{ env.PINNED_AUDIT_RUN_ID }}

      - name: Download canonical R0 bootstrap
        uses: actions/download-artifact@v4
        with:
          name: AAVE_RECON_R0_BOOTSTRAP
          path: downloaded_r0_bootstrap
          github-token: ${{ github.token }}
          repository: joseluisvieira28-oss/Laboratorio
          run-id: ${{ env.PINNED_R0_RUN_ID }}

      - name: Execute frozen global state/oracle gate
        run: python research/aave_liquidation_overhang/r1_global_state_v01.py

      - name: Upload global state receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AAVE_R1_GLOBAL_STATE
          path: r1_global_state_output/AAVE_LIQUIDATION_OVERHANG_001_R1_GLOBAL_STATE_V0_1.json
          if-no-files-found: warn
          retention-days: 30

  canonical-adjudication:
    if: always() && needs.gate-exact-audit.result == 'success'
    needs:
      - gate-exact-audit
      - reserve-replay-shards
      - global-state-oracle
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Download exact pinned R1 audit
        uses: actions/download-artifact@v4
        with:
          name: AAVE_LIQUIDATION_OVERHANG_001_R1_SCALED_LEDGER_AUDIT_V0_1
          path: downloaded_r1_audit
          github-token: ${{ github.token }}
          repository: joseluisvieira28-oss/Laboratorio
          run-id: ${{ env.PINNED_AUDIT_RUN_ID }}

      - name: Download canonical R0 bootstrap
        uses: actions/download-artifact@v4
        with:
          name: AAVE_RECON_R0_BOOTSTRAP
          path: downloaded_r0_bootstrap
          github-token: ${{ github.token }}
          repository: joseluisvieira28-oss/Laboratorio
          run-id: ${{ env.PINNED_R0_RUN_ID }}

      - name: Download all reserve shard receipts from this run
        uses: actions/download-artifact@v4
        with:
          pattern: AAVE_R1_RESERVE_SHARD_*
          path: downloaded_r1_shards
          merge-multiple: true

      - name: Download global state receipt from this run
        uses: actions/download-artifact@v4
        with:
          name: AAVE_R1_GLOBAL_STATE
          path: downloaded_r1_global

      - name: Canonical R1 adjudication
        run: python research/aave_liquidation_overhang/aggregate_r1_reconstruction_v02.py

      - name: Upload canonical R1 receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AAVE_LIQUIDATION_OVERHANG_001_RECONSTRUCTION_R1_CANONICAL_V0_2
          path: r1_canonical_output/AAVE_LIQUIDATION_OVERHANG_001_RECONSTRUCTION_R1_CANONICAL_V0_2.json
          if-no-files-found: warn
          retention-days: 30
