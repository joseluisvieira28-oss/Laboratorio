name: DLS Marginfi Bank Metadata Dataslice Calibration V0.1

on:
  push:
    branches:
      - dls-field-enrichment-v01
    paths:
      - .github/workflows/dls-marginfi-bank-metadata-dataslice-calibration-v01.yml

permissions:
  contents: read

jobs:
  calibrate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile calibration
        run: python -m py_compile labs/DEFI_LIQUIDATION_SHOCK_001/source/calibrate_marginfi_bank_metadata_dataslice_v0_1.py
      - name: Calibrate historical Bank minimal metadata slice
        run: python labs/DEFI_LIQUIDATION_SHOCK_001/source/calibrate_marginfi_bank_metadata_dataslice_v0_1.py
      - name: Upload calibration receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dls-marginfi-bank-metadata-dataslice-calibration-v01
          path: labs/DEFI_LIQUIDATION_SHOCK_001/MARGINFI_BANK_METADATA_DATASLICE_CALIBRATION_RECEIPT_V0.1.json
          if-no-files-found: warn
          retention-days: 30
      - name: Firewall
        if: always()
        run: echo SOURCE_ONLY_TRUE
