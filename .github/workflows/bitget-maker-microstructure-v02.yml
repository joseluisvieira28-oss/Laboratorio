name: Bitget Maker Microstructure V0.2

on:
  push:
    branches:
      - bitget-maker-microstructure-v0.2-prereg-2026-10-05

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: matrix
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          d=json.load(open("research/cross_venue_stock/BITGET_MAKER_MICROSTRUCTURE_SOURCE_BINDING_V0.2.json"))
          m={"include":[{"symbol":s} for s in d["candidates"]]}
          assert len(m["include"])==4
          with open(os.environ["GITHUB_OUTPUT"],"a") as f:
              f.write("matrix="+json.dumps(m,separators=(",",":"))+"\n")
          print(json.dumps(m,indent=2))
          PY

  evaluate:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check requests openpyxl
      - name: Freeze check
        run: |
          test "$GITHUB_REF_NAME" = "bitget-maker-microstructure-v0.2-prereg-2026-10-05"
          test -f research/cross_venue_stock/BITGET_MAKER_MICROSTRUCTURE_SOURCE_BINDING_V0.2.json
          test -f research/cross_venue_stock/BITGET_MAKER_MICROSTRUCTURE_RULE_V0.2.json
          test -f research/cross_venue_stock/BITGET_MAKER_MICROSTRUCTURE_FREEZE_V0.2.md
          test -f research/cross_venue_stock/BITGET_MAKER_PARENT_SIGNAL_IDENTITY_V0.2.json
          python -m py_compile research/cross_venue_stock/bitget_maker_microstructure_asset_v02.py
          echo BITGET_MAKER_V02_PRE_OUTCOME_FREEZE_PASS
      - name: Evaluate frozen maker execution
        run: python research/cross_venue_stock/bitget_maker_microstructure_asset_v02.py --symbol "${{ matrix.symbol }}"
      - uses: actions/upload-artifact@v4
        with:
          name: bitget-maker-v02-${{ matrix.symbol }}
          path: artifacts/cross_venue_stock/bitget_maker_v02/assets/${{ matrix.symbol }}.json
          if-no-files-found: error
          retention-days: 90

  aggregate:
    needs: evaluate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: bitget-maker-v02-*
          path: artifacts/cross_venue_stock/bitget_maker_v02/assets
          merge-multiple: true
      - name: Aggregate frozen family
        run: python research/cross_venue_stock/bitget_maker_microstructure_aggregate_v02.py
      - uses: actions/upload-artifact@v4
        with:
          name: bitget-maker-microstructure-v02-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/cross_venue_stock/bitget_maker_v02
          if-no-files-found: error
          retention-days: 90
