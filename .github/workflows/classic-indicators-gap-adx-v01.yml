name: Classic Indicators Gap Lab V0.1 - ADX

on:
  push:
    branches:
      - classic-indicators-gap-lab-v0.1

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"

jobs:
  cigl-adx-01:
    if: contains(github.event.head_commit.message, '[CIGL ADX RUN]')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: Dream-Account-OS-v2.3-PARTIAL
    steps:
      - name: Checkout frozen research branch
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: Dream-Account-OS-v2.3-PARTIAL/pyproject.toml

      - name: Install isolated research dependencies
        run: python -m pip install --upgrade pip pandas numpy

      - name: Compile frozen ADX research code
        run: |
          python -m py_compile research/classic_indicators_gap_v01.py
          python -m py_compile research/classic_indicators_gap_vwap_data_vision_v01.py
          python -m py_compile research/classic_indicators_gap_adx_v01.py

      - name: Execute CIGL-ADX-01 with phase firewall
        run: |
          rm -rf research/local_data/cigl_adx_v01_output
          mkdir -p research/local_data/cigl_adx_v01_output
          python research/classic_indicators_gap_adx_v01.py \
            --freeze research/CIGL_ADX_01_IMPLEMENTATION_FREEZE.json \
            --out research/local_data/cigl_adx_v01_output \
            2>&1 | tee research/local_data/cigl_adx_v01_output/CIGL_ADX_01_STDOUT.txt

      - name: Upload immutable research outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CIGL-ADX-01-${{ github.sha }}
          path: Dream-Account-OS-v2.3-PARTIAL/research/local_data/cigl_adx_v01_output/
          if-no-files-found: warn
          retention-days: 30
