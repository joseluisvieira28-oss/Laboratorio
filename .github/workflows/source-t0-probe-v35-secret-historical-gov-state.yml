name: source-t0-probe-v35-secret-historical-gov-state

on:
  workflow_dispatch:
  push:
    branches:
      - cosmos-native-emission-param-shock-001-v0.2-t0-remediation-2026-10-07
    paths:
      - .github/workflows/source-t0-probe-v35-secret-historical-gov-state.yml

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cosmos-native-emission-param-shock-001-v0.2-t0-remediation-2026-10-07
      - name: Recover execution height from historical governance state
        shell: bash
        run: |
          python3 - <<'PY'
          import json,urllib.request,urllib.error,ssl,hashlib,os,datetime,re

          OUT="research/cosmos_native_emission_param_shock_001_v0_2/SCRT287_HISTORICAL_GOV_STATE_V35.json"
          UA="CryptoLab-source-only-secret-v35"
          endpoints=[
            ("mario-archive","https://lcd.archive.scrt.marionode.com"),
            ("ankr","https://rpc.ankr.com/http/scrt_cosmos"),
            ("secretsaturn","https://lcd.mainnet.secretsaturn.net"),
            ("lavenderfive","https://secretnetwork-api.lavenderfive.com:443"),
            ("1rpc","https://1rpc.io/scrt-lcd"),
            ("01node","https://rest-secret.01node.com"),
            ("stakewolle","https://public.stakewolle.com/cosmos/secretnetwork/rest"),
            ("highstakes","https://secretnetwork-api.highstakes.ch:1317"),
          ]
          modern="/cosmos/gov/v1beta1/proposals/287"
          legacy="/gov/proposals/287"

          def get(base,path,h,mode,to=15):
              headers={"User-Agent":UA,"Accept":"application/json"}
              url=base+path
              if mode=="query":
                  url += ("&" if "?" in url else "?")+"height="+str(h)
              elif mode=="header":
                  headers["x-cosmos-block-height"]=str(h)
              elif mode=="both":
                  url += ("&" if "?" in url else "?")+"height="+str(h)
                  headers["x-cosmos-block-height"]=str(h)
              try:
                  q=urllib.request.Request(url,headers=headers)
                  with urllib.request.urlopen(q,timeout=to,context=ssl._create_unverified_context()) as r:
                      b=r.read()
                      return {"ok":True,"status":getattr(r,"status",200),"url":r.geturl(),
                              "headers":dict(r.headers),
                              "sha256":hashlib.sha256(b).hexdigest(),
                              "body":b.decode("utf-8","replace")[:500000]}
              except urllib.error.HTTPError as e:
                  try:b=e.read()
                  except Exception:b=b""
                  return {"ok":False,"status":e.code,"url":url,"headers":dict(e.headers or {}),
                          "error":str(e),"sha256":hashlib.sha256(b).hexdigest() if b else None,
                          "body":b.decode("utf-8","replace")[:60000]}
              except Exception as e:
                  return {"ok":False,"status":None,"url":url,"headers":{},"error":repr(e),"body":""}

          def proposal_status(body):
              try:d=json.loads(body)
              except:return None
              def walk(x):
                  if isinstance(x,dict):
                      # Prefer a proposal object carrying proposal_id 287.
                      pid=x.get("proposal_id") or x.get("proposalId")
                      st=x.get("status")
                      if st is not None and (pid is None or str(pid)=="287"):
                          s=str(st)
                          if "PROPOSAL_STATUS_" in s or s in ("1","2","3","4","5"):
                              return s
                      for v in x.values():
                          z=walk(v)
                          if z:return z
                  elif isinstance(x,list):
                      for v in x:
                          z=walk(v)
                          if z:return z
                  return None
              return walk(d)

          grid=[11700000,11750000,11780000,11800000,11820000,11840000,11850000,11860000,11870000,11885000,11900000,11920000,12000000]
          rows=[]
          for name,base in endpoints:
              for path in [modern,legacy]:
                  for mode in ["header","query","both"]:
                      for h in grid:
                          r=get(base,path,h,mode,12)
                          rows.append({"provider":name,"base":base,"path":path,"mode":mode,"requested_height":h,
                            "ok":r["ok"],"http_status":r.get("status"),"proposal_status":proposal_status(r.get("body","")),
                            "response_block_height":r.get("headers",{}).get("x-cosmos-block-height") or r.get("headers",{}).get("X-Cosmos-Block-Height"),
                            "sha256":r.get("sha256"),"error":r.get("error"),"body_excerpt":r.get("body","")[:2500]})

          # Only a route that demonstrates height-sensitive state is eligible.
          groups={}
          for x in rows:
              k=(x["provider"],x["base"],x["path"],x["mode"])
              groups.setdefault(k,[]).append(x)

          candidates=[]
          for k,xs in groups.items():
              states=[(x["requested_height"],x["proposal_status"],x["ok"],x.get("response_block_height")) for x in xs if x["proposal_status"]]
              uniq=set(s for _,s,_,_ in states)
              if len(uniq)<2:
                  continue
              # Must show an earlier non-PASSED state and later PASSED.
              def passed(s): return s=="3" or "PASSED" in str(s)
              before=[h for h,s,_,_ in states if not passed(s)]
              after=[h for h,s,_,_ in states if passed(s)]
              if not before or not after or min(after)<=min(before):
                  continue
              candidates.append({"key":k,"states":states})

          exact=[]
          for c in candidates:
              provider,base,path,mode=c["key"]
              st=sorted(c["states"])
              # Find adjacent sampled heights with non-passed -> passed.
              br=None
              for a,b in zip(st,st[1:]):
                  if (not (a[1]=="3" or "PASSED" in str(a[1]))) and (b[1]=="3" or "PASSED" in str(b[1])):
                      br=(a,b);break
              if not br: continue
              L,R=br[0][0],br[1][0];err=None;trace=[]
              while L<R:
                  M=(L+R)//2
                  rr=get(base,path,M,mode,15); s=proposal_status(rr.get("body",""))
                  trace.append({"height":M,"status":s,"ok":rr["ok"],"http":rr.get("status"),
                                "response_block_height":rr.get("headers",{}).get("x-cosmos-block-height") or rr.get("headers",{}).get("X-Cosmos-Block-Height"),
                                "sha256":rr.get("sha256"),"error":rr.get("error"),"body_excerpt":rr.get("body","")[:3000]})
                  if s is None:
                      err=trace[-1];break
                  if s=="3" or "PASSED" in str(s): R=M
                  else:L=M+1
              rec={"provider":provider,"base":base,"path":path,"mode":mode,
                   "sample_bracket":{"lo":br[0],"hi":br[1]},"binary_trace":trace,"error":err}
              if err is None:
                  H=L; neigh=[]
                  for hh in [H-1,H,H+1]:
                      rr=get(base,path,hh,mode,18);s=proposal_status(rr.get("body",""))
                      neigh.append({"requested_height":hh,"proposal_status":s,"http":rr.get("status"),
                                    "response_block_height":rr.get("headers",{}).get("x-cosmos-block-height") or rr.get("headers",{}).get("X-Cosmos-Block-Height"),
                                    "sha256":rr.get("sha256"),"error":rr.get("error"),
                                    "body_excerpt":rr.get("body","")[:5000]})
                  def isp(s):return s=="3" or "PASSED" in str(s)
                  verified=bool(neigh[0]["proposal_status"] and not isp(neigh[0]["proposal_status"]) and
                                neigh[1]["proposal_status"] and isp(neigh[1]["proposal_status"]) and
                                neigh[2]["proposal_status"] and isp(neigh[2]["proposal_status"]))
                  rec["H_execution_block"]=H
                  rec["T0_first_new_param_mint_block"]=H+1
                  rec["neighbors"]=neigh
                  rec["state_transition_verified"]=verified
              exact.append(rec)

          out={"scope":"SOURCE_ONLY_NO_MARKET_DATA","candidate":"SCRT Proposal 287",
               "tested_utc":datetime.datetime.now(datetime.timezone.utc).isoformat(),
               "rule":"PASS only if a route demonstrably respects historical height and shows proposal state transition non-PASSED at H-1 -> PASSED at H, then T0=H+1 per pinned EndBlock/BeginBlock semantics.",
               "grid":grid,"rows":rows,"height_sensitive_candidates":candidates,
               "exact":exact,"pass_records":[x for x in exact if x.get("state_transition_verified")]}
          os.makedirs(os.path.dirname(OUT),exist_ok=True)
          with open(OUT,"w") as f:json.dump(out,f,indent=2)
          print("SCRT287_V35_RESULT",json.dumps({
            "height_sensitive_routes":len(candidates),
            "passes":[{"provider":x["provider"],"path":x["path"],"mode":x["mode"],"H":x.get("H_execution_block"),"T0":x.get("T0_first_new_param_mint_block")} for x in out["pass_records"]]
          }))
          PY
      - name: Persist V35 receipt
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/cosmos_native_emission_param_shock_001_v0_2/SCRT287_HISTORICAL_GOV_STATE_V35.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "SCRT287: persist historical governance-state probe v35"
          git push origin HEAD:cosmos-native-emission-param-shock-001-v0.2-t0-remediation-2026-10-07
