name: BPMTFD V0.1 Source Gate

on:
  push:
    branches:
      - binance-perp-margin-tier-forced-deleveraging-v0.1-source-2026-10-06
    paths:
      - 'research/binance_perp_margin_tier_forced_deleveraging/**'
      - '.github/workflows/bpmtfd_v01_source_gate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout frozen branch
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install source-only dependencies
        run: pip install requests beautifulsoup4
      - name: Diagnose Binance announcement list envelope
        run: |
          python - <<'PY'
          import requests, json
          eps=[
            'https://www.binance.com/bapi/apex/v1/public/apex/cms/article/list/query',
            'https://www.binance.com/bapi/composite/v1/public/cms/article/list/query',
          ]
          h={'User-Agent':'Mozilla/5.0 Chrome/140 CryptoLab','Accept-Language':'en-US,en;q=0.9','lang':'en','Referer':'https://www.binance.com/en/support/announcement'}
          def shape(x,depth=0):
              if depth>4:return type(x).__name__
              if isinstance(x,dict):
                  return {k:shape(v,depth+1) for k,v in list(x.items())[:20]}
              if isinstance(x,list):
                  return {'__list_len__':len(x),'__item_shape__':shape(x[0],depth+1) if x else None}
              return type(x).__name__
          for ep in eps:
              try:
                  r=requests.get(ep,params={'type':'1','pageNo':1,'pageSize':3},headers=h,timeout=30)
                  print('DIAG_ENDPOINT',ep,'HTTP',r.status_code,'CT',r.headers.get('content-type'))
                  try:
                      obj=r.json()
                      print('DIAG_SHAPE='+json.dumps(shape(obj),sort_keys=True)[:8000])
                  except Exception as e:
                      print('DIAG_JSON_ERROR',type(e).__name__,'TEXT_PREFIX',r.text[:300].replace('\n',' '))
              except Exception as e:
                  print('DIAG_REQUEST_ERROR',ep,type(e).__name__,str(e)[:200])
          print('DIAG_SAFETY: structure only, no market endpoints/outcomes')
          PY
      - name: Compile gate
        run: python -m py_compile research/binance_perp_margin_tier_forced_deleveraging/source_gate_v01.py
      - name: Run outcome-blind source gate
        run: python research/binance_perp_margin_tier_forced_deleveraging/source_gate_v01.py
      - name: Assert report safety
        run: |
          python - <<'PY'
          import json
          p='bpmtfd_v01_source_gate_report.json'
          d=json.load(open(p))
          s=d['safety']
          assert all(v is False for v in s.values())
          print('SAFETY_ASSERT_PASS')
          print('VERDICT='+d['verdict'])
          print('CLUSTERS='+str(d['independent_clusters']))
          print('EVENTS='+str(d['eligible_asset_events']))
          PY
      - name: Upload source-gate receipt
        uses: actions/upload-artifact@v4
        with:
          name: bpmtfd-v01-source-gate-receipt
          path: bpmtfd_v01_source_gate_report.json
          retention-days: 30
