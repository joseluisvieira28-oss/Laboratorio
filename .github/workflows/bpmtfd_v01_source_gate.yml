name: BPMTFD V0.1 Source Gate

on:
  push:
    branches:
      - binance-perp-margin-tier-forced-deleveraging-v0.1-source-2026-10-06
    paths:
      - 'research/binance_perp_margin_tier_forced_deleveraging/**'
      - '.github/workflows/bpmtfd_v01_source_gate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout frozen branch
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install source-only dependencies
        run: pip install requests beautifulsoup4
      - name: Diagnose Binance announcement list envelope
        run: |
          python - <<'PY'
          import requests, json
          ep='https://www.binance.com/bapi/apex/v1/public/apex/cms/article/list/query'
          h={'User-Agent':'Mozilla/5.0 Chrome/140 CryptoLab','Accept-Language':'en-US,en;q=0.9','lang':'en','Referer':'https://www.binance.com/en/support/announcement'}
          r=requests.get(ep,params={'type':'1','pageNo':1,'pageSize':3},headers=h,timeout=30)
          print('DIAG_HTTP',r.status_code,'CT',r.headers.get('content-type'))
          obj=r.json()
          cats=(obj.get('data') or {}).get('catalogs') or []
          print('DIAG_CATALOGS',len(cats))
          for c in cats[:3]:
              arts=c.get('articles') or []
              print('DIAG_CATALOG_KEYS',sorted(c.keys()))
              if arts:
                  a=arts[0]
                  print('DIAG_ARTICLE_KEYS',sorted(a.keys()))
                  print('DIAG_ARTICLE_TYPES',json.dumps({k:type(v).__name__ for k,v in a.items()},sort_keys=True))
                  for k in ['code','articleCode','id','title','releaseDate','releaseTime','publishTime']:
                      if k in a:
                          v=a[k]
                          safe=(len(v) if isinstance(v,str) else v if isinstance(v,(int,float)) else type(v).__name__)
                          print('DIAG_FIELD',k,'TYPE',type(v).__name__,'SAFE',safe)
                  break
          print('DIAG_SAFETY: structure/types only, no market endpoints/outcomes')
          PY
      - name: Compile gate
        run: python -m py_compile research/binance_perp_margin_tier_forced_deleveraging/source_gate_v01.py
      - name: Run outcome-blind source gate
        run: python research/binance_perp_margin_tier_forced_deleveraging/source_gate_v01.py
      - name: Assert report safety
        run: |
          python - <<'PY'
          import json
          d=json.load(open('bpmtfd_v01_source_gate_report.json'))
          assert all(v is False for v in d['safety'].values())
          print('SAFETY_ASSERT_PASS')
          print('VERDICT='+d['verdict'])
          print('CLUSTERS='+str(d['independent_clusters']))
          print('EVENTS='+str(d['eligible_asset_events']))
          PY
      - name: Upload source-gate receipt
        uses: actions/upload-artifact@v4
        with:
          name: bpmtfd-v01-source-gate-receipt
          path: bpmtfd_v01_source_gate_report.json
          retention-days: 30
