name: BPMTFD V0.1 Source Gate

on:
  push:
    branches:
      - binance-perp-margin-tier-forced-deleveraging-v0.1-source-2026-10-06
    paths:
      - 'research/binance_perp_margin_tier_forced_deleveraging/**'
      - '.github/workflows/bpmtfd_v01_source_gate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout frozen branch
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install diagnostic dependency
        run: pip install requests
      - name: Inspect official article content structure
        run: python research/binance_perp_margin_tier_forced_deleveraging/detail_structure_diag_v011.py
