name: LIQUIDATION-PRESSURE-002 Forward Source Gate

on:
  pull_request:
    paths:
      - 'labs/LIQUIDATION_PRESSURE_002_FORWARD/**'
      - '.github/workflows/liquidation_pressure_002_forward_source_gate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned websocket client
        run: pip install websockets==15.0.1
      - name: Run prospective Bybit source gate
        run: python labs/LIQUIDATION_PRESSURE_002_FORWARD/source_gate.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: LIQUIDATION-PRESSURE-002-SOURCE-EVIDENCE
          path: labs/LIQUIDATION_PRESSURE_002_FORWARD/evidence/
