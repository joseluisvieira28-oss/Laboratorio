name: DLS Save Reserve Metadata Dataslice Calibration V0.1

on:
  push:
    branches:
      - dls-field-enrichment-v01
    paths:
      - .github/workflows/dls-save-reserve-metadata-dataslice-calibration-v01.yml

permissions:
  contents: read

jobs:
  calibrate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile metadata-slice calibration
        run: python -m py_compile labs/DEFI_LIQUIDATION_SHOCK_001/source/calibrate_save_reserve_metadata_dataslice_v0_1.py
      - name: Calibrate exact reserve metadata slices
        run: python labs/DEFI_LIQUIDATION_SHOCK_001/source/calibrate_save_reserve_metadata_dataslice_v0_1.py
      - name: Upload calibration receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dls-save-reserve-metadata-dataslice-calibration-v01
          path: labs/DEFI_LIQUIDATION_SHOCK_001/SAVE_RESERVE_METADATA_DATASLICE_CALIBRATION_RECEIPT_V0.1.json
          if-no-files-found: error
          retention-days: 30
      - name: Firewall
        if: always()
        run: echo SOURCE_ONLY_TRUE
