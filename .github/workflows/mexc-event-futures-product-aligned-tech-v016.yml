name: MEXC Event Futures Product Aligned Tech V0.16

on:
  push:
    branches:
      - mexc-event-futures-product-aligned-tech-v0.16-2026-10-02
    paths:
      - 'research/mexc_event_futures/**'
      - '.github/workflows/mexc-event-futures-product-aligned-tech-v016.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  product-aligned-tech:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install --upgrade pip requests scipy
      - name: Syntax check
        run: python -m py_compile research/mexc_event_futures/product_aligned_tech_v016.py
      - name: Run frozen product-aligned technical rebuild
        run: python research/mexc_event_futures/product_aligned_tech_v016.py
      - name: Verify boundaries
        shell: bash
        run: |
          python - <<'PY'
          import json
          j=json.load(open('artifacts/mexc_event_futures/product_aligned_tech_v016.json',encoding='utf-8'))
          assert j['historical_holdout_sep_2026']=='LOCKED_NOT_FETCHED'
          assert j['promotion_status']=='NO_EXACT_HISTORICAL_OR_LIVE_PROMOTION'
          print('HOLDOUT_LOCK=PASS')
          print('VERDICT='+j['verdict'])
          print('BH_SELECTED='+str(len(j['bh_selected'])))
          print('OOS_SURVIVORS='+str(len(j['oos_survivors'])))
          PY
      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: mexc-event-futures-product-aligned-tech-v016-evidence
          path: artifacts/mexc_event_futures/product_aligned_tech_v016.json
          if-no-files-found: error
