name: Lighter NVDA Portability V0.2
on:
  push:
    branches:
      - lighter-nvda-portability-v0.2-prereg-2026-10-05
permissions:
  contents: read
jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check requests
      - name: Freeze check
        run: |
          test -f research/lighter_nvda/LIGHTER_NVDA_PORTABILITY_SOURCE_BINDING_V0.2.json
          test -f research/lighter_nvda/LIGHTER_NVDA_PORTABILITY_RULE_V0.2.json
          test -f research/lighter_nvda/LIGHTER_NVDA_PORTABILITY_FREEZE_V0.2.md
          python -m py_compile research/lighter_nvda/lighter_nvda_portability_v02.py
          echo LIGHTER_V02_PRE_OUTCOME_FREEZE_PASS
      - run: python research/lighter_nvda/lighter_nvda_portability_v02.py
      - uses: actions/upload-artifact@v4
        with:
          name: lighter-nvda-portability-v02-${{ github.run_id }}
          path: artifacts/lighter_nvda/v02_portability
          if-no-files-found: error
          retention-days: 90
