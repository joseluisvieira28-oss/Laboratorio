name: Compound Realized Disposal Flow Source V0.1.1

on:
  push:
    branches:
      - pressure-mining-program-v0.1
    paths:
      - "pressure_mining_v0_1/compound_realized_disposal_flow_source_v0_1_1.py"
      - ".github/workflows/compound-realized-disposal-flow-source-v0.1.1.yml"
  pull_request:
    branches:
      - main
    paths:
      - "pressure_mining_v0_1/compound_realized_disposal_flow_source_v0_1_1.py"
      - ".github/workflows/compound-realized-disposal-flow-source-v0.1.1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-flow-retry:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile
        run: python -m py_compile pressure_mining_v0_1/compound_realized_disposal_flow_source_v0_1_1.py
      - name: Run transport-hardened source probe
        run: python pressure_mining_v0_1/compound_realized_disposal_flow_source_v0_1_1.py
      - name: Verify receipt
        run: |
          test -s pressure_mining_v0_1/receipts/COMPOUND_REALIZED_DISPOSAL_FLOW_001_SOURCE_RECEIPT_V0.1.1.json
          python - <<'PY'
          import json
          p="pressure_mining_v0_1/receipts/COMPOUND_REALIZED_DISPOSAL_FLOW_001_SOURCE_RECEIPT_V0.1.1.json"
          j=json.load(open(p,encoding="utf-8"))
          print("scientific_status=",j.get("status"))
          if j.get("status")=="TECHNICAL_FAILURE":
              raise SystemExit(2)
          PY
      - name: Upload immutable receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compound-realized-disposal-flow-source-v011
          path: pressure_mining_v0_1/receipts/COMPOUND_REALIZED_DISPOSAL_FLOW_001_SOURCE_RECEIPT_V0.1.1.json
          if-no-files-found: error
