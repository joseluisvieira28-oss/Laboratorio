name: PMD-001 Post Resolution Diagnostic V0.1
on:
  push:
    branches: [pumpfun-migration-direction-v0.1]
    paths:
      - 'Dream-Account-OS-v2.3-PARTIAL/research/pumpfun_migration_direction_001/post_resolution_diagnostic_v01.py'
      - '.github/workflows/pmd001-post-resolution-v01.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'huggingface_hub[hf_xet]>=0.34' 'duckdb>=1.3,<2' 'pytz>=2025.2'
      - name: Diagnose timestamp resolution without opening returns
        env:
          HF_HUB_DISABLE_TELEMETRY: '1'
        run: |
          set -o pipefail
          mkdir -p artifacts
          python Dream-Account-OS-v2.3-PARTIAL/research/pumpfun_migration_direction_001/post_resolution_diagnostic_v01.py \
            --data-dir "$RUNNER_TEMP/pmd001_postres" --out artifacts/pmd_post_resolution_v01.json | tee artifacts/pmd_post_resolution_v01.log
      - name: Assert outcome file absent
        if: always()
        run: |
          if find "$RUNNER_TEMP/pmd001_postres" -name 'postgard_outcomes.parquet' -print -quit | grep -q .; then exit 1; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pmd001-post-resolution-v01
          path: artifacts/
          if-no-files-found: error
          retention-days: 30
