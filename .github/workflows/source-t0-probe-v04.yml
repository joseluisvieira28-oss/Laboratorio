name: source-t0-probe-v04

on:
  push:
    branches:
      - cosmos-native-emission-param-shock-001-v0.2-t0-remediation-2026-10-07
    paths:
      - .github/workflows/source-t0-probe-v04.yml

permissions:
  contents: read

jobs:
  akash-exact-blocks:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Binary-search Akash indexed historical blocks
        shell: bash
        run: |
          python3 - <<'PY'
          import json, urllib.request, ssl
          from datetime import datetime
          UA={"User-Agent":"CryptoLab-source-t0-probe/0.4"}
          BASE="https://console-api.akash.network"

          def get(url,headers=None,timeout=12):
              h=dict(UA); h.update(headers or {})
              try:
                  req=urllib.request.Request(url,headers=h)
                  with urllib.request.urlopen(req,timeout=timeout,context=ssl.create_default_context()) as r:
                      body=r.read().decode("utf-8","replace")
                      try:data=json.loads(body)
                      except: data=body[:20000]
                      return {"ok":True,"status":r.status,"url":url,"data":data}
              except Exception as e:
                  return {"ok":False,"url":url,"error":repr(e)}

          def bt(h):
              r=get(f"{BASE}/v1/blocks/{h}")
              if r["ok"] and isinstance(r["data"],dict) and "datetime" in r["data"]:
                  return r["data"],r
              return None,r

          def ts(s):
              return datetime.fromisoformat(s.replace("Z","+00:00")).timestamp()

          cases={
            "265":{
              "target":"2024-08-08T16:13:48.243802688Z",
              "lo":17516882,
              "hi":17672834
            },
            "283":{
              "target":"2025-03-14T13:25:56.642245036Z",
              "lo":20625016,
              "hi":20635016
            }
          }
          out={"scope":"SOURCE_ONLY_NO_MARKET_DATA","cases":{}}
          for pid,c in cases.items():
              rec={"target":c["target"],"initial_lo":c["lo"],"initial_hi":c["hi"]}
              blo,rlo=bt(c["lo"]); bhi,rhi=bt(c["hi"])
              rec["initial_lo_block"]=blo if blo else rlo
              rec["initial_hi_block"]=bhi if bhi else rhi
              target=ts(c["target"])
              if blo and bhi:
                  rec["bracket_valid"]=ts(blo["datetime"]) < target <= ts(bhi["datetime"])
                  if rec["bracket_valid"]:
                      L,R=c["lo"],c["hi"]
                      calls=0
                      while L<R:
                          M=(L+R)//2
                          b,raw=bt(M); calls+=1
                          if not b:
                              rec["binary_error"]={"height":M,"raw":raw}
                              break
                          if ts(b["datetime"]) >= target:R=M
                          else:L=M+1
                      if "binary_error" not in rec:
                          H=L
                          rec["first_block_at_or_after_vote_end"]=H
                          rec["binary_calls"]=calls
                          rec["neighbors"]={}
                          for hh in range(H-3,H+4):
                              b,raw=bt(hh)
                              rec["neighbors"][str(hh)]=b if b else raw
              out["cases"][pid]=rec

          # Probe H/H+1 through public REST historical headers and RPC where available.
          rpcs=[
            "https://akash.rpc.uquad.org",
            "https://rpc-akash.ecostake.com",
            "https://akash-rpc.kleomedes.network",
            "https://akash-mainnet-rpc.cosmonautstakes.com",
            "https://akash-rpc.publicnode.com",
            "https://akash-rpc.polkachu.com",
            "https://akash-mainnet-rpc.crouton.digital"
          ]
          rests=[
            "https://rest-akash.ecostake.com",
            "https://akash-api.polkachu.com",
            "https://akash-api.kleomedes.network",
            "https://akash-mainnet-rest.cosmonautstakes.com",
            "https://akash-rest.publicnode.com",
            "https://akash-api.validatornode.com",
            "https://akash-mainnet-api.crouton.digital"
          ]
          for pid,rec in out["cases"].items():
              H=rec.get("first_block_at_or_after_vote_end")
              if not H: continue
              compact=[]
              for hh in (H-1,H,H+1,H+2):
                  for rpc in rpcs:
                      for ep in ("block","block_results"):
                          rr=get(rpc.rstrip("/")+f"/{ep}?height={hh}",timeout=8)
                          if rr["ok"] or "pruned" not in str(rr).lower():
                              compact.append({"height":hh,"kind":ep,"provider":rpc,"response":rr})
                  for rest in rests:
                      for path in ("/cosmos/mint/v1beta1/inflation","/cosmos/mint/v1beta1/params"):
                          rr=get(rest.rstrip("/")+path,headers={"x-cosmos-block-height":str(hh)},timeout=8)
                          if rr["ok"]:
                              compact.append({"height":hh,"kind":path,"provider":rest,"response":rr})
              rec["historical_success_or_nonpruned"]=compact

          print("SOURCE_T0_PROBE_V04_BEGIN")
          print(json.dumps(out,indent=2,sort_keys=True)[:900000])
          print("SOURCE_T0_PROBE_V04_END")
          PY
