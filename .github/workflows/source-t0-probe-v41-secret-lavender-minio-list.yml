name: source-t0-probe-v41-secret-lavender-minio-list

on:
  workflow_dispatch:
  push:
    branches:
      - cosmos-native-emission-param-shock-001-v0.2-t0-remediation-2026-10-07
    paths:
      - .github/workflows/source-t0-probe-v41-secret-lavender-minio-list.yml

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cosmos-native-emission-param-shock-001-v0.2-t0-remediation-2026-10-07
      - name: Enumerate LavenderFive MinIO snapshot bucket
        shell: bash
        run: |
          python3 - <<'PY'
          import json,urllib.request,urllib.error,ssl,hashlib,os,datetime,xml.etree.ElementTree as ET,urllib.parse
          OUT="research/cosmos_native_emission_param_shock_001_v0_2/SCRT287_LAVENDER_MINIO_LIST_V41.json"
          UA={"User-Agent":"CryptoLab-source-only-secret-v41","Accept":"application/xml,*/*"}

          def get(u,to=20):
              try:
                  q=urllib.request.Request(u,headers=UA)
                  with urllib.request.urlopen(q,timeout=to,context=ssl._create_unverified_context()) as r:
                      b=r.read()
                      return {"ok":True,"status":getattr(r,"status",200),"url":r.geturl(),"headers":dict(r.headers),
                              "sha256":hashlib.sha256(b).hexdigest(),"body":b.decode("utf-8","replace")[:2000000]}
              except urllib.error.HTTPError as e:
                  try:b=e.read()
                  except:b=b""
                  return {"ok":False,"status":e.code,"url":u,"headers":dict(e.headers or {}),
                          "error":str(e),"sha256":hashlib.sha256(b).hexdigest() if b else None,
                          "body":b.decode("utf-8","replace")[:200000]}
              except Exception as e:
                  return {"ok":False,"status":None,"url":u,"headers":{},"error":repr(e),"body":""}

          attempts=[]
          objects=[]
          candidates=[
            "https://snapshots.lavenderfive.com/snapshots?list-type=2&prefix=secretnetwork%2F&max-keys=1000",
            "https://snapshots.lavenderfive.com/snapshots?prefix=secretnetwork%2F&max-keys=1000",
            "https://snapshots.lavenderfive.com/?list-type=2&prefix=secretnetwork%2F&max-keys=1000",
          ]
          for u in candidates:
              r=get(u,20)
              attempts.append({"url":u,"ok":r["ok"],"status":r.get("status"),"headers":r.get("headers"),
                               "sha256":r.get("sha256"),"error":r.get("error"),"body_excerpt":r.get("body","")[:100000]})
              if r["ok"]:
                  try:
                      root=ET.fromstring(r["body"])
                      for c in root.findall(".//{*}Contents")+root.findall(".//Contents"):
                          key=c.findtext("{*}Key") or c.findtext("Key")
                          size=c.findtext("{*}Size") or c.findtext("Size")
                          mod=c.findtext("{*}LastModified") or c.findtext("LastModified")
                          etag=c.findtext("{*}ETag") or c.findtext("ETag")
                          if key:
                              rec={"key":key,"size":size,"last_modified":mod,"etag":etag}
                              if rec not in objects:objects.append(rec)
                  except Exception as e:
                      attempts[-1]["parse_error"]=repr(e)

          out={"scope":"SOURCE_ONLY_NO_MARKET_DATA","candidate":"SCRT Proposal 287",
               "tested_utc":datetime.datetime.now(datetime.timezone.utc).isoformat(),
               "attempts":attempts,"object_count":len(objects),"objects":objects,
               "secret_objects":[x for x in objects if "secret" in x["key"].lower()]}
          os.makedirs(os.path.dirname(OUT),exist_ok=True)
          with open(OUT,"w") as f:json.dump(out,f,indent=2)
          print("V41",json.dumps({"object_count":len(objects),"secret_objects":out["secret_objects"][:100]}))
          PY
      - name: Persist
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/cosmos_native_emission_param_shock_001_v0_2/SCRT287_LAVENDER_MINIO_LIST_V41.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "SCRT287: persist Lavender MinIO listing probe v41"
          git pull --rebase origin cosmos-native-emission-param-shock-001-v0.2-t0-remediation-2026-10-07
          git push origin HEAD:cosmos-native-emission-param-shock-001-v0.2-t0-remediation-2026-10-07
