name: Radar Postgres Preseeded Cutover V0.2 QA

on:
  pull_request:
    paths:
      - 'crypto_edge_radar/radar/evidence_portability.py'
      - 'crypto_edge_radar/tests/test_evidence_portability.py'
      - 'crypto_edge_radar/authorities/RADAR_POSTGRES_CUTOVER_PRESEEDED_TARGET_AMENDMENT_V0.2.md'
      - '.github/workflows/radar-postgres-preseeded-cutover-v02-qa.yml'
  workflow_dispatch:

jobs:
  qa:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crypto_edge_radar
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: pip install -e .
      - name: Compile
        run: python -m compileall -q radar tests
      - name: Exact portability tests
        run: python -m unittest -v tests.test_evidence_portability
      - name: Full deterministic Radar suite
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Governance guard
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path("authorities/RADAR_POSTGRES_CUTOVER_PRESEEDED_TARGET_AMENDMENT_V0.2.md").read_text()
          for token in (
              "PRESEEDED_TARGET_DIVERGENCE_FAIL_CLOSED",
              "target is already exactly equal",
              "do not delete it automatically",
              "No science changes",
              "No trading",
              "No main merge",
          ):
              assert token in p, token
          print("RADAR_POSTGRES_PRESEEDED_CUTOVER_V02_GUARD_PASS")
          PY
