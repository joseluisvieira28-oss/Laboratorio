name: Perp Crowding Unwind Source Gate V0.1
on:
  push:
    branches: [perp-crowding-unwind-v0.1]
    paths:
      - "labs/PERP_CROWDING_UNWIND_001/SOURCE_AUTHORITY_V0.1.json"
      - "labs/PERP_CROWDING_UNWIND_001/source_gate_v01.py"
      - ".github/workflows/perp-crowding-unwind-source-v01.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install --disable-pip-version-check -q pandas
      - name: Compile
        run: python -m py_compile labs/PERP_CROWDING_UNWIND_001/source_gate_v01.py
      - name: Run frozen source-only gate
        run: python labs/PERP_CROWDING_UNWIND_001/source_gate_v01.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: PERP_CROWDING_UNWIND_001_SOURCE_V0_1
          path: pcu_source_receipt_v01.json
          if-no-files-found: error
          retention-days: 30
