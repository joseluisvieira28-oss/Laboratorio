name: LCOD-001 borrow-log block-pin universe V0.1
on:
  push:
    branches: [liquidation-convexity-oracle-distance-001-source-gate-v0.1]
    paths:
      - 'research/liquidation_convexity_oracle_distance_001/LCOD_BORROW_LOG_BLOCK_PIN_UNIVERSE_FREEZE_V0.1.md'
      - 'research/liquidation_convexity_oracle_distance_001/lcod_borrow_log_block_pin_universe_v01.py'
      - '.github/workflows/lcod-001-borrow-log-block-pin-universe-v01.yml'
permissions:
  contents: write
jobs:
  universe:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with: {ref: liquidation-convexity-oracle-distance-001-source-gate-v0.1}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check --quiet pycryptodome
      - run: python research/liquidation_convexity_oracle_distance_001/lcod_borrow_log_block_pin_universe_v01.py
      - name: Persist receipt
        if: always()
        run: |
          if [ -f artifacts/lcod_borrow_log_block_pin_universe_v01.json ]; then
            cp artifacts/lcod_borrow_log_block_pin_universe_v01.json research/liquidation_convexity_oracle_distance_001/LCOD_BORROW_LOG_BLOCK_PIN_UNIVERSE_RECEIPT.json
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add research/liquidation_convexity_oracle_distance_001/LCOD_BORROW_LOG_BLOCK_PIN_UNIVERSE_RECEIPT.json
            if ! git diff --cached --quiet; then
              git commit -m "LCOD-001: record borrow-log block-pin universe gate [skip ci]"
              git push origin HEAD:liquidation-convexity-oracle-distance-001-source-gate-v0.1
            fi
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lcod-borrow-log-block-pin-universe-v01
          path: artifacts/lcod_borrow_log_block_pin_universe_v01.json
          if-no-files-found: error
