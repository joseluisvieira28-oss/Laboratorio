name: AAVE Liquidation Overhang 001 — Discovery 2023 Recovery V0.1.1

on:
  push:
    branches:
      - aave-liquidation-overhang-v0.1
    paths:
      - '.github/workflows/aave-liquidation-overhang-discovery-2023-v011-recovery.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  BASE_DISCOVERY_RUN_ID: '35393804723'
  R0_BOOTSTRAP_RUN_ID: '35218275356'

jobs:
  remediation-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests 'eth-hash[pycryptodome]'
      - name: Compile patched Discovery code
        run: |
          python -m py_compile research/aave_liquidation_overhang/discovery_reserve_shard_v01.py
          python -m py_compile research/aave_liquidation_overhang/discovery_predictor_aggregate_v01.py
          python -m py_compile research/aave_liquidation_overhang/discovery_outcomes_v01.py
          python -m py_compile research/aave_liquidation_overhang/discovery_adjudicate_v01.py
      - name: Verify frozen remediation authority
        run: |
          test -f research/aave_liquidation_overhang/AAVE_LIQUIDATION_OVERHANG_001_DISCOVERY_ACTIVE_RESERVE_SCOPE_REMEDIATION_V0_1_1.md
      - name: Download base calendar/global and PASS shards
        uses: actions/download-artifact@v4
        with:
          pattern: 'AAVE_DISCOVERY_*'
          path: base_artifacts
          merge-multiple: false
          github-token: ${{ github.token }}
          repository: joseluisvieira28-oss/Laboratorio
          run-id: ${{ env.BASE_DISCOVERY_RUN_ID }}
      - name: Verify base run evidence and no predictor/outcome existed
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          roots={p.name:p for p in Path('base_artifacts').iterdir() if p.is_dir()}
          assert 'AAVE_DISCOVERY_CALENDAR_V0_1' in roots
          assert 'AAVE_DISCOVERY_GLOBAL_V0_1' in roots
          assert 'AAVE_DISCOVERY_RESERVE_SHARD_V0_1_2' in roots
          assert 'AAVE_DISCOVERY_RESERVE_SHARD_V0_1_7' in roots
          assert 'AAVE_DISCOVERY_PREDICTOR_2023_V0_1' not in roots
          assert 'AAVE_DISCOVERY_OUTCOME_2023_V0_1' not in roots
          for sid in (2,7):
              fs=list(roots[f'AAVE_DISCOVERY_RESERVE_SHARD_V0_1_{sid}'].rglob('*_meta.json'))
              assert len(fs)==1
              x=json.loads(fs[0].read_text())
              assert x['classification']=='DISCOVERY_RESERVE_SHARD_PASS'
              assert x['snapshot_count']==334
          cal=list(roots['AAVE_DISCOVERY_CALENDAR_V0_1'].rglob('*.json'))
          glo=list(roots['AAVE_DISCOVERY_GLOBAL_V0_1'].rglob('*.json'))
          assert len(cal)==1 and json.loads(cal[0].read_text())['classification']=='DISCOVERY_CALENDAR_PASS'
          assert len(glo)==1 and json.loads(glo[0].read_text())['classification']=='DISCOVERY_GLOBAL_SOURCE_PASS'
          print('DISCOVERY_V011_REMEDIATION_PREFLIGHT_PASS')
          PY

  reserve-recovery:
    needs: remediation-preflight
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        shard_id: [0,1,3,4,5,6]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests 'eth-hash[pycryptodome]'
      - uses: actions/download-artifact@v4
        with:
          name: AAVE_DISCOVERY_CALENDAR_V0_1
          path: downloaded_discovery_calendar
          github-token: ${{ github.token }}
          repository: joseluisvieira28-oss/Laboratorio
          run-id: ${{ env.BASE_DISCOVERY_RUN_ID }}
      - uses: actions/download-artifact@v4
        with:
          name: AAVE_DISCOVERY_GLOBAL_V0_1
          path: downloaded_discovery_global
          github-token: ${{ github.token }}
          repository: joseluisvieira28-oss/Laboratorio
          run-id: ${{ env.BASE_DISCOVERY_RUN_ID }}
      - uses: actions/download-artifact@v4
        with:
          name: AAVE_RECON_R0_BOOTSTRAP
          path: downloaded_r0_bootstrap
          github-token: ${{ github.token }}
          repository: joseluisvieira28-oss/Laboratorio
          run-id: ${{ env.R0_BOOTSTRAP_RUN_ID }}
      - name: Replay corrected active-2023 reserve shard
        env:
          DISCOVERY_RESERVE_SHARD_ID: ${{ matrix.shard_id }}
          DISCOVERY_RESERVE_SHARD_COUNT: '8'
        run: python research/aave_liquidation_overhang/discovery_reserve_shard_v01.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AAVE_DISCOVERY_RESERVE_SHARD_V0_1_1_${{ matrix.shard_id }}
          path: |
            discovery_reserve_shards/reserve_shard_*_meta.json
            discovery_reserve_shards/reserve_shard_*_rows.jsonl.gz
          if-no-files-found: warn
          retention-days: 30

  predictor:
    needs: reserve-recovery
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: AAVE_DISCOVERY_CALENDAR_V0_1
          path: downloaded_discovery_calendar
          github-token: ${{ github.token }}
          repository: joseluisvieira28-oss/Laboratorio
          run-id: ${{ env.BASE_DISCOVERY_RUN_ID }}
      - uses: actions/download-artifact@v4
        with:
          name: AAVE_DISCOVERY_GLOBAL_V0_1
          path: downloaded_discovery_global
          github-token: ${{ github.token }}
          repository: joseluisvieira28-oss/Laboratorio
          run-id: ${{ env.BASE_DISCOVERY_RUN_ID }}
      - uses: actions/download-artifact@v4
        with:
          pattern: AAVE_DISCOVERY_RESERVE_SHARD_V0_1_1_*
          path: downloaded_discovery_reserves
          merge-multiple: true
      - name: Reuse canonical PASS shard 2
        uses: actions/download-artifact@v4
        with:
          name: AAVE_DISCOVERY_RESERVE_SHARD_V0_1_2
          path: downloaded_discovery_reserves
          github-token: ${{ github.token }}
          repository: joseluisvieira28-oss/Laboratorio
          run-id: ${{ env.BASE_DISCOVERY_RUN_ID }}
      - name: Reuse canonical PASS shard 7
        uses: actions/download-artifact@v4
        with:
          name: AAVE_DISCOVERY_RESERVE_SHARD_V0_1_7
          path: downloaded_discovery_reserves
          github-token: ${{ github.token }}
          repository: joseluisvieira28-oss/Laboratorio
          run-id: ${{ env.BASE_DISCOVERY_RUN_ID }}
      - name: Aggregate exact active-2023 predictor
        run: python research/aave_liquidation_overhang/discovery_predictor_aggregate_v01.py
      - name: Enforce predictor-before-outcome firewall
        run: |
          python - <<'PY'
          import json
          p='discovery_predictor_output/AAVE_LIQUIDATION_OVERHANG_001_DISCOVERY_PREDICTOR_2023_V0_1.json'
          x=json.load(open(p))
          assert x['classification']=='DISCOVERY_PREDICTOR_PASS'
          assert x['reserve_count']==27
          assert x['full_r1_reserve_count']==37
          s=x['safety']
          assert s['future_liquidation_outcomes_opened'] is False
          assert s['opened_2024_predictor'] is False
          assert s['opened_2024_outcomes'] is False
          assert s['opened_2025_or_2026'] is False
          assert s['market_returns_opened'] is False
          assert s['pnl_opened'] is False
          print('PREDICTOR_V011_FIREWALL_PASS',x['predictor_sha256'],x['days_overhang_10_positive'])
          PY
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AAVE_DISCOVERY_PREDICTOR_2023_V0_1_1
          path: discovery_predictor_output/AAVE_LIQUIDATION_OVERHANG_001_DISCOVERY_PREDICTOR_2023_V0_1.json
          if-no-files-found: error
          retention-days: 30

  outcomes-2023:
    needs: predictor
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests 'eth-hash[pycryptodome]'
      - uses: actions/download-artifact@v4
        with:
          name: AAVE_DISCOVERY_PREDICTOR_2023_V0_1_1
          path: downloaded_discovery_predictor
      - uses: actions/download-artifact@v4
        with:
          name: AAVE_DISCOVERY_CALENDAR_V0_1
          path: downloaded_discovery_calendar
          github-token: ${{ github.token }}
          repository: joseluisvieira28-oss/Laboratorio
          run-id: ${{ env.BASE_DISCOVERY_RUN_ID }}
      - uses: actions/download-artifact@v4
        with:
          name: AAVE_DISCOVERY_GLOBAL_V0_1
          path: downloaded_discovery_global
          github-token: ${{ github.token }}
          repository: joseluisvieira28-oss/Laboratorio
          run-id: ${{ env.BASE_DISCOVERY_RUN_ID }}
      - name: Open only frozen 2023 liquidation outcomes
        run: python research/aave_liquidation_overhang/discovery_outcomes_v01.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AAVE_DISCOVERY_OUTCOME_2023_V0_1_1
          path: discovery_outcome_output/AAVE_LIQUIDATION_OVERHANG_001_DISCOVERY_OUTCOME_2023_V0_1.json
          if-no-files-found: error
          retention-days: 30

  canonical-adjudication:
    needs: outcomes-2023
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: AAVE_DISCOVERY_PREDICTOR_2023_V0_1_1
          path: downloaded_discovery_predictor
      - uses: actions/download-artifact@v4
        with:
          name: AAVE_DISCOVERY_OUTCOME_2023_V0_1_1
          path: downloaded_discovery_outcome
      - name: Canonical frozen 2023 Discovery adjudication
        run: python research/aave_liquidation_overhang/discovery_adjudicate_v01.py
      - name: Enforce all hard firewalls
        run: |
          python - <<'PY'
          import json
          p='discovery_canonical_output/AAVE_LIQUIDATION_OVERHANG_001_DISCOVERY_2023_CANONICAL_V0_1.json'
          x=json.load(open(p))
          s=x['safety']
          assert s['opened_2024_predictor'] is False
          assert s['opened_2024_outcomes'] is False
          assert s['opened_2025_or_2026'] is False
          assert s['market_returns_opened'] is False
          assert s['pnl_opened'] is False
          assert s['live_trading'] is False
          assert s['exchange_mutation'] is False
          print('DISCOVERY_V011_CANONICAL_FIREWALL_PASS',x['classification'],x.get('next_authorized_phase'))
          PY
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AAVE_DISCOVERY_2023_CANONICAL_V0_1_1
          path: discovery_canonical_output/AAVE_LIQUIDATION_OVERHANG_001_DISCOVERY_2023_CANONICAL_V0_1.json
          if-no-files-found: error
          retention-days: 30
