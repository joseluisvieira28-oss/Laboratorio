name: Radar Private Backup Cleanup V0.3

on:
  pull_request:
    branches:
      - crypto-edge-radar-postgres-v0.5
  push:
    branches:
      - radar-private-backup-cleanup-v0.3
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crypto_edge_radar
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - name: Cleanup-specific assertions
        run: python -m unittest tests.test_private_backup_route tests.test_private_evidence_backup -v
      - name: Full deterministic suite
        run: python -m unittest discover -s tests -v
