name: PSRV Multi Observation Source Gate

on:
  push:
    branches: [prediction-settlement-rv-v0.1]
    paths:
      - 'research/prediction_settlement_rv/MULTI_OBSERVATION_SOURCE_GATE_V0.1.md'
      - 'research/prediction_settlement_rv/multi_source_gate.py'
      - '.github/workflows/prediction_settlement_rv_multi_source_gate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  multi-source-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run frozen five-cycle source reliability gate
        run: python research/prediction_settlement_rv/multi_source_gate.py
      - name: Enforce source-only firewall
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("artifacts/prediction_settlement_rv/multi_source_gate/multi_source_gate_receipt.json")
          x=json.loads(p.read_text())
          assert x["economic_values_reported"] is False
          assert x["economic_outputs_computed"] is False
          assert x["matured_outcomes_read"] is False
          assert x["orders"] is False
          assert x["authenticated_trading_endpoints"] is False
          assert x["future_nearest_joins"] == 0
          assert x["silent_imputations"] == 0
          assert x["source_data_pass"] is False
          print("MULTI_SOURCE_FIREWALL_PASS")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: PSRV_MULTI_SOURCE_GATE
          path: artifacts/prediction_settlement_rv/multi_source_gate/
          if-no-files-found: error
