name: source-t0-probe-v37-zonescan-exact

on:
  push:
    branches:
      - cosmos-native-emission-param-shock-001-v0.2-t0-remediation-2026-10-07
    paths:
      - .github/workflows/source-t0-probe-v37-zonescan-exact.yml

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cosmos-native-emission-param-shock-001-v0.2-t0-remediation-2026-10-07
      - run: python research/cosmos_native_emission_param_shock_001_v0_2/probe_scrt287_zonescan_v37.py
      - name: Persist source receipt
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/cosmos_native_emission_param_shock_001_v0_2/SCRT287_ZONESCAN_EXACT_BLOCK_API_V37.json
          git commit -m "SCRT287: persist Zonescan exact boundary probe v37"
          git push origin HEAD:cosmos-native-emission-param-shock-001-v0.2-t0-remediation-2026-10-07
