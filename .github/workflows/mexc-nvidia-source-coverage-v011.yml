name: MEXC NVIDIA Source Coverage V0.1.1

on:
  push:
    branches:
      - mexc-nvidia-equity-dislocation-v0.1-source-gate-2026-10-04
    paths:
      - 'research/mexc_global_assets/MEXC_NVIDIA_SOURCE_GATE_AMENDMENT_V0.1.1.md'
      - 'research/mexc_global_assets/mexc_nvidia_source_probe_v011.py'
      - '.github/workflows/mexc-nvidia-source-coverage-v011.yml'

permissions:
  contents: read

jobs:
  source-coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependency
        run: python -m pip install --disable-pip-version-check requests
      - name: Governance preflight
        run: |
          test "$GITHUB_REF_NAME" = "mexc-nvidia-equity-dislocation-v0.1-source-gate-2026-10-04"
          test -f research/mexc_global_assets/MEXC_NVIDIA_SOURCE_GATE_AMENDMENT_V0.1.1.md
          python -m py_compile research/mexc_global_assets/mexc_nvidia_source_probe_v011.py
          echo 'SOURCE COVERAGE ONLY / NO OUTCOMES'
      - name: Execute broad historical transport probe
        run: python research/mexc_global_assets/mexc_nvidia_source_probe_v011.py
      - name: Upload immutable source evidence
        uses: actions/upload-artifact@v4
        with:
          name: mexc-nvidia-source-v011-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/mexc_global_assets/nvidia_source_gate_v011
          if-no-files-found: error
          retention-days: 90
      - name: Governance closeout
        run: |
          echo 'SOURCE ONLY'
          echo 'NO HISTORICAL SIGNAL OUTCOMES'
          echo 'NO PRIVATE ENDPOINTS / NO ACCOUNT READS'
          echo 'NO ORDERS / NO MUTATION / NO LIVE TRADING'
