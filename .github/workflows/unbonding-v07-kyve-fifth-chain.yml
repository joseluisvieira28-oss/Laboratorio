name: Unbonding V0.7 KYVE Fifth Chain

on:
  push:
    branches:
      - pos-unbonding-completion-001-v0.7-kyve-source-remediation-2026-10-07
    paths:
      - "research/pos_unbonding_completion_001_v0_7_kyve/v07_fifth_chain_qualification.py"
      - ".github/workflows/unbonding-v07-kyve-fifth-chain.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pos-unbonding-completion-001-v0.7-kyve-source-remediation-2026-10-07
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run KYVE multi-anchor fifth-chain qualifier
        run: python research/pos_unbonding_completion_001_v0_7_kyve/v07_fifth_chain_qualification.py
      - name: Commit receipt
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/pos_unbonding_completion_001_v0_7_kyve/V07_FIFTH_CHAIN_QUALIFICATION.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record V0.7 KYVE fifth-chain qualification"
          git pull --rebase origin pos-unbonding-completion-001-v0.7-kyve-source-remediation-2026-10-07
          git push origin HEAD:pos-unbonding-completion-001-v0.7-kyve-source-remediation-2026-10-07
