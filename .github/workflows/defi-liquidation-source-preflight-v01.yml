name: DEFI-LIQUIDATION-SHOCK-001 Source Preflight V0.1 — HISTORICAL SUPERSEDED

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-preflight-historical:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Historical scope warning
        run: |
          echo "V0.1 IS HISTORICAL / SUPERSEDED FOR FUTURE SOURCE EXECUTION"
          echo "It contains the retired Kamino discriminator path."
          echo "Current authority: V0.2 synthetic QA + MANIFEST_V0.4."
      - name: Checkout frozen research branch
        uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile historical V0.1 tooling
        run: |
          python -m py_compile             labs/DEFI_LIQUIDATION_SHOCK_001/source/collect_protocol_history_v0_1.py             labs/DEFI_LIQUIDATION_SHOCK_001/source/verify_bigquery_candidates_v0_1.py             labs/DEFI_LIQUIDATION_SHOCK_001/source/test_source_collector_synthetic_v0_1.py             labs/DEFI_LIQUIDATION_SHOCK_001/source/test_bigquery_verifier_synthetic_v0_1.py             labs/DEFI_LIQUIDATION_SHOCK_001/source/test_source_static_governance_v0_1.py
      - name: Run historical V0.1 tests
        run: |
          python labs/DEFI_LIQUIDATION_SHOCK_001/source/test_source_collector_synthetic_v0_1.py
          python labs/DEFI_LIQUIDATION_SHOCK_001/source/test_bigquery_verifier_synthetic_v0_1.py
          python labs/DEFI_LIQUIDATION_SHOCK_001/source/test_source_static_governance_v0_1.py
      - name: Historical-only footer
        run: |
          echo "HISTORICAL_V01_AUDIT_COMPLETE"
          echo "NOT_CURRENT_KAMINO_AUTHORITY"
