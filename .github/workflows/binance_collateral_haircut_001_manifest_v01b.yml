name: BINANCE-COLLATERAL-HAIRCUT-001 Manifest Gate V0.1B
on:
  push:
    branches: [binance-collateral-haircut-v0.1]
    paths:
      - 'Dream-Account-OS-v2.3-PARTIAL/research/BINANCE_COLLATERAL_HAIRCUT_001_MANIFEST_TRIGGER_V01B.txt'
permissions:
  contents: write
jobs:
  source:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {ref: binance-collateral-haircut-v0.1}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install -q requests beautifulsoup4
      - run: python Dream-Account-OS-v2.3-PARTIAL/research/binance_collateral_haircut_001_manifest_gate_v01b.py
      - name: Commit immutable source receipt
        if: always()
        run: |
          git config user.name "crypto-lab-bot"
          git config user.email "actions@users.noreply.github.com"
          git add Dream-Account-OS-v2.3-PARTIAL/runtime/binance_collateral_haircut_001/source_manifest_receipt_v01b.json || true
          git diff --cached --quiet && exit 0
          git commit -m "research: record collateral haircut manifest gate V0.1B"
          git push origin HEAD:binance-collateral-haircut-v0.1
