name: Unbonding V0.4.2 Second Block Index

on:
  push:
    branches:
      - pos-unbonding-completion-001-v0.4-index-free-census-2026-10-07
    paths:
      - "research/pos_unbonding_completion_001_v0_4_index_free/v042_second_block_index_probe.py"
      - ".github/workflows/unbonding-v042-second-index.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pos-unbonding-completion-001-v0.4-index-free-census-2026-10-07
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Probe alternate block indexes
        run: python research/pos_unbonding_completion_001_v0_4_index_free/v042_second_block_index_probe.py
      - name: Commit receipt
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/pos_unbonding_completion_001_v0_4_index_free/SECOND_BLOCK_INDEX_PROBE_V042.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Record alternate V0.4.2 block-index probes"
            git push origin HEAD:pos-unbonding-completion-001-v0.4-index-free-census-2026-10-07
          fi
