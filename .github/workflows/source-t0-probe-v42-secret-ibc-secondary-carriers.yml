name: source-t0-probe-v42-secret-ibc-secondary-carriers

on:
  workflow_dispatch:
  push:
    branches:
      - cosmos-native-emission-param-shock-001-v0.2-t0-remediation-2026-10-07
    paths:
      - .github/workflows/source-t0-probe-v42-secret-ibc-secondary-carriers.yml

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cosmos-native-emission-param-shock-001-v0.2-t0-remediation-2026-10-07
      - name: Search secondary IBC carriers for Secret headers
        shell: bash
        run: |
          python3 - <<'PY'
          import json,urllib.request,urllib.error,ssl,hashlib,os,datetime,re

          OUT="research/cosmos_native_emission_param_shock_001_v0_2/SCRT287_IBC_SECONDARY_CARRIERS_V42.json"
          TARGET="2023-12-07T02:54:58.930543213Z"
          TT=1701917698930543213
          UA={"User-Agent":"CryptoLab-source-only-secret-v42","Accept":"application/json"}
          carriers=[
            ("persistence","07-tendermint-106","https://rpc.cosmos.directory/persistence"),
            ("quicksilver","07-tendermint-28","https://rpc.cosmos.directory/quicksilver"),
            ("gravitybridge","07-tendermint-140","https://rpc.cosmos.directory/gravitybridge"),
            ("crescent","07-tendermint-18","https://rpc.cosmos.directory/crescent"),
            ("chihuahua","07-tendermint-70","https://rpc.cosmos.directory/chihuahua"),
            ("agoric","07-tendermint-17","https://rpc.cosmos.directory/agoric"),
          ]

          def post(base,payload,to=12):
              data=json.dumps(payload).encode()
              q=urllib.request.Request(base,data=data,headers={**UA,"Content-Type":"application/json"},method="POST")
              try:
                  with urllib.request.urlopen(q,timeout=to,context=ssl._create_unverified_context()) as r:
                      b=r.read()
                      return {"ok":True,"status":r.status,"sha256":hashlib.sha256(b).hexdigest(),"raw":b}
              except urllib.error.HTTPError as e:
                  try:b=e.read()
                  except:b=b""
                  return {"ok":False,"status":e.code,"error":str(e),"raw":b}
              except Exception as e:return {"ok":False,"status":None,"error":repr(e),"raw":b""}

          def varint(b,i):
              x=0;s=0
              while True:
                  if i>=len(b):raise ValueError("truncated")
                  c=b[i];i+=1;x|=(c&127)<<s
                  if not c&128:return x,i
                  s+=7
          def fields(b):
              i=0;o=[]
              while i<len(b):
                  try:k,i=varint(b,i)
                  except:break
                  n,w=k>>3,k&7
                  if w==0:v,i=varint(b,i);o.append((n,w,v))
                  elif w==1:
                      if i+8>len(b):break
                      o.append((n,w,b[i:i+8]));i+=8
                  elif w==2:
                      ln,i=varint(b,i)
                      if i+ln>len(b):break
                      o.append((n,w,b[i:i+ln]));i+=ln
                  elif w==5:
                      if i+4>len(b):break
                      o.append((n,w,b[i:i+4]));i+=4
                  else:break
              return o
          def fget(fs,n,w=None):
              for a,b,c in fs:
                  if a==n and (w is None or b==w):return c
              return None
          def decode(hx):
              af=fields(bytes.fromhex(hx));v=fget(af,2,2);hf=fields(v);sh=fget(hf,1,2)
              sf=fields(sh);hd=fget(sf,1,2);tf=fields(hd)
              chain=fget(tf,2,2).decode();height=int(fget(tf,3,0));tm=fget(tf,4,2)
              tfs=fields(tm);sec=int(fget(tfs,1,0));nano=int(fget(tfs,2,0) or 0)
              dt=datetime.datetime.fromtimestamp(sec,tz=datetime.timezone.utc)
              ts=dt.strftime("%Y-%m-%dT%H:%M:%S")+("."+(f"{nano:09d}").rstrip("0") if nano else "")+"Z"
              return {"chain_id":chain,"height":height,"time":ts,"time_ns":sec*10**9+nano,
                      "header_hex_sha256":hashlib.sha256(bytes.fromhex(hx)).hexdigest()}

          def page(base,client,p):
              payload={"jsonrpc":"2.0","id":1,"method":"tx_search",
                       "params":{"query":f"update_client.client_id='{client}'","prove":False,
                                 "page":str(p),"per_page":"1","order_by":"asc"}}
              r=post(base,payload)
              out={"page":p,"ok":r["ok"],"status":r.get("status"),"error":r.get("error"),"sha256":r.get("sha256")}
              if not r["ok"]:return out
              try:d=json.loads(r["raw"]);res=d.get("result") or {}
              except Exception as e:out["parse_error"]=repr(e);return out
              out["total_count"]=int(res.get("total_count") or 0)
              txs=res.get("txs") or []
              if not txs:return out
              tx=txs[0];attrs=None
              for ev in (tx.get("tx_result") or {}).get("events") or []:
                  if ev.get("type")=="update_client":
                      aa={a.get("key"):a.get("value") for a in ev.get("attributes") or []}
                      if aa.get("client_id")==client:attrs=aa;break
              if not attrs:return out
              hx=attrs.get("header")
              dh=None;err=None
              if hx:
                  try:dh=decode(hx)
                  except Exception as e:err=repr(e)
              out["item"]={"carrier_height":int(tx["height"]),"tx_hash":tx.get("hash"),
                           "consensus_height":attrs.get("consensus_height"),"header":dh,"decode_error":err}
              return out

          results=[];all_headers=[]
          for name,client,base in carriers:
              cr={"name":name,"client":client,"endpoint":base}
              first=page(base,client,1)
              cr["first"]=first
              if not first.get("ok") or not first.get("total_count") or not first.get("item") or not first["item"].get("header"):
                  cr["verdict"]="NO_USABLE_HISTORY";results.append(cr);continue
              total=first["total_count"];lo,hi=1,total;trace=[];blocked=False
              while lo<hi:
                  mid=(lo+hi)//2;x=page(base,client,mid)
                  h=(x.get("item") or {}).get("header")
                  trace.append({"page":mid,"ok":x.get("ok"),"status":x.get("status"),"error":x.get("error"),"header":h})
                  if not h or h.get("chain_id")!="secret-4":
                      blocked=True;cr["binary_error"]=trace[-1];break
                  if h["time_ns"]>=TT:hi=mid
                  else:lo=mid+1
              cr["binary_trace"]=trace
              if blocked:
                  cr["verdict"]="BINARY_BLOCKED";results.append(cr);continue
              pivot=lo;cr["pivot"]=pivot;neigh=[]
              for p in range(max(1,pivot-15),min(total,pivot+15)+1):
                  x=page(base,client,p)
                  item=x.get("item") or {};h=item.get("header")
                  if h and h.get("chain_id")=="secret-4":
                      rec={**h,"carrier_chain":name,"client_id":client,"carrier_height":item["carrier_height"],
                           "carrier_tx_hash":item["tx_hash"],"page":p,"endpoint":base}
                      neigh.append(rec);all_headers.append(rec)
              cr["neighborhood"]=neigh
              bef=[x for x in neigh if x["time_ns"]<TT];aft=[x for x in neigh if x["time_ns"]>=TT]
              cr["nearest_lo"]=max(bef,key=lambda x:x["time_ns"]) if bef else None
              cr["nearest_hi"]=min(aft,key=lambda x:x["time_ns"]) if aft else None
              cr["verdict"]="RECOVERED_NEIGHBORHOOD"
              results.append(cr)

          # Include Osmosis anchors.
          all_headers += [
            {"chain_id":"secret-4","height":11880917,"time":"2023-12-07T02:54:47.127200661Z","time_ns":1701917687127200661,"carrier_chain":"osmosis","source":"V38B"},
            {"chain_id":"secret-4","height":11880922,"time":"2023-12-07T02:55:33.936725313Z","time_ns":1701917733936725313,"carrier_chain":"osmosis","source":"V38B"}
          ]
          uniq={(x["height"],x["time"]):x for x in all_headers};hh=sorted(uniq.values(),key=lambda x:(x["time_ns"],x["height"]))
          bef=[x for x in hh if x["time_ns"]<TT];aft=[x for x in hh if x["time_ns"]>=TT]
          lo=max(bef,key=lambda x:x["time_ns"]) if bef else None;hi=min(aft,key=lambda x:x["time_ns"]) if aft else None
          exact=None
          if lo and hi and hi["height"]==lo["height"]+1:
              exact={"H_vote_end_block":hi["height"],"T0_first_new_param_mint_block":hi["height"]+1,
                     "H_minus_1":lo,"H":hi,"boundary_verified":True,
                     "proof_type":"adjacent signed secret-4 Tendermint headers preserved in IBC carrier tx history"}

          out={"scope":"SOURCE_ONLY_NO_MARKET_DATA","target_voting_end":TARGET,
               "historical_registry_ref":"cosmos/chain-registry@1e09e733c20edd5b6a76d42e2abdfc2f085382df",
               "tested_utc":datetime.datetime.now(datetime.timezone.utc).isoformat(),
               "carriers":results,"combined_headers":hh,
               "combined_nearest":{"lo":lo,"hi":hi} if lo and hi else None,
               "exact_candidate":exact}
          os.makedirs(os.path.dirname(OUT),exist_ok=True)
          with open(OUT,"w") as f:json.dump(out,f,indent=2)
          print("V42",json.dumps({"verdicts":{x["name"]:x["verdict"] for x in results},
                                 "nearest":out["combined_nearest"],
                                 "gap":(hi["height"]-lo["height"] if lo and hi else None),
                                 "exact":exact}))
          PY
      - name: Persist V42
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/cosmos_native_emission_param_shock_001_v0_2/SCRT287_IBC_SECONDARY_CARRIERS_V42.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "SCRT287: persist secondary IBC carrier recovery v42"
          git pull --rebase origin cosmos-native-emission-param-shock-001-v0.2-t0-remediation-2026-10-07
          git push origin HEAD:cosmos-native-emission-param-shock-001-v0.2-t0-remediation-2026-10-07
