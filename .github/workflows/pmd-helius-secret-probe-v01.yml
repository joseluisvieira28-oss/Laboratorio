name: PMD-001 Existing Helius Secret Probe V01

on:
  push:
    branches:
      - pumpfun-migration-direction-v0.1
    paths:
      - 'Dream-Account-OS-v2.3-PARTIAL/research/pumpfun_migration_direction_001/RUN_HELIUS_SECRET_PROBE_V01.trigger'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pumpfun-migration-direction-v0.1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --upgrade pip duckdb huggingface_hub requests solders pytz
      - name: Rebuild frozen manifest
        working-directory: Dream-Account-OS-v2.3-PARTIAL/research/pumpfun_migration_direction_001
        run: |
          python build_source_rebuild_manifest_v01.py \
            --data-dir pmd_source_rebuild_manifest_data \
            --out pmd_source_rebuild_manifest_v01.jsonl \
            --receipt pmd_source_rebuild_manifest_v01_receipt.json
          test ! -e pmd_source_rebuild_manifest_data/postgard_outcomes.parquet
      - name: Probe frozen earliest candidate using repository Helius secret if present
        id: probe
        continue-on-error: true
        env:
          HELIUS_API_KEY: ${{ secrets.HELIUS_API_KEY }}
        working-directory: Dream-Account-OS-v2.3-PARTIAL/research/pumpfun_migration_direction_001
        run: |
          python source_rebuild_block_first_v03.py \
            --manifest pmd_source_rebuild_manifest_v01.jsonl \
            --out-dir pmd_helius_existing_secret_probe_v01 \
            --start 0 --limit 1 --block-batch-size 4 --store-full-blocks
      - name: Classify without exposing credentials
        if: always()
        working-directory: Dream-Account-OS-v2.3-PARTIAL/research/pumpfun_migration_direction_001
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('pmd_helius_existing_secret_probe_v01/source_rebuild_summary.jsonl')
          if not p.exists():
              print(json.dumps({'lab':'PMD-001','stage':'HELIUS_EXISTING_SECRET_PROBE_V01','outcomes_opened':False,'verdict':'HELIUS_SECRET_UNAVAILABLE_OR_PROBE_TECHNICAL_FAILURE'},sort_keys=True))
          else:
              r=json.loads(p.read_text().splitlines()[0])
              verdict='HELIUS_ARCHIVAL_SOURCE_PROBE_PASS' if r.get('source_complete') and r.get('feature_source_eligible') else 'HELIUS_ARCHIVAL_SOURCE_PROBE_NOT_QUALIFIED'
              print(json.dumps({'lab':'PMD-001','stage':'HELIUS_EXISTING_SECRET_PROBE_V01','outcomes_opened':False,'verdict':verdict,'mint':r.get('mint'),'source_complete':r.get('source_complete'),'feature_source_eligible':r.get('feature_source_eligible'),'safe_in_window_signatures':r.get('safe_in_window_signatures'),'blocks_requested':r.get('blocks_requested'),'block_errors':r.get('block_errors')},sort_keys=True))
          PY
      - name: Upload non-secret source evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PMD-001-helius-existing-secret-probe-v01
          if-no-files-found: warn
          retention-days: 30
          path: |
            Dream-Account-OS-v2.3-PARTIAL/research/pumpfun_migration_direction_001/pmd_helius_existing_secret_probe_v01/source_rebuild_summary.jsonl
            Dream-Account-OS-v2.3-PARTIAL/research/pumpfun_migration_direction_001/pmd_helius_existing_secret_probe_v01/block_hash_ledger.jsonl
            Dream-Account-OS-v2.3-PARTIAL/research/pumpfun_migration_direction_001/pmd_helius_existing_secret_probe_v01/raw/*.jsonl
            Dream-Account-OS-v2.3-PARTIAL/research/pumpfun_migration_direction_001/pmd_helius_existing_secret_probe_v01/blocks/**/*.json.gz
