name: MEXC Event Futures Payout Endpoint V0.6.1

on:
  push:
    branches:
      - mexc-event-futures-payout-endpoint-v0.6.1-2026-10-02
    paths:
      - 'research/mexc_event_futures/**'
      - '.github/workflows/mexc-event-futures-payout-endpoint-v061.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  derive:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Derive public payout source
        run: python research/mexc_event_futures/payout_endpoint_probe_v061.py
      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: mexc-event-futures-payout-endpoint-v061-evidence
          path: artifacts/mexc_event_futures/payout_endpoint_probe_v061.json
          if-no-files-found: error
