name: CCLM-002 semantic mismatch diagnostic V0.1
on:
  push:
    branches: [crosschain-liquidity-migration-001-source-gate-v0.1]
    paths:
      - 'research/crosschain_liquidity_migration_001/CCLM_002_SEMANTIC_MISMATCH_DIAGNOSTIC_FREEZE_V0.1.md'
      - 'research/crosschain_liquidity_migration_001/cclm002_semantic_mismatch_diagnostic_v01.py'
      - '.github/workflows/cclm-002-semantic-mismatch-diagnostic-v01.yml'
permissions:
  contents: write
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {ref: crosschain-liquidity-migration-001-source-gate-v0.1}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python research/crosschain_liquidity_migration_001/cclm002_semantic_mismatch_diagnostic_v01.py
      - name: Persist
        run: |
          cp artifacts/cclm002_semantic_mismatch_diagnostic_v01.json research/crosschain_liquidity_migration_001/CCLM_002_SEMANTIC_MISMATCH_DIAGNOSTIC_RECEIPT.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/crosschain_liquidity_migration_001/CCLM_002_SEMANTIC_MISMATCH_DIAGNOSTIC_RECEIPT.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "CCLM-002: record semantic mismatch diagnostic [skip ci]"
          git push origin HEAD:crosschain-liquidity-migration-001-source-gate-v0.1
      - uses: actions/upload-artifact@v4
        with:
          name: cclm002-semantic-mismatch-diagnostic
          path: artifacts/cclm002_semantic_mismatch_diagnostic_v01.json
          if-no-files-found: error
