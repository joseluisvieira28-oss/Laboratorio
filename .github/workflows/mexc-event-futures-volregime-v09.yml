name: MEXC Event Futures Vol Regime V0.9

on:
  push:
    branches:
      - mexc-event-futures-volregime-v0.9-2026-10-02
    paths:
      - 'research/mexc_event_futures/**'
      - '.github/workflows/mexc-event-futures-volregime-v09.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  volregime-lab:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install --upgrade pip requests scipy pandas numpy
      - name: Syntax check
        run: python -m py_compile research/mexc_event_futures/volregime_v09.py
      - name: Run frozen V0.9 volatility-regime lab
        run: python research/mexc_event_futures/volregime_v09.py
      - name: Verify boundaries
        shell: bash
        run: |
          python - <<'PY'
          import json
          p='artifacts/mexc_event_futures/volregime_v09.json'
          j=json.load(open(p, encoding='utf-8'))
          assert j['historical_holdout_sep_2026']=='LOCKED_NOT_FETCHED'
          assert j['exact_event_futures']=='NOT_PROVEN'
          assert j['promotion_status']=='NO_EXACT_EVENT_FUTURES_PROMOTION'
          print('HOLDOUT_LOCK=PASS')
          print('EXACT_PRODUCT_FAIL_CLOSED=PASS')
          print('VERDICT='+j['verdict'])
          print('DISCOVERY_CELLS='+str(len(j['discovery_cells'])))
          print('BH_ELIGIBLE='+str(j['bh_eligible_count']))
          print('BH_SELECTED='+str(len(j['bh_selected'])))
          print('OOS_SURVIVORS='+str(len(j['oos_survivors'])))
          PY
      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: mexc-event-futures-volregime-v09-evidence
          path: |
            artifacts/mexc_event_futures/volregime_v09.json
            artifacts/mexc_event_futures/volregime_matrix_v09.csv
          if-no-files-found: error
