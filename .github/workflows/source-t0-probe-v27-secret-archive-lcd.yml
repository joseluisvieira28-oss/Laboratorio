name: source-t0-probe-v27-secret-archive-lcd

on:
  push:
    branches:
      - cosmos-native-emission-param-shock-001-v0.2-t0-remediation-2026-10-07
    paths:
      - .github/workflows/source-t0-probe-v27-secret-archive-lcd.yml

permissions:
  contents: read

jobs:
  secret-archive-lcd:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Probe Secret LCD/archive historical block metadata only
        shell: bash
        run: |
          python3 - <<'PY'
          import json,urllib.request,ssl,concurrent.futures
          from datetime import datetime
          TARGET="2023-12-07T02:54:58.930543213Z"
          TT=datetime.fromisoformat(TARGET.replace("Z","+00:00")).timestamp()
          UA={"User-Agent":"CryptoLab-source-only-secret-v27"}
          bases=[
            "https://lcd.archive.scrt.marionode.com",
            "https://lcd.mainnet.secretsaturn.net",
            "https://secretnetwork-api.lavenderfive.com:443",
            "https://rest-secret.01node.com",
            "https://public.stakewolle.com/cosmos/secretnetwork/rest",
            "https://secretnetwork-api.highstakes.ch:1317",
            "https://rpc.ankr.com/http/scrt_cosmos"
          ]
          paths=[
            "/cosmos/base/tendermint/v1beta1/blocks/{h}",
            "/blocks/{h}"
          ]
          anchor=11752974
          grid=[11752974,11800000,11830000,11860000,11890000,11920000]
          def get(u,to=10):
            try:
              q=urllib.request.Request(u,headers=UA)
              with urllib.request.urlopen(q,timeout=to,context=ssl._create_unverified_context()) as r:
                raw=r.read().decode("utf-8","replace")
                try:d=json.loads(raw)
                except:d=raw[:4000]
                return {"ok":True,"status":r.status,"data":d}
            except Exception as e:return {"ok":False,"error":repr(e)[:400]}
          def find(d):
            if not isinstance(d,dict): return None
            for root in [d,d.get("block") or {},d.get("sdk_block") or {}]:
              h=(root.get("header") or root).get("height") if isinstance(root,dict) else None
              t=(root.get("header") or root).get("time") if isinstance(root,dict) else None
              if h is not None and t:
                try:return int(h),str(t)
                except: pass
            return None
          def ts(s):
            try:return datetime.fromisoformat(s.replace("Z","+00:00")).timestamp()
            except:return None
          routes=[]
          for b in bases:
            for p in paths:
              r=get(b+p.format(h=anchor));z=find(r.get("data"))
              routes.append({"base":b,"path":p,"ok":bool(z and z[0]==anchor),"parsed":z,"status":r.get("status"),"error":r.get("error")})
          winners=[x for x in routes if x["ok"]]
          exact=[]
          for w in winners:
            b,p=w["base"],w["path"];pts=[]
            for h in grid:
              r=get(b+p.format(h=h));z=find(r.get("data"))
              if z and z[0]==h and ts(z[1]) is not None:pts.append((h,ts(z[1]),z[1]))
            br=None
            for a,c in zip(pts,pts[1:]):
              if a[1] < TT <= c[1]:br=(a,c);break
            rec={"base":b,"path":p,"grid":pts}
            if br:
              L,R=br[0][0],br[1][0];err=None
              while L<R:
                M=(L+R)//2;r=get(b+p.format(h=M));z=find(r.get("data"))
                if not z or z[0]!=M or ts(z[1]) is None:
                  err={"height":M,"status":r.get("status"),"error":r.get("error")};break
                if ts(z[1])>=TT:R=M
                else:L=M+1
              rec["binary_error"]=err
              if err is None:
                rec["H_vote_end_block"]=L;rec["neighbors"]=[]
                for h in range(L-2,L+3):
                  r=get(b+p.format(h=h));z=find(r.get("data"))
                  rec["neighbors"].append({"requested":h,"parsed":z,"status":r.get("status"),"error":r.get("error")})
            exact.append(rec)
          print("SECRET_V27_BEGIN")
          print(json.dumps({"scope":"SOURCE_ONLY_NO_MARKET_DATA","target":TARGET,"routes":routes,"exact":exact},indent=2,sort_keys=True)[:800000])
          print("SECRET_V27_END")
          PY
