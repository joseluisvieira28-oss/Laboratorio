name: CED1D Public Runtime Audit V0.1
on:
  push:
    branches: [ced1d-public-runtime-audit-v0.1-2026-10-05]
permissions: {contents: read}
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --disable-pip-version-check requests
      - name: Freeze check
        run: |
          test -f governance/CED1D_0031_PUBLIC_RUNTIME_AUDIT_V0.1_2026-10-05.md
          python -m py_compile crypto_edge_radar/ced1d_public_runtime_audit_v01.py
      - name: Query canonical public runtime
        run: python crypto_edge_radar/ced1d_public_runtime_audit_v01.py
      - uses: actions/upload-artifact@v4
        with:
          name: ced1d-public-runtime-audit-v01-${{ github.run_id }}
          path: artifacts/ced1d/public_runtime_audit_v01
          if-no-files-found: error
          retention-days: 90
