name: DLS Protected 2025 Economic Holdout V0.2 Dynamic Source

on:
  push:
    branches: [dls-field-enrichment-v01]
    paths:
      - labs/DEFI_LIQUIDATION_SHOCK_001/LAUNCH_PROTECTED_2025_ECONOMIC_HOLDOUT_V02.marker

permissions:
  actions: read
  contents: read

jobs:
  holdout:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Resolve immutable source run
        id: source
        shell: bash
        run: |
          run_id="$(grep '^SOURCE_RUN_ID=' labs/DEFI_LIQUIDATION_SHOCK_001/LAUNCH_PROTECTED_2025_ECONOMIC_HOLDOUT_V02.marker | cut -d= -f2)"
          test -n "$run_id"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"

      - name: Download recovered Protected-2025 source authority
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.source.outputs.run_id }}
          name: dls-protected-2025-source-authority-v03-hybrid
          path: protected_source

      - name: Fail closed before any market payload unless source authority PASS
        shell: python
        run: |
          import json
          from pathlib import Path
          hits=list(Path("protected_source").rglob("PROTECTED_2025_SOURCE_AUTHORITY_RECEIPT_V0.2.json"))
          assert len(hits)==1,hits
          r=json.loads(hits[0].read_text())
          assert r["classification"]=="PROTECTED_2025_SOURCE_AUTHORITY_PASS",r["classification"]
          assert r["partition_count"]==48,r.get("partition_count")
          assert r["error_count"]==0,r.get("errors")
          fw=r["firewall"]
          assert fw["prices_2025_opened"] is False
          assert fw["returns_2025_opened"] is False
          assert fw["pnl_2025_opened"] is False
          assert fw["prices_2026_opened"] is False
          assert fw["returns_2026_opened"] is False
          print("PASS: immutable 2025 source authority; market access may begin")

      - name: Verify frozen economic implementation
        shell: bash
        run: |
          test "$(git hash-object labs/DEFI_LIQUIDATION_SHOCK_001/source/run_protected_2025_economic_holdout_v0_1.py)" = "88b46b3dfa058c85d52f99cd62a14ee550a99e30"
          python -m py_compile labs/DEFI_LIQUIDATION_SHOCK_001/source/run_protected_2025_economic_holdout_v0_1.py

      - name: Execute frozen Protected-2025 economic holdout once
        env:
          PYTHONUNBUFFERED: "1"
        run: >-
          python labs/DEFI_LIQUIDATION_SHOCK_001/source/run_protected_2025_economic_holdout_v0_1.py
          --source-root protected_source
          --oos-lock labs/DEFI_LIQUIDATION_SHOCK_001/OOS_ADJUDICATION_LOCK_V0.1.json
          --direction-lock labs/DEFI_LIQUIDATION_SHOCK_001/DIRECTION_SOURCE_AUDIT_LOCK_V0.1.json
          --fee-authority labs/DEFI_LIQUIDATION_SHOCK_001/MEXC_API_FUTURES_FEE_AUTHORITY_RECEIPT_V0.1.json

      - name: Print frozen scientific verdict
        shell: python
        run: |
          import json
          from pathlib import Path
          r=json.loads(Path("labs/DEFI_LIQUIDATION_SHOCK_001/PROTECTED_2025_ECONOMIC_HOLDOUT_RECEIPT_V0.1.json").read_text())
          assert r["classification"] in {
            "SURVIVES_2025_ECONOMIC_HOLDOUT",
            "NO_EDGE_2025_ECONOMIC_HOLDOUT",
            "SOURCE_BLOCKED_2025_ECONOMIC_HOLDOUT"
          }
          print("SCIENTIFIC_VERDICT",r["classification"])

      - name: Upload immutable economic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dls-protected-2025-economic-holdout-v02
          path: |
            labs/DEFI_LIQUIDATION_SHOCK_001/PROTECTED_2025_ECONOMIC_HOLDOUT_ACQUISITION_RECEIPT_V0.1.json
            labs/DEFI_LIQUIDATION_SHOCK_001/PROTECTED_2025_ECONOMIC_HOLDOUT_RECEIPT_V0.1.json
            labs/DEFI_LIQUIDATION_SHOCK_001/PROTECTED_2025_ECONOMIC_HOLDOUT_TRADES_V0.1.ndjson
          if-no-files-found: warn
          retention-days: 90

      - name: Firewall
        if: always()
        run: |
          echo PROTECTED_2026_CLOSED_UNLESS_2025_SURVIVES
          echo NO_POST_OUTCOME_TUNING
          echo NO_TRADING_NO_ORDERS_NO_WALLETS_NO_EXCHANGE_MUTATION_NO_MAIN_MERGE
