name: Bybit TradFi Source Gate V0.1

on:
  push:
    branches:
      - bybit-tradfi-transfer-v0.1-source-gate-2026-10-05

permissions:
  contents: read

jobs:
  source-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependency
        run: python -m pip install --disable-pip-version-check requests
      - name: Freeze check
        run: |
          test "$GITHUB_REF_NAME" = "bybit-tradfi-transfer-v0.1-source-gate-2026-10-05"
          test -f research/bybit_tradfi/BYBIT_TRADFI_TRANSFER_SOURCE_MAP_V0.1.json
          test -f research/bybit_tradfi/BYBIT_TRADFI_TRANSFER_SOURCE_FREEZE_V0.1.md
          python -m py_compile research/bybit_tradfi/bybit_tradfi_source_v01.py
          echo BYBIT_TRADFI_PRE_OUTCOME_SOURCE_FREEZE_PASS
      - name: Run source gate
        run: python research/bybit_tradfi/bybit_tradfi_source_v01.py
      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: bybit-tradfi-source-v01-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/bybit_tradfi/source_v01
          if-no-files-found: error
          retention-days: 90
