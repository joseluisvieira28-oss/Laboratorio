name: NVIDIA Event10m Oct01-02 Canonical Required Bars Source V0.1a
on:
  push:
    branches:
      - research/nvda-event10m-oct01-02-frozen-replay-2026-10-29
    paths:
      - .github/workflows/nvda-event10m-oct01-02-canonical-source-v01a.yml
permissions:
  contents: read
jobs:
  source-only:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Confirm historical required-bar canonical source stability twice, no outcomes
        run: python research/mexc_event_direction_v01/nvda_oct01_02_canonical_source_v01a.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nvda-event10m-oct01-02-canonical-source-v01a
          path: artifacts/nvda_event10m_oct01_02/canonical_source_v01a.json
          if-no-files-found: warn
