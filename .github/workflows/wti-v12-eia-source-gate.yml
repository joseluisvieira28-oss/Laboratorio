name: WTI V12 EIA Source Gate

on:
  push:
    branches:
      - mexc-wti-event-shock-v1.2-source-gate-2026-10-04
    paths:
      - 'research/mexc_global_assets/MEXC_WTI_EIA_SOURCE_GATE_V1.2.md'
      - 'research/mexc_global_assets/mexc_wti_eia_source_probe_v12.py'
      - '.github/workflows/wti-v12-eia-source-gate.yml'

permissions:
  contents: read

jobs:
  source-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install requests
        run: python -m pip install --disable-pip-version-check requests
      - name: Source-only preflight
        run: |
          test "$GITHUB_REF_NAME" = "mexc-wti-event-shock-v1.2-source-gate-2026-10-04"
          python -m py_compile research/mexc_global_assets/mexc_wti_eia_source_probe_v12.py
          grep -q 'SOURCE-ONLY' research/mexc_global_assets/MEXC_WTI_EIA_SOURCE_GATE_V1.2.md
          grep -q 'OUTCOMES CLOSED' research/mexc_global_assets/MEXC_WTI_EIA_SOURCE_GATE_V1.2.md
      - name: Execute public MEXC EIA source gate
        run: python research/mexc_global_assets/mexc_wti_eia_source_probe_v12.py
      - name: Upload immutable source evidence
        uses: actions/upload-artifact@v4
        with:
          name: wti-v12-eia-source-gate-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/mexc_global_assets/wti_eia_source_gate_v12
          if-no-files-found: error
          retention-days: 90
