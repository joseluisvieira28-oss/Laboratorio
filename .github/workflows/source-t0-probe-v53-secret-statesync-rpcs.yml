name: source-t0-probe-v53-secret-statesync-rpcs
on:
  push:
    branches: [cosmos-native-emission-param-shock-001-v0.2-t0-remediation-2026-10-07]
    paths: [.github/workflows/source-t0-probe-v53-secret-statesync-rpcs.yml]
permissions: {contents: write}
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: {ref: cosmos-native-emission-param-shock-001-v0.2-t0-remediation-2026-10-07}
      - name: Probe state-sync RPC services for target blocks
        run: |
          python3 - <<'PY'
          import json,urllib.request,urllib.error,ssl,hashlib,os,datetime
          from concurrent.futures import ThreadPoolExecutor
          OUT="research/cosmos_native_emission_param_shock_001_v0_2/SCRT287_STATESYNC_RPCS_V53.json"
          bases=[
            "https://rpc.statesync.secretsaturn.net",
            "http://rpc.statesync.secretsaturn.net:26657",
            "https://rpc.lavenderfive.com/secretnetwork",
            "https://rpc.lavenderfive.com:443/secretnetwork",
          ]
          hs=[11238000,11880917,11880918,11880919,11880920,11880921,11880922,11880923]
          jobs=[]
          for b in bases:
            jobs.append((b+"/status",None,"status"))
            for h in hs:
              for kind,p in [
                ("block",f"/block?height={h}"),
                ("commit",f"/commit?height={h}"),
                ("blockchain",f"/blockchain?minHeight={h}&maxHeight={h}")]:
                jobs.append((b+p,h,kind))
          def one(j):
            u,want,kind=j
            try:
              q=urllib.request.Request(u,headers={"User-Agent":"CryptoLab-source-only-v53","Accept":"application/json"})
              with urllib.request.urlopen(q,timeout=7,context=ssl._create_unverified_context()) as r:
                bb=r.read(); parsed=[]
                try:
                  d=json.loads(bb)
                  def walk(x):
                    if isinstance(x,dict):
                      yield x
                      for v in x.values():yield from walk(v)
                    elif isinstance(x,list):
                      for v in x:yield from walk(v)
                  for x in walk(d):
                    if "height" in x and "time" in x:
                      try:h=int(x["height"])
                      except:continue
                      if str(x["time"]).startswith(("2023-","2026-")):
                        z={"height":h,"time":str(x["time"]),"hash":x.get("hash")}
                        if z not in parsed:parsed.append(z)
                except:pass
                return {"url":u,"wanted":want,"kind":kind,"ok":True,"status":r.status,
                        "sha256":hashlib.sha256(bb).hexdigest(),"parsed":parsed,
                        "body_excerpt":bb.decode("utf-8","replace")[:4000]}
            except urllib.error.HTTPError as e:
              try:b=e.read()
              except:b=b""
              return {"url":u,"wanted":want,"kind":kind,"ok":False,"status":e.code,"error":str(e),
                      "parsed":[],"body_excerpt":b.decode("utf-8","replace")[:2000]}
            except Exception as e:
              return {"url":u,"wanted":want,"kind":kind,"ok":False,"status":None,"error":repr(e),"parsed":[]}
          with ThreadPoolExecutor(max_workers=40) as ex:rows=list(ex.map(one,jobs))
          useful=[x for x in rows if x["parsed"] and (x["wanted"] is None or any(z["height"]==x["wanted"] for z in x["parsed"]))]
          out={"scope":"SOURCE_ONLY_NO_MARKET_DATA","tested_utc":datetime.datetime.now(datetime.timezone.utc).isoformat(),
               "source_provenance":"Secret Network state-sync docs; SecretSaturn SNAP_RPC and Lavender backup RPC",
               "rows":rows,"useful":useful}
          os.makedirs(os.path.dirname(OUT),exist_ok=True);open(OUT,"w").write(json.dumps(out,indent=2))
          print("V53",json.dumps({"useful":useful}))
          PY
      - name: Persist
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/cosmos_native_emission_param_shock_001_v0_2/SCRT287_STATESYNC_RPCS_V53.json
          git commit -m "SCRT287: persist state-sync RPC probe v53"
          git pull --rebase origin cosmos-native-emission-param-shock-001-v0.2-t0-remediation-2026-10-07
          git push origin HEAD:cosmos-native-emission-param-shock-001-v0.2-t0-remediation-2026-10-07
