name: source-t0-probe-v38-secret-snapshot-forensics

on:
  workflow_dispatch:
  push:
    branches:
      - cosmos-native-emission-param-shock-001-v0.2-t0-remediation-2026-10-07
    paths:
      - .github/workflows/source-t0-probe-v38-secret-snapshot-forensics.yml

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cosmos-native-emission-param-shock-001-v0.2-t0-remediation-2026-10-07

      - name: Snapshot/CDX/state-sync forensic recovery
        shell: bash
        run: |
          python3 - <<'PY'
          import json,urllib.request,urllib.error,urllib.parse,ssl,hashlib,os,datetime,re
          from concurrent.futures import ThreadPoolExecutor

          OUT="research/cosmos_native_emission_param_shock_001_v0_2/SCRT287_SNAPSHOT_FORENSICS_V38.json"
          UA={"User-Agent":"CryptoLab-source-only-secret-v38","Accept":"*/*"}

          def req(url,method="GET",headers=None,to=15):
              h=dict(UA);h.update(headers or {})
              try:
                  q=urllib.request.Request(url,headers=h,method=method)
                  with urllib.request.urlopen(q,timeout=to,context=ssl._create_unverified_context()) as r:
                      b=b"" if method=="HEAD" else r.read()
                      return {"ok":True,"status":getattr(r,"status",200),"url":r.geturl(),
                              "headers":dict(r.headers),
                              "sha256":hashlib.sha256(b).hexdigest() if b else None,
                              "body":b.decode("utf-8","replace")[:700000]}
              except urllib.error.HTTPError as e:
                  try:b=e.read()
                  except:b=b""
                  return {"ok":False,"status":e.code,"url":url,"headers":dict(e.headers or {}),
                          "error":str(e),"sha256":hashlib.sha256(b).hexdigest() if b else None,
                          "body":b.decode("utf-8","replace")[:100000]}
              except Exception as e:
                  return {"ok":False,"status":None,"url":url,"headers":{},"error":repr(e),"body":""}

          # 1) Inspect current snapshot storage behavior.
          snapshot_urls=[
            "https://snapshots.lavenderfive.com/snapshots/secretnetwork/",
            "https://snapshots.lavenderfive.com/snapshots/secretnetwork/latest.tar.lz4",
            "https://snapshots.lavenderfive.com/snapshots/secretnetwork/latest.tar.zst",
            "https://snapshots.lavenderfive.com/snapshots/secretnetwork/secretnetwork_18259769.tar.zst",
          ]
          storage=[]
          for u in snapshot_urls:
              for method in ["HEAD","GET"] if u.endswith("/") else ["HEAD"]:
                  r=req(u,method,to=12)
                  storage.append({"url":u,"method":method,"ok":r["ok"],"status":r.get("status"),
                                  "final_url":r.get("url"),"headers":r.get("headers"),"error":r.get("error"),
                                  "body_excerpt":r.get("body","")[:10000]})

          # 2) Wayback CDX wildcard for historical snapshot object names, broad 2023.
          cdx_patterns=[
            "snapshots.lavenderfive.com/snapshots/secretnetwork/*",
            "snapshots.lavenderfive.com/snapshots/secretnetwork/secretnetwork_*",
            "snapshots.lavenderfive.com/snapshots/secretnetwork/*.tar.lz4",
            "snapshots.lavenderfive.com/snapshots/secretnetwork/*.tar.zst",
          ]
          def cdx(pat):
              qs=urllib.parse.urlencode({"url":pat,"from":"20230101","to":"20240131","output":"json",
                                         "fl":"timestamp,original,statuscode,mimetype,digest,length",
                                         "filter":"statuscode:200","collapse":"urlkey","limit":"10000"})
              r=req("https://web.archive.org/cdx/search/cdx?"+qs,to=25)
              caps=[]
              if r["ok"]:
                  try:
                      d=json.loads(r["body"])
                      if isinstance(d,list) and len(d)>1:
                          hdr=d[0]; caps=[dict(zip(hdr,x)) for x in d[1:] if isinstance(x,list)]
                  except: pass
              return {"pattern":pat,"ok":r["ok"],"status":r.get("status"),"error":r.get("error"),
                      "sha256":r.get("sha256"),"captures":caps,"body_excerpt":r.get("body","")[:12000]}
          with ThreadPoolExecutor(max_workers=4) as ex:
              cdx_reports=list(ex.map(cdx,cdx_patterns))

          historical_names={}
          for rep in cdx_reports:
              for cap in rep["captures"]:
                  orig=cap.get("original","")
                  if "secretnetwork" in orig:
                      historical_names[orig]=cap

          # 3) Current SecretSaturn state-sync node is a distinct infrastructure surface.
          ss="https://rpc.statesync.secretsaturn.net:443"
          anchor_heights=[11238000,11752974,11800000,11840000,11850000,11860000,11880000,11900000]
          statesync=[]
          for h in anchor_heights:
              for route in [f"/block?height={h}",f"/commit?height={h}",f"/blockchain?minHeight={h}&maxHeight={h}"]:
                  r=req(ss+route,to=12)
                  statesync.append({"height":h,"route":route,"ok":r["ok"],"status":r.get("status"),
                                   "sha256":r.get("sha256"),"error":r.get("error"),
                                   "body_excerpt":r.get("body","")[:7000]})
          r=req(ss+"/status",to=12)
          statesync_status={"ok":r["ok"],"status":r.get("status"),"sha256":r.get("sha256"),
                            "error":r.get("error"),"body_excerpt":r.get("body","")[:10000]}

          # 4) If CDX reveals explicit numeric snapshot names, test whether those exact objects still exist now.
          old_objects=[]
          for orig,cap in list(historical_names.items())[:500]:
              nums=[int(x) for x in re.findall(r'(?<!\d)(1\d{7})(?!\d)',orig)]
              if not nums: continue
              u=orig if orig.startswith("http") else "https://"+orig
              rr=req(u,"HEAD",to=10)
              old_objects.append({"capture":cap,"url":u,"heights":nums,"ok":rr["ok"],"status":rr.get("status"),
                                  "final_url":rr.get("url"),"headers":rr.get("headers"),"error":rr.get("error")})

          out={
            "scope":"SOURCE_ONLY_NO_MARKET_DATA",
            "candidate":"SCRT Proposal 287",
            "target_voting_end":"2023-12-07T02:54:58.930543213Z",
            "tested_utc":datetime.datetime.now(datetime.timezone.utc).isoformat(),
            "storage_probe":storage,
            "cdx_reports":cdx_reports,
            "historical_snapshot_objects":list(historical_names.values()),
            "historical_object_head_checks":old_objects,
            "statesync_status":statesync_status,
            "statesync_historical_probes":statesync,
            "rule":"Snapshot/state-sync evidence is discovery only unless it yields immutable canonical block/header/event data. Approximate heights are never promoted."
          }
          os.makedirs(os.path.dirname(OUT),exist_ok=True)
          with open(OUT,"w") as f:json.dump(out,f,indent=2)
          print("V38",json.dumps({
              "historical_snapshot_object_count":len(historical_names),
              "old_objects_alive":[{"url":x["url"],"heights":x["heights"],"status":x["status"]} for x in old_objects if x["ok"]],
              "statesync_success":[{"h":x["height"],"route":x["route"],"status":x["status"]} for x in statesync if x["ok"]]
          }))
          PY

      - name: Persist
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/cosmos_native_emission_param_shock_001_v0_2/SCRT287_SNAPSHOT_FORENSICS_V38.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "SCRT287: persist snapshot forensics v38"
          git pull --rebase origin cosmos-native-emission-param-shock-001-v0.2-t0-remediation-2026-10-07
          git push origin HEAD:cosmos-native-emission-param-shock-001-v0.2-t0-remediation-2026-10-07
