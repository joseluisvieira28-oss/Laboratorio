name: BFIRS V0.1 Source Gate

on:
  push:
    branches:
      - binance-funding-interval-regime-shock-v0.1-source-2026-10-07
    paths:
      - research/binance_funding_interval_regime_shock/**
      - .github/workflows/bfirs_v01_source_gate.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4
      - run: python -m py_compile research/binance_funding_interval_regime_shock/source_gate_v01.py
      - run: python research/binance_funding_interval_regime_shock/source_gate_v01.py
      - uses: actions/upload-artifact@v4
        with:
          name: bfirs-v01-source-gate-receipt
          path: bfirs_v01_source_gate_report.json
          retention-days: 30
