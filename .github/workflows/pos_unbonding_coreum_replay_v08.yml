name: POS Unbonding Coreum Replay V0.8 Probe

on:
  push:
    branches:
      - pos-unbonding-v08-coreum-replay-2026-10-07
    paths:
      - "research/pos_unbonding_completion_001_v0_8_coreum_replay/**"
      - ".github/workflows/pos_unbonding_coreum_replay_v08.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deterministic-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      V08: research/pos_unbonding_completion_001_v0_8_coreum_replay
      V07: research/pos_unbonding_completion_001_v0_7_independent_replay
      GENESIS_SHA256: 5be3b3e0fee69842c4c73eb5f54eb64684420736473f0f5cef0ba6b81d44f253
      V1_COMMIT: 40759d9d8a37e998f6e01229311b2ce3ac19ff63
      V2_COMMIT: dc41e552ebf9dd7b1e42e4727679bbd74c19e5c6
      V3_COMMIT: 14454e7001e9f0d1d703e1dd6fbff4ac09a04cfe
      RELEASE_TAG: pos-unbonding-coreum-v08-data-000000001-001000000
    steps:
      - uses: actions/checkout@v4

      - name: Verify frozen genesis bytes
        shell: bash
        run: |
          set -euo pipefail
          printf '%s  %s\n' "$GENESIS_SHA256" "$V07/receipts/source_392071c0048a.raw" | sha256sum -c -

      - name: Acquire frozen sparse Source-A transport
        shell: bash
        run: |
          set -euo pipefail
          python3 "$V08/fetch_sparse_coreum.py" --out /tmp/coreum_sparse | tee /tmp/sparse_summary.stdout.json
          python3 - <<'PY'
          import json
          j=json.load(open('/tmp/coreum_sparse/summary.json'))
          expected={
            "5000000":"D8A6B584C70FE38CD7D160A7F5151974E595AD9E241700F80D45AF15F53B0FF9",
            "10000000":"227EE3C00731C6544D88478F9022100214767E0DF8779C66433BF5C0BB810F47",
            "15000000":"DE285C3282D4EAC0EA6AF0FDAB0EF3F45273D5BB96289A76EA501CEDB52B1516",
          }
          for h,want in expected.items():
              got=j["heights"][h]["hash"]
              assert got==want,(h,got,want)
              assert j["heights"][h]["chain_id"]=="coreum-mainnet-1"
          assert j["block_results_requested"] is False
          PY

      - name: Set Go 1.18 for Coreum v1
        uses: actions/setup-go@v5
        with:
          go-version: "1.18.10"
          cache: false

      - name: Checkout pinned Coreum v1 source
        shell: bash
        run: |
          set -euo pipefail
          git clone --quiet --filter=blob:none https://github.com/CoreumFoundation/coreum.git /tmp/coreum-v1
          git -C /tmp/coreum-v1 checkout --quiet --detach "$V1_COMMIT"
          test "$(git -C /tmp/coreum-v1 rev-parse HEAD)" = "$V1_COMMIT"

      - name: Verify v1 typed block and commit at H5M
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/coreum-v1/replayprobe
          cp "$V08/blockprobe_tendermint.go" /tmp/coreum-v1/replayprobe/main.go
          (
            cd /tmp/coreum-v1
            go run ./replayprobe               /tmp/coreum_sparse/block_5000000.json               /tmp/coreum_sparse/commit_5000000.json               /tmp/coreum_sparse/validators_5000000_merged.json               /tmp/coreum_sparse/validators_5000001_merged.json
          ) | tee /tmp/probe_v1_h5m.json

      - name: Execute exact v1 InitChain validator linkage
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/coreum-v1/replayprobe
          mkdir -p /tmp/coreum-v1/replayprobe
          cp "$V08/initchain_v1.go" /tmp/coreum-v1/replayprobe/main.go
          (
            cd /tmp/coreum-v1
            go run ./replayprobe               "$GITHUB_WORKSPACE/$V07/receipts/source_392071c0048a.raw"               /tmp/coreum_sparse/block_1.json
          ) | tee /tmp/initchain_v1.json

      - name: Execute Coreum v1 canonical block 1 and verify H2 AppHash
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/coreum-v1/replayprobe
          mkdir -p /tmp/coreum-v1/replayprobe
          cp "$V08/execute_block1_v1.go" /tmp/coreum-v1/replayprobe/main.go
          (
            cd /tmp/coreum-v1
            go run ./replayprobe               "$GITHUB_WORKSPACE/$V07/receipts/source_392071c0048a.raw"               /tmp/coreum_sparse/block_1.json               /tmp/coreum_sparse/block_2.json
          ) | tee /tmp/execute_block1_v1.json

      - name: Acquire contiguous Coreum v1 prefix H1-H513
        shell: bash
        run: |
          set -euo pipefail
          python3 "$V08/fetch_prefix_coreum.py" --out /tmp/coreum_prefix --end 512 | tee /tmp/prefix_summary.json

      - name: Execute native Tendermint BlockExecutor prefix H1-H512
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/coreum-v1/replayprobe
          mkdir -p /tmp/coreum-v1/replayprobe
          cp "$V08/native_prefix_v1.go" /tmp/coreum-v1/replayprobe/main.go
          (
            cd /tmp/coreum-v1
            go run ./replayprobe \
              "$GITHUB_WORKSPACE/$V07/receipts/source_392071c0048a.raw" \
              /tmp/coreum_prefix \
              512
          ) | tee /tmp/native_prefix_v1.json

      - name: Acquire bounded persistent-resume pilot H1-H2049
        shell: bash
        run: |
          set -euo pipefail
          python3 "$V08/fetch_range_coreum.py" --out /tmp/coreum_resume_range --start 1 --end 2048 --workers 16 | tee /tmp/resume_range_summary.json

      - name: Execute persistent Coreum v1 chunk H1-H1024
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/coreum-v1/replayprobe /tmp/coreum_resume_db /tmp/coreum_resume_home
          mkdir -p /tmp/coreum-v1/replayprobe
          cp "$V08/native_chunk_v1.go" /tmp/coreum-v1/replayprobe/main.go
          (
            cd /tmp/coreum-v1
            go run ./replayprobe \
              "$GITHUB_WORKSPACE/$V07/receipts/source_392071c0048a.raw" \
              /tmp/coreum_resume_range \
              /tmp/coreum_resume_db \
              /tmp/coreum_resume_home \
              1 \
              1024
          ) | tee /tmp/native_chunk1_v1.json

      - name: Resume persistent Coreum v1 chunk H1025-H2048
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/coreum-v1/replayprobe
          mkdir -p /tmp/coreum-v1/replayprobe
          cp "$V08/native_chunk_v1.go" /tmp/coreum-v1/replayprobe/main.go
          (
            cd /tmp/coreum-v1
            go run ./replayprobe \
              "$GITHUB_WORKSPACE/$V07/receipts/source_392071c0048a.raw" \
              /tmp/coreum_resume_range \
              /tmp/coreum_resume_db \
              /tmp/coreum_resume_home \
              1025 \
              2048
          ) | tee /tmp/native_chunk2_v1.json

      - name: Gate 10K attack on H2048 persistent-resume PASS
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          a=json.load(open('/tmp/native_chunk1_v1.json'))
          b=json.load(open('/tmp/native_chunk2_v1.json'))
          assert a["start_height"]==1 and a["end_height"]==1024
          assert b["start_height"]==1025 and b["end_height"]==2048
          assert a["all_app_hash_offsets_pass"] is True
          assert b["all_app_hash_offsets_pass"] is True
          assert a["resume_capable"] is True and b["resume_capable"] is True
          print("H2048_PERSISTENT_RESUME_PASS")
          PY

      - name: Verify prospective 10K and durable-storage freezes
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'H1 through H10,000' "$V08/V08_10K_REPLAY_BENCHMARK_FREEZE.md"
          grep -q 'GitHub Release assets' "$V08/V08_DURABLE_STORAGE_EXTENSION_FREEZE.md"

      - name: Acquire H1-H10001 with receipt-complete fetcher
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/coreum_10k_raw
          python3 "$V08/fetch_range_coreum_v3.py" \
            --out /tmp/coreum_10k_raw \
            --start 1 --end 10000 --workers 24 \
            | tee /tmp/fetch_10k.json

      - name: Replay 10K chunk A H1-H5000
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/coreum-v1/replayprobe /tmp/coreum_10k_db /tmp/coreum_10k_home
          mkdir -p /tmp/coreum-v1/replayprobe
          cp "$V08/native_chunk_v1.go" /tmp/coreum-v1/replayprobe/main.go
          (
            cd /tmp/coreum-v1
            go run ./replayprobe \
              "$GITHUB_WORKSPACE/$V07/receipts/source_392071c0048a.raw" \
              /tmp/coreum_10k_raw \
              /tmp/coreum_10k_db \
              /tmp/coreum_10k_home \
              1 \
              5000
          ) | tee /tmp/replay_1_5000.json

      - name: Replay 10K chunk B resume H5001-H10000
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/coreum-v1/replayprobe
          mkdir -p /tmp/coreum-v1/replayprobe
          cp "$V08/native_chunk_v1.go" /tmp/coreum-v1/replayprobe/main.go
          (
            cd /tmp/coreum-v1
            go run ./replayprobe \
              "$GITHUB_WORKSPACE/$V07/receipts/source_392071c0048a.raw" \
              /tmp/coreum_10k_raw \
              /tmp/coreum_10k_db \
              /tmp/coreum_10k_home \
              5001 \
              10000
          ) | tee /tmp/replay_5001_10000.json

      - name: Export and verified-prune 10K local ABCI results
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/coreum_10k_abci /tmp/coreum-v1/replayprobe
          mkdir -p /tmp/coreum_10k_abci /tmp/coreum-v1/replayprobe
          cp "$V08/export_prune_abci_v1.go" /tmp/coreum-v1/replayprobe/main.go
          (
            cd /tmp/coreum-v1
            go run ./replayprobe /tmp/coreum_10k_db /tmp/coreum_10k_abci 1 10000
          ) | tee /tmp/abci_export_prune.json

      - name: Package 10K raw and local ABCI evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 "$V08/package_raw_range_v1.py" \
            --range-dir /tmp/coreum_10k_raw \
            --out /tmp/raw_1_10000.tar.gz \
            | tee /tmp/raw_package.json
          python3 "$V08/package_abci_export_v1.py" \
            --export-dir /tmp/coreum_10k_abci \
            --manifest /tmp/coreum_10k_abci/abci_1_10000.manifest.json \
            --out /tmp/abci_1_10000.tar.gz \
            | tee /tmp/abci_package.json

      - name: Build 10K checkpoint manifest and package
        shell: bash
        run: |
          set -euo pipefail
          python3 "$V08/checkpoint_manifest_v1.py" \
            --db-dir /tmp/coreum_10k_db \
            --home-dir /tmp/coreum_10k_home \
            --chunk-receipt /tmp/replay_5001_10000.json \
            --out /tmp/checkpoint_10000.manifest.json \
            --source-commit "$V1_COMMIT" \
            --genesis-sha256 "$GENESIS_SHA256" \
            | tee /tmp/checkpoint_manifest_summary.json
          python3 "$V08/package_checkpoint_v1.py" \
            --db-dir /tmp/coreum_10k_db \
            --home-dir /tmp/coreum_10k_home \
            --checkpoint-manifest /tmp/checkpoint_10000.manifest.json \
            --out-prefix /tmp/checkpoint_10000 \
            | tee /tmp/checkpoint_package.json

      - name: Enforce durable package size ceiling
        shell: bash
        run: |
          set -euo pipefail
          ceiling=$((1900*1024*1024))
          for f in /tmp/raw_1_10000.tar.gz /tmp/abci_1_10000.tar.gz /tmp/checkpoint_10000.tar.gz; do
            size="$(stat -c %s "$f")"
            test "$size" -lt "$ceiling"
          done

      - name: Publish and remote-digest verify 10K evidence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash "$V08/publish_release_asset_v1.sh" "$RELEASE_TAG" \
            /tmp/raw_1_10000.tar.gz /tmp/raw_1_10000.tar.gz.receipt.json \
            | tee /tmp/remote_raw.json
          bash "$V08/publish_release_asset_v1.sh" "$RELEASE_TAG" \
            /tmp/abci_1_10000.tar.gz /tmp/abci_1_10000.tar.gz.receipt.json \
            | tee /tmp/remote_abci.json
          bash "$V08/publish_release_asset_v1.sh" "$RELEASE_TAG" \
            /tmp/checkpoint_10000.tar.gz /tmp/checkpoint_10000.receipt.json \
            | tee /tmp/remote_checkpoint.json

      - name: Build frozen 10K benchmark receipt
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,os,pathlib
          def load(p): return json.loads(pathlib.Path(p).read_text())
          def h(p):
              b=pathlib.Path(p).read_bytes()
              return {"path":p,"bytes":len(b),"sha256":hashlib.sha256(b).hexdigest()}
          out={
            "schema":"coreum-v08-10k-benchmark-receipt-v1",
            "github_sha":os.environ["GITHUB_SHA"],
            "freeze":"V08_10K_REPLAY_BENCHMARK_FREEZE.md",
            "source_commit":os.environ["V1_COMMIT"],
            "genesis_sha256":os.environ["GENESIS_SHA256"],
            "h2048_gate_pass":True,
            "fetch":load("/tmp/fetch_10k.json"),
            "chunk_a":load("/tmp/replay_1_5000.json"),
            "chunk_b":load("/tmp/replay_5001_10000.json"),
            "abci_export_prune":load("/tmp/abci_export_prune.json"),
            "remote_raw":load("/tmp/remote_raw.json"),
            "remote_abci":load("/tmp/remote_abci.json"),
            "remote_checkpoint":load("/tmp/remote_checkpoint.json"),
            "artifacts":[
              h("/tmp/raw_1_10000.tar.gz.receipt.json"),
              h("/tmp/abci_1_10000.tar.gz.receipt.json"),
              h("/tmp/checkpoint_10000.manifest.json"),
              h("/tmp/checkpoint_10000.receipt.json"),
            ],
            "block_results_consumed_from_rpc":False,
            "census_executed":False,
            "market_outcomes_opened":False,
          }
          assert out["chunk_a"]["all_app_hash_offsets_pass"] is True
          assert out["chunk_b"]["all_app_hash_offsets_pass"] is True
          assert out["chunk_b"]["start_height"]==5001 and out["chunk_b"]["end_height"]==10000
          assert out["abci_export_prune"]["pass"] is True
          assert all(out[k]["remote_digest_verification_pass"] for k in ("remote_raw","remote_abci","remote_checkpoint"))
          p=pathlib.Path(os.environ["V08"])/"V08_10K_BENCHMARK_RUN_RECEIPT.json"
          p.write_text(json.dumps(out,indent=2,sort_keys=True)+"\n")
          print(json.dumps(out,indent=2,sort_keys=True))
          PY

      - name: Set Go 1.18 for Coreum v2
        uses: actions/setup-go@v5
        with:
          go-version: "1.18.10"
          cache: false

      - name: Verify v2 typed block and commit at H10M
        shell: bash
        run: |
          set -euo pipefail
          git clone --quiet --filter=blob:none https://github.com/CoreumFoundation/coreum.git /tmp/coreum-v2
          git -C /tmp/coreum-v2 checkout --quiet --detach "$V2_COMMIT"
          test "$(git -C /tmp/coreum-v2 rev-parse HEAD)" = "$V2_COMMIT"
          mkdir -p /tmp/coreum-v2/replayprobe
          cp "$V08/blockprobe_tendermint.go" /tmp/coreum-v2/replayprobe/main.go
          (
            cd /tmp/coreum-v2
            go run ./replayprobe               /tmp/coreum_sparse/block_10000000.json               /tmp/coreum_sparse/commit_10000000.json               /tmp/coreum_sparse/validators_10000000_merged.json               /tmp/coreum_sparse/validators_10000001_merged.json
          ) | tee /tmp/probe_v2_h10m.json

      - name: Set Go 1.20 for Coreum v3
        uses: actions/setup-go@v5
        with:
          go-version: "1.20.14"
          cache: false

      - name: Verify v3 typed block and commit at H15M
        shell: bash
        run: |
          set -euo pipefail
          git clone --quiet --filter=blob:none https://github.com/CoreumFoundation/coreum.git /tmp/coreum-v3
          git -C /tmp/coreum-v3 checkout --quiet --detach "$V3_COMMIT"
          test "$(git -C /tmp/coreum-v3 rev-parse HEAD)" = "$V3_COMMIT"
          mkdir -p /tmp/coreum-v3/replayprobe
          cp "$V08/blockprobe_comet037.go" /tmp/coreum-v3/replayprobe/main.go
          (
            cd /tmp/coreum-v3
            go run ./replayprobe               /tmp/coreum_sparse/block_15000000.json               /tmp/coreum_sparse/commit_15000000.json               /tmp/coreum_sparse/validators_15000000_merged.json               /tmp/coreum_sparse/validators_15000001_merged.json
          ) | tee /tmp/probe_v3_h15m.json

      - name: Emit deterministic receipt to job log
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib,json,os,pathlib,platform
          paths=[
            "/tmp/coreum_sparse/manifest.json",
            "/tmp/probe_v1_h5m.json",
            "/tmp/initchain_v1.json",
            "/tmp/execute_block1_v1.json",
            "/tmp/coreum_prefix/manifest.json",
            "/tmp/native_prefix_v1.json",
            "/tmp/resume_range_summary.json",
            "/tmp/native_chunk1_v1.json",
            "/tmp/native_chunk2_v1.json",
            "/tmp/probe_v2_h10m.json",
            "/tmp/probe_v3_h15m.json",
          ]
          out={
            "freeze_commit":"d5071409be8dde758ef1089c55d8018c95ebaa75",
            "github_sha":os.getenv("GITHUB_SHA"),
            "runner_os":os.getenv("RUNNER_OS"),
            "runner_arch":os.getenv("RUNNER_ARCH"),
            "block_results_requested":False,
            "census_executed":False,
            "market_outcomes_opened":False,
            "files":[],
          }
          for s in paths:
              p=pathlib.Path(s)
              if p.exists():
                  b=p.read_bytes()
                  out["files"].append({"path":s,"sha256":hashlib.sha256(b).hexdigest(),"bytes":len(b)})
          print("BEGIN_V08_RECEIPT")
          print(json.dumps(out,indent=2,sort_keys=True))
          print("END_V08_RECEIPT")
          PY

      - name: Persist V0.8 replay receipt
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,os,pathlib
          targets=[
            ("/tmp/coreum_sparse/summary.json","sparse_summary"),
            ("/tmp/probe_v1_h5m.json","probe_v1_h5m"),
            ("/tmp/initchain_v1.json","initchain_v1"),
            ("/tmp/execute_block1_v1.json","execute_block1_v1"),
            ("/tmp/prefix_summary.json","prefix_summary"),
            ("/tmp/native_prefix_v1.json","native_prefix_v1"),
            ("/tmp/resume_range_summary.json","resume_range_summary"),
            ("/tmp/native_chunk1_v1.json","native_chunk1_v1"),
            ("/tmp/native_chunk2_v1.json","native_chunk2_v1"),
            ("research/pos_unbonding_completion_001_v0_8_coreum_replay/V08_10K_BENCHMARK_RUN_RECEIPT.json","benchmark_10k"),
            ("/tmp/probe_v2_h10m.json","probe_v2_h10m"),
            ("/tmp/probe_v3_h15m.json","probe_v3_h15m"),
          ]
          out={
            "freeze_commit":"d5071409be8dde758ef1089c55d8018c95ebaa75",
            "github_sha":os.getenv("GITHUB_SHA"),
            "runner_os":os.getenv("RUNNER_OS"),
            "runner_arch":os.getenv("RUNNER_ARCH"),
            "census_executed":False,
            "market_outcomes_opened":False,
            "block_results_requested":False,
            "artifacts":{},
          }
          for path,key in targets:
              p=pathlib.Path(path)
              if not p.exists():
                  out["artifacts"][key]={"present":False}
                  continue
              raw=p.read_bytes()
              ent={"present":True,"sha256":hashlib.sha256(raw).hexdigest(),"bytes":len(raw)}
              try: ent["json"]=json.loads(raw.decode())
              except Exception: pass
              out["artifacts"][key]=ent
          out["replay_prefix_pass"]=bool(
              out["artifacts"].get("native_prefix_v1",{}).get("present") and
              out["artifacts"].get("native_prefix_v1",{}).get("json",{}).get("all_app_hash_offsets_pass") is True
          )
          out["persistent_resume_pass"]=bool(
              out["artifacts"].get("native_chunk1_v1",{}).get("json",{}).get("all_app_hash_offsets_pass") is True and
              out["artifacts"].get("native_chunk2_v1",{}).get("json",{}).get("all_app_hash_offsets_pass") is True and
              out["artifacts"].get("native_chunk2_v1",{}).get("json",{}).get("start_height") == 1025 and
              out["artifacts"].get("native_chunk2_v1",{}).get("json",{}).get("end_height") == 2048
          )
          out["sparse_v1_v2_v3_typed_probes_present"]=all(
              out["artifacts"].get(k,{}).get("present") for k in ("probe_v1_h5m","probe_v2_h10m","probe_v3_h15m")
          )
          dest=pathlib.Path("research/pos_unbonding_completion_001_v0_8_coreum_replay/V08_REPLAY_RUN_RECEIPT.json")
          dest.write_text(json.dumps(out,indent=2,sort_keys=True)+"\n")
          print(json.dumps(out,indent=2,sort_keys=True))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/pos_unbonding_completion_001_v0_8_coreum_replay/V08_REPLAY_RUN_RECEIPT.json
          if test -f research/pos_unbonding_completion_001_v0_8_coreum_replay/V08_10K_BENCHMARK_RUN_RECEIPT.json; then
            git add research/pos_unbonding_completion_001_v0_8_coreum_replay/V08_10K_BENCHMARK_RUN_RECEIPT.json
          fi
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record V0.8 Coreum replay probe receipt [skip ci]"
          git pull --rebase origin pos-unbonding-v08-coreum-replay-2026-10-07
          git push origin HEAD:pos-unbonding-v08-coreum-replay-2026-10-07
