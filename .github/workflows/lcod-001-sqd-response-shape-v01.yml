name: LCOD-001 SQD long-range response shape V0.1
on:
  push:
    branches: [liquidation-convexity-oracle-distance-001-source-gate-v0.1]
    paths:
      - 'research/liquidation_convexity_oracle_distance_001/lcod_sqd_response_shape_v01.py'
      - '.github/workflows/lcod-001-sqd-response-shape-v01.yml'
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {ref: liquidation-convexity-oracle-distance-001-source-gate-v0.1}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python research/liquidation_convexity_oracle_distance_001/lcod_sqd_response_shape_v01.py
      - name: Persist
        run: |
          cp artifacts/lcod_sqd_response_shape_v01.json research/liquidation_convexity_oracle_distance_001/LCOD_SQD_RESPONSE_SHAPE_RECEIPT.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/liquidation_convexity_oracle_distance_001/LCOD_SQD_RESPONSE_SHAPE_RECEIPT.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "LCOD-001: record SQD long-range response shape [skip ci]"
          git push origin HEAD:liquidation-convexity-oracle-distance-001-source-gate-v0.1
      - uses: actions/upload-artifact@v4
        with:
          name: lcod-sqd-response-shape-v01
          path: artifacts/lcod_sqd_response_shape_v01.json
