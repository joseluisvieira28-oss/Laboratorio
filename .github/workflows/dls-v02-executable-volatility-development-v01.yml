name: DLS V0.2 Executable Volatility Development V0.1

on:
  push:
    branches:
      - dls-v02-executable-volatility-v01
    paths:
      - labs/DEFI_LIQUIDATION_SHOCK_001/LAUNCH_V02_EXEC_VOL_DEV_V01.marker

permissions:
  actions: read
  contents: read

jobs:
  development:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download V0.2 execution source PASS
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 36487730407
          name: dls-v02-execution-source-v01
          path: source_gate
      - name: Download canonical V0.1 source cluster census
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 36465385517
          name: dls-source-cluster-sample-gate-v01
          path: sample_gate
      - name: Compile frozen development executor
        run: python -m py_compile labs/DEFI_LIQUIDATION_SHOCK_001/source/run_v02_executable_volatility_dev_v0_1.py
      - name: Execute V0.2 development 2021-2024 only
        run: >
          python labs/DEFI_LIQUIDATION_SHOCK_001/source/run_v02_executable_volatility_dev_v0_1.py
          --source-gate source_gate
          --sample-gate sample_gate
          --workers 16
      - name: Upload immutable V0.2 development receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dls-v02-executable-volatility-development-v01
          path: |
            labs/DEFI_LIQUIDATION_SHOCK_001/V02_DEVELOPMENT_MARKET_DATA_ACQUISITION_RECEIPT_V0.1.json
            labs/DEFI_LIQUIDATION_SHOCK_001/V02_DEVELOPMENT_ARCHIVE_MANIFEST_V0.1.ndjson
            labs/DEFI_LIQUIDATION_SHOCK_001/V02_EXECUTABLE_VOLATILITY_GRID_V0.1.json
            labs/DEFI_LIQUIDATION_SHOCK_001/V02_EXECUTABLE_VOLATILITY_SELECTION_RECEIPT_V0.1.json
          if-no-files-found: warn
          retention-days: 90
      - name: Firewall
        if: always()
        run: echo DEVELOPMENT_2021_2024_ONLY_2025_2026_CLOSED_NO_TRADING
