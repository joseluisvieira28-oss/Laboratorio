name: source-t0-probe-v34-secret-mintscan-sveltekit

on:
  workflow_dispatch:
  push:
    branches:
      - cosmos-native-emission-param-shock-001-v0.2-t0-remediation-2026-10-07
    paths:
      - .github/workflows/source-t0-probe-v34-secret-mintscan-sveltekit.yml

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cosmos-native-emission-param-shock-001-v0.2-t0-remediation-2026-10-07
      - name: Reverse engineer current Mintscan SvelteKit metadata routes
        shell: bash
        run: |
          python3 - <<'PY'
          import json,re,urllib.request,urllib.error,urllib.parse,ssl,hashlib,os,datetime
          from concurrent.futures import ThreadPoolExecutor

          OUT="research/cosmos_native_emission_param_shock_001_v0_2/SCRT287_MINTSCAN_SVELTEKIT_V34.json"
          UA={"User-Agent":"Mozilla/5.0 CryptoLab-source-only-secret-v34","Accept":"*/*"}
          BASE="https://www.mintscan.io"

          def get(u,to=18):
            try:
              q=urllib.request.Request(u,headers=UA)
              with urllib.request.urlopen(q,timeout=to,context=ssl._create_unverified_context()) as r:
                b=r.read()
                return {"ok":True,"status":getattr(r,"status",200),"url":r.geturl(),
                        "content_type":r.headers.get("content-type",""),
                        "sha256":hashlib.sha256(b).hexdigest(),"body":b.decode("utf-8","replace")[:1200000]}
            except urllib.error.HTTPError as e:
              try:b=e.read()
              except Exception:b=b""
              return {"ok":False,"status":e.code,"url":u,"error":str(e),
                      "sha256":hashlib.sha256(b).hexdigest() if b else None,
                      "body":b.decode("utf-8","replace")[:120000]}
            except Exception as e:return {"ok":False,"status":None,"url":u,"error":repr(e),"body":""}

          pages=[
            "/secret",
            "/secret/proposals/287",
            "/secret/proposal/287",
            "/secret/governance/proposals/287",
            "/secret/block/11850000",
          ]
          page_rows=[]
          refs=set()
          for p in pages:
            for suffix in ["","/__data.json"]:
              r=get(BASE+p+suffix)
              b=r.get("body","")
              ss=re.findall(r'(?:src|href)=["\']([^"\']+_app/immutable[^"\']+)["\']',b,re.I)
              for s in ss: refs.add(urllib.parse.urljoin(BASE+p,s))
              page_rows.append({"path":p+suffix,"ok":r["ok"],"status":r.get("status"),
                "url":r.get("url"),"content_type":r.get("content_type"),"sha256":r.get("sha256"),
                "error":r.get("error"),"body_excerpt":b[:25000]})

          # Also recover modulepreload refs from root HTML.
          for row in page_rows:
            b=row["body_excerpt"]
            for s in re.findall(r'(?:src|href)=["\']([^"\']+_app/immutable[^"\']+)["\']',b,re.I):
              refs.add(urllib.parse.urljoin(BASE,s))
          refs=list(refs)[:120]

          bundles=[]
          api_urls=set()
          route_literals=set()
          for u in refs:
            r=get(u,20); b=r.get("body","")
            urls=re.findall(r'https?://[^"\'<>\\ ]+',b)
            for x in urls:
              if any(k in x.lower() for k in ["mintscan","cosmostation","api"]): api_urls.add(x)
            for m in re.finditer(r'["\']([^"\']{1,300})["\']',b):
              s=m.group(1)
              sl=s.lower()
              if ("block" in sl or "proposal" in sl or "gov" in sl) and "/" in s:
                route_literals.add(s)
            ctx=[]
            for needle in ["apis.mintscan.io","api.mintscan.io","block/","blocks/","proposal","governance","__data.json"]:
              pos=0
              while len(ctx)<120:
                pos=b.lower().find(needle.lower(),pos)
                if pos<0:break
                ctx.append({"needle":needle,"excerpt":b[max(0,pos-500):pos+1600]})
                pos+=len(needle)
            bundles.append({"url":u,"ok":r["ok"],"status":r.get("status"),
                            "sha256":r.get("sha256"),"contexts":ctx[:120],"error":r.get("error")})

          # Explicitly test only metadata-like public routes inferred from current docs/site.
          hosts=["https://apis.mintscan.io","https://api.mintscan.io"]
          anchor=11850000
          candidates=[
            "/v1/secret/block/"+str(anchor),
            "/v1/secret/blocks/"+str(anchor),
            "/v1/secret/proposals/287",
            "/v1/secret/proposal/287",
            "/v1/secret/gov/proposals/287",
            "/v1/secret/governance/proposals/287",
            "/v1/secret/blockchain?minHeight="+str(anchor)+"&maxHeight="+str(anchor),
          ]
          probes=[]
          for h in hosts:
            for p in candidates:
              r=get(h+p,15)
              probes.append({"url":h+p,"ok":r["ok"],"status":r.get("status"),
                             "content_type":r.get("content_type"),"sha256":r.get("sha256"),
                             "error":r.get("error"),"body_excerpt":r.get("body","")[:8000]})

          out={"scope":"SOURCE_ONLY_NO_MARKET_DATA","candidate":"SCRT Proposal 287",
               "tested_utc":datetime.datetime.now(datetime.timezone.utc).isoformat(),
               "page_rows":page_rows,"bundle_refs":refs,"bundles":bundles,
               "discovered_api_urls":sorted(api_urls)[:500],
               "route_literals":sorted(route_literals)[:1200],
               "metadata_probes":probes}
          os.makedirs(os.path.dirname(OUT),exist_ok=True)
          with open(OUT,"w") as f:json.dump(out,f,indent=2)
          print("SCRT287_V34_RESULT",json.dumps({
            "pages_ok":[x["path"] for x in page_rows if x["ok"]],
            "bundle_count":len(bundles),
            "api_urls":sorted(api_urls)[:30],
            "non404":[{"url":x["url"],"status":x["status"]} for x in probes if x.get("status") not in (None,404)]
          }))
          PY
      - name: Persist V34 receipt
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/cosmos_native_emission_param_shock_001_v0_2/SCRT287_MINTSCAN_SVELTEKIT_V34.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "SCRT287: persist Mintscan SvelteKit metadata probe v34"
          git push origin HEAD:cosmos-native-emission-param-shock-001-v0.2-t0-remediation-2026-10-07
