name: NVIDIA Event10m V0.7 Strict Custody Synthetic CI
on:
  push:
    branches:
      - research/nvda-event10m-paper-custody-v07-2026-10-29
    paths:
      - .github/workflows/nvda-event10m-custody-synthetic-v07.yml
permissions:
  contents: read
jobs:
  offline-guard-only:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Install public WS import dependency (no network test)
        run: python -m pip install --disable-pip-version-check websockets==15.0.1
      - name: 8 synthetic custody tests (NEVER read historical/forward market outcomes)
        run: python -m unittest discover -s research/mexc_event_direction_v01 -p 'test_nvda_event10m_custody_v07.py' -v
