name: MEXC Event Futures Exact Source V0.6

on:
  push:
    branches:
      - mexc-event-futures-exact-source-v0.6-2026-10-02
    paths:
      - 'research/mexc_event_futures/**'
      - '.github/workflows/mexc-event-futures-exact-source-v06.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-source:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install
        run: python -m pip install --upgrade pip requests

      - name: Syntax check
        run: python -m py_compile research/mexc_event_futures/exact_source_discovery_v06.py

      - name: Run bounded public source discovery
        run: python research/mexc_event_futures/exact_source_discovery_v06.py

      - name: Verify no-auth boundary
        shell: bash
        run: |
          python - <<'PY'
          import json
          p='artifacts/mexc_event_futures/exact_source_discovery_v06.json'
          j=json.load(open(p, encoding='utf-8'))
          assert j['authenticated_requests']==0
          assert j['orders']==0
          assert j['account_mutations']==0
          print('NO_AUTH=PASS')
          print('NO_ORDERS=PASS')
          print('NO_MUTATION=PASS')
          print('VERDICT='+j['verdict'])
          print('MATCHES='+str(len(j['matches'])))
          print('CANDIDATES='+str(len(j['candidate_strings'])))
          print('PROBES='+str(len(j['public_get_probes'])))
          print('EXACT_HITS='+str(len(j['exact_public_route_hits'])))
          PY

      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: mexc-event-futures-exact-source-v06-evidence
          path: artifacts/mexc_event_futures/exact_source_discovery_v06.json
          if-no-files-found: error
