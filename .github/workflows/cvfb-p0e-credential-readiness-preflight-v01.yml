name: cvfb-p0e-credential-readiness-preflight-v01

on:
  push:
    branches:
      - cross-venue-funding-basis-provenance-v0.5
    paths:
      - 'research/cross_venue_funding_basis/CVFB_P0E_CREDENTIAL_READINESS_TRIGGER_V0_1.txt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  zero-s3-credential-readiness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify immutable P0E authorization remains source-only
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('research/cross_venue_funding_basis/CVFB_NATIVE_ORACLE_PROVENANCE_P0E_REQUESTER_PAYS_AUTHORIZATION_V0.1.json')
          x=json.loads(p.read_text(encoding='utf-8'))
          assert x['status']=='AUTHORIZED_BEFORE_FIRST_REQUESTER_PAYS_S3_REQUEST'
          assert x['economic_outcomes_authorized'] is False
          assert x['primary_replication_reopened'] is False
          assert x['2026_authorized'] is False
          assert x['live_trading_authorized'] is False
          print('P0E_AUTHORIZATION_FILE_SOURCE_ONLY_GUARD_PASS')
          PY

      - name: Check dedicated credential presence only
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.CVFB_P0E_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CVFB_P0E_AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ secrets.CVFB_P0E_AWS_SESSION_TOKEN }}
        run: |
          python - <<'PY'
          import json, os
          key=bool(os.environ.get('AWS_ACCESS_KEY_ID'))
          secret=bool(os.environ.get('AWS_SECRET_ACCESS_KEY'))
          session=bool(os.environ.get('AWS_SESSION_TOKEN'))
          status='CREDENTIAL_PRESENCE_READY_FOR_MANUAL_P0E_DISPATCH' if (key and secret) else 'CREDENTIALS_ABSENT_OR_INCOMPLETE'
          print(json.dumps({
            'status':status,
            'access_key_present':key,
            'secret_key_present':secret,
            'session_token_present':session,
            'aws_request_made':False,
            'requester_pays_charge_incurred':False,
            'historical_object_bytes_opened':False,
            'economic_outcomes_opened':False,
            'live_trading_authorized':False
          },sort_keys=True))
          PY
