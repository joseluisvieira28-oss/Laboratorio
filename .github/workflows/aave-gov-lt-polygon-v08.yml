name: Aave Gov LT Polygon Source V08
on:
  push:
    branches: [aave-gov-lt-forced-deleveraging-v0.1]
    paths:
      - '.github/workflows/aave-gov-lt-polygon-v08.yml'\n      - 'research/aave_gov_lt_forced_deleveraging/polygon_configurator_census_v08.py'
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pycryptodome==3.23.0
      - run: python research/aave_gov_lt_forced_deleveraging/polygon_configurator_census_v08.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aave-gov-lt-polygon-v08
          path: out/aave_polygon_v08
          retention-days: 30
