name: CARRY-001 Research Funding Basis (no-trades)
on:
  pull_request:
    paths:
      - "research/carry001/**"
      - ".github/workflows/carry-001-funding.yml"
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Probe official public data sources
        run: python research/carry001/probe.py
      - name: Verify historic price sources
        run: python research/carry001/price_probe.py
      - name: Reuse independently hashed RAW public source from first attempt
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 44120443119 --repo "$GITHUB_REPOSITORY" --name carry001-evidence-44120443119 --dir carry001-evidence
      - name: Retrieve full settlement history Sep 2024 - Oct 2026
        run: python research/carry001/collector.py
      - name: Retrieve separate price CANDLES for indicative basis
        continue-on-error: true
        run: python research/carry001/price_collector.py
      - name: Historical previous-week strategy and real-cost stress
        run: python research/carry001/study.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: carry001-evidence-${{ github.run_id }}
          path: carry001-evidence/
          if-no-files-found: warn
          retention-days: 90
