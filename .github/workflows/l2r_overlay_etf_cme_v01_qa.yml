name: L2R Overlay ETF-CME V0.1 QA

on:
  push:
    branches:
      - l2r-overlay-etf-cme-v0.1
    paths:
      - research/l2_resiliency_overlay/QA_TRIGGER_V0_1.txt
  pull_request:
    branches:
      - l2-resiliency-exec-translation-v0.1
    paths:
      - research/l2_resiliency_overlay/**
      - .github/workflows/l2r_overlay_etf_cme_v01_qa.yml

permissions:
  actions: read
  contents: write
  actions: read

jobs:
  qa:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: l2r-overlay-etf-cme-v0.1
          fetch-depth: 0
      - name: Compile and synthetic self-test
        run: |
          set -euo pipefail
          RUNNER="research/l2_resiliency_overlay/l2r_overlay_etf_cme_2025_development_v01.py"
          python -m py_compile "$RUNNER"
          python "$RUNNER" --self-test | tee /tmp/selftest.txt
          grep -Fx "SELF_TEST_PASS" /tmp/selftest.txt
          sha256sum "$RUNNER" | tee /tmp/runner.sha
      - name: Persist immutable QA receipt
        run: |
          set -euo pipefail
          RUNNER="research/l2_resiliency_overlay/l2r_overlay_etf_cme_2025_development_v01.py"
          SHA="$(sha256sum "$RUNNER" | awk '{print $1}')"
          python - <<PY
          import json
          from pathlib import Path
          out={
            "lab_id":"L2R-OVERLAY-ETF-CME-001",
            "implementation_version":"0.1",
            "classification":"IMPLEMENTATION_QA_PASS",
            "runner_sha256":"${SHA}",
            "py_compile":"PASS",
            "synthetic_self_test":"PASS",
            "market_data_accessed":False,
            "year_2026_accessed":False,
            "orders":False,
            "exchange_mutation":False,
            "live_trading":False
          }
          Path("research/l2_resiliency_overlay/L2R_OVERLAY_ETF_CME_001_IMPLEMENTATION_QA_V0_1.json").write_text(json.dumps(out,indent=2,sort_keys=True)+"\n")
          PY
          git config user.name "crypto-lab-qa"
          git config user.email "actions@users.noreply.github.com"
          git add research/l2_resiliency_overlay/L2R_OVERLAY_ETF_CME_001_IMPLEMENTATION_QA_V0_1.json
          if git diff --cached --quiet; then
            echo "QA receipt already canonical; no commit needed."
          else
            git commit -m "L2R overlay: persist implementation QA receipt"
            git push origin HEAD:l2r-overlay-etf-cme-v0.1
          fi

  package:
    needs: qa
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: l2r-overlay-etf-cme-v0.1
      - name: Fetch exact immutable ETF parent artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -fL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/joseluisvieira28-oss/Laboratorio/actions/artifacts/10335473231/zip" \
            -o ETF_CME_INSTFLOW_001_OOS_2025.zip
          echo "40bd341c300532e5b67127a098c82ecf2f41e1cc4a3ce646ac824b27529f9bd1  ETF_CME_INSTFLOW_001_OOS_2025.zip" | sha256sum -c -
      - name: Verify frozen runner and assemble package
        run: |
          set -euo pipefail
          RUNNER="research/l2_resiliency_overlay/l2r_overlay_etf_cme_2025_development_v01.py"
          echo "495129040193b01218d867bd8a29f50039e5229203d118571f38445746942b2a  $RUNNER" | sha256sum -c -
          mkdir -p package
          cp ETF_CME_INSTFLOW_001_OOS_2025.zip package/
          cp "$RUNNER" package/
          cp research/l2_resiliency_overlay/RUN_L2R_OVERLAY_ETF_CME_V01.ps1 package/
          cp research/l2_resiliency_overlay/RUN_L2R_OVERLAY_ETF_CME_V01.cmd package/
          cp research/l2_resiliency_overlay/L2R_OVERLAY_ETF_CME_V01_README.txt package/
          cp research/l2_resiliency_overlay/L2R_OVERLAY_ETF_CME_001_2025_DEVELOPMENT_PROTOCOL_V0_1.md package/
          cp research/l2_resiliency_overlay/L2R_OVERLAY_ETF_CME_001_IMPLEMENTATION_LOCK_V0_1.json package/
          cp research/l2_resiliency_overlay/L2R_OVERLAY_ETF_CME_001_2025_DEVELOPMENT_ONE_SHOT_AUTHORIZATION_V0_1.md package/
          sha256sum package/* | sort > package/PACKAGE_MANIFEST_SHA256.txt
      - name: Upload canonical one-shot package
        uses: actions/upload-artifact@v4
        with:
          name: l2r-overlay-etf-cme-v01-one-shot-package-${{ github.run_id }}
          path: package/
          retention-days: 30
          compression-level: 6
          if-no-files-found: error

  source_identity_probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: etf-cme-instflow-001-oos-2025-34815006815-1
          run-id: 34815006815
          github-token: ${{ github.token }}
          path: parent_artifact
      - name: Hash immutable parent files
        run: |
          set -euo pipefail
          find parent_artifact -maxdepth 2 -type f -print -exec sha256sum {} \;
