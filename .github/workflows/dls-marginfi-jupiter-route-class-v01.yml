name: DLS Marginfi Jupiter Route Class Membership V0.1
on:
  push:
    branches: [dls-signed-flow-authority-v01]
    paths:
      - labs/DEFI_LIQUIDATION_SHOCK_001/LAUNCH_MARGINFI_JUPITER_ROUTE_CLASS_V01.marker
permissions:
  actions: read
  contents: read
jobs:
  census:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
        with: {ref: "${{ github.sha }}"}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Download independent Jan-2024 Marginfi population
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 36263998920
          name: dls-field-enrichment-ms-marginfi-202401
          path: event_source
      - name: Compile
        run: python -m py_compile labs/DEFI_LIQUIDATION_SHOCK_001/source/census_marginfi_jupiter_route_class_v0_1.py
      - name: Execute source-only class membership census
        run: python labs/DEFI_LIQUIDATION_SHOCK_001/source/census_marginfi_jupiter_route_class_v0_1.py
      - name: Upload immutable class receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dls-marginfi-jupiter-route-class-v01
          path: |
            labs/DEFI_LIQUIDATION_SHOCK_001/MARGINFI_JUPITER_ROUTE_CLASS_MEMBERSHIP_RECEIPT_V0.1.json
            labs/DEFI_LIQUIDATION_SHOCK_001/MARGINFI_JUPITER_ROUTE_CLASS_MEMBERS_V0.1.ndjson
          if-no-files-found: warn
          retention-days: 90
      - name: Firewall
        if: always()
        run: echo SOURCE_ONLY_NO_TOKEN_AMOUNTS_NO_PRICES_2025_2026_CLOSED
