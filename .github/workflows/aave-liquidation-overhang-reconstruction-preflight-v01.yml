name: AAVE Liquidation Overhang 001 — Reconstruction R0 V0.1

on:
  push:
    branches:
      - aave-liquidation-overhang-v0.1
    paths:
      - research/aave_liquidation_overhang/reconstruction_preflight.py
      - .github/workflows/aave-liquidation-overhang-reconstruction-preflight-v01.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reconstruction-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout frozen research branch
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install --disable-pip-version-check requests 'eth-hash[pycryptodome]'
      - name: Execute source reconstruction R0 preflight
        run: python research/aave_liquidation_overhang/reconstruction_preflight.py
      - name: Upload reconstruction preflight receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AAVE_LIQUIDATION_OVERHANG_001_RECONSTRUCTION_PREFLIGHT_V0_1
          path: reconstruction_output/AAVE_LIQUIDATION_OVERHANG_001_RECONSTRUCTION_PREFLIGHT_RECEIPT_V0_1.json
          if-no-files-found: warn
          retention-days: 30
