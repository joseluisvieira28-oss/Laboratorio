name: News Shock Lab V0.3A Consensus Combined V0.6

# Tranche 06: systematic 2023 provenance-only expansion to 23/44 COMPLETE_A; no market outcomes authorized
on:
  push:
    branches:
      - dream-account-phase-b-signal-research-v0.1
    paths:
      - 'Dream-Account-OS-v2.3-PARTIAL/research/NEWS_SHOCK_LAB_V03A_CONSENSUS_SEED_TRANCHE06_FREEZE_V0.1.json'
      - 'Dream-Account-OS-v2.3-PARTIAL/research/NEWS_SHOCK_LAB_V03A_CONSENSUS_SEED_TRANCHE06_V0.1.json'
      - 'Dream-Account-OS-v2.3-PARTIAL/research/news_shock_lab_v03a_consensus_combined_v06.py'
      - '.github/workflows/news-shock-lab-v03a-consensus-combined-v06.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  news-shock-v03a-consensus-combined-v06:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install parser dependency and compile
        run: |
          cd Dream-Account-OS-v2.3-PARTIAL
          python -m pip install beautifulsoup4
          python -m compileall -q research
      - name: Verify frozen authority chain
        run: |
          cd Dream-Account-OS-v2.3-PARTIAL
          python - <<'PY'
          from research.news_shock_lab_v03a_consensus_combined_v06 import load_authority
          *_, freeze6, seed6 = load_authority()
          assert freeze6['fingerprint'] == 'd833dbdd508d1ddcbcd0ffadafc7dbd90a65c3a47514f6e93a9c73306f467ba1'
          assert seed6['fingerprint'] == '03899ec02f291b16021fad636d021d85b08ba5596cec50843896e0d818de2c13'
          assert freeze6['parent_combined_manifest_fingerprint'] == '8c111516b2841d53e927241584ac9af510a4ad294008d5bb83dee472a71846eb'
          assert freeze6['parent_validation_fingerprint'] == '3c7d537831a271301f2b9de478ac7619aa4e97dd5ed9bc4826d8a493c08e92e4'
          print('NEWS V03A COMBINED V06 AUTHORITY PASS')
          PY
      - name: Rebuild BLS actuals and validate twenty-three consensus events
        run: |
          cd Dream-Account-OS-v2.3-PARTIAL
          mkdir -p research/local_data/news_v03a_consensus_combined_v06_output
          set -o pipefail
          python -m research.news_shock_lab_v03a_consensus_combined_v06 \
            research/local_data/news_v03a_consensus_combined_v06_output \
            | tee research/local_data/news_v03a_consensus_combined_v06_output/combined_v06_stdout.txt
      - name: Assert 23 COMPLETE_A and all outcome guards closed
        run: |
          cd Dream-Account-OS-v2.3-PARTIAL
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('research/local_data/news_v03a_consensus_combined_v06_output')
          s = json.loads((root/'combined_v06_summary.json').read_text())
          expected_counts = {'COMPLETE_A': 23, 'CONSENSUS_PROVENANCE_INCOMPLETE': 21}
          if s['status_counts'] != expected_counts:
              raise SystemExit(f"NEWS V03A V06 STATUS COUNT DRIFT: {s['status_counts']}")
          if s.get('complete_b_count', 0) != 0:
              raise SystemExit('NEWS V03A V06 UNEXPECTED COMPLETE_B')
          if len(s['complete_a_event_ids']) != 23:
              raise SystemExit('NEWS V03A V06 COMPLETE_A COUNT DRIFT')
          new_ids = (
              'US_CPI_2023-01-12',
              'US_CPI_2023-04-12',
              'US_CPI_2023-07-12',
              'US_CPI_2023-08-10',
              'US_CPI_2023-09-13',
              'US_CPI_2023-12-12',
          )
          for event_id in new_ids:
              if event_id not in s['complete_a_event_ids']:
                  raise SystemExit(f'NEWS V03A V06 NEW EVENT MISSING: {event_id}')
          for rejected in ('US_CPI_2023-05-10', 'US_CPI_2023-10-12'):
              if rejected in s['complete_a_event_ids']:
                  raise SystemExit(f'NEWS V03A V06 REJECTED EVENT LEAKED IN: {rejected}')
          for key, value in s['guards'].items():
              if value is not False:
                  raise SystemExit(f'NEWS V03A V06 OUTCOME GUARD DRIFT: {key}')
          print('NEWS V03A COMBINED V06 VALIDATION PASS', s['validation_fingerprint'])
          PY
      - name: Upload combined V0.6 provenance receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: news-shock-v03a-consensus-combined-v06-${{ github.sha }}
          path: |
            Dream-Account-OS-v2.3-PARTIAL/research/local_data/news_v03a_consensus_combined_v06_output/combined_v06_consensus_manifest.json
            Dream-Account-OS-v2.3-PARTIAL/research/local_data/news_v03a_consensus_combined_v06_output/combined_v06_validation_receipt.json
            Dream-Account-OS-v2.3-PARTIAL/research/local_data/news_v03a_consensus_combined_v06_output/combined_v06_summary.json
            Dream-Account-OS-v2.3-PARTIAL/research/local_data/news_v03a_consensus_combined_v06_output/combined_v06_stdout.txt
          if-no-files-found: warn
          retention-days: 30
