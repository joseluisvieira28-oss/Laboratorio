name: ROLL002 Morpho Midnight FirstParty Public REST Roll Incentive Source V02
on:
  push:
    branches:
      - research/morpho-midnight-roll-firstparty-rest-v02-2026-10-30
    paths:
      - .github/workflows/roll002-morpho-firstparty-rest-v02.yml
permissions:
  contents: read
jobs:
  first-party-public-read-only:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fail closed selection, raw positive incentive and source schema tests
        run: |
          python -m py_compile research/morpho_roll_keeper_001/roll002_firstparty_rest_source.py
          python -c "import sys;sys.path.insert(0,'research/morpho_roll_keeper_001');import roll002_firstparty_rest_source as m;m.tests();print('ROLL002_SELF_TESTS_PASS')"
      - name: Single official public Morpho Midnight Base market list and fixed 12 market roll history calls
        run: python research/morpho_roll_keeper_001/roll002_firstparty_rest_source.py
      - if: always()
        name: Preserve original Morpho public HTTP receipts, hashes and fail-closed report
        uses: actions/upload-artifact@v4
        with:
          name: roll002-morpho-midnight-firstparty-rest-v02
          path: artifacts/morpho_roll_firstparty_rest_v02/
          if-no-files-found: warn
