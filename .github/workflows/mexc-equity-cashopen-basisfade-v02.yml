name: MEXC Multi-Equity CashOpen BasisFade V0.2

on:
  push:
    branches:
      - mexc-equity-cashopen-basisfade-v0.2-prereg-2026-10-04

permissions:
  contents: read

jobs:
  cashopen:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependency
        run: python -m pip install --disable-pip-version-check requests
      - name: Pre-outcome freeze check
        run: |
          test "$GITHUB_REF_NAME" = "mexc-equity-cashopen-basisfade-v0.2-prereg-2026-10-04"
          test -f research/mexc_global_assets/MEXC_EQUITY_CASHOPEN_BASISFADE_FREEZE_V0.2.md
          test -f research/mexc_global_assets/MEXC_EQUITY_CASHOPEN_BASISFADE_RULE_V0.2.json
          test -f research/mexc_global_assets/MEXC_EQUITY_CASHOPEN_BASISFADE_BINDING_V0.2.json
          python -m py_compile research/mexc_global_assets/mexc_equity_cashopen_basisfade_v02.py
          echo CASHOPEN_BASISFADE_PRE_OUTCOME_FREEZE_PASS
      - name: Run frozen six-asset basis-fade
        run: python research/mexc_global_assets/mexc_equity_cashopen_basisfade_v02.py
      - name: Upload immutable evidence
        uses: actions/upload-artifact@v4
        with:
          name: mexc-equity-cashopen-basisfade-v02-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/mexc_global_assets/equity_cashopen_basisfade_v02
          if-no-files-found: error
          retention-days: 90