name: BTC-CONVEX 15m 30m 1h 4h Historical Matrix
on:
  push:
    branches:
      - research/btc-convex-timeframe-matrix-2026-10-13
    paths:
      - 'research/btc_convex_timeframe_matrix_20261013/**'
      - '.github/workflows/btc-convex-timeframe-matrix-2026.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  research-matrix-only:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Offline synthetic proof before opening market outcomes
        run: |
          python -m unittest discover -s research/btc_convex_timeframe_matrix_20261013 -p 'test_*.py' -v
          python -m py_compile research/btc_convex_timeframe_matrix_20261013/matrix.py
      - name: Run checksum-verified 2021-2025 historical comparison
        run: python -m research.btc_convex_timeframe_matrix_20261013.matrix
      - name: Upload market source manifest and eight complete trade ledgers
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BTC-CONVEX-FOUR-TF-RESEARCH-ONLY-HISTORICAL-NO-OOS
          path: research/btc_convex_timeframe_matrix_20261013/receipts/**
          if-no-files-found: warn
          retention-days: 30
