name: MLMXD Current Symbols And History Files Probe
on:
  push:
    branches: [mexc-launchpool-mx-demand-v0.1-source-2026-10-07]
    paths: ['research/mexc_launchpool_mx_demand/current_symbols_and_files_probe.py','.github/workflows/mlmxd_current_symbols_and_files_probe.yml']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install requests
      - run: python research/mexc_launchpool_mx_demand/current_symbols_and_files_probe.py
