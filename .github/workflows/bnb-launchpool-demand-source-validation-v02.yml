name: BNB Launchpool Demand Source Validation V0.2

on:
  push:
    branches:
      - bnb-launchpool-demand-v0.1

permissions:
  contents: write
  actions: read

jobs:
  source-validation-v02:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout scientific branch
        uses: actions/checkout@v4
        with:
          ref: bnb-launchpool-demand-v0.1
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Preflight immutable V0.1 source evidence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          BASE='Dream-Account-OS-v2.3-PARTIAL/research/bnb_launchpool_demand_001'
          test -f "$BASE/source_archive_v01/BNB_LAUNCHPOOL_DEMAND_001_SOURCE_ARCHIVE_RECEIPT_V0.1.json"
          test -f "$BASE/BNB_LAUNCHPOOL_DEMAND_001_SOURCE_VALIDATION_AMENDMENT_V0.2.json"
          python -m py_compile "$BASE/source_validation_v02.py"
          DIGEST="$(gh api repos/${GITHUB_REPOSITORY}/actions/artifacts/10461865222 --jq '.digest')"
          test "$DIGEST" = 'sha256:7625170ac651c073cab094a22811559b6ebf2c28ee3a4459eb58127225953dcc'
          python - <<'PY'
          import json
          base='Dream-Account-OS-v2.3-PARTIAL/research/bnb_launchpool_demand_001'
          a=json.load(open(base+'/BNB_LAUNCHPOOL_DEMAND_001_SOURCE_VALIDATION_AMENDMENT_V0.2.json'))
          v=json.load(open(base+'/source_archive_v01/BNB_LAUNCHPOOL_DEMAND_001_SOURCE_ARCHIVE_RECEIPT_V0.1.json'))
          assert a['status']=='FROZEN_POST_SOURCE_BYTES_PRE_MARKET_OUTCOME'
          assert v['classification']=='DATA_INTEGRITY_FAILURE'
          assert v['transport_failures']==0
          assert v['access_2025'] is False and v['access_2026'] is False
          assert v['market_outcomes_opened'] is False
          PY

      - name: Revalidate frozen source bytes under V0.2 contract
        shell: bash
        run: |
          set -euo pipefail
          BASE='Dream-Account-OS-v2.3-PARTIAL/research/bnb_launchpool_demand_001'
          python "$BASE/source_validation_v02.py"
          python - <<'PY'
          import json
          p='Dream-Account-OS-v2.3-PARTIAL/research/bnb_launchpool_demand_001/source_validation_v02/BNB_LAUNCHPOOL_DEMAND_001_SOURCE_VALIDATION_V0.2.json'
          d=json.load(open(p))
          assert d['classification']=='SOURCE_DATA_PASS', d['classification']
          assert d['canonical_event_count']==33
          assert all(d['source_pass_checks'].values())
          f=d['firewalls']
          assert f['market_price_fields_opened'] is False
          assert f['returns_computed'] is False
          assert f['pnl_computed'] is False
          assert f['access_2025'] is False and f['access_2026'] is False
          assert f['live_trading'] is False and f['exchange_mutation'] is False
          print(json.dumps({
              'classification':d['classification'],
              'canonical_event_count':d['canonical_event_count'],
              'canonical_event_manifest_sha256':d['canonical_event_manifest_sha256'],
              'diagnostics':d['diagnostics'],
          },indent=2))
          PY

      - name: Upload V0.2 validation receipt
        uses: actions/upload-artifact@v4
        with:
          name: bnb-launchpool-demand-001-source-validation-v02-${{ github.run_id }}-${{ github.run_attempt }}
          path: Dream-Account-OS-v2.3-PARTIAL/research/bnb_launchpool_demand_001/source_validation_v02/
          retention-days: 90
          if-no-files-found: error

      - name: Persist SOURCE_DATA_PASS receipt
        shell: bash
        run: |
          set -euo pipefail
          BASE='Dream-Account-OS-v2.3-PARTIAL/research/bnb_launchpool_demand_001'
          git config user.name 'crypto-lab-bnb-launchpool-bot'
          git config user.email 'crypto-lab-bnb-launchpool-bot@users.noreply.github.com'
          git add "$BASE/source_validation_v02/BNB_LAUNCHPOOL_DEMAND_001_SOURCE_VALIDATION_V0.2.json"
          git commit -m 'BNB-LAUNCHPOOL-DEMAND-001: SOURCE_DATA_PASS V0.2 [skip ci]'
          git pull --rebase origin bnb-launchpool-demand-v0.1
          git push origin HEAD:bnb-launchpool-demand-v0.1
