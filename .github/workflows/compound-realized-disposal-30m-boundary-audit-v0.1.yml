name: Compound Realized Disposal 30M Boundary Audit V0.1

on:
  push:
    branches: [pressure-mining-program-v0.1]
    paths:
      - "pressure_mining_v0_1/compound_realized_disposal_30m_boundary_audit.py"
      - "pressure_mining_v0_1/labs/COMPOUND_REALIZED_DISPOSAL_FLOW_001_30M_IMPLEMENTATION_ADDENDUM_V0.1.md"
      - ".github/workflows/compound-realized-disposal-30m-boundary-audit-v0.1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m py_compile pressure_mining_v0_1/compound_realized_disposal_30m_boundary_audit.py
      - run: python pressure_mining_v0_1/compound_realized_disposal_30m_boundary_audit.py
      - name: Verify source-only boundary receipt
        run: |
          python - <<'PY'
          import json
          p="pressure_mining_v0_1/receipts/COMPOUND_REALIZED_DISPOSAL_FLOW_001_30M_BOUNDARY_AUDIT_RECEIPT_V0.1.json"
          j=json.load(open(p))
          print("scientific_status=",j.get("status"))
          if j.get("status") not in ("BOUNDARY_AUDIT_PASS","BOUNDARY_AUDIT_PASS_WITH_EXCLUSIONS"):raise SystemExit(2)
          if j["firewall"]["market_prices_opened"] is not False:raise SystemExit(3)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compound-realized-disposal-30m-boundary-v01
          path: pressure_mining_v0_1/receipts/COMPOUND_REALIZED_DISPOSAL_FLOW_001_30M_BOUNDARY_AUDIT_RECEIPT_V0.1.json
          if-no-files-found: error
