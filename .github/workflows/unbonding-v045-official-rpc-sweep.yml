name: Unbonding V0.4.5 Official RPC Sweep

on:
  push:
    branches:
      - pos-unbonding-completion-001-v0.4-index-free-census-2026-10-07
    paths:
      - "research/pos_unbonding_completion_001_v0_4_index_free/v045_official_rpc_sweep.py"
      - ".github/workflows/unbonding-v045-official-rpc-sweep.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pos-unbonding-completion-001-v0.4-index-free-census-2026-10-07
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Sweep official historical RPCs
        run: python research/pos_unbonding_completion_001_v0_4_index_free/v045_official_rpc_sweep.py
      - name: Commit receipt
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/pos_unbonding_completion_001_v0_4_index_free/OFFICIAL_RPC_SWEEP_V045.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record V0.4.5 official historical RPC sweep"
          git pull --rebase origin pos-unbonding-completion-001-v0.4-index-free-census-2026-10-07
          git push origin HEAD:pos-unbonding-completion-001-v0.4-index-free-census-2026-10-07
