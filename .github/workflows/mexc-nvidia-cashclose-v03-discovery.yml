name: MEXC NVIDIA CashClose V0.3 Discovery

on:
  push:
    branches:
      - mexc-nvidia-cashclose-v0.3-prereg-2026-10-04

permissions:
  contents: read

jobs:
  discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependency
        run: python -m pip install --disable-pip-version-check requests
      - name: Freeze check
        run: |
          test "$GITHUB_REF_NAME" = "mexc-nvidia-cashclose-v0.3-prereg-2026-10-04"
          test -f research/mexc_global_assets/MEXC_NVIDIA_CASHCLOSE_RULE_V0.3.json
          test -f research/mexc_global_assets/MEXC_NVIDIA_CASHCLOSE_SOURCE_BINDING_V0.3.json
          python -m py_compile research/mexc_global_assets/mexc_nvidia_cashclose_v03.py
          echo PRE_OUTCOME_FREEZE_PASS
      - name: Run cash-close discovery
        run: python research/mexc_global_assets/mexc_nvidia_cashclose_v03.py
      - name: Upload immutable discovery evidence
        uses: actions/upload-artifact@v4
        with:
          name: mexc-nvidia-cashclose-v03-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/mexc_global_assets/nvidia_cashclose_v03
          if-no-files-found: error
          retention-days: 90