name: xven-disloc-001-source-gate-v01

on:
  push:
    branches:
      - microstructure-scalping-lab-v0.1
    paths:
      - 'research/microstructure_scalping/XVEN_DISLOC_001_SOURCE_FREEZE_V0_1.md'
      - 'research/microstructure_scalping/xven_disloc_001_source_v01.py'
      - '.github/workflows/xven-disloc-001-source-gate-v01.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'websockets>=13,<16'
      - name: Capture public Binance + MEXC BBO
        run: python -m research.microstructure_scalping.xven_disloc_001_source_v01
      - name: Print receipt
        if: always()
        run: cat research/microstructure_scalping/receipts/xven_disloc_001_source_v01.json || true
