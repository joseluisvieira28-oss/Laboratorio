name: BUILD RADAR V0.14.4 CIRV EIGHT MOTOR

on:
  workflow_dispatch:
  push:
    branches:
      - radar-mexc-postdeploy-hardening-v0.1
      - radar-v01431-authority-packaging-hotfix-v0.1
      - radar-v01432-live-state-reconciliation-v0.1
      - radar-v01433-single-instance-lock-v0.1
      - radar-v0144-cirv-eight-motor-v0.1
    paths:
      - 'crypto_edge_radar/radar/dashboard.py'
      - 'crypto_edge_radar/radar/cirv_local.py'
      - 'crypto_edge_radar/deployment_registry_v1.json'
      - 'crypto_edge_radar/pyproject.toml'
      - 'crypto_edge_radar/radar/options_v21_live.py'
      - 'crypto_edge_radar/radar/forward_web.py'
      - 'crypto_edge_radar/radar/mexc_local_state.py'
      - 'crypto_edge_radar/tests/test_dashboard.py'
      - 'crypto_edge_radar/tests/test_cirv_local.py'
      - 'crypto_edge_radar/tests/test_options_v21_live.py'
      - 'crypto_edge_radar/tests/test_mexc_local_state.py'
      - 'crypto_edge_radar/tests/test_windows_resilient_bootstrap.py'
      - 'crypto_edge_radar/windows_node_entry.py'
      - 'crypto_edge_radar/windows/START_RADAR_RECOVERY_V0141.ps1'
      - 'crypto_edge_radar/windows/START_RADAR_RECOVERY_V0141.bat'
      - 'crypto_edge_radar/windows/CHECK_RADAR_V0141.ps1'
      - 'crypto_edge_radar/windows/RUN_RADAR_24X7_V0143.ps1'
      - 'crypto_edge_radar/windows/INSTALL_RADAR_AUTOSTART_V0143.ps1'
      - 'crypto_edge_radar/windows/IMPORT_MEXC_RECEIPTS_V0143.ps1'
      - '.github/workflows/build-radar-v0142-focused-validation.yml'

permissions:
  contents: read

jobs:
  build-focused:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: crypto_edge_radar
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install runtime and packager
        run: |
          python -m pip install -e .
          python -m pip install "pyinstaller>=6,<7"

      - name: Compile changed surfaces
        run: |
          python -m compileall radar\dashboard.py radar\cirv_local.py radar\forward_web.py radar\mexc_local_state.py radar\options_v21_live.py windows_node_entry.py tests\test_dashboard.py tests\test_cirv_local.py tests\test_mexc_local_state.py tests\test_options_v21_live.py tests\test_windows_resilient_bootstrap.py

      - name: Targeted failure-isolation tests
        run: |
          python -m unittest tests.test_dashboard tests.test_cirv_local tests.test_mexc_local_state tests.test_options_v21_live tests.test_mexc_live_gate tests.test_mexc_auth_trade tests.test_windows_resilient_bootstrap -v

      - name: Full Windows regression suite
        run: |
          python -m unittest discover -s tests -v

      - name: Build V0.14.4 node (stable onedir layout for App Control)
        run: |
          pyinstaller --clean --onedir --name CryptoEdgeRadarNode --add-data "deployment_registry_v1.json;." --add-data "MEXC_FUTURES_STANDING_MICROLIVE_OPERATOR_AUTHORITY_V0.1.json;." windows_node_entry.py

      - name: Package self-test
        shell: pwsh
        run: |
          $env:RADAR_PACKAGING_SELFTEST = "1"
          $state = (& .\dist\CryptoEdgeRadarNode\CryptoEdgeRadarNode.exe) | ConvertFrom-Json
          if ($state.status -ne "PASS") { throw "package self-test failed" }
          if ($state.build_id -ne "v0.14.4-win-cirv-eight-motor") { throw "unexpected build_id" }
          if (-not $state.standing_authority_present) { throw "standing MEXC authority missing from package" }
          if ($state.standing_authority_id -ne "MEXC_FUTURES_STANDING_MICROLIVE_OPERATOR_AUTHORITY_V0.1") { throw "standing authority id mismatch" }
          if ($state.standing_authority_status -ne "ACTIVE_STANDING_OPERATOR_AUTHORIZATION") { throw "standing authority inactive" }
          if ($state.registry_version -ne "3.7") { throw "unexpected registry version" }
          if ([int]$state.candidate_count -ne 8) { throw "unexpected motor count" }
          if (-not $state.resilient_control_plane_bootstrap) { throw "resilient bootstrap missing" }
          if (-not $state.cirv_strategy_present) { throw "CIRV strategy missing from packaged registry" }
          if (-not $state.cirv_watcher_importable) { throw "CIRV watcher import missing from package" }

      - name: Packaged duplicate-process regression
        shell: pwsh
        run: |
          $exe = (Resolve-Path ".\dist\CryptoEdgeRadarNode\CryptoEdgeRadarNode.exe").Path
          $probe = Join-Path $env:RUNNER_TEMP "radar-v0144-duplicate-probe"
          New-Item -ItemType Directory -Force -Path $probe | Out-Null
          $firstOut = Join-Path $probe "first.stdout.log"
          $firstErr = Join-Path $probe "first.stderr.log"
          $secondOut = Join-Path $probe "second.stdout.log"
          $secondErr = Join-Path $probe "second.stderr.log"
          $first = $null
          try {
            $first = Start-Process -FilePath $exe -WorkingDirectory $probe -RedirectStandardOutput $firstOut -RedirectStandardError $firstErr -PassThru
            Start-Sleep -Seconds 4
            if ($first.HasExited) {
              if (Test-Path $firstOut) { Get-Content $firstOut -Raw }
              if (Test-Path $firstErr) { Get-Content $firstErr -Raw }
              throw "primary packaged Radar exited before duplicate probe"
            }

            $second = Start-Process -FilePath $exe -WorkingDirectory $probe -RedirectStandardOutput $secondOut -RedirectStandardError $secondErr -PassThru -Wait
            $dupText = if (Test-Path $secondOut) { Get-Content $secondOut -Raw } else { "" }
            Write-Host $dupText
            if ($second.ExitCode -ne 3) { throw "duplicate packaged Radar exit code was $($second.ExitCode), expected 3" }
            if (-not $dupText.Contains("DUPLICATE_LOCAL_NODE")) { throw "duplicate packaged Radar did not emit DUPLICATE_LOCAL_NODE" }
          }
          finally {
            if ($null -ne $first -and -not $first.HasExited) {
              Stop-Process -Id $first.Id -Force -ErrorAction SilentlyContinue
            }
          }

      - name: PowerShell syntax validation
        shell: pwsh
        run: |
          foreach ($s in @(
            "windows\START_RADAR_RECOVERY_V0141.ps1",
            "windows\CHECK_RADAR_V0141.ps1",
            "windows\RUN_RADAR_24X7_V0143.ps1",
            "windows\INSTALL_RADAR_AUTOSTART_V0143.ps1",
            "windows\IMPORT_MEXC_RECEIPTS_V0143.ps1"
          )) {
            $errors=$null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $s),[ref]$null,[ref]$errors)
            if ($errors.Count -gt 0) { $errors | Format-List; throw "PowerShell syntax failure: $s" }
          }

      - name: Prove launcher requires exact V0.14.4 identity
        shell: pwsh
        run: |
          $src=Get-Content "windows\START_RADAR_RECOVERY_V0141.ps1" -Raw
          if (-not $src.Contains('v0.14.4-win-cirv-eight-motor')) { throw "launcher does not require V0.14.4 build id" }
          if (-not $src.Contains('registryVersion -eq "3.7"')) { throw "launcher registry check missing" }
          if (-not $src.Contains('focusExpected -eq 8')) { throw "launcher eight-motor check missing" }
          if (-not $src.Contains('ProcessName -ne "CryptoEdgeRadarNode"')) { throw "unrelated-process safety check missing" }

      - name: Hash executable
        shell: pwsh
        run: |
          Get-ChildItem dist\CryptoEdgeRadarNode -File -Recurse | Sort-Object FullName | ForEach-Object {
            $relative=$_.FullName.Substring((Resolve-Path dist\CryptoEdgeRadarNode).Path.Length + 1)
            $hash=(Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $relative"
          } | Out-File dist\CryptoEdgeRadarNode.sha256.txt -Encoding ascii

      - name: Assemble hotfix bundle
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path v0144_bundle\windows | Out-Null
          Copy-Item dist\CryptoEdgeRadarNode v0144_bundle\CryptoEdgeRadarNode -Recurse
          Copy-Item dist\CryptoEdgeRadarNode.sha256.txt v0144_bundle\CryptoEdgeRadarNode.sha256.txt
          Copy-Item windows\START_RADAR_RECOVERY_V0141.ps1 v0144_bundle\windows\
          Copy-Item windows\START_RADAR_RECOVERY_V0141.bat v0144_bundle\windows\
          Copy-Item windows\CHECK_RADAR_V0141.ps1 v0144_bundle\windows\
          Copy-Item windows\RUN_RADAR_24X7_V0143.ps1 v0144_bundle\windows\
          Copy-Item windows\INSTALL_RADAR_AUTOSTART_V0143.ps1 v0144_bundle\windows\
          Copy-Item windows\IMPORT_MEXC_RECEIPTS_V0143.ps1 v0144_bundle\windows\
          Copy-Item MEXC_FUTURES_STANDING_MICROLIVE_OPERATOR_AUTHORITY_V0.1.json v0144_bundle\

      - name: Upload V0.14.4 CIRV eight motor
        uses: actions/upload-artifact@v4
        with:
          name: crypto-edge-radar-v0144-cirv-eight-motor
          path: crypto_edge_radar/v0144_bundle/**
          if-no-files-found: error
          retention-days: 14
