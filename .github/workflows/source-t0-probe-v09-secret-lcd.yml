name: source-t0-probe-v09-secret-lcd

on:
  push:
    branches:
      - cosmos-native-emission-param-shock-001-v0.2-t0-remediation-2026-10-07
    paths:
      - .github/workflows/source-t0-probe-v09-secret-lcd.yml

permissions:
  contents: read

jobs:
  secret-lcd:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Binary search Mario LCD archive
        shell: bash
        run: |
          python3 - <<'PY'
          import json, urllib.request, ssl
          from datetime import datetime
          T="2023-12-07T02:54:58.930543213Z"
          TT=datetime.fromisoformat(T.replace("Z","+00:00")).timestamp()
          UA={"User-Agent":"CryptoLab-secret-lcd/0.9"}
          bases=[
            "https://lcd.archive.scrt.marionode.com",
            "https://secretnetwork-api.highstakes.ch:1317",
          ]
          def get(url,timeout=12):
            try:
              q=urllib.request.Request(url,headers=UA)
              with urllib.request.urlopen(q,timeout=timeout,context=ssl._create_unverified_context()) as r:
                return {"ok":True,"status":r.status,"data":json.loads(r.read().decode()),"url":url}
            except Exception as e:return {"ok":False,"error":repr(e),"url":url}
          def block(base,h):
            paths=[f"/cosmos/base/tendermint/v1beta1/blocks/{h}",f"/blocks/{h}"]
            last=None
            for path in paths:
              x=get(base.rstrip("/")+path)
              last=x
              if x["ok"]:
                d=x["data"]
                try:
                  # new REST shape
                  hd=d["block"]["header"]
                  tm=hd["time"]
                  hh=int(hd["height"])
                  return {"height":hh,"time":tm},x
                except: pass
                try:
                  # legacy LCD
                  hd=d["block"]["header"]
                  return {"height":int(hd["height"]),"time":hd["time"]},x
                except: pass
            return None,last
          out={"scope":"SOURCE_ONLY_NO_MARKET_DATA","target":T,"bases":{}}
          for base in bases:
            rec={}
            lo,hi=11752974,11920000
            a,ra=block(base,lo);b,rb=block(base,hi)
            rec["lo"]=a or ra;rec["hi"]=b or rb
            if a and b:
              ta=datetime.fromisoformat(a["time"].replace("Z","+00:00")).timestamp()
              tb=datetime.fromisoformat(b["time"].replace("Z","+00:00")).timestamp()
              rec["bracket_valid"]=ta<TT<=tb
              if rec["bracket_valid"]:
                L,R=lo,hi
                while L<R:
                  m=(L+R)//2
                  z,rz=block(base,m)
                  if not z: rec["binary_error"]={"height":m,"raw":rz};break
                  tz=datetime.fromisoformat(z["time"].replace("Z","+00:00")).timestamp()
                  if tz>=TT:R=m
                  else:L=m+1
                if "binary_error" not in rec:
                  H=L;rec["H"]=H;rec["neighbors"]={}
                  for h in range(H-2,H+3):
                    z,rz=block(base,h);rec["neighbors"][str(h)]=z or rz
                  # Historical mint state using height header
                  rec["mint"]={}
                  for h in (H-1,H,H+1,H+2):
                    rr={}
                    for path in ("/cosmos/mint/v1beta1/inflation","/cosmos/mint/v1beta1/params"):
                      try:
                        q=urllib.request.Request(base.rstrip("/")+path,headers={**UA,"x-cosmos-block-height":str(h)})
                        with urllib.request.urlopen(q,timeout=12,context=ssl._create_unverified_context()) as r:
                          rr[path]={"ok":True,"data":json.loads(r.read().decode())}
                      except Exception as e: rr[path]={"ok":False,"error":repr(e)}
                    rec["mint"][str(h)]=rr
                  out["bases"][base]=rec;break
            out["bases"][base]=rec
          print("SECRET_LCD_V09_BEGIN")
          print(json.dumps(out,indent=2,sort_keys=True)[:500000])
          print("SECRET_LCD_V09_END")
          PY
