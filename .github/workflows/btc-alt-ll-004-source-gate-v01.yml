name: btc-alt-ll-004-source-gate-v01

on:
  push:
    branches:
      - microstructure-scalping-lab-v0.1
    paths:
      - 'research/microstructure_scalping/btc_alt_ll_004_source_gate_v01.py'
      - 'research/microstructure_scalping/BTC_ALT_LL_004_SOURCE_GATE_FREEZE_V0_1.md'
      - '.github/workflows/btc-alt-ll-004-source-gate-v01.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m research.microstructure_scalping.btc_alt_ll_004_source_gate_v01
      - name: Print receipt
        if: always()
        run: cat research/microstructure_scalping/receipts/btc_alt_ll_004_source_gate_v01.json || true
