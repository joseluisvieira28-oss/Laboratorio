name: BTC Event10m Single-Mechanism Four-Leg Source Preflight V04
on:
  push:
    branches:
      - research/btc-event10m-single-hypothesis-source-preflight-2026-10-30
    paths:
      - .github/workflows/btc-event10m-source-preflight-v04.yml
permissions:
  contents: read
jobs:
  read-only-source-no-forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Seven synthetic as-of source clock guard tests
        run: python -m unittest discover -s research/mexc_event_direction_v01 -p 'test_btc_event10m_source_gates_v04.py' -v
      - name: Install public anonymous browser dependency
        run: |
          python -m pip install --disable-pip-version-check playwright==1.56.0
          python -m playwright install chromium
      - name: Capture three real books plus exact 10m payout and public index (NO forecast/outcome)
        run: python research/mexc_event_direction_v01/btc_event10m_source_preflight_v04.py
      - name: Save receipts and raw exact source response bytes even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: btc-event10m-four-leg-source-only-v04
          path: artifacts/btc_event10m_source_v04/
          if-no-files-found: warn
