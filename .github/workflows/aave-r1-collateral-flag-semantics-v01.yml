name: AAVE R1 Collateral Flag Semantics Probe V0.1

on:
  push:
    branches:
      - aave-liquidation-overhang-v0.1
    paths:
      - '.github/workflows/aave-r1-collateral-flag-semantics-v01.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-only-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests 'eth-hash[pycryptodome]'
      - name: Freeze guard
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path('research/aave_liquidation_overhang/AAVE_LIQUIDATION_OVERHANG_001_R1_COLLATERAL_FLAG_SEMANTICS_PROBE_V0_1.json').read_text())
          assert x['status']=='FROZEN_SOURCE_ONLY_BEFORE_RPC_CALLS'
          assert x['block']==21525890
          assert len(x['pairs'])==5
          assert x['quorum_required']==2
          assert 'health factor' in x['forbidden']
          assert 'returns' in x['forbidden']
          print('FLAG_SEMANTICS_FREEZE_GUARD_PASS')
          PY
      - name: Execute exact source-only state probe
        run: python research/aave_liquidation_overhang/r1_collateral_flag_semantics_probe_v01.py
      - name: Safety guard
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('out/aave_flag_semantics/AAVE_R1_COLLATERAL_FLAG_SEMANTICS_PROBE_V0_1.json')
          assert p.exists()
          x=json.loads(p.read_text())
          s=x['safety']
          assert not any(s.values())
          print('FLAG_SEMANTICS_SAFETY_PASS',x['classification'])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AAVE_R1_COLLATERAL_FLAG_SEMANTICS_PROBE_V0_1
          path: out/aave_flag_semantics/AAVE_R1_COLLATERAL_FLAG_SEMANTICS_PROBE_V0_1.json
          if-no-files-found: error
          retention-days: 30
