name: BNB DIAMANTE V9 — Incremental Source-Only Gate

on:
  push:
    branches:
      - research/bnb-launchpool-source-v09-incremental-2026-11-16
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bnb-v9-source-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  v9-incremental-source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Frozen authority and compile
        run: |
          test -f governance/BNB_LAUNCHPOOL_INCREMENTAL_SOURCE_V09_FREEZE_2026-11-16.md
          python -m py_compile crypto_edge_radar/bnb_launchpool_source_v09.py
          python -m py_compile crypto_edge_radar/tests/test_bnb_source_v09.py
      - name: V9 offline fail-closed tests — NO NETWORK
        run: |
          cd crypto_edge_radar
          python -m unittest discover -s tests -p 'test_bnb_source_v09.py' -v
      - name: Restore SHA-protected operational checkpoint — never a proof of first-seen before V9
        uses: actions/cache/restore@v4
        with:
          path: crypto_edge_radar/artifacts/bnb_launchpool/source_v09/state
          key: bnb-v9-incremental-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            bnb-v9-incremental-
      - name: One public CMS GET, catalogue 49 — no retry on 429
        run: |
          cd crypto_edge_radar
          python bnb_launchpool_source_v09.py --catalog 49
      - name: Persist operational checkpoint even if source rate-limited
        if: always()
        uses: actions/cache/save@v4
        with:
          path: crypto_edge_radar/artifacts/bnb_launchpool/source_v09/state
          key: bnb-v9-incremental-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Upload immutable receipt and checksum — including blocks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bnb-v9-source-only-${{ github.run_id }}
          path: crypto_edge_radar/artifacts/bnb_launchpool/source_v09
          if-no-files-found: warn
          retention-days: 90
