name: source-t0-probe-v06-secret-archive

on:
  push:
    branches:
      - cosmos-native-emission-param-shock-001-v0.2-t0-remediation-2026-10-07
    paths:
      - .github/workflows/source-t0-probe-v06-secret-archive.yml

permissions:
  contents: read

jobs:
  secret-archive-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Probe Secret historical blocks and binary search T0
        shell: bash
        run: |
          python3 - <<'PY'
          import json, urllib.request, ssl, time
          from datetime import datetime

          TARGET="2023-12-07T02:54:58.930543213Z"
          TARGET_TS=datetime.fromisoformat(TARGET.replace("Z","+00:00")).timestamp()
          UA={"User-Agent":"CryptoLab-secret-t0-recovery/0.6"}

          providers=[
            "https://rpc.archive.scrt.marionode.com",
            "https://scrt-rpc.blockpane.com",
            "https://secret-4.api.trivium.network:26657",
            "https://rpc.secret.forbole.com",
            "https://secret.rpc.consensus.one",
            "https://secretnetwork-rpc.stakely.io",
            "https://rpc.spartanapi.dev",
            "https://scrt-rpc.agoranodes.com",
            "https://rpc.secret.express",
          ]

          def get(url, timeout=20):
              try:
                  req=urllib.request.Request(url,headers=UA)
                  with urllib.request.urlopen(req,timeout=timeout,context=ssl.create_default_context()) as r:
                      body=r.read().decode("utf-8","replace")
                      return {"ok":True,"status":r.status,"url":url,"data":json.loads(body)}
              except Exception as e:
                  return {"ok":False,"url":url,"error":repr(e)}

          def parse_block(rr):
              if not rr.get("ok"): return None
              d=rr.get("data",{})
              try:
                  h=int(d["result"]["block"]["header"]["height"])
                  t=d["result"]["block"]["header"]["time"]
                  return {"height":h,"time":t,"hash":d["result"].get("block_id",{}).get("hash")}
              except Exception:
                  return None

          def block(base,h,timeout=20):
              rr=get(base.rstrip("/") + f"/block?height={h}", timeout)
              return parse_block(rr),rr

          out={"scope":"SOURCE_ONLY_NO_MARKET_DATA","target":TARGET,"providers":{}}
          # Based only on source metadata: block 11,752,974 was a recent block on 2023-11-28.
          # Probe broad deterministic grid around expected Dec 7 range; no market data.
          grid=[11752974,11780000,11800000,11820000,11840000,11860000,11880000,11900000,11920000]

          winner=None
          for p in providers:
              rec={"grid":{}}
              for h in grid:
                  b,rr=block(p,h,15)
                  rec["grid"][str(h)]=b if b else {"error":rr.get("error"),"status":rr.get("status")}
                  if b:
                      bt=datetime.fromisoformat(b["time"].replace("Z","+00:00")).timestamp()
                      if abs(bt-TARGET_TS) < 15*86400:
                          winner=p
              out["providers"][p]=rec
              if winner==p:
                  # find adjacent grid bracket
                  vals=[x for x in rec["grid"].values() if isinstance(x,dict) and x.get("time")]
                  vals=sorted(vals,key=lambda x:x["height"])
                  lo=hi=None
                  for a,bv in zip(vals,vals[1:]):
                      ta=datetime.fromisoformat(a["time"].replace("Z","+00:00")).timestamp()
                      tb=datetime.fromisoformat(bv["time"].replace("Z","+00:00")).timestamp()
                      if ta < TARGET_TS <= tb:
                          lo,hi=a,bv; break
                  if lo and hi:
                      rec["bracket"]={"lo":lo,"hi":hi}
                      L,R=lo["height"],hi["height"]
                      errors=[]
                      while L<R:
                          M=(L+R)//2
                          bm,raw=block(p,M,25)
                          if not bm:
                              errors.append({"height":M,"error":raw.get("error"),"status":raw.get("status")})
                              break
                          tm=datetime.fromisoformat(bm["time"].replace("Z","+00:00")).timestamp()
                          if tm>=TARGET_TS:R=M
                          else:L=M+1
                      if not errors:
                          H=L
                          rec["first_block_at_or_after_vote_end"]=H
                          rec["neighbors"]={}
                          for hh in range(H-3,H+4):
                              bb,raw=block(p,hh,25)
                              rec["neighbors"][str(hh)]=bb if bb else {"error":raw.get("error"),"status":raw.get("status")}
                          # consensus results around execution boundary
                          rec["block_results"]={}
                          for hh in (H-1,H,H+1,H+2):
                              rr=get(p.rstrip("/")+f"/block_results?height={hh}",25)
                              rec["block_results"][str(hh)]=rr
                      else:
                          rec["binary_errors"]=errors
                  break

          # Historical LCD alternatives: try blocks by height.
          lcd=[
            "https://lcd.archive.scrt.marionode.com",
            "https://scrt-lcd.blockpane.com",
            "https://secret-4.api.trivium.network:1317",
            "https://api.secret.forbole.com",
            "https://lcd.spartanapi.dev",
            "https://scrt-lcd.agoranodes.com",
          ]
          out["lcd_probe"]={}
          for p in lcd:
              # legacy tendermint blocks endpoint often does not require historical state.
              rows={}
              for h in (11840000,11860000,11880000,11900000):
                  rr=get(p.rstrip("/")+f"/cosmos/base/tendermint/v1beta1/blocks/{h}",15)
                  if not rr["ok"]:
                      rr2=get(p.rstrip("/")+f"/blocks/{h}",15)
                      rr=rr2
                  rows[str(h)]=rr
              out["lcd_probe"][p]=rows

          print("SECRET_T0_V06_BEGIN")
          print(json.dumps(out,indent=2,sort_keys=True)[:900000])
          print("SECRET_T0_V06_END")
          PY
