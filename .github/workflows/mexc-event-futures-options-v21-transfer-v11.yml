name: MEXC Event Futures Options V2.1 Transfer V1.1

on:
  push:
    branches:
      - mexc-event-futures-options-transfer-v1.1-2026-10-02
    paths:
      - 'research/mexc_event_futures/**'
      - '.github/workflows/mexc-event-futures-options-v21-transfer-v11.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  options-transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install
        run: python -m pip install --upgrade pip requests scipy

      - name: Syntax check
        run: python -m py_compile research/mexc_event_futures/options_v21_transfer_v11.py

      - name: Download immutable discovery signal artifact
        uses: actions/download-artifact@v4
        with:
          name: options-spotperp-001-discovery-v01-34858777691-1
          path: prior/discovery
          github-token: ${{ github.token }}
          repository: joseluisvieira28-oss/Laboratorio
          run-id: 34858777691

      - name: Download immutable 2025 OOS signal artifact
        uses: actions/download-artifact@v4
        with:
          name: options-spotperp-001-v21-oos-2025-35231711508-1
          path: prior/oos
          github-token: ${{ github.token }}
          repository: joseluisvieira28-oss/Laboratorio
          run-id: 35231711508

      - name: Verify frozen artifact file identities
        shell: bash
        run: |
          set -euo pipefail
          test -f prior/discovery/OPTIONS_SPOTPERP_001_DISCOVERY_LEDGER_V01.csv
          test -f prior/oos/v21_oos_output_2025/OPTIONS_SPOTPERP_001_V21_2025_OOS_LEDGER_V01.csv
          echo 'DISCOVERY_ROWS='$(($(wc -l < prior/discovery/OPTIONS_SPOTPERP_001_DISCOVERY_LEDGER_V01.csv)-1))
          echo 'OOS_ROWS='$(($(wc -l < prior/oos/v21_oos_output_2025/OPTIONS_SPOTPERP_001_V21_2025_OOS_LEDGER_V01.csv)-1))
          echo 'PRIOR_SIGNAL_ARTIFACTS=PASS'

      - name: Run frozen V1.1 short-horizon transfer
        run: |
          python research/mexc_event_futures/options_v21_transfer_v11.py \
            --discovery-ledger prior/discovery/OPTIONS_SPOTPERP_001_DISCOVERY_LEDGER_V01.csv \
            --oos-ledger prior/oos/v21_oos_output_2025/OPTIONS_SPOTPERP_001_V21_2025_OOS_LEDGER_V01.csv \
            --output artifacts/mexc_event_futures

      - name: Verify fail-closed boundaries
        shell: bash
        run: |
          python - <<'PY'
          import json
          j=json.load(open('artifacts/mexc_event_futures/options_v21_transfer_v11.json',encoding='utf-8'))
          assert j['year_2026']=='LOCKED_NOT_FETCHED_OR_SCORED'
          assert j['source_unobservable_horizons_min']==[10]
          assert j['nonindependent_reference_horizons_min']==[1440]
          assert j['primary_horizons_min']==[30,60]
          assert j['exact_event_futures']=='NOT_PROVEN'
          assert j['authenticated_requests']==0 and j['orders']==0 and j['account_mutations']==0
          if len(j['bh_selected_horizons'])==0:
              assert j['oos_price_source_accessed'] is False
          print('GOVERNANCE=PASS')
          print('VERDICT='+j['verdict'])
          print('BH_SELECTED='+str(len(j['bh_selected_horizons'])))
          print('OOS_SOURCE_OPENED='+str(j['oos_price_source_accessed']))
          print('SURVIVORS='+str(len(j['survivors'])))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: mexc-event-futures-options-v21-transfer-v11
          path: artifacts/mexc_event_futures/options_v21_transfer_v11.json
          if-no-files-found: error
