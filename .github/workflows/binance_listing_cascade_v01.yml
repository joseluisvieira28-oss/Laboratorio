name: Binance Listing Cascade V0.1
on:
  push:
    branches:
      - binance-listing-information-cascade-v0.1-prereg-2026-10-05
    paths:
      - 'research/binance_listing_information_cascade/run_v01.py'
      - '.github/workflows/binance_listing_cascade_v01.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  discovery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: binance-listing-information-cascade-v0.1-prereg-2026-10-05
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run frozen discovery
        run: python research/binance_listing_information_cascade/run_v01.py
      - name: Persist immutable result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/binance_listing_information_cascade/results
          git diff --cached --quiet && exit 0
          git commit -m "Record Binance listing cascade V0.1 frozen discovery result"
          git push

# V0.1.1 source retrieval remediation trigger
