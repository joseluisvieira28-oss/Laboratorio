name: Bitwise Forward Source Capture V0.1
on:
  workflow_dispatch:
  push:
    branches: [crypto-index-rebalance-forced-flow-001-audit-v0.3-2026-10-06]
    paths: ['research/index_rebalance_forced_flow/capture_bitwise_forward_source.py']
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python research/index_rebalance_forced_flow/capture_bitwise_forward_source.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bitwise-forward-source-capture
          path: bitwise_forward_source
          retention-days: 90
