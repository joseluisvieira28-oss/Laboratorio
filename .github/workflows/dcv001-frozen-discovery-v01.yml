name: DCV-001 Frozen Discovery V0.1

on:
  push:
    branches:
      - dcv001-funding-oi-vol-interaction-v0.1
    paths:
      - research/dcv001/DCV001_FROZEN_RUNNER_V0.1.py
      - research/dcv001/DCV001_PREOUTCOME_AMENDMENT_A_V0.1.md
      - .github/workflows/dcv001-frozen-discovery-v01.yml

permissions:
  contents: read

jobs:
  frozen-run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout isolated branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install frozen numerical dependency
        run: python -m pip install --disable-pip-version-check "numpy==2.1.3"

      - name: Compile frozen runner
        run: python -m py_compile research/dcv001/DCV001_FROZEN_RUNNER_V0.1.py

      - name: Execute full source census and frozen conditional research ladder
        id: frozen
        continue-on-error: true
        run: python research/dcv001/DCV001_FROZEN_RUNNER_V0.1.py

      - name: Emit governance-safe summary
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("dcv001_run_receipt.json")
          if not p.exists():
              raise SystemExit("FAIL_CLOSED: receipt missing")
          r=json.loads(p.read_text())
          d=r.get("discovery") or {}
          rp=r.get("replication_2024") or {}
          safe={
              "lab_id":r.get("lab_id"),
              "classification":r.get("classification"),
              "source_census_2021_2023":(r.get("source_census_2021_2023") or {}).get("classification"),
              "discovery_classification":d.get("classification"),
              "discovery_n":d.get("eligible_n"),
              "discovery_bFOV":d.get("primary_bFOV"),
              "discovery_bootstrap_95":d.get("bootstrap_95"),
              "replication_2024_full_source_accessed":r.get("replication_2024_full_source_accessed"),
              "replication_classification":rp.get("classification"),
              "replication_n":rp.get("eligible_n"),
              "replication_bFOV":rp.get("primary_bFOV"),
              "replication_bootstrap_90":rp.get("bootstrap_90"),
              "protected_2025_accessed":r.get("protected_2025_accessed"),
              "protected_2026_accessed":r.get("protected_2026_accessed"),
              "pnl_computed":r.get("pnl_computed"),
              "errors":r.get("errors",[]),
              "receipt_sha256":r.get("receipt_sha256"),
          }
          print(json.dumps(safe,sort_keys=True))
          PY

      - name: Upload immutable run receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dcv001-frozen-run-v01-receipt
          path: dcv001_run_receipt.json
          if-no-files-found: error
          retention-days: 30

      - name: Enforce technical fail-closed
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("dcv001_run_receipt.json")
          if not p.exists():
              raise SystemExit("FAIL_CLOSED: receipt missing")
          r=json.loads(p.read_text())
          if r.get("protected_2025_accessed") is not False or r.get("protected_2026_accessed") is not False:
              raise SystemExit("FAIL_CLOSED: protected period")
          if r.get("pnl_computed") is not False:
              raise SystemExit("FAIL_CLOSED: PnL firewall")
          allowed={
              "DISCOVERY_FAIL_NO_PROMOTION",
              "MECHANISM_REPLICATION_PASS_CANDIDATE",
              "REPLICATION_FAIL_NO_PROMOTION",
          }
          if r.get("classification") not in allowed:
              raise SystemExit("FAIL_CLOSED: technical/source failure")
          print(r["classification"])
          PY
