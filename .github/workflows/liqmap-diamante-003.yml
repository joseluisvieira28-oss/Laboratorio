name: LIQMAP-003 historical map forensic availability (NO TRADING)
on:
  pull_request:
    branches:
      - research/liqmap-diamante-002-forward-map-20261126
    paths:
      - research/liqmap-diamante-003/**
      - .github/workflows/liqmap-diamante-003.yml
permissions:
  contents: read
jobs:
  verify-historical-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Deterministic no-paid-data tests
        run: python -m unittest discover -s research/liqmap-diamante-003 -p 'test_*.py' -v
      - name: Audit authentic GitHub commits and free HF positions inventory
        run: python research/liqmap-diamante-003/inventory.py
      - name: Always archive source receipts, SHA256 and verdict
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: liqmap-003-historical-inventory-${{ github.run_id }}
          path: research/liqmap-diamante-003/results/
          if-no-files-found: warn
          retention-days: 90
  validate-actual-parquet:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Free PyArrow parquet schema inspection, no accounts
        run: python -m pip install --quiet 'pyarrow>=15,<30'
      - name: Verify 2025-07-29 and 2026-10-13 actual file sha256, liq price and as-of dates
        run: python research/liqmap-diamante-003/schema_sample.py
      - name: Archive result even if source unavailable
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: liqmap-003-two-parquet-schema-${{ github.run_id }}
          path: research/liqmap-diamante-003/schema_results/
          if-no-files-found: warn
          retention-days: 90
  historical-105-day-BTC:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Free local Parquet reader for public BTC snapshots only
        run: python -m pip install --quiet 'pyarrow>=15,<30'
      - name: No-lookahead and frozen dates tests
        run: python -m unittest discover -s research/liqmap-diamante-003 -p 'test_*.py' -v
      - name: Public 105 day snapshot source-hash and future 24h first-touch study
        run: python research/liqmap-diamante-003/backtest.py
      - name: Preserve every calendar day, blockers, source hashes and verdict
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: liqmap-003-105-day-BTC-historical-${{ github.run_id }}
          path: research/liqmap-diamante-003/backtest_results/
          if-no-files-found: warn
          retention-days: 90
