name: funding-shock-reset-v01-one-shot

on:
  push:
    branches:
      - funding-shock-reset-v0.1-prereg-2026-10-05
  workflow_dispatch:

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout frozen branch
        uses: actions/checkout@v4
        with:
          ref: funding-shock-reset-v0.1-prereg-2026-10-05

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install research dependencies
        run: python -m pip install --disable-pip-version-check numpy pandas requests

      - name: Run FUNDING-SHOCK-RESET-001 frozen test
        run: python research/funding_shock_reset/run_funding_shock_reset_v01.py

      - name: Upload scientific receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: funding-shock-reset-v01-receipts
          path: research/funding_shock_reset/results_v01/
          if-no-files-found: error
          retention-days: 30
