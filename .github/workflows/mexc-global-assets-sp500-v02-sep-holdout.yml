name: MEXC SP500 Basis V0.2 September Holdout

on:
  push:
    branches:
      - mexc-global-assets-sp500-basis-v0.2-sep-holdout-2026-10-04
    paths:
      - 'research/mexc_global_assets/GLOBAL_ASSET_SP500_HOLDOUT_RULE_V0.2.json'
      - 'research/mexc_global_assets/GLOBAL_ASSET_SP500_HOLDOUT_FREEZE_V0.2.md'
      - 'research/mexc_global_assets/global_asset_sp500_holdout_v02.py'
      - '.github/workflows/mexc-global-assets-sp500-v02-sep-holdout.yml'

permissions:
  contents: read

jobs:
  source-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependency
        run: python -m pip install --disable-pip-version-check requests

      - name: Bind frozen single-cell authority
        run: |
          test "$GITHUB_REF_NAME" = "mexc-global-assets-sp500-basis-v0.2-sep-holdout-2026-10-04"
          python -m py_compile research/mexc_global_assets/global_asset_sp500_holdout_v02.py
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          p=Path('research/mexc_global_assets/GLOBAL_ASSET_SP500_HOLDOUT_RULE_V0.2.json')
          x=json.loads(p.read_text())
          assert x['symbol']=='SPX500_USDT'
          assert x['signal_mode']=='FADE_BASIS_ONLY'
          assert x['threshold_bps']==5
          assert x['horizon_min']==15
          assert x['holdout_start']=='2026-09-01T00:00:00Z'
          assert x['holdout_end_exclusive']=='2026-10-01T00:00:00Z'
          assert x['no_parameter_rescue'] is True
          assert x['live_trading_authorized'] is False
          print('HOLDOUT_RULE_SHA256='+hashlib.sha256(p.read_bytes()).hexdigest())
          print('SINGLE_CELL_PRE_OUTCOME_FREEZE_PASS')
          PY

      - name: Fresh public no-auth MEXC source gate
        run: python research/mexc_global_assets/global_asset_source_probe_v01.py

      - name: Upload source gate
        uses: actions/upload-artifact@v4
        with:
          name: mexc-sp500-holdout-source-gate-v02-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/mexc_global_assets/source_gate_v01
          if-no-files-found: error
          retention-days: 90

  september-holdout:
    needs: source-gate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependency
        run: python -m pip install --disable-pip-version-check requests

      - name: Download exact fresh source receipt
        uses: actions/download-artifact@v4
        with:
          name: mexc-sp500-holdout-source-gate-v02-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/mexc_global_assets/source_gate_v02

      - name: Fail closed unless source gate is PASS
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('artifacts/mexc_global_assets/source_gate_v02/GLOBAL_ASSET_SOURCE_GATE_RECEIPT_V01.json')
          x=json.loads(p.read_text())
          assert x['verdict']=='MEXC_MARKET_SOURCE_PASS'
          assert x['outcomes_opened']==0
          assert x['auth_used'] is False
          assert x['private_endpoints_used'] is False
          assert x['account_reads'] is False
          assert x['orders'] is False
          assert x['exchange_mutation'] is False
          print('FRESH_SOURCE_GATE_PASS_BOUND')
          PY

      - name: Execute frozen single-cell September holdout
        run: python research/mexc_global_assets/global_asset_sp500_holdout_v02.py

      - name: Upload immutable holdout closeout
        uses: actions/upload-artifact@v4
        with:
          name: mexc-sp500-basis-sep-holdout-v02-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/mexc_global_assets/sp500_holdout_v02
          if-no-files-found: error
          retention-days: 90

      - name: Governance closeout
        run: |
          echo 'ONE CELL ONLY: SP500 / 5 BPS / 15M / FADE'
          echo 'NO OCTOBER 2026 OR LATER OUTCOME FETCH'
          echo 'NO PARAMETER RESCUE'
          echo 'NO PRIVATE ENDPOINTS / NO ACCOUNT READS / NO ORDERS / NO MUTATION'
          echo 'NO LIVE TRADING AUTHORIZATION'
