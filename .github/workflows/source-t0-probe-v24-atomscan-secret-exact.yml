name: source-t0-probe-v24-atomscan-secret-exact

on:
  push:
    branches:
      - cosmos-native-emission-param-shock-001-v0.2-t0-remediation-2026-10-07
    paths:
      - .github/workflows/source-t0-probe-v24-atomscan-secret-exact.yml

permissions:
  contents: read

jobs:
  atomscan-secret:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Resolve exact Secret ATOMScan routes and historical blockchain metadata
        shell: bash
        run: |
          python3 - <<'PY'
          import json,re,urllib.request,ssl
          UA={"User-Agent":"Mozilla/5.0 CryptoLab-source-only-v24"}
          def get(u,to=20):
            try:
              q=urllib.request.Request(u,headers=UA)
              with urllib.request.urlopen(q,timeout=to,context=ssl._create_unverified_context()) as r:
                raw=r.read().decode("utf-8","replace")
                try:d=json.loads(raw)
                except:d=raw
                return {"ok":True,"status":r.status,"url":r.geturl(),"data":d}
            except Exception as e:return {"ok":False,"url":u,"error":repr(e)[:500]}

          out={"scope":"SOURCE_ONLY_NO_MARKET_DATA"}
          chains=get("https://proxy.atomscan.com/chains.json")
          out["chains_ok"]=chains["ok"]
          exact=[]
          d=chains.get("data")
          def walk(x):
            if isinstance(x,dict):
              cid=str(x.get("chain_id") or x.get("chainId") or "")
              cname=str(x.get("chain_name") or x.get("name") or x.get("blockchain") or "")
              if cid=="secret-4" or cname.lower() in ("secretnetwork","secret-network","secret"):
                exact.append(x)
              for v in x.values(): walk(v)
            elif isinstance(x,list):
              for v in x: walk(v)
          walk(d)
          def compact(x):
            keys=["chain_id","chainId","chain_name","name","blockchain","pretty_name","nodeURL","nodeUrl","rpc","rest","api","lcd","explorer","path"]
            y={k:x.get(k) for k in keys if k in x}
            if isinstance(x.get("apis"),dict):
              y["apis"]=x["apis"]
            return y
          out["exact_chain_records"]=[compact(x) for x in exact[:10]]

          jsr=get("https://atomscan.com/js/app.10c96008.js")
          js=jsr.get("data") if jsr.get("ok") and isinstance(jsr.get("data"),str) else ""
          out["js_ok"]=jsr["ok"]
          for needle in ["pickURLRPC","influxer.server.atomscan.com","server.atomscan.com","secret-network","secretnetwork"]:
            ctx=[];p=0
            while len(ctx)<12:
              p=js.lower().find(needle.lower(),p)
              if p<0:break
              ctx.append(js[max(0,p-1200):p+3500])
              p+=len(needle)
            out[needle]=ctx

          # Extract every explicit atomscan host and test metadata-only blockchain ranges
          urls=sorted(set(re.findall(r'https?://[^"\'\\ ]+',js)))
          hosts=[]
          for u in urls:
            if "atomscan" in u.lower():
              m=re.match(r'(https?://[^/]+/?(?:[^"\' ]*/?)?)',u)
              hosts.append(u)
          out["atomscan_urls"]=hosts[:200]

          # Conservative endpoint candidates derived from explicit hosts seen in bundle.
          bases=[]
          for u in hosts:
            m=re.match(r'(https?://[^/]+)',u)
            if m:bases.append(m.group(1))
          bases += ["https://influxer.server.atomscan.com","https://server.atomscan.com","https://proxy.atomscan.com"]
          bases=list(dict.fromkeys(bases))
          probes=[]
          for base in bases[:20]:
            for path in [
              "/secretnetwork/blockchain?minHeight=11752974&maxHeight=11752974",
              "/secret-network/blockchain?minHeight=11752974&maxHeight=11752974",
              "/secret/blockchain?minHeight=11752974&maxHeight=11752974",
              "/blockchain?chain=secretnetwork&minHeight=11752974&maxHeight=11752974",
              "/blockchain?blockchain=secretnetwork&minHeight=11752974&maxHeight=11752974",
            ]:
              r=get(base+path,8)
              if r["ok"]:
                probes.append({"url":base+path,"status":r.get("status"),"data":r.get("data")})
          out["successful_route_probes"]=probes[:100]
          print("ATOMSCAN_SECRET_V24_BEGIN")
          print(json.dumps(out,indent=2,sort_keys=True)[:700000])
          print("ATOMSCAN_SECRET_V24_END")
          PY
