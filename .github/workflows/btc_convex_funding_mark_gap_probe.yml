name: BTC-CONVEX-001 funding mark gap source probe

on:
  pull_request:
    paths:
      - 'labs/btc-convex-trend-capture-001/FUNDING_MARK_GAP_PROBE_TRIGGER.txt'
      - '.github/workflows/btc_convex_funding_mark_gap_probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Probe exact official daily mark-price gap coverage only
        run: python labs/btc-convex-trend-capture-001/funding_mark_gap_probe_v0_1.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: BTC-CONVEX-001-FUNDING-MARK-GAP-PROBE
          path: labs/btc-convex-trend-capture-001/evidence/FUNDING_MARK_GAP_PROBE_V0.1.json
