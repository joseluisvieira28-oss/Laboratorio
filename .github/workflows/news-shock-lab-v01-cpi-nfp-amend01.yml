name: News Shock Lab V0.1 CPI NFP Amendment 01

on:
  push:
    branches:
      - dream-account-phase-b-signal-research-v0.1

jobs:
  news-shock-v01-cpi-nfp-amend01:
    if: ${{ contains(github.event.head_commit.message, '[NEWS V01 AMEND01 RUN]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify original freeze and Amendment 01 before market data
        run: |
          cd Dream-Account-OS-v2.3-PARTIAL
          python -m pip install beautifulsoup4
          python -m compileall -q research
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          freeze_expected='55bba04ab42e1c457427a9ba87231c6ff4df52e9f0e083e320700618c38b2f70'
          amend_expected='bc729693b5d16624053e9a105193e7f9fbadd49cdb770c62fa12bb20d2c2bae1'
          manifest_expected='baececa93f922a71d328373c94109652c911deae6ae03e76ea4e23d3f8d90560'
          def verify(path, expected):
              raw=json.loads(Path(path).read_text())
              supplied=raw.pop('fingerprint')
              recomputed=hashlib.sha256(json.dumps(raw,sort_keys=True,separators=(',',':'),ensure_ascii=False).encode()).hexdigest()
              if supplied!=expected or recomputed!=expected:
                  raise SystemExit(f'FINGERPRINT BLOCK {path}')
              return raw
          freeze=verify('research/NEWS_SHOCK_LAB_V01_CPI_NFP_REPLICATION_FREEZE.json',freeze_expected)
          amend=verify('research/NEWS_SHOCK_LAB_V01_CONTROL_DATA_GAP_AMENDMENT_V0.1.json',amend_expected)
          if amend['bindings']['freeze_fingerprint']!=freeze_expected:
              raise SystemExit('AMENDMENT FREEZE BINDING BLOCK')
          if amend['bindings']['schedule_manifest_fingerprint']!=manifest_expected:
              raise SystemExit('AMENDMENT MANIFEST BINDING BLOCK')
          if amend['frozen_gap_policy']['minimum_valid_controls_after_skips']!=3:
              raise SystemExit('CONTROL MINIMUM BLOCK')
          if amend['frozen_gap_policy']['event_day_missing_any_required_pre_or_post_endpoint']!='FAIL_CLOSED_NO_EVENT_EXCLUSION':
              raise SystemExit('EVENT GAP POLICY BLOCK')
          if amend['frozen_gap_policy']['control_day_missing_any_required_pre_or_post_endpoint']!='CONTROL_INVALID_SKIP':
              raise SystemExit('CONTROL GAP POLICY BLOCK')
          if freeze['governance']['no_2026'] is not True:
              raise SystemExit('2026 FREEZE GUARD BLOCK')
          print('NEWS V0.1 AMEND01 PRE-DATA AUTHORITY PASS')
          print('FREEZE',freeze_expected)
          print('AMENDMENT',amend_expected)
          print('EXPECTED_MANIFEST',manifest_expected)
          PY

      - name: Rebuild and bind exact official BLS schedule manifest
        run: |
          cd Dream-Account-OS-v2.3-PARTIAL
          mkdir -p research/local_data/news_v01_amend01_output
          python research/news_shock_lab_v01_bls_schedule.py \
            research/local_data/news_v01_amend01_output/bls_schedule_manifest.json \
            | tee research/local_data/news_v01_amend01_output/bls_schedule_stdout.txt
          python - <<'PY'
          import json
          from pathlib import Path
          expected='baececa93f922a71d328373c94109652c911deae6ae03e76ea4e23d3f8d90560'
          p=Path('research/local_data/news_v01_amend01_output/bls_schedule_manifest.json')
          m=json.loads(p.read_text())
          if m['fingerprint']!=expected:
              raise SystemExit(f'BLS MANIFEST DRIFT {m["fingerprint"]} != {expected}')
          if m['event_counts']!={'CPI':56,'NFP':56} or m['event_count_total']!=112:
              raise SystemExit('BLS MANIFEST CARDINALITY BLOCK')
          print('BLS MANIFEST EXACT BIND PASS',expected)
          PY

      - name: Reacquire exact official Binance event and control corpus
        run: |
          cd Dream-Account-OS-v2.3-PARTIAL
          python - <<'PY'
          from concurrent.futures import ThreadPoolExecutor, as_completed
          import json, time
          from pathlib import Path
          from urllib.error import HTTPError, URLError
          from urllib.request import Request, urlopen
          from research.news_shock_lab_v01_cpi_nfp_runner import load_manifest, required_days, SYMBOLS

          manifest_path=Path('research/local_data/news_v01_amend01_output/bls_schedule_manifest.json')
          manifest=load_manifest(manifest_path)
          if manifest['fingerprint']!='baececa93f922a71d328373c94109652c911deae6ae03e76ea4e23d3f8d90560':
              raise SystemExit('BOUND MANIFEST BLOCK')
          days=required_days(manifest)
          if len(days)!=499:
              raise SystemExit(f'REQUIRED DAY CARDINALITY DRIFT {len(days)} != 499')
          if any(day.startswith('2026-') for day in days):
              raise SystemExit('2026 MARKET DAY GUARD BLOCK')
          root=Path('research/local_data/news_v01_amend01_binance_raw')
          root.mkdir(parents=True,exist_ok=True)
          tasks=[]
          for symbol in SYMBOLS:
              d=root/symbol
              d.mkdir(parents=True,exist_ok=True)
              for day in days:
                  filename=f'{symbol}-1m-{day}.zip'
                  url=f'https://data.binance.vision/data/spot/daily/klines/{symbol}/1m/{filename}'
                  tasks.append((url,d/filename))
                  tasks.append((url+'.CHECKSUM',d/(filename+'.CHECKSUM')))

          def one(task):
              url,path=task
              last=None
              for attempt in range(1,5):
                  try:
                      req=Request(url,headers={'User-Agent':'DreamAccountOS-NewsShockV01-Amend01/0.1'})
                      with urlopen(req,timeout=45) as response:
                          if response.status!=200:
                              raise RuntimeError(f'HTTP {response.status}')
                          data=response.read()
                      if not data:
                          raise RuntimeError('empty response')
                      path.write_bytes(data)
                      return str(path),len(data),None
                  except (HTTPError,URLError,TimeoutError,OSError,RuntimeError) as exc:
                      last=f'{type(exc).__name__}: {exc}'
                      if attempt<4:
                          time.sleep(min(2**attempt,8))
              return str(path),0,last

          failures=[]; completed=0; total_bytes=0
          with ThreadPoolExecutor(max_workers=24) as pool:
              futures=[pool.submit(one,t) for t in tasks]
              for future in as_completed(futures):
                  path,size,error=future.result()
                  completed+=1; total_bytes+=size
                  if error:
                      failures.append({'path':path,'error':error})
                  if completed%250==0 or completed==len(tasks):
                      print(f'NEWS V0.1 AMEND01 acquisition {completed}/{len(tasks)} failures={len(failures)}')
          receipt={
              'document_type':'NEWS_SHOCK_LAB_V01_AMEND01_BINANCE_ACQUISITION_RECEIPT',
              'version':'0.1',
              'status':'PASS' if not failures else 'FAILED_CLOSED',
              'schedule_manifest_fingerprint':manifest['fingerprint'],
              'control_gap_amendment_fingerprint':'bc729693b5d16624053e9a105193e7f9fbadd49cdb770c62fa12bb20d2c2bae1',
              'market_days':len(days),
              'symbols':list(SYMBOLS),
              'expected_archives':len(days)*len(SYMBOLS),
              'expected_checksums':len(days)*len(SYMBOLS),
              'expected_files_total':len(tasks),
              'files_downloaded':completed-len(failures),
              'failure_count':len(failures),
              'first_failures':failures[:20],
              'total_bytes_downloaded':total_bytes,
              'holdout_2026_accessed':False,
              'mexc_2025_09_through_2025_12_accessed':False,
              'exchange_mutation_performed':False,
              'live_trading_performed':False,
          }
          out=Path('research/local_data/news_v01_amend01_output/news_v01_amend01_acquisition_receipt.json')
          out.write_text(json.dumps(receipt,indent=2,sort_keys=True)+'\n')
          print(json.dumps(receipt,indent=2,sort_keys=True))
          if failures:
              raise SystemExit(f'NEWS V0.1 AMEND01 acquisition failed closed: {len(failures)} files')
          PY

      - name: Run frozen CPI NFP replication with Amendment 01 only
        run: |
          cd Dream-Account-OS-v2.3-PARTIAL
          set -o pipefail
          python -m research.news_shock_lab_v01_cpi_nfp_runner_amend01 \
            research/local_data/news_v01_amend01_binance_raw \
            research/local_data/news_v01_amend01_output/bls_schedule_manifest.json \
            research/local_data/news_v01_amend01_output/news_v01_cpi_nfp_amend01_receipt.json \
            | tee research/local_data/news_v01_amend01_output/news_v01_amend01_runner_stdout.txt

      - name: Upload News Shock V0.1 Amendment 01 receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: news-shock-v01-cpi-nfp-amend01-${{ github.sha }}
          path: |
            Dream-Account-OS-v2.3-PARTIAL/research/local_data/news_v01_amend01_output/bls_schedule_manifest.json
            Dream-Account-OS-v2.3-PARTIAL/research/local_data/news_v01_amend01_output/bls_schedule_stdout.txt
            Dream-Account-OS-v2.3-PARTIAL/research/local_data/news_v01_amend01_output/news_v01_amend01_acquisition_receipt.json
            Dream-Account-OS-v2.3-PARTIAL/research/local_data/news_v01_amend01_output/news_v01_cpi_nfp_amend01_receipt.json
            Dream-Account-OS-v2.3-PARTIAL/research/local_data/news_v01_amend01_output/news_v01_amend01_runner_stdout.txt
          if-no-files-found: warn
          retention-days: 14
