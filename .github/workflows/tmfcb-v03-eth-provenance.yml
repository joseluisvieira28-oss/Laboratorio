name: TMFCB V0.3 Ethereum Provenance Probe

on:
  push:
    branches:
      - token-migration-forced-conversion-basis-001-v0.3-machine-provenance-2026-10-07
    paths:
      - "research/token_migration_forced_conversion_basis/tools/tmfcb_v03_eth_provenance_probe.py"
      - ".github/workflows/tmfcb-v03-eth-provenance.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  provenance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Run price-blind Ethereum provenance probe
        run: |
          mkdir -p research/token_migration_forced_conversion_basis/evidence/v03
          python research/token_migration_forced_conversion_basis/tools/tmfcb_v03_eth_provenance_probe.py | tee research/token_migration_forced_conversion_basis/evidence/v03/eth_provenance_probe.json
      - name: Upload provenance evidence
        uses: actions/upload-artifact@v4
        with:
          name: tmfcb-v03-eth-provenance
          path: research/token_migration_forced_conversion_basis/evidence/v03/eth_provenance_probe.json
