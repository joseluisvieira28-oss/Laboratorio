name: Bitget Maker Microstructure Source V0.1

on:
  push:
    branches:
      - bitget-maker-microstructure-v0.1-source-gate-2026-10-05

permissions:
  contents: read

jobs:
  source-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependency
        run: python -m pip install --disable-pip-version-check requests
      - name: Freeze check
        run: |
          test "$GITHUB_REF_NAME" = "bitget-maker-microstructure-v0.1-source-gate-2026-10-05"
          test -f research/cross_venue_stock/BITGET_MAKER_MICROSTRUCTURE_SOURCE_CONFIG_V0.1.json
          test -f research/cross_venue_stock/BITGET_MAKER_MICROSTRUCTURE_SOURCE_FREEZE_V0.1.md
          python -m py_compile research/cross_venue_stock/bitget_maker_microstructure_source_v01.py
          echo BITGET_MICROSTRUCTURE_SOURCE_PRE_OUTCOME_FREEZE_PASS
      - name: Run source probe
        run: python research/cross_venue_stock/bitget_maker_microstructure_source_v01.py
      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: bitget-maker-microstructure-source-v01-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/cross_venue_stock/bitget_maker_microstructure_source_v01
          if-no-files-found: error
          retention-days: 90
