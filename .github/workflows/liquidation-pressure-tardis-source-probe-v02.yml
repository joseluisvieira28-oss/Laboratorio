name: Liquidation Pressure — Tardis Source Probe V0.2

on:
  push:
    branches:
      - liquidation-pressure-tardis-source-v0.2
    paths:
      - .github/liquidation-pressure-tardis-source-v02.trigger

permissions:
  contents: read

jobs:
  source_probe_v02:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: liquidation-pressure-tardis-source-v0.2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --disable-pip-version-check requests
      - name: Verify frozen source-only authority
        run: |
          python - <<'PY'
          import json
          a=json.load(open('labs/LIQUIDATION_PRESSURE_001/TARDIS_SOURCE_PROBE_AUTHORITY_V0.2.json'))
          assert a['probe_id']=='LP-TARDIS-SOURCE-PROBE-002'
          assert a['status']=='FROZEN_SOURCE_ONLY_OUTCOME_BLIND'
          assert all(int(d[:4]) < 2025 for d in a['sample_dates'])
          assert all(v is False for k,v in a['safety'].items() if k.endswith('_authorized'))
          print('LIQUIDATION_PRESSURE_TARDIS_SOURCE_AUTHORITY_PASS')
          PY
      - name: Compile source probe
        run: python -m py_compile labs/LIQUIDATION_PRESSURE_001/tardis_source_probe_v02.py
      - name: Execute free-sample source feasibility probe
        run: python labs/LIQUIDATION_PRESSURE_001/tardis_source_probe_v02.py
      - name: Upload immutable source-probe receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LIQUIDATION_PRESSURE_001_TARDIS_SOURCE_PROBE_V0_2
          path: artifacts/liquidation_pressure_tardis_source_probe_v02/
          retention-days: 90
          if-no-files-found: warn
