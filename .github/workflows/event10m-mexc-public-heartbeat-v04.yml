name: EVENT10M MEXC Public Index JSON Heartbeat V04
on:
  push:
    branches:
      - research/event10m-mexc-json-heartbeat-v04-2026-10-30
    paths:
      - .github/workflows/event10m-mexc-public-heartbeat-v04.yml
permissions:
  contents: read
jobs:
  public-source-heartbeat:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install public websocket runtime
        run: python -m pip install 'websockets>=12,<16'
      - name: Syntax and identical source price-asof parser tests
        run: |
          python -m py_compile research/mexc_event_direction_v01/event10m_mexc_json_heartbeat_v04.py
          python -c "import sys;sys.path.insert(0,'research/mexc_event_direction_v01');import event10m_mexc_json_heartbeat_v04 as x;x.test_parsers();x.parity_tests();print('ASOF_TESTS_PASS')"
      - name: Single 180-second public WS observation with documented MEXC application JSON ping every 15s
        run: python research/mexc_event_direction_v01/event10m_mexc_json_heartbeat_v04.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: event10m-mexc-json-heartbeat-v04
          path: artifacts/event10m_mexc_json_heartbeat_v04/source_receipt.json
          if-no-files-found: warn
