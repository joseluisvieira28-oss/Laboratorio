name: CCLM-001 CCTP V1 transport smoke
on:
  push:
    branches: [crosschain-liquidity-migration-001-source-gate-v0.1]
    paths:
      - 'research/crosschain_liquidity_migration_001/cctp_v1_transport_smoke_v01.py'
      - '.github/workflows/cclm-001-cctp-v1-transport-smoke-v01.yml'
      - 'research/crosschain_liquidity_migration_001/CCLM_TRANSPORT_SMOKE_TRIGGER.txt'
permissions:
  contents: write
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {ref: crosschain-liquidity-migration-001-source-gate-v0.1}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python research/crosschain_liquidity_migration_001/cctp_v1_transport_smoke_v01.py
      - name: Persist receipt
        run: |
          cp artifacts/cclm_cctp_v1_transport_smoke_v01.json research/crosschain_liquidity_migration_001/CCTP_V1_TRANSPORT_SMOKE_RECEIPT.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/crosschain_liquidity_migration_001/CCTP_V1_TRANSPORT_SMOKE_RECEIPT.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "CCLM-001: record V1 historical transport smoke [skip ci]"
          git push origin HEAD:crosschain-liquidity-migration-001-source-gate-v0.1
      - uses: actions/upload-artifact@v4
        with:
          name: cclm-001-cctp-v1-transport-smoke-v01
          path: artifacts/cclm_cctp_v1_transport_smoke_v01.json
          if-no-files-found: error
