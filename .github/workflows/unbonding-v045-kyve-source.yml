name: Unbonding V0.4.5 KYVE Trustless Source

on:
  push:
    branches:
      - pos-unbonding-completion-001-v0.4-index-free-census-2026-10-07
    paths:
      - "research/pos_unbonding_completion_001_v0_4_index_free/v045_kyve_trustless_probe.py"
      - ".github/workflows/unbonding-v045-kyve-source.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pos-unbonding-completion-001-v0.4-index-free-census-2026-10-07
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify KYVE bundles against independent archives
        run: python research/pos_unbonding_completion_001_v0_4_index_free/v045_kyve_trustless_probe.py
      - name: Commit receipt
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/pos_unbonding_completion_001_v0_4_index_free/KYVE_TRUSTLESS_SOURCE_PROBE_V045.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record V0.4.5 KYVE trustless source probe"
          git pull --rebase origin pos-unbonding-completion-001-v0.4-index-free-census-2026-10-07
          git push origin HEAD:pos-unbonding-completion-001-v0.4-index-free-census-2026-10-07
