name: DLS Protected 2025 Economic Holdout V0.1

on:
  push:
    branches: [dls-field-enrichment-v01]
    paths:
      - labs/DEFI_LIQUIDATION_SHOCK_001/LAUNCH_PROTECTED_2025_ECONOMIC_V01.marker

permissions:
  actions: read
  contents: read

jobs:
  holdout:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download immutable 2025 source authority
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 36545901561
          name: dls-protected-2025-source-authority-v01
          path: source_2025
      - name: Assert freezes and source authority before market access
        run: |
          test -f labs/DEFI_LIQUIDATION_SHOCK_001/STRATEGY_TRANSLATION_FREEZE_V0.1.md
          test -f labs/DEFI_LIQUIDATION_SHOCK_001/EXECUTION_COST_FREEZE_V0.1.md
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("source_2025/PROTECTED_2025_SOURCE_AUTHORITY_RECEIPT_V0.1.json")
          r=json.loads(p.read_text())
          assert r["classification"]=="PROTECTED_2025_SOURCE_AUTHORITY_PASS"
          assert r["firewall"]["prices_2025_opened"] is False
          assert r["firewall"]["prices_2026_opened"] is False
          PY
      - name: Compile frozen economic holdout
        run: python -m py_compile labs/DEFI_LIQUIDATION_SHOCK_001/source/run_protected_2025_economic_holdout_v0_1.py
      - name: Execute protected 2025 economic holdout
        run: >
          python labs/DEFI_LIQUIDATION_SHOCK_001/source/run_protected_2025_economic_holdout_v0_1.py
          --source-root source_2025
          --workers 16
      - name: Upload immutable 2025 economic receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dls-protected-2025-economic-holdout-v01
          path: |
            labs/DEFI_LIQUIDATION_SHOCK_001/PROTECTED_2025_ECONOMIC_HOLDOUT_RECEIPT_V0.1.json
            labs/DEFI_LIQUIDATION_SHOCK_001/PROTECTED_2025_ECONOMIC_MARKET_QA_V0.1.json
            labs/DEFI_LIQUIDATION_SHOCK_001/PROTECTED_2025_SERIALIZED_TRADES_V0.1.ndjson
          if-no-files-found: warn
          retention-days: 90
      - name: Firewall
        if: always()
        run: echo 2026_CLOSED_NO_TUNING_NO_TRADING_NO_MAIN_MERGE
