name: source-t0-probe-v33b-secret-gov-event-fast

on:
  workflow_dispatch:
  push:
    branches:
      - cosmos-native-emission-param-shock-001-v0.2-t0-remediation-2026-10-07
    paths:
      - .github/workflows/source-t0-probe-v33b-secret-gov-event-fast.yml

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cosmos-native-emission-param-shock-001-v0.2-t0-remediation-2026-10-07
      - name: Concurrent governance EndBlock event search
        shell: bash
        run: |
          python3 - <<'PY'
          import json,urllib.request,urllib.error,urllib.parse,ssl,hashlib,os,datetime,re
          from concurrent.futures import ThreadPoolExecutor

          OUT="research/cosmos_native_emission_param_shock_001_v0_2/SCRT287_GOV_EVENT_BLOCK_SEARCH_V33B.json"
          bases=[
            ("mario","https://rpc.archive.scrt.marionode.com"),
            ("ankr-http","https://rpc.ankr.com/http/scrt"),
            ("ankr-public","https://scrt.public-rpc.com"),
            ("lavender","https://secretnetwork-rpc.lavenderfive.com:443"),
            ("1rpc","https://1rpc.io/scrt-rpc"),
            ("01node","https://rpc-secret.01node.com"),
            ("highstakes","https://secretnetwork-rpc.highstakes.ch:26657"),
            ("stakewolle","https://public.stakewolle.com/cosmos/secretnetwork/rpc"),
            ("cosmosdir","https://rpc.cosmos.directory/secretnetwork"),
            ("trivium","https://secret-4.api.trivium.network:26657"),
          ]
          query="active_proposal.proposal_id='287' AND active_proposal.proposal_result='proposal_passed'"
          UA={"User-Agent":"CryptoLab-source-only-v33b","Accept":"application/json"}

          def req(name,base,transport):
            try:
              if transport=="GET":
                qs=urllib.parse.urlencode({"query":query,"page":"1","per_page":"100","order_by":"asc"})
                u=base+"/block_search?"+qs
                q=urllib.request.Request(u,headers=UA)
              else:
                u=base
                data=json.dumps({"jsonrpc":"2.0","id":1,"method":"block_search",
                                 "params":{"query":query,"page":"1","per_page":"100","order_by":"asc"}}).encode()
                h=dict(UA);h["Content-Type"]="application/json"
                q=urllib.request.Request(u,data=data,headers=h,method="POST")
              with urllib.request.urlopen(q,timeout=8,context=ssl._create_unverified_context()) as r:
                b=r.read()
                return {"provider":name,"base":base,"transport":transport,"ok":True,
                        "status":getattr(r,"status",200),"sha256":hashlib.sha256(b).hexdigest(),
                        "body":b.decode("utf-8","replace")[:600000]}
            except urllib.error.HTTPError as e:
              try:b=e.read()
              except:b=b""
              return {"provider":name,"base":base,"transport":transport,"ok":False,
                      "status":e.code,"error":str(e),"sha256":hashlib.sha256(b).hexdigest() if b else None,
                      "body":b.decode("utf-8","replace")[:30000]}
            except Exception as e:
              return {"provider":name,"base":base,"transport":transport,"ok":False,
                      "status":None,"error":repr(e),"body":""}

          jobs=[(n,b,t) for n,b in bases for t in ("GET","POST")]
          with ThreadPoolExecutor(max_workers=20) as ex:
            rows=list(ex.map(lambda x:req(*x),jobs))

          def walk(x):
            if isinstance(x,dict):
              yield x
              for v in x.values():yield from walk(v)
            elif isinstance(x,list):
              for v in x:yield from walk(v)
          def headers(body):
            try:d=json.loads(body)
            except:return []
            out=[]
            for x in walk(d):
              h=x.get("height");t=x.get("time")
              if h is None or t is None:continue
              try:hh=int(h)
              except:continue
              if 11000000<=hh<=13000000 and str(t).startswith("2023-"):
                z={"height":hh,"time":str(t),"hash":x.get("hash")}
                if z not in out:out.append(z)
            return out

          hits=[]
          for r in rows:
            r["blocks"]=headers(r.get("body",""))
            if r["blocks"]:
              hits.append({"provider":r["provider"],"base":r["base"],"transport":r["transport"],
                           "blocks":r["blocks"],"sha256":r.get("sha256"),"body_excerpt":r.get("body","")[:12000]})
            r["body_excerpt"]=r.pop("body","")[:5000]

          out={"scope":"SOURCE_ONLY_NO_MARKET_DATA","query":query,
               "version_anchor":"scrtlabs/cosmos-sdk ea64f27dc58d",
               "event_semantics":"successful proposal finalization emits active_proposal with proposal_id=287 and proposal_result=proposal_passed in EndBlock",
               "tested_utc":datetime.datetime.now(datetime.timezone.utc).isoformat(),
               "rows":rows,"event_hits":hits}
          os.makedirs(os.path.dirname(OUT),exist_ok=True)
          with open(OUT,"w") as f:json.dump(out,f,indent=2)
          print("V33B",json.dumps({"hits":[{"provider":x["provider"],"blocks":x["blocks"]} for x in hits]}))
          PY
      - name: Persist
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/cosmos_native_emission_param_shock_001_v0_2/SCRT287_GOV_EVENT_BLOCK_SEARCH_V33B.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "SCRT287: persist fast gov-event search v33b"
          git pull --rebase origin cosmos-native-emission-param-shock-001-v0.2-t0-remediation-2026-10-07
          git push origin HEAD:cosmos-native-emission-param-shock-001-v0.2-t0-remediation-2026-10-07
