name: source-t0-probe-v43-secret-consensus-height-global-search

on:
  workflow_dispatch:
  push:
    branches:
      - cosmos-native-emission-param-shock-001-v0.2-t0-remediation-2026-10-07
    paths:
      - .github/workflows/source-t0-probe-v43-secret-consensus-height-global-search.yml

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cosmos-native-emission-param-shock-001-v0.2-t0-remediation-2026-10-07

      - name: Search all IBC clients by exact consensus heights
        shell: bash
        run: |
          python3 - <<'PY'
          import json, urllib.request, urllib.error, ssl, hashlib, os, datetime

          OUT="research/cosmos_native_emission_param_shock_001_v0_2/SCRT287_GLOBAL_CONSENSUS_HEIGHT_SEARCH_V43.json"
          CARRIERS=[
            ("osmosis","https://rpc.archive.osmosis.zone"),
            ("cosmoshub","https://rpc.cosmoshub-4-archive.citizenweb3.com"),
          ]
          HEIGHTS=[11880918,11880919,11880920,11880921,11880922]
          TARGET_NS=1701917698930543213
          UA={"User-Agent":"CryptoLab-source-only-secret-v43","Accept":"application/json"}

          def post(base,payload,to=20):
              data=json.dumps(payload).encode()
              q=urllib.request.Request(base,data=data,headers={**UA,"Content-Type":"application/json"},method="POST")
              try:
                  with urllib.request.urlopen(q,timeout=to,context=ssl._create_unverified_context()) as r:
                      b=r.read()
                      return {"ok":True,"status":r.status,"sha256":hashlib.sha256(b).hexdigest(),"raw":b}
              except urllib.error.HTTPError as e:
                  try:b=e.read()
                  except:b=b""
                  return {"ok":False,"status":e.code,"error":str(e),"raw":b}
              except Exception as e:
                  return {"ok":False,"status":None,"error":repr(e),"raw":b""}

          def varint(b,i):
              x=0;s=0
              while True:
                  c=b[i];i+=1;x|=(c&127)<<s
                  if not c&128:return x,i
                  s+=7
          def fields(b):
              i=0;o=[]
              while i<len(b):
                  try:k,i=varint(b,i)
                  except:break
                  n,w=k>>3,k&7
                  if w==0:
                      v,i=varint(b,i);o.append((n,w,v))
                  elif w==1:
                      if i+8>len(b):break
                      o.append((n,w,b[i:i+8]));i+=8
                  elif w==2:
                      ln,i=varint(b,i)
                      if i+ln>len(b):break
                      o.append((n,w,b[i:i+ln]));i+=ln
                  elif w==5:
                      if i+4>len(b):break
                      o.append((n,w,b[i:i+4]));i+=4
                  else:break
              return o
          def fget(fs,n,w=None):
              for a,b,c in fs:
                  if a==n and (w is None or b==w):return c
              return None
          def decode(hx):
              af=fields(bytes.fromhex(hx));v=fget(af,2,2);hf=fields(v);sh=fget(hf,1,2)
              sf=fields(sh);hd=fget(sf,1,2);tf=fields(hd)
              chain=fget(tf,2,2).decode();height=int(fget(tf,3,0));tm=fget(tf,4,2)
              tfs=fields(tm);sec=int(fget(tfs,1,0));nano=int(fget(tfs,2,0) or 0)
              dt=datetime.datetime.fromtimestamp(sec,tz=datetime.timezone.utc)
              ts=dt.strftime("%Y-%m-%dT%H:%M:%S")+("."+(f"{nano:09d}").rstrip("0") if nano else "")+"Z"
              return {"chain_id":chain,"height":height,"time":ts,"time_ns":sec*10**9+nano,
                      "header_hex_sha256":hashlib.sha256(bytes.fromhex(hx)).hexdigest()}

          searches=[]
          recovered=[]
          for cname,base in CARRIERS:
              for h in HEIGHTS:
                  qstr=f"update_client.consensus_height='4-{h}'"
                  payload={"jsonrpc":"2.0","id":1,"method":"tx_search",
                           "params":{"query":qstr,"prove":False,"page":"1","per_page":"100","order_by":"asc"}}
                  r=post(base,payload,25)
                  row={"carrier":cname,"height":h,"query":qstr,"ok":r["ok"],"status":r.get("status"),
                       "sha256":r.get("sha256"),"error":r.get("error"),"matches":[]}
                  if r["ok"]:
                      try:d=json.loads(r["raw"]);txs=(d.get("result") or {}).get("txs") or []
                      except Exception as e:
                          row["parse_error"]=repr(e);txs=[]
                      for tx in txs:
                          for ev in (tx.get("tx_result") or {}).get("events") or []:
                              if ev.get("type")!="update_client":continue
                              aa={a.get("key"):a.get("value") for a in ev.get("attributes") or []}
                              if aa.get("consensus_height")!=f"4-{h}":continue
                              hx=aa.get("header");dh=None;err=None
                              if hx:
                                  try:dh=decode(hx)
                                  except Exception as e:err=repr(e)
                              rec={"carrier":cname,"carrier_height":int(tx["height"]),"carrier_tx_hash":tx.get("hash"),
                                   "client_id":aa.get("client_id"),"consensus_height":aa.get("consensus_height"),
                                   "decoded_header":dh,"decode_error":err}
                              row["matches"].append(rec)
                              if dh and dh.get("chain_id")=="secret-4":
                                  recovered.append(rec)
                  searches.append(row)

          secret_headers=[]
          for r in recovered:
              h=r["decoded_header"]
              secret_headers.append({**h,"carrier":r["carrier"],"client_id":r["client_id"],
                                     "carrier_height":r["carrier_height"],"carrier_tx_hash":r["carrier_tx_hash"]})
          uniq={(x["height"],x["time"]):x for x in secret_headers}
          secret_headers=sorted(uniq.values(),key=lambda x:x["height"])

          # Add known anchor at 917 from V38B, then find first >= target.
          known=[{"height":11880917,"time":"2023-12-07T02:54:47.127200661Z","time_ns":1701917687127200661,
                  "carrier":"osmosis","source":"V38B"}]+secret_headers
          known=sorted(known,key=lambda x:x["height"])
          before=[x for x in known if x["time_ns"]<TARGET_NS]
          after=[x for x in known if x["time_ns"]>=TARGET_NS]
          lo=max(before,key=lambda x:x["height"]) if before else None
          hi=min(after,key=lambda x:x["height"]) if after else None
          exact=None
          if lo and hi and hi["height"]==lo["height"]+1:
              exact={"H_vote_end_block":hi["height"],"T0_first_new_param_mint_block":hi["height"]+1,
                     "H_minus_1":lo,"H":hi,"boundary_verified":True,
                     "proof_type":"exact consensus-height lookup across all indexed IBC clients on archive carrier chains"}

          out={"scope":"SOURCE_ONLY_NO_MARKET_DATA","target_voting_end":"2023-12-07T02:54:58.930543213Z",
               "tested_utc":datetime.datetime.now(datetime.timezone.utc).isoformat(),
               "searched_heights":HEIGHTS,"searches":searches,
               "recovered_secret_headers":secret_headers,
               "combined_nearest":{"lo":lo,"hi":hi} if lo and hi else None,
               "exact_candidate":exact}
          os.makedirs(os.path.dirname(OUT),exist_ok=True)
          with open(OUT,"w") as f:json.dump(out,f,indent=2)
          print("V43",json.dumps({"headers":secret_headers,"nearest":out["combined_nearest"],"exact":exact}))
          PY

      - name: Persist V43
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/cosmos_native_emission_param_shock_001_v0_2/SCRT287_GLOBAL_CONSENSUS_HEIGHT_SEARCH_V43.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "SCRT287: persist global consensus-height IBC search v43"
          git pull --rebase origin cosmos-native-emission-param-shock-001-v0.2-t0-remediation-2026-10-07
          git push origin HEAD:cosmos-native-emission-param-shock-001-v0.2-t0-remediation-2026-10-07
