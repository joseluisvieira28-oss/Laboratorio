name: MEXC Hyperliquid SP500 Source Gate V0.3.1

on:
  push:
    branches:
      - mexc-global-assets-hyperliquid-crossvenue-v0.3-source-gate-2026-10-04
    paths:
      - 'research/mexc_global_assets/MEXC_HYPERLIQUID_SP500_SOURCE_GATE_V0.3.md'
      - 'research/mexc_global_assets/mexc_hyperliquid_sp500_source_probe_v03.py'
      - '.github/workflows/mexc-hyperliquid-sp500-source-gate-v03.yml'

permissions:
  contents: read

jobs:
  source-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install public-source dependency
        run: python -m pip install --disable-pip-version-check requests

      - name: Governance preflight
        run: |
          test "$GITHUB_REF_NAME" = "mexc-global-assets-hyperliquid-crossvenue-v0.3-source-gate-2026-10-04"
          python -m py_compile research/mexc_global_assets/mexc_hyperliquid_sp500_source_probe_v03.py
          grep -q 'SOURCE ONLY' research/mexc_global_assets/MEXC_HYPERLIQUID_SP500_SOURCE_GATE_V0.3.md
          grep -q 'OUTCOMES CLOSED' research/mexc_global_assets/MEXC_HYPERLIQUID_SP500_SOURCE_GATE_V0.3.md
          echo 'SOURCE_GATE_PREOUTCOME_PASS'

      - name: Execute MEXC Hyperliquid public source binding
        run: python research/mexc_global_assets/mexc_hyperliquid_sp500_source_probe_v03.py

      - name: Upload immutable source evidence
        uses: actions/upload-artifact@v4
        with:
          name: mexc-hyperliquid-sp500-source-gate-v03-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/mexc_global_assets/hyperliquid_source_gate_v03
          if-no-files-found: error
          retention-days: 90

      - name: Governance closeout
        run: |
          echo 'SOURCE ONLY'
          echo 'NO HISTORICAL OUTCOMES / NO LEAD-LAG SCORING'
          echo 'NO ACCOUNT / WALLET / PRIVATE ENDPOINT'
          echo 'NO ORDERS / NO MUTATION / NO LIVE TRADING'
