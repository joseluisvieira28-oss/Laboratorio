name: source-t0-probe-v37b-secret-wayback-fast

on:
  workflow_dispatch:
  push:
    branches:
      - cosmos-native-emission-param-shock-001-v0.2-t0-remediation-2026-10-07
    paths:
      - .github/workflows/source-t0-probe-v37b-secret-wayback-fast.yml

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cosmos-native-emission-param-shock-001-v0.2-t0-remediation-2026-10-07
      - name: Fast Wayback endpoint census and targeted replay
        shell: bash
        run: |
          python3 - <<'PY'
          import json,urllib.request,urllib.error,urllib.parse,hashlib,os,datetime,re
          from concurrent.futures import ThreadPoolExecutor

          OUT="research/cosmos_native_emission_param_shock_001_v0_2/SCRT287_WAYBACK_ENDPOINT_ARCHIVE_V37B.json"
          UA={"User-Agent":"CryptoLab-source-only-secret-v37b","Accept":"application/json,*/*"}
          pats=[
            ("secret-express-block","rpc.secret.express/block*"),
            ("secret-express-commit","rpc.secret.express/commit*"),
            ("secret-express-chain","rpc.secret.express/blockchain*"),
            ("secret-express-gov","lcd.secret.express/cosmos/gov/v1beta1/proposals/287*"),
            ("blockpane-block","scrt-rpc.blockpane.com/block*"),
            ("blockpane-commit","scrt-rpc.blockpane.com/commit*"),
            ("trivium-block","secret-4.api.trivium.network:26657/block*"),
            ("secretnodes-block","secretnodes.com/secret/chains/secret-4/block*"),
          ]

          def get(u,to=12):
            try:
              q=urllib.request.Request(u,headers=UA)
              with urllib.request.urlopen(q,timeout=to) as r:
                b=r.read()
                return {"ok":True,"status":getattr(r,"status",200),"url":r.geturl(),
                        "sha256":hashlib.sha256(b).hexdigest(),"body":b.decode("utf-8","replace")[:400000]}
            except urllib.error.HTTPError as e:
              try:b=e.read()
              except:b=b""
              return {"ok":False,"status":e.code,"url":u,"error":str(e),
                      "sha256":hashlib.sha256(b).hexdigest() if b else None,
                      "body":b.decode("utf-8","replace")[:30000]}
            except Exception as e:return {"ok":False,"status":None,"url":u,"error":repr(e),"body":""}

          def census(x):
            name,pat=x
            q=urllib.parse.urlencode({"url":pat,"from":"20231201","to":"20231215","output":"json",
              "filter":"statuscode:200","collapse":"urlkey","limit":"500",
              "fl":"timestamp,original,statuscode,mimetype,digest"})
            r=get("https://web.archive.org/cdx/search/cdx?"+q,12)
            caps=[]
            if r["ok"]:
              try:
                d=json.loads(r["body"])
                if isinstance(d,list) and len(d)>1:
                  hdr=d[0];caps=[dict(zip(hdr,z)) for z in d[1:] if isinstance(z,list)]
              except:pass
            return {"name":name,"pattern":pat,"ok":r["ok"],"status":r.get("status"),
                    "sha256":r.get("sha256"),"error":r.get("error"),"captures":caps,
                    "body_excerpt":r.get("body","")[:6000]}

          with ThreadPoolExecutor(max_workers=8) as ex:
            reps=list(ex.map(census,pats))

          targets=[]
          for rep in reps:
            for cap in rep["captures"]:
              orig=cap.get("original","")
              nums=[int(x) for x in re.findall(r'(?<!\d)(1\d{7})(?!\d)',orig)]
              plausible=[h for h in nums if 11700000<=h<=12100000]
              if plausible or "proposals/287" in orig:
                targets.append({"source":rep["name"],**cap,"plausible_heights":plausible})

          def replay(cap):
            u="https://web.archive.org/web/"+cap["timestamp"]+"id_/"+cap["original"]
            r=get(u,12)
            pairs=[]
            if r["ok"]:
              try:
                d=json.loads(r["body"])
                def walk(x):
                  if isinstance(x,dict):
                    yield x
                    for v in x.values():yield from walk(v)
                  elif isinstance(x,list):
                    for v in x:yield from walk(v)
                for x in walk(d):
                  h=x.get("height");t=x.get("time")
                  if h is None or t is None:continue
                  try:hh=int(h)
                  except:continue
                  if re.match(r"\d{4}-\d{2}-\d{2}T",str(t)):
                    z={"height":hh,"time":str(t),"hash":x.get("hash")}
                    if z not in pairs:pairs.append(z)
              except:pass
            return {"capture":cap,"url":u,"ok":r["ok"],"status":r.get("status"),
                    "sha256":r.get("sha256"),"pairs":pairs,"error":r.get("error"),
                    "body_excerpt":r.get("body","")[:5000]}

          with ThreadPoolExecutor(max_workers=16) as ex:
            plays=list(ex.map(replay,targets[:40]))
          useful=[x for x in plays if x["pairs"]]

          out={"scope":"SOURCE_ONLY_NO_MARKET_DATA","target_voting_end":"2023-12-07T02:54:58.930543213Z",
               "tested_utc":datetime.datetime.now(datetime.timezone.utc).isoformat(),
               "reports":reps,"targeted_capture_count":len(targets),"replays":plays,
               "useful_replays":useful}
          os.makedirs(os.path.dirname(OUT),exist_ok=True)
          with open(OUT,"w") as f:json.dump(out,f,indent=2)
          print("V37B",json.dumps({"captures":{x["name"]:len(x["captures"]) for x in reps},
            "targets":len(targets),"useful":[{"original":x["capture"]["original"],"pairs":x["pairs"]} for x in useful]}))
          PY
      - name: Persist
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/cosmos_native_emission_param_shock_001_v0_2/SCRT287_WAYBACK_ENDPOINT_ARCHIVE_V37B.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "SCRT287: persist fast Wayback endpoint census v37b"
          git pull --rebase origin cosmos-native-emission-param-shock-001-v0.2-t0-remediation-2026-10-07
          git push origin HEAD:cosmos-native-emission-param-shock-001-v0.2-t0-remediation-2026-10-07
