name: DLS Route A2 Protected 2025 Boundary Index V0.1
on:
  push:
    branches: [dls-field-enrichment-v01]
    paths:
      - 'labs/DEFI_LIQUIDATION_SHOCK_001/LAUNCH_ROUTE_A2_2025_BOUNDARY.marker'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: dls-route-a2-2025-boundary
  cancel-in-progress: true
jobs:
  boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      HELIUS_API_KEY: ${{ secrets.HELIUS_API_KEY }}
      DLS_RPC_URL: ${{ secrets.DLS_RPC_URL }}
    steps:
      - uses: actions/checkout@v4
      - name: Compile
        run: python -m py_compile labs/DEFI_LIQUIDATION_SHOCK_001/source/build_route_a2_2025_boundary_index_v0_1.py
      - name: Build source-only boundary index
        run: python labs/DEFI_LIQUIDATION_SHOCK_001/source/build_route_a2_2025_boundary_index_v0_1.py
      - name: Upload receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dls-route-a2-2025-boundary-v01
          path: route_a2_boundary/
          if-no-files-found: warn
