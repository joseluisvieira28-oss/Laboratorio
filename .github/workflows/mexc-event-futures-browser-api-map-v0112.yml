name: MEXC Event Futures Browser API Map V0.11.2

on:
  push:
    branches:
      - mexc-event-futures-browser-source-v0.11.2-api-map-2026-10-02
    paths:
      - 'research/mexc_event_futures/**'
      - '.github/workflows/mexc-event-futures-browser-api-map-v0112.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  api-map:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python deps
        run: python -m pip install --upgrade pip playwright
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Syntax check
        run: python -m py_compile research/mexc_event_futures/browser_api_map_v0112.py
      - name: Run source-only browser API map
        run: python research/mexc_event_futures/browser_api_map_v0112.py
      - name: Verify safety boundary
        shell: bash
        run: |
          python - <<'PY'
          import json
          p='artifacts/mexc_event_futures/browser_api_map_v0112.json'
          j=json.load(open(p,encoding='utf-8'))
          assert j['authenticated_requests']==0
          assert j['orders']==0
          assert j['account_mutations']==0
          print('NO_AUTH=PASS')
          print('NO_ORDERS=PASS')
          print('NO_MUTATION=PASS')
          print('ROUTES='+str(len(j['routes'])))
          print('SNIPPETS='+str(len(j['snippets'])))
          print('ABORTED_NON_GETS='+str(len(j['aborted_non_gets'])))
          PY
      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: mexc-event-futures-browser-api-map-v0112-evidence
          path: artifacts/mexc_event_futures/browser_api_map_v0112.json
          if-no-files-found: error
