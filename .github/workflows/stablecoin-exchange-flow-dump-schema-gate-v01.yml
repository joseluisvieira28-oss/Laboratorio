name: STABLECOIN-EXCHANGE-FLOW-001 Dump Schema Gate V0.1

on:
  push:
    branches:
      - stablecoin-exchange-flow-v0.1
    paths:
      - 'labs/STABLECOIN_EXCHANGE_FLOW_001/blockchair_dump_schema_gate_v01.py'
      - '.github/workflows/stablecoin-exchange-flow-dump-schema-gate-v01.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dump-schema-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Compile schema gate
        run: python -m py_compile labs/STABLECOIN_EXCHANGE_FLOW_001/blockchair_dump_schema_gate_v01.py
      - name: Execute protected dump schema gate
        run: python labs/STABLECOIN_EXCHANGE_FLOW_001/blockchair_dump_schema_gate_v01.py
      - name: Upload immutable receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stablecoin-exchange-flow-001-dump-schema-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/stablecoin_exchange_flow_dump_schema_gate_v01/
          retention-days: 90
