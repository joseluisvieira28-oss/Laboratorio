name: Aave Gov LT Public Providers V04
on:
  push:
    branches: [aave-gov-lt-forced-deleveraging-v0.1]
    paths: [research/aave_gov_lt_forced_deleveraging/public_provider_census_v04.py, .github/workflows/aave-gov-lt-public-v04.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python research/aave_gov_lt_forced_deleveraging/public_provider_census_v04.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aave-gov-lt-public-v04
          path: out/aave_public_v04/
          retention-days: 30
