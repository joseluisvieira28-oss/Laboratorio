name: Bitwise Event Normalization

on:
  pull_request:
    branches: [main]
    paths:
      - 'research/crypto_index_rebalance_flow/EVENT_NORMALIZATION_AUTHORITY_V0.1.md'
      - 'research/crypto_index_rebalance_flow/event_normalization.py'
      - '.github/workflows/bitwise_event_normalization.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  normalize:
    if: github.head_ref == 'crypto-index-rebalance-flow-v0.1' || github.ref_name == 'crypto-index-rebalance-flow-v0.1'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Normalize source event legs
        run: python research/crypto_index_rebalance_flow/event_normalization.py
      - name: Enforce outcome and holdout firewall
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path("artifacts/crypto_index_rebalance_flow/event_normalization_v0.1.json").read_text())
          assert x["market_prices_read"] is False
          assert x["returns_computed"] is False
          assert x["pnl_computed"] is False
          assert x["holdout_2025_market_data_opened"] is False
          print("SOURCE_ONLY_FIREWALL_PASS")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: BITWISE_EVENT_NORMALIZATION_V0.1
          path: artifacts/crypto_index_rebalance_flow/event_normalization_v0.1.json
          if-no-files-found: error
