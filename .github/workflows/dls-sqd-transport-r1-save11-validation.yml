name: DLS SQD Transport R1 Save11 Validation

on:
  push:
    branches:
      - dls-census-v042-transport-r1
    paths:
      - .github/workflows/dls-sqd-transport-r1-save11-validation.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run known Save11 empty-200 day
        run: python labs/DEFI_LIQUIDATION_SHOCK_001/source/run_sqd_event_census_partition_transport_r1.py --protocol save11 --start 2024-07-23 --end 2024-07-24 --out validation/save11-2024-07-23
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dls-transport-r1-save11-2024-07-23
          path: validation/save11-2024-07-23
          if-no-files-found: error
          retention-days: 30
      - name: Firewall
        if: always()
        run: echo SOURCE_ONLY_TRUE
