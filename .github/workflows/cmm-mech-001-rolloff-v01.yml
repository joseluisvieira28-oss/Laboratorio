name: CMM-MECH-001 Spot-State Rolloff Audit V0.1

on:
  push:
    branches:
      - cross-market-spotstate-rolloff-audit-001-v0.1
    paths:
      - "cmm001/CMM_MECH_001_ROLLOFF_AUTHORITY_V01.md"
      - "cmm001/cmm_mech_001_rolloff_v01.py"
      - ".github/workflows/cmm-mech-001-rolloff-v01.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout isolated branch
        uses: actions/checkout@v4
        with:
          ref: cross-market-spotstate-rolloff-audit-001-v0.1

      - name: Run zero-PnL mechanism audit
        run: |
          python3 cmm001/cmm_mech_001_rolloff_v01.py

      - name: Preserve diagnostic evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cmm001/mech001_results/
          if ! git diff --cached --quiet; then
            git commit -m "cmm-mech-001: record spot-state rolloff audit [skip ci]"
            git pull --rebase origin cross-market-spotstate-rolloff-audit-001-v0.1
            git push origin HEAD:cross-market-spotstate-rolloff-audit-001-v0.1
          fi
