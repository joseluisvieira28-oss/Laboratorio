name: WTI V15 EIA Fundamental Discovery

on:
  push:
    branches:
      - mexc-wti-eia-fundamental-v1.5-prereg-2026-10-04
    paths:
      - 'research/mexc_global_assets/MEXC_WTI_EIA_FUNDAMENTAL_RULE_V1.5.json'
      - 'research/mexc_global_assets/MEXC_WTI_EIA_FUNDAMENTAL_FREEZE_V1.5.md'
      - 'research/mexc_global_assets/mexc_wti_eia_fundamental_v15.py'
      - '.github/workflows/wti-v15-eia-fundamental.yml'

permissions:
  contents: read

jobs:
  frozen-discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install public-source dependencies
        run: python -m pip install --disable-pip-version-check requests xlrd
      - name: Pre-data freeze check
        run: |
          test "$GITHUB_REF_NAME" = "mexc-wti-eia-fundamental-v1.5-prereg-2026-10-04"
          python -m py_compile research/mexc_global_assets/mexc_wti_eia_fundamental_v15.py
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          p=Path('research/mexc_global_assets/MEXC_WTI_EIA_FUNDAMENTAL_RULE_V1.5.json')
          x=json.loads(p.read_text())
          assert x['outcomes_opened_at_freeze']==0
          assert x['inventory_thresholds_frozen_before_xls_values'] is True
          assert x['signal_mode']=='DRAW_LONG_BUILD_SHORT_ONLY'
          assert x['abs_inventory_change_thresholds_kb']==[0,2000,5000]
          assert x['horizons_min']==[5,15,30,60]
          assert len(x['discovery_events_utc'])==30
          assert x['retrospective_oos_authorized'] is False
          assert x['inverse_mode_authorized'] is False
          assert x['consensus_authorized'] is False
          assert x['future_forward_required_for_confirmation'] is True
          assert x['live_trading_authorized'] is False
          print('RULE_SHA256='+hashlib.sha256(p.read_bytes()).hexdigest())
          print('PRE_EIA_VALUES_FREEZE_PASS')
          PY
      - name: Execute frozen fundamental Discovery
        run: python research/mexc_global_assets/mexc_wti_eia_fundamental_v15.py
      - name: Upload immutable evidence
        uses: actions/upload-artifact@v4
        with:
          name: wti-v15-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/mexc_global_assets/mexc_wti_eia_fundamental_v15
          if-no-files-found: error
          retention-days: 90
