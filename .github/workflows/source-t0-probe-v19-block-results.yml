name: source-t0-probe-v19-block-results

on:
  push:
    branches:
      - cosmos-native-emission-param-shock-001-v0.2-t0-remediation-2026-10-07
    paths:
      - .github/workflows/source-t0-probe-v19-block-results.yml

permissions:
  contents: read

jobs:
  block-results:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Probe historical Tendermint block_results around remaining boundaries
        shell: bash
        run: |
          python3 - <<'PY'
          import json, urllib.request, ssl, concurrent.futures
          UA={"User-Agent":"CryptoLab-source-only/1.9"}
          AK=[
            "https://akash.rpc.uquad.org:443",
            "https://rpc-akash.ecostake.com:443",
            "https://akash-rpc.kleomedes.network",
            "https://akash-mainnet-rpc.cosmonautstakes.com:443",
            "https://akash-rpc.publicnode.com:443",
            "https://akash.api.pocket.network",
            "https://akash-rpc.polkachu.com:443",
            "https://akash-mainnet-rpc.crouton.digital"
          ]
          SC=[
            "https://scrt.public-rpc.com",
            "https://rpc.lavenderfive.com:443/secretnetwork",
            "https://1rpc.io/scrt-rpc",
            "https://rpc.mainnet.secretsaturn.net",
            "https://rpc-secret.01node.com",
            "https://public.stakewolle.com/cosmos/secretnetwork/rpc"
          ]
          cases=[]
          for pid,H in {"AK265":17526666,"AK283":20631473}.items():
            for base in AK:
              for h in [H-1,H,H+1,H+2]:
                for path in [f"/block?height={h}",f"/block_results?height={h}"]:
                  cases.append((pid,base,h,path))
          # Secret broad grid only first; exact binary search can follow if any provider is archival.
          for base in SC:
            for h in [11752974,11800000,11840000,11880000,11920000]:
              cases.append(("SCRT",base,h,f"/block?height={h}"))
              cases.append(("SCRT",base,h,f"/block_results?height={h}"))

          def fetch(c):
            pid,base,h,path=c
            url=base.rstrip("/")+path
            try:
              req=urllib.request.Request(url,headers=UA)
              with urllib.request.urlopen(req,timeout=7,context=ssl._create_unverified_context()) as r:
                raw=r.read().decode("utf-8","replace")
                d=json.loads(raw)
                return summarize(pid,base,h,path,d,r.status)
            except Exception as e:
              return {"case":pid,"provider":base,"requested_height":h,"path":"block_results" if "block_results" in path else "block","ok":False,"error":repr(e)[:300]}

          def dec(v):
            if v is None:return ""
            if not isinstance(v,str):return str(v)
            # Tendermint may return plain strings or base64. Keep plain and best-effort decode.
            try:
              import base64
              b=base64.b64decode(v,validate=True)
              x=b.decode("utf-8")
              if x and all(ord(ch)>=9 and ord(ch)<127 for ch in x): return x
            except:pass
            return v

          def event_summary(ev):
            typ=ev.get("type","")
            attrs={}
            for a in ev.get("attributes") or []:
              k=dec(a.get("key")); v=dec(a.get("value"))
              if any(z in str(k).lower() for z in ["proposal","inflation","mint","amount","annual","provision","rate","param"]):
                attrs[str(k)]=v
            keep = any(z in typ.lower() for z in ["proposal","gov","mint","inflation"]) or bool(attrs)
            return {"type":typ,"attrs":attrs} if keep else None

          def summarize(pid,base,h,path,d,status):
            out={"case":pid,"provider":base,"requested_height":h,"path":"block_results" if "block_results" in path else "block","ok":True,"http":status}
            if d.get("error"):
              out["rpc_error"]=d["error"]; return out
            res=d.get("result") or {}
            if "block_results" not in path:
              bh=((res.get("block") or {}).get("header") or {}).get("height")
              bt=((res.get("block") or {}).get("header") or {}).get("time")
              out["returned_height"]=bh;out["time"]=bt;out["height_match"]=str(bh)==str(h)
            else:
              rh=res.get("height")
              out["returned_height"]=rh;out["height_match"]=str(rh)==str(h)
              events=[]
              for key in ["begin_block_events","end_block_events","finalize_block_events"]:
                for ev in res.get(key) or []:
                  s=event_summary(ev)
                  if s: events.append({"phase":key,**s})
              # Include tx-result gov/mint-ish events too, but no market data.
              for i,tx in enumerate(res.get("txs_results") or []):
                for ev in tx.get("events") or []:
                  s=event_summary(ev)
                  if s: events.append({"phase":f"tx[{i}]",**s})
              out["relevant_events"]=events[:100]
            return out

          with concurrent.futures.ThreadPoolExecutor(max_workers=40) as ex:
            rows=list(ex.map(fetch,cases))

          # Compact: keep exact archival successes or informative RPC errors. Drop repetitive transport failures.
          good=[]
          for r in rows:
            if r.get("height_match") or r.get("rpc_error"):
              good.append(r)
          print("BLOCK_RESULTS_V19_BEGIN")
          print(json.dumps({"scope":"SOURCE_ONLY_NO_MARKET_DATA","results":good},indent=2,sort_keys=True)[:800000])
          print("BLOCK_RESULTS_V19_END")
          PY
