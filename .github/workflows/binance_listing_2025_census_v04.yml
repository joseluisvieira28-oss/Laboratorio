name: Listing Cascade 2025 Holdout Census
on:
  push:
    branches: [binance-listing-cascade-v0.4-2025-holdout-source-2026-10-05]
    paths:
      - '.github/workflows/binance_listing_2025_census_v04.yml'
permissions: {contents: read}
jobs:
  census:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: binance-listing-cascade-v0.4-2025-holdout-source-2026-10-05}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python research/binance_listing_information_cascade/census_2025_source_v04.py
