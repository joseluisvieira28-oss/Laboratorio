name: DLS Kamino Public RPC History Depth Probe V0.1

on:
  push:
    branches:
      - defi-liquidation-kamino-boundary-execution-v0.1
    paths:
      - '.github/workflows/dls-kamino-public-rpc-history-depth-v01.yml'
      - 'labs/DEFI_LIQUIDATION_SHOCK_001/source/probe_kamino_public_rpc_history_depth_v0_1.py'
      - 'labs/DEFI_LIQUIDATION_SHOCK_001/KAMINO_PUBLIC_RPC_HISTORY_DEPTH_TRIGGER_V0.1.txt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  depth_probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Run source-only history depth probe
        run: |
          python labs/DEFI_LIQUIDATION_SHOCK_001/source/probe_kamino_public_rpc_history_depth_v0_1.py | tee DLS_KAMINO_PUBLIC_RPC_HISTORY_DEPTH_STDOUT_V0.1.txt
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dls-kamino-public-rpc-history-depth-v01
          path: |
            DLS_KAMINO_PUBLIC_RPC_HISTORY_DEPTH_PROBE_RECEIPT_V0.1.json
            DLS_KAMINO_PUBLIC_RPC_HISTORY_DEPTH_STDOUT_V0.1.txt
          if-no-files-found: warn
          retention-days: 30
