name: CBBTC-001 historical header probe V0.1N
on:
  push:
    branches:
      - cbbtc-eth-mint-burn-flow-001-source-gate-v01
    paths:
      - 'research/cbbtc_eth_mint_burn_flow_001/cbbtc_rpc_header_probe_v01n.mjs'
      - '.github/workflows/cbbtc-rpc-header-probe-v01n.yml'
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node research/cbbtc_eth_mint_burn_flow_001/cbbtc_rpc_header_probe_v01n.mjs
