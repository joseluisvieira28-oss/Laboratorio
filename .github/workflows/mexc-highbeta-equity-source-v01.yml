name: MEXC HighBeta Equity Source Census V0.1

on:
  push:
    branches:
      - mexc-us-equity-highbeta-v0.1-source-census-2026-10-04

permissions:
  contents: read

jobs:
  census:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependency
        run: python -m pip install --disable-pip-version-check requests
      - name: Source-only check
        run: |
          test "$GITHUB_REF_NAME" = "mexc-us-equity-highbeta-v0.1-source-census-2026-10-04"
          test -f research/mexc_global_assets/MEXC_HIGHBETA_EQUITY_SOURCE_CENSUS_FREEZE_V0.1.md
          python -m py_compile research/mexc_global_assets/mexc_highbeta_equity_source_census_v01.py
          echo HIGHBETA_SOURCE_ONLY_PASS
      - name: Run source census
        run: python research/mexc_global_assets/mexc_highbeta_equity_source_census_v01.py
      - name: Upload census evidence
        uses: actions/upload-artifact@v4
        with:
          name: mexc-highbeta-source-v01-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/mexc_global_assets/highbeta_source_census_v01
          if-no-files-found: error
          retention-days: 90