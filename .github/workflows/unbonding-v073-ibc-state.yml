name: Unbonding V0.7.3 Historical IBC State
on:
  push:
    branches: [pos-unbonding-completion-001-v0.7-build-source-b-2026-10-07]
    paths:
      - "research/pos_unbonding_completion_001_v0_7_source_b/v073_ibc_historical_state.py"
      - ".github/workflows/unbonding-v073-ibc-state.yml"
  workflow_dispatch:
permissions: {contents: write}
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with: {ref: pos-unbonding-completion-001-v0.7-build-source-b-2026-10-07, fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python research/pos_unbonding_completion_001_v0_7_source_b/v073_ibc_historical_state.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/pos_unbonding_completion_001_v0_7_source_b/IBC_OSMOSIS_HISTORICAL_STATE_V073.json
          git diff --cached --quiet || (git commit -m "Record historical Osmosis IBC Coreum Source-B checkpoints" && git push origin HEAD:pos-unbonding-completion-001-v0.7-build-source-b-2026-10-07)
