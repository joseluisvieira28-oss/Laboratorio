name: CBBTC-ETH-MINT-BURN-FLOW-001 source gate V0.1

on:
  push:
    branches:
      - cbbtc-eth-mint-burn-flow-001-source-gate-v01
    paths:
      - 'research/cbbtc_eth_mint_burn_flow_001/SOURCE_GATE_FREEZE_V0.1.md'
      - 'research/cbbtc_eth_mint_burn_flow_001/cbbtc_eth_mint_burn_source_probe_v01.mjs'
      - '.github/workflows/cbbtc-eth-mint-burn-flow-001-source-gate-v01.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cbbtc-eth-mint-burn-flow-001-source-gate-v01
  cancel-in-progress: true

jobs:
  source_gate:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-save ethers@6.15.0
      - name: Run frozen historical mint/burn source gate
        env:
          ETH_RPC_URL: https://ethereum-rpc.publicnode.com
        run: node research/cbbtc_eth_mint_burn_flow_001/cbbtc_eth_mint_burn_source_probe_v01.mjs
      - name: Persist exact passing source receipt
        if: success()
        shell: bash
        run: |
          cp artifacts/CBBTC_ETH_MINT_BURN_SOURCE_GATE_RECEIPT_V0.1.json research/cbbtc_eth_mint_burn_flow_001/SOURCE_GATE_RECEIPT_V0.1.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/cbbtc_eth_mint_burn_flow_001/SOURCE_GATE_RECEIPT_V0.1.json
          git commit -m "CBBTC-ETH-MINT-BURN-FLOW-001: persist source gate PASS [skip ci]"
          git push origin HEAD:cbbtc-eth-mint-burn-flow-001-source-gate-v01
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cbbtc-eth-mint-burn-source-gate-v01
          path: artifacts/CBBTC_ETH_MINT_BURN_SOURCE_GATE_RECEIPT_V0.1.json
          if-no-files-found: error
