name: CCLM-002 batch order adjudication V0.1
on:
  push:
    branches: [crosschain-liquidity-migration-001-source-gate-v0.1]
    paths:
      - 'research/crosschain_liquidity_migration_001/CCLM_002_BATCH_ORDER_ADJUDICATION_FREEZE_V0.1.md'
      - 'research/crosschain_liquidity_migration_001/cclm002_batch_order_adjudication_v01.py'
      - '.github/workflows/cclm-002-batch-order-adjudication-v01.yml'
permissions:
  contents: write
jobs:
  adjudicate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {ref: crosschain-liquidity-migration-001-source-gate-v0.1}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python research/crosschain_liquidity_migration_001/cclm002_batch_order_adjudication_v01.py
      - name: Persist
        if: always()
        run: |
          if [ -f artifacts/cclm002_batch_order_adjudication_v01.json ]; then
            cp artifacts/cclm002_batch_order_adjudication_v01.json research/crosschain_liquidity_migration_001/CCLM_002_BATCH_ORDER_ADJUDICATION_RECEIPT.json
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add research/crosschain_liquidity_migration_001/CCLM_002_BATCH_ORDER_ADJUDICATION_RECEIPT.json
            if ! git diff --cached --quiet; then
              git commit -m "CCLM-002: record batch-order source adjudication [skip ci]"
              git push origin HEAD:crosschain-liquidity-migration-001-source-gate-v0.1
            fi
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cclm002-batch-order-adjudication
          path: artifacts/cclm002_batch_order_adjudication_v01.json
          if-no-files-found: error
