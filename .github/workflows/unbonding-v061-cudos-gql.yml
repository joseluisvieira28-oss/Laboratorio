name: Unbonding V0.6.1 CUDOS Archive GQL Probe
on:
  push:
    branches: [pos-unbonding-completion-001-v0.6-fifth-chain-expansion-2026-10-07]
    paths: ["research/pos_unbonding_completion_001_v0_6_fifth_chain/v061_cudos_archive_gql.py",".github/workflows/unbonding-v061-cudos-gql.yml"]
permissions: {contents: write}
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: {ref: pos-unbonding-completion-001-v0.6-fifth-chain-expansion-2026-10-07, fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python research/pos_unbonding_completion_001_v0_6_fifth_chain/v061_cudos_archive_gql.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/pos_unbonding_completion_001_v0_6_fifth_chain/CUDOS_ARCHIVE_GQL_PROBE_V061.json
          git diff --cached --quiet || (git commit -m "Record CUDOS archive GraphQL capability" && git push origin HEAD:pos-unbonding-completion-001-v0.6-fifth-chain-expansion-2026-10-07)
