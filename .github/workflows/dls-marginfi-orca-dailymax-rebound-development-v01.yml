name: DLS Marginfi Orca Daily-Max Rebound Development V0.1

on:
  push:
    branches:
      - dls-marginfi-orca-dailymax-rebound-v01
    paths:
      - labs/DEFI_LIQUIDATION_SHOCK_001/LAUNCH_MARGINFI_ORCA_DAILYMAX_REBOUND_DEV_V01.marker

permissions:
  actions: read
  contents: read

jobs:
  development:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download canonical daily-max precheck READY
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 36817661717
          artifact-ids: 11142440771
          path: precheck

      - name: Compile frozen Development executor
        run: python -m py_compile labs/DEFI_LIQUIDATION_SHOCK_001/source/run_marginfi_orca_dailymax_rebound_dev_v0_1.py

      - name: Execute frozen Jul-Sep Development
        run: >
          python labs/DEFI_LIQUIDATION_SHOCK_001/source/run_marginfi_orca_dailymax_rebound_dev_v0_1.py
          --precheck-root precheck
          --workers 12

      - name: Upload immutable Development evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dls-marginfi-orca-dailymax-rebound-development-v01
          path: |
            labs/DEFI_LIQUIDATION_SHOCK_001/MARGINFI_ORCA_DAILYMAX_REBOUND_V01_DEVELOPMENT_RECEIPT.json
            labs/DEFI_LIQUIDATION_SHOCK_001/MARGINFI_ORCA_DAILYMAX_REBOUND_V01_DEVELOPMENT_LEDGER.ndjson
            labs/DEFI_LIQUIDATION_SHOCK_001/MARGINFI_ORCA_DAILYMAX_REBOUND_V01_MARKET_DATA_MANIFEST.ndjson
          if-no-files-found: warn
          retention-days: 90

      - name: Firewall
        if: always()
        run: echo JULSEP_DEV_ONLY_2025_2026_CLOSED_NO_TRADING
