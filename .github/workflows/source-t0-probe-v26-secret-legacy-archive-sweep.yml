name: source-t0-probe-v26-secret-legacy-archive-sweep

on:
  push:
    branches:
      - cosmos-native-emission-param-shock-001-v0.2-t0-remediation-2026-10-07
    paths:
      - .github/workflows/source-t0-probe-v26-secret-legacy-archive-sweep.yml

permissions:
  contents: read

jobs:
  secret-legacy-archive-sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Probe legacy/public Secret archive endpoints for block metadata only
        shell: bash
        run: |
          python3 - <<'PY'
          import json,urllib.request,ssl,concurrent.futures
          from datetime import datetime

          TARGET="2023-12-07T02:54:58.930543213Z"
          TT=datetime.fromisoformat(TARGET.replace("Z","+00:00")).timestamp()
          UA={"User-Agent":"CryptoLab-source-only-secret-v26"}
          eps=[
            "https://scrt-rpc.blockpane.com",
            "https://rpc.secret.forbole.com",
            "https://secret.rpc.consensus.one",
            "https://secret-4.api.trivium.network:26657",
            "https://rpc.spartanapi.dev",
            "https://secretnetwork-rpc.stakely.io",
            "https://scrt-rpc.agoranodes.com",
            "https://rpc.archive.scrt.marionode.com",
            "https://secretnetwork-rpc.lavenderfive.com:443",
            "https://rpc.mainnet.secretsaturn.net",
            "https://rpc-secret.whispernode.com:443",
            "https://rpc-secret.01node.com",
            "https://scrt.public-rpc.com",
            "https://rpc.cosmos.directory/secretnetwork"
          ]
          anchor=11752974
          grid=[11752974,11820000,11850000,11870000,11885000,11900000,11920000]

          def get(u,to=8):
            try:
              q=urllib.request.Request(u,headers=UA)
              with urllib.request.urlopen(q,timeout=to,context=ssl._create_unverified_context()) as r:
                raw=r.read().decode("utf-8","replace")
                try:d=json.loads(raw)
                except:d=raw[:3000]
                return {"ok":True,"status":r.status,"data":d,"url":r.geturl()}
            except Exception as e:return {"ok":False,"error":repr(e)[:400],"url":u}

          def parse(r):
            try:
              d=r["data"]; h=d["result"]["block"]["header"]; return int(h["height"]),h["time"],d["result"].get("block_id",{}).get("hash")
            except:return None
          def ts(s):
            try:return datetime.fromisoformat(s.replace("Z","+00:00")).timestamp()
            except:return None

          def probe(base):
            r=get(base+f"/block?height={anchor}")
            z=parse(r)
            return {"base":base,"ok":bool(z and z[0]==anchor),"anchor":z,"http":r.get("status"),"error":r.get("error")}

          with concurrent.futures.ThreadPoolExecutor(max_workers=24) as ex:
            rows=list(ex.map(probe,eps))
          winners=[r["base"] for r in rows if r["ok"]]
          exact=[]
          for base in winners:
            pts=[]
            for h in grid:
              r=get(base+f"/block?height={h}"); z=parse(r)
              if z and z[0]==h and ts(z[1]) is not None: pts.append((h,ts(z[1]),z))
            br=None
            for a,b in zip(pts,pts[1:]):
              if a[1] < TT <= b[1]: br=(a,b); break
            rec={"base":base,"grid":[x[2] for x in pts],"bracket":None}
            if br:
              rec["bracket"]={"lo":br[0][2],"hi":br[1][2]}
              L,R=br[0][0],br[1][0]; err=None
              while L<R:
                M=(L+R)//2; rr=get(base+f"/block?height={M}"); z=parse(rr)
                if not z or z[0]!=M or ts(z[1]) is None:
                  err={"height":M,"status":rr.get("status"),"error":rr.get("error")};break
                if ts(z[1])>=TT:R=M
                else:L=M+1
              rec["binary_error"]=err
              if err is None:
                H=L; rec["H_vote_end_block"]=H; rec["neighbors"]=[]
                for h in range(H-2,H+3):
                  rr=get(base+f"/block?height={h}"); z=parse(rr)
                  rec["neighbors"].append(z if z else {"height":h,"status":rr.get("status"),"error":rr.get("error")})
                rec["block_results"]=[]
                for h in [H-1,H,H+1]:
                  rr=get(base+f"/block_results?height={h}")
                  rec["block_results"].append({"height":h,"ok":rr["ok"],"status":rr.get("status"),"error":rr.get("error"),"data":rr.get("data") if rr["ok"] else None})
            exact.append(rec)
          print("SECRET_V26_BEGIN")
          print(json.dumps({"scope":"SOURCE_ONLY_NO_MARKET_DATA","target":TARGET,"anchor_results":rows,"exact":exact},indent=2,sort_keys=True)[:900000])
          print("SECRET_V26_END")
          PY
