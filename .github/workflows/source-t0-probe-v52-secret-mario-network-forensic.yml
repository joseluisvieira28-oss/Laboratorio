name: source-t0-probe-v52-secret-mario-network-forensic
on:
  push:
    branches: [cosmos-native-emission-param-shock-001-v0.2-t0-remediation-2026-10-07]
    paths: [.github/workflows/source-t0-probe-v52-secret-mario-network-forensic.yml]
permissions: {contents: write}
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with: {ref: cosmos-native-emission-param-shock-001-v0.2-t0-remediation-2026-10-07}
      - name: Mario archive DNS/TLS/port forensic
        shell: bash
        run: |
          python3 - <<'PY'
          import socket,json,subprocess,os,datetime,re,hashlib
          OUT="research/cosmos_native_emission_param_shock_001_v0_2/SCRT287_MARIO_NETWORK_FORENSIC_V52.json"
          hosts=["rpc.archive.scrt.marionode.com","lcd.archive.scrt.marionode.com","oldarchive.scrt.marionode.com"]
          dns={}
          for h in hosts:
            try:
              xs=socket.getaddrinfo(h,None)
              dns[h]=sorted(set(x[4][0] for x in xs))
            except Exception as e:dns[h]={"error":repr(e)}
          urls=[
            "https://rpc.archive.scrt.marionode.com/status",
            "https://rpc.archive.scrt.marionode.com/block?height=11880918",
            "https://rpc.archive.scrt.marionode.com/block?height=11880919",
            "https://rpc.archive.scrt.marionode.com/block?height=11880920",
            "https://rpc.archive.scrt.marionode.com/block?height=11880921",
            "https://rpc.archive.scrt.marionode.com/block?height=11880922",
            "http://rpc.archive.scrt.marionode.com:26657/status",
            "http://rpc.archive.scrt.marionode.com:26657/block?height=11880920",
            "https://lcd.archive.scrt.marionode.com/cosmos/base/tendermint/v1beta1/blocks/11880920",
          ]
          def curl(args):
            cmd=["curl","-k","-sS","--connect-timeout","5","--max-time","12","-D","-","-o","-"]+args
            p=subprocess.run(cmd,stdout=subprocess.PIPE,stderr=subprocess.PIPE,text=False)
            raw=p.stdout
            return {"rc":p.returncode,"stdout":raw.decode("utf-8","replace")[:120000],
                    "stderr":p.stderr.decode("utf-8","replace")[:10000],
                    "sha256":hashlib.sha256(raw).hexdigest() if raw else None}
          probes=[]
          for u in urls:
            for mode,extra in [
              ("default",[]),
              ("ipv4-http1",["-4","--http1.1"]),
            ]:
              r=curl(extra+[u]);probes.append({"url":u,"mode":mode,**r})
          # Direct resolved-IP tests preserving TLS SNI/Host with --resolve.
          host="rpc.archive.scrt.marionode.com"
          ips=dns.get(host,[])
          if isinstance(ips,list):
            for ip in ips:
              for h in [11880918,11880919,11880920,11880921,11880922]:
                u=f"https://{host}/block?height={h}"
                r=curl(["-4","--http1.1","--resolve",f"{host}:443:{ip}",u])
                probes.append({"url":u,"mode":"resolve-direct","ip":ip,**r})
          # Parse any returned JSON block/header-like pairs.
          useful=[]
          for p in probes:
            body=p["stdout"]
            for m in re.finditer(r'"height"\s*:\s*"?(118809(?:1[7-9]|2[0-3]))"?',body):
              hh=int(m.group(1))
              tm=re.search(r'"time"\s*:\s*"([^"]+)"',body[max(0,m.start()-5000):m.start()+15000])
              useful.append({"height":hh,"time":tm.group(1) if tm else None,"probe":{k:p.get(k) for k in ["url","mode","ip","rc","sha256"]}})
          out={"scope":"SOURCE_ONLY_NO_MARKET_DATA","tested_utc":datetime.datetime.now(datetime.timezone.utc).isoformat(),
            "dns":dns,"probes":probes,"useful":useful}
          os.makedirs(os.path.dirname(OUT),exist_ok=True);open(OUT,"w").write(json.dumps(out,indent=2))
          print("V52",json.dumps({"dns":dns,"useful":useful,
            "rc_summary":{str(x):sum(1 for p in probes if p["rc"]==x) for x in sorted(set(p["rc"] for p in probes))}}))
          PY
      - name: Persist
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/cosmos_native_emission_param_shock_001_v0_2/SCRT287_MARIO_NETWORK_FORENSIC_V52.json
          git commit -m "SCRT287: persist Mario archive network forensic v52"
          git pull --rebase origin cosmos-native-emission-param-shock-001-v0.2-t0-remediation-2026-10-07
          git push origin HEAD:cosmos-native-emission-param-shock-001-v0.2-t0-remediation-2026-10-07
