name: EBST historical depth probe v0.1
on:
  push:
    branches: [eth-blockspace-state-transition-v0.1]
    paths:
      - 'research/eth_blockspace_state_transition/depth_probe_v01.py'
      - '.github/workflows/ebst-depth-probe-v01.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python research/eth_blockspace_state_transition/depth_probe_v01.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ebst-depth-probe-v01
          path: EBST_DEPTH_PROBE_V0_1.json
