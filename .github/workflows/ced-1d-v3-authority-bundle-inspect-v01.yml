name: CED 1D V3 Authority Bundle Inspect V0.1
on:
  push:
    branches: [ced-1d-v3-byte-recovery-2026-09-17]
    paths:
      - 'Dream-Account-OS-v2.3-PARTIAL/research/ced_1d_v3/AUTHORITY_BUNDLE_INSPECT_TRIGGER_V0.1.txt'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m py_compile Dream-Account-OS-v2.3-PARTIAL/research/ced_1d_v3/inspect_authority_bundle_v01.py
      - run: python Dream-Account-OS-v2.3-PARTIAL/research/ced_1d_v3/inspect_authority_bundle_v01.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ced1d-authority-bundle-inspect-v01-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/ced1d_authority_bundle_inspect_v01/
          retention-days: 30
