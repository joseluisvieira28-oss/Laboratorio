name: GOLD V10 Bitget Source Gate

on:
  push:
    branches:
      - mexc-bitget-gold-crossvenue-v1.0-source-gate-2026-10-04
    paths:
      - 'research/mexc_global_assets/MEXC_BITGET_GOLD_SOURCE_GATE_V1.0.md'
      - 'research/mexc_global_assets/mexc_bitget_gold_source_probe_v10.py'
      - '.github/workflows/gold-v10-source-gate.yml'

permissions:
  contents: read

jobs:
  source-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install requests
        run: python -m pip install --disable-pip-version-check requests
      - name: Source-only preflight
        run: |
          test "$GITHUB_REF_NAME" = "mexc-bitget-gold-crossvenue-v1.0-source-gate-2026-10-04"
          python -m py_compile research/mexc_global_assets/mexc_bitget_gold_source_probe_v10.py
          grep -q 'SOURCE-ONLY' research/mexc_global_assets/MEXC_BITGET_GOLD_SOURCE_GATE_V1.0.md
          grep -q 'OUTCOMES CLOSED' research/mexc_global_assets/MEXC_BITGET_GOLD_SOURCE_GATE_V1.0.md
      - name: Execute public source gate
        run: python research/mexc_global_assets/mexc_bitget_gold_source_probe_v10.py
      - name: Upload immutable source evidence
        uses: actions/upload-artifact@v4
        with:
          name: gold-v10-source-gate-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/mexc_global_assets/gold_bitget_source_gate_v10
          if-no-files-found: error
          retention-days: 90
