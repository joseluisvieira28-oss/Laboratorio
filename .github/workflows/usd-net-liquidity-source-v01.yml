name: USD-NET-LIQUIDITY-001 Source Gate V0.1

on:
  push:
    branches: [usd-net-liquidity-v0.1]
    paths:
      - '.github/workflows/usd-net-liquidity-source-v01.yml'

permissions:
  contents: read

jobs:
  source-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: usd-net-liquidity-v0.1
      - name: Verify frozen source contract
        run: |
          set -euo pipefail
          test -f labs/USD_NET_LIQUIDITY_001/SOURCE_GATE_V0.1.md
          test -f labs/USD_NET_LIQUIDITY_001/source_gate_v01.py
          grep -q '2024-12-18' labs/USD_NET_LIQUIDITY_001/SOURCE_GATE_V0.1.md
          grep -q 'No BTC price values' labs/USD_NET_LIQUIDITY_001/SOURCE_GATE_V0.1.md
      - name: Compile source gate
        run: python -m py_compile labs/USD_NET_LIQUIDITY_001/source_gate_v01.py
      - name: Execute macro source gate only
        run: python labs/USD_NET_LIQUIDITY_001/source_gate_v01.py
      - name: Upload immutable source evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: usd-net-liquidity-001-source-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/usd_net_liquidity_source_v01/
          retention-days: 90
