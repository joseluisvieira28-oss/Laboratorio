name: DLS Marginfi SOL Flow Magnitude Q75 Calibration V0.1

on:
  push:
    branches:
      - dls-marginfi-flow-magnitude-v01
    paths:
      - labs/DEFI_LIQUIDATION_SHOCK_001/LAUNCH_MARGINFI_SOL_FLOW_MAGNITUDE_Q75_V01.marker

permissions:
  actions: read
  contents: read

jobs:
  calibrate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download canonical Feb-Mar signed-flow source PASS
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 36589912203
          name: dls-marginfi-sol-febmar-signed-flow-source-v02
          path: source
      - name: Compile source-only calibration
        run: python -m py_compile labs/DEFI_LIQUIDATION_SHOCK_001/source/calibrate_marginfi_sol_flow_magnitude_q75_v0_1.py
      - name: Compute frozen source-only Q75
        run: >
          python labs/DEFI_LIQUIDATION_SHOCK_001/source/calibrate_marginfi_sol_flow_magnitude_q75_v0_1.py
          --source-root source
      - name: Upload immutable source-only calibration
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dls-marginfi-sol-flow-magnitude-q75-v01
          path: |
            labs/DEFI_LIQUIDATION_SHOCK_001/MARGINFI_SOL_FLOW_MAGNITUDE_Q75_CALIBRATION_RECEIPT_V0.1.json
            labs/DEFI_LIQUIDATION_SHOCK_001/MARGINFI_SOL_FLOW_MAGNITUDE_Q75_CALIBRATION_CASCADES_V0.1.ndjson
          if-no-files-found: warn
          retention-days: 90
      - name: Firewall
        if: always()
        run: echo SOURCE_ONLY_NO_PRICES_NO_RETURNS_NO_PNL
