name: MEXC Event Futures ETF-CME Transfer V1.0

on:
  push:
    branches:
      - mexc-event-futures-etfcme-transfer-v1.0-2026-10-02
    paths:
      - 'research/mexc_event_futures/**'
      - '.github/workflows/mexc-event-futures-etfcme-transfer-v10.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  etf-cme-transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install --upgrade pip requests scipy
      - name: Syntax check
        run: python -m py_compile research/mexc_event_futures/etf_cme_transfer_v10.py
      - name: Run frozen V1.0 ETF-CME transfer
        run: python research/mexc_event_futures/etf_cme_transfer_v10.py
      - name: Verify boundaries
        shell: bash
        run: |
          python - <<'PY'
          import json
          p='artifacts/mexc_event_futures/etf_cme_transfer_v10.json'
          j=json.load(open(p, encoding='utf-8'))
          assert j['year_2026']=='LOCKED_NOT_SCORED_OR_FETCHED'
          assert j['exact_event_futures']=='NOT_PROVEN'
          assert j['authenticated_requests']==0
          assert j['orders']==0
          assert j['account_mutations']==0
          print('2026_LOCK=PASS')
          print('NO_AUTH=PASS')
          print('NO_ORDERS=PASS')
          print('VERDICT='+j['verdict'])
          print('BH_SELECTED='+str(len(j['bh_selected_horizons'])))
          print('SURVIVORS='+str(len(j['survivors'])))
          PY
      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: mexc-event-futures-etfcme-transfer-v10-evidence
          path: artifacts/mexc_event_futures/etf_cme_transfer_v10.json
          if-no-files-found: error
