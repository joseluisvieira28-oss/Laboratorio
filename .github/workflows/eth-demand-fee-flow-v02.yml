name: ETH Demand Fee Flow Source + Replication V0.2
on:
  push:
    branches: [eth-demand-fee-flow-v0.2]
    paths:
      - "research/eth_demand_fee_flow_001/SOURCE_AUTHORITY_V0.2.json"
      - "research/eth_demand_fee_flow_001/DISCOVERY_PREFREEZE_V0.1.json"
      - "research/eth_demand_fee_flow_001/source_gate_v02.py"
      - "research/eth_demand_fee_flow_001/replication_v01.py"
      - ".github/workflows/eth-demand-fee-flow-v02.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-and-replication:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install --disable-pip-version-check -q pandas numpy statsmodels
      - name: Compile
        run: |
          python -m py_compile research/eth_demand_fee_flow_001/source_gate_v02.py
          python -m py_compile research/eth_demand_fee_flow_001/replication_v01.py
      - name: Run bounded source-only gate
        run: python research/eth_demand_fee_flow_001/source_gate_v02.py
      - name: Run pre-frozen 2023 placebo and 2024 post-Dencun replication
        run: python research/eth_demand_fee_flow_001/replication_v01.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ETH_DEMAND_FEE_FLOW_001_V0_2
          path: |
            edff_source_receipt_v02.json
            edff_replication_receipt_v01.json
            edff_primary_2024_observations_v01.csv
            edff_placebo_2023_observations_v01.csv
          if-no-files-found: warn
          retention-days: 30
