name: DLS Marginfi Orca Forced-Flow Impact Development V0.2

on:
  push:
    branches: [dls-marginfi-route-migration-v01]
    paths: [labs/DEFI_LIQUIDATION_SHOCK_001/LAUNCH_MARGINFI_ORCA_IMPACT_DEV_V02.marker]

permissions: {actions: read, contents: read}

jobs:
  development:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with: {ref: "${{ github.sha }}"}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}

      - name: Download canonical Oct-Dec Orca source PASS
        uses: actions/download-artifact@v4
        with:
          github-token: "${{ github.token }}"
          repository: "${{ github.repository }}"
          run-id: 36817151374
          name: dls-marginfi-orca-octdec-signed-flow-source-v02
          path: source_gate

      - name: Download canonical V0.2 pre-outcome READY
        uses: actions/download-artifact@v4
        with:
          github-token: "${{ github.token }}"
          repository: "${{ github.repository }}"
          name: dls-marginfi-orca-impact-v02-precheck
          path: precheck_gate

      - name: Compile frozen V0.2 Development
        run: python -m py_compile labs/DEFI_LIQUIDATION_SHOCK_001/source/run_marginfi_orca_impact_dev_v0_2.py

      - name: Execute frozen clean-period Development
        run: >
          python labs/DEFI_LIQUIDATION_SHOCK_001/source/run_marginfi_orca_impact_dev_v0_2.py
          --source-root source_gate
          --precheck-root precheck_gate
          --workers 12

      - name: Upload immutable Development evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dls-marginfi-orca-impact-development-v02
          path: |
            labs/DEFI_LIQUIDATION_SHOCK_001/MARGINFI_ORCA_IMPACT_V02_DEVELOPMENT_RECEIPT.json
            labs/DEFI_LIQUIDATION_SHOCK_001/MARGINFI_ORCA_IMPACT_V02_DEVELOPMENT_LEDGER.ndjson
            labs/DEFI_LIQUIDATION_SHOCK_001/MARGINFI_ORCA_IMPACT_V02_SOURCE_CASCADES.ndjson
            labs/DEFI_LIQUIDATION_SHOCK_001/MARGINFI_ORCA_IMPACT_V02_MARKET_DATA_MANIFEST.ndjson
          if-no-files-found: warn
          retention-days: 90

      - name: Firewall
        if: always()
        run: echo OCTDEC_ONLY_2025_2026_CLOSED_NO_TRADING
