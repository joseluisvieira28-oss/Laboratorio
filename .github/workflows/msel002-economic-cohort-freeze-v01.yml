name: MSEL-002 Economic Cohort Freeze V0.1

on:
  push:
    branches:
      - memecoin-metadata-duplication-v0.1
    paths:
      - '.github/workflows/msel002-economic-cohort-freeze-v01.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  cohort-freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout frozen research branch
        uses: actions/checkout@v4

      - name: Verify freeze exists
        run: |
          test -f Dream-Account-OS-v2.3-PARTIAL/research/memecoin_metadata_duplication_002/MSEL_002_ECONOMIC_OUTCOME_FREEZE_V01.md
          python -m py_compile Dream-Account-OS-v2.3-PARTIAL/research/memecoin_metadata_duplication_002/source/build_economic_cohort_v01.py

      - name: Download exact upstream source/prevalence artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p msel002_source_v05
          gh run download 35449436752             --repo joseluisvieira28-oss/Laboratorio             --name MSEL002_SOURCE_PREVALENCE_V05_OFFICIAL_SHARDED             --dir msel002_source_v05

      - name: Reproduce frozen economic cohort outcome-blind
        run: |
          python Dream-Account-OS-v2.3-PARTIAL/research/memecoin_metadata_duplication_002/source/build_economic_cohort_v01.py             --input msel002_source_v05/candidate_identity_features_v05.jsonl             --outdir msel002_economic_cohort_output

      - name: Upload immutable cohort freeze
        uses: actions/upload-artifact@v4
        with:
          name: MSEL002_ECONOMIC_COHORT_V01
          path: msel002_economic_cohort_output/
          if-no-files-found: error
          retention-days: 30
