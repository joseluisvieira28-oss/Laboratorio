name: EBST dRPC batch capacity v0.1
on:
  push:
    branches: [eth-blockspace-state-transition-v0.1]
    paths:
      - 'research/eth_blockspace_state_transition/drpc_batch_capacity_v01.py'
      - '.github/workflows/ebst-drpc-batch-capacity-v01.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python research/eth_blockspace_state_transition/drpc_batch_capacity_v01.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ebst-drpc-batch-capacity-v01
          path: EBST_DRPC_BATCH_CAPACITY_V0_1.json
