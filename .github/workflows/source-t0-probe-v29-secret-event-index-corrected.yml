name: source-t0-probe-v29-secret-event-index-corrected

on:
  push:
    branches:
      - cosmos-native-emission-param-shock-001-v0.2-t0-remediation-2026-10-07
    paths:
      - .github/workflows/source-t0-probe-v29-secret-event-index-corrected.yml

permissions:
  contents: write

jobs:
  corrected-event-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cosmos-native-emission-param-shock-001-v0.2-t0-remediation-2026-10-07
      - name: Corrected Tendermint block_search probe
        run: |
          python - <<'PY'
          import urllib.request, urllib.parse, urllib.error, json, hashlib, datetime, os, ssl
          from concurrent.futures import ThreadPoolExecutor

          TARGET="2023-12-07T02:54:58.930543213Z"
          UA={"User-Agent":"CryptoLab-source-only-secret-v29/1.0","Content-Type":"application/json"}
          OUT="research/cosmos_native_emission_param_shock_001_v0_2/SCRT287_EVENT_INDEX_PROBE_V29.json"
          RPCS=[
            "https://rpc.lavenderfive.com:443/secretnetwork",
            "https://public.stakewolle.com/cosmos/secretnetwork/rpc",
            "https://secretnetwork-rpc.highstakes.ch:26657",
            "https://rpc-secret.01node.com",
            "https://1rpc.io/scrt-rpc",
            "https://rpc.cosmos.directory/secretnetwork",
            "https://rpc.archive.scrt.marionode.com",
            "https://scrt.public-rpc.com",
          ]
          QUERIES=[
            "active_proposal.proposal_id='287'",
            "active_proposal.proposal_result='proposal_passed' AND active_proposal.proposal_id='287'",
            "active_proposal.proposal_result='proposal_passed'",
          ]

          def req(url, data=None, timeout=18):
              try:
                  r=urllib.request.Request(url,data=data,headers=UA,method="POST" if data is not None else "GET")
                  with urllib.request.urlopen(r,timeout=timeout) as x:
                      b=x.read()
                      return {"ok":True,"status":getattr(x,"status",200),"url":url,
                              "sha256":hashlib.sha256(b).hexdigest(),
                              "body":b.decode("utf-8","replace")[:800000]}
              except urllib.error.HTTPError as e:
                  try:b=e.read()
                  except Exception:b=b""
                  return {"ok":False,"status":e.code,"url":url,"error":str(e),
                          "sha256":hashlib.sha256(b).hexdigest() if b else None,
                          "body":b.decode("utf-8","replace")[:100000]}
              except Exception as e:
                  return {"ok":False,"url":url,"error":repr(e)}

          def parse(r):
              try:return json.loads(r.get("body",""))
              except Exception:return None

          jobs=[]
          rows=[]
          with ThreadPoolExecutor(max_workers=24) as ex:
              for base in RPCS:
                  for q in QUERIES:
                      # Canonical JSON-RPC POST
                      payload=json.dumps({"jsonrpc":"2.0","id":"scrt287-v29","method":"block_search",
                                          "params":{"query":q,"page":"1","per_page":"100","order_by":"asc"}}).encode()
                      jobs.append(("POST",base,q,ex.submit(req,base.rstrip("/")+"/",payload,18)))
                      # Tendermint URI mode requires each argument encoded as a JSON value.
                      params={
                        "query":json.dumps(q),
                        "page":json.dumps("1"),
                        "per_page":json.dumps("100"),
                        "order_by":json.dumps("asc"),
                      }
                      url=base.rstrip("/")+"/block_search?"+urllib.parse.urlencode(params)
                      jobs.append(("GET_JSON_ARGS",base,q,ex.submit(req,url,None,18)))

              for mode,base,q,f in jobs:
                  r=f.result(); d=parse(r)
                  rows.append({"mode":mode,"provider":base,"query":q,"ok":r.get("ok"),
                               "status":r.get("status"),"url":r.get("url"),
                               "sha256":r.get("sha256"),"error":r.get("error"),
                               "json":d,"body_excerpt":None if d is not None else r.get("body","")[:10000]})

          candidates=[]
          for r in rows:
              d=r.get("json")
              if not isinstance(d,dict): continue
              res=d.get("result")
              if not isinstance(res,dict): continue
              blocks=res.get("blocks")
              if not isinstance(blocks,list): continue
              for b in blocks:
                  hdr=((b.get("block") or {}).get("header") or {})
                  h=hdr.get("height"); t=hdr.get("time")
                  if not h or not t: continue
                  candidates.append({
                    "mode":r["mode"],"provider":r["provider"],"query":r["query"],
                    "height":int(h),"time":t,
                    "hash":((b.get("block_id") or {}).get("hash")),
                    "last_block_hash":(((hdr.get("last_block_id") or {}).get("hash"))),
                  })

          out={
            "scope":"SOURCE_ONLY_NO_MARKET_DATA",
            "target_voting_end":TARGET,
            "purpose":"Technical correction of V28 block_search parameter encoding; recover governance execution block H without opening market data.",
            "technical_change_only":True,
            "scientific_rules_changed":False,
            "tested_utc":datetime.datetime.now(datetime.timezone.utc).isoformat(),
            "queries":QUERIES,
            "rows":rows,
            "candidates":candidates,
          }
          os.makedirs(os.path.dirname(OUT),exist_ok=True)
          with open(OUT,"w",encoding="utf-8") as f:json.dump(out,f,indent=2,ensure_ascii=False)
          print("SCRT287_V29_CANDIDATES",json.dumps(candidates[:100]))
          PY
      - name: Persist corrected event-index receipt
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/cosmos_native_emission_param_shock_001_v0_2/SCRT287_EVENT_INDEX_PROBE_V29.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "SCRT287: persist corrected event-index source probe v29"
          git push origin HEAD:cosmos-native-emission-param-shock-001-v0.2-t0-remediation-2026-10-07
