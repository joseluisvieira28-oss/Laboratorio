name: Unbonding V0.8 Final KYVE Universe

on:
  push:
    branches:
      - pos-unbonding-completion-001-v0.8-final-kyve-universe-2026-10-07
    paths:
      - "research/pos_unbonding_completion_001_v0_8_final_kyve/v08_final_kyve_qualifier.py"
      - ".github/workflows/unbonding-v08-final-kyve-universe.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pos-unbonding-completion-001-v0.8-final-kyve-universe-2026-10-07
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run final frozen KYVE universe qualifier
        run: python research/pos_unbonding_completion_001_v0_8_final_kyve/v08_final_kyve_qualifier.py
      - name: Commit source-only receipt
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/pos_unbonding_completion_001_v0_8_final_kyve/V08_FINAL_KYVE_QUALIFICATION.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record V0.8 final KYVE universe qualification"
          git pull --rebase origin pos-unbonding-completion-001-v0.8-final-kyve-universe-2026-10-07
          git push origin HEAD:pos-unbonding-completion-001-v0.8-final-kyve-universe-2026-10-07
