name: Radar Supabase Pooler Discovery V0.1 QA

on:
  pull_request:
    branches:
      - crypto-edge-radar-postgres-v0.5
    paths:
      - "crypto_edge_radar/radar/config.py"
      - "crypto_edge_radar/radar/evidence.py"
      - "crypto_edge_radar/radar/forward_web.py"
      - "crypto_edge_radar/radar/supabase_pooler_probe.py"
      - "crypto_edge_radar/tests/test_config_preprovisioned.py"
      - "crypto_edge_radar/tests/test_postgres_evidence.py"
      - "crypto_edge_radar/tests/test_supabase_pooler_probe.py"
      - "crypto_edge_radar/authorities/RADAR_SUPABASE_RUNTIME_ROLE_POOLER_DISCOVERY_V0.1_2026-09-27.md"
      - "crypto_edge_radar/receipts/RADAR_SUPABASE_RUNTIME_ROLE_PREP_2026-09-27.md"
      - ".github/workflows/radar-supabase-pooler-discovery-v01-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          cd crypto_edge_radar
          python -m pip install -e .

      - name: Compile
        run: |
          cd crypto_edge_radar
          python -m compileall radar tests

      - name: Targeted persistence and pooler tests
        run: |
          cd crypto_edge_radar
          python -m unittest -v             tests.test_postgres_evidence             tests.test_config_preprovisioned             tests.test_supabase_pooler_probe             tests.test_persistence_expiry

      - name: Full deterministic Radar suite
        run: |
          cd crypto_edge_radar
          python -m unittest discover -s tests -v

      - name: Least-privilege and no-secret static guard
        run: |
          python - <<'PY'
          from pathlib import Path

          probe=Path("crypto_edge_radar/radar/supabase_pooler_probe.py").read_text()
          evidence=Path("crypto_edge_radar/radar/evidence.py").read_text()
          authority=Path(
              "crypto_edge_radar/authorities/"
              "RADAR_SUPABASE_RUNTIME_ROLE_POOLER_DISCOVERY_V0.1_2026-09-27.md"
          ).read_text()

          assert 'sslmode="require"' in probe
          assert 'SET TRANSACTION READ ONLY' in probe
          assert '"database_mutation": False' in probe
          assert '"secret_value_exposed": False' in probe
          assert '"final_cutover_authorized": False' in probe
          assert "RADAR_SUPABASE_POOLER_PASSWORD" in probe
          assert "PASSWORD '" not in probe.upper()
          assert "INSERT INTO RADAR_EVENTS" not in probe.upper()
          assert "UPDATE RADAR_EVENTS" not in probe.upper()
          assert "DELETE FROM RADAR_EVENTS" not in probe.upper()

          assert "_verify_preprovisioned_schema" in evidence
          assert "schema_preprovisioned" in evidence
          assert "CREATE TABLE IF NOT EXISTS radar_events" in evidence
          assert "no-DDL" in authority or "no DDL" in authority

          receipt=Path(
              "crypto_edge_radar/receipts/"
              "RADAR_SUPABASE_RUNTIME_ROLE_PREP_2026-09-27.md"
          ).read_text()
          assert "rolsuper = false" not in receipt.lower()
          assert "SUPERUSER = false" in receipt
          assert "BYPASSRLS = false" in receipt
          assert "public CREATE = false" in receipt
          assert "No password was persisted" in receipt

          print("RADAR_SUPABASE_POOLER_DISCOVERY_V01_GUARD_PASS")
          PY
