name: CIRV Forward Runtime Audit V0.1
on:
  push:
    branches: [crypto-intraweek-rv-forward-v0.1]
    paths:
      - ".github/workflows/cirv-forward-runtime-audit-v01.yml"
      - "labs/CRYPTO_INTRAWEEK_RV_001/CIRV_FORWARD_AUDIT_TRIGGER.txt"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/cirv-forward-runtime-audit-v01.yml"
      - "labs/CRYPTO_INTRAWEEK_RV_001/CIRV_FORWARD_AUDIT_TRIGGER.txt"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: cirv-forward-runtime-audit-v01-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: crypto-intraweek-rv-forward-v0.1
          fetch-depth: 0

      - name: Audit prospective forward workflow history
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          from pathlib import Path
          from datetime import datetime, timezone

          repo = os.environ["GH_REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          workflow = "cirv-prospective-forward-v02.yml"
          workflow_path = ".github/workflows/cirv-prospective-forward-v02.yml"
          branch = "crypto-intraweek-rv-forward-v0.1"
          since = "2026-09-20T00:00:00Z"

          def get(url):
              req = urllib.request.Request(
                  url,
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                      "User-Agent": "CryptoLab-CIRV-Audit/0.1",
                  },
              )
              with urllib.request.urlopen(req, timeout=30) as r:
                  return json.load(r)

          runs_url = (
              f"https://api.github.com/repos/{repo}/actions/runs"
              f"?branch={branch}&per_page=100"
          )
          payload = get(runs_url)
          rows = []
          for run in payload.get("workflow_runs", []):
              if run.get("path") != workflow_path and run.get("name") != "CIRV BTC ETH Prospective Forward V0.2":
                  continue
              created = run.get("created_at") or ""
              if created and created < since:
                  continue
              arts = get(f"https://api.github.com/repos/{repo}/actions/runs/{run['id']}/artifacts")
              rows.append({
                  "run_id": run.get("id"),
                  "run_number": run.get("run_number"),
                  "event": run.get("event"),
                  "status": run.get("status"),
                  "conclusion": run.get("conclusion"),
                  "created_at": run.get("created_at"),
                  "run_started_at": run.get("run_started_at"),
                  "updated_at": run.get("updated_at"),
                  "head_sha": run.get("head_sha"),
                  "run_attempt": run.get("run_attempt"),
                  "html_url": run.get("html_url"),
                  "artifacts": [
                      {
                          "id": a.get("id"),
                          "name": a.get("name"),
                          "expired": a.get("expired"),
                          "size_in_bytes": a.get("size_in_bytes"),
                          "created_at": a.get("created_at"),
                          "expires_at": a.get("expires_at"),
                      }
                      for a in arts.get("artifacts", [])
                  ],
              })

          target_dates = {}
          for row in rows:
              for a in row["artifacts"]:
                  name = a.get("name") or ""
                  if name.startswith("CIRV_FORWARD_"):
                      parts = name.split("_")
                      if len(parts) >= 4:
                          target = parts[2]
                          target_dates.setdefault(target, []).append({
                              "run_id": row["run_id"],
                              "conclusion": row["conclusion"],
                              "artifact_id": a["id"],
                              "artifact_name": name,
                          })

          expected = ["2026-09-21", "2026-09-22"]
          status = {}
          for d in expected:
              hits = target_dates.get(d, [])
              status[d] = {
                  "evidence_present": bool(hits),
                  "evidence": hits,
                  "classification": "FORECAST_EVIDENCE_PRESENT" if hits else "NO_ARTIFACT_EVIDENCE_FOUND",
              }

          out = {
              "audit_id": "CIRV-FORWARD-RUNTIME-AUDIT-2026-09-22",
              "generated_at_utc": datetime.now(timezone.utc).isoformat(),
              "repository": repo,
              "branch": branch,
              "workflow": workflow,
              "workflow_path": workflow_path,
              "audit_since_utc": since,
              "scientific_model_changed": False,
              "market_outcomes_opened": False,
              "runs": rows,
              "target_date_audit": status,
              "note": (
                  "This receipt audits GitHub Actions runtime evidence only. "
                  "Absence of an artifact is not converted into a scientific outcome. "
                  "No missed target may be retrospectively relabeled as prospective."
              ),
          }

          p = Path("labs/CRYPTO_INTRAWEEK_RV_001/CIRV_FORWARD_RUNTIME_AUDIT_2026-09-22.json")
          p.write_text(json.dumps(out, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          print("CIRV_RUNTIME_AUDIT_JSON=" + json.dumps(out, sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: CIRV_FORWARD_RUNTIME_AUDIT_2026_09_22
          path: labs/CRYPTO_INTRAWEEK_RV_001/CIRV_FORWARD_RUNTIME_AUDIT_2026-09-22.json
          if-no-files-found: warn
          retention-days: 30
