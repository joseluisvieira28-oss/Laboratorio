name: ARQ018 forward collector v0.1
on:
  push:
    branches: [arq018-forward-v0.1]
    paths:
      - 'research/breakout_acceptance/forward_collector_v01.py'
      - '.github/workflows/arq018-forward-collector-v01.yml'
  workflow_dispatch:
  workflow_call:
  schedule:
    - cron: '20 0,4,8,12,16,20 * * *'
permissions:
  contents: read
jobs:
  forward:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arq018-forward-v0.1
          fetch-depth: 0
      - name: Verify frozen scientific artifacts
        run: |
          test "$(git hash-object research/breakout_acceptance/BREAKOUT_ACCEPTANCE_PROSPECTIVE_FREEZE_V0_1.md)" = "fab6e370d46dc1ada141a73567aaa1d99438930c"
          test "$(git hash-object research/breakout_acceptance/forward_collector_v01.py)" = "6604e098013d356cd112f82c4ceb7c11e14772fd"
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Run frozen forward collector
        run: python research/breakout_acceptance/forward_collector_v01.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arq018-forward-v01
          path: BREAKOUT_ACCEPTANCE_FORWARD_V0_1.json
