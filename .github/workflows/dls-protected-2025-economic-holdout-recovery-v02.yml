name: DLS Protected 2025 Economic Holdout Recovery V0.2

on:
  push:
    branches: [dls-field-enrichment-v01]
    paths:
      - "labs/DEFI_LIQUIDATION_SHOCK_001/LAUNCH_PROTECTED_2025_ECONOMIC_HOLDOUT_V02.marker"

permissions:
  actions: read
  contents: read

jobs:
  holdout:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify frozen economic authority and runner
        shell: python
        run: |
          import json,subprocess
          from pathlib import Path
          s=json.loads(Path("labs/DEFI_LIQUIDATION_SHOCK_001/PROTECTED_2025_SOURCE_AUTHORITY_LOCK_V0.2.json").read_text())
          assert s["classification"]=="PROTECTED_2025_SOURCE_AUTHORITY_PASS"
          assert s["source_run_id"]==37134450131
          assert s["source_artifact_id"]==11277791628
          assert s["source_authority_receipt_sha256"]=="79f143c95d229b1ab8a75372d33fb48257e36a29100a5ddf15852d84ba5e8fea"
          assert s["source_cluster_census_sha256"]=="f89889c2b2f184e54ddd8b0ba83cfce47d75b0e5ba59c8fd863cbe8e0051717c"
          assert s["protected_2025_market_outcomes_opened"] is False
          assert s["protected_2026_outcomes_opened"] is False
          assert s["trading_authority"]=="NONE"
          sha=subprocess.check_output(["git","hash-object","labs/DEFI_LIQUIDATION_SHOCK_001/source/run_protected_2025_economic_holdout_v0_1.py"],text=True).strip()
          assert sha=="88b46b3dfa058c85d52f99cd62a14ee550a99e30",sha
          fee=json.loads(Path("labs/DEFI_LIQUIDATION_SHOCK_001/MEXC_API_FUTURES_FEE_AUTHORITY_RECEIPT_V0.1.json").read_text())
          assert fee["classification"]=="MEXC_API_FUTURES_FEE_AUTHORITY_PASS"
          assert fee["primary_execution_assumption"]["primary_all_in_cost_hurdle"]==0.0026
          print("PASS: frozen 2025 economic authority")

      - name: Download immutable protected-2025 source authority
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 37134450131
          name: dls-protected-2025-source-authority-final48-v02
          path: protected_source

      - name: Verify exact source receipt and census hashes before prices
        run: |
          echo "79f143c95d229b1ab8a75372d33fb48257e36a29100a5ddf15852d84ba5e8fea  protected_source/PROTECTED_2025_SOURCE_AUTHORITY_RECEIPT_V0.2.json" | sha256sum -c -
          echo "f89889c2b2f184e54ddd8b0ba83cfce47d75b0e5ba59c8fd863cbe8e0051717c  protected_source/PROTECTED_2025_SOURCE_CLUSTER_CENSUS_V0.2.ndjson" | sha256sum -c -
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path("protected_source/PROTECTED_2025_SOURCE_AUTHORITY_RECEIPT_V0.2.json").read_text())
          assert x["classification"]=="PROTECTED_2025_SOURCE_AUTHORITY_PASS"
          assert x["partition_count"]==48
          assert x["sol_cluster_count"]==5438
          assert x["error_count"]==0
          assert x["firewall"]["prices_2025_opened"] is False
          assert x["firewall"]["returns_2025_opened"] is False
          print("PASS: source authority exact and market-outcome blind")
          PY

      - name: Compile frozen economic runner
        run: python -m py_compile labs/DEFI_LIQUIDATION_SHOCK_001/source/run_protected_2025_economic_holdout_v0_1.py

      - name: Execute protected 2025 economic holdout once
        env:
          PYTHONUNBUFFERED: "1"
        run: >
          python labs/DEFI_LIQUIDATION_SHOCK_001/source/run_protected_2025_economic_holdout_v0_1.py
          --source-root protected_source
          --oos-lock labs/DEFI_LIQUIDATION_SHOCK_001/OOS_ADJUDICATION_LOCK_V0.1.json
          --direction-lock labs/DEFI_LIQUIDATION_SHOCK_001/DIRECTION_SOURCE_AUDIT_LOCK_V0.1.json
          --fee-authority labs/DEFI_LIQUIDATION_SHOCK_001/MEXC_API_FUTURES_FEE_AUTHORITY_RECEIPT_V0.1.json

      - name: Enforce protected-2026 firewall
        if: always()
        shell: python
        run: |
          import json
          from pathlib import Path
          p=Path("labs/DEFI_LIQUIDATION_SHOCK_001/PROTECTED_2025_ECONOMIC_HOLDOUT_RECEIPT_V0.1.json")
          if p.exists():
              x=json.loads(p.read_text())
              assert x["firewall"]["protected_2026_outcomes_opened"] is False
              print("SCIENTIFIC VERDICT:",x["classification"])
          print("NO_2026_OPEN_NO_TRADING")

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dls-protected-2025-economic-holdout-recovery-v02
          path: |
            labs/DEFI_LIQUIDATION_SHOCK_001/PROTECTED_2025_ECONOMIC_HOLDOUT_ACQUISITION_RECEIPT_V0.1.json
            labs/DEFI_LIQUIDATION_SHOCK_001/PROTECTED_2025_ECONOMIC_HOLDOUT_RECEIPT_V0.1.json
            labs/DEFI_LIQUIDATION_SHOCK_001/PROTECTED_2025_ECONOMIC_HOLDOUT_TRADES_V0.1.ndjson
          if-no-files-found: warn
          retention-days: 90

      - name: Firewall
        if: always()
        run: echo NO_TUNING_NO_2026_NO_LIVE_TRADING_NO_ORDERS_NO_WALLETS_NO_EXCHANGE_MUTATION_NO_MAIN_MERGE
