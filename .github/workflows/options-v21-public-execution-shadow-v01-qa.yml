name: OPTIONS V2.1 Public Execution Shadow V0.1 QA

on:
  pull_request:
    branches:
      - crypto-edge-radar-postgres-v0.5
    paths:
      - "crypto_edge_radar/radar/options_v21_execution_shadow.py"
      - "crypto_edge_radar/radar/forward_web.py"
      - "crypto_edge_radar/radar/diamond_board.py"
      - "crypto_edge_radar/tests/test_options_v21_execution_shadow.py"
      - "crypto_edge_radar/tests/test_diamond_board.py"
      - "governance/OPTIONS_SPOTPERP_001_V21_PUBLIC_EXECUTION_SHADOW_V0.1_2026-09-25.md"
      - ".github/workflows/options-v21-public-execution-shadow-v01-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          cd crypto_edge_radar
          python -m pip install -e .

      - name: Compile
        run: |
          cd crypto_edge_radar
          python -m compileall radar tests

      - name: OPTIONS execution-shadow targeted tests
        run: |
          cd crypto_edge_radar
          python -m unittest -v             tests.test_options_v21_execution_shadow             tests.test_options_v21_metrics             tests.test_options_v21_watcher             tests.test_diamond_board

      - name: Full deterministic Radar suite
        run: |
          cd crypto_edge_radar
          python -m unittest discover -s tests -v

      - name: Frozen science and safety guard
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path("crypto_edge_radar/radar/options_v21_execution_shadow.py").read_text()
          w=Path("crypto_edge_radar/radar/options_v21_watcher.py").read_text()
          g=Path("crypto_edge_radar/OPTIONS_SPOTPERP_001_V21_FORWARD_EVIDENCE_GATE_V0.1.json").read_text()
          assert 'FIRST_ELIGIBLE_ENTRY_DAY = date(2026, 9, 26)' in s
          assert 'SCIENTIFIC_BASE_COST_BPS = 10.0' in s
          assert 'SCIENTIFIC_STRESS_COST_BPS = 20.0' in s
          assert 'RESEARCH_NOTIONAL_USDT = 100.0' in s
          assert 'OPERATIONAL_SAMPLE_MIN = 10' in s
          assert 'automatic_micro_live_authorization' in s
          assert '"base_cost_bps_full_notional": 10' in g
          assert '"stress_cost_bps_full_notional": 20' in g
          assert 'BASE_COST_BPS = 10.0' in w
          assert 'STRESS_COST_BPS = 20.0' in w
          lower=s.lower()
          for forbidden in (
              "create_order",
              "place_order",
              "private_key",
              "api_secret",
              "withdraw(",
              "set_leverage(",
          ):
              assert forbidden not in lower, forbidden
          print("OPTIONS_V21_PUBLIC_EXECUTION_SHADOW_V01_GUARD_PASS")
          PY
