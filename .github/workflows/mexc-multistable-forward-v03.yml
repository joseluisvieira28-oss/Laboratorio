name: MEXC Multi-Stable Forward Capture V0.3

on:
  push:
    branches:
      - mexc-multistable-basis-v0.3-prospective-2026-10-07
    paths:
      - 'research/mexc_multistable_basis/forward_trigger_v03/**'

permissions:
  contents: read
  actions: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 220
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - id: trigger
        shell: bash
        run: |
          P=$(git diff-tree --no-commit-id --name-only -r HEAD | grep '^research/mexc_multistable_basis/forward_trigger_v03/' | tail -1)
          test -n "$P"
          export P
          python - <<'PY'
          import json,os
          j=json.load(open(os.environ['P']))
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              for k in ('start','end','segment'):
                  f.write(f"{k}={j[k]}\n")
          PY
      - name: Prospective forward capture
        run: |
          python research/mexc_multistable_basis/forward_collector_v03.py \
            --start "${{ steps.trigger.outputs.start }}" \
            --end "${{ steps.trigger.outputs.end }}" \
            --segment "${{ steps.trigger.outputs.segment }}"
      - uses: actions/upload-artifact@v4
        with:
          name: mexc-multistable-forward-v03-${{ steps.trigger.outputs.segment }}-${{ github.run_id }}
          path: artifacts/mexc_multistable_basis/forward_v03

  readiness:
    needs: capture
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download all V0.3 forward artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/msart
          gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" \
            --jq '.artifacts[] | select(.expired == false) | select(.name | startswith("mexc-multistable-forward-v03-")) | [.id,.name] | @tsv' \
            > /tmp/msart/list.tsv
          while IFS=$'\t' read -r id name; do
            [ -n "$id" ] || continue
            mkdir -p "/tmp/msart/$id"
            gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/$id/zip" > "/tmp/msart/$id.zip"
            unzip -oq "/tmp/msart/$id.zip" -d "/tmp/msart/$id"
          done < /tmp/msart/list.tsv
      - name: Compile adjudicator
        run: python -m py_compile research/mexc_multistable_basis/adjudicate_forward_v03.py
      - name: Frozen readiness / one-shot adjudication
        run: |
          python research/mexc_multistable_basis/adjudicate_forward_v03.py \
            --root /tmp/msart \
            --trigger-dir research/mexc_multistable_basis/forward_trigger_v03 \
            --out /tmp/multistable_v03_readiness.json
      - uses: actions/upload-artifact@v4
        with:
          name: mexc-multistable-readiness-v03-${{ github.run_id }}
          path: /tmp/multistable_v03_readiness.json
