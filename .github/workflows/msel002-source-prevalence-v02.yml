name: MSEL-002 Source Prevalence V0.2

on:
  push:
    branches:
      - memecoin-metadata-duplication-v0.1
    paths:
      - '.github/workflows/msel002-source-prevalence-v02.yml'
      - 'Dream-Account-OS-v2.3-PARTIAL/research/memecoin_metadata_duplication_002/source/collect_onchain_identity_prevalence_v02.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-prevalence-v02:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Execute frozen source/prevalence collector with technical 429 remediation
        working-directory: Dream-Account-OS-v2.3-PARTIAL/research/memecoin_metadata_duplication_002/source
        env:
          MSEL_TX_BATCH_SIZE: '5'
          MSEL_RPS_DELAY: '0.60'
          MSEL_RPC_RETRIES: '7'
          MSEL_ITEM_RETRIES: '12'
          MSEL_ITEM_BACKOFF_START: '2.0'
          MSEL_ITEM_BACKOFF_CAP: '30.0'
        run: |
          set -o pipefail
          python collect_onchain_identity_prevalence_v02.py | tee source_prevalence_receipt_v02.txt
      - name: Upload frozen source/prevalence evidence V0.2
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: msel002-source-prevalence-v02
          path: |
            Dream-Account-OS-v2.3-PARTIAL/research/memecoin_metadata_duplication_002/source/data/onchain_identity_source_v01/
            Dream-Account-OS-v2.3-PARTIAL/research/memecoin_metadata_duplication_002/source/source_prevalence_receipt_v02.txt
          if-no-files-found: warn
          retention-days: 30
