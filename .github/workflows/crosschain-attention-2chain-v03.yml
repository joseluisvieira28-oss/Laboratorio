name: Crosschain Attention ETH-AVAX Discovery V0.3
on:
  push:
    branches: [crosschain-attention-reallocation-v0.1]
    paths:
      - "labs/CROSSCHAIN_ATTENTION_REALLOCATION_001/SOURCE_SCOPE_AMENDMENT_V0.3.json"
      - "labs/CROSSCHAIN_ATTENTION_REALLOCATION_001/DISCOVERY_2CHAIN_PREFREEZE_V0.1.json"
      - "labs/CROSSCHAIN_ATTENTION_REALLOCATION_001/discovery_2chain_v01.py"
      - ".github/workflows/crosschain-attention-2chain-v03.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-then-discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install --disable-pip-version-check -q pandas numpy
      - run: python -m py_compile labs/CROSSCHAIN_ATTENTION_REALLOCATION_001/discovery_2chain_v01.py
      - name: Run fresh two-chain source gate then frozen 2022-2023 Discovery
        run: python labs/CROSSCHAIN_ATTENTION_REALLOCATION_001/discovery_2chain_v01.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: CROSSCHAIN_ATTENTION_ETH_AVAX_001_V0_3
          path: |
            car_2chain_source_receipt.json
            car_2chain_discovery_receipt.json
            car_2chain_events.csv
          if-no-files-found: warn
          retention-days: 30
