name: WBTC-BTC-PEG-REVERSION-001 Source Gate
on:
  push:
    branches: [wbtc-btc-peg-reversion-v0.1]
    paths: ['Dream-Account-OS-v2.3-PARTIAL/research/WBTC_BTC_PEG_REVERSION_001_SOURCE_TRIGGER.txt']
permissions: {contents: write}
jobs:
  source:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {ref: wbtc-btc-peg-reversion-v0.1}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install -q requests
      - run: python Dream-Account-OS-v2.3-PARTIAL/research/wbtc_btc_peg_reversion_001_source_probe.py
      - if: always()
        run: |
          git config user.name "crypto-lab-bot"
          git config user.email "actions@users.noreply.github.com"
          git add Dream-Account-OS-v2.3-PARTIAL/runtime/wbtc_btc_peg_reversion_001_source_receipt.json || true
          git diff --cached --quiet && exit 0
          git commit -m "research: record WBTCBTC source coverage receipt"
          git push origin HEAD:wbtc-btc-peg-reversion-v0.1
