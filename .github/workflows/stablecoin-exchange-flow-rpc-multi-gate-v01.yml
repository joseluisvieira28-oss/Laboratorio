name: STABLECOIN-EXCHANGE-FLOW-001 Multi RPC Gate V0.1
on:
  push:
    branches: [stablecoin-exchange-flow-v0.1]
    paths:
      - 'labs/STABLECOIN_EXCHANGE_FLOW_001/ethereum_rpc_multi_provider_gate_v01.py'
      - '.github/workflows/stablecoin-exchange-flow-rpc-multi-gate-v01.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rpc-multi-provider-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Compile source gate
        run: python -m py_compile labs/STABLECOIN_EXCHANGE_FLOW_001/ethereum_rpc_multi_provider_gate_v01.py
      - name: Execute protected historical provider gate
        run: python labs/STABLECOIN_EXCHANGE_FLOW_001/ethereum_rpc_multi_provider_gate_v01.py
      - name: Upload immutable receipt
        uses: actions/upload-artifact@v4
        with:
          name: stablecoin-exchange-flow-001-rpc-multi-gate-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/stablecoin_exchange_flow_rpc_multi_gate_v01/
          retention-days: 90
