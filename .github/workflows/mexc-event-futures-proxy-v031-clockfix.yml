name: MEXC Event Futures Proxy V0.3.1 Clockfix

on:
  push:
    branches:
      - mexc-event-futures-proxy-v0.3.1-clockfix-2026-10-02
    paths:
      - 'research/mexc_event_futures/**'
      - '.github/workflows/mexc-event-futures-proxy-v031-clockfix.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  clock-corrected-proxy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install --upgrade pip requests
      - name: Run clock-corrected frozen study
        run: python research/mexc_event_futures/proxy_backtest_v031.py
      - name: Verify boundaries
        shell: bash
        run: |
          python - <<'PY'
          import json
          p='artifacts/mexc_event_futures/proxy_backtest_v031.json'
          j=json.load(open(p, encoding='utf-8'))
          assert j['historical_holdout_sep_2026']=='LOCKED_NOT_FETCHED'
          assert j['exact_event_futures']=='NOT_PROVEN'
          print('HOLDOUT_LOCK=PASS')
          print('EXACT_PRODUCT_FAIL_CLOSED=PASS')
          print('PROXY_VERDICT='+j['proxy_verdict'])
          print('SOURCE_AVAILABLE='+','.join(j['source_available_assets']))
          print('SOURCE_BLOCKED='+','.join(j['source_blocked_assets']))
          print('DISCOVERY_PASSERS='+str(len(j['discovery_passers'])))
          print('OOS_SURVIVORS='+str(len(j['oos_survivors'])))
          PY
      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: mexc-event-futures-proxy-v031-clockfix-evidence
          path: |
            artifacts/mexc_event_futures/proxy_backtest_v031.json
            artifacts/mexc_event_futures/proxy_matrix_v031.csv
          if-no-files-found: error
