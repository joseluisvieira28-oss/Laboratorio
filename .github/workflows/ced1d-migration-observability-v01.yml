name: CED1D Migration Observability V0.1

on:
  pull_request:
    branches:
      - crypto-edge-radar-postgres-v0.5
  push:
    branches:
      - ced1d-migration-observability-v0.1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crypto_edge_radar
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - run: python -m unittest tests.test_external_freshness -v
      - run: python -m unittest discover -s tests -v

