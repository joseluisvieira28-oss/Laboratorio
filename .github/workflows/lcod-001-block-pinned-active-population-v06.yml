name: LCOD-001 block-pinned active population V0.6
on:
  push:
    branches: [liquidation-convexity-oracle-distance-001-source-gate-v0.1]
    paths:
      - 'research/liquidation_convexity_oracle_distance_001/LCOD_BLOCK_PINNED_ACTIVE_POPULATION_PIPELINE_FREEZE_V0.6.md'
      - 'research/liquidation_convexity_oracle_distance_001/lcod_block_pinned_active_population_v06.mjs'
      - '.github/workflows/lcod-001-block-pinned-active-population-v06.yml'
permissions:
  contents: write
jobs:
  population:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with: {ref: liquidation-convexity-oracle-distance-001-source-gate-v0.1}
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - run: npm install --no-save @subsquid/evm-stream@0.1.5 ethers
      - run: node research/liquidation_convexity_oracle_distance_001/lcod_block_pinned_active_population_v06.mjs
      - name: Persist receipt
        if: always()
        run: |
          if [ -f artifacts/lcod_block_pinned_active_population_v06.json ]; then
            cp artifacts/lcod_block_pinned_active_population_v06.json research/liquidation_convexity_oracle_distance_001/LCOD_BLOCK_PINNED_ACTIVE_POPULATION_RECEIPT.json
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add research/liquidation_convexity_oracle_distance_001/LCOD_BLOCK_PINNED_ACTIVE_POPULATION_RECEIPT.json
            if ! git diff --cached --quiet; then
              git commit -m "LCOD-001: record block-pinned active population V0.6 [skip ci]"
              git push origin HEAD:liquidation-convexity-oracle-distance-001-source-gate-v0.1
            fi
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lcod-block-pinned-active-population-v06
          path: artifacts/lcod_block_pinned_active_population_v06.json
          if-no-files-found: error
