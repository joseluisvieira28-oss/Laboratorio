name: Cross-Venue Funding Basis Semantic and Mark Provenance V0.4.3

on:
  push:
    branches:
      - dream-account-phase-b-signal-research-v0.1
    paths:
      - 'Dream-Account-OS-v2.3-PARTIAL/research/CROSS_VENUE_FUNDING_BASIS_SEMANTIC_AND_BASIS_PROVENANCE_AMENDMENT_V043.json'
      - 'Dream-Account-OS-v2.3-PARTIAL/research/cross_venue_funding_basis_semantic_mark_provenance_v043.py'
      - 'Dream-Account-OS-v2.3-PARTIAL/tests/test_cross_venue_funding_basis_semantic_mark_provenance_v043.py'
      - '.github/workflows/cross-venue-funding-basis-semantic-mark-provenance-v043.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  semantic-mark-provenance-v043:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run offline V0.4.3 governance tests
        run: |
          cd Dream-Account-OS-v2.3-PARTIAL
          python -m pip install pytest
          python -m pytest -q tests/test_cross_venue_funding_basis_semantic_mark_provenance_v043.py

      - name: Compile V0.4.3 probe
        run: |
          cd Dream-Account-OS-v2.3-PARTIAL
          python -m py_compile research/cross_venue_funding_basis_semantic_mark_provenance_v043.py

      - name: Verify V0.4.3 authority is narrow and fail-closed
        run: |
          cd Dream-Account-OS-v2.3-PARTIAL
          python - <<'PY'
          import json
          from pathlib import Path
          a = json.loads(Path('research/CROSS_VENUE_FUNDING_BASIS_SEMANTIC_AND_BASIS_PROVENANCE_AMENDMENT_V043.json').read_text())
          assert a['economic_outcomes_inspected'] is False
          assert a['edge_status'] == 'UNPROVEN'
          assert a['semantic_probe_authorization']['candidate_semantics_fixed_before_probe']['candidate_clamps'] == ['0.0003','0.0005']
          assert a['semantic_probe_authorization']['candidate_semantics_fixed_before_probe']['candidate_scale_divisors'] == [1,8]
          assert a['calendar_materialization_rule']['no_outcome_dependent_exclusion'] is True
          assert a['gate_state_after_this_amendment_before_new_receipts']['G12_DISCOVERY_AUTHORIZATION'] == 'BLOCKED'
          for k, v in a['scientific_boundary'].items():
              assert v is False, k
          print('PASS: V0.4.3 narrow pre-outcome authority')
          PY

      - name: Run fixed semantic and Binance mark timestamp probe
        env:
          PREFREEZE_V043_RECEIPT: CROSS_VENUE_FUNDING_BASIS_V043_RECEIPT.json
        run: |
          cd Dream-Account-OS-v2.3-PARTIAL
          python research/cross_venue_funding_basis_semantic_mark_provenance_v043.py

      - name: Assert semantic result and economic guards
        run: |
          cd Dream-Account-OS-v2.3-PARTIAL
          python - <<'PY'
          import json
          from pathlib import Path
          r = json.loads(Path('CROSS_VENUE_FUNDING_BASIS_V043_RECEIPT.json').read_text())
          assert r['status'] == 'PASS_PARTIAL_PREFREEZE'
          assert r['hyperliquid_funding_semantics']['semantic_probe_pass'] is True
          assert r['hyperliquid_funding_semantics']['detected_scale_label'] == 'HOURLY_ONE_EIGHTH_OF_8H_FORMULA'
          assert r['hyperliquid_funding_semantics']['detected_clamp_regime'] == '0.0003_BEFORE_2023-12-11T23Z__0.0005_AT_AND_AFTER'
          assert r['binance_mark_timestamp_provenance']['price_values_parsed'] is False
          assert r['binance_mark_timestamp_provenance']['price_values_output'] is False
          assert r['gate_interpretation']['G04'] == 'PARTIAL_BINANCE_MARK_AUDITED_HYPERLIQUID_ASSET_CTX_PENDING'
          assert r['gate_interpretation']['G10'] == 'PROVISIONAL_ONLY_NOT_MATERIALIZED'
          assert r['gate_interpretation']['G12'] == 'BLOCKED'
          for k in ('locked_2026_accessed','mexc_accessed','authenticated_account_data_used','exchange_mutation_used',
                    'carry_computed','apr_apy_computed','pnl_computed','signals_computed',
                    'cross_venue_rate_comparison_computed','price_values_output','discovery_authorized','trading_authorized'):
              assert r[k] is False, k
          print('HL_SCALE=' + r['hyperliquid_funding_semantics']['detected_scale_label'])
          print('HL_CLAMP=' + r['hyperliquid_funding_semantics']['detected_clamp_regime'])
          print('BINANCE_MARK_COMMON_FULL=' + str(r['binance_mark_timestamp_provenance']['common_full_mark_month_count']))
          missing = [m for m in r['binance_mark_timestamp_provenance']['candidate_months'] if m not in r['binance_mark_timestamp_provenance']['common_full_mark_months']]
          print('BINANCE_MARK_EXCLUDED=' + ','.join(missing))
          print('PASS: V0.4.3 remains pre-Discovery')
          PY

      - name: Upload V0.4.3 receipt
        uses: actions/upload-artifact@v4
        with:
          name: cross-venue-funding-basis-v043-receipt
          path: Dream-Account-OS-v2.3-PARTIAL/CROSS_VENUE_FUNDING_BASIS_V043_RECEIPT.json
          if-no-files-found: error
          retention-days: 30

# operational rerun trigger 2026-09-13T11:07+02:00; no scientific or economic logic change
