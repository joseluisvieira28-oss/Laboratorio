name: PMD-001 Public RPC Probe V0.2

on:
  workflow_dispatch:
  push:
    branches:
      - pumpfun-migration-direction-source-rebuild-v0.2
    paths:
      - '.github/workflows/pmd001-public-rpc-probe-v02.yml'
      - 'Dream-Account-OS-v2.3-PARTIAL/research/pumpfun_migration_direction_001/source_rebuild_public_rpc_probe_v02.py'

permissions:
  contents: read

jobs:
  public-rpc-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout research branch
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install probe dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'huggingface_hub[hf_xet]>=0.34' 'pyarrow>=18,<22'

      - name: Run public mainnet archival fallback probe
        id: probe
        shell: bash
        env:
          HF_HUB_DISABLE_TELEMETRY: '1'
          PMD_SOLANA_RPC_URL: 'https://api.mainnet.solana.com'
        run: |
          set +e
          mkdir -p artifacts
          python Dream-Account-OS-v2.3-PARTIAL/research/pumpfun_migration_direction_001/source_rebuild_public_rpc_probe_v02.py 2>&1 | tee artifacts/pmd001_public_rpc_probe_v02.log
          rc=${PIPESTATUS[0]}
          echo "probe_rc=$rc" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Assert forbidden outcome file absent
        if: always()
        run: |
          if find artifacts -name 'postgard_outcomes.parquet' -print -quit | grep -q .; then
            echo 'Forbidden outcome file detected.'
            exit 1
          fi
          echo 'Outcome file absent: PASS'

      - name: Upload probe evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pmd001-public-rpc-probe-v02
          path: artifacts/
          if-no-files-found: error
          retention-days: 30

      - name: Enforce fail-closed probe verdict
        if: always()
        run: |
          rc='${{ steps.probe.outputs.probe_rc }}'
          if [ -z "$rc" ]; then exit 2; fi
          exit "$rc"
