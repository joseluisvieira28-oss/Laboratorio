name: Crosschain Price Attention V0.1
on:
  push:
    branches: [crosschain-price-attention-v0.1]
    paths:
      - "labs/CROSSCHAIN_PRICE_ATTENTION_001/PREFREEZE_V0.1.json"
      - "labs/CROSSCHAIN_PRICE_ATTENTION_001/discovery_v01.py"
      - ".github/workflows/crosschain-price-attention-v01.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install --disable-pip-version-check -q pandas numpy
      - name: Compile
        run: python -m py_compile labs/CROSSCHAIN_PRICE_ATTENTION_001/discovery_v01.py
      - name: Run frozen source gate, Discovery, conditional 2025 holdout
        run: python labs/CROSSCHAIN_PRICE_ATTENTION_001/discovery_v01.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: CROSSCHAIN_PRICE_ATTENTION_001_V0_1
          path: |
            cpa_source_receipt_v01.json
            cpa_discovery_receipt_v01.json
            cpa_final_receipt_v01.json
            cpa_discovery_trades_v01.csv
            cpa_holdout_2025_trades_v01.csv
          if-no-files-found: warn
          retention-days: 30
