name: licp-fwd-xalt-004-integrity-v01

on:
  push:
    branches:
      - liquidation-cascade-propagation-v0.1
    paths:
      - 'research/liquidation_cascade/LICP_FWD_XALT_004_PRE_OUTCOME_FREEZE_V0_1.md'
      - 'research/liquidation_cascade/licp_fwd_xalt_004_observer_v01.py'
      - 'research/liquidation_cascade/licp_fwd_xalt_004_state_v01.py'
      - 'research/liquidation_cascade/test_licp_fwd_xalt_004_v01.py'
      - 'research/liquidation_cascade/test_licp_fwd_xalt_004_state_v01.py'
      - '.github/workflows/licp-fwd-xalt-004-integrity-v01.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest 'websockets>=13,<16'
      - name: Frozen-candidate unit tests
        env:
          PYTHONPATH: .
        run: python -m pytest -q research/liquidation_cascade/test_licp_fwd_xalt_004_v01.py research/liquidation_cascade/test_licp_fwd_xalt_004_state_v01.py
      - name: Confirm observer fails closed while trigger config is UNFROZEN
        env:
          PYTHONPATH: .
        run: |
          if python research/liquidation_cascade/licp_fwd_xalt_004_observer_v01.py; then
            echo "ERROR: observer unexpectedly initialized with UNFROZEN config"
            exit 1
          else
            echo "PASS: observer refused UNFROZEN config as required"
          fi
