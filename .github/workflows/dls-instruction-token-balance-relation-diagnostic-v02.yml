name: DLS Instruction Token Balance Relation Diagnostic V0.2

on:
  push:
    branches:
      - dls-field-enrichment-v01
    paths:
      - .github/workflows/dls-instruction-token-balance-relation-diagnostic-v02.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile diagnostic
        run: python -m py_compile labs/DEFI_LIQUIDATION_SHOCK_001/source/diagnose_instruction_token_balance_relation_v0_2.py
      - name: Diagnose raw relation shape
        run: python labs/DEFI_LIQUIDATION_SHOCK_001/source/diagnose_instruction_token_balance_relation_v0_2.py
      - name: Upload diagnostic receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dls-instruction-token-balance-relation-diagnostic-v02
          path: labs/DEFI_LIQUIDATION_SHOCK_001/INSTRUCTION_TOKEN_BALANCE_RELATION_DIAGNOSTIC_RECEIPT_V0.2.json
          if-no-files-found: error
          retention-days: 30
      - name: Firewall
        if: always()
        run: echo SOURCE_ONLY_TRUE
