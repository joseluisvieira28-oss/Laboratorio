name: Bitget Wrapper V0.1.6

on:
  push:
    branches:
      - bitget-maker-microstructure-v0.1-source-gate-2026-10-05
    paths:
      - research/cross_venue_stock/bitget_wrapper_v016.py
      - .github/workflows/bitget-wrapper-v016.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check requests
      - run: python research/cross_venue_stock/bitget_wrapper_v016.py
      - uses: actions/upload-artifact@v4
        with:
          name: bitget-wrapper-v016-${{ github.run_id }}
          path: artifacts/cross_venue_stock/bitget_wrapper_v016
          if-no-files-found: error
          retention-days: 90
