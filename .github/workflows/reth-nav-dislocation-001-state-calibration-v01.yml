name: RETH-NAV-DISLOCATION-001 state calibration V0.1

on:
  push:
    branches:
      - reth-nav-dislocation-001-source-gate-v01
    paths:
      - 'research/reth_nav_dislocation_001/RETH_PREDICTOR_ONLY_CENSUS_RECEIPT_V0.1.json'
      - 'research/reth_nav_dislocation_001/RETH_PREDICTOR_ONLY_CENSUS_ROWS_V0.1.json'
      - 'research/reth_nav_dislocation_001/PRE_OUTCOME_STATE_AND_PARTITION_FREEZE_V0.1.md'
      - 'research/reth_nav_dislocation_001/reth_state_calibration_v01.py'
      - '.github/workflows/reth-nav-dislocation-001-state-calibration-v01.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  calibrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: reth-nav-dislocation-001-source-gate-v01
      - name: Require exact passing census and compute frozen q05/q95 states
        run: python research/reth_nav_dislocation_001/reth_state_calibration_v01.py
      - name: Persist calibration receipt
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/reth_nav_dislocation_001/RETH_STATE_CALIBRATION_RECEIPT_V0.1.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "RETH-NAV-DISLOCATION-001: persist frozen state calibration [skip ci]"
          git push origin HEAD:reth-nav-dislocation-001-source-gate-v01
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reth-state-calibration-v01
          path: research/reth_nav_dislocation_001/RETH_STATE_CALIBRATION_RECEIPT_V0.1.json
          if-no-files-found: error
