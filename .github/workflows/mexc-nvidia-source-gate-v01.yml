name: MEXC NVIDIA Source Gate V0.1

on:
  push:
    branches:
      - mexc-nvidia-equity-dislocation-v0.1-source-gate-2026-10-04
    paths:
      - 'research/mexc_global_assets/MEXC_NVIDIA_SOURCE_GATE_FREEZE_V0.1.md'
      - 'research/mexc_global_assets/mexc_nvidia_source_probe_v01.py'
      - '.github/workflows/mexc-nvidia-source-gate-v01.yml'

permissions:
  contents: read

jobs:
  source-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependency
        run: python -m pip install --disable-pip-version-check requests
      - name: Governance preflight
        run: |
          test "$GITHUB_REF_NAME" = "mexc-nvidia-equity-dislocation-v0.1-source-gate-2026-10-04"
          test -f research/mexc_global_assets/MEXC_NVIDIA_SOURCE_GATE_FREEZE_V0.1.md
          python -m py_compile research/mexc_global_assets/mexc_nvidia_source_probe_v01.py
          echo 'SOURCE ONLY / PRE-OUTCOME'
      - name: Execute NVIDIA public source gate
        run: python research/mexc_global_assets/mexc_nvidia_source_probe_v01.py
      - name: Upload immutable source evidence
        uses: actions/upload-artifact@v4
        with:
          name: mexc-nvidia-source-v01-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/mexc_global_assets/nvidia_source_gate_v01
          if-no-files-found: error
          retention-days: 90
      - name: Governance closeout
        run: |
          echo 'NO HISTORICAL SIGNAL OUTCOMES'
          echo 'NO PRIVATE ENDPOINTS / NO ACCOUNT READS'
          echo 'NO ORDERS / NO MUTATION / NO LIVE TRADING'
