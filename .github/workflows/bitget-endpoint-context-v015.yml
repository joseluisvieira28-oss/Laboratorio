name: Bitget Endpoint Context V0.1.5

on:
  push:
    branches:
      - bitget-maker-microstructure-v0.1-source-gate-2026-10-05
    paths:
      - research/cross_venue_stock/bitget_endpoint_context_v015.py
      - .github/workflows/bitget-endpoint-context-v015.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check requests
      - run: python research/cross_venue_stock/bitget_endpoint_context_v015.py
      - uses: actions/upload-artifact@v4
        with:
          name: bitget-endpoint-context-v015-${{ github.run_id }}
          path: artifacts/cross_venue_stock/bitget_endpoint_context_v015
          if-no-files-found: error
          retention-days: 90
