name: CONVEX FIRSTBASKET 4R HIST 001
on:
  push:
    branches: ['research/convex-firstbasket-4r-hist-2026-10-12']
    paths: ['research/convex_firstbasket_4r_hist_20261012/replay.py', 'research/convex_firstbasket_4r_hist_20261012/test_replay.py', '.github/workflows/convex_firstbasket_4r_hist_20261012.yml']
permissions:
  contents: read
jobs:
  historical:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Record execution identity and test invariants
        run: |
          git rev-parse HEAD
          python -m unittest discover -s research/convex_firstbasket_4r_hist_20261012 -p test_replay.py -v
      - name: Source gate all three then frozen replay
        run: python research/convex_firstbasket_4r_hist_20261012/replay.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: CONVEX-FIRSTBASKET-4R-HIST-001
          path: research/convex_firstbasket_4r_hist_20261012/receipts/
          retention-days: 90
