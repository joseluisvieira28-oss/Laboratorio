name: BTC Event10m One-Shot Paper + Index Shadow (DORMANT)
# NOTE: workflow_dispatch needs registration on default branch.
# This branch does not enable or schedule a prospective collector.
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  btc-paper-only:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
      - name: Install public read-only browser and WS dependencies
        run: |
          python -m pip install --disable-pip-version-check playwright==1.56.0 websockets==15.0.1
          python -m playwright install chromium
      - name: Collect frozen November BTC-only causal features and one PAPER signal
        run: python research/mexc_event_direction_v01/btc_event10m_paper_decision_v05.py
      - name: Publish original decision AND eight raw source files before expiry
        id: preexpiry
        uses: actions/upload-artifact@v4
        with:
          name: btc-event10m-preexpiry-source-and-decision
          path: artifacts/btc_event10m_paper_v05/
          if-no-files-found: error
          compression-level: 0
      - name: Download same published artifact via separate GitHub REST call
        env:
          GITHUB_TOKEN: \${{ github.token }}
          ART_ID: \${{ steps.preexpiry.outputs.artifact-id }}
        run: |
          curl --fail --show-error --silent --location --max-time 40 \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -o "$RUNNER_TEMP/btc-preexpiry.zip" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$ART_ID/zip"
          test -s "$RUNNER_TEMP/btc-preexpiry.zip"
      - name: Independently verify server created_at, artifact zip hash, eight HTTP source bytes and model
        env:
          GITHUB_TOKEN: \${{ github.token }}
          ART_ID: \${{ steps.preexpiry.outputs.artifact-id }}
          RUN_ID: \${{ github.run_id }}
        run: |
          python research/mexc_event_direction_v01/btc_event10m_custody_v05.py \
            --decision artifacts/btc_event10m_paper_v05/decision.json \
            --archive "$RUNNER_TEMP/btc-preexpiry.zip" \
            --artifact-id "$ART_ID" --run-id "$RUN_ID" \
            --output artifacts/btc_event10m_paper_v05/verified_custody.json
      - name: Ensure no expiry query for ABSTAIN
        id: verdict
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          d=json.load(open("artifacts/btc_event10m_paper_v05/decision.json"))
          side=(d.get("forecast") or {}).get("side")
          if side not in ("UP","DOWN","ABSTAIN"):
              raise SystemExit("MISSING_FROZEN_PAPER_DIRECTION")
          print("qualified="+("true" if side!="ABSTAIN" else "false"))
          PY
      - name: Capture first on-time PUBLIC MEXC INDEX tick and compute SHADOW ONLY
        if: steps.verdict.outputs.qualified == 'true'
        run: |
          python research/mexc_event_direction_v01/btc_event10m_public_expiry_v05.py \
            --decision artifacts/btc_event10m_paper_v05/decision.json \
            --anchor artifacts/btc_event10m_paper_v05/verified_custody.json
      - name: Preserve results, including fail-closed receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: btc-event10m-shadow-postexpiry-or-blocked
          path: artifacts/btc_event10m_paper_v05/
          if-no-files-found: warn
