name: DLS Marginfi Orca Impact Pre-Outcome Gate V0.1
on:
  push:
    branches: [dls-marginfi-route-migration-v01]
    paths: [labs/DEFI_LIQUIDATION_SHOCK_001/LAUNCH_MARGINFI_ORCA_IMPACT_PRECHECK_V01.marker]
permissions: {actions: read, contents: read}
jobs:
  precheck:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {ref: "${{ github.sha }}"}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Download exact canonical Orca source PASS
        uses: actions/download-artifact@v4
        with:
          github-token: "${{ github.token }}"
          repository: "${{ github.repository }}"
          run-id: 36780139559
          artifact-ids: 11127536853
          path: source_gate
      - name: Run source-only pre-outcome gate
        run: python labs/DEFI_LIQUIDATION_SHOCK_001/source/precheck_marginfi_orca_impact_v0_1.py --source-root source_gate
      - name: Upload immutable precheck
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dls-marginfi-orca-impact-precheck-v01
          path: |
            labs/DEFI_LIQUIDATION_SHOCK_001/MARGINFI_ORCA_IMPACT_PREOUTCOME_RECEIPT_V0.1.json
            labs/DEFI_LIQUIDATION_SHOCK_001/MARGINFI_ORCA_IMPACT_PREOUTCOME_CASCADES_V0.1.ndjson
          retention-days: 90
      - name: Firewall
        if: always()
        run: echo SOURCE_ONLY_NO_MARKET_OUTCOMES_NO_TRADING
