name: BUILD MEXC LIVE EXECUTION PREP V0.1

on:
  workflow_dispatch:
  push:
    branches:
      - mexc-live-execution-prep-v0.1
    paths:
      - 'crypto_edge_radar/radar/mexc_*'
      - 'crypto_edge_radar/scripts/mexc_live_executor.py'
      - 'crypto_edge_radar/tests/test_mexc_*'
      - 'crypto_edge_radar/ETF_CME_INSTFLOW_001_MICRO_LIVE_EXECUTION_AUTHORITY_TEMPLATE_V0.1.json'
      - '.github/workflows/build-mexc-live-execution-prep-v01.yml'

permissions:
  contents: read

jobs:
  test-build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: crypto_edge_radar
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: |
          python -m pip install -e .
          python -m pip install "pyinstaller>=6,<7"
      - name: Compile
        run: python -m compileall radar scripts tests
      - name: MEXC execution safety tests
        run: python -m unittest discover -s tests -p "test_mexc_*.py" -v
      - name: Prove template cannot authorize live order
        shell: pwsh
        run: |
          $a=Get-Content ETF_CME_INSTFLOW_001_MICRO_LIVE_EXECUTION_AUTHORITY_TEMPLATE_V0.1.json | ConvertFrom-Json
          if ($a.status -ne "TEMPLATE_NOT_AUTHORITY") { throw "template unexpectedly active" }
          if ($a.orders_authorized_by_this_template) { throw "template authorizes orders" }
      - name: Build local executor
        run: |
          pyinstaller --clean --onefile --name MEXCLiveExecutor --paths . scripts/mexc_live_executor.py
      - name: Hash
        shell: pwsh
        run: |
          $hash=(Get-FileHash dist\MEXCLiveExecutor.exe -Algorithm SHA256).Hash.ToLower()
          "sha256=$hash" | Out-File dist\MEXCLiveExecutor.sha256.txt -Encoding ascii
          Get-Content dist\MEXCLiveExecutor.sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: mexc-live-execution-prep-v01
          path: |
            crypto_edge_radar/dist/MEXCLiveExecutor.exe
            crypto_edge_radar/dist/MEXCLiveExecutor.sha256.txt
            crypto_edge_radar/ETF_CME_INSTFLOW_001_MICRO_LIVE_EXECUTION_AUTHORITY_TEMPLATE_V0.1.json
          retention-days: 14
          if-no-files-found: error
