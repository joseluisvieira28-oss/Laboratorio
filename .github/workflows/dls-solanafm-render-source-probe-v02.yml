name: DLS SolanaFM Render Source Probe V0.2 QA

on:
  pull_request:
    branches:
      - crypto-edge-radar-postgres-v0.5
  push:
    branches:
      - dls-solanafm-render-probe-v0.2
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crypto_edge_radar
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - run: python -m unittest tests.test_dls_solanafm_source_probe tests.test_forward_web_dashboard -v
      - run: python -m unittest discover -s tests -v
