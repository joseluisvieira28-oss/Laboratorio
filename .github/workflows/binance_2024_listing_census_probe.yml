name: Binance 2025 Holdout Listing Census Probe
on:
  push:
    branches:
      - binance-listing-cascade-v0.4-2025-holdout-prereg-2026-10-05
    paths:
      - 'research/binance_listing_information_cascade/binance_2024_census_probe.py'
      - '.github/workflows/binance_2024_listing_census_probe.yml'
permissions:
  contents: read
jobs:
  census:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: binance-listing-cascade-v0.4-2025-holdout-prereg-2026-10-05
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python research/binance_listing_information_cascade/binance_2024_census_probe.py
