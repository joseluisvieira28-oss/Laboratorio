name: Premium Basis V1.4 Current Payout Snapshot 2026-10-08

on:
  push:
    branches:
      - mexc-event-futures-premium-basis-v1.4-watcher-2026-10-03
    paths:
      - '.github/workflows/premium-basis-v14-current-payout-20261008.yml'

permissions:
  contents: read

jobs:
  payout-snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install read-only browser dependencies
        run: |
          python -m pip install requests playwright
          python -m playwright install --with-deps chromium
      - name: Run exact current public payout collector
        run: python research/mexc_event_futures/exact_payout_collector_v063.py
      - name: Report MUUSDT only
        run: |
          python - <<'PY'
          import json
          p='artifacts/mexc_event_futures/exact_payout_snapshot_v063.json'
          j=json.load(open(p))
          rows=[r for r in j.get('records',[]) if r.get('asset')=='MUUSDT']
          print('SOURCE_GATE='+str(j.get('source_gate')))
          print('MU_ROWS='+str(len(rows)))
          for r in rows:
              print('MU',r['horizon'],'UP',r['up_payout_pct'],'DOWN',r['down_payout_pct'],'AT',r['observed_at_utc'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: premium-basis-v14-current-payout-20261008
          path: |
            artifacts/mexc_event_futures/exact_payout_snapshot_v063.json
            artifacts/mexc_event_futures/exact_payout_snapshot_v063.jsonl
          if-no-files-found: error
          retention-days: 90
