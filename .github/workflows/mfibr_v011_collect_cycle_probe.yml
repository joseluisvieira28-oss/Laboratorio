name: MFIBR V0.1.1 CollectCycle Probe

on:
  push:
    branches:
      - mexc-funding-interval-basis-replication-v0.1-source-2026-10-07
    paths:
      - research/mexc_funding_interval_basis_replication/collect_cycle_probe_v011.py
      - .github/workflows/mfibr_v011_collect_cycle_probe.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - run: python -m py_compile research/mexc_funding_interval_basis_replication/collect_cycle_probe_v011.py
      - run: python research/mexc_funding_interval_basis_replication/collect_cycle_probe_v011.py
