name: Stablecoin Supply Liquidity Impulse V0.1
on:
  push:
    branches: [stablecoin-supply-liquidity-impulse-v0.1]
    paths:
      - "labs/STABLECOIN_SUPPLY_LIQUIDITY_001/SOURCE_AUTHORITY_V0.1.json"
      - "labs/STABLECOIN_SUPPLY_LIQUIDITY_001/DISCOVERY_PREFREEZE_V0.1.json"
      - "labs/STABLECOIN_SUPPLY_LIQUIDITY_001/discovery_v01.py"
      - ".github/workflows/stablecoin-supply-liquidity-v01.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-then-discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install --disable-pip-version-check -q pandas numpy
      - name: Compile
        run: python -m py_compile labs/STABLECOIN_SUPPLY_LIQUIDITY_001/discovery_v01.py
      - name: Run bounded source gate then frozen 2021-2023 Discovery
        run: python labs/STABLECOIN_SUPPLY_LIQUIDITY_001/discovery_v01.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: STABLECOIN_SUPPLY_LIQUIDITY_001_V0_1
          path: |
            ssli_source_receipt_v01.json
            ssli_discovery_receipt_v01.json
            ssli_discovery_events_v01.csv
          if-no-files-found: warn
          retention-days: 30
