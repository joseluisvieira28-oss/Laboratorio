name: reactive-shock-r1-frozen-2026-11-17
on:
  push:
    branches:
      - research/reactive-shock-r1-frozen-2026-11-17
    paths:
      - 'research/microstructure_scalping/reactive_shock_r1_runner.py'
      - 'research/microstructure_scalping/test_reactive_shock_r1.py'
      - '.github/workflows/reactive-shock-r1-frozen-2026-11-17.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  frozen-r1:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install beautifulsoup4
      - name: Unit tests before market access
        run: python -m unittest -v research.microstructure_scalping.test_reactive_shock_r1
      - name: 2023 frozen R1 replication (research only)
        run: python -m research.microstructure_scalping.reactive_shock_r1_runner
      - name: Preserve receipts even when a source is blocked
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reactive-shock-r1-receipts
          path: research/microstructure_scalping/receipts/reactive_shock_r1_economic_receipt.json
          if-no-files-found: warn
          retention-days: 30