name: MLMXD V0.1.3 API Schema Diagnostic
on:
  workflow_dispatch:
  push:
    branches:
      - mexc-launchpool-mx-demand-v0.1-source-2026-10-07
    paths:
      - '.github/workflows/mlmxd_v013_api_schema_diag.yml'
permissions:
  contents: read
jobs:
  diag:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install ccxt
      - name: Print public announcement schema only
        run: |
          python - <<'PY'
          import ccxt,json
          ex=ccxt.mexc({"enableRateLimit":True})
          x=ex.spot_public_get_announcements({})
          print("AUTHENTICATED=false MARKET_PRICES_OPENED=false")
          print(json.dumps(x,ensure_ascii=False,indent=2)[:40000])
          PY
