name: Triple Fishing Multi-Slot V0.4 Engineering Gate

on:
  push:
    branches:
      - triple-fishing-multislot-v04-2026-10-02
    paths:
      - 'crypto_edge_radar/radar/multi_slot_reservation_v04.py'
      - 'crypto_edge_radar/radar/global_fishing_dispatcher_v04.py'
      - 'crypto_edge_radar/radar/multislot_shadow_capacity_v04.py'
      - 'crypto_edge_radar/radar/multislot_shadow_lifecycle_v04.py'
      - 'crypto_edge_radar/tests/test_multislot_v04.py'
      - 'crypto_edge_radar/execution/TRIPLE_FISHING_MULTI_SLOT_SMALL_AGGRESSIVE_V04.json'
      - 'crypto_edge_radar/governance/TRIPLE_FISHING_MULTI_SLOT_V04_PRELIVE_FREEZE.md'
      - '.github/workflows/triple-fishing-multislot-v04.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  engineering-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: crypto_edge_radar
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install package
        run: python -m pip install -e .

      - name: Compile V0.4 modules
        run: |
          python -m py_compile             radar/multi_slot_reservation_v04.py             radar/global_fishing_dispatcher_v04.py             radar/multislot_shadow_capacity_v04.py \
            radar/multislot_shadow_lifecycle_v04.py

      - name: Run deterministic multi-slot tests
        run: PYTHONPATH=. python -m unittest tests.test_multislot_v04 -v

      - name: Verify frozen policy is exactly three slots and non-live
        run: |
          python - <<'PY'
          import json
          p=json.load(open("execution/TRIPLE_FISHING_MULTI_SLOT_SMALL_AGGRESSIVE_V04.json",encoding="utf-8"))
          assert p["capacity"]["max_simultaneous_positions"] == 3
          assert p["global_risk"]["max_total_notional_usdt"] == 30
          assert p["global_risk"]["max_total_initial_margin_usdt"] == 14
          assert p["lanes"]["OPTIONS-SPOTPERP-001-V2.1"]["leverage"] == 1
          assert p["lanes"]["OPTIONS-SPOTPERP-001-V2.1"]["max_notional_usdt"] == 10
          assert p["governance"]["current_v03_authority_unchanged"] is True
          assert p["status"] == "ENGINEERING_FREEZE__LIVE_ACTIVATION_NOT_YET_AUTHORIZED"
          print("MULTISLOT_V04_ENGINEERING_POLICY_PASS")
          PY
