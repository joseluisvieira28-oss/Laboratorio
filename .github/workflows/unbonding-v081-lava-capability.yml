name: Unbonding V0.8.1 LAVA Capability

on:
  push:
    branches:
      - pos-unbonding-completion-001-v0.8-final-kyve-universe-2026-10-07
    paths:
      - "research/pos_unbonding_completion_001_v0_8_final_kyve/v081_lava_census_capability.py"
      - ".github/workflows/unbonding-v081-lava-capability.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  capability:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pos-unbonding-completion-001-v0.8-final-kyve-universe-2026-10-07
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Prove LAVA 2024 census source capability
        run: python research/pos_unbonding_completion_001_v0_8_final_kyve/v081_lava_census_capability.py
      - name: Commit source-only capability receipt
        if: always()
        run: |
          if [ ! -f research/pos_unbonding_completion_001_v0_8_final_kyve/V081_LAVA_CENSUS_CAPABILITY.json ]; then
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/pos_unbonding_completion_001_v0_8_final_kyve/V081_LAVA_CENSUS_CAPABILITY.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record V0.8.1 LAVA census capability receipt [skip ci]"
          git pull --rebase origin pos-unbonding-completion-001-v0.8-final-kyve-universe-2026-10-07
          git push origin HEAD:pos-unbonding-completion-001-v0.8-final-kyve-universe-2026-10-07
