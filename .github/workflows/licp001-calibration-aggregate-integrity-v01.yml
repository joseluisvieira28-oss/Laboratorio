name: licp001-calibration-aggregate-integrity-v01
on:
  push:
    branches: [liquidation-cascade-propagation-v0.1]
    paths:
      - 'research/liquidation_cascade/licp001_aggregate_calibration_v01.py'
      - 'research/liquidation_cascade/test_licp001_aggregate_calibration_v01.py'
      - '.github/workflows/licp001-calibration-aggregate-integrity-v01.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install pytest
      - run: pytest -q research/liquidation_cascade/test_licp001_aggregate_calibration_v01.py
