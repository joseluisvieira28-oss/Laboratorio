name: DLS Signed Flow Save0c Same-Tx Program Census V0.1

on:
  push:
    branches:
      - dls-signed-flow-authority-v01
    paths:
      - labs/DEFI_LIQUIDATION_SHOCK_001/LAUNCH_SIGNED_FLOW_SAVE0C_SAME_TX_CENSUS_V01.marker

permissions:
  actions: read
  contents: read

jobs:
  census:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download frozen Save0c population partition
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 36263998920
          name: dls-field-enrichment-ms-save0c-202205
          path: event_source
      - name: Compile
        run: python -m py_compile labs/DEFI_LIQUIDATION_SHOCK_001/source/census_signed_flow_save0c_same_tx_programs_v0_1.py
      - name: Execute same-transaction instruction census
        run: python labs/DEFI_LIQUIDATION_SHOCK_001/source/census_signed_flow_save0c_same_tx_programs_v0_1.py
      - name: Upload immutable census
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dls-signed-flow-save0c-same-tx-census-v01
          path: labs/DEFI_LIQUIDATION_SHOCK_001/SIGNED_FLOW_SAVE0C_SAME_TX_PROGRAM_CENSUS_RECEIPT_V0.1.json
          if-no-files-found: warn
          retention-days: 90
      - name: Firewall
        if: always()
        run: echo SOURCE_ONLY_PROGRAM_CENSUS_NO_PRICES_2025_2026_CLOSED
