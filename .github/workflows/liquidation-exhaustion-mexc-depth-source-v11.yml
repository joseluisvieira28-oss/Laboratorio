# Distinct new source-only alternative, no changes to economic protocol.
name: Liquidation Exhaustion V1.1 — MEXC depth source comparison
on:
  push:
    branches:
      - research/liquidation-exhaustion-economic-forward-v1-2026-11-04
    paths:
      - .github/workflows/liquidation-exhaustion-mexc-depth-source-v11.yml
permissions:
  contents: read
jobs:
  depth-only:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned public WebSocket
        run: python -m pip install --disable-pip-version-check websockets==15.0.1
      - name: Synthetic source safety gates
        run: python research/liquidation_exhaustion_economic_forward_v1/mexc_depth_source_v11.py --self-test
      - name: Distinct 120s public MEXC full depth vs ticker source proof
        run: python research/liquidation_exhaustion_economic_forward_v1/mexc_depth_source_v11.py
      - name: Always preserve raw and verdict
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: liquidation-exhaustion-mexc-depth-v11-source-only
          path: artifacts/liquidation_exhaustion_depth_v11/
          if-no-files-found: warn
          retention-days: 30
