name: MEXC US Equity Transfer Pack V0.3

on:
  push:
    branches:
      - mexc-us-equity-transfer-pack-v0.3-prereg-2026-10-04

permissions:
  contents: read

jobs:
  transfer-pack:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependency
        run: python -m pip install --disable-pip-version-check requests
      - name: Freeze check
        run: |
          test "$GITHUB_REF_NAME" = "mexc-us-equity-transfer-pack-v0.3-prereg-2026-10-04"
          test -f research/mexc_global_assets/MEXC_US_EQUITY_TRANSFER_PACK_FREEZE_V0.3.md
          test -f research/mexc_global_assets/MEXC_US_EQUITY_TRANSFER_PACK_RULE_V0.3.json
          test -f research/mexc_global_assets/MEXC_US_EQUITY_TRANSFER_PACK_BINDING_V0.3.json
          python -m py_compile research/mexc_global_assets/mexc_us_equity_transfer_pack_v03.py
          echo US_EQUITY_TRANSFER_PACK_PRE_OUTCOME_FREEZE_PASS
      - name: Run all frozen transfers
        run: python research/mexc_global_assets/mexc_us_equity_transfer_pack_v03.py
      - name: Upload immutable evidence
        uses: actions/upload-artifact@v4
        with:
          name: mexc-us-equity-transfer-pack-v03-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/mexc_global_assets/us_equity_transfer_pack_v03
          if-no-files-found: error
          retention-days: 90