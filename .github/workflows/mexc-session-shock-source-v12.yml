name: MEXC Session Shock Source V1.2
on:
  push:
    branches: [mexc-session-shock-cluster-v1.2-source-gate-2026-10-05]
permissions: {contents: read}
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install requests
      - run: |
          test -f research/mexc_global_assets/MEXC_SESSION_SHOCK_SOURCE_FREEZE_V1.2.md
          python research/mexc_global_assets/mexc_session_shock_source_v12.py
      - uses: actions/upload-artifact@v4
        with:
          name: session-shock-source-v12-${{ github.run_id }}
          path: artifacts/mexc_global_assets/session_shock_v12_source
