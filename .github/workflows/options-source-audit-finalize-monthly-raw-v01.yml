name: OPTIONS-SPOTPERP-001 Finalize Monthly Raw V0.1

on:
  workflow_dispatch:
    inputs:
      monthly_raw_run_id:
        description: 'Completed monthly-equivalent source-audit run ID'
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  final-source-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout latest isolated Options branch
        uses: actions/checkout@v4

      - name: Outcome-blind latest-code preflight
        working-directory: Dream-Account-OS-v2.3-PARTIAL/research/options_spotperp_v0_1
        run: |
          echo "FINALIZER_HEAD_SHA=$(git rev-parse HEAD)"
          test "${GITHUB_REF_NAME}" = "options-spotperp-v0.1"
          python3 preflight_source_audit.py
          python3 -m py_compile \
            source_audit_gate.py \
            source_audit_gate_authority_reconciled_v01.py \
            source_gate_calendar_day_reconciler_v01.py \
            source_gate_required_field_guard_v01.py \
            test_source_gate_calendar_day_reconciler_v01.py \
            test_source_gate_required_field_guard_v01.py
          python3 test_source_gate_calendar_day_reconciler_v01.py
          python3 test_source_gate_required_field_guard_v01.py
          echo 'NO SKEW / NO RETURNS / NO PNL'

      - name: Verify monthly raw source run identity
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RAW_RUN_ID: ${{ inputs.monthly_raw_run_id }}
        run: |
          test -n "$RAW_RUN_ID"
          test "$(gh api repos/joseluisvieira28-oss/Laboratorio/actions/runs/$RAW_RUN_ID --jq .head_branch)" = "options-spotperp-v0.1"
          test "$(gh api repos/joseluisvieira28-oss/Laboratorio/actions/runs/$RAW_RUN_ID --jq .path)" = ".github/workflows/options-source-audit-monthly-count10000-v01.yml"
          test "$(gh api repos/joseluisvieira28-oss/Laboratorio/actions/runs/$RAW_RUN_ID --jq .status)" = "completed"
          echo "MONTHLY_RAW_RUN_ID=$RAW_RUN_ID"
          echo "MONTHLY_RAW_RUN_CONCLUSION=$(gh api repos/joseluisvieira28-oss/Laboratorio/actions/runs/$RAW_RUN_ID --jq .conclusion)"

      - name: Download monthly acquisition receipts
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: joseluisvieira28-oss/Laboratorio
          run-id: ${{ inputs.monthly_raw_run_id }}
          name: options-spotperp-001-monthly-final-receipts-${{ inputs.monthly_raw_run_id }}-1
          path: Dream-Account-OS-v2.3-PARTIAL/research/options_spotperp_v0_1/source_audit_data

      - name: Download monthly immutable raw provenance
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: joseluisvieira28-oss/Laboratorio
          run-id: ${{ inputs.monthly_raw_run_id }}
          name: options-spotperp-001-monthly-raw-${{ inputs.monthly_raw_run_id }}-1
          path: Dream-Account-OS-v2.3-PARTIAL/research/options_spotperp_v0_1/source_audit_data

      - name: Verify raw acquisition completeness and protection flags
        working-directory: Dream-Account-OS-v2.3-PARTIAL/research/options_spotperp_v0_1
        run: |
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          root=Path('source_audit_data')
          m=json.loads((root/'source_manifest.json').read_text())
          r=json.loads((root/'source_audit_report.json').read_text())
          assert m['probe_mode'] is False
          assert m['source_fetch_complete'] is True
          assert m['holdout_accessed'] is False
          assert m['locked_2026_accessed'] is False
          assert r['outcome_metrics_computed'] is False
          assert r['audit']['skew_values_computed'] is False
          assert r['audit']['forward_returns_computed'] is False
          assert r['audit']['pnl_computed'] is False
          assert (root/'raw').is_dir()
          print('RAW_ACQUISITION_COMPLETE')
          print('RAW_PAGES=',len(m['raw_pages']))
          print('TOTAL_TRADES=',r['audit']['total_trades'])
          print('SOURCE_MANIFEST_SHA256=',hashlib.sha256((root/'source_manifest.json').read_bytes()).hexdigest())
          print('2025=false / 2026=false')
          PY

      - name: Required-field presence guard on immutable raw
        id: fields
        working-directory: Dream-Account-OS-v2.3-PARTIAL/research/options_spotperp_v0_1
        shell: bash
        run: |
          set +e
          python3 source_gate_required_field_guard_v01.py --input source_audit_data
          rc=$?
          set -e
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          echo "REQUIRED_FIELD_GUARD_EXIT_CODE=$rc"
          test "$rc" -eq 0 -o "$rc" -eq 2

      - name: Execute latest canonical calendar-day Source/Data Gate
        id: canonical
        if: steps.fields.outputs.rc == '0'
        working-directory: Dream-Account-OS-v2.3-PARTIAL/research/options_spotperp_v0_1
        shell: bash
        run: |
          rm -f source_audit_data/source_gate_calendar_day_reconciled_receipt.json
          rm -f source_audit_data/source_gate_calendar_day_daily_coverage.json
          set +e
          python3 source_gate_calendar_day_reconciler_v01.py --input source_audit_data
          rc=$?
          set -e
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          echo "CANONICAL_EXIT_CODE=$rc"
          test "$rc" -eq 0 -o "$rc" -eq 2 -o "$rc" -eq 12

      - name: Create final fail-closed receipt if field presence blocks
        if: steps.fields.outputs.rc == '2'
        working-directory: Dream-Account-OS-v2.3-PARTIAL/research/options_spotperp_v0_1
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path('source_audit_data')
          g=json.loads((root/'source_gate_required_field_guard_receipt.json').read_text())
          x={
            'lab_id':'OPTIONS-SPOTPERP-001','version':'V0.1',
            'stage':'FINAL_SOURCE_DATA_GATE_LATEST_CODE',
            'status':'SOURCE_AUDIT_BLOCKED',
            'authority_sha256':'138cee737d75d27b43d9f377fc9a77e823e8fb2015f360b300cdc4a16cf67cfa',
            'detail':'required field presence guard failed',
            'required_field_guard':g,
            'skew_values_computed':False,'signals_computed':False,
            'forward_returns_computed':False,'pnl_computed':False,
            'holdout_2025_accessed':False,'year_2026_accessed':False
          }
          (root/'source_gate_final_latest_code_receipt.json').write_text(json.dumps(x,indent=2,sort_keys=True))
          PY

      - name: Validate latest-code final verdict
        if: steps.fields.outputs.rc == '0' && steps.canonical.outputs.rc != ''
        working-directory: Dream-Account-OS-v2.3-PARTIAL/research/options_spotperp_v0_1
        env:
          CANONICAL_RC: ${{ steps.canonical.outputs.rc }}
        run: |
          python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          root=Path('source_audit_data')
          rc=int(os.environ['CANONICAL_RC'])
          x=json.loads((root/'source_gate_calendar_day_reconciled_receipt.json').read_text())
          expected={0:'SOURCE_AUDIT_PASS',2:'SOURCE_AUDIT_BLOCKED',12:'EXECUTION_ENVIRONMENT_BLOCKED'}[rc]
          assert x['status']==expected,(x['status'],expected)
          assert x['authority']['authority_sha256']=='138cee737d75d27b43d9f377fc9a77e823e8fb2015f360b300cdc4a16cf67cfa'
          assert x['skew_values_computed'] is False and x['signals_computed'] is False
          assert x['forward_returns_computed'] is False and x['pnl_computed'] is False
          assert x['holdout_2025_accessed'] is False and x['year_2026_accessed'] is False
          c=x.get('calendar_day_coverage_audit') or {}
          if c:
              assert c['dte_definition']=='calendar_date_difference_days'
              assert c['daily_coverage_rows']==1371
              assert c['daily_coverage_contains_outcomes'] is False
              p=root/c['daily_coverage_artifact']
              assert hashlib.sha256(p.read_bytes()).hexdigest()==c['daily_coverage_sha256']
          print('LATEST_CODE_FINAL_STATUS=',x['status'])
          print('VALID_DAYS_TOTAL=',c.get('valid_signal_coverage_days'))
          print('VALID_DAYS_BY_YEAR=',c.get('valid_signal_coverage_days_by_year'))
          print('COVERAGE_RATIO_BY_YEAR=',c.get('coverage_ratio_by_year'))
          print('FIELD_GUARD_PASS=true')
          print('2025 UNOPENED / 2026 LOCKED / NO OUTCOMES')
          PY

      - name: Upload final latest-code source gate package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: options-spotperp-001-final-latest-source-gate-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            Dream-Account-OS-v2.3-PARTIAL/research/options_spotperp_v0_1/source_audit_data/source_manifest.json
            Dream-Account-OS-v2.3-PARTIAL/research/options_spotperp_v0_1/source_audit_data/source_audit_report.json
            Dream-Account-OS-v2.3-PARTIAL/research/options_spotperp_v0_1/source_audit_data/source_gate_required_field_guard_receipt.json
            Dream-Account-OS-v2.3-PARTIAL/research/options_spotperp_v0_1/source_audit_data/source_gate_calendar_day_reconciled_receipt.json
            Dream-Account-OS-v2.3-PARTIAL/research/options_spotperp_v0_1/source_audit_data/source_gate_calendar_day_daily_coverage.json
            Dream-Account-OS-v2.3-PARTIAL/research/options_spotperp_v0_1/source_audit_data/source_gate_final_latest_code_receipt.json
          if-no-files-found: warn
          retention-days: 90

      - name: Governance receipt
        if: always()
        run: |
          echo 'FINAL SOURCE/DATA GATE ONLY — LATEST CODE ON IMMUTABLE MONTHLY RAW'
          echo 'NO SKEW / NO SIGNALS / NO RETURNS / NO PNL'
          echo 'NO DISCOVERY EXECUTION'
          echo '2025 LOCKED / 2026 LOCKED'
          echo 'NO LIVE TRADING / NO EXCHANGE MUTATION'

      - name: Enforce final classified state
        if: always()
        env:
          FIELD_RC: ${{ steps.fields.outputs.rc }}
          CANONICAL_RC: ${{ steps.canonical.outputs.rc }}
        run: |
          if [ "$FIELD_RC" = "2" ]; then echo 'SOURCE_AUDIT_BLOCKED_REQUIRED_FIELD_PRESENCE'; exit 2; fi
          case "$CANONICAL_RC" in
            0) echo 'SOURCE_AUDIT_PASS'; exit 0 ;;
            2) echo 'SOURCE_AUDIT_BLOCKED'; exit 2 ;;
            12) echo 'EXECUTION_ENVIRONMENT_BLOCKED'; exit 12 ;;
            *) echo "UNEXPECTED_FINAL_STATE FIELD=$FIELD_RC CANONICAL=$CANONICAL_RC"; exit 99 ;;
          esac