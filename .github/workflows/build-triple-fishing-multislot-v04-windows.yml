name: BUILD TRIPLE FISHING MULTI-SLOT V0.4 WINDOWS PRELIVE

on:
  push:
    branches:
      - triple-fishing-multislot-v04-2026-10-02
    paths:
      - 'crypto_edge_radar/radar/multi_slot_reservation_v04.py'
      - 'crypto_edge_radar/radar/global_fishing_dispatcher_v04.py'
      - 'crypto_edge_radar/radar/multislot_shadow_capacity_v04.py'
      - 'crypto_edge_radar/radar/multislot_shadow_lifecycle_v04.py'
      - 'crypto_edge_radar/radar/mexc_operator_futures_transport_v04.py'
      - 'crypto_edge_radar/radar/operator_futures_engine_v04.py'
      - 'crypto_edge_radar/scripts/mexc_triple_fishing_operator_v04.py'
      - 'crypto_edge_radar/scripts/mexc_triple_fishing_multislot_ready_v04.py'
      - 'crypto_edge_radar/tests/test_multislot_v04.py'
      - 'crypto_edge_radar/tests/test_mexc_operator_futures_transport_v04.py'
      - 'crypto_edge_radar/tests/test_operator_futures_engine_v04.py'
      - 'crypto_edge_radar/tests/test_mexc_triple_fishing_operator_v04.py'
      - 'crypto_edge_radar/tests/test_mexc_triple_fishing_multislot_ready_v04.py'
      - 'crypto_edge_radar/execution/TRIPLE_FISHING_MULTI_SLOT_SMALL_AGGRESSIVE_V04.json'
      - 'crypto_edge_radar/execution/GLOBAL_FISHING_MANIFEST_V04_DRAFT.json'
      - 'crypto_edge_radar/execution/OPERATOR_FUTURES_GLOBAL_AUTHORITY_V04_DRAFT.json'
      - 'crypto_edge_radar/execution/TRIPLE_FISHING_V04_PUBLIC_MEXC_FEASIBILITY_2026-10-02.json'
      - 'crypto_edge_radar/governance/TRIPLE_FISHING_MULTI_SLOT_V04_PRELIVE_FREEZE.md'
      - 'crypto_edge_radar/windows/*Triple_Fishing_V04.ps1'
      - 'crypto_edge_radar/windows/README_MEXC_TRIPLE_FISHING_V04.md'
      - '.github/workflows/build-triple-fishing-multislot-v04-windows.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-build-package:
    runs-on: windows-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: crypto_edge_radar

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install package and PyInstaller
        run: |
          python -m pip install -e .
          python -m pip install "pyinstaller>=6,<7"

      - name: Compile V0.4 production and readiness modules
        run: |
          python -m py_compile radar/multi_slot_reservation_v04.py radar/global_fishing_dispatcher_v04.py radar/multislot_shadow_capacity_v04.py radar/multislot_shadow_lifecycle_v04.py radar/mexc_operator_futures_transport_v04.py radar/operator_futures_engine_v04.py scripts/mexc_triple_fishing_operator_v04.py scripts/mexc_triple_fishing_multislot_ready_v04.py

      - name: Run V0.4 production-path and fault-injection regressions
        env:
          PYTHONPATH: .
        run: >
          python -m unittest
          tests.test_multislot_v04
          tests.test_mexc_operator_futures_transport_v04
          tests.test_operator_futures_engine_v04
          tests.test_mexc_triple_fishing_operator_v04
          tests.test_mexc_triple_fishing_multislot_ready_v04
          -v

      - name: Build V0.4 executor EXE
        run: |
          pyinstaller --clean --onefile --name MEXCTripleFishingOperatorV04 --paths . scripts/mexc_triple_fishing_operator_v04.py

      - name: Build V0.4 read-only readiness EXE
        run: |
          pyinstaller --clean --onefile --name MEXCTripleFishingMultiSlotReadyV04 --paths . scripts/mexc_triple_fishing_multislot_ready_v04.py

      - name: Smoke executable entrypoints without credentials
        shell: pwsh
        run: |
          & .\dist\MEXCTripleFishingOperatorV04.exe --help | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "MEXCTripleFishingOperatorV04 --help failed" }
          & .\dist\MEXCTripleFishingMultiSlotReadyV04.exe --help | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "MEXCTripleFishingMultiSlotReadyV04 --help failed" }

      - name: Parse all V0.4 PowerShell scripts without executing them
        shell: pwsh
        run: |
          $scripts = @(
            "windows\Ready_Check_MEXC_Triple_Fishing_V04.ps1",
            "windows\Run_MEXC_Triple_Fishing_V04.ps1",
            "windows\Status_MEXC_Triple_Fishing_V04.ps1",
            "windows\Arm_After_Approved_Handover_MEXC_Triple_Fishing_V04.ps1"
          )
          foreach ($script in $scripts) {
            $tokens=$null
            $errors=$null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $script),[ref]$tokens,[ref]$errors) | Out-Null
            if ($errors.Count -gt 0) { throw ("PowerShell parse failure in " + $script + ": " + ($errors | Out-String)) }
          }

      - name: Stage pre-live Windows bundle
        shell: pwsh
        run: |
          $bundle = "dist\triple_fishing_multislot_v04_prelive"
          New-Item -ItemType Directory -Force -Path $bundle | Out-Null

          Copy-Item "dist\MEXCTripleFishingOperatorV04.exe" $bundle
          Copy-Item "dist\MEXCTripleFishingMultiSlotReadyV04.exe" $bundle
          Copy-Item "windows\Ready_Check_MEXC_Triple_Fishing_V04.ps1" $bundle
          Copy-Item "windows\Run_MEXC_Triple_Fishing_V04.ps1" $bundle
          Copy-Item "windows\Status_MEXC_Triple_Fishing_V04.ps1" $bundle
          Copy-Item "windows\Arm_After_Approved_Handover_MEXC_Triple_Fishing_V04.ps1" $bundle
          Copy-Item "windows\README_MEXC_TRIPLE_FISHING_V04.md" $bundle

          Copy-Item "execution\TRIPLE_FISHING_MULTI_SLOT_SMALL_AGGRESSIVE_V04.json" $bundle
          Copy-Item "execution\GLOBAL_FISHING_MANIFEST_V04_DRAFT.json" $bundle
          Copy-Item "execution\OPERATOR_FUTURES_GLOBAL_AUTHORITY_V04_DRAFT.json" $bundle
          Copy-Item "execution\TRIPLE_FISHING_V04_PUBLIC_MEXC_FEASIBILITY_2026-10-02.json" $bundle
          Copy-Item "governance\TRIPLE_FISHING_MULTI_SLOT_V04_PRELIVE_FREEZE.md" $bundle

          $info = [ordered]@{
            build = "TRIPLE_FISHING_MULTI_SLOT_V0.4_PRELIVE"
            branch = "${{ github.ref_name }}"
            source_sha = "${{ github.sha }}"
            built_at_utc = (Get-Date).ToUniversalTime().ToString("o")
            max_simultaneous_positions_target = 3
            executor_included = $true
            readiness_included = $true
            active_authority_included = $false
            armed_marker_included = $false
            live_armed_by_build = $false
            exchange_contacted_by_build = $false
            order_created_by_build = $false
            main_merged = $false
          }
          $info | ConvertTo-Json -Depth 4 | Set-Content -Path (Join-Path $bundle "BUILD_INFO.json") -Encoding UTF8

          $hashFile = Join-Path $bundle "SHA256SUMS.txt"
          Get-ChildItem $bundle -File |
            Where-Object { $_.Name -ne "SHA256SUMS.txt" } |
            Sort-Object Name |
            ForEach-Object {
              $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
              "$($_.Name)  $hash" | Out-File -FilePath $hashFile -Encoding ascii -Append
            }

          Get-ChildItem $bundle | Select-Object Name,Length
          Get-Content $hashFile

      - uses: actions/upload-artifact@v4
        with:
          name: mexc-triple-fishing-multislot-v04-windows-prelive
          path: crypto_edge_radar/dist/triple_fishing_multislot_v04_prelive/*
          if-no-files-found: error
          retention-days: 14
