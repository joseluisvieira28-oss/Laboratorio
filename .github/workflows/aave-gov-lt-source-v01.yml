name: Aave Gov LT V0.1 Source Only
on:
  push:
    branches: [aave-gov-lt-forced-deleveraging-v0.1]
    paths:
      - research/aave_gov_lt_forced_deleveraging/source_probe_v01.py
      - .github/workflows/aave-gov-lt-source-v01.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pycryptodome==3.23.0
      - run: python research/aave_gov_lt_forced_deleveraging/source_probe_v01.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aave-gov-lt-v01-source-evidence
          path: out/aave_gov_lt_forced_deleveraging/
          if-no-files-found: error
          retention-days: 30
