name: DLS Marginfi SOL August Source Hash-Shards V0.1

on:
  push:
    branches:
      - dls-marginfi-flow-turnover-rebound-v01
    paths:
      - labs/DEFI_LIQUIDATION_SHOCK_001/LAUNCH_MARGINFI_SOL_AUGUST_HASH_SHARDS_V01.marker

permissions:
  actions: read
  contents: read

jobs:
  shard:
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        include:
          - {idx: 0}
          - {idx: 1}
          - {idx: 2}
          - {idx: 3}
          - {idx: 4}
          - {idx: 5}
          - {idx: 6}
          - {idx: 7}
          - {idx: 8}
          - {idx: 9}
          - {idx: 10}
          - {idx: 11}
          - {idx: 12}
          - {idx: 13}
          - {idx: 14}
          - {idx: 15}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download canonical August field-enrichment
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 36263998920
          artifact-ids: 10925020784
          path: field_month

      - name: Download source-authoritative Marginfi bank registry
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 36312418451
          artifact-ids: 10929339072
          path: bank_registry

      - name: Compile frozen hash-shard collector
        run: python -m py_compile labs/DEFI_LIQUIDATION_SHOCK_001/source/census_marginfi_sol_august_hash_shard_v0_1.py

      - name: Execute source-only hash shard
        run: >
          python labs/DEFI_LIQUIDATION_SHOCK_001/source/census_marginfi_sol_august_hash_shard_v0_1.py
          --field-root field_month
          --bank-registry-root bank_registry
          --shard-index ${{ matrix.idx }}
          --shard-count 16
          --workers 2

      - name: Upload immutable shard evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dls-marginfi-sol-august-source-shard-${{ matrix.idx }}-v01
          path: |
            labs/DEFI_LIQUIDATION_SHOCK_001/MARGINFI_SOL_AUGUST_SOURCE_SHARD_*_RECEIPT_V0.1.json
            labs/DEFI_LIQUIDATION_SHOCK_001/MARGINFI_SOL_AUGUST_SOURCE_SHARD_*_ROWS_V0.1.ndjson
            labs/DEFI_LIQUIDATION_SHOCK_001/MARGINFI_SOL_AUGUST_SOURCE_SHARD_*_POPULATION_V0.1.ndjson
          if-no-files-found: warn
          retention-days: 90

  merge:
    if: always()
    needs: shard
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download shard evidence
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ github.run_id }}
          pattern: dls-marginfi-sol-august-source-shard-*-v01
          path: shards
          merge-multiple: false

      - name: Download canonical August field-enrichment
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 36263998920
          artifact-ids: 10925020784
          path: field_month

      - name: Download source-authoritative Marginfi bank registry
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 36312418451
          artifact-ids: 10929339072
          path: bank_registry

      - name: Compile exact-union merge
        run: python -m py_compile labs/DEFI_LIQUIDATION_SHOCK_001/source/merge_marginfi_sol_august_hash_shards_v0_1.py

      - name: Merge and verify exact canonical August union
        run: >
          python labs/DEFI_LIQUIDATION_SHOCK_001/source/merge_marginfi_sol_august_hash_shards_v0_1.py
          --root shards
          --field-root field_month
          --bank-registry-root bank_registry

      - name: Upload reconstructed August monthly evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dls-marginfi-sol-julsep-source-202408-hash-v01
          path: |
            labs/DEFI_LIQUIDATION_SHOCK_001/MARGINFI_SOL_JULSEP_SOURCE_202408_RECEIPT_V0.1.json
            labs/DEFI_LIQUIDATION_SHOCK_001/MARGINFI_SOL_JULSEP_SOURCE_202408_ROWS_V0.1.ndjson
            labs/DEFI_LIQUIDATION_SHOCK_001/MARGINFI_SOL_JULSEP_POPULATION_202408_V0.1.ndjson
          if-no-files-found: warn
          retention-days: 90

      - name: Firewall
        if: always()
        run: echo SOURCE_ONLY_HASH_SHARD_FALLBACK_NO_MARKET_OUTCOMES
