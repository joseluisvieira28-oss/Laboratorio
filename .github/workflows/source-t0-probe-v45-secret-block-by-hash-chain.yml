name: source-t0-probe-v45-secret-block-by-hash-chain
on:
  push:
    branches: [cosmos-native-emission-param-shock-001-v0.2-t0-remediation-2026-10-07]
    paths: [.github/workflows/source-t0-probe-v45-secret-block-by-hash-chain.yml]
permissions: {contents: write}
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {ref: cosmos-native-emission-param-shock-001-v0.2-t0-remediation-2026-10-07}
      - name: Recover prior Secret blocks by canonical hash chain
        run: |
          python3 - <<'PY'
          import json,urllib.request,urllib.error,urllib.parse,ssl,hashlib,os,datetime
          O="research/cosmos_native_emission_param_shock_001_v0_2/SCRT287_BLOCK_BY_HASH_CHAIN_V45.json"
          TX="68DBC6675C35AE8305DF9C9C6F345F6B1F03BDDB3C0254CB15E476E013F4DA17"
          ORPC="https://rpc.archive.osmosis.zone"
          UA={"User-Agent":"CryptoLab-source-only-v45","Accept":"application/json"}
          def get(u,to=12):
            try:
              q=urllib.request.Request(u,headers=UA)
              with urllib.request.urlopen(q,timeout=to,context=ssl._create_unverified_context()) as r:
                b=r.read();return {"ok":True,"status":r.status,"url":r.geturl(),"sha256":hashlib.sha256(b).hexdigest(),"body":b.decode("utf-8","replace")}
            except urllib.error.HTTPError as e:
              try:b=e.read()
              except:b=b""
              return {"ok":False,"status":e.code,"url":u,"error":str(e),"body":b.decode("utf-8","replace")}
            except Exception as e:return {"ok":False,"status":None,"url":u,"error":repr(e),"body":""}
          def vi(b,i):
            x=s=0
            while 1:
              c=b[i];i+=1;x|=(c&127)<<s
              if not c&128:return x,i
              s+=7
          def fs(b):
            i=0;o=[]
            while i<len(b):
              try:k,i=vi(b,i)
              except:break
              n,w=k>>3,k&7
              if w==0:v,i=vi(b,i);o.append((n,w,v))
              elif w==1:o.append((n,w,b[i:i+8]));i+=8
              elif w==2:
                l,i=vi(b,i);o.append((n,w,b[i:i+l]));i+=l
              elif w==5:o.append((n,w,b[i:i+4]));i+=4
              else:break
            return o
          def f(a,n,w=None):
            for x,y,z in a:
              if x==n and (w is None or y==w):return z
          def decode_any(hx):
            a=fs(bytes.fromhex(hx));v=f(a,2,2);h=fs(v);sh=f(h,1,2);s=fs(sh);hd=f(s,1,2);t=fs(hd)
            bid=f(t,5,2); bf=fs(bid) if bid else []; prev=f(bf,1,2)
            tm=f(t,4,2);tf=fs(tm);sec=f(tf,1,0);nano=f(tf,2,0) or 0
            dt=datetime.datetime.fromtimestamp(sec,tz=datetime.timezone.utc)
            return {"chain_id":f(t,2,2).decode(),"height":int(f(t,3,0)),
              "time":dt.strftime("%Y-%m-%dT%H:%M:%S")+("."+(f"{nano:09d}").rstrip("0") if nano else "")+"Z",
              "last_block_id_hash":prev.hex().upper() if prev else None}
          tr=get(f"{ORPC}/tx?hash=0x{TX}&prove=false",20)
          if not tr["ok"]: raise SystemExit("CARRIER_TX_UNAVAILABLE")
          d=json.loads(tr["body"]);attrs=[]
          for ev in ((d.get("result") or {}).get("tx_result") or {}).get("events") or []:
            if ev.get("type")=="update_client":
              aa={x.get("key"):x.get("value") for x in ev.get("attributes") or []}
              if aa.get("client_id")=="07-tendermint-1588":attrs.append(aa)
          if not attrs:raise SystemExit("SECRET_HEADER_EVENT_MISSING")
          h922=decode_any(attrs[0]["header"]);prev=h922["last_block_id_hash"]
          eps=[
            "https://rpc.archive.scrt.marionode.com","https://scrt.public-rpc.com",
            "https://secretnetwork-rpc.lavenderfive.com:443","https://1rpc.io/scrt-rpc",
            "https://rpc-secret.01node.com","https://secretnetwork-rpc.highstakes.ch:26657",
            "https://public.stakewolle.com/cosmos/secretnetwork/rpc",
            "https://rpc.cosmos.directory/secretnetwork","https://secret-4.api.trivium.network:26657",
            "https://scrt-rpc.blockpane.com","https://rpc.secret.forbole.com",
            "https://secret.rpc.consensus.one","https://rpc.spartanapi.dev",
            "https://secretnetwork-rpc.stakely.io","https://scrt-rpc.agoranodes.com"]
          def parse_block(body):
            try:
              z=json.loads(body)["result"];hd=z["block"]["header"];bid=z.get("block_id") or {}
              return {"height":int(hd["height"]),"time":hd["time"],"hash":bid.get("hash"),
                "last_block_id_hash":(hd.get("last_block_id") or {}).get("hash")}
            except:return None
          probes=[];recovered=[]
          current=prev
          for want in [11880921,11880920,11880919,11880918]:
            found=None
            for base in eps:
              for hx in [current,"0x"+current]:
                r=get(base+"/block_by_hash?hash="+urllib.parse.quote(hx),10)
                b=parse_block(r["body"]) if r["ok"] else None
                probes.append({"wanted_height":want,"base":base,"query_hash":hx,"ok":r["ok"],"status":r.get("status"),"error":r.get("error"),"parsed":b})
                if b and b["height"]==want:
                  found={**b,"source":base,"response_sha256":r["sha256"]};break
              if found:break
            if not found:break
            recovered.append(found);current=found["last_block_id_hash"]
          out={"scope":"SOURCE_ONLY_NO_MARKET_DATA","target":"2023-12-07T02:54:58.930543213Z",
            "carrier_tx":TX,"carrier_tx_sha256":tr["sha256"],"decoded_h922":h922,
            "block_921_hash_from_h922":prev,"recovered_backchain":recovered,"probes":probes,
            "tested_utc":datetime.datetime.now(datetime.timezone.utc).isoformat()}
          os.makedirs(os.path.dirname(O),exist_ok=True);open(O,"w").write(json.dumps(out,indent=2))
          print("V45",json.dumps({"h922":h922,"recovered":recovered}))
          PY
      - name: Persist
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/cosmos_native_emission_param_shock_001_v0_2/SCRT287_BLOCK_BY_HASH_CHAIN_V45.json
          git commit -m "SCRT287: persist block-by-hash backchain probe v45"
          git pull --rebase origin cosmos-native-emission-param-shock-001-v0.2-t0-remediation-2026-10-07
          git push origin HEAD:cosmos-native-emission-param-shock-001-v0.2-t0-remediation-2026-10-07
