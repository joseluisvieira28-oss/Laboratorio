name: DLS Marginfi Orca Flow-Response Discovery V0.1

on:
  push:
    branches:
      - dls-marginfi-orca-dose-response-v01
    paths:
      - labs/DEFI_LIQUIDATION_SHOCK_001/LAUNCH_MARGINFI_ORCA_FLOW_RESPONSE_V01.marker

permissions:
  actions: read
  contents: read

jobs:
  discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download exact pre-outcome feature artifact
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 36781289721
          artifact-ids: 11127324942
          path: feature_gate

      - name: Compile frozen discovery executor
        run: python -m py_compile labs/DEFI_LIQUIDATION_SHOCK_001/source/run_marginfi_orca_flow_response_v0_1.py

      - name: Execute frozen Jul-Sep flow-response discovery
        run: >
          python labs/DEFI_LIQUIDATION_SHOCK_001/source/run_marginfi_orca_flow_response_v0_1.py
          --feature-root feature_gate
          --workers 12

      - name: Upload immutable discovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dls-marginfi-orca-flow-response-v01
          path: |
            labs/DEFI_LIQUIDATION_SHOCK_001/MARGINFI_ORCA_FLOW_RESPONSE_V01_RECEIPT.json
            labs/DEFI_LIQUIDATION_SHOCK_001/MARGINFI_ORCA_FLOW_RESPONSE_V01_LEDGER.ndjson
            labs/DEFI_LIQUIDATION_SHOCK_001/MARGINFI_ORCA_FLOW_RESPONSE_V01_MARKET_DATA_MANIFEST.ndjson
          if-no-files-found: warn
          retention-days: 90

      - name: Firewall
        if: always()
        run: echo JULSEP_DISCOVERY_ONLY_OCTDEC_CLOSED_NO_TRADING
