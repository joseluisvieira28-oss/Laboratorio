name: L2R Overlay ETF-CME Cloud One-Shot V0.1A

on:
  push:
    branches:
      - l2r-overlay-etf-cme-cloud-source-v0.1a
    paths:
      - '.github/workflows/l2r_overlay_etf_cme_cloud_one_shot_v01a.yml'

permissions:
  actions: read
  contents: read

jobs:
  canonical-one-shot:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    env:
      BASE: /tmp/L2R_2025_BTC_VALIDATION_LOCAL
      EXPECTED_MANIFEST_SHA: 767e75594864344c75dd2669ec4fad8c738710c218322b11fd43a83077ef17c3
      EXPECTED_OBJECTS: "8400"
      EXPECTED_BYTES: "8975275014"
      EXPECTED_ETF_SHA: 40bd341c300532e5b67127a098c82ecf2f41e1cc4a3ce646ac824b27529f9bd1
      EXPECTED_RUNNER_SHA: 495129040193b01218d867bd8a29f50039e5229203d118571f38445746942b2a

    steps:
      - uses: actions/checkout@v4
        with:
          ref: l2r-overlay-etf-cme-cloud-source-v0.1a

      - name: Preserve disk for canonical 8.98 GB corpus
        run: |
          set -euo pipefail
          sudo rm -rf /usr/local/lib/android /opt/ghc /usr/share/dotnet /opt/hostedtoolcache/CodeQL || true
          sudo apt-get clean || true
          df -h /

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install frozen source dependencies
        run: python -m pip install --disable-pip-version-check boto3 lz4==4.4.4

      - name: Verify pre-outcome frozen runner identity
        run: |
          set -euo pipefail
          ACTUAL="$(sha256sum research/l2_resiliency_overlay/l2r_overlay_etf_cme_2025_development_v01.py | awk '{print $1}')"
          echo "overlay_runner_sha256=$ACTUAL"
          test "$ACTUAL" = "$EXPECTED_RUNNER_SHA"

      - name: Reacquire canonical 2025 L2 corpus — source only
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.L2R_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.L2R_AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ secrets.L2R_AWS_SESSION_TOKEN }}
          AWS_DEFAULT_REGION: us-east-1
        run: |
          set -euo pipefail
          mkdir -p "$BASE"
          python - <<'PY'
          import importlib.util, os
          from pathlib import Path

          src=Path("research/l2_resiliency/L2R_2025_BTC_VALIDATION_PIPELINE_V01B_FROZEN_SOURCE.py")
          spec=importlib.util.spec_from_file_location("l2r_parent",src)
          m=importlib.util.module_from_spec(spec)
          spec.loader.exec_module(m)

          base=Path(os.environ["BASE"]).resolve()
          m.ensure_dirs(base)
          inv,_=m.stage_inventory(base,8)
          rows,receipt=m.stage_acquisition(base,inv,8)

          manifest=m.evidence_root(base)/"L2_RESILIENCY_001_2025_BTC_RAW_MANIFEST_V0_1.csv"
          actual_sha=m.sha256_file(manifest)
          objects=len(rows)
          total=sum(int(r["content_length"]) for r in rows)

          print("TRANSPORT_MANIFEST_SHA256",actual_sha)
          print("TRANSPORT_OBJECTS",objects)
          print("TRANSPORT_BYTES",total)

          assert actual_sha == os.environ["EXPECTED_MANIFEST_SHA"], (actual_sha,os.environ["EXPECTED_MANIFEST_SHA"])
          assert objects == int(os.environ["EXPECTED_OBJECTS"])
          assert total == int(os.environ["EXPECTED_BYTES"])
          print("CANONICAL_SOURCE_TRANSPORT_PASS")
          PY
          df -h /

      - name: Download exact immutable ETF-CME parent artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail --location --retry 3             -H "Authorization: Bearer $GH_TOKEN"             -H "Accept: application/vnd.github+json"             -H "X-GitHub-Api-Version: 2022-11-28"             "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/10335473231/zip"             -o /tmp/ETF_CME_INSTFLOW_001_OOS_2025.zip
          ACTUAL="$(sha256sum /tmp/ETF_CME_INSTFLOW_001_OOS_2025.zip | awk '{print $1}')"
          echo "parent_etf_artifact_sha256=$ACTUAL"
          test "$ACTUAL" = "$EXPECTED_ETF_SHA"
          unzip -t /tmp/ETF_CME_INSTFLOW_001_OOS_2025.zip

      - name: Final pre-outcome firewall
        run: |
          set -euo pipefail
          MANIFEST="$BASE/_EVIDENCE_2025_VALIDATION_V0_1/L2_RESILIENCY_001_2025_BTC_RAW_MANIFEST_V0_1.csv"
          test "$(sha256sum "$MANIFEST" | awk '{print $1}')" = "$EXPECTED_MANIFEST_SHA"
          test "$(sha256sum /tmp/ETF_CME_INSTFLOW_001_OOS_2025.zip | awk '{print $1}')" = "$EXPECTED_ETF_SHA"
          test "$(sha256sum research/l2_resiliency_overlay/l2r_overlay_etf_cme_2025_development_v01.py | awk '{print $1}')" = "$EXPECTED_RUNNER_SHA"
          echo "2026_CLOSED=true"
          echo "LIVE_TRADING=false"
          echo "ORDERS=false"
          echo "EXCHANGE_MUTATION=false"
          echo "PRE_OUTCOME_FIREWALL_PASS"

      - name: Consume canonical one-shot — frozen 2025 development outcome
        run: |
          set -euo pipefail
          echo "ONE_SHOT_OUTCOME_OPENED=true"
          python research/l2_resiliency_overlay/l2r_overlay_etf_cme_2025_development_v01.py             --base "$BASE"             --etf-artifact /tmp/ETF_CME_INSTFLOW_001_OOS_2025.zip

      - name: Assert terminal classification and firewalls
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          p=Path(os.environ["BASE"])/"_EVIDENCE_L2R_OVERLAY_ETF_CME_V0_1"/"L2R_OVERLAY_ETF_CME_001_2025_DEVELOPMENT_RECEIPT_V0_1.json"
          x=json.loads(p.read_text())
          allowed={
            "DEVELOPMENT_OVERLAY_SIGNAL_SUPPORTED",
            "DEVELOPMENT_OVERLAY_NO_SUPPORT",
            "DEVELOPMENT_OVERLAY_INSUFFICIENT_SAMPLE_OR_SOURCE",
          }
          assert x["classification"] in allowed
          assert x["parent_l2_manifest_sha256"] == os.environ["EXPECTED_MANIFEST_SHA"]
          assert x["parent_etf_artifact_sha256"] == os.environ["EXPECTED_ETF_SHA"]
          fw=x["firewalls"]
          assert fw["access_2026"] is False
          assert fw["orders"] is False
          assert fw["live_trading"] is False
          assert fw["exchange_mutation"] is False
          assert fw["main_merge"] is False
          print("TERMINAL_CLASSIFICATION",x["classification"])
          print("GLOBAL_SOURCE_EVALUABLE_ROWS",x["global_source_evaluable_rows"])
          print("PANEL",json.dumps(x["panel"],sort_keys=True))
          print("RAW_SCAN",json.dumps(x["raw_scan"],sort_keys=True))
          PY

      - name: Upload immutable one-shot evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: L2R_OVERLAY_ETF_CME_001_2025_DEVELOPMENT_EVIDENCE_V0_1A
          path: |
            /tmp/L2R_2025_BTC_VALIDATION_LOCAL/L2R_OVERLAY_ETF_CME_001_2025_DEVELOPMENT_EVIDENCE_V0_1.zip
            /tmp/L2R_2025_BTC_VALIDATION_LOCAL/_EVIDENCE_L2R_OVERLAY_ETF_CME_V0_1/L2R_OVERLAY_ETF_CME_001_2025_DEVELOPMENT_RECEIPT_V0_1.json
            /tmp/L2R_2025_BTC_VALIDATION_LOCAL/_EVIDENCE_L2R_OVERLAY_ETF_CME_V0_1/L2R_OVERLAY_ETF_CME_001_2025_CELL_SUMMARY_V0_1.csv
            /tmp/L2R_2025_BTC_VALIDATION_LOCAL/_EVIDENCE_L2R_OVERLAY_ETF_CME_V0_1/L2R_OVERLAY_ETF_CME_001_2025_DEVELOPMENT_LEDGER_V0_1.csv
          retention-days: 90
          if-no-files-found: error

      - name: Upload source-only failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: L2R_OVERLAY_ETF_CME_001_CLOUD_SOURCE_FAILURE_V0_1A
          path: |
            /tmp/L2R_2025_BTC_VALIDATION_LOCAL/_EVIDENCE_2025_VALIDATION_V0_1/*.json
            /tmp/L2R_2025_BTC_VALIDATION_LOCAL/_EVIDENCE_2025_VALIDATION_V0_1/*.csv
          retention-days: 30
          if-no-files-found: ignore
