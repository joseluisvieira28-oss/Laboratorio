name: DLS Drift Early Upper Anchor V0.3

on:
  push:
    branches:
      - dls-drift-early-upper-anchor-v0.3
    paths:
      - '.github/workflows/dls-drift-early-upper-anchor-v03.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dls-drift-early-upper-anchor-v0.3
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile
        run: python -m py_compile labs/DEFI_LIQUIDATION_SHOCK_001/source/find_drift_early_upper_anchor_v0_3.py
      - name: Execute small-batch accounts-only anchor probe
        run: python labs/DEFI_LIQUIDATION_SHOCK_001/source/find_drift_early_upper_anchor_v0_3.py | tee STDOUT.txt
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dls-drift-early-upper-anchor-v03
          path: |
            labs/DEFI_LIQUIDATION_SHOCK_001/DRIFT_EARLY_UPPER_ANCHOR_RECEIPT_V0.3.json
            STDOUT.txt
          if-no-files-found: warn
          retention-days: 30
      - name: Persist receipt
        if: always()
        run: |
          if [ -f labs/DEFI_LIQUIDATION_SHOCK_001/DRIFT_EARLY_UPPER_ANCHOR_RECEIPT_V0.3.json ]; then
            git config user.name "crypto-lab-source-audit"
            git config user.email "actions@users.noreply.github.com"
            git add labs/DEFI_LIQUIDATION_SHOCK_001/DRIFT_EARLY_UPPER_ANCHOR_RECEIPT_V0.3.json
            git commit -m "dls: persist Drift early upper anchor receipt v0.3" || true
            git push origin HEAD:dls-drift-early-upper-anchor-v0.3
          fi
      - name: Firewall
        if: always()
        run: |
          echo SOURCE_ONLY_TRUE
          echo SMALL_BATCH_CALIBRATION_TRUE
          echo ACCOUNTS_ONLY_BLOCKS_TRUE
          echo LIQUIDATION_CLASSIFICATION_FALSE
          echo PRICES_FALSE
          echo RETURNS_FALSE
          echo PNL_FALSE
          echo DIRECTION_FALSE
          echo LIVE_TRADING_FALSE
          echo MERGE_MAIN_FALSE
