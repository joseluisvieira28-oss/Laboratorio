name: Pressure Mining Source Probe V0.1

on:
  push:
    branches:
      - pressure-mining-program-v0.1
    paths:
      - "pressure_mining_v0_1/**"
      - ".github/workflows/pressure-mining-source-probe-v0.1.yml"
  pull_request:
    branches:
      - main
    paths:
      - "pressure_mining_v0_1/**"
      - ".github/workflows/pressure-mining-source-probe-v0.1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install census dependency
        run: python -m pip install "eth-hash[pycryptodome]"

      - name: Compile source probes
        run: python -m py_compile pressure_mining_v0_1/source_probe.py pressure_mining_v0_1/source_census.py pressure_mining_v0_1/lido_wq_source_snapshot.py

      - name: Run source-only feasibility probe
        run: python pressure_mining_v0_1/source_probe.py

      - name: Run source-only census
        run: python pressure_mining_v0_1/source_census.py

      - name: Collect Lido prospective source-only snapshot
        run: python pressure_mining_v0_1/lido_wq_source_snapshot.py

      - name: Verify expected receipts
        run: |
          test -s pressure_mining_v0_1/receipts/PRESSURE_MINING_SOURCE_PROBE_RECEIPT_V0.1.json
          test -s pressure_mining_v0_1/receipts/PRESSURE_MINING_SOURCE_CENSUS_RECEIPT_V0.2.json
          test -s pressure_mining_v0_1/receipts/LIDO_WQ_SOURCE_SNAPSHOT_V0.1.json

      - name: Upload immutable receipt
        uses: actions/upload-artifact@v4
        with:
          name: pressure-mining-source-probe-v01
          path: |
            pressure_mining_v0_1/receipts/PRESSURE_MINING_SOURCE_PROBE_RECEIPT_V0.1.json
            pressure_mining_v0_1/receipts/PRESSURE_MINING_SOURCE_CENSUS_RECEIPT_V0.2.json
            pressure_mining_v0_1/receipts/LIDO_WQ_SOURCE_SNAPSHOT_V0.1.json
          if-no-files-found: error
