name: PMD-001 V012 Full Source Pilot V07
on:
  push:
    branches: [pumpfun-migration-direction-v0.1]
    paths:
      - 'Dream-Account-OS-v2.3-PARTIAL/research/pumpfun_migration_direction_001/RUN_V012_FULLSOURCE_PILOT_V07.trigger'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pumpfun-migration-direction-v0.1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --upgrade pip duckdb huggingface_hub requests solders pytz
      - name: Syntax checks
        run: |
          python -m py_compile             Dream-Account-OS-v2.3-PARTIAL/research/pumpfun_migration_direction_001/source_rebuild_chain_exact_v07.py             Dream-Account-OS-v2.3-PARTIAL/research/pumpfun_migration_direction_001/extract_chain_exact_features_v012.py
      - name: Rebuild frozen manifest
        working-directory: Dream-Account-OS-v2.3-PARTIAL/research/pumpfun_migration_direction_001
        run: |
          python build_source_rebuild_manifest_v01.py --data-dir "$GITHUB_WORKSPACE/v012_pilot_manifest_data" --out "$GITHUB_WORKSPACE/pmd_source_rebuild_manifest_v01.jsonl" --receipt "$GITHUB_WORKSPACE/v012_pilot_manifest_receipt.json"
          test ! -e "$GITHUB_WORKSPACE/v012_pilot_manifest_data/postgard_outcomes.parquet"
      - name: Full chain-exact source pilot rows 0-3
        working-directory: Dream-Account-OS-v2.3-PARTIAL/research/pumpfun_migration_direction_001
        run: |
          python source_rebuild_chain_exact_v07.py             --manifest "$GITHUB_WORKSPACE/pmd_source_rebuild_manifest_v01.jsonl"             --full-manifest "$GITHUB_WORKSPACE/pmd_source_rebuild_manifest_v01.jsonl"             --out-dir "$GITHUB_WORKSPACE/v012_fullsource_pilot"             --rpc-url https://api.mainnet-beta.solana.com             --source-name solana_public_rpc_chain_exact_full_v07_pilot             --start 0 --limit 4 --block-batch-size 4
      - name: Assert source-only pilot contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('v012_fullsource_pilot/source_rebuild_summary.jsonl')
          rows=[json.loads(x) for x in p.read_text().splitlines() if x.strip()]
          assert len(rows)==4
          assert all(r.get('outcomes_opened') is False for r in rows)
          assert all(r.get('stage')=='CHAIN_EXACT_SOURCE_REBUILD_V07' for r in rows)
          assert all(r.get('boundary_parser_version')=='V07_MIGRATE_AND_MIGRATE_V2' for r in rows)
          print(json.dumps({
            'rows':len(rows),
            'source_complete':sum(bool(r.get('source_complete')) for r in rows),
            'feature_source_eligible':sum(bool(r.get('feature_source_eligible')) for r in rows),
            'outcomes_opened':False
          },indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: PMD-001-v012-fullsource-pilot-v07
          retention-days: 30
          compression-level: 9
          path: |
            v012_fullsource_pilot/source_rebuild_summary.jsonl
            v012_fullsource_pilot/block_hash_ledger.jsonl
            v012_fullsource_pilot/raw/*.jsonl
