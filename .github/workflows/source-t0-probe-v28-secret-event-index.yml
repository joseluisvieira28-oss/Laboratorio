name: source-t0-probe-v28-secret-event-index

on:
  push:
    branches:
      - cosmos-native-emission-param-shock-001-v0.2-t0-remediation-2026-10-07
    paths:
      - .github/workflows/source-t0-probe-v28-secret-event-index.yml

permissions:
  contents: write

jobs:
  event-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cosmos-native-emission-param-shock-001-v0.2-t0-remediation-2026-10-07
      - name: Probe Tendermint block_search and header-range indexes
        run: |
          python - <<'PY'
          import urllib.request, urllib.parse, urllib.error, json, hashlib, datetime, os
          from concurrent.futures import ThreadPoolExecutor, as_completed

          TARGET="2023-12-07T02:54:58.930543213Z"
          UA={"User-Agent":"CryptoLab-source-only-secret-v28/1.0"}
          OUT="research/cosmos_native_emission_param_shock_001_v0_2/SCRT287_EVENT_INDEX_PROBE_V28.json"
          RPCS=[
            "https://secretnetwork-rpc.lavenderfive.com:443",
            "https://rpc.lavenderfive.com:443/secretnetwork",
            "https://scrt.public-rpc.com",
            "https://rpc.mainnet.secretsaturn.net",
            "https://rpc-secret.01node.com",
            "https://1rpc.io/scrt-rpc",
            "https://public.stakewolle.com/cosmos/secretnetwork/rpc",
            "https://secretnetwork-rpc.highstakes.ch:26657",
            "https://rpc.cosmos.directory/secretnetwork",
            "https://rpc.archive.scrt.marionode.com",
            "https://scrt-rpc.blockpane.com",
            "https://rpc.secret.forbole.com",
            "https://secret.rpc.consensus.one",
            "https://secret-4.api.trivium.network:26657",
            "https://rpc.spartanapi.dev",
            "https://secretnetwork-rpc.stakely.io",
            "https://scrt-rpc.agoranodes.com",
          ]

          def get(url,to=12):
              req=urllib.request.Request(url,headers=UA)
              try:
                  with urllib.request.urlopen(req,timeout=to) as r:
                      b=r.read()
                      return {"ok":True,"status":getattr(r,"status",200),"url":url,
                              "sha256":hashlib.sha256(b).hexdigest(),
                              "body":b.decode("utf-8","replace")[:500000]}
              except urllib.error.HTTPError as e:
                  try:b=e.read()
                  except Exception:b=b""
                  return {"ok":False,"status":e.code,"url":url,"error":str(e),
                          "sha256":hashlib.sha256(b).hexdigest() if b else None,
                          "body":b.decode("utf-8","replace")[:30000]}
              except Exception as e:
                  return {"ok":False,"url":url,"error":repr(e)}

          queries=[
            "active_proposal.proposal_id='287'",
            "active_proposal.proposal_id=287",
            "proposal_result='proposal_passed'",
            "active_proposal.proposal_result='proposal_passed'",
          ]

          jobs=[]
          with ThreadPoolExecutor(max_workers=32) as ex:
              for base in RPCS:
                  for q in queries:
                      u=base.rstrip("/")+"/block_search?"+urllib.parse.urlencode({
                        "query":q,"page":"1","per_page":"100","order_by":"asc"
                      })
                      jobs.append(("block_search",base,q,ex.submit(get,u,12)))
                  # block header range near source-only estimate, never authoritative unless actual headers returned
                  for a,b in [(11800000,11800019),(11840000,11840019),(11880000,11880019),(11920000,11920019)]:
                      u=base.rstrip("/")+"/blockchain?"+urllib.parse.urlencode({"minHeight":a,"maxHeight":b})
                      jobs.append(("blockchain",base,f"{a}-{b}",ex.submit(get,u,12)))

              rows=[]
              for kind,base,q,f in jobs:
                  r=f.result()
                  rec={"kind":kind,"provider":base,"query":q,"ok":r.get("ok"),"status":r.get("status"),
                       "url":r.get("url"),"sha256":r.get("sha256"),"error":r.get("error")}
                  body=r.get("body","")
                  try:
                      d=json.loads(body)
                      rec["json"]=d
                  except Exception:
                      rec["body_excerpt"]=body[:8000]
                  rows.append(rec)

          # Compact candidate extraction. No market fields are requested or parsed.
          candidates=[]
          for r in rows:
              d=r.get("json")
              if not isinstance(d,dict): continue
              res=d.get("result") or {}
              blocks=res.get("blocks") or res.get("block_metas") or []
              if not isinstance(blocks,list): continue
              for b in blocks:
                  try:
                      hdr=((b.get("block") or {}).get("header") or b.get("header") or {})
                      h=hdr.get("height")
                      t=hdr.get("time")
                      hs=(b.get("block_id") or {}).get("hash")
                      if h and t:
                          candidates.append({"provider":r["provider"],"kind":r["kind"],"query":r["query"],
                                             "height":int(h),"time":t,"hash":hs})
                  except Exception:
                      pass

          out={
            "scope":"SOURCE_ONLY_NO_MARKET_DATA",
            "target_voting_end":TARGET,
            "purpose":"Recover immutable governance execution block H via Tendermint event index or historical header range without market data.",
            "tested_utc":datetime.datetime.now(datetime.timezone.utc).isoformat(),
            "queries":queries,
            "rows":rows,
            "candidates":candidates,
          }
          os.makedirs(os.path.dirname(OUT),exist_ok=True)
          with open(OUT,"w",encoding="utf-8") as f: json.dump(out,f,indent=2,ensure_ascii=False)
          print("SCRT287_V28_CANDIDATES",json.dumps(candidates[:50]))
          PY
      - name: Persist event-index receipt
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/cosmos_native_emission_param_shock_001_v0_2/SCRT287_EVENT_INDEX_PROBE_V28.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "SCRT287: persist event-index source probe v28"
          git push origin HEAD:cosmos-native-emission-param-shock-001-v0.2-t0-remediation-2026-10-07
