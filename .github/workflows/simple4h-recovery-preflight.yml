name: simple4h-recovery-preflight

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'research/simple4h/**'
      - '.github/workflows/simple4h-recovery-preflight.yml'

permissions:
  contents: read

jobs:
  inert-preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check numpy pandas scipy
      - name: Compile one-shot runner
        run: python -m py_compile research/simple4h/mve_simple4h_2025_runner_v01.py
      - name: Run protected-data-free self test
        run: python research/simple4h/mve_simple4h_2025_runner_v01.py --self-test
