name: DLS Signed Flow Kamino Same-Tx Census V0.1
on:
  push:
    branches:
      - dls-signed-flow-authority-v01
    paths:
      - labs/DEFI_LIQUIDATION_SHOCK_001/LAUNCH_SIGNED_FLOW_KAMINO_SAME_TX_CENSUS_V01.marker
permissions:
  actions: read
  contents: read
jobs:
  census:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download canonical Kamino partition
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 36264171014
          name: dls-field-enrichment-ks-kamino-202311
          path: event_source
      - name: Compile
        run: python -m py_compile labs/DEFI_LIQUIDATION_SHOCK_001/source/census_signed_flow_kamino_same_tx_v0_1.py
      - name: Execute all-event same-tx census
        run: python labs/DEFI_LIQUIDATION_SHOCK_001/source/census_signed_flow_kamino_same_tx_v0_1.py
      - name: Upload receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dls-signed-flow-kamino-same-tx-census-v01
          path: labs/DEFI_LIQUIDATION_SHOCK_001/SIGNED_FLOW_KAMINO_SAME_TX_PROGRAM_CENSUS_RECEIPT_V0.1.json
          if-no-files-found: warn
          retention-days: 90
      - name: Firewall
        if: always()
        run: echo SOURCE_ONLY_NO_PRICES_2025_2026_CLOSED
