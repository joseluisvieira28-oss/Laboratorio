name: DLS Drift With-Fill Census V0.1
on:
  push:
    branches:
      - dls-signed-flow-authority-v01
    paths:
      - labs/DEFI_LIQUIDATION_SHOCK_001/LAUNCH_DRIFT_WITH_FILL_CENSUS_V01.marker
permissions:
  contents: read
jobs:
  census:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile census
        run: python -m py_compile labs/DEFI_LIQUIDATION_SHOCK_001/source/census_drift_with_fill_v0_1.py
      - name: Execute source-only census
        run: python labs/DEFI_LIQUIDATION_SHOCK_001/source/census_drift_with_fill_v0_1.py
      - name: Upload census receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dls-drift-with-fill-census-v01
          path: |
            labs/DEFI_LIQUIDATION_SHOCK_001/DRIFT_WITH_FILL_CENSUS_RECEIPT_V0.1.json
            labs/DEFI_LIQUIDATION_SHOCK_001/DRIFT_WITH_FILL_CENSUS_V0.1.ndjson
          if-no-files-found: warn
          retention-days: 90
      - name: Firewall
        if: always()
        run: echo SOURCE_ONLY_NO_PRICES_2025_2026_CLOSED
