name: source-t0-probe-v11-atomscan-discovery

on:
  push:
    branches:
      - cosmos-native-emission-param-shock-001-v0.2-t0-remediation-2026-10-07
    paths:
      - .github/workflows/source-t0-probe-v11-atomscan-discovery.yml

permissions:
  contents: read

jobs:
  atomscan-discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Discover ATOMScan public block API
        shell: bash
        run: |
          python3 - <<'PY'
          import re,json,urllib.request,ssl,urllib.parse
          UA={"User-Agent":"Mozilla/5.0 CryptoLab-source-only"}
          base="https://atomscan.com"
          pages=[
            "/secret-network/votes",
            "/secret-network/blocks",
            "/blocks/11880000",
            "/secret-network/blocks/11880000",
          ]
          def get(url,to=12):
            try:
              q=urllib.request.Request(url,headers=UA)
              with urllib.request.urlopen(q,timeout=to,context=ssl._create_unverified_context()) as r:
                return {"ok":True,"status":r.status,"url":r.geturl(),"text":r.read().decode("utf-8","replace")}
            except Exception as e:return {"ok":False,"url":url,"error":repr(e)}
          out={"scope":"SOURCE_ONLY_NO_MARKET_DATA","pages":{},"scripts":{}}
          scripts=[]
          for p in pages:
            x=get(base+p)
            rec={"ok":x["ok"],"status":x.get("status"),"final_url":x.get("url"),"error":x.get("error")}
            if x["ok"]:
              t=x["text"]
              rec["length"]=len(t)
              rec["api_strings"]=sorted(set(re.findall(r'https?://[^"\'<> ]+',t)))[:100]
              ss=re.findall(r'<script[^>]+src=["\']([^"\']+)',t,re.I)
              rec["scripts"]=ss
              for s in ss:
                scripts.append(urllib.parse.urljoin(base,s))
              rec["snippet"]=t[:5000]
            out["pages"][p]=rec
          # inspect unique JS bundles and grep likely API hosts/routes
          for u in list(dict.fromkeys(scripts))[:30]:
            x=get(u,20)
            rec={"ok":x["ok"],"status":x.get("status"),"error":x.get("error")}
            if x["ok"]:
              t=x["text"]
              rec["length"]=len(t)
              pats=[
                r'https?://[A-Za-z0-9._:/?=&%-]+',
                r'["\']([^"\']*(?:block|blocks|api|graphql|secret-network)[^"\']*)["\']'
              ]
              found=[]
              for pat in pats:
                found += re.findall(pat,t,re.I)
              rec["matches"]=list(dict.fromkeys(str(z) for z in found))[:500]
              # Context around relevant strings
              ctx=[]
              for needle in ["api","blocks","blockchain","secret-network","graphql","chainId"]:
                pos=0
                for _ in range(10):
                  pos=t.lower().find(needle.lower(),pos)
                  if pos<0: break
                  ctx.append(t[max(0,pos-250):pos+500])
                  pos+=len(needle)
              rec["contexts"]=ctx[:80]
            out["scripts"][u]=rec
          print("ATOMSCAN_DISCOVERY_V11_BEGIN")
          print(json.dumps(out,indent=2,sort_keys=True)[:900000])
          print("ATOMSCAN_DISCOVERY_V11_END")
          PY
