name: CMM-002 Stablecoin Source Gate V0.1C

on:
  push:
    branches:
      - cmm-002-funding-conditioned-divergence-oos-2025-v0.1
    paths:
      - "cmm002/CMM002_SOURCE_TRANSPORT_REMEDIATION_V01C.md"
      - "cmm002/stablecoin_source_gate_v01c.py"
      - ".github/workflows/cmm002-stablecoin-source-gate-v01c.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cmm002-stablecoin-source-v01c
  cancel-in-progress: false

jobs:
  source-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cmm-002-funding-conditioned-divergence-oos-2025-v0.1
      - name: Run gzip-safe holdout source gate
        id: gate
        continue-on-error: true
        run: python3 cmm002/stablecoin_source_gate_v01c.py
      - name: Preserve source receipt
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cmm002/source_results/CMM002_STABLECOIN_SOURCE_GATE_V01C.json
          git add cmm002/source_results/CMM002_STABLECOIN_SOURCE_GATE_V01C.md
          if ! git diff --cached --quiet; then
            git commit -m "cmm002: record holdout-safe stablecoin source gate v0.1c [skip ci]"
            git push
          fi
      - name: Fail closed
        if: steps.gate.outcome != 'success'
        run: |
          echo "CMM-002 stablecoin source gate V0.1C did not pass. 2025 BTC outcomes remain closed."
          exit 1
