name: Liquidation Reversal Operator Scout

on:
  push:
    branches:
      - "liquidation-reversal-operator-scout-2026-10-07"
    paths:
      - "labs/LIQUIDATION_PRESSURE_002_FORWARD/operator_scout_v01.py"
      - ".github/workflows/liquidation-reversal-operator-scout.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install websockets
      - run: python labs/LIQUIDATION_PRESSURE_002_FORWARD/operator_scout_v01.py
      - uses: actions/upload-artifact@v4
        with:
          name: liquidation-reversal-operator-scout
          path: liquidation_reversal_operator_scout.json
          retention-days: 7
