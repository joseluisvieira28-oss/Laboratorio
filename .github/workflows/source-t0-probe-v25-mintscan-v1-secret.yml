name: source-t0-probe-v25-mintscan-v1-secret

on:
  push:
    branches:
      - cosmos-native-emission-param-shock-001-v0.2-t0-remediation-2026-10-07
    paths:
      - .github/workflows/source-t0-probe-v25-mintscan-v1-secret.yml

permissions:
  contents: read

jobs:
  mintscan-v1-secret:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Probe legacy public Mintscan block metadata endpoint only
        shell: bash
        run: |
          python3 - <<'PY'
          import json,urllib.request,ssl
          from datetime import datetime

          UA={"User-Agent":"Mozilla/5.0 CryptoLab-source-only-v25"}
          TARGET="2023-12-07T02:54:58.930543213Z"
          TT=datetime.fromisoformat(TARGET.replace("Z","+00:00")).timestamp()
          templates=[
            "https://api.mintscan.io/v1/secret/block/secret-4/{h}",
            "https://api.mintscan.io/v1/secret/blocks/secret-4/{h}",
            "https://api.mintscan.io/v1/secret/block/{h}",
            "https://api.mintscan.io/secret/v1/block/secret-4/{h}",
          ]
          def get(u,to=10):
            try:
              q=urllib.request.Request(u,headers=UA)
              with urllib.request.urlopen(q,timeout=to,context=ssl._create_unverified_context()) as r:
                raw=r.read().decode("utf-8","replace")
                try:d=json.loads(raw)
                except:d=raw[:10000]
                return {"ok":True,"status":r.status,"url":r.geturl(),"data":d}
            except Exception as e:return {"ok":False,"url":u,"error":repr(e)[:500]}

          def find_ht(x):
            if isinstance(x,dict):
              # reject market-looking objects outright
              keys={str(k).lower() for k in x.keys()}
              if keys & {"price","market_cap","marketcap","volume_24h","price_usd"}:
                return None
              h=x.get("height") or x.get("block_height") or x.get("blockHeight")
              t=x.get("time") or x.get("timestamp") or x.get("block_time") or x.get("blockTime")
              if h is not None and t is not None:
                try:return int(h),str(t)
                except:pass
              for v in x.values():
                z=find_ht(v)
                if z:return z
            elif isinstance(x,list):
              for v in x:
                z=find_ht(v)
                if z:return z
            return None

          def ts(s):
            try:
              if str(s).isdigit():
                n=int(s); return n/1000 if n>10**12 else n
              return datetime.fromisoformat(str(s).replace("Z","+00:00")).timestamp()
            except:return None

          anchor=11752974
          route_tests=[]
          winner=None
          for tpl in templates:
            r=get(tpl.format(h=anchor))
            z=find_ht(r.get("data"))
            route_tests.append({"template":tpl,"ok":r["ok"],"status":r.get("status"),"error":r.get("error"),
                                "parsed":{"height":z[0],"time":z[1]} if z else None})
            if z and z[0]==anchor and ts(z[1]) is not None and winner is None:
              winner=tpl

          out={"scope":"SOURCE_ONLY_NO_MARKET_DATA","target":TARGET,"route_tests":route_tests,"winner":winner}
          if winner:
            # Broad deterministic bracket around expected Dec-7 height; metadata only.
            grid=[11752974,11800000,11840000,11870000,11885000,11900000,11920000]
            pts=[]
            for h in grid:
              r=get(winner.format(h=h));z=find_ht(r.get("data"))
              if z and z[0]==h and ts(z[1]) is not None:
                pts.append((h,ts(z[1]),z[1]))
            out["grid"]=[{"height":h,"time":t} for h,_,t in pts]
            br=None
            for a,b in zip(pts,pts[1:]):
              if a[1] < TT <= b[1]: br=(a,b);break
            out["bracket"]={"lo":{"height":br[0][0],"time":br[0][2]},
                            "hi":{"height":br[1][0],"time":br[1][2]}} if br else None
            if br:
              L,R=br[0][0],br[1][0];err=None
              while L<R:
                M=(L+R)//2
                r=get(winner.format(h=M));z=find_ht(r.get("data"))
                if not z or z[0]!=M or ts(z[1]) is None:
                  err={"height":M,"ok":r["ok"],"status":r.get("status"),"error":r.get("error")};break
                if ts(z[1])>=TT:R=M
                else:L=M+1
              out["binary_error"]=err
              if err is None:
                H=L;out["H_vote_end_block"]=H;out["neighbors"]=[]
                for h in range(H-2,H+3):
                  r=get(winner.format(h=h));z=find_ht(r.get("data"))
                  out["neighbors"].append({"requested":h,"parsed":{"height":z[0],"time":z[1]} if z else None,
                                           "ok":r["ok"],"status":r.get("status"),"error":r.get("error")})
          print("MINTSCAN_V1_SECRET_V25_BEGIN")
          print(json.dumps(out,indent=2,sort_keys=True))
          print("MINTSCAN_V1_SECRET_V25_END")
          PY
