name: microstructure-maker-fill-model-v01

on:
  push:
    branches:
      - microstructure-scalping-lab-v0.1
    paths:
      - 'research/microstructure_scalping/maker_fill_model_v01.py'
      - 'research/microstructure_scalping/test_maker_fill_model_v01.py'
      - 'research/microstructure_scalping/MAKER_FILL_MODEL_V0_1_PROTOCOL.md'
      - '.github/workflows/microstructure-maker-fill-model-v01.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  maker-fill-model:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest research.microstructure_scalping.test_maker_fill_model_v01 -v
