name: AAVE R1 Global State Diagnostic V0.4.1

on:
  push:
    branches:
      - aave-liquidation-overhang-v0.1
    paths:
      - '.github/workflows/aave-r1-global-state-diagnostic-v041.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  static-transport-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests 'eth-hash[pycryptodome]'
      - name: Compile exact global-state transport lineage
        run: |
          python -m py_compile research/aave_liquidation_overhang/r1_global_state_v01.py
          python -m py_compile research/aave_liquidation_overhang/r1_global_state_v041.py
          python -m py_compile research/aave_liquidation_overhang/r1_global_stream_transport_static_test_v041.py
      - name: Verify frozen V0.4.1 authority
        run: test -f research/aave_liquidation_overhang/AAVE_LIQUIDATION_OVERHANG_001_R1_GLOBAL_STREAM_TRANSPORT_REMEDIATION_V0_4_1.md
      - name: Prove response-body retry semantics
        run: python research/aave_liquidation_overhang/r1_global_stream_transport_static_test_v041.py

  global-state-diagnostic-v041:
    needs: static-transport-preflight
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests 'eth-hash[pycryptodome]'
      - uses: actions/download-artifact@v4
        with:
          name: AAVE_R1_AUDIT_CANONICAL_V0_2E
          run-id: 35378692311
          github-token: ${{ github.token }}
          path: downloaded_r1_audit
      - uses: actions/download-artifact@v4
        with:
          name: AAVE_RECON_R0_BOOTSTRAP
          run-id: 35218275356
          github-token: ${{ github.token }}
          path: downloaded_r0_bootstrap
      - name: Execute V0.4.1 diagnostic-preserving global gate
        run: python research/aave_liquidation_overhang/r1_global_state_v041.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AAVE_R1_GLOBAL_STATE_DIAGNOSTIC_V0_4_1
          path: r1_global_state_output/AAVE_LIQUIDATION_OVERHANG_001_R1_GLOBAL_STATE_V0_1.json
          if-no-files-found: error
          retention-days: 30
