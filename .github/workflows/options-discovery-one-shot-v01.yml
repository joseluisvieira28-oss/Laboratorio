name: OPTIONS-SPOTPERP-001 Discovery One-Shot V0.1

on:
  workflow_dispatch:
    inputs:
      source_gate_run_id:
        description: 'Successful latest-code final Source Gate finalizer run ID'
        required: true
        type: string
      monthly_raw_run_id:
        description: 'Exact completed monthly-equivalent raw acquisition run ID'
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  discovery-one-shot:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout current isolated Options branch
        uses: actions/checkout@v4

      - name: Bind frozen authority and outcome-blind runner tests
        working-directory: Dream-Account-OS-v2.3-PARTIAL/research/options_spotperp_v0_1
        run: |
          echo "HEAD_SHA=$(git rev-parse HEAD)"
          test "${GITHUB_REF_NAME}" = "options-spotperp-v0.1"
          python3 preflight_source_audit.py
          python3 -m py_compile discovery_runner_v01.py test_discovery_runner_v01.py
          python3 test_discovery_runner_v01.py
          echo "DISCOVERY_RUNNER_SHA256=$(sha256sum discovery_runner_v01.py | awk '{print $1}')"
          echo "DISCOVERY_TEST_SHA256=$(sha256sum test_discovery_runner_v01.py | awk '{print $1}')"
          echo 'NO REAL MARKET OUTCOMES OPENED IN PREFLIGHT'

      - name: Verify latest-code final Source Gate run metadata
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_GATE_RUN_ID: ${{ inputs.source_gate_run_id }}
        run: |
          test -n "$SOURCE_GATE_RUN_ID"
          test "$(gh api repos/joseluisvieira28-oss/Laboratorio/actions/runs/$SOURCE_GATE_RUN_ID --jq .head_branch)" = "options-spotperp-v0.1"
          test "$(gh api repos/joseluisvieira28-oss/Laboratorio/actions/runs/$SOURCE_GATE_RUN_ID --jq .path)" = ".github/workflows/options-source-audit-finalize-monthly-raw-v01.yml"
          test "$(gh api repos/joseluisvieira28-oss/Laboratorio/actions/runs/$SOURCE_GATE_RUN_ID --jq .status)" = "completed"
          test "$(gh api repos/joseluisvieira28-oss/Laboratorio/actions/runs/$SOURCE_GATE_RUN_ID --jq .conclusion)" = "success"
          echo "SOURCE_GATE_RUN_ID=$SOURCE_GATE_RUN_ID"

      - name: Verify immutable monthly raw run metadata
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MONTHLY_RAW_RUN_ID: ${{ inputs.monthly_raw_run_id }}
        run: |
          test -n "$MONTHLY_RAW_RUN_ID"
          test "$(gh api repos/joseluisvieira28-oss/Laboratorio/actions/runs/$MONTHLY_RAW_RUN_ID --jq .head_branch)" = "options-spotperp-v0.1"
          test "$(gh api repos/joseluisvieira28-oss/Laboratorio/actions/runs/$MONTHLY_RAW_RUN_ID --jq .path)" = ".github/workflows/options-source-audit-monthly-count10000-v01.yml"
          test "$(gh api repos/joseluisvieira28-oss/Laboratorio/actions/runs/$MONTHLY_RAW_RUN_ID --jq .status)" = "completed"
          test "$(gh api repos/joseluisvieira28-oss/Laboratorio/actions/runs/$MONTHLY_RAW_RUN_ID --jq .conclusion)" = "success"
          echo "MONTHLY_RAW_RUN_ID=$MONTHLY_RAW_RUN_ID"

      - name: Download final latest-code Source Gate package
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: joseluisvieira28-oss/Laboratorio
          run-id: ${{ inputs.source_gate_run_id }}
          name: options-spotperp-001-final-latest-source-gate-${{ inputs.source_gate_run_id }}-1
          path: Dream-Account-OS-v2.3-PARTIAL/research/options_spotperp_v0_1/final_source_gate_data

      - name: Download immutable monthly raw provenance bytes
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: joseluisvieira28-oss/Laboratorio
          run-id: ${{ inputs.monthly_raw_run_id }}
          name: options-spotperp-001-monthly-raw-${{ inputs.monthly_raw_run_id }}-2
          path: Dream-Account-OS-v2.3-PARTIAL/research/options_spotperp_v0_1/source_audit_data

      - name: Download monthly source receipts for immutable raw binding
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: joseluisvieira28-oss/Laboratorio
          run-id: ${{ inputs.monthly_raw_run_id }}
          name: options-spotperp-001-monthly-final-receipts-${{ inputs.monthly_raw_run_id }}-2
          path: Dream-Account-OS-v2.3-PARTIAL/research/options_spotperp_v0_1/source_audit_data

      - name: Bind final Source Gate to exact immutable monthly raw snapshot
        working-directory: Dream-Account-OS-v2.3-PARTIAL/research/options_spotperp_v0_1
        run: |
          python3 - <<'PY'
          import hashlib, json, shutil
          from pathlib import Path

          raw=Path('source_audit_data')
          gate=Path('final_source_gate_data')
          for p in [
              gate/'source_manifest.json',
              gate/'source_audit_report.json',
              gate/'source_gate_calendar_day_reconciled_receipt.json',
              gate/'source_gate_calendar_day_daily_coverage.json',
              raw/'source_manifest.json',
              raw/'source_audit_report.json',
          ]:
              assert p.exists(), p
          assert (raw/'raw').is_dir()
          assert (raw/'raw_binance_btcusdt_1d').is_dir()

          def sha(p):
              return hashlib.sha256(p.read_bytes()).hexdigest()

          assert sha(gate/'source_manifest.json') == sha(raw/'source_manifest.json')
          assert sha(gate/'source_audit_report.json') == sha(raw/'source_audit_report.json')

          manifest=json.loads((raw/'source_manifest.json').read_text())
          report=json.loads((raw/'source_audit_report.json').read_text())
          assert manifest['probe_mode'] is False
          assert manifest['source_fetch_complete'] is True
          assert manifest['holdout_accessed'] is False
          assert manifest['locked_2026_accessed'] is False
          assert report['outcome_metrics_computed'] is False
          assert report['audit']['skew_values_computed'] is False
          assert report['audit']['forward_returns_computed'] is False
          assert report['audit']['pnl_computed'] is False

          r=json.loads((gate/'source_gate_calendar_day_reconciled_receipt.json').read_text())
          assert r['status']=='SOURCE_AUDIT_PASS', r['status']
          assert r['authority']['authority_sha256']=='138cee737d75d27b43d9f377fc9a77e823e8fb2015f360b300cdc4a16cf67cfa'
          assert r['skew_values_computed'] is False
          assert r['signals_computed'] is False
          assert r['forward_returns_computed'] is False
          assert r['pnl_computed'] is False
          assert r['holdout_2025_accessed'] is False
          assert r['year_2026_accessed'] is False
          cov=r['calendar_day_coverage_audit']
          assert cov['coverage_pass'] is True
          assert int(cov['valid_signal_coverage_days']) >= 500
          daily=gate/'source_gate_calendar_day_daily_coverage.json'
          daily_sha=sha(daily)
          assert daily_sha==cov['daily_coverage_sha256'],(daily_sha,cov['daily_coverage_sha256'])
          assert cov['daily_coverage_rows']==1371
          assert cov['daily_coverage_contains_outcomes'] is False
          assert r['btc_price_audit']['exact_discovery_cutoff_verified'] is True

          shutil.copy2(gate/'source_gate_calendar_day_reconciled_receipt.json', raw/'source_gate_calendar_day_reconciled_receipt.json')
          shutil.copy2(gate/'source_gate_calendar_day_daily_coverage.json', raw/'source_gate_calendar_day_daily_coverage.json')
          field_guard=gate/'source_gate_required_field_guard_receipt.json'
          if field_guard.exists():
              shutil.copy2(field_guard, raw/'source_gate_required_field_guard_receipt.json')

          print('DISCOVERY_AUTHORIZATION_GATE_PASS')
          print('SOURCE_VALID_DAYS=',cov['valid_signal_coverage_days'])
          print('DAILY_COVERAGE_SHA256=',daily_sha)
          print('MONTHLY_RAW_BOUND_TO_LATEST_FINAL_GATE=true')
          print('2025 LOCKED / 2026 LOCKED')
          PY

      - name: Execute frozen Discovery exactly once
        id: discovery
        working-directory: Dream-Account-OS-v2.3-PARTIAL/research/options_spotperp_v0_1
        shell: bash
        run: |
          rm -rf discovery_output
          set +e
          python3 discovery_runner_v01.py --source-root source_audit_data --output discovery_output
          rc=$?
          set -e
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          echo "DISCOVERY_EXIT_CODE=$rc"
          test "$rc" -eq 0 -o "$rc" -eq 3

      - name: Validate scientific closeout and protected-period firewalls
        working-directory: Dream-Account-OS-v2.3-PARTIAL/research/options_spotperp_v0_1
        env:
          DISCOVERY_RC: ${{ steps.discovery.outputs.rc }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          rc=int(os.environ['DISCOVERY_RC'])
          p=Path('discovery_output/OPTIONS_SPOTPERP_001_DISCOVERY_CLOSEOUT_V01.json')
          x=json.loads(p.read_text())
          assert x['authority_sha256']=='138cee737d75d27b43d9f377fc9a77e823e8fb2015f360b300cdc4a16cf67cfa'
          assert x['discovery_window']=={'start':'2021-04-01','end':'2024-12-31'}
          assert x['holdout_2025_accessed'] is False
          assert x['year_2026_accessed'] is False
          assert x['live_trading_authorized'] is False
          assert x['exchange_mutation_authorized'] is False
          if rc==0:
              assert x['classification']=='MVE0_PASS' and x['mve0_pass'] is True
          elif rc==3:
              assert x['classification']=='DISCOVERY_FAIL_NO_PROMOTION' and x['mve0_pass'] is False
          else:
              raise AssertionError(rc)
          assert Path('discovery_output/OPTIONS_SPOTPERP_001_DISCOVERY_LEDGER_V01.csv').exists()
          print('SCIENTIFIC_CLASSIFICATION=',x['classification'])
          print('EVALUABLE_VALID_SIGNAL_DAYS=',x['evaluable_valid_signal_days'])
          print('REGRESSION=',x['regression'])
          print('BASE_10BPS=',x['base_10bps'])
          print('STRESS_20BPS=',x['stress_20bps'])
          print('YEARS_NONNEGATIVE=',x['years_nonnegative_net_mean_10bps'])
          print('GATES=',x['gates'])
          print('2025 UNOPENED / 2026 LOCKED / NO LIVE TRADING')
          PY

      - name: Upload immutable Discovery closeout
        uses: actions/upload-artifact@v4
        with:
          name: options-spotperp-001-discovery-v01-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            Dream-Account-OS-v2.3-PARTIAL/research/options_spotperp_v0_1/discovery_output/OPTIONS_SPOTPERP_001_DISCOVERY_CLOSEOUT_V01.json
            Dream-Account-OS-v2.3-PARTIAL/research/options_spotperp_v0_1/discovery_output/OPTIONS_SPOTPERP_001_DISCOVERY_LEDGER_V01.csv
          if-no-files-found: error
          retention-days: 90

      - name: Governance closeout
        run: |
          echo 'DISCOVERY 2021-2024 ONE-SHOT ONLY'
          echo 'LATEST-CODE FINAL SOURCE GATE + EXACT MONTHLY RAW REQUIRED'
          echo 'NO 2025 / NO 2026 / NO LIVE TRADING / NO EXCHANGE MUTATION'
          echo 'NO PARAMETER RESCUE / NO SUBPERIOD RESCUE'
          echo 'SCIENTIFIC FAIL IS A VALID COMPLETED EXECUTION'
