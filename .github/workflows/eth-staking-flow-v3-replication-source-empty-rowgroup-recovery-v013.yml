name: ETH Staking Flow 001 — V3 Replication Source Empty Rowgroup Recovery V0.1.3

on:
  push:
    branches:
      - eth-staking-flow-v0.3-discovery
    paths:
      - 'research/eth_staking_flow/V3_REPLICATION_SOURCE_EMPTY_ROWGROUP_RECOVERY_TRIGGER_V0_1_3.txt'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  ORIGINAL_RUN_ID: '35387477455'

jobs:
  freeze-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Bind exact source and recovery bytes
        run: |
          test "$(git hash-object research/eth_staking_flow/xatu_v3_replication_queue_shard_v01.py)" = "b6892737a9a9914faa86cec206389432352f466e"
          test "$(git hash-object research/eth_staking_flow/xatu_v3_replication_queue_aggregate_v01.py)" = "930390961b446f51592e68845469ea1320d55527"
          test "$(git hash-object research/eth_staking_flow/xatu_v3_replication_queue_shard_v012.py)" = "d31d9a45cdf0774f5a61f115812e35b4c0a08008"
          test "$(git hash-object research/eth_staking_flow/xatu_v3_replication_queue_aggregate_v012.py)" = "31ae8a6e74e2f112e8e9e015ebe05f6c92deb388"
          test "$(git hash-object research/eth_staking_flow/xatu_v3_replication_queue_shard_v013.py)" = "c0f73df09ce068c9e1a8ecd6eb5ac3c8c779e507"
          test "$(git hash-object research/eth_staking_flow/xatu_v3_replication_queue_aggregate_v013.py)" = "69d44caab9e08a625663220713d703bb4906734a"
          test "$(git hash-object research/eth_staking_flow/ETH_STAKING_FLOW_001_V3_REPLICATION_SOURCE_EMPTY_ROWGROUP_FALLBACK_V0_1_3.md)" = "72a1f3cd41c13ff7cec9798f1f82a2ebde490e3a"
          test "$(git hash-object research/eth_staking_flow/ETH_STAKING_FLOW_001_V3_INDEPENDENT_REPLICATION_AUTHORITY_V0_1.md)" = "06a1044b5c1212fc9314b3644e68223b86cfc227"
          python -m py_compile research/eth_staking_flow/xatu_v3_replication_queue_shard_v013.py
          python -m py_compile research/eth_staking_flow/xatu_v3_replication_queue_aggregate_v013.py
          echo ETH_V3_EMPTY_ROWGROUP_RECOVERY_BIND_PASS

  equivalence-qa:
    needs: freeze-guard
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact source dependencies
        run: pip install --disable-pip-version-check pyarrow fsspec aiohttp
      - name: Preserve V0.1.2 semantic equivalence controls
        run: |
          python - <<'PY'
          import importlib.util
          from datetime import date
          from pathlib import Path
          p=Path('research/eth_staking_flow/xatu_v3_replication_queue_shard_v012.py')
          spec=importlib.util.spec_from_file_location('v012',p)
          m=importlib.util.module_from_spec(spec)
          spec.loader.exec_module(m)
          controls=[date(2025,2,24),date(2025,3,2),date(2025,10,17)]
          rows=[m.equivalence_payload(d) for d in controls]
          assert all(x['pass'] and not x['mismatch'] for x in rows),rows
          print('ETH_V3_V013_EQUIVALENCE_CONTROLS_PASS')
          PY

  recover-months:
    needs: equivalence-qa
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard_id: "202502"
            shard_start: "2025-02-01"
            shard_end: "2025-02-28"
          - shard_id: "202503"
            shard_start: "2025-03-01"
            shard_end: "2025-03-31"
          - shard_id: "202510"
            shard_start: "2025-10-01"
            shard_end: "2025-10-31"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact source dependencies
        run: pip install --disable-pip-version-check pyarrow fsspec aiohttp
      - name: Recover exact frozen month with empty-rowgroup remediation only
        env:
          SHARD_ID: ${{ matrix.shard_id }}
          SHARD_START: ${{ matrix.shard_start }}
          SHARD_END: ${{ matrix.shard_end }}
        run: python research/eth_staking_flow/xatu_v3_replication_queue_shard_v013.py
      - name: Enforce exact fallback-day identity and pass
        if: always()
        env:
          SHARD_ID: ${{ matrix.shard_id }}
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          sid=os.environ['SHARD_ID']
          expected={
            '202502':{'2025-02-25','2025-02-26','2025-02-27','2025-02-28'},
            '202503':{'2025-03-01'},
            '202510':{'2025-10-18','2025-10-19'},
          }[sid]
          p=Path('xatu_v3_replication_shards')/f'queue_rep_{sid}.json'
          assert p.exists(),p
          x=json.loads(p.read_text())
          got={r['date'] for r in x.get('daily_source_records') or [] if r.get('timestamp_locator')=='COLUMN_VALUE_FALLBACK_NO_ROWGROUP_STATS'}
          assert got==expected,(sid,got,expected)
          assert x['classification']=='SHARD_PASS',(sid,x['classification'],x.get('errors'))
          d=x.get('empty_rowgroup_fallback_v013') or {}
          assert int(d.get('empty_rowgroups_skipped',0)) > 0,(sid,d)
          assert d.get('scientific_rule_changed') is False
          print('ETH_V3_EMPTY_ROWGROUP_RECOVERY_SHARD_PASS',sid,sorted(got),d['empty_rowgroups_skipped'])
          PY
      - name: Upload V0.1.3 recovery shard receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ETH_V3_REP_EMPTY_ROWGROUP_RECOVERY_${{ matrix.shard_id }}
          path: xatu_v3_replication_shards/queue_rep_${{ matrix.shard_id }}.json
          if-no-files-found: error
          retention-days: 30

  aggregate:
    if: always() && needs.freeze-guard.result == 'success' && needs.equivalence-qa.result == 'success'
    needs:
      - freeze-guard
      - equivalence-qa
      - recover-months
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Download original 20 source shard receipts
        uses: actions/download-artifact@v4
        with:
          pattern: ETH_V3_REP_SOURCE_*
          path: downloaded_original
          merge-multiple: true
          run-id: ${{ env.ORIGINAL_RUN_ID }}
          github-token: ${{ github.token }}
      - name: Download three V0.1.3 recovery receipts
        uses: actions/download-artifact@v4
        with:
          pattern: ETH_V3_REP_EMPTY_ROWGROUP_RECOVERY_*
          path: downloaded_recovery
          merge-multiple: true
      - name: Assemble exact 17 original passes plus 3 V0.1.3 recovered shards
        run: |
          python - <<'PY'
          import json,shutil
          from pathlib import Path
          recovered={'202502','202503','202510'}
          dst=Path('downloaded_replication_shards')
          dst.mkdir(parents=True,exist_ok=True)
          originals={}
          for p in Path('downloaded_original').rglob('queue_rep_*.json'):
              x=json.loads(p.read_text())
              originals[str(x.get('shard_id'))]=(p,x)
          assert len(originals)==20,sorted(originals)
          for sid,(p,x) in originals.items():
              if sid in recovered:
                  assert x.get('classification')=='SOURCE_ACQUISITION_TECHNICAL_FAILURE',(sid,x.get('classification'))
                  continue
              assert x.get('classification')=='SHARD_PASS',(sid,x.get('classification'))
              shutil.copy2(p,dst/p.name)
          recovery={}
          for p in Path('downloaded_recovery').rglob('queue_rep_*.json'):
              x=json.loads(p.read_text())
              recovery[str(x.get('shard_id'))]=(p,x)
          assert set(recovery)==recovered,(set(recovery),recovered)
          for sid,(p,x) in recovery.items():
              assert x.get('classification')=='SHARD_PASS',(sid,x.get('classification'),x.get('errors'))
              shutil.copy2(p,dst/p.name)
          final=list(dst.glob('queue_rep_*.json'))
          assert len(final)==20,len(final)
          print('ETH_V3_EMPTY_ROWGROUP_RECOVERY_ASSEMBLY_PASS',len(final))
          PY
      - name: Run unchanged aggregate with V0.1.3 lineage
        run: python research/eth_staking_flow/xatu_v3_replication_queue_aggregate_v013.py
      - name: Enforce source-only firewall
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('xatu_v3_replication_output/ETH_STAKING_FLOW_001_V3_REPLICATION_SOURCE_V0_1.json')
          assert p.exists(),'V0.1.3 aggregate receipt missing'
          x=json.loads(p.read_text())
          assert x['signal_evaluated'] is False
          assert x['market_prices_opened'] is False
          assert x['returns_opened'] is False
          assert x['pnl_opened'] is False
          assert x['source_cutoff_2026']=='2026-08-31'
          print('ETH_V3_EMPTY_ROWGROUP_RECOVERY_FIREWALL_PASS',x['classification'])
          PY
      - name: Upload canonical V0.1.3 source receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ETH_STAKING_FLOW_001_V3_REPLICATION_SOURCE_V0_1_3
          path: xatu_v3_replication_output/ETH_STAKING_FLOW_001_V3_REPLICATION_SOURCE_V0_1.json
          if-no-files-found: error
          retention-days: 30
