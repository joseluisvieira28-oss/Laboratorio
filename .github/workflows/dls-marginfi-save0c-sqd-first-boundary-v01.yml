name: DLS Marginfi Save0c SQD First Boundary V0.1

on:
  push:
    branches:
      - dls-marginfi-save0c-sqd-boundary-v01
    paths:
      - .github/workflows/dls-marginfi-save0c-sqd-first-boundary-v01.yml

permissions:
  contents: read

jobs:
  earliest-partition:
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - protocol: marginfi
            start: '2023-02-07T15:47:04Z'
            end: '2023-03-01T00:00:00Z'
            id: marginfi-202302
          - protocol: save0c
            start: '2021-12-08T00:00:00Z'
            end: '2022-01-01T00:00:00Z'
            id: save0c-202112
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile frozen source runner
        run: python -m py_compile labs/DEFI_LIQUIDATION_SHOCK_001/source/run_sqd_first_success_partition_v0_1.py
      - name: Run earliest frozen partition
        run: python labs/DEFI_LIQUIDATION_SHOCK_001/source/run_sqd_first_success_partition_v0_1.py --protocol "${{ matrix.protocol }}" --start "${{ matrix.start }}" --end "${{ matrix.end }}" --out "boundary/${{ matrix.id }}.json"
      - name: Upload source evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dls-sqd-first-boundary-${{ matrix.id }}
          path: boundary/${{ matrix.id }}.json
          if-no-files-found: error
          retention-days: 30
      - name: Firewall
        if: always()
        run: |
          echo SOURCE_ONLY_TRUE
          echo PRICES_FALSE
          echo RETURNS_FALSE
          echo PNL_FALSE
          echo DIRECTION_FALSE
          echo ECONOMIC_OUTCOMES_FALSE
          echo LIVE_TRADING_FALSE
          echo MERGE_MAIN_FALSE
