name: STABLECOIN-EXCHANGE-FLOW-001 MEV Blocker Batch Gate V0.1

on:
  push:
    branches: [ stablecoin-exchange-flow-v0.1 ]
    paths:
      - 'labs/STABLECOIN_EXCHANGE_FLOW_001/mevblocker_batch_gate_v01.py'
      - '.github/workflows/stablecoin-exchange-flow-mevblocker-batch-gate-v01.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  batch-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python -m py_compile labs/STABLECOIN_EXCHANGE_FLOW_001/mevblocker_batch_gate_v01.py
      - run: python labs/STABLECOIN_EXCHANGE_FLOW_001/mevblocker_batch_gate_v01.py
      - uses: actions/upload-artifact@v4
        with:
          name: stablecoin-exchange-flow-001-mevblocker-batch-gate-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/stablecoin_exchange_flow_mevblocker_batch_gate_v01/
          retention-days: 90
