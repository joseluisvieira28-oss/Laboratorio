name: CBBTC-001 continuation BlockMachine V0.1M

on:
  push:
    branches:
      - cbbtc-eth-mint-burn-flow-001-source-gate-v01
    paths:
      - 'research/cbbtc_eth_mint_burn_flow_001/CONTINUATION_BLOCKMACHINE_TRIGGER_V0.1M.md'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cbbtc-continuation-blockmachine-v01m
  cancel-in-progress: true

jobs:
  attack:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm install --no-save ethers@6.15.0
      - id: chain
        name: Execute frozen Gate 2 through Gate 5
        continue-on-error: true
        env:
          ETH_RPC_URL: https://rpc-eth.blockmachine.io
          ETH_ARCHIVE_RPC_URL: https://rpc-eth.blockmachine.io
        run: python research/cbbtc_eth_mint_burn_flow_001/cbbtc_continue_v01.py
      - name: Finalize terminal or post-Discovery status
        if: always()
        continue-on-error: true
        run: python research/cbbtc_eth_mint_burn_flow_001/cbbtc_finalize_continuation_v01.py
      - name: Persist durable evidence
        if: always()
        shell: bash
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin cbbtc-eth-mint-burn-flow-001-source-gate-v01
          git rebase origin/cbbtc-eth-mint-burn-flow-001-source-gate-v01 || true
          git add research/cbbtc_eth_mint_burn_flow_001/FLOW_*.json                   research/cbbtc_eth_mint_burn_flow_001/DISCOVERY_*.json                   research/cbbtc_eth_mint_burn_flow_001/DAILY_FLOW_V0.1.json                   research/cbbtc_eth_mint_burn_flow_001/FLOW_LEDGER_V0.1.json                   research/cbbtc_eth_mint_burn_flow_001/CLOSEOUT_*.json                   research/cbbtc_eth_mint_burn_flow_001/CLOSEOUT_*.md 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No new durable evidence."
          else
            git commit -m "CBBTC-001: persist BlockMachine continuation evidence [skip ci]"
            git push origin HEAD:cbbtc-eth-mint-burn-flow-001-source-gate-v01
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cbbtc-continuation-blockmachine-v01m
          path: |
            artifacts/cbbtc_continuation_manifest_v01.json
            artifacts/census/*
            research/cbbtc_eth_mint_burn_flow_001/FLOW_STATE_CALIBRATION_RECEIPT_V0.1.json
            research/cbbtc_eth_mint_burn_flow_001/DISCOVERY_FLOW_PREDICTOR_SAMPLE_RECEIPT_V0.1.json
            research/cbbtc_eth_mint_burn_flow_001/DISCOVERY_FLOW_PREDICTOR_SAMPLE_ROWS_V0.1.json
            research/cbbtc_eth_mint_burn_flow_001/FLOW_DISCOVERY_RESULT_V0.1.json
            research/cbbtc_eth_mint_burn_flow_001/CLOSEOUT_RECEIPT_V0.1.json
          if-no-files-found: warn
      - name: Preserve fail-closed blockers
        if: ${{ steps.chain.outcome == 'failure' }}
        run: exit 2
