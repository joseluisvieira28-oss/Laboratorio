name: MEXC Event Futures Route Map V0.13

on:
  push:
    branches:
      - mexc-event-futures-route-map-v0.13-2026-10-02
    paths:
      - 'research/mexc_event_futures/**'
      - '.github/workflows/mexc-event-futures-route-map-v013.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  route-map:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install --upgrade pip playwright
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Syntax check
        run: python -m py_compile research/mexc_event_futures/route_map_v013.py
      - name: Map public Event Futures routes
        run: python research/mexc_event_futures/route_map_v013.py
      - name: Verify boundary
        shell: bash
        run: |
          python - <<'PY'
          import json
          j=json.load(open('artifacts/mexc_event_futures/route_map_v013.json',encoding='utf-8'))
          assert j['authenticated_requests']==0
          assert j['orders']==0
          assert j['account_mutations']==0
          print('BOUNDARY=PASS')
          print('VERDICT='+j['verdict'])
          PY
      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: mexc-event-futures-route-map-v013-evidence
          path: artifacts/mexc_event_futures/route_map_v013.json
          if-no-files-found: error
