name: POB Kalshi Book Schema Diagnostic

on:
  pull_request:
    branches: [main]
    paths:
      - 'research/prediction_oracle_basis/source_probe_kalshi_book_schema.py'
      - '.github/workflows/prediction_oracle_basis_kalshi_book_schema.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  schema-only:
    if: github.head_ref == 'prediction-oracle-basis-v0.1' || github.ref_name == 'prediction-oracle-basis-v0.1'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Inspect Kalshi order-book schema only
        run: python research/prediction_oracle_basis/source_probe_kalshi_book_schema.py
