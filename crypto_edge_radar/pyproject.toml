[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "crypto-edge-radar"
version = "0.5.0"
description = "Fail-closed, shadow-only market radar for prospectively promoted Crypto Lab strategies"
requires-python = ">=3.11"
dependencies = ["psycopg[binary]>=3.2,<4"]

[tool.setuptools.packages.find]
include = ["radar*"]
