[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "crypto-edge-radar"
version = "0.7.0"
description = "Fail-closed MEXC control room and durable Crypto Lab radar"
requires-python = ">=3.11"
dependencies = ["psycopg[binary]>=3.2,<4", "websockets>=15,<16", "numpy>=2,<3", "pandas>=2.2,<3"]

[tool.setuptools.packages.find]
include = ["radar*"]
